const CARDS_CH25 = [
  { m: '25A', q: '儿童上呼吸道的解剖生理特点？', a: '以环状软骨下缘为界分为上、下呼吸道；上呼吸道包括鼻腔、鼻旁窦、咽及耳咽管、喉；\n鼻：婴幼儿无鼻毛、鼻黏膜柔弱富于血管，感染时充血肿胀易致鼻塞呼吸困难；黎氏区（鼻中隔前下动脉丛）为鼻出血好发部位；新生儿至6个月主要用鼻呼吸；鼻黏膜溶菌酶、干扰素、分泌性IgA参与清洁保护，分泌物pH 5.5~6.5不利于细菌生长；\n鼻窦：四对（上颌窦、筛窦、额窦、蝶窦），与鼻腔相通；\n咽鼓管：婴幼儿短而宽，咽部感染易逆行入鼓室引起中耳炎；咽鼓管开放功能与表面活性物质有关，其分泌不足是咽鼓管功能障碍的重要机制；\n扁桃体：腺样体（咽扁桃体）6~12个月发育，肥大可堵塞鼻孔，是儿童阻塞性睡眠呼吸暂停的重要原因；腭扁桃体1岁末渐增大，4~10岁达高峰，是咽峡炎高发期；\n喉：新生儿喉位置高，声门相当于颈椎3~4水平（成人颈椎5~6），6岁降至第5颈椎；婴儿喉呈漏斗形，环状软骨包裹卵圆形空间，入口大出口小，出口是喉最狭窄部位（成人最狭窄在声门）→过去6岁以下插管多用不带套囊导管；声门下区组织疏松，炎症时易水肿引起喉梗阻。' },
  { m: '25A', q: '下呼吸道分级与特点？', a: '下呼吸道共23级，分三区：\n传导区（1~16级）：气管、支气管、细支气管，专司气体传导；\n移行区（17~19级）：呼吸性细支气管，细支气管向肺泡过渡；\n呼吸区（20~23级）：肺泡管、肺泡囊，终末呼吸细支气管至少分40个肺泡管和肺泡囊；\n右主支气管短而宽、与轴线偏斜小（约30°~36°），似气管直接延续→气管插管易滑入右侧、支气管异物右侧多见；\n气管分叉新生儿在第3~4胸椎（成人第5胸椎下缘）；新生儿气管长度3.5~5cm；\n直径小于2mm的小气道阻力仅占呼吸道阻力1/10，但儿童外周气道阻力偏高（气道口径与身高相关）→婴幼儿毛细支气管炎小气道阻塞是阻力增加主因；\n无效腔/潮气量比例：成人0.3、新生儿0.4、早产儿0.5→新生儿呼吸效率低；肺泡孔在婴幼儿2岁后才出现，新生儿无侧支通气；\n纤毛上皮占气道黏膜上皮90%；小气道杯状细胞被Clara细胞取代，后者分泌肺表面活性物质蛋白A、B、D，有祖细胞功能（气道损伤时可分化为纤毛上皮或肺Ⅱ型上皮）。' },
  { m: '25A', q: '肺的发育分期及关键时间点？', a: '产前发育：\n胚胎期（4~7周）：妊娠26~28天前原肠内胚层出现原始气道（肺芽），很快分为左右总支气管，肺段支气管在5~6周建立；\n胎儿期四期：\n①假性腺期（5~17周）：肺组织切片似腺泡得名；16周所有传导区气道均已出现，此后只有长度管径增长；此期末原始气道与前原肠分离，分离不全形成气管食管瘘；\n②成管期（16~26周）：支气管分支延长形成呼吸管道，出现Ⅱ型细胞特点细胞及肺腺泡基本结构；\n③成囊期（24~38周）：末端呼吸道加宽形成肺泡小囊，间质减少囊壁变薄，29~32周开始形成肺泡；足月儿肺泡面积从1~2m²增至3~4m²；\n④肺泡期（36周~）：出现有完整毛细血管结构的肺泡；\n关键时间点：妊娠34周后胎儿呼吸道内液体才出现肺表面活性物质（肺泡Ⅱ型细胞分泌）；肺泡成熟受内分泌控制（甲状腺素促进肺泡分隔）；\n不良影响：膈疝、羊水过少、胎儿呼吸停止（脊髓病变）→肺发育不良；\n生后发育：新生儿肺重40g，6个月增加1倍；肺泡发育2岁前完成；肺泡面积8岁32m²、成人75m²；肺泡间隔和微血管成熟可持续到21岁。' },
  { m: '25A', q: '儿童呼吸生理特点（频率、代谢、FRC）？', a: '儿童肺容量相对较小：按体表面积计肺容量是成人1/6，1岁内潮气量平均42ml（约为成人1/12），而按体表面积计1岁儿能代谢为成人1.6倍→呼吸功能不全时易缺氧；\n呼吸频率：年龄越小越快——出生~1岁30次/min（新生儿40~44次），1~3岁24次，4~7岁22次，8~14岁20次；RR增快是儿童肺炎常见表现；\n代偿方式：只能采取浅快呼吸（耗能最少），肺炎时婴幼儿代偿性通气量增加最多不过2.5倍→易发生呼吸衰竭；\nFRC（功能残气量）：由肺和胸壁静态压力平衡决定；婴儿胸壁顺应性高（柔软）、肺顺应性小，FRC相对小——成人FRC在肺总量30%处，新生儿仅在10%处→易发生气道关闭、氧储备低而氧耗高→易出现氧供不足；2岁时胸壁顺应性与肺顺应性相似达成人水平；\n呼吸肌：耐疲劳肌纤维早产儿不到10%、足月儿30%、1岁达成人水平50%~60%→小婴儿呼吸负担增加时易呼吸肌疲劳；婴儿横膈呈横位，收缩时易将肋骨拉向内→胸廓内陷，呼吸效率低；\n呼吸型式：婴儿呈腹（膈）式呼吸，2岁后出现胸腹式呼吸；\n顺应性分级（实测/预计值）：≥80%正常，60%~79%轻度下降，40%~59%中度下降，≤39%重度下降。' },
  { m: '25A', q: '呼吸力学要点（弹性阻力、气道阻力、时间常数）？', a: '弹性阻力：肺弹力来自弹力纤维+肺泡表面张力（低肺容量时表面张力为主）；顺应性=容积改变/压力改变（C=V/ΔP），顺应性越大弹性越小；1/C总=1/C肺+1/C胸壁；比顺应性（顺应性/FRC）各年龄相近约400~600ml/(kPa·L)；\n气道阻力：R=ΔP/F，层流时R与气道半径4次方成反比→半径减半阻力增加16倍；小气道总横截面积大，阻力仅占总阻力20%左右，但儿童外周气道阻力比例较大；\n呼吸功：正常时消耗于弹性阻力约65%、非弹性阻力约35%；顺应性减低时机体采取浅快呼吸，气道阻力增加时采取深慢呼吸；\n时间常数=顺应性×阻力：1个时间常数63%潮气量进入肺内，3个95%，完全进出需5个；机械通气吸气时间应为时间常数3~5倍；肺透明膜病顺应性低、时间常数短，吸气时间宜短（0.3~0.5秒），过长反致人机对抗；病变肺泡时间常数增大形成慢肺泡，呼气时间不足可致气体滞留；\nIOS脉冲振荡：R5代表总气道阻力，R20中心气道阻力，R5-R20外周气道阻力，X5外周弹性阻力，Fres共振频率；Fres成人7~12Hz，儿童3岁可高达24Hz、14岁接近成人；适用于学龄前儿童。' },
  { m: '25A', q: '肺表面活性物质（PS）的成分、作用及相关疾病？', a: '成分：复合磷脂，含85%~90%磷脂、8%~10%蛋白质、5%中性脂肪；磷脂中起作用最重要的是二棕榈酰磷脂酰胆碱（DPPC）；磷脂酰肌醇和磷脂酰甘油是胎儿肺发育成熟的重要标志；蛋白4种：SP-A、SP-B、SP-C、SP-D，SP-B和SP-C促进磷脂吸附分布功能最强（SP-B更强），SP-A、SP-D与肺防御功能有关；\n作用：①低肺容量时降低肺泡表面张力，保持肺泡稳定防止肺不张，减少呼吸功；②防止气道膜塌陷、阻止远端支气管内液体聚集；③减少毛细血管液体向肺泡渗出，防止肺水肿；④防御功能（促进巨噬细胞杀伤微生物）；\nPS不足相关疾病：\n①RDS（呼吸窘迫综合征）：多见于早产儿，Ⅱ型细胞发育不成熟不能分泌足够PS；\n②ARDS：肺Ⅱ型细胞损伤，PS分泌减少、成分改变、活性降低（渗出的纤维蛋白降解产物、纤维蛋白原、球蛋白、白蛋白依次抑制PS，抑制可逆、与PS浓度竞争）；\n③肺炎：蛋白渗出抑制PS，缺氧及炎症损伤Ⅱ型细胞；\n④胎粪吸入综合征（MAS）：足月儿及过期产儿多见，胎粪抑制PS活性，使胸肺总顺应性明显下降。' },
  { m: '25A', q: '血气分析各项指标的正常值与意义？', a: '新生儿血气：出生~12小时pH 7.317、PCO₂ 5.4kPa(40.6mmHg)、PO₂ 7.7kPa(58mmHg)、BE -5.4；12小时后渐恢复正常；出生12小时内可有不同程度代谢性+呼吸性酸中毒及低氧血症（混合性酸中毒、窒息样血气改变）；脐静脉血PO₂均值仅3.9kPa(29.2mmHg)；\nPO₂（血氧分压）：反映肺脏换气功能；正常成人动脉10.6~13.3kPa(80~100mmHg)，婴幼儿约9.3kPa(70mmHg)，7岁后渐达成人；通常PO₂低于8.0kPa(60mmHg)才有明显不利临床影响；\nPCO₂：衡量肺泡通气量的重要指标；婴幼儿偏低（平均4.6kPa/35mmHg，肾功能差、HCO₃⁻低代偿），18岁后达成人5.3kPa(40mmHg)；PCO₂增高=肺泡通气不足（呼吸性酸中毒或代碱代偿），降低=通气过度（呼吸性碱中毒或代酸代偿）；\npH：正常7.35~7.45，由PCO₂及HCO₃⁻决定；反映包括机体调节在内的最终结果，血气分析中最应重视；严重酸中毒pH<7.20干扰细胞代谢及心脑功能，应紧急处理；\nSO₂（血氧饱和度）：成人动脉约96%，婴幼儿93%~95%，与氧解离曲线有关；\nBE（剩余碱）/HCO₃⁻：意义与碳酸氢根相似；\n三项直接测定指标：PO₂、PCO₂、pH，其余为间接计算。' },
  { m: '25A', q: '通气功能障碍与换气功能障碍的分类及血气指标？', a: '通气功能障碍：\n阻塞性：胸外气道梗阻（咽后脓肿、后鼻孔闭锁）→吸气困难、吸气喘鸣、矛盾呼吸（儿童越年幼胸壁越软越明显）；胸内-肺外及肺内气道梗阻（血管环、哮喘、毛细支气管炎）→呼气困难、呼气延长、呼气哮鸣；\n限制性：肺实质病变（肺炎、肺气肿、肺大疱、肺不张、间质病变）及胸廓胸腔病变（膈疝、肋骨骨折、气胸）；MEFV曲线变窄、VC/RV/FRC/TLC均下降；\n呼吸泵异常：中枢（感染、中毒、外伤、肿瘤脑水肿脑疝）、外周神经（多发性神经根炎呼吸肌麻痹）、呼吸肌痉挛（惊厥）；\n换气功能障碍血气指标：\n①肺泡动脉氧分压差P(A-a)O₂：正常0.7~2.0kPa(5~15mmHg)，正常儿童上限3.99kPa(30mmHg)；增大提示换气障碍，比PaO₂敏感；\n②氧合指数OI：自主呼吸OI=PaO₂/FiO₂（P/F），S/F=SpO₂/FiO₂；机械通气OI=FiO₂×平均气道压×100/PaO₂；CPAP≥5cmH₂O时OI≤300mmHg或S/F≤264为诊断儿童ARDS（PARDS）标准之一；4≤OI<8轻度、8≤OI<16中度、OI≥16重度PARDS；\n肺内分流：流经肺内未经气体交换的血与动脉化血混合（静动脉血混合），正常<心排血量2%，重症婴儿肺炎可达30%~50%；因分流增加的PaO₂下降难于用提高吸氧浓度解决。' },
  { m: '25A', q: '呼吸暂停的类型及早产儿呼吸暂停的诊断？', a: '类型：中枢型（胸廓运动和气流均消失）、阻塞型（有胸廓运动无气流）、混合型；确诊需多导睡眠图（polysomnography）；诊断标准随年龄不同，超过同年龄平均呼吸间隔时间3个标准差视为呼吸暂停；\n足月儿：以中枢性为主、时程短；阻塞性/混合性生后2~7周发生较多，男孩多于女孩；母亲吸烟增加儿童阻塞性呼吸暂停概率和时程；\n早产儿：很常见；呼吸停止≥20秒诊断为呼吸暂停；不足20秒但伴发绀、苍白、心动过缓、低张力亦诊断病理性呼吸暂停；发作受环境影响（动眼睡眠期常见）；周期性呼吸常在其前发生并伴上呼吸道梗阻；呼吸和吞咽不协调可引起；可为严重疾病伴随症状（脓毒症、脑膜炎），但大多与呼吸中枢不成熟有关；胎龄越小越多，可持续到足月以后；短期呼吸暂停亦可引起严重缺氧；婴儿氧耗比成人高、氧储备小→呼吸暂停更易引起严重后果；\n儿童睡眠呼吸暂停以阻塞性多见，扁桃体和腺样体肥大（反复上呼吸道感染）是主要原因；与成人不同，儿童多表现为部分气道阻塞和通气不足，呼吸暂停次数较少、持续时间较短。' },
  { m: '25A', q: '呼吸系统临床表现（呼吸增快标准、三凹征、发绀、咳嗽、杵状指）？', a: '呼吸增快（肺炎标准）：<2月龄RR≥60次/min，2~12月龄≥50次/min（监测时应除外发热和哭闹影响）；发热伴呼吸增快预示呼吸道感染；\n鼻翼扇动：吸气时鼻翼扇动是呼吸困难早期表现；\n三凹征：吸气时胸骨上、下及肋间凹陷——婴幼儿上呼吸道梗阻或肺实变，用力吸气辅助肌参与、胸腔负压增加所致，其轻重反映气道阻塞严重度；\n吸气喘鸣：喉、气管梗阻（胸外），音调高；呼气呻吟（grunting）：小婴儿下呼吸道梗阻和肺扩张不良表现（声门半关闭下呼气增加远端压力，利于萎陷肺泡扩张），见于新生儿RDS；\n发绀：毛细血管还原血红蛋白40~60g/L出现；中心性发绀（唇、黏膜，动脉低氧血症，见于肺炎、青紫型先心病）vs末梢性发绀（血流慢、无动脉低氧血症，见于休克）；发绀作为低氧血症指征既不敏感也无特异性（严重贫血可不出现，红细胞增多症可有发绀而氧含量不低）；\n咳嗽性质：伴发热多为呼吸道感染；湿咳（黏液脓痰）是气管支气管肺部感染标志；粉红色泡沫痰是急性左心衰特点；干咳/阵发刺激性干咳见于哮喘、胃食管反流、异物等；\n杵状指：指/趾骨末端背侧组织增生、甲床抬高；常见于支气管扩张症，亦见于迁延性肺炎、长期哮喘、青紫型先心病；早期识别：指厚比>1、甲床角>195°、Schamroth征（对靠两指间菱形小孔消失）。' },
  { m: '25B', q: '急性上呼吸道感染的病原学要点？', a: '是最常见的儿童急性感染性疾病，鼻腔、咽或喉部急性炎症总称（感冒/鼻炎/急性鼻咽炎/急性咽炎/急性扁桃体炎）；\n病毒占原发性上感的90%以上，细菌感染仅10%左右（继发感染多为β溶血性链球菌A组、肺炎链球菌、流感嗜血杆菌、葡萄球菌，链球菌常引起原发性咽炎）；\n常见病毒：\n①鼻病毒（100余种血清型）与冠状病毒：症状局限于上呼吸道，自限性，1周左右自愈；\n②柯萨奇病毒（A组16型是手足口病常见病原，引起疱疹性咽峡炎）与埃可病毒：肠道病毒，经呼吸道和消化道感染；\n③流感病毒：甲乙丙三型，甲型抗原变异大导致大流行（每隔10~15年一次），乙型致病性较低，丙型散发、病情轻；\n④副流感病毒：1~3型最常见；1型（HA2）是儿童喉气管支气管炎主要原因；2型（HA1）引起细支气管炎或肺炎、哮吼；\n⑤呼吸道合胞病毒（RSV，A、B亚型）：婴幼儿呼吸道强致病力，是儿童病毒性肺炎最常见病原；1岁内婴儿约75%发生毛细支气管炎，2岁后毛细支气管炎减少，5岁后仅表现轻型上感；\n⑥腺病毒（49种血清型）：3、7型可持续存在于上呼吸道腺体引起致死性肺炎；8型致流行性角膜结膜炎；3、7、11型致咽结膜炎；11、21型致出血性膀胱炎；\n⑦人偏肺病毒（hMPV，2001年首次分离）：冬春高峰，A、B两型，从轻型上感到严重毛细支气管炎和肺炎；\n肺炎支原体：也引起上感，肺炎多见于3岁以上儿童；\n病毒感染后黏膜失去抵抗力，细菌可乘虚而入并发混合感染。' },
  { m: '25B', q: '急性上呼吸道感染的临床表现？', a: '潜伏期2~3天或更长；婴幼儿重症较多；\n轻症：鼻部症状（流清涕、鼻塞、喷嚏）、流泪、轻咳，3~4天自然痊愈；涉及鼻咽部常有发热、咽痛、扁桃体炎、咽后壁淋巴组织充血增生，发热2~3天至1周；婴幼儿易引起呕吐腹泻，称“胃肠型感冒”；\n重症：体温39~40℃或更高，畏寒、头痛、全身无力、食欲锐减；疱疹和溃疡→疱疹性咽炎；红肿波及扁桃体、滤泡性脓性渗出→全身症状加重；颌下淋巴结肿大压痛；注意高热惊厥（多见于婴幼儿，起病1~2日内发生，很少反复）和急性腹痛（脐周、无压痛、早期出现，多为暂时性，与肠蠕动亢进有关；持续者多为并发急性肠系膜淋巴结炎，需与阑尾炎鉴别）；\n急性扁桃体炎：病毒所致者扁桃体表面斑点状白色渗出物，软腭咽后壁小溃疡，双侧颊黏膜充血伴散在出血点但黏膜光滑（可与麻疹鉴别）；链球菌引起者2岁以上多见，全身症状多（高热畏寒呕吐头痛腹痛），扁桃体弥漫性红肿或滤泡性脓性渗出，舌红苔厚，易并发鼻窦炎、中耳炎、颈部淋巴结炎；\n血常规：病毒感染白细胞偏低或正常（早期可较高）；细菌感染白细胞总数多增高、中性粒细胞百分数增高、可核左移；\n病程：轻型发热1~2日至5~6日，重者高热1~2周。' },
  { m: '25B', q: '急性上呼吸道感染的并发症三大类？', a: '①感染自鼻咽部蔓延至附近器官：急性结膜炎、鼻窦炎、口腔炎、喉炎、中耳炎、颈淋巴结炎，其他如咽后壁脓肿、扁桃体周围脓肿、上颌骨骨髓炎、支气管炎和肺炎；\n②病原通过血液循环播散到全身：细菌感染并发败血症时导致化脓性病灶——皮下脓肿、脓胸、心包炎、腹膜炎、关节炎、骨髓炎、脑膜炎、脑脓肿、泌尿系感染；\n③感染和变态反应对机体的影响：风湿热、肾炎、肝炎、心肌炎、紫癜、类风湿病及其他结缔组织病。' },
  { m: '25B', q: '急性上呼吸道感染的鉴别诊断要点？', a: '①流行情况：注意当地流行情况及传染病——幼儿急疹、麻疹、猩红热、流脑、百日咳、脊髓灰质炎等起病与上感相似；\n②体格检查：扁桃体及咽部黏膜红肿较重则细菌和病毒均可能；扁桃体有脓性分泌物应考虑链球菌感染；扁桃体有较大膜性渗出物或超出扁桃体范围需排除白喉；急性咽炎伴出血性皮疹必须排除败血症和脑膜炎；\n③与流感鉴别：流感有明显流行病史，全身症状重（高热、四肢酸痛、头痛），鼻咽部症状相对轻；\n④与消化系统疾病鉴别：婴幼儿上感常有呕吐腹痛腹泻，注意与急性阑尾炎鉴别；\n⑤与过敏性鼻炎鉴别：喷嚏流涕、鼻黏膜苍白水肿、病程长且反复发作，学龄前和学龄儿多见，行过敏原检测；\n⑥血常规鉴别：发热高+白细胞低考虑病毒性上感（排除流感、麻疹、疟疾、伤寒、结核等）；白细胞持续增高考虑细菌感染（病毒感染早期也可高达15×10⁹/L，但中性粒细胞很少超过75%）；白细胞特别高注意细菌性肺炎、传染性单核细胞增多症、百日咳；急性咽炎伴皮疹、全身淋巴结及肝脾肿大者查异型淋巴细胞除外传单。' },
  { m: '25B', q: '急性上呼吸道感染的治疗与预防？', a: '治疗：充分休息、解表、清热、预防并发症为主；\n对因治疗：单纯病毒性上感为自限性疾病，对症治疗即可；抗菌药物对病毒无效且致菌群失调，避免滥用；病情重、合并细菌感染或有并发症时加用抗菌药物（青霉素类、头孢菌素类、大环内酯类，3~5天疗程），2~3天无效考虑其他病原体；\n对症治疗：高热冷毛巾湿敷前额头部（每10分钟更换）可控制高热惊厥；退热药对乙酰氨基酚或布洛芬4~6小时可重复，避免用量过大致体温骤降虚脱；轻症咳嗽不宜用大量止咳药；局部：鼻炎用滴鼻药（婴儿忌油剂滴鼻，防吸入下呼吸道致类脂性肺炎），年长儿咽喉炎用淡盐水或复方硼酸溶液漱口；\n中医：风寒感冒（荆防败毒散加减，辛温解表）；风热感冒（银翘散加减，辛凉解表，多见于婴幼儿）；暑湿感冒（藿香正气散或新加香薷饮，清暑化湿解表）；流行性感冒（时行感冒，清热解毒，银翘散合普济消毒饮）；急性扁桃体炎（乳蛾，疏风清热利咽消肿，银翘散加减，外治锡类散/冰硼散吹喉——婴幼儿咳嗽反射弱，吹喉药量宜少防吹入气道）；\n预防：积极锻炼增强体质；讲卫生避免诱因（穿衣过多过少、室温过高过低、天气骤变、环境污染、被动吸烟）；避免交叉感染（接触患者后洗手、通风换气、及时消毒）；药物预防（黄芪、匹多莫德、泛福舒，加味玉屏风散——生黄芪9g、白术6g、防风3g、生牡蛎9g、陈皮6g、山药9g）；疫苗（减毒疫苗鼻腔滴入/雾化激发分泌型IgA）。' },
  { m: '25C', q: '急性支气管炎的病因、临床表现与治疗？', a: '婴幼儿发病较多较重，常并发或继发于呼吸道其他部位感染，也是麻疹、百日咳、伤寒等急性传染病的一种临床表现；\n病因：主要为感染——病毒（鼻病毒、冠状病毒、流感病毒、腺病毒、3型副流感病毒、RSV等）、肺炎支原体、细菌（肺炎链球菌、β溶血性链球菌A组、葡萄球菌、嗜血流感杆菌，有时百日咳杆菌、沙门菌属、白喉杆菌）或混合感染；凡引起上感的病毒都可成为病原；环境污染、有毒气体刺激、营养不良、佝偻病、变态反应、慢性鼻咽炎症为诱因；\n临床表现：先有上感症状，然后频繁较深的干咳→渐有支气管分泌物；胸部可闻干、湿啰音，以不固定的中等水泡音为主（与肺炎的固定细湿啰音鉴别）；婴幼儿不会咳痰多经咽咽下；重者发热38~39℃（偶达40℃），多2~3天退热；咳嗽延续7~10天，有时迁延2~3周；白细胞正常或稍低，升高提示继发细菌感染；\n鉴别：重症支气管炎与肺炎早期难鉴别——呼吸频率明显增快（2个月以下≥60、2~12个月≥50、1~5岁≥40次/min）、听到细湿啰音或捻发音、咳嗽后啰音无明显减少应考虑肺炎，行胸片确诊；注意与支气管异物、肿物压迫鉴别；\n治疗：一般治疗同上感（休息、饮食、温湿度、经常变换体位）；咳嗽频繁妨碍休息给祛痰药，应避免盐酸喷托维林、异丙嗪类及含阿片、可待因成分的镇咳药（抑制分泌物排出）；痉挛时给支气管舒张剂；化痰药——吐根糖浆（婴幼儿每次2~15滴）、愈创甘油醚（恶心祛痰药，每次0.025~0.1g，3次/d）、氨溴索（黏液溶解剂，每次0.15~0.3mg/kg，2次/d）、乙酰半胱氨酸（断裂黏蛋白双硫键，0.1g/次，2~4次/d）、羧甲司坦（30mg/(kg·d)，2~3次/d）；并发细菌感染选用适当抗生素；\n中医（外感咳嗽）：风寒咳嗽（杏苏散加减）、风热咳嗽（桑菊饮加减）、实热喘（麻杏石甘汤加减）。' },
  { m: '25D', q: '肺炎的分类方法与病情严重度评估？', a: '分类：\n①病理分类：大叶性肺炎、支气管肺炎（最多见）、间质性肺炎、毛细支气管炎及其他（吸入性肺炎）；\n②病原体分类：细菌性（肺炎链球菌是儿童期肺炎最常见细菌病原，可致重症；还有金葡菌、A群链球菌、流感嗜血杆菌、大肠埃希菌、肺炎克雷伯菌、卡他莫拉菌）、病毒性（RSV为儿童肺炎首位病毒病原，其次鼻病毒、hMPV、腺病毒）、非典型病原（肺炎支原体——学龄期和学龄前期常见，1~3岁亦不少见；肺炎衣原体——学龄期和青少年）、真菌性（白念珠菌、曲霉菌、肺孢子虫等）、非感染因素（吸入性肺炎）；\n③病程分类：急性（1个月内）、迁延性（1~3月）、慢性（>3个月）；\n④病情分类：轻症与重症CAP（见下）；\n⑤感染地点：CAP（无免疫抑制患儿在医院外或住院48小时内发生）、HAP（住院48小时后发生）；\n⑥临床表现分类：典型肺炎（细菌性、病毒性）、非典型肺炎（支原体、衣原体肺炎）；\n重症肺炎预测因素：低氧血症、精神状态改变、年龄<6个月、呼吸困难、肺多叶浸润、中度/大量胸腔积液；\n重症CAP标准（任一项）：一般情况差、拒食或脱水征、意识障碍、呼吸明显增快（婴儿RR>70、年长儿>50次/min）、发绀、呼吸困难（呻吟、鼻扇、三凹征）、肺浸润多肺叶受累或≥2/3的肺、胸腔积液、SpO₂≤0.92、肺外并发症；\nWHO呼吸急促标准：<2月龄RR≥60、2~12月龄≥50、1~5岁≥40次/min；呼吸增快对放射学诊断肺炎敏感性74%、特异性67%。' },
  { m: '25D', q: '儿童不同年龄阶段CAP的病原微生物及临床特征？', a: '出生~20天：B族链球菌（早发脓毒症一部分，双肺弥漫、病重）；革兰阴性肠道细菌（常为院内感染，出生1周后发现）；巨细胞病毒（全身CMV感染一部分）；莫氏厌氧菌（早发脓毒症一部分）；\n3周~3个月：沙眼衣原体（母亲生殖器感染引起，不发热或低热，剧烈咳嗽似百日咳样）；RSV（高峰年龄2~7个月，喘鸣难与毛细支气管炎区别，大量流涕，隆冬早春发病）；副流感病毒1、2、3型；肺炎链球菌（细菌性肺炎最常见原因）；百日咳杆菌（主要引起支气管炎，重症可致肺炎）；金黄色葡萄球菌（较少见，重症肺炎——肺浸润、肺脓肿、肺大疱、脓胸或脓气胸可同时出现）；\n>3个月~5岁：RSV（较低年龄患儿最常见）；副流感病毒、流感病毒、腺病毒（婴幼儿重症肺炎常见病毒病原）；肺炎链球菌（肺叶性/节段性肺炎）；流感嗜血杆菌（广泛应用疫苗地区b型感染几近消失）；肺炎支原体（较大年龄儿童为主，婴儿不少见）；\n>5~15岁：肺炎支原体（主要致病原因，影像学表现多样）；肺炎衣原体；肺炎链球菌（最可能引起大叶性肺炎）。' },
  { m: '25D', q: '支气管肺炎的病因、病理与病理生理？', a: '儿童最常见肺炎（小叶性肺炎）；细菌病原主要为肺炎链球菌、流感嗜血杆菌、金黄色葡萄球菌；\n病理：分一般性与间质性两大类；一般支气管肺炎——病变散布支气管壁附近肺泡，肺泡毛细血管扩张充血、肺泡内水肿及炎性渗出（浆液纤维素性渗出含中性粒细胞、红细胞及病原微生物），经肺泡间通道向周围蔓延呈小点片状灶性炎症；间质性肺炎——支气管壁、细支气管壁及肺泡壁充血水肿与炎症细胞浸润，细支气管管腔可被黏液、纤维素堵塞致局限性肺气肿或肺不张，病毒性肺炎主要为此型；\n病理生理：\n外呼吸障碍：①毛细支气管壁充血水肿增厚→管腔变小堵塞，气道阻力与半径4次方成反比（半径减半阻力增16倍）；②肺泡内炎性渗出物；③炎症使肺表面活性物质生成减少→微型肺不张；④肺泡膜增厚（透明膜形成、炎症细胞浸润水肿）→肺泡通气量下降、通气/血流比例失调、弥散障碍→低氧血症甚至CO₂潴留；\n内呼吸障碍：细胞缺氧时胞质内酶系受损→组织对氧摄取利用不全及电解质酸碱失衡→多系统功能障碍；危重患儿可发生心力衰竭、呼吸衰竭、微循环障碍甚至DIC；\n中毒症状：高热、嗜睡、昏迷、惊厥及循环衰竭，由毒素、缺氧及代谢异常（代谢性酸中毒、稀释性低钠血症）引起。' },
  { m: '25D', q: '支气管肺炎的临床表现、并发症与诊断？', a: '临床表现：起病急或缓，发热、拒食或呕吐、嗜睡或烦躁、喘憋；早期体温38~39℃（可达40℃），弛张型或不规则发热；弱小婴儿起病缓、发热不高、咳嗽和肺部体征不明显，常见拒食、呛奶、呕吐或呼吸困难；咳嗽及咽部痰声早期明显，呼吸增快40~80次/min，呼吸:脉搏从1:4上升为1:2；重症呼气呻吟、鼻扇、三凹征、发绀；胸部体征早期不明显，以后中粗湿啰音→细湿啰音或捻发音，病灶融合可闻管状呼吸音；一侧肺叩诊实音和/或呼吸音消失应考虑胸腔积液或脓胸；其他系统症状：消化道（呕吐腹泻腹胀）、循环（心率140~160次/min，心力衰竭征象）、神经（烦躁不安、嗜睡交替，惊厥多为高热或缺钙，若伴意识障碍可能并发脑膜脑炎、中毒性脑病）；\n实验室：细菌性肺炎WBC（15~30)×10⁹/L偶达50×10⁹/L、中性粒细胞60%~90%（重症金葡菌或革兰阴性杆菌肺炎可不高或降低）；病毒性肺炎WBC多低下或正常；CRP细菌感染阳性率96%，病毒感染多较低（2~4mg/L），CRP≥40mg/L考虑细菌病原；\nX线：支气管肺炎为非特异性小斑片状肺实质浸润阴影，以两肺下野、心膈角区及中内带较多；婴儿常见肺间质X线征、肺气肿（早期常见征象）、肺门阴影增深；\n并发症：最多见不同程度的肺气肿或肺不张；细菌性肺炎注意脓胸、脓气胸、肺脓肿、心包炎及败血症（如金葡菌肺炎）；少数并发中毒性脑病、DIC、胃肠出血或黄疸、噬血细胞综合征、水电解质紊乱（低钠血症、混合性酸中毒、乳酸酸中毒）；\n诊断：急性起病+呼吸道症状体征；白细胞明显升高和中性粒细胞增多、CRP升高有助于细菌性肺炎，白细胞减低或正常多见于病毒性肺炎。' },
  { m: '25D', q: '肺炎的治疗原则与抗菌药物选择？', a: '一般治疗：护理（环境安静整洁、通风，室温20℃左右、相对湿度60%）、镇静（苯巴比妥或水合氯醛，避免过多镇静剂抑制咳嗽，避免呼吸兴奋剂）、饮食（流食、补充维生素C/A/D和钙剂）、液体疗法（口服为主，总液量60~80ml/(kg·d)，急性期钠潴留钠入量不超过3mmol/(kg·d)，滴速<5ml/(kg·h)，热量210~250J/(kg·d)以上）、低钠血症血钠<125mmol/L限液同时注3%盐水6~12ml/kg；\n抗菌药物：住院患儿先取标本培养后经验性用药；一般用至体温正常后5~7天；轻症首选青霉素类、第一二代头孢菌素；青霉素过敏者用大环内酯类；疑支原体/衣原体首选大环内酯类；使用3天不见效按培养耐药结果换药；原因不明可先联合β内酰胺类+大环内酯类；\n经验性方案：3周~3个月不发热口服红霉素（沙眼衣原体），发热或缺氧加头孢噻肟/头孢呋辛；>3个月~5岁门诊口服阿莫西林、阿莫西林/克拉维酸或头孢羟氨苄/头孢克洛，病毒性不用抗菌药物；>5~15岁口服红霉素、克拉霉素或阿奇霉素，确凿细菌证据加阿莫西林或二代头孢；住院重症静脉头孢噻肟/头孢呋辛，效差考虑耐药菌换万古霉素等；\n注意：氨基糖苷类有耳肾毒性尽量避免；喹诺酮类影响骨骼发育避免用于18岁以下；四环素类牙齿黄染及牙釉质发育不良禁用于8岁以下；\n抗病毒：利巴韦林（广谱，竞争性抑制病毒合成酶，用于副流感病毒、腺病毒、RSV）、更昔洛韦（CMV首选）、干扰素（间接抑制病毒复制）、神经氨酸酶抑制剂（甲乙型流感，奥司他韦首选）；\n免疫疗法：大剂量IVIG 400mg/(kg·d)连用3~5天（严重感染），选择性IgA缺乏者禁用；高危儿用帕利珠单抗防治RSV感染；\n糖皮质激素：一般肺炎不用；重症中毒症状严重（休克、中毒性脑病、超高热）、喘憋严重支气管痉挛明显、早期胸腔积液防胸膜粘连时加用，短程3~5天，氢化可的松5~10mg/(kg·d)或甲泼尼龙1~2mg/(kg·d)；\n对症治疗：退热镇静、祛痰（氨溴索、N-乙酰半胱氨酸）、咳喘重雾化布地奈德（0.5~1mg/次，2次/d）联合β受体激动剂和抗胆碱药、无效时静滴氢化可的松5mg/kg每6~8小时或甲泼尼龙1~2mg/kg；氧疗（鼻导管0.5~1L/min，面罩2~4L/min，FiO₂≥0.5且PaO₂<60mmHg或SaO₂<92%考虑CPAP）；心力衰竭早用强心药物；腹胀（动力性肠梗阻）禁食、胃肠减压、新斯的明0.03~0.04mg/kg肌注；DIC治疗原发病+改善微循环+抗凝。' },
  { m: '25D', q: '肺炎链球菌肺炎（大叶性肺炎）的要点？', a: '病原：肺炎链球菌（革兰阳性双球菌，按荚膜多糖抗原分90个血清型；国内常见19F、19A、23F、6B、14、1、5、15型）；对青霉素不敏感率逐年增加，对红霉素耐药率95%以上；无症状携带者散播感染作用比患者更重要；\n特点：大叶性肺炎主要病原，但婴幼儿更常引起支气管肺炎；大叶性肺炎多见于3岁以上年长儿（防御能力成熟使病变局限于一叶或一节段）；冬春季多见，气候骤变时发病多；\n病理：肺泡炎为主，很少涉及间质；多局限一个肺叶（右上叶或左下叶最多见）；四期——充血期→红色肝变期（第2~3日，肺泡内纤维素渗出+大量红细胞+少量中性粒细胞）→灰色肝变期（第4~5日，红细胞消失）→消散期（蛋白溶解酶溶解纤维素）；\n临床：起病急剧，突发高热40~41℃、胸痛、呼吸急促40~60次/min，最初数日咳嗽不重无痰，后铁锈色痰；早期呕吐，少数腹痛易误诊阑尾炎；较大儿童可见唇部疱疹；重症可有中毒性脑病表现、感染性休克甚至脑疝；胸部体征早期轻，第2~3日肺实变后典型叩诊浊音、语颤增强、管性呼吸音；\n实验室：WBC及中性粒细胞明显增高（总数可达20×10⁹/L以上，偶达50~70×10⁹/L；少数低下常示病情严重），CRP阳性；\nX线：早期肺纹理加深或节段浅薄阴影→大片均匀致密阴影占全肺叶或节段，治疗后逐渐消散，多数起病3~4周后阴影消失；\n自然病程：第5~10日体温骤退（24小时内降4~5℃，大汗虚脱类似休克状态）；\n并发症：脓胸、肺脓肿、坏死性肺炎、心肌炎、心包炎，败血症患儿可并发感染性休克；\n治疗：青霉素敏感首选青霉素G或阿莫西林；低度耐药仍可首选青霉素G但剂量加大，或阿莫西林/克拉维酸钾或一、二代头孢，备选头孢曲松/头孢噻肟或万古霉素；高度耐药或存在危险因素首选万古霉素或利奈唑胺；青霉素5万~10万U/(kg·d)分3次静滴，疗程持续1~2周或完全退热后3~5日；\n预防：多价肺炎链球菌多糖疫苗（高危人群如镰状细胞病儿童）；2岁以下接种7价、13价结合疫苗。' },
  { m: '25D', q: '金黄色葡萄球菌肺炎的要点？', a: '多见于1岁以下幼婴（70%在1岁以内，CA-MRSA平均生后3个月内）；常并发于金葡菌败血症，冬春多见，可在医院内或婴儿室交叉感染流行；新生儿及免疫功能不全是重要易感因素；产生溶血素、葡萄球菌激酶、凝固酶等多种毒素和酶（凝固酶与毒性有关；凝固酶阴性者多为条件致病菌）；\n病理：广泛出血性坏死、多发性小脓肿；胸膜表面纤维素性脓性分泌物；胸膜下小脓肿破裂形成脓胸或脓气胸，可侵蚀支气管形成支气管胸膜瘘；\n临床：上感或皮肤小脓疱后1~2天至数周突起寒战高热（年长儿弛张热，新生儿可低热或无热）；肺炎发展迅速——呼吸心率增快、呻吟、青紫，黄脓痰或脓血痰，可有猩红热样皮疹；呕吐腹泻腹胀（中毒性肠麻痹）；嗜睡烦躁惊厥等中毒症状甚至休克；肺部体征出现早，迅速出现肺脓肿（散在小脓肿），脓胸及脓气胸是本症特点；\nX线四大特点：①临床症状与胸片不一致（症状重而X线少，好转时出现肺脓肿、肺大疱）；②病变发展迅速（数小时内小片炎变发展成脓肿）；③多合并小脓肿、脓气胸、肺大疱，严重者纵隔积气、皮下气肿、支气管胸膜瘘；④病灶阴影持续时间长（约2个月才消失）；\n实验室：WBC一般（15~30)×10⁹/L，中性粒细胞增高可见中毒颗粒；半数小婴儿可<5×10⁹/L而中性粒细胞百分比仍高（白细胞减低多示预后严重）；\n治疗：MSSA/MSSE首选苯唑西林及氯唑西林（β内酰胺类），备选一、二代头孢；MRSA/MRSE首选万古霉素或联用利福平，或替考拉宁、利奈唑胺、夫西地酸；万古霉素耐药者选用达托霉素、利奈唑胺、替加环素；体温正常后7天、肺部体征消失时停药，疗程至少3~4周；脓胸脓气胸——脓液量少反复胸腔穿刺抽脓，多数增长快宜闭式引流；\n预后：病死率高达10%~20%；并发金葡脑膜炎、心包炎或婴儿张力性气胸预后严重。' },
  { m: '25D', q: '流感嗜血杆菌肺炎、链球菌肺炎及革兰阴性杆菌肺炎的要点？', a: '流感嗜血杆菌肺炎：\n以往多由b型（Hib）所致（占CAP 8%~20%）；Hib疫苗推广后无荚膜不定型（NTHi）成为最常见病原；我国健康儿童Hib携带率27.3%；有荚膜细菌毒力大，b型是儿童败血症、脑膜炎和肺炎的主要致病菌之一；\n易并发于流感病毒或葡萄球菌感染患儿，起病较缓、亚急性；似肺炎链球菌肺炎（发热、咳嗽、胸痛、气促、三凹征、湿啰音）；特点：①痉挛性咳嗽似百日咳，有时像毛细支气管炎；②全身中毒症状明显；③白细胞增高明显可达（20~70)×10⁹/L；④X线可见线状渗出、过度通气及斑片状实变；⑤小婴儿多并发脓胸、心包炎、败血症、脑膜炎及化脓性关节炎；⑥易后遗支气管扩张症；\n治疗：首选阿莫西林/克拉维酸或氨苄西林/舒巴坦，备选2~3代头孢或新大环内酯类；氨苄西林100~150mg/(kg·d)；\n链球菌肺炎：A族（GAS）引起咽炎、猩红热、皮肤感染，与风湿和肾炎有关；B族（GBS）是国外新生儿肺炎主要致病菌（早发型生后24小时内引起肺炎和败血症，晚发型生后7天~3个月主要引起脑膜炎，母婴垂直传播是早期感染主要途径）；发病急，咽痛声哑发热胸痛咳嗽呼吸窘迫白细胞增多；最常见并发症肺脓肿和脓胸，少见心包炎、腹膜炎；可致暴发性紫癜、休克及链球菌中毒休克综合征；A、B族首选青霉素G（剂量加大10万U/(kg·d)），疗程3~4周，未获培养结果时头孢呋辛75mg/(kg·d)疗程3周有效；脓胸需闭式引流；\n革兰阴性杆菌肺炎：多见于新生儿及小婴儿，院内交叉感染增加，死亡率仍高；常见大肠埃希菌、肺炎杆菌、铜绿假单胞菌；诊断靠气管吸出物、血液及胸腔积液培养；原有肺炎见好又恶化或迁延不愈应怀疑此类感染；\n大肠埃希菌肺炎：多系间质性肺炎，新生儿常为败血症一部分，腺病毒肺炎后继发；全身症状极重、脉搏增快与发热不成比例；双侧支气管肺炎、脓胸常见、肺脓肿少见；首选头孢曲松或头孢噻肟，单用或联用阿米卡星，产ESBL菌株首选亚胺培南或美罗培南；预后欠佳死亡率可高达50%；\n铜绿假单胞菌肺炎：坏死性支气管肺炎，多见于严重心肺疾病（囊性纤维化、支扩）、早产儿、粒细胞缺乏、长期抗菌药物治疗者；寒战中度发热、大量脓性绿色痰、脉搏相对缓慢（毒血症）；X线结节状浸润阴影及许多细小脓肿可融合成大脓肿；首选（替卡西林/克拉维酸）或（哌拉西林/他唑巴坦）或亚胺培南，备选美洛西林或头孢他啶或（头孢哌酮/舒巴坦），单用或联用氨基糖苷类；呼吸机相关肺炎病死率高达50%~70%；\n克雷伯菌肺炎：儿童院内获得性肺炎最常见病原，易产ESBL；砖红色黏稠血性痰（年长儿），病情极重发展迅速呈休克状态；X线肺段或大叶致密实变边缘膨胀凸出（上叶后段及下叶尖段多见），常见肺脓肿（多房性蜂窝状）；三代头孢单用或联用丁胺卡那或亚胺培南。' },
  { m: '25D', q: '腺病毒肺炎的要点？', a: '病原：人腺病毒（DNA病毒，耐温耐酸耐脂溶剂；90个基因型分A~G亚属；与呼吸道感染相关主要是B亚属HAdV-3、7、11、14、16、21、50、55型，C亚属1、2、5、6、57型，E亚属4型；中国北方以3、7型为主，南方以3、2型为主）；\n流行病学：经呼吸道、接触和粪口传播；潜伏期2~21天（平均3~8天）；80%发生在7~24个月婴幼儿（生后最初数月有母传抗体）；北方冬春多见；潜伏期2~3周有传染性；母传抗体不能预防感染；\n病理：局灶性或融合性坏死性肺浸润和支气管炎；实变可占一叶全部（左肺下叶最多见）；核内包涵体（嗜酸性或嗜两色性，周围透明圈）——可与麻疹病毒肺炎及肺巨细胞包涵体病区别；\n临床（3、7型婴幼儿）：\n①起病急骤发热，第1~2日即39℃以上，第3~4日多呈稽留热或不规则高热（3/5以上病例最高体温超40℃），抗菌药物无效；\n②自起病时即有咳嗽（频咳或轻度阵咳），呼吸困难及发绀多数开始于第3~6日逐渐加重，重症鼻扇、三凹征、喘憋、口唇甲床青紫；初期呼吸音粗或干啰音，湿啰音于发病第3~4日后出现（肺部体征出现较迟）；\n③神经系统症状：发病3~4天后嗜睡萎靡，烦躁与萎靡交替，重症中晚期半昏迷惊厥；\n④循环系统：面色苍白发灰，心率重症160~180次/min甚至200以上；约1/3重症病例于第6~14日出现心力衰竭；肝渐肿大肋下3~6cm；\n⑤消化系统：半数以上轻度腹泻呕吐；\n⑥其他：卡他性结膜炎、皮疹，扁桃体石灰样小白点（早期特殊体征）；\nX线：早期肺纹理增厚模糊；第3~5天开始出现大小不等片状病灶或融合性病灶（两肺下野及右上肺多见），第6~11天病灶密度增高、增多融合；吸收大多数在第8~14天以后（若病变继续增多应疑混合感染）；肺气肿颇为多见（双侧弥漫性或病灶周围）；约1/6有胸膜反应或胸腔积液；\n实验室：白细胞早期（第1~5日）大多减少或正常（62%在10×10⁹/L以下），继发细菌感染才升高；中性粒细胞碱性磷酸酶及四唑氮蓝染色低于正常儿童或细菌性肺炎患儿（并发化脓感染则升高）；\n病程：轻症7~11日体温骤降；重症第5~6日后明显嗜睡、面色苍白发灰、肝大、喘憋、大片实变；恢复者第10~15日退热；肺部病变恢复期1~4个月，3~4个月不吸收者多有肺不张，日后可发展成支气管扩张；\n并发症：继发细菌感染（发病10天左右病情不见好转或一度减轻又恶化、痰变黄、脓胸等提示）；重症极期可并发DIC、噬血细胞综合征（高热7~10天后外周血两系或三系减少、脾大、铁蛋白≥500μg/L等8项标准中任5项）；心肌炎（起病急恢复快，多病程第2周早期）；\n预后：北方病情严重，1958年病死率25%，中西医结合后降至5%~10%；死亡多发生于6~18月婴幼儿；HAdV-7型重症及死亡者多；腺病毒肺炎后闭塞性细支气管炎发生率47.57%；\n治疗：无明确针对腺病毒的特异抗病毒药（西多福韦重症早期可能有效，儿童疗效安全性未定）；重症支气管镜灌洗；混合感染选敏感抗菌药物；中医八法（解表、表里双解、通阳利湿、清热养阴、降气豁痰、扶正开闭、固阴降逆、回阳救逆）；\n预防：流行期间隔离（交叉感染发生率达60%~85%，接触20分钟即可致病）。' },
  { m: '25D', q: '流感病毒肺炎与副流感病毒肺炎的要点？', a: '流感病毒肺炎：\n病原：正黏病毒科单股负链分节段RNA病毒，分甲乙丙丁四型；甲型按HA（18个）和NA（11个）分亚型，季节性流行由H1N1、H3N2及乙型Victoria、Yamagata系引起；\n严重间质性肺炎，多发生于6个月至5岁弱小婴幼儿，冬春季流行；乙型较甲型轻；潜伏期1~4天（平均2天）；\n临床：突然起病，高热39~40℃、畏寒寒战、头痛、全身肌肉酸痛、极度乏力，咳嗽咽痛流涕鼻塞，可有喘息，儿童消化道症状多于成人；肺部湿啰音和喘鸣音为主；重症发展迅速，呼吸困难伴低氧血症，可快速进展为ARDS；肺外并发症多见（心血管、消化、中枢、血液系统，多脏器功能衰竭和感染性休克）；\n实验室：白细胞总数正常或减少、淋巴细胞计数及比率增高，合并细菌感染时白细胞和中性粒细胞增多；\n诊断：流感流行季节婴幼儿持续高热不退+肺炎症状+抗菌药物无效；核酸/快速抗原/病毒分离/双份血清4倍升高确诊；\n治疗：神经氨酸酶抑制剂奥司他韦（首选，应早期应用）、帕拉米韦、扎那米韦；阿比多尔证据不充分；金刚烷胺和金刚乙胺已耐药不建议使用；\n预防：流感疫苗最有效（6个月以上可接种，流行高峰前1~2个月）；\n副流感病毒肺炎：副黏病毒科单股负链RNA病毒，4个血清型；1、2型引起重症喉炎（哮吼，2~6岁），3型引起肺炎及毛细支气管炎（1岁以内婴儿）；全年发病，易再感染；临床与RSV肺炎类似，发热1~8天（多数3~5天），1/3患儿有喘息；X线肺纹理增重、小片状或点状阴影；无有效抗病毒药、对症治疗；已有副流感病毒3型活疫苗。' },
  { m: '25D', q: '呼吸道合胞病毒肺炎与毛细支气管炎的要点？', a: 'RSV肺炎：\n病原：RSV（2015年划归肺炎病毒科正肺病毒属，人正肺病毒），单血清型，A、B两个亚型；病毒颗粒约150nm，RNA病毒对乙醚敏感，无血细胞凝集性，胞质内包涵体；\n流行病学：人群抗体1~6月龄阳性率71%，20岁以上100%；我国北方A、B亚型交替流行，RSV-A-ON1和RSV-B-BA9为全球广泛流行基因型；北方冬春、南方夏秋；多见于3岁以下，1~6个月可见较重病例，男多于女；母传抗体不能预防感染，再感染极常见（10年再感染率65%）；院内感染率高达30%~50%；新生儿病毒性肺炎中RSV占10%~15%；\n高危因素：年龄<12周、慢性肺部疾病、先天性气道畸形、左向右分流先心病、唐氏综合征、免疫缺陷、神经肌肉病；危险因素包括早产、低出生体重、男性、有兄弟姐妹、非母乳喂养、居住拥挤、室内烟雾、哮喘或特应性疾病家族史；\n病理：单核细胞间质浸润（肺泡间隔增宽、淋巴细胞浆细胞巨噬细胞渗出），肺泡腔水肿液及透明膜；病毒对肺的直接侵害；\n临床：潜伏期2~8天（多为4~6天）；半数以上1岁内婴儿；约2/3病例高热（最高41℃，但易退热，高热1~4天）；主要症状咳嗽、喘息、气促；重症呼吸困难、喘憋、青紫、鼻扇三凹征；约2/3患儿有喘鸣音，叩诊无浊音；白细胞（5~15)×10⁹/L多数10×10⁹/L以下；X线双肺纹理增多+多数小点片状阴影（大片极罕见），约1/3肺气肿；\n治疗：重视一般治疗（氧疗、补液、保持气道通畅）；雾化拍背吸痰；可试用重组人α干扰素（α1b每次2~4μg/kg或α2b每次10万~20万IU/kg，2次/d，5~7天）；不推荐常规用利巴韦林；\n预防：洗手和接触防护；母乳喂养至少6个月；避免烟草烟雾；帕利珠单抗（抗F蛋白，流行前1个月开始每月肌注15mg/kg，最多5个月；不推荐胎龄<29周早产儿使用，除非合并先心病及慢肺病）；无疫苗；\n毛细支气管炎：仅见于2岁以下婴幼儿（高峰2~6个月，80%以上1岁内）；RSV最常见病原，其他副流感病毒3型、腺病毒、流感病毒、肠道病毒、鼻病毒，少数肺炎支原体；国内认为是特殊类型肺炎（喘憋性肺炎）；病变侵及直径75~300μm毛细支气管，上皮坏死、黏液分泌增加→细支气管狭窄阻塞→肺不张、肺气肿；\n临床：上感后2~3天出现持续性干咳和发作性呼吸困难，咳与喘憋同时发生为特点；体温高低不一（低热、中等、高热约各1/3）；喘憋发作时呼吸快而浅，呼气性喘鸣，RR 60~80次/min甚至100以上，脉快而细160~200次/min；明显鼻扇三凹征；叩诊鼓音；喘憋发作时听不到湿啰音，缓解时有弥漫性细湿啰音；X线全肺梗阻性肺气肿、支气管周围炎征象、小点片状阴影但无大片实变；血气：代谢性酸中毒（脱水），重度喘憋CO₂潴留呼吸性酸中毒；\n鉴别：婴儿第一次感染性喘息发作多数是毛细支气管炎（反复多次喘息+亲属哮喘及变应性疾病史→婴幼儿哮喘可能）；粟粒性肺结核；百日咳、心衰、心内膜弹力纤维增生症、硬脂酸锌吸入、异物；\n治疗：对症治疗为主——增加空气湿度（加湿器）、雾化、拍背吸痰、抬高头胸部、经鼻胃管喂养、多次口服补液不足时静脉（10%葡萄糖加1/5容量生理盐水），代谢性酸中毒1.4%碳酸氢钠；SpO₂持续低于90%~92%氧疗；呼吸衰竭CPAP必要时插管机械通气；疑似心衰及早用洋地黄；不推荐常规全身糖皮质激素；一般无须抗菌药物（继发细菌感染时酌情使用）；α干扰素；中医射干麻黄汤、定喘汤、小青龙汤加减；\n预后：病程5~15天平均10天；住院病死率约1%（原有心肺疾病、新生儿未成熟儿危险性高）；病后数年间反复喘息，22.1%~53.2%患儿童哮喘。' },
  { m: '25D', q: '巨细胞病毒肺炎的要点？', a: '病原：巨细胞病毒（DNA病毒，属疱疹病毒类），健康儿童可携带；先天感染经胎盘，出生时即可黄疸、紫癜、肝脾肿大；后天传染经呼吸道、受感染的尿及输血；新生儿及早产儿多于生后4个月内发病（患病者和携带者均可从尿和唾液排病毒）；激素及免疫抑制剂应用后、恶性肿瘤、器官移植及AIDS患儿有增多趋势（骨髓移植后CMV感染率60%~70%，10%~50%发展成间质性肺炎；免疫抑制患儿间质性肺炎50%由CMV引起）；\n病理：终末气道肺泡壁及肺泡腔可见许多巨细胞，含核内包涵体和胞质内包涵体（亦见于唾液腺、肾、胃肠道、肝、脑等器官）；间质和肺泡内单核细胞浸润及富含蛋白质液体；\n临床：肺炎常被其他全身严重症状掩盖；新生儿CMV肺炎可表现持续性呼吸窘迫，同时常有肝脾肿大、黄疸、紫癜和中枢神经系统损害；国内CMV肺炎多见于6月龄以内婴儿（平均6.2月），主要症状咳嗽、气促、喘息，高热仅占15.1%；听诊多无异常，与肺部X线改变不平行；X线广泛索条状纹理增粗和小叶性炎症浸润灶，呈网点状阴影，实变少见（7.5%）；\n诊断：病毒学证据——直接：病毒分离（金标准）、免疫标记检测病毒抗原（IEA、EA、pp65）、实时荧光定量PCR检测DNA载量；间接：CMV-IgG阳转或IgM阳性而IgG阴性/低亲和力；双份血清IgG 4倍以上升高；新生儿HCMV-IgM阳性是原发感染证据（6月龄内婴儿需考虑母传IgG）；从BALF或活检组织分离到病毒或检出病毒复制标志物可确定诊断；\n治疗：更昔洛韦（GCV，阿昔洛韦衍生物，抗CMV作用是阿昔洛韦10倍）为儿童严重CMV感染一线用药——诱导5mg/kg每12小时1次持续2~3周，维持5mg/kg每日1次连续5~7日（总疗程3~4周）；副作用粒细胞和血小板减少（血小板和粒细胞下降≤25×10⁹/L和0.5×10⁹/L或减至用药前50%应停药）；CMV-免疫球蛋白多主张与更昔洛韦联合治疗CMV间质性肺炎。' },
  { m: '25D', q: '新发病毒性肺炎（人偏肺病毒、人禽流感、SARS、新冠）的要点？', a: '人偏肺病毒（HMPV）：2001年首次分离；副黏病毒科肺病毒亚科偏肺病毒属；单股负链RNA；A、B两型（A1、A2、B1、B2亚型），人群对两型无交叉免疫；<1岁肺炎住院儿童5%~10%为HMPV所致；寒带温带冬春流行、亚热带春夏，高峰常与RSV重叠或稍后；临床与RSV下呼吸道感染相似但年龄偏大、男性多于女性，潜伏期3~5天；白细胞正常或升高、分类多正常或淋巴细胞减少；实时RT-PCR是最敏感有效检测手段；对症治疗为主；\n人感染禽流感（H5N1）：正黏病毒科甲型流感病毒；H5和H7亚型引发高致病性禽流感；已证实感染人亚型H5N1、H9N2、H7N7、H7N2、H7N3、H7N9；传播途径：禽-人、环境-人、母-婴垂直、少数非持续性人际有限传播；90%以上病例发病前有禽类暴露史；近一半H5N1感染出现在15岁以下儿童；潜伏期一般1周以内（通常2~4天）；发热>38℃、咳嗽咳痰、呼吸增快及呼吸困难，流感样症状及消化道症状；重症迅速进展ARDS、多脏器功能衰竭；白细胞减低尤以淋巴细胞减少为著、血小板减少（与死亡率相关）；病理弥漫性肺泡损伤、透明膜形成、淋巴器官淋巴细胞耗竭；儿童H5N1病死率48.7%（<5岁27.5%，12~17岁最高80.4%）；奥司他韦主要治疗药物，强调早期给药（36~48小时内），剂量2mg/kg 2次/d疗程5日；\nSARS：2002-2003年暴发，SARS-CoV（β冠状病毒属）；儿童患者仅占5%，未见儿童死亡病例，临床症状轻（发热首发>38.5℃，常无上呼吸道卡他症状，干咳）；潜伏最少4日最长17日；白细胞正常或降低；治疗无特效抗病毒，无创通气非常有价值，重症丙种球蛋白400mg/(kg·d)3~5日或血浆10~20ml/(kg·d)；\n新型冠状病毒肺炎（COVID-19）：SARS-CoV-2（β冠状病毒属，与蝙蝠SARS样冠状病毒同源性85%以上）；潜伏1~14日（多3~7日）；发热、干咳、乏力为主，儿童症状可不典型（呕吐腹泻消化道症状或仅精神差、呼吸急促），儿童嗅觉味觉改变相对成人少见；注意儿童多系统炎症综合征（发热>39℃、皮疹、结膜充血、淋巴结肿大、全身炎症和休克）；实验室：白细胞正常或降低、淋巴细胞减少、CRP/血沉/PCT/LDH/铁蛋白升高，重症D-二聚体升高、IL-6等炎症因子升高；影像：X线两肺纹理增多毛糙→小斑片影或间质改变以肺外带明显，CT磨玻璃影；临床分无症状、上感、轻症肺炎、重症肺炎、危重症（呼吸衰竭需机械通气、休克、合并其他器官衰竭）；治疗无特效抗病毒（干扰素α可降低病毒载量），避免盲目使用抗菌药物，重症短程3~5天激素（≤甲泼尼龙1~2mg/(kg·d)）。' },
  { m: '25D', q: '肺炎支原体肺炎（MPP）的要点？', a: '病原：肺炎支原体——介于细菌和病毒之间的最小原核微生物，无细胞壁（故青霉素、头孢类无效），呈球状杆状丝状多种形态，革兰染色阴性，需含胆固醇特殊培养基，接种10天后才出现菌落（很少超过0.5mm），能通过细菌滤器；\n流行病学：经呼吸道飞沫和直接接触传播；非流行年占儿童CAP 10%~30%，流行年份增加3~5倍，每隔3~7年一次地区性流行（持续可达一年）；学龄前期和学龄期是发病高峰，近年5岁以下儿童MPP增多；北方秋冬、南方夏秋；潜伏期约2~3周（8~35天），潜伏期内至症状缓解数周均有传播性；痊愈后可携带病原DNA 0.5~4.5个月（平均1.5个月）；2001年日本首次发现、2003年中国发现耐大环内酯类菌株，耐药率逐渐升高；\n临床：起病不甚急，发热37~41℃（大多数39℃左右，可为持续性或弛张型或不发热）；多数咳嗽重，初期干咳继而咯痰（偶带血丝），有时阵咳稍似百日咳；一般无呼吸困难表现；体征依年龄而异——年长儿往往缺乏显著胸部体征（体征轻微而胸片阴影显著是本病特征），婴儿期可有湿性啰音；重症可出现坏死性肺炎、胸腔积液；\n肺外损害（多系统多器官）：皮肤黏膜（麻疹样或猩红热样皮疹，偶Stevens-Johnson综合征）；血液系统（溶血性贫血较常见，其次血小板减少、粒细胞减少、再障，文献有合并DIC）；神经系统（脑炎最常见，吉兰-巴雷综合征、急性播散性脑脊髓炎等）；心血管（偶心肌炎及心包炎）；泌尿（血尿、白细胞尿、蛋白尿）；\nX线：单侧病变约占80%以上（主要为右肺、大多数在下叶），多呈不整齐云雾状肺浸润影从肺门向外延至肺野（两肺下叶常见），可见大叶性实变影、肺不张；往往一处已消散而他处有新浸润（游走性）；\n实验室：白细胞大多正常或稍增高，血沉多中等度增快；\n诊断要点：持续剧烈咳嗽+临床肺炎表现+影像学改变远较体征显著；青霉素头孢类治疗无效；血清学——MP-IgM感染后近1周出现、第3~4周达高峰、持续2~4个月消失，PA法单次滴度≥1:160可作近期急性期感染参考，双份血清4倍升高确诊；核酸PCR快速诊断（注意DNA恢复期携带）；MP-IgG感染后14天出现、第5周峰值（提示既往感染）；\n治疗：首选大环内酯类——阿奇霉素10mg/(kg·d) 1次/d口服或静滴；红霉素也可用；停药依据临床症状、影像学及炎性指标，不宜以肺部实变完全吸收和抗体阴性或MP-DNA转阴作为停药指征；8岁以上可选多西环素或米诺环素；重症甲泼尼龙1~2mg/(kg·d)疗程3~5日；合并中枢病变或自身免疫性疾病丙种球蛋白1g/(kg·d)1~2日；支气管镜灌洗清除痰栓并可镜下介入；近年重症支原体肺炎恢复期易实变迁延或遗留闭塞性细支气管炎、闭塞性支气管炎（与急性热程长、合并胸腔积液有关）；鉴别：肺结核、细菌性或病毒性肺炎、衣原体肺炎、百日咳、伤寒、传染性单核细胞增多症、风湿性肺炎。' },
  { m: '25D', q: '衣原体肺炎、真菌性肺炎与肺孢子菌肺炎的要点？', a: '衣原体肺炎：\n病原分4种——沙眼衣原体（CT）、肺炎衣原体（CP）、鹦鹉热衣原体、家畜衣原体；严格真核细胞内寄生、有独特发育周期（具细胞壁、DNA和RNA似细菌，只在细胞内生长似病毒）；\nCP：世界范围40%~90%人群抗体阳性，多见于学龄期和青少年，居感染性肺炎第三、四位；CT：多感染<3个月婴儿（新生儿肺炎常见原因），孕妇宫颈CT阳性率2%~47%，所生婴儿20%~50%发生结膜炎、10%~20%发生肺炎；3/4婴儿无热肺炎为CT所致；孕妇是最直接感染源（垂直传染或眼部感染经鼻泪管进入呼吸道）；\n临床表现：起病隐匿，潜伏期半个月左右，一般不发热，只有轻度呼吸道症状（流涕鼻塞咳嗽），咳嗽持续逐渐加重，1~2周后出现百日咳样阵咳但无回声，可持续3周以上；3个月内婴儿无发热或低热、特征性咳嗽、气促明显、口吐泡沫、中细湿啰音；末梢血嗜酸性粒细胞增多（小婴儿多见）；IgM、IgG、IgA均增高；\nX线：CT肺炎弥漫性间质性病变及斑片状肺浸润伴肺气肿；CP肺炎多单侧下叶浸润（节段性肺炎）；\n诊断：鼻咽拭子涂片吉姆萨染色见碘染胞质内包涵体（敏感性仅35%）；McCoy细胞培养荧光抗体染色（金标准，敏感性70%~80%）；微量免疫荧光法单份血清IgM≥1:16或IgG≥1:512提示急性期感染；\n治疗：大环内酯类首选——婴儿红霉素口服共2周（有效可再延长1~2周），或罗红霉素、阿奇霉素、克拉霉素疗程2~3周；≥8岁可用多西环素；青霉素族及氨基糖苷类均无效；\n真菌性肺炎（侵袭性肺部真菌感染IPFI）：\n主要真菌：假丝酵母菌属、曲霉菌属、隐球菌属、接合菌属（儿童最常见曲霉菌属和假丝酵母菌属），经呼吸道吸入孢子致病；高危因素：早产儿极低出生体重儿、侵入性操作（气管插管留置导管）、血液肿瘤化疗后粒细胞缺乏、糖尿病肾衰竭、长期激素及免疫抑制剂、长期静脉高营养、长期广谱抗菌药物、先天免疫缺陷、AIDS、异基因骨髓移植后；\n假丝念珠菌肺炎：发热咳嗽咯血气促发绀精神萎靡；X线可似粟粒性结核及大片实变灶（可游走性），可有口腔鹅口疮；首选氟康唑，重症及免疫缺陷选两性霉素B、卡泊芬净、米卡芬净及伏立康唑；\n侵袭性肺曲霉病：先天性免疫缺陷（慢性肉芽肿病）、化疗及骨髓移植后（粒细胞缺乏者）；发热咳嗽进行性呼吸困难可咯血；CT早期靠近胸膜结节实变区周围晕轮征（出血性坏死），中晚期胸膜下楔形实变、空洞（空气新月征）；血清半乳甘露聚糖（GM试验）早期诊断曲霉；选伏立康唑、两性霉素B和卡泊芬净；\n血清β-D葡聚糖（真菌细胞壁成分）用于早期诊断肺部侵袭性真菌感染；隐球菌荚膜多糖抗原测定诊断隐球菌肺炎；\n肺孢子菌肺炎（PCP，曾称卡氏肺囊虫肺炎）：\n病原：卡氏肺囊虫（分滋养体与包囊，肺主要寄生部位，包囊经空气传播进入肺内），DNA与真菌同源（肺囊虫属真菌类）；\n与T淋巴细胞免疫功能低下关系密切（CD4≤200/μl时PCP危险大，但此标准对1岁以内不适用）；见于五类患者：早产儿新生儿、先天或继发免疫低下、恶性肿瘤（白血病淋巴瘤）、器官移植免疫抑制剂、AIDS；CMV感染能促进肺囊虫生长；\n病理两型：婴儿间质性浆细胞肺炎（3~6个月体弱婴儿，肺泡间隔增厚以浆细胞浸润为主）；免疫损伤儿童弥漫性脱屑性肺泡炎（肺泡巨噬细胞泡沫样改变，无浆细胞浸润）；\n临床：婴儿型（1~6个月小婴儿，起病缓慢，吃奶欠佳、烦躁不安、咳嗽、呼吸增快及发绀而发热不显著，肺部体征少与呼吸窘迫严重程度不成比例为本病特点，可伴脾肿大，病程4~6周，不治疗25%~50%死亡）；儿童型（免疫低下者，起病急骤几乎所有患者均有发热，食欲缺乏、体重减轻、干咳、发热、发绀、呼吸困难、三凹征，很快呼吸窘迫，未及时治疗病死率70%~100%）；白血病化疗患者一般发生于开始化疗30~100天，多于化疗间歇期；\nX线：双肺弥漫性颗粒状阴影自肺门向周围伸展呈毛玻璃样伴支气管充气像，后期持久肺气肿（肺周围明显）；\n实验室：白细胞正常或稍高，约半数淋巴细胞减少，嗜酸性粒细胞轻度增高；血气显著低氧血症和肺泡动脉氧分压差加大；\n诊断：BALF涂片镜检发现PC包囊或滋养体是金标准（敏感度90%~98%）；乌洛托品硝酸银染色查见直径6~8μm黑褐色囊体；实时定量PCR早期诊断；\n治疗：首选TMP-SMZ（TMP 10~20mg/(kg·d)，SMZ 50~100mg/(kg·d)，分2次口服，连服2周，重症静脉给药）；不能耐受或失败者喷他脒4mg/(kg·d)疗程10~14日；糖皮质激素对中度低氧血症（PaO₂<70mmHg或A-aDO₂>35mmHg）患儿有益；化学预防（TMP 5mg/(kg·d)+SMZ 25mg/(kg·d)分2次，每周连服3日停4日，连用6个月）；病死率国外报告25%~60%，及时治疗治愈率可高达70%。' },
  { m: '25E', q: '反复呼吸道感染（RRTI）的判断条件与病因？', a: '定义：一年内发生呼吸道感染次数过于频繁，超过一定范围；分反复上呼吸道感染和反复下呼吸道感染（支气管炎和肺炎）；国外反复肺炎标准：1年内2次或以上肺炎，或任一时间内3次或以上肺炎（每次肺炎需胸部X线证据）；\n判断条件（2007年修订，连续观察1年）：\n0~2岁：反复上感7次/年，反复气管支气管炎3次/年，反复肺炎2次/年；\n3~5岁：6次、2次、2次；\n6~14岁：5次、2次、2次；\n注：两次感染间隔至少7日以上；上感次数不够可将上、下呼吸道感染次数相加（反之不能）；反复肺炎指1年内≥2次，须肺部体征+影像学证实，两次诊断期间肺炎体征和影像学改变应完全消失；\n病因：除呼吸系统解剖生理特点及免疫功能不成熟外——微量元素和维生素缺乏、环境污染、被动吸烟、入托、母乳喂养、慢性上气道病灶（鼻炎鼻窦炎、扁桃体腺样体肥大、慢性扁桃体炎）；反复上感多与慢性病灶相关；反复下感尤其反复肺炎多数存在基础疾病（1岁以内与先天发育异常关系密切）；\n基础病变九类：①免疫缺陷病（原发性——抗体缺陷为主、联合免疫缺陷、吞噬细胞缺陷、补体缺陷；继发性——营养紊乱、免疫抑制剂、HIV感染、血液病肿瘤、手术外伤）；②先天性肺实质和肺血管发育异常（肺隔离症、肺囊肿、先天性肺气道畸形；肺血管异常致肺淤血反复感染）；③先天气道发育异常（气管支气管软化、支气管狭窄、支气管扩张，喉气管支气管软化最常见——气道内径正常但缺乏软骨支撑，呼气时气道内陷）；④支气管扩张症；⑤先天性心脏病（左向右分流者肺部淤血引起反复肺炎）；⑥原发性纤毛运动障碍；⑦囊性纤维化；⑧气道内阻塞或管外压迫（最常见支气管异物，其次结核性肉芽肿和干酪性物质阻塞，偶见气管支气管原发肿瘤；管外压迫多为纵隔/气管支气管淋巴结结核、肿瘤、血管环畸形）；⑨反复吸入（吞咽功能障碍——智力低下、环咽肌肉发育延迟、神经肌肉疾病、胃食管反流）；\n意大利研究：同一部位反复肺炎最常见基础疾病为右肺中叶综合征及先天畸形（肺隔离症、先天性肺气道畸形）；不同部位反复肺炎常见病因：原发性纤毛运动障碍、囊性纤维化、吞咽功能障碍。' },
  { m: '25E', q: '反复呼吸道感染的诊断思路、辅助检查与治疗？', a: '诊断思路：首先区分反复上感、反复下感或两者皆有；反复上感与免疫功能不成熟或低下、护理不当、入托起始阶段、环境因素、营养因素有关，部分与慢性病灶（慢性扁桃体炎、慢性鼻窦炎鼻炎）有关——进一步检查：血常规、微量元素和免疫功能、鼻旁窦X线、耳鼻喉详细检查；\n反复肺炎：先据胸片区分反复/持续单一部位肺炎还是多部位肺炎；单一部位→第一步支气管镜（异物可达诊断治疗目的，可发现腔内阻塞或先天气道发育异常），支气管镜正常→胸部增强CT+气道血管重建（明确管外压迫、远端支气管腔阻塞、先天性肺发育异常）；多部位肺炎→考虑反复吸入、免疫缺陷病、支气管肺发育异常、先心病、原发性纤毛运动障碍；反复肺炎需与肺结核、特发性肺含铁血黄素沉着症、过敏性肺泡炎鉴别；\n辅助检查：耳鼻喉科检查；胸部CT和气道血管重建（支扩、气道狭窄、气道发育畸形、肺发育异常、血管压迫）；免疫功能测定（注意顽固湿疹、血小板减少、共济失调、毛细血管扩张等异常）；心脏彩超；支气管镜；病原微生物多病原联合检测；特殊检查（疑原发性纤毛运动障碍——鼻、支气管纤毛结构功能检查；疑囊性纤维化——汗氯测定和CFTR基因检测；疑反复吸入——环咽肌功能检查或食管24小时pH监测）；\n治疗：①寻找病因、治疗基础疾病（清除异物、手术切除扁桃体腺样体、治疗气道/肺畸形、免疫调节剂治疗免疫缺陷病）；②抗感染治疗——循证基础上经验性选药+针对病原体药敏的目标性用药，高度疑似病毒者不滥用抗菌药物；③对症处理（祛痰平喘镇咳、雾化）；④合理疫苗接种；⑤合理使用免疫调节剂（微生物制剂、生物制剂、化学制剂、中草药制剂，避免作用扩大化）；⑥去除环境因素、加强营养、坚持母乳喂养、补充微量元素维生素、避免被动吸烟。' },
  { m: '25F', q: '肺不张的病因分类与发病机制？', a: '定义：严格说指出生后肺从未充盈过气体，已充气肺组织失去原有气体称肺萎陷；广义肺不张包括先天性肺不张及后天性肺萎陷；\n儿童病因三类：\n1.外力压迫肺实质或支气管受压迫：①胸廓运动障碍（神经肌肉骨骼异常——脑性瘫痪、脊髓灰质炎、多发性神经根炎【北京以此最常见】、重症肌无力、骨骼畸形佝偻病漏斗胸脊柱侧弯）；②膈肌运动障碍（膈神经麻痹或腹腔内压力增高如大量腹水）；③肺膨胀受限制（胸腔积液、积气、脓胸、血胸、乳糜胸、张力性气胸、膈疝、肿瘤、心脏增大）；④支气管受外力压迫（肿大淋巴结、肿瘤、血管环、囊肿；扩大的左心房及肺动脉压迫左总支气管致左肺不张——北京儿童医院常见肿瘤型支气管淋巴结结核引起者；高位室间隔缺损致肺动脉扩大压迫左总支气管引起全左肺不张；滤泡性支气管炎压迫气道）；\n2.支气管或细支气管内梗阻：①异物（堵塞支气管引起大叶性或肺段性肺不张，堵塞气管或主支气管引起双侧或一侧肺不张）；②支气管病变（气管支气管软化、气道狭窄、支气管黏膜下结核、白喉伪膜延及气管支气管、支气管扩张症）；③支气管壁痉挛、管腔内黏稠分泌物堵塞及塑型形成（肺炎、支气管炎、百日咳、麻疹、囊性纤维性变、原发性纤毛运动障碍、免疫缺陷、新生儿慢性肺疾病、食管闭锁修复术后及哮喘时；冬春季多；阿片阿托品类止咳药减少自然咳嗽且使分泌物变稠加重梗阻不可滥用；哮喘、支原体肺炎和H1N1病毒感染时可合并塑型支气管炎引起肺不张，重症支原体肺炎可因支气管闭塞致肺不张）；\n3.非阻塞性肺不张：①表面活性物质缺乏（Ⅱ型肺泡上皮细胞生成的磷脂蛋白质复合物，起主要作用的是二棕榈酰卵磷脂；缺乏时肺泡表面张力增大——正常肺表面张力6达因/cm²，呼吸窘迫症婴儿可达23达因/cm²，形成微型肺不张；见于早产儿肺发育不成熟、支气管肺炎尤其病毒肺炎致生成减少、创伤休克初期过度换气迅速消耗、吸入毒气或肺水肿破坏变性）；②与肺终末气道神经肌肉结构有关（肺泡管及肺泡囊肌弹力纤维受自主神经控制，剧痛如肋骨骨折及手术、支气管强烈刺激如支气管造影时收缩可造成大片肺萎陷）；③呼吸过浅（手术后、应用吗啡、昏迷与极度衰弱，肺内压力减低不能抗拒局部表面张力时肺泡逐渐关闭，鼓励深呼吸可防止或使关闭肺泡重新开放）；\n儿童肺不张病因以毛细支气管炎、支气管炎、哮喘、支气管淋巴结结核、多发性神经根炎、支气管异物及手术后较多见。' },
  { m: '25F', q: '肺不张的临床表现、诊断与治疗？', a: '临床表现（按范围）：\n一侧或双侧肺不张：起病急，呼吸极为困难，胸痛心悸高热脉速发绀（手术后者多发生在术后24小时内）；体征——同侧胸廓扁平呼吸运动受限、气管及心尖搏动偏向患侧、叩诊轻微浊音、呼吸音微弱或消失、膈肌抬高；\n大叶性肺不张：起病较慢，呼吸困难较少见；上肺叶不张气管移至患侧而心脏不移位，叩诊浊音限于前胸；下叶不张气管不移位而心脏移向患侧，浊音位于背部近脊椎处；中叶不张体征较少难查出；\n肺段不张：临床症状极少不易察觉；儿童肺不张最常见于两肺下叶及右肺中叶；下呼吸道感染多见于左下叶及右中叶；结核性肿大淋巴结多引起右上及右中叶不张；左上叶最少见（先心病扩大左肺动脉压迫左上叶支气管可引起）；\n中叶综合征：由于结核、炎症、哮喘或肿瘤引起的中叶不张，长期不消失，反复感染，最后可发展为支气管扩张；\n肺功能：肺容量减少、肺顺应性下降、通气血流比例异常及动静脉分流、低氧血症；\nX线：均匀致密阴影，占据一侧胸部、一叶或肺段；阴影无结构、肺纹理消失及肺叶体积缩小；一侧或大片肺不张见肋间变窄、胸腔缩小；下叶不张正面胸片呈三角形阴影（位于脊柱与膈肌之间）；上叶不张正侧位均呈楔形（尖端向下指向肺门）；表面活性物质不足造成的微型肺不张肺呈磨玻璃状阴影（与小叶性肺炎无异）；\n病程：肺炎、毛细支气管炎、哮喘及支气管炎所致黏液栓塞或黏膜水肿形成的肺不张时间较短，消炎去肿后即消失；结核病或未取出异物时肺不张较持久；双侧或大面积肺不张常迅速死亡（应立即支气管镜吸出堵塞物+人工呼吸抢救）；\n并发症：长期肺不张继发感染→支气管损害及炎性分泌物潴留→支气管扩张及肺脓肿；\n诊断：X线起主要诊断作用（局限于一肺叶者有时难与肺炎区别，肺CT可鉴别）；必要时支气管镜确定梗阻部位及性质同时可作治疗；肺部超声对心血管外科术后肺不张准确性与胸部CT一致良好；鉴别：肺炎、胸腔积液、肺栓塞；\n治疗：去因疗法（取出异物）；多变动患儿体位或拍背使分泌物排出；对症治疗（支气管舒张剂、消炎药、化痰止喘药）；呼吸困难给氧；不张肺部仍有感染者用抗菌药物（常用二、三代头孢）；必要时支气管灌洗及吸引分泌物；黏液溶解剂链道酶可治疗先心病术后持续肺不张。' },
  { m: '25F', q: '肺气肿、大疱性肺气肿与肺外气肿（纵隔/皮下气肿）的要点？', a: '肺气肿：\n病因两类：①代偿性肺气肿（肺炎、肺不张、脓胸、气胸时健康肺膨胀填补空隙，单纯肺泡膨胀无支气管阻塞，原发病清除后气肿消失）；②梗阻性肺气肿（原因与梗阻性肺不张相同；新生儿婴儿期偶见先天性大叶性肺气肿——气管软骨先天缺欠、支气管畸形、先天性支气管囊肿或异位血管压迫，可伴先心病，偶呈家族性）；\n机制：主支气管或分支气管部分性梗阻时吸气容易进入而呼气受阻（支气管反射性收缩），肺泡容积逐渐增加，终致肺泡壁失去弹性、破裂形成局限性肺气肿甚至自发性气胸；蛋白酶与蛋白酶抑制物失衡是重要发病机制——α1抗胰蛋白酶缺乏症（抗蛋白酶缺乏使蛋白溶解导致肺组织损害）即抗蛋白酶缺乏性肺气肿；\n分型：小叶中心性肺气肿（见于慢性支气管炎）、全小叶性肺气肿（见于α1抗胰蛋白酶缺乏症）；真正肺气肿指不可逆病变；广义肺气肿包括肺过度充气（毛细支气管炎、腺病毒肺炎、哮喘及异物时呼气受阻比吸气严重、FRC增加，病变可逆不伴肺泡破裂，称肺过度充气更确切）；\n肺功能：初期肺活量可正常，残气量和残气占肺总量百分比增高，时间肺活量和最大通气量减低（后期肺活量下降）；主要表现阻塞性通气功能障碍→换气障碍低氧血症→肺血管痉挛→红细胞增多→肺循环阻力增高→肺源性心脏病；\n临床表现：一叶以上肺气肿常有呼吸窘迫；胸部体征——呼吸音减弱遥远或全无、叩诊过清音或鼓音、一侧重度肺气肿时心脏纵隔气管移向对侧、患侧膈肌低平；\n诊断：注意异物吸入、长期咳嗽或哮喘病史；X线透视或摄片——患侧肋间距较大、患区透明度增强、膈肌运动受限顶部扁平位置较低、单侧者心影移向健侧（呼气时显著）、正侧位同时检查；肺CT扫描加气道重建协助诊断及确定气道梗阻部位；鉴别：先天性肺囊肿、肺大疱、气胸；\n治疗：去因治疗（控制呼吸道感染、支气管解痉、祛痰或雾化吸入）及对症（吸氧、强心剂）；缺氧时禁用抑制呼吸作用的药物；先天性大叶性肺气肿应行肺叶切除手术；\n大疱性肺气肿（肺大疱）：下呼吸道感染（肺炎为主）病程中发生；小支气管内累积炎性渗出物，空气能吸入不能呼出，终致肺泡扩大破裂成大泡性肺气肿（或支气管分支炎症坏死破裂，气体经小叶间隙气体通道达胸膜下间隙形成气肿性大泡，单或多房性空腔）；儿童肺大疱80%发生于金黄色葡萄球菌肺炎（北京儿童医院70例中56例），亦见于麻疹肺炎、链球菌肺炎、肺炎链球菌肺炎、大肠埃希菌肺炎及肺结核，外伤后和持续正压机械通气过程中也可发生；体积小无症状，体积大而压力高者致急性呼吸困难；诊断靠多次胸片或肺CT——X线透明区四周有薄壁环状阴影，可含空气和液体（交界处见水平线），透明区可迅速出现及大小改变为本症特点，短期内（数周至数月）自然消失（偶持续数年）；鉴别：结核性肺空洞、肺脓肿、局部气胸或脓气胸、先天性肺囊肿（病变长期存在不自然消失）；预后大多良好，多无需抽吸或手术；\n纵隔气肿：纵隔组织疏松可积储空气；病因——①附贴于血管的肺泡受压过甚（肺气肿或上呼吸道梗阻胸腔负压增大）底壁破裂，空气窜入血管外结缔组织，沿血管外围借呼吸压挤进入纵隔；②支气管破损（结核性淋巴结溃烂、食管异物损伤、支气管镜偶然损伤）；③气管切开不能完全除去呼吸道梗阻时空气由创口吸入到达纵隔；常和气胸同时发生，严重时伴皮下气肿；婴幼儿儿童见于外伤、支气管淋巴结结核、粟粒型肺结核、朗格汉斯组织细胞增生症、支气管异物、支气管哮喘（哮喘急性发作是年长儿纵隔气肿常见原因——文献回顾216例中合并症最常见支气管哮喘22.2%，诱因最常见支气管痉挛49%、其次咳嗽45.6%）；一般不需特殊治疗；\n皮下气肿：病因与纵隔气肿大致相仿；空气进入纵隔，每次呼气时压入颈部软组织再逸入胸部头部腹部皮下（或沿食管大动脉穿过膈肌入腹膜后软组织）；患处皮肤隆起、按摸有柔软带气泡感觉、听诊捻发音；本身无危险性，数日至数星期内渐被血液吸收；治疗只需安静卧息，吸氧可增加气肿部分氧气压使气肿迅速消退；原发病（如急性喉炎）或合并症（如气胸）须及时诊疗。' },
  { m: '25G', q: '支气管扩张症的病因、发病机制与病理？', a: '儿童并非少见，近年高分辨CT广泛应用后明显增多；早期症状轻易被忽视，晚期易误诊为支气管肺炎和慢性支气管炎；\n病因分两大类：\n1.先天性（较少见）：支气管软骨发育缺陷（见于婴儿）；气管支气管肌肉及弹力纤维发育缺陷引起巨大气管支气管症（年长儿）；\n2.后天性：常见于麻疹、百日咳、毛细支气管炎及重症肺炎（尤以腺病毒21、7、3型所致严重肺炎多见）；近年重症支原体肺炎增多，其引起的支扩增加——北京儿童医院研究感染后支气管扩张症最为多见（特别是肺炎支原体感染后），麻疹、结核感染后病例减少；防御功能缺陷——以抗体缺陷为主的原发免疫缺陷病（X连锁无丙种球蛋白血症、普通变异型免疫缺陷病、IgG亚类缺陷、选择性IgA缺乏症）；局部防御异常（原发性纤毛运动障碍）；异物气道梗阻、支气管淋巴结结核、肿瘤、肋骨骨质增生压迫；\n两个根本致病因素：感染及支气管阻塞——支气管阻塞使腔内淤滞分泌物对受炎症损伤软化的支气管壁予以压力→阻塞远端支气管扩张；感染引起剧烈咳嗽使支气管内压升高促进扩张；肺实变或肺不张日久肺纤维化瘢痕收缩牵拉扭曲移位支气管；\n病理：支气管壁弹力组织、肌层及软骨被破坏为纤维组织代替；管腔扩张；纤毛细胞破坏黏膜溃疡形成；支气管动脉和肺动脉阻塞性动脉内膜炎，终末支扩张及吻合，毛细血管扩张形成动脉瘤——为咯血的根本原因；\n形态分两类：①圆柱状（比较局限，见于轻症）；②囊状（分布范围较广，见于重症）；约1/3病例为双侧，单侧者多侵犯左侧；一般扩张部位多在双下叶尤以左下叶多见（左主支气管细长——直径只有右侧的2/3，且在心脏主动脉后方易受其压迫引流不畅）；右中叶支气管易受结核肿大淋巴结压迫或因吸入异物引起肺不张并发支扩。' },
  { m: '25G', q: '支气管扩张症的临床表现、诊断与治疗？', a: '临床表现：①症状——咳嗽、多痰（多见于清晨起床后或变换体位时，含稠厚脓液、臭味不重）；慢性湿性咳嗽超过8周者应注意本病；可有不规则发热、程度不同的咯血、贫血和营养不良；易患上、下呼吸道感染往往反复患肺炎甚至并发肺脓肿；②体征——与肺炎近似但轻重悬殊，有时听诊毫无异常，大多数在肺底可闻及湿啰音；病区范围广者纵隔和心脏因肺不张或病变牵拉移位；营养发育落后、胸廓畸形；杵状指/趾出现早晚不一（最早1~2个月即可发生，病变肺叶切除后自然消失）；上颌窦炎较多见；病情发展可见肝肿大、蛋白尿，可并发肺性肥大性骨关节病；\n影像：轻度X线片只有肺纹理增多；明显时双中下肺大小环状透光阴影呈卷发状或蜂窝状，常伴肺段或肺叶不张及炎症浸润阴影；高分辨CT已代替支气管造影成为确诊主要方法——CT表现：①支气管管腔增宽超过正常1.5倍、管壁增厚；②支气管直径与伴行肺动脉管径比值>0.8（无肺动脉高压时）横切面呈印戒征；③气道由中心向外周逐渐变细的正常走行规律消失，纵切面呈轨道征（胸壁下1cm以内见到支气管影）；HRCT还可显示气道壁增厚（支气管内径<80%外径）、细支气管扩张、黏液栓及树芽征；\n早期诊断线索（出现以下情况注意）：①慢性湿性咳嗽抗感染治疗无效；②重症肺炎病史尤其症状体征或影像学改变不能消失者；③常规治疗无效的哮喘；④百日咳样症状治疗6周无效；⑤反复肺炎；⑥不明原因且持续存在的肺部体征或影像学异常；⑦慢性局限性支气管阻塞；⑧不明原因咯血；⑨呼吸道症状合并任何囊性纤维化、原发性纤毛运动障碍或免疫缺陷病相关症状；高分辨CT确定诊断后还应进一步对病因明确；\n鉴别：肺结核、慢性支气管炎、肺脓肿、先天性肺囊肿、肺隔离症、肺吸虫病等；\n并发症：肺不张区域及扩张支气管常见感染复发，重者肺炎和肺脓肿；\n预后：局限性病变远期预后好；合并哮喘、双侧或广泛支扩及铜绿假单胞菌、真菌感染者预后差；\n治疗：①去除病因、排除支气管分泌物（去除梗阻后扩张的支气管可能重新修复；顺位排痰法每天2次每次至少20分钟；其他气道清理技术——用力呼气技术、呼气正压面罩、口腔呼吸道振荡器、高频胸壁振荡背心、肺内振荡通气；分泌物黏稠可口服或雾化祛痰药后顺位排痰，婴幼儿拍背吸痰）；②抗菌药物（急性发作期积极控制感染；无病原学依据前首选对肺炎链球菌及流感嗜血杆菌有效者如阿莫西林，青霉素过敏者选克拉霉素；据药敏调整，疗程7~14天；是否长期应用有争议；长期小剂量大环内酯类有抗炎作用可减少急性感染）；③中药（清热解毒——蒲公英、板蓝根、银花、连翘、鱼腥草、大青叶；非急性加重期虚弱患儿加当归、黄芪、党参）；④不推荐常规应用吸入糖皮质激素；⑤丙种球蛋白（低丙种球蛋白血症患儿替代治疗，XLA和CVID确诊后早期使用使血IgG>5g/L能有效防止支扩形成）；⑥外科手术——适应证：内科治疗2年以上无效、重症限于一个肺叶或一侧、反复咯血不易控制、病变区屡次复发严重感染药物不易控制或耐药微生物（如曲霉）且健康恶化；切除范围肺段或肺叶；局限性者效果好，弥漫性者手术无法完整切除甚至可能加重病情；⑦肺移植（FEV₁<30%或积极治疗仍迅速进展的呼吸衰竭）。' },
  { m: '25G', q: '原发性纤毛运动障碍（PCD）的要点？', a: '定义：因纤毛运动异常引起一系列临床表现的遗传异质性疾病；儿童期主要表现为反复呼吸道感染、鼻窦炎、中耳炎、支气管扩张、内脏转位等；最初称不动纤毛综合征，后因纤毛可存在运动但频率不一致或无效运动而重新命名为PCD（包括卡塔格内综合征、不动纤毛综合征、纤毛运动方向缺陷）；群体发病率1:40000~1:2200；一般认为是常染色体隐性遗传；\n纤毛结构与功能：纤毛分布于鼻腔至16级支气管表面（鼻旁窦、耳咽管、中耳也有，输卵管、精子及脑室管膜处也有）；大气道最多小气道较少，肺泡囊和肺泡上没有；每个纤毛细胞约200多根纤毛，直径0.1~0.2μm、长3~7μm；电镜横断面呈9+2轴索微管结构（中央一对中央微管，外周均匀环绕9对外周微管）；有效摆动是二联管间有效滑动的结果（蛋白动力臂上ATP酶驱动的机械化学转化）；摆动三状态——静息状态、复原摆动（recovery stroke）、有效摆动（effective stroke）；正常纤毛运动三特点——①周期性和节律性；②方向性；③同步性、协调性和异相性；\n临床表现：发病年龄可自新生儿至成年；随年龄增长加重的反复上下呼吸道感染（复发性中耳炎、鼻窦炎、支气管炎、肺炎以致支气管扩张）；耳道流脓、鼻脓性分泌物、咳嗽咳痰咯血、反复喘息；常误诊为慢性支气管炎、慢性肺炎、哮喘、肺结核；新生儿期表现呼吸急促、咳嗽及不明原因足月儿呼吸窘迫综合征；约50%患儿合并右位心或全内脏转位；可有听力损害、男性不育；英国研究PCD儿童约一半有听力障碍、26%需助听器；\n卡塔格内综合征：PCD的一个类型约占50%；三联症——①支气管扩张；②鼻窦炎或鼻息肉；③内脏转位（主要为右位心）；可有家族史；只具备内脏转位及支气管扩张两项为不全性卡塔格内综合征；右位心儿童如伴频发上感和肺炎应考虑；常合并其他先天畸形（先心病、脑积水、腭裂、双侧颈肋、肛门闭锁、尿道下裂、复肾等）；\n辅助检查：①黏液纤毛清除功能检查（糖精筛查试验、高速摄像显微分析HSVA测纤毛摆动频率及形式）；②电镜检查（鼻黏膜或支气管黏膜上皮，纤毛结构异常——常见蛋白动力臂部分或完全缺失或变短，还可放射辐缺失、复合纤毛、微管异常）；③基因检查（已发现超过40个相关基因，最常见DNAH5、DNAI1、DNAAF1、CCDC39、CCDC40、DNAH11；85%功能缺失突变约15%错义突变）；④鼻呼出气一氧化氮nNO测定（PCD患者nNO明显降低，可用于筛查，但需除外囊性纤维化）；\n诊断：确定诊断——典型病史+以下任1项：①典型纤毛超微结构异常（外动力臂缺失、内外动力臂联合缺失、内动力臂缺失伴微管转位）；②确定的双等位基因致病性突变；高度可疑——nNO明显降低+3次HSVA结果支持PCD（纤毛不动或环形摆动），或nNO明显降低+细胞培养后HSVA支持；约30%患者电镜下纤毛结构无异常（如DNAH11基因突变）需基因检测诊断；排除诊断——仅临床表现但nNO正常或升高、HSVA正常则可能性不大；\n鉴别：继发性纤毛运动障碍（慢性气管炎、肺炎、支扩、哮喘等；可致纤毛大小不等、巨大纤毛；病毒感染致纤毛脱落；吸烟、环境污染、射线、硫化氢、机械通气等）；\n治疗：同一般支气管扩张症——对症（抗感染、雾化吸入祛痰及体位引流、支气管舒张剂缓解喘息）、治疗鼻窦炎及中耳炎；预防其他感染（麻疹、流感）、避免空气污染。' },
  { m: '25H', q: '肺脓肿的要点？', a: '定义：肺实质炎性病变坏死液化形成脓肿，可见于任何年龄；\n病因：主要继发于肺炎，其次并发于败血症；偶自邻近组织化脓病灶（肝脓肿、膈下脓肿、脓胸）蔓延；肿瘤或异物压迫使支气管阻塞继发化脓性感染；肺吸虫、阿米巴等也可引起；病原菌以金黄色葡萄球菌、肺炎链球菌、厌氧菌为多见，其次化脓性链球菌、流感嗜血杆菌、大肠埃希菌、克雷伯菌、铜绿假单胞菌和肺炎支原体；原发或继发免疫功能低下和免疫抑制剂应用均可促发；\n病理：早期肺组织炎症和细支气管阻塞→血管栓塞→肺组织坏死液化形成脓腔→破溃入支气管排出脓痰坏死组织后愈合；靠近胸膜可发生局限性纤维素性胸膜炎；治疗不充分或引流不畅转慢性（腔壁增厚、肉芽纤维组织增生、细支气管受累变形扩张）；少数脓毒栓子经体循环或椎前静脉丛逆行至脑引起脑脓肿；\n临床：起病多隐匿，发热无定型（持续或弛张高热伴寒战），阵发性咳嗽，呼吸增快或喘憋，胸痛或腹痛，盗汗乏力体重下降，婴幼儿多伴呕吐腹泻；脓肿与呼吸道相通→咯出臭味脓痰（与厌氧菌感染有关），可咯血痰甚至大咯血；脓肿破溃与胸腔相通→脓胸及支气管胸膜瘘；\nX线：早期与细菌性肺炎相似；脓肿形成后圆形阴影，与支气管相通则见脓腔有液平面、周围环以炎性浸润；可单发或多发，治疗后残留纤维索条影；慢性者腔壁增厚周围纤维增生可伴支扩、胸膜增厚；\n实验室：急性期白细胞（20~30)×10⁹/L或更高、中性粒细胞增高；慢性期白细胞接近正常可见贫血；脓痰镜检见弹力纤维（证明肺组织有破坏）；\n诊断：靠胸部后前位及侧位X线或肺CT（空洞边缘较厚，周围肺组织炎性浸润；脓肿大小比较稳定短时间变化不大）；B超协助鉴别肺脓肿和脓胸；\n鉴别：肺大疱（壁薄、形成迅速、短时间自然消失）；支气管扩张症继发感染（清晨大量咳痰病史）；肺结核（空洞周围浸润影一般无液平面、常有播散病灶）；先天性肺囊肿（周围肺组织无浸润，继发感染时依2个月后囊腔有无缩小鉴别）；\n治疗：①一般疗法（休息营养、供氧祛痰、体位引流）；②抗生素为主——早期青霉素10万U/(kg·d)，疗程4~6周；青霉素过敏或无效者按痰培养药敏选用（头孢菌素、万古霉素、利奈唑胺等）；可抗生素液雾化吸入或气管滴注；一般疗程3~4周；③中医疗法（肺痈——清热解毒活血化瘀排脓消肿，脓疡散：青黛3g、紫草9g、乳香6g、牙皂6g、寒水石9g）；④多无需手术（合并脓胸可胸腔镜引流；慢性纤维组织大量增生并发支扩、反复感染、大量咯血者手术——发病后4个月到1年内施行为宜）；\n预后：一般良好；异物所致取出异物后迅速痊愈；并发支气管扩张、迁徙性脓肿或脓胸时预后较差。' },
  { m: '25H', q: '肺水肿的病因、发病机制与临床要点？', a: '定义：肺血管外液体增多的病理状态——浆液从肺循环漏出或渗出超过淋巴引流能力时进入肺间质或肺泡腔；基本原因是肺毛细血管及间质的静水压力差和胶体渗透压差间平衡破坏；\nStarling公式：FF=K[(Pcap-Pis)-σ(πcap-πis)]；K滤过系数，Pcap毛细血管静水压（正常约10mmHg），Pis间质液静水压（约-10mmHg），σ反射系数0.8，πcap胶体渗透压（约25mmHg）；肺泡表面张力促使液体从毛细血管到肺泡但一般被肺泡压抵消；\n病因六类：\n1.肺毛细血管静水压升高（血液动力性肺水肿，最重要原因）：①血容量过多（输血输液过多过快，原有心肺功能不全或严重贫血，抗利尿激素分泌过多如重症肺炎及哮喘）；②左心室功能不全、排血不足致左心房舒张压增高（任何型左心衰竭——心律不齐、心肌病、严重主动脉瓣狭窄、二尖瓣病变、急性肾小球肾炎）；肺血流量过多（左向右分流、贫血）；③肺毛细血管跨壁压力梯度增加（间歇正压通气负压相；复张性肺水肿——迅速抽吸大量胸腔积液或气体后萎陷肺膨胀过快，机制为慢性肺萎陷造成肺微血管异常+肺复张机械压力对肺血管影响）；\n2.血浆蛋白渗透压降低（严重肝病、肾病、严重低蛋白血症）；\n3.肺毛细血管通透性增加（中毒性肺水肿/非心源性肺水肿）：内毒素、吸入胃酸或其他酸类、二氧化氮氯光气高浓度氧等有毒气体、休克肺；蛋白进入间质肺泡内遗蛋白铺衬似新生儿RDS透明膜；\n4.淋巴管阻塞（回流障碍，新生儿湿肺多认为是肺淋巴系统清除胎儿肺泡液体障碍而延缓）；\n5.肺泡毛细血管膜气液界面表面张力增高（表面活性物质缺乏时促使液体从血管到间质再入肺泡；肺水肿又使表面活性物质合成减少→恶性循环）；\n6.其他——神经性肺水肿（中枢损伤，脑干触发区激活→交感神经快速放电、血压升高、压力反射诱发心动过缓、静脉回流增强）、高原性肺水肿、革兰阴性菌败血症、呼吸道梗阻（毛细支气管炎和哮喘——加剧的胸膜腔内压、肺泡压负压和肺间质负压）；\n儿童肺水肿多见于重病末期——北京儿童医院所见多发生于急性肾小球肾炎（3425例急性肾炎并发心衰136例中64例并发肺水肿）和风湿性心脏病并发心衰（108例中50例）；\n液体蓄积四期：①间质肺水肿（最早小支气管及肺小动脉周围淋巴管扩张呈套状，临床无症状体征）；②肺泡内新月型积液（液体蓄积毗邻肺泡间隔夹角呈新月状，气体交换尚不受影响）；③肺泡积液（极期，一些肺泡充满液体不能气体交换呈肺内动静脉分流，听诊啰音、X片透光度减低）；④气道泡沫状液体（肺泡内液体泛滥入气道，红细胞使泡沫成粉红色，气体交换严重障碍有死亡危险）；\n临床：胸部不适或局部痛感，呼吸困难和咳嗽为主要症状，苍白青紫惶恐神情，咳泡沫性痰可见少量血液；心音微弱脉搏速而微弱；进展可出现倒气样呼吸、呼吸暂停、周围血管收缩、心跳过缓；X线——间质肺水肿索条阴影（Kerley A线肺门区斜直线条、Kerley B线肺底水平条状），肺泡水肿小斑片状阴影融合成蝴蝶状阴影或双侧弥漫片絮状阴影致心影模糊，可伴叶间及胸腔积液；\n血气：肺顺应性减低首先出现呼吸增快，PaO₂降低，PaCO₂因通气过度可下降（呼吸性碱中毒）；极期缺氧加重可呼吸循环衰竭死亡；\n鉴别：急性肺炎、肺不张、成人呼吸窘迫综合征；\n治疗：目的改善气体交换、迅速减少液体蓄积、去除病因——①改善通气换气缓解缺氧（抽吸痰液保持气道通畅，鼻导管低流量氧，严重时提高吸氧浓度甚至100%氧；机械通气指征——大量泡沫痰呼吸窘迫、吸氧浓度增至50%~60%而PaO₂仍低于6.7~8.0kPa(50~60mmHg)（肺内动静脉分流>30%）、PaCO₂升高；间歇正压通气50%氧PaO₂仍低于8kPa(60mmHg)时用呼气末正压PEEP，从小至大逐渐增加，氧浓度尽量≤50%）；②将水肿液驱回血液循环——快速利尿剂呋塞米（肾外效应血液重新分布，注射5~15分钟后肺毛细血管压降低）、呼气末正压通气（提高平均肺泡压使肺毛细血管跨壁压差减少）、肢体缚止血带及头高位减少静脉回心血量、吗啡（周围血管扩张减少静脉回心血量降低前负荷，减少焦虑降低基础代谢）；③针对病因（高血容量脱水疗法；左心衰用快速洋地黄制剂如乙酰毛花苷、毒毛旋花子苷K；α受体阻滞剂酚妥拉明5mg静注扩张血管；硝普钠静滴减轻心脏前后负荷）；④降低肺毛细血管通透性（激素对非心源性肺水肿——吸入化学气体、ARDS、感染性休克肺水肿有良效，氢化可的松5~10mg/(kg·d)，病情好转及早停用；抗菌药物对感染中毒性有效）；⑤其他（严重酸中毒适当给碳酸氢钠，酸中毒纠正后收缩的肺血管舒张；抗氧化剂清除氧自由基）。' },
  { m: '25H', q: '肺栓塞（PE）的要点？', a: '定义：内源性或外源性栓子阻塞肺动脉引起肺循环障碍的临床和病理生理综合征，包括肺血栓栓塞症（PTE，最常见类型，来自静脉系统或右心的血栓，通常所称PE即指PTE）、脂肪栓塞、羊水栓塞、空气栓塞、肿瘤栓塞等；PE常是深静脉血栓（DVT）的并发症，两者统称静脉血栓栓塞症（VTE）；肺动脉病变基础上（肺血管炎、贝赫切特综合征）原位血栓形成称肺动脉血栓形成（多见于肺小动脉）；\n病理生理：阻塞<50%时通常无临床表现（除非合并肺动脉高压或先心病）；急性阻塞>50%时右心室后负荷显著增加→右室压力增高、肺动脉压升高、右室扩张三尖瓣反流室间隔左移→左室舒张末容积减少→心排血量减少体循环血压下降→大面积PE致心肌缺血、心源性休克甚至死亡；通气血流比例失调→低氧血症、右向左分流、静脉血氧分压降低；血管活性因子释放→血管痉挛肺动脉高压；\n流行病学：住院患儿（8.6~57)/10万，社区儿童（0.14~0.9)/10万；儿童PE占VTE住院患者的11%；年龄双峰分布（1岁以内婴儿及15~17岁伴疾病或多种危险因素的年长儿）；黑色人种儿童危险性为白色人种2.38倍；\n危险因素（Virchow三联症——静脉血流停滞、高凝状态、内皮损伤）：95%儿童VTE有一项或多项潜在疾病；最重要危险因素为中心静脉导管（CVL），其他包括肿瘤（尤其急性淋巴母细胞白血病）、先心病、血管畸形、长期完全肠道外营养、创伤、外科手术/制动、局部感染、肾病、SLE、狼疮抗凝集阳性、镰状细胞病、低血容量、肥胖、脑室分流、药物（雌激素、精氨酸酶）；青少年口服避孕药增加PE机会；遗传因素——抗凝血酶缺乏、蛋白S/C缺乏、V因子Leiden突变、凝血酶原20210基因变异、XI因子缺乏等；\n临床：可无症状至非特异症状、轻~重度低氧血症、右心衰、休克甚至死亡；典型症状——气短、胸膜炎样胸痛、咯血（84%青少年PE有胸痛）；肺栓塞症状：①呼吸困难及气促（活动后明显）；②胸痛（胸膜炎性或心绞痛样）；③晕厥（可为唯一或首发症状）；④烦躁不安惊恐濒死感；⑤咯血（少量）；⑥咳嗽；⑦心悸；大面积或广泛PE引起急性肺心病；体征：呼吸急促、心动过速、血压变化甚至休克、发绀、发热（低热）、颈静脉充盈、哮鸣音和/或湿啰音、胸腔积液体征、肺动脉瓣第二音亢进或分裂P₂>A₂、三尖瓣区收缩期杂音、DVT体征；任何年龄组不能解释的呼吸急促均提示PE可能；\n儿童与成人比较：儿童病理生理以静脉损伤为主（成人血液滞留），栓子来源下肢（30%）上肢右心骨盆肾静脉（成人下肢深静脉95%）；儿童血栓很少自发性（0~4%）；主要危险因素CVL、感染、制动、先心术后（成人冠心病、手术、肥胖、怀孕、口服避孕药）；儿童体征胸膜痛最常见、低氧血症发热心电图异常；诊断方法CTPA（注意射线剂量）；治疗UFH、LMWH、维生素K拮抗剂（少用溶栓）；死亡率10%、复发率7%~18.5%；\n辅助检查：①一般检查（心电图、胸片、动脉血气——不能确诊或除外但有助于除外其他疾病）；②通气-灌注扫描（典型征象——肺段灌注缺损而通气显像正常，两者不匹配；正常灌注可除外PE；先心病血流不平衡可致误诊，需结合胸片CTPA）；③肺血管造影（传统金标准，有创）；④CT肺血管造影CTPA（直接征象——肺动脉内低密度充盈缺损被血流包绕呈轨道征或完全充盈缺损；间接征象——楔形条带状高密度区或盘状肺不张、近端肺动脉扩张远端血管减少；局限性——对亚段及以远端敏感性差）；⑤磁共振增强（准确性似螺旋CT，免离子射线对比剂更安全但昂贵耗时）；⑥心脏超声（直接看到心脏内或中央肺动脉血栓；间接征象——右室扩张、运幅减低、室间隔运动异常、三尖瓣反流、吸气时下腔静脉不能回陷；重症患儿有助于鉴别大面积PE）；⑦下肢静脉超声（诊断DVT，不能确诊或除外PE）；⑧D-二聚体（敏感性高特异性低；36%~40%儿童PE的D-二聚体正常——正常不能排除儿童PE，临床意义不如成人；高度可能者无论结果如何均应影像学检查）；\n治疗：①一般支持（监测呼吸心率血压心电图血气；防止栓子再次脱落——卧床、保持大便通畅；镇静、止痛、对症）；②抗凝（无症状偶然发现PTE存在VTE进展危险因素或复发风险给≥3个月抗凝；亚段PTE有症状给≥3个月；无症状且无下肢近端DVT复发风险低观察、高给≥3个月）；药物——普通肝素、低分子肝素、维生素K拮抗剂（华法林）；③溶栓（适应证——梗阻性心脏内血栓、双侧深静脉血栓、大面积血栓造成急性器官功能不全；tPA体外溶栓强于尿激酶链激酶，对纤维蛋白特异性强免疫原性弱）；④手术（抗凝溶栓失败或禁忌者手术切除血栓）；⑤静脉滤器（预防PE，用于下肢静脉血栓者防止栓子脱落入肺）；\n预后：部分急性PE血栓不能完全溶解→血栓机化→肺动脉内膜慢性炎症增厚→慢性血栓栓塞性肺动脉高压（CTEPH）→右室肥厚右心衰竭；预防——高危人群监测，术后注意液体摄入、鼓励下肢活动、长筒弹力袜或充气长筒靴间歇压迫、避免长期静坐卧床。' },
  { m: '25I', q: '先天性肺囊肿的要点？', a: '机制：胚胎发育过程中一段支气管从主支气管芽分隔出，远端支气管分泌黏液聚积而成；一个支气管芽隔断形成孤立性囊肿，几个同时隔断形成多发性囊肿；支气管源性囊肿多位于纵隔，肺泡源性多位于肺周围部分（肺实质内）；\n病理：分布70%在肺内、30%在纵隔，2/3在下叶，两肺发生率相等；北京儿童医院128例中约90%为单发；分支气管源性（85.2%）、肺泡源性（6.6%）和混合型（8.2%）；约5%合并其他肺畸形（最常见隔离肺）；支气管囊肿壁由支气管壁组织组成（内层柱状上皮及假复层纤毛上皮，外层弹力组织，常有肌纤维、黏液腺或软骨），一般不与支气管相通；肺泡性肺囊肿多无肌纤维、囊腔充满黏液，膨胀后可向支气管破溃沟通（囊内同时存在液体和空气），多为含气囊肿可占一大叶；\n临床：悬殊——小囊肿可无症状（X线检查才被发现），较大囊肿多于继发感染或突然胀大压迫周围组织才出现症状；压迫支气管→喘息、干咳、不同程度呼吸困难甚至发绀；压迫食管→吞咽困难；并发感染→发热、咳嗽、咳痰甚至咯血；张力性含气囊肿多见于新生儿及婴儿——呼吸心率加快、呼吸窘迫、喘鸣发绀、叩诊过清音或鼓音、呼吸音消失、纵隔心脏移位，易合并张力性气胸；\n辅助检查：X线——孤立性液性囊肿界限清晰圆形致密阴影；孤立性含气囊肿圆形/椭圆形薄壁透亮空洞（大者可占半个胸腔，周围肺组织无浸润）；与支气管沟通可见薄壁气液平面囊肿影；多发性囊肿多个环形空腔或蜂窝状阴影分布在一个肺叶内；CT判断囊肿部位、大小及邻近脏器关系；大泡性囊肿与气胸鉴别作增强CT（前者可见肺血管影）；血管造影鉴别隔离肺；后纵隔囊肿有食管压迫症状时钡餐检查；\n诊断与鉴别：反复发作肺部感染病史+X线所见；国内误诊率36.6%~91.2%（平均47.7%）；鉴别——①肺炎后肺大疱（后天性，金葡菌等肺炎后，空腔大小形状短期内多变、出现及消失迅速，先天性者长期存在）；②肺脓肿（壁较厚、周围肺组织浸润和纤维性变）；③肺内良性肿物（结核球、炎性假瘤、肺棘球病、肺吸虫病、肺动静脉瘘）；④大叶性肺气肿（新生儿期急性呼吸窘迫或生后2~3月症状明显，与巨大张力性含气囊肿不易区分，均需手术切除经病理鉴别）；⑤先天性肺气道畸形（与多发性囊肿鉴别困难，均需手术切除）；⑥气胸（空气在胸膜腔、肺组织被推向肺门；肺囊肿含气在肺实质内，肺尖肺底肋膈角仍有含气或萎陷肺组织）；⑦横膈疝（似多发性含气肺囊肿，胃肠钡造影鉴别）；⑧支气管扩张症（双下叶、左上叶舌段及右中叶，高分辨CT）；⑨支气管囊肿（多位于后及中纵隔，偶在肺实质内，多房性，仅术后病理鉴别）；\n治疗：控制感染及准备输血情况下手术治疗，不论年龄大小均可手术；迁延不做易反复感染致严重胸膜粘连；肺叶边缘囊肿作囊肿剥离术，肺叶中部者作肺叶切除术；肺叶切除术后肺功能均正常；咯血时支气管镜了解黏膜情况、查清出血部位除外支气管肿瘤。' },
  { m: '25I', q: '肺隔离症的要点？', a: '定义：先天性畸形，没有功能的胚胎性及囊肿性肺组织，从正常肺分离出来，一般不与大气管相连，供应动脉来自主动脉（胸或腹）分支；\n分型：①叶内型（较多见，占80%~85%）——发生在正常肺叶内，没有胸膜覆盖，大多数位于左下叶（基底部内侧和后部段）；血液供应来自主动脉大分支，静脉回流入肺静脉；多呈含气囊肿，新生儿婴儿期多不显症状，约半数以上病例青春期后方能诊断；X线含气薄壁囊肿与邻近支气管相通出现一至数个空腔（腔中有空气与液平面）；②叶外型（较少见）——与正常肺完全解剖分离，有自己独特的胸膜覆盖（可视为副肺叶），大多数发生在胸腔（部分在膈下）；男性占优势（男女比例4:1）；约60%与其他先天性异常有关（先天性膈疝、先天性肺气道畸形、先天性大叶性肺气肿和/或心脏畸形）；血液供应来自主动脉小分支，静脉流入奇静脉；90%在左侧肺下叶与横膈间，呈不含气球形肿物；约25%出生时出现呼吸窘迫（多在生后6个月内出现）；\n血液供应：76.54%来自胸主动脉，18.47%来自腹主动脉，也可来自肋间动脉、膈动脉、主动脉弓、锁骨下动脉、肺动脉等；20.91%由双动脉或更多动脉供血；\n临床：一般于继发感染后才有症状；叶内型——反复性或持续性进行性肺部感染，似肺炎或肺脓肿，寒战发热咳嗽咳痰咯血，体重减轻，常在2岁以上出现慢性肺炎；叶外型——生后6个月内呼吸窘迫，也可慢性咳嗽、反复肺部感染、进食困难和/或腹痛；\n辅助检查与诊断：X线提供最初线索；B超和彩色多普勒超声已成为筛选常用方法；增强胸部多层螺旋CT（显示异常供血动脉和实质改变）是诊断重要手段——三型表现：①含气体和液体的囊肿或软组织肿块；②围绕囊肿或肿块周围的肺气肿改变；③局限性多血管征；增强MR可多角度多层面成像辨认血管；逆行主动脉造影对确诊有决定意义（判断血管来源、供血动脉发出部位数目行径，为手术方案提供依据）；胸部MRI可多平面成像并有血管流空效应，不用造影剂即能显示供血动脉和回流静脉；支气管造影——隔离肺内无造影剂充盈但周围含造影剂的支气管影像显出其清晰轮廓；支气管镜检查不见脓性分泌物从主支气管流出（即使有感染时）；血和尿儿茶酚胺、皮质醇和醛固酮水平有助于与肾上腺腺瘤、嗜铬细胞瘤等鉴别；\n鉴别：叶内型与先天性肺囊肿及类似疾病鉴别；叶外型与肺肿瘤鉴别；腹膜后肺隔离症与腹膜外肿瘤难鉴别（术前误诊率较高）；\n治疗：手术切除——叶内型做肺叶切除；叶外型可被切除而保全其余肺叶；注意点——供应隔离肺的异常动脉很脆弱且常隐藏于粘连囊中易引起出血，手术时应特别小心细致；术后效果良好。' },
  { m: '25I', q: '先天性肺气道畸形（CPAM）与先天性大叶性肺气肿的要点？', a: '先天性肺气道畸形（CPAM）：\n以前称先天性囊性腺瘤样畸形（CCAM）；少见肺发育异常，约95%的先天性囊性肺疾病由CPAM引起；流行率约1/35000~1/25000活产新生儿；组织学特征——肺实质内出现多个囊肿（肺泡缺乏导致终末细支气管过度增殖和扩张所致），囊肿与正常支气管相连；\n五型（Stocker分型）：0型——起源于气管或支气管，含软骨平滑肌和腺体的气道，不能存活；I型——起源于支气管，约占70%，囊肿通常多室位于一个肺叶内，可见假复层柱状上皮，约半数病例有黏液细胞增生，术后预后良好很少恶变（极少数转化为支气管肺泡癌）；Ⅱ型——起源于细支气管，第二常见，通常伴发其他发育异常（肾发育不全、心血管缺陷、膈疝、骨骼缺陷、食管闭锁），多个小囊肿无占位效应，预后良好无恶变倾向；Ⅲ型——起源于细支气管但比前几型少见，通常累及整个肺叶并压迫其他肺叶，病变多囊实性、病变内无肺动脉，预后良好无恶变倾向；IV型——起源于肺泡，非常罕见，多室薄壁囊肿衬肺泡Ⅰ型或Ⅱ型细胞，易合并I型胸膜肺母细胞瘤；\n临床：差异很大——出生即有呼吸窘迫（严重程度与病变大小、对气道压迫程度相关），或婴儿期无症状但儿童期出现呼吸道感染或恶性肿瘤；0型几乎无气体交换不能存活；I型呼吸费力呼吸急促发绀；Ⅱ型呼吸窘迫伴其他先天异常；Ⅲ型可累及整个肺（肺发育不全可致胎儿水肿）；X线——Ⅰ型和Ⅳ型可见一个或两个大的充气囊肿，Ⅱ型为多个较小充气囊肿（囊泡影），Ⅲ型实性均匀肿块对纵隔有占位效应；\n辅助检查：胎儿超声是产前诊断主要方法（妊娠中期）；出生后有症状者胸CT或MRI；无症状婴儿胸片病变范围大、双侧、多灶囊肿或气胸者建议立即胸CT/MRI；无症状或胸片正常者6个月时检查；\n鉴别：肺隔离症、先天性膈疝、肺囊肿、先天性肺气肿和肺大疱；\n治疗：产前诊断有胎儿水肿风险者可在分娩前处理（胎儿手术、应用糖皮质激素或引流）；产后呼吸窘迫者手术切除是首选；病变占半侧胸部20%以上、双侧病变或多灶囊肿、气胸或有胸膜肺母细胞瘤家族史的婴儿建议手术切除；症状轻微年长儿为防止反复感染或恶变（特别是IV型）也要切除；无症状者是否手术尚有争议；预后总体良好（有产前病变消失的报道），存在胎儿水肿则存活率下降；I型预后最好，Ⅲ型常出现并发症如肺动脉高压，IV型术后预后良好但易出现胸膜肺母细胞瘤；\n先天性大叶性肺气肿（CLE）：\n少见下呼吸道先天发育异常，约占先天性肺畸形的10%；一叶或多叶肺气肿压迫周围组织→进行性呼吸困难、喘息、发绀、呼吸窘迫甚至危及生命；男多于女约3:1；\n病因：50%特发性；另一半分内在原因（支气管软骨发育不良或缺陷、支气管软化、黏液阻塞、黏膜过度增生、支气管闭锁和支气管扭转）和外在原因（压迫支气管的病变或异常——心肺血管、囊肿和纵隔肿瘤）；\n发病机制：支气管部分梗阻——吸气时空气易入肺泡，呼气时支气管收缩加压缩肺部力量不强，肺泡容积因积气逐渐增加，终致肺泡壁失去弹性，严重者破裂形成局限性肺气肿；蛋白酶与蛋白酶抑制剂失衡是重要因素；\n病理：肺体积增大充满空气伴散在肺不张；镜下肺间隔正常仅肺泡扩大；3种病理类型——①肺泡数目明显增多（可达正常5倍，局部肺泡过度生长发育）；②肺泡发育和数目正常仅局部肺气肿；③肺发育不全伴局部肺气肿；\n临床：约1/4生后即出现症状，84%症状发生在生后第1个月，仅5%在6个月以后发病；一般无前驱感染史；新生儿期迅速出现呼吸困难、喘息或喘鸣、负荷性青紫或持续性发绀、刺激性咳嗽，进而呼吸窘迫甚至危及生命；稍迟发病者进食喂养困难、呼吸心率增快；气管及心脏向健侧移位；胸廓不对称患侧稍隆起，叩诊鼓音呼吸音减低，可有哮鸣音及啰音，心尖移动移位；X线——受累肺叶透亮区增大但肺纹理仍存在（与大叶性肺气肿鉴别要点），可伴肺不张（最常见左上叶，其次右中叶）；过度膨胀肺叶可压迫同侧或邻近肺泡（横膈下降或纵隔移位），还可疝入对侧；新生儿早期可因胎儿时期肺内液体引流不畅暂时不显示病变，数日后才出现；放射性核素扫描受累肺实质灌注减少；心导管检查和心血管造影显示压迫支气管的异常肺动静脉及先心病并存；部分病例伴先心病；鉴别：先天性支气管肺囊肿和肺炎后肺大疱；\n治疗：一旦确诊须急诊手术切除气肿肺叶（手术危险性较大但切除后恢复较快效果较好；伴先心病或严重呼吸道症状不视为手术禁忌）；胸腔穿刺排气可为手术争取时间；手术病死率低于5%；术后随访均无症状及并发症，生长发育无障碍。' },
  { m: '25J', q: '支气管肺发育不良（BPD）的要点？', a: '历史：Northway等1967年首次提出——继发于严重新生儿RDS、孕周30~34周出生的早产儿，命名为传统BPD；随产前糖皮质激素应用、PS替代治疗及机械通气方式改进，目前更常见新型BPD；2001年NICHD/NHLBI研讨会一致通过采用BPD命名；\n定义：超过28天的婴儿需要补充氧气，和/或校正胎龄36周仍有氧依赖——轻度（未用氧）、中度（FiO₂<30%）、重度（FiO₂≥30%或需机械通气）；胎龄>32周者根据出生56天或出院时需氧程度分轻中重度；2018年NICHD再次修订——增加需影像学证实肺实质疾病证据及基于无创通气模式的严重程度分级（<32周胎龄早产儿存在持续性肺实质疾病并由影像学证实；校正胎龄36周时根据连续3天维持SpO₂ 90%~95%范围内的FiO₂判断，分Ⅰ~Ⅲ级，Ⅲ为严重BPD）；\n发病机制：极其复杂，涉及产前、产时及产后多种因素——早产、氧中毒、气压伤或容量伤、宫内和出生后感染和炎症反应、出生后营养、肺血管异常、遗传易感性；最强烈高危因素是早产和低出生体重；本质是遗传易感性基础上产前产后多因素对早产肺造成损伤；感染和炎症反应是重要因素；\n病理：肺泡化减少、囊性肺气肿、纤维化和气道损伤；以肺泡和肺血管发育不良为主要特征——肺泡数目减少、体积增大、肺泡结构简单化、肺血管形态异常、肺泡间隔增厚和纤维化；\n病理生理：解剖改变导致气体交换和肺力学异常——①中央气道问题（气管软化、声门下狭窄、囊肿、肉芽肿及支气管软化）；②小气道问题（气道结构重塑——黏液腺增生、上皮损伤水肿、平滑肌细胞增生、支气管收缩及气道高反应）；③远端气腔和脉管系统异常（肺泡化和血管生长减少、异常血管重构、淋巴功能结构受损）；④其他（呼吸控制异常、呼吸睡眠障碍、胸壁稳定性异常、膈疝）；\n临床表现：早产儿透明膜病后迁延不愈或好转后又出现持续喘息和呼吸困难（运动后明显），肋间隙凹陷，肺部湿啰音和哮鸣音，可有呼吸暂停发作，病程迁延数周至数月，患儿生长迟缓或停滞；严重者出现肺动脉高压和呼吸衰竭；气道软化和吞咽功能异常→反复吸入性肺炎；染色体或基因突变者可有多器官异常（发育迟缓、肌力肌张力低下或肌肉强直、先心病等）；血气——低氧血症和/或高碳酸血症；恢复者1~2岁内常有反复呼吸道感染致病情加重；\n影像：肺纹理粗乱、支气管壁增厚、索条阴影、囊泡或肺气肿、肺不张及密度减低区、血管阴影减少；重症有肺动脉高压；常有气管软化征象，有时合并吸入性肺炎；\n鉴别：间质性肺疾病（尤其肺泡蛋白沉积症）、巨细胞病毒感染、衣原体感染、肺孢子菌肺炎；\n治疗：无特殊治疗——糖皮质激素长期治疗效果尚无一致结果，不常规推荐吸入和口服；喘息者用支气管扩张剂；合并气管软化者预防误吸（教育家长正确喂养方式）；合并肺动脉高压者相应治疗；据病情轻重应用鼻导管吸氧或无创气道正压（尤其合并气管软化者）补充氧气（家庭内吸氧指征尚不统一）；注意营养补充；预防反复呼吸道感染、适当接种疫苗。' },
  { m: '25K', q: '特发性肺含铁血黄素沉着症（IPH）的病因机制与流行病学？', a: '定义：一组肺泡毛细血管出血性疾病，常反复发作，以大量含铁血黄素积累于肺内为特征；多发于儿童及青少年；弥漫性肺泡出血特征为咯血、呼吸困难、胸片肺部渗出和程度不同的贫血；肺泡巨噬细胞在肺出血36~72小时内把血红蛋白的铁转换为含铁血黄素（故命名），含铁血黄素细胞在肺内存在4~8周；弥漫性肺泡出血原因很多（SLE、ANCA相关血管炎等），特发性者指无特殊原因的弥漫性肺泡出血；\n流行病学：瑞典发病率0.24/万，日本1.23/万；西方国家少见但希腊、美国克利夫兰和波士顿曾有地区性小流行；北京儿童医院2001—2011年349例儿童间质性肺疾病中IPH占113例（32.3%），为常见间质性肺疾病之一；成人发病率低（多认为属儿童期未诊断明确的病例，大多数30岁前被诊断）；近年死亡率明显下降（3%~7.3%，法国25例患儿五年生存率86%），主要得益于激素及免疫抑制剂使用；\n发病机制五种假说：\n1.免疫机制：抗原-抗体复合物介导肺泡自身免疫性损伤→肺泡毛细血管通透性增加→肺小血管出血；电镜见肺泡毛细血管壁及肺泡基底膜内皮细胞同时受损（与自身免疫性肺疾病共同点）；约1/4 IPH患者患病10年后并发不同种类自身免疫性疾病（类风湿关节炎、乳糜泻等）；激素及免疫抑制剂治疗良好反应支持免疫机制；\n2.遗传机制：母子及同卵双胞胎同时患病多次报道；希腊26例患儿中13例家族住在有近亲通婚习俗地区；但至今未发现明确相关基因序列；\n3.过敏机制：牛奶过敏引起的肺泡出血（Heiner综合征）患儿血清检测到抗牛乳蛋白自身抗体，免牛乳蛋白饮食后症状明显缓解；至少10例IPH患儿并发乳糜泻（血清麦胶蛋白IgG、IgA抗体滴度增高，部分免麸质饮食后缓解）——与牛乳、麸质过敏相关；\n4.环境影响：美国发现居住环境与婴幼儿肺泡出血有关——葡萄状穗霉菌产生单端孢霉烯毒素（强烈蛋白质合成抑制物，在上皮细胞基底膜快速形成过程中使毛细血管变脆弱面临应力出血风险）；黑葡萄穗霉属溶血素也起作用；IPH发生与暴露于杀虫剂有关；\n5.铁负荷机制：反复肺泡出血使铁过多负荷于肺组织，将氧化物和过氧化物转化为活性高的羟自由基→脂质层蛋白和碳水化合物降解→促使肺纤维化形成；另有BALF中MMP-9及其组织免疫抑制剂TIMP-1异常增高且比例失衡（MMP-9有降解基底膜作用）参与肺泡基底膜破坏和肺纤维化。' },
  { m: '25K', q: 'IPH的临床分期、辅助检查与诊断？', a: '临床表现：高发年龄10岁以下（通常多1~7岁）；急性反复发作性咯血、慢性咳嗽和呼吸困难、乏力或仅为无症状的贫血；\n临床三时期：①急性出血期（肺泡出血期）——发病突然，面色苍白伴乏力体重下降，咳嗽、痰中带血丝或暗红色小血块，低热、呼吸困难、呼吸急促甚至呼吸衰竭，严重者血红蛋白急剧下降；肺部体征可无阳性体征，亦可闻呼吸音减弱或支气管呼吸音，少数干、湿性啰音或喘鸣音；②慢性缓解期——常无明显临床症状，急性期症状逐渐恢复、不同程度的贫血面色苍黄；长期贫血可致心脏增大及肝脾肿大；长期缺氧可致杵状指/趾；③静止期或后遗症期——静止期指肺内出血已停止无明显症状；后遗症期指反复出血已形成较广泛的肺间质纤维化（多年发作病史及不同程度肺功能不全，小支气管不同程度狭窄扭曲，反复发作多年儿童可有通气功能障碍；可见肝脾肿大、杵状指/趾及心电图异常）；\n病理三分期：急性期——肺组织棕黄色实变，肺泡上皮细胞增生，肺泡腔内不同程度出血（系肺泡小毛细血管出血所致，很少来自较大血管），肺泡水肿甚至透明膜形成，急性出血后48小时开始可见含铁血黄素在巨噬细胞内，肺门淋巴结出血肿大滤泡增生；慢性期——肺泡间质大量含铁血黄素沉着、纤维组织增生，小叶间隔及肺泡壁增厚（病变多双侧性但分布可不平均不对称），反复发作后期部分肺泡壁断裂、弹力纤维包裹含铁血黄素形成异物肉芽肿；后遗期——广泛间质纤维化，电镜示肺泡毛细血管基膜失去正常结构、灶性破裂、胶原纤维沉积；无血管炎、毛细血管炎、肉芽肿形成或任何特异性免疫复合物沉积；\n实验室：①血常规——急性期不同程度小细胞低色素性贫血（北京儿童医院入院时重度贫血Hb 30~60g/L约占1/3、中度60~90g/L占45%）；网织红细胞增加（最高23%，超过3%的占70%）；部分病例嗜酸性粒细胞增加（超3%约占1/3）；血小板正常，血沉多增快；②急性发作期血清胆红素增加、尿胆原阳性；直接库姆斯试验、冷凝集试验、嗜异性凝集试验偶阳性；大便潜血多阳性；血清铁浓度仍低水平（肺内铁质禁于巨噬细胞中不能利用于造血）；法国队列——40% ANCA阳性、45% ANA阳性、28%特异性乳糜泻抗体阳性；\n影像：急性期胸片或肺CT双侧弥漫性实变影或磨玻璃影（多出现于肺底，多于2~4天内明显吸收）；慢性反复发作期弥漫性粟粒状影和细网状影（多双侧，较多见于两肺中野内带，肺尖及肋膈角区很少受累，可并存新鲜出血灶）；HRCT显示弥漫小结节影和小叶间隔增厚（典型影像显示病程已久，一般6~12个月）；晚期肺间质纤维化呈蜂巢样囊泡影；HRCT能更早期识别肺纤维化；\n痰胃液BAL检查：含铁血黄素巨噬细胞（HLMs）——巨噬细胞转变为含铁血黄素细胞需2~3日，14日时达峰值，4~8周后降至正常；胃液及痰涂片阳性率36.5%与44.4%（联合57.1%均低于60%），BALF阳性率82%~92%；BALF找到大量HLMs可作为弥漫性肺泡出血诊断依据；\n肺功能：后期继发性肺纤维化——FEV₁、VC减低，FEV₁/VC正常或减低，TLC减低及弥散功能减低；急性肺泡出血期DLco弥散功能可显著升高；\n心电图与超声心动图：协助诊断二尖瓣狭窄、左心房高压、肺循环淤血所致的继发性肺含铁血黄素沉着症；如提示肺血管高压应注意继发因素（肺静脉闭塞、毛细血管瘤等检查）；\n诊断依据：①反复发作的咳嗽、气促，伴或不伴咯血；②不明原因的小细胞低色素性贫血；③胸片或CT提示弥漫性肺实质浸润和肺间质改变；④BALF中找到大量含铁血黄素细胞（>肺泡巨噬细胞总数的30%），或痰、胃液可以找到含铁血黄素细胞；⑤肺组织活检为诊断金标准（可见含铁血黄素沉积及不同程度肺纤维化；排除小血管炎）；⑥排除其他原因引起的弥漫性肺泡出血和咯血（SLE、ANCA相关血管炎、肺结核、支气管扩张症、反复支气管肺炎、代谢性疾病以及血管畸形等）；近年国外学者主张诊断IPH前还是应该做肺活检（有的患儿初诊血清学自身抗体阴性之后阳性；1/3弥漫性肺泡出血患儿血清学未找到自身抗体但肺活检显示血管炎）；\n鉴别：出血性体质、血液病、异物、肺结核、反复支气管肺炎、支气管扩张症、血管畸形；螺旋肺CT血管成像显示肺静脉缺如或闭塞；遗传性毛细血管扩张症做肺活检或基因检测识别。' },
  { m: '25K', q: 'IPH的治疗与预后？', a: '治疗分急性出血期和缓解期：\n1.急性发作期：\n(1)支持治疗——卧床休息、输血、吸氧或机械通气；吸痰防止血液吸入引起窒息；继发感染时抗感染；呼吸困难及血红蛋白急剧下降时卧床休息、间歇正压供氧，严重贫血者少量多次输新鲜血；\n(2)糖皮质激素——控制肺泡急性出血的一线药物，快速有效控制肺部活动性出血；最常用甲泼尼龙2mg/(kg·d)，出血控制后口服泼尼松2mg/(kg·d)；维持足够4周后剂量渐减；急性肺泡大出血时大剂量甲泼尼龙10~30mg/(kg·d)冲击治疗可控制病情、挽救生命；\n2.慢性反复发作期：\n(1)糖皮质激素——急性出血控制后激素足量维持4周后减量，至最低维持量（以能控制症状为标准）；维持时间过去多为3~6个月；小剂量激素长期维持也取得不错疗效；症状较重、X线病变未静止及减药过程中反复者应调整激素用量，疗程延长至1年或2年；停药过早易复发；长期维持治疗激素副作用逐渐凸显（如生长受限）；吸入激素疗效尚未确定，不建议单独使用；\n(2)免疫抑制剂——反复发作患者加用；常用环磷酰胺、硫唑嘌呤和羟氯喹；硫唑嘌呤联合糖皮质激素可能是最好的治疗方案（尤其预防急性加重）；剂量——羟氯喹6.5mg/(kg·d)口服（不超过400mg/d）；硫唑嘌呤2~3mg/(kg·d)（起始1mg/(kg·d)，每周增加0.5mg/kg至2.5mg/(kg·d)或有治疗反应，成人最大150mg）；环磷酰胺5~10mg/kg静脉注射每2~3周1次（不超过成人500~1800mg/次）；治疗期间监测外周血白细胞、肝肾功能；\n预后：北京儿童医院追踪——多死于反复性肺部大量出血或呼吸衰竭（20世纪70年代以前病例居多）；决定预后关键在于尽早控制急性发作、减少复发次数；应寻找每个患者的肾上腺糖皮质激素最小有效量，减少激素并发症，并找出合适的停药时机，切不可草率停药方能减轻肺纤维化过程。' },
  { m: '25L', q: '什么是儿童间质性肺疾病（chILD）？其分类框架（2013年ATS指南）如何划分？', a: '间质性肺疾病（ILD）是以影像学弥漫性渗出和气体交换障碍为特点的慢性肺疾病，病变主要发生在肺泡壁，可发展为间质纤维化乃至蜂窝肺，有200多种类型；儿童ILD缩写chILD，特点为呼吸急促、呼吸困难、爆裂音、缺氧及生长发育受影响，2/3发生在小于2岁的儿童。\n2013年ATS分类：\n一、婴儿特有的ILD四亚类：①弥漫性肺泡发育障碍（肺腺泡不发育、先天性肺泡发育不良、ACDMPV）；②肺泡生长异常（肺发育不良、慢性新生儿肺疾病、染色体病、先心病）；③未知原因特殊类型（NEHI、PIG）；④表面活性物质功能障碍（SFTPB、SFTPC、ABCA3突变，组织学可为PAP、CPI、DIP、NSIP）。\n二、非婴儿特有的ILD：①既往体健患儿（感染/感染后、环境因素、吸入综合征、嗜酸细胞性肺炎）；②免疫缺陷患儿（机会性感染、移植排异等）；③与全身疾病相关（自身免疫病、蓄积病、结节病、朗格汉斯细胞组织细胞增生症、肿瘤）；④类似ILD的疾病（肺血管淋巴管异常、肺动脉高压、先心病等）。\n三、不能分类的ILD（终末阶段、活检标本不合适、信息不足）。' },
  { m: '25L', q: '儿童间质性肺疾病的诊断程序有哪些？（确诊金标准、ChILD综合征四条标准、各项检查要点）', a: '肺活检是诊断ILD的金标准，也是分类分型依据。小于2岁婴幼儿可用"ChILD综合征"定义：未知原因肺疾病前提下，①呼吸道症状（咳嗽、气促、活动不耐受）②体征（静息气促、啰音、杵状指/趾、生长迟缓、呼吸衰竭）③低氧血症④胸片或CT弥漫性异常，四条中至少三条即可临床诊断。\n检查程序：\n1. 影像学：X线弥漫网点状阴影或磨玻璃影；HRCT可见磨玻璃影、网状影、实变影、结节影；铺路石征提示肺泡蛋白沉积症；右中叶和左舌叶磨玻璃影+呼吸快高度提示NEHI。\n2. 肺功能：限制性通气功能障碍（VC、TLC、DLCO降低，FRC/TLC和RV/TLC增加）。\n3. 侵入性检查：BALF（"液体肺活检"）——含铁血黄素细胞确诊肺泡出血；PAS阳性助诊PAP；CD1a>5%助诊朗格汉斯细胞组织细胞增生症；CD8↑提示过敏性肺泡炎、CD4↑提示结节病；肺活检以VATS最佳（创面小、取材理想）。\n4. 基因筛查：SFTPB、SFTPC、ABCA3、TMEM173、GATA2、COPA、STAT3/5b等。\n5. 血清标志物：KL-6增高反映肺泡壁损伤和间质纤维化。' },
  { m: '25L', q: '特发性间质性肺炎（IIP）2002年ATS/ERS七型分哪些？各自要点？其他原因的ILD有哪些？', a: '七型（需临床-影像-病理CRP诊断）：\n1. UIP/IPF（特发性肺纤维化）：时间和空间均异质性纤维化，纤维母细胞灶为必需条件；多见于60岁以上，干咳气短、50%杵状指、velcro啰音；预后差，死亡59%~70%，平均生存2.8~6年；吡非尼酮、尼达尼布可减缓FVC下降。\n2. NSIP（非特异性间质性肺炎）：病变时相均一（与UIP对比强烈），分富于细胞型50%、混合型40%、纤维化型10%；激素效果好，5年病死率15%~20%。\n3. BOOP/COP（隐源性机化性肺炎）：终末细支气管、肺泡管及肺泡内疏松结缔组织渗出（Masson小体），游走性斑片状肺泡浸润影；激素反应好。\n4. AIP（急性间质性肺炎）：弥漫性肺泡损害，分渗出期和机化期，类似ARDS；死亡率50%~88%。\n5. RBILD（呼吸性细支气管炎伴间质性肺炎）：与吸烟有关，含色素巨噬细胞局限于呼吸性细支气管区域。\n6. DIP（脱屑性间质性肺炎）：肺泡腔内大量巨噬细胞均匀分布，广泛磨玻璃改变不出现蜂窝变；小儿多由SP-C和ABCA3突变所致，预后差。\n7. LIP（淋巴间质性肺炎）：成熟淋巴细胞浸润，儿童多与HIV、EBV感染有关；约5%转化为淋巴瘤。\n其他原因ILD：过敏性肺炎（外源性变应性肺泡炎，IV型变态反应为主，CD8淋巴细胞增加，脱离过敏原+激素）、嗜酸细胞性肺疾病（单纯性肺嗜酸细胞浸润症Löffler综合征——游走性浸润、热带嗜酸粒细胞增多症、ABPA、EGPA、HES）、类脂性肺炎（外源性吸油，内源性即胆固醇肺炎）、肺泡微石症（SLC34A2基因突变，常隐遗传，砂暴样/白肺样改变，无特殊治疗）。' },
  { m: '25L', q: '肺泡性蛋白沉积症（PAP）与遗传性表面活性物质功能障碍疾病（SP-B、SP-C、ABCA3、NKX2-1）的要点？', a: 'PAP：肺泡内PAS染色阳性富脂质蛋白物质沉积；儿童三型：遗传性、原发性（抗GM-CSF抗体）、继发性；X线蝴蝶状肺水肿样改变但无K-B线，CT铺路石征，BALF乳状PAS阳性；原发性用GM-CSF替代治疗，支气管肺泡灌洗有效（乙酰半胱氨酸+肝素盐水），激素无效。\n遗传性表面活性物质功能障碍：\n1. SP-B缺乏症：常隐，SFTPB基因（2号染色体），121ins2突变占70%，发生率约1/100万活产儿；足月儿生后RDS、快速进展，唯一有效治疗是肺移植，不移植几乎均死亡，对表面活性物质替代仅一过性反应。\n2. SP-C基因异常：常显（不同外显率），最常见I73T突变与25%疾病相关；表现多样（新生儿RDS至成年ILD），病理NSIP/DIP/PAP/CPI，部分自行改善或激素有效，预后难预测。\n3. ABCA3缺乏症：常隐，16p13.3，200多种突变，E292V最常见；位于板层小体内运输表面活性物质磷脂；小婴儿表现PAP和DIP，电镜板层小体异常（煎蛋样致密体）；未肺移植也可存活到第二个十年。\n4. NKX2-1/TTF1单倍剂量不足：常显，"脑-甲状腺-肺"综合征，约一半患者有三联症；调节SP-A/B/C和ABCA3表达。' },
  { m: '25M', q: '闭塞性细支气管炎（BO）的病因、病理分型、临床表现、诊断与治疗？', a: 'BO是由小气道炎症病变引起的慢性气流阻塞综合征，病理诊断，病变累及直径小于2mm的细支气管和肺泡小管，以持续咳嗽、喘息为特点。\n病因：感染最常见——腺病毒（最常见）、麻疹病毒、肺炎支原体（另一重要原因）；腺病毒肺炎5年随访近半数发展为BO；腺病毒毛细支气管炎和机械通气是较强的独立危险因素；其他有胃食管反流、肺/造血干细胞移植后、Stevens-Johnson综合征。\n病理两型：①狭窄性细支气管炎（黏膜下纤维化致管腔向心性狭窄闭塞，不可逆，感染后BO多为此型）；②增生性细支气管炎（管腔内肉芽组织阻塞，即BOOP/COP，激素反应好）。\n诊断：临床结合——急性感染或肺损伤后持续气促、喘息或咳嗽6周以上，喘鸣音对β激动剂反应差；HRCT：支气管壁增厚、支气管扩张、马赛克灌注（ Mosaic灌注）、气体滞留（呼气相气体滞留对BO更有诊断意义）、肺不张、黏液栓；肺功能阻塞性通气障碍（FEF25%、FEF75%显著下降，可<预计值30%）；肺活检是金标准但受取材限制。Fischer标准：<3岁、急性支气管炎或肺炎史、急性期后持续气道阻塞、2周以上全身激素+支扩剂无效、CT见马赛克灌注及气体滞留、除外结核/CF等。\n鉴别：感染后气道高反应（症状反复非持续、影像改变缺乏、对支扩剂反应好、预后好）；BOOP（限制性障碍、激素反应好但易复发）；弥漫性泛细支气管炎（鼻窦炎、脓痰、小叶中心结节、小剂量红霉素特效）；BPD（早产史）。\n治疗：无特效。激素（甲泼尼龙2mg/kg·d或泼尼松1~2mg/kg·d，总疗程不超6个月；重者冲击：甲泼尼龙30mg/kg·d×3天，每30天1次×3个月）；大环内酯类（红霉素5~10mg/kg·d，6个月~2年；阿奇霉素10mg/kg·d每周3次，BALF中性粒细胞>15%者有效）；孟鲁司特辅助。预后不佳：9.7%死亡，67.7%留有后遗症，感染后BO多为慢性非进展性，症状1年渐改善但影像学和肺功能异常持续。' },
  { m: '25M', q: '滤泡性细支气管炎（FB）与婴儿神经内分泌细胞增生症（NEHI）的要点？', a: '滤泡性细支气管炎：非肿瘤性支气管周围淋巴组织增生（多克隆），病因成人1/3与结缔组织病有关，另有HIV、免疫缺陷、感染后（儿童报道均为感染后）；病理为支气管周围淋巴组织过度发育压迫支气管腔；儿童特发型均6周龄内发病、6~18个月症状达高峰（呼吸快、咳嗽、爆裂音、间质改变），与NEHI有重叠，预后好、2~3岁改善；确诊靠肺活检+免疫组化（排除克隆性重排），治疗激素（泼尼松1~2mg/kg·d）或大环内酯类。\nNEHI：chILD的一种类型，病因不明（可有家族性，与NKX2.1杂合突变有关）；临床生后3~8个月发病（80%足月儿），慢性呼吸快、三凹征、爆裂音、早期低氧血症，可伴生长落后，无杵状指；HRCT特征：磨玻璃影主要累及右中叶和左舌叶（特征性！）+气体滞留（马赛克灌注）；诊断标准（铃蟾素bombesin免疫组化）：①NECs存在于至少75%的气道②每气道中NECs占10%以上③NEBs增多增大④无其他气道和间质疾病；肺功能阻塞性障碍；治疗为支持治疗（氧疗+营养），激素无效；良性过程，1~2年后多改善，无死亡病例。' },
  { m: '25N', q: '胸膜炎分哪三型？干性、浆液性、化脓性胸膜炎（脓胸）的要点？渗出液与漏出液如何鉴别？', a: '胸膜炎分3型：干性（纤维素性）、浆液纤维素性（渗出性）、化脓性（脓胸）。\n干性胸膜炎：肺部感染侵及胸膜（细菌性肺炎或肺结核），病变局限脏层胸膜，无或很少渗出；症状为胸痛（可牵涉腹、肩、背，深呼吸及咳嗽加剧），患儿喜患侧卧，体征为呼吸运动受限、呼吸音减弱及胸膜摩擦音（全呼吸期可闻，借此与啰音区别）；X线见患侧膈运动减弱、肋膈角变钝；治疗原发病+镇痛。\n浆液性胸膜炎：病因多结核性、支原体性；初似干性胸膜炎，数天后出现积液，量大时咳嗽胸痛减轻而呼吸困难加重；体征：患侧肋间隙饱满、气管纵隔心脏向对侧移位、语颤减弱、叩诊实音/浊音、呼吸音减弱消失。\n漏出液vs渗出液：漏出液——色淡黄清稀不凝，比重<1.016，白细胞<0.1×10⁹/L，蛋白<25~30g/L，积液蛋白/血清蛋白<0.5，LDH<200U且比值<0.6，黏蛋白试验阴性，多见于心衰、肾病、肝硬化、低蛋白血症，常双侧；渗出液——混浊易凝，比重>1.016，细胞数>0.5×10⁹/L，蛋白>25~30g/L，比值>0.5，糖低于血糖，LDH>200U且比值>0.6，黏蛋白（Rivalta）阳性，溶菌酶>20μg/ml，限单侧。血性积液见于结核、脓胸、肿瘤、结缔组织病、肺栓塞；乳糜性积液与胸导管畸形/受压有关。\n化脓性胸膜炎（脓胸）：婴幼儿最多见，2/3由肺炎发展而来；病原以肺炎球菌和金黄色葡萄球菌为主（金葡脓液最稠厚、堵塞小气管与多房形成最多；链球菌脓液稀薄少粘连）；脓液外观推测病原：黄色→葡萄球菌，黄绿色→肺炎球菌，淡黄稀薄→链球菌，绿色臭味→厌氧菌。确诊靠胸腔穿刺抽脓；诊断标准：抽得脓液或细菌涂片/培养阳性，或以下两条：细胞数≥10×10⁹/L、糖≤40mg/dl、LDH≥1000IU/L。X线：大片均匀暗影、纵隔推向对侧、脓气胸见气液平面、叶间积脓呈梭状阴影（侧位）。治疗三方面：排除脓液解除压迫（3天内可每日穿刺；1周以上分泌物稠厚宜胸腔闭式引流；迁延不愈行VATS或开胸清除坏死组织；慢性脓胸胸膜剥脱）、控制感染（根据药敏，疗程约4周，体温正常后再给药2~3周）、改善全身情况。出院停药条件：体温平稳、白细胞正常、精神食欲好、局部无脓或日引流<20ml，四条具备后一周可停药。' },
  { m: '25N', q: '气胸的病因分类、张力性气胸的病理生理与处理原则？', a: '气胸指胸膜腔内蓄积气体，分自发性（特发性/家族性，多见于身材单薄消瘦男性青少年，自发气胸约1/3~1/2同侧复发）和继发性（外伤、医源性、感染后、先天畸形、其他）。新生儿期发病率较高（1%~2%可有无症状少量气胸）。\n常见原因：外伤性（穿通伤钝挫伤）、医源性（气压伤机械通气、中心静脉导管、经气道操作）、感染后（金葡菌肺炎最多见，其次革兰阴性杆菌、结核、卡氏肺囊虫、麻疹）、自发性、先天畸形（先天性大叶性肺气肿、肺囊肿、马方综合征）、其他（异物吸入、哮喘、囊性纤维化）。\n张力性气胸：支气管裂口形成活瓣机制，空气能进不能出，整个呼吸周期胸腔内压均高于大气压，致严重通气障碍+纵隔移位+静脉回流减少→严重缺氧及休克，属儿童危重急症。\n临床表现：依积气量及是否张力性而异，婴幼儿多急重；大量气胸可胸痛、持续咳嗽、憋气青紫，叩诊鼓音、患侧呼吸音减弱消失；张力性气胸见肋间饱满、膈肌下移、气管心脏移向健侧、严重缺氧、脉搏甚微、血压降低、低心搏出量休克。X线见气胸线、气胸部分过度透明无肺纹理，张力性气胸气管心脏推向健侧。新生儿可用透光法（患侧透光度增加）。\n治疗：<20%少量气胸且无基础肺病可观察1~2周自行吸收；>20%且病情稳定可穿刺抽气；症状严重或合并肺部疾病或抽气效果欠佳者行胸腔闭式引流（紧急时先穿刺抽气，穿刺点锁骨中线第2、3肋间或腋中线乳头水平）；大量气胸吸纯氧增大胸膜腔与血液氧梯度差促吸收。手术指征：水封瓶引流1周未愈仍持续漏气、CT发现肺部病变（如肺大疱）、复发性气胸、肺不能完全张开——多采用胸腔镜，同时行胸膜固定术降低复发风险。' },
  { m: '25O', q: '儿童阻塞性睡眠呼吸暂停综合征（OSAS）的流行病学、危险因素、临床表现、PSG诊断标准与治疗？', a: 'OSAS：睡眠中反复上气道全部或部分塌陷，致夜间反复低氧血症、高碳酸血症和睡眠结构紊乱。发病率两个高峰：2~8岁（腺样体扁桃体肥大）和青春期（体重增加）；PSG金标准诊断的患病率1.2%~5.7%；青春期前男女无差异。\n危险因素：上气道解剖狭窄（腺样体肥大、扁桃体肥大、喉软化、鼻息肉、小下颌、鼻中隔偏曲）、神经肌肉调控异常（神经肌肉病、脊肌萎缩症、脑瘫）、综合征及遗传代谢病（唐氏综合征、颅面骨发育不全、软骨发育不良、甲减、Pierre Robin等）、肥胖、过敏性鼻炎；有家族史者危险性增高。\n临床表现：夜间——打鼾、张口呼吸、呼吸费力、反复惊醒、遗尿、多汗、睡眠不安、呼吸暂停（典型睡姿俯卧位头转向一侧颈部过伸张口）；白天——晨起头痛、迟醒、嗜睡或活动增多易激惹；非特异——行为异常（类似注意力缺陷多动障碍）、认知缺陷、学习困难、生长落后；体征——腺样体面容（上唇短厚翘起、下颌骨下垂、鼻唇沟消失、硬腭高拱、牙齿不齐、上切牙突出、咬合不良）。\n病理生理：①睡眠片段化→学习能力下降、多动、攻击行为、白天嗜睡；②慢性间歇性低氧→儿茶酚胺、肾素-血管紧张素、内皮素增加，肺血管收缩→肺动脉高压→右心功能不全，并损害神经认知功能。\nPSG：诊断金标准，夜间连续监测7小时以上；AHI=平均每小时呼吸暂停+低通气次数，OAI=平均每小时阻塞性呼吸暂停次数；儿童呼吸事件标准为持续≥2个呼吸周期（不同于成人≥10秒）。诊断标准：2020年我国指南及ICSD-3推荐OAHI>1（2007年乌鲁木齐草案标准为AHI>5或OAI>1且LSaO2<0.92）。鉴别：中枢性睡眠呼吸暂停（口鼻气流和胸腹运动同时停止）、发作性睡病（白天过度嗜睡、夜间无打鼾、猝倒/睡瘫/幻觉、MSLT异常）。\n治疗：原则早诊断早治疗、解除上气道梗阻。手术——腺样体扁桃体切除术是主要有效方法（高危人群：<2岁、严重OSAS、肺心病、营养不良、病理性肥胖、神经肌肉病、颅面发育异常）；非手术——CPAP（中重度、手术禁忌、术后残存者）、BPAP（不能耐受CPAP者）、口腔矫治器、白三烯受体拮抗剂（轻中度）。预后：单纯腺样体扁桃体肥大者预后良好。' },
  { m: '25O', q: '睡眠低通气疾病的定义、诊断标准、常见类型（CCHS、OHS等）与治疗？', a: '定义：肺泡通气不足致睡眠中PaCO2>45mmHg的一类疾病。ICSD-3：睡眠通气不足致动脉血CO2增高，伴或不伴日间症状。儿童诊断标准：PaCO2>50mmHg占总睡眠时间25%以上（成人标准：PaCO2>55mmHg持续>10分钟，或上升>10mmHg达50mmHg以上持续>10分钟）；可用呼气末CO2和经皮CO2代替监测。\n病因：呼吸中枢调控异常或呼吸系统神经肌肉疾病——脑干和脊髓损伤、呼吸中枢调节异常、病理性肥胖、胸廓限制性畸形、神经肌肉病。\n临床表现：高碳酸血症（脑血管扩张）→晨起头痛、白天乏力困倦、精神恍惚、智力受损；低氧血症→继发性红细胞增多症、发绀；长期肺泡低通气缺氧→肺血管痉挛→肺动脉高压、右心功能不全；儿童可有烦躁易激惹、生长落后、成绩下降；可因夜间猝死。\n常见类型：①先天性中枢性低通气综合征（CCHS）：新生儿或婴幼儿起病，清醒时通气可维持、入睡后通气不足，无吸气三凹鼻扇等用力呼吸表现；呼吸中枢对PaCO2/PaO2变化无通气反应；90%存在PHOX2B基因突变（诊断=A睡眠相关低通气+B PHOX2B突变）；可伴吞咽困难、先天性巨结肠、神经胶质瘤及自主神经功能障碍；终身疾病，严重者需呼吸支持（现多用无创通气）。②肥胖低通气综合征（OHS）：肥胖+通气不足致高碳酸血症；BMI>35kg/m²住院人群发病率31%；与OSAS同时存在时称皮克威克综合征。③疾病伴发的低通气：脊柱侧凸、胸廓成形术后、进行性假肥大性肌营养不良、脊髓性肌萎缩等（潮气量减低为主）。\n治疗：吸氧（神经肌肉病、胸廓畸形者慎重，可加重高碳酸血症）；辅助通气——无创正压通气（BPAP为主，已逐渐取代气管切开有创通气，成功用于神经肌肉病、CCHS、脊柱侧凸患儿）；膈肌起搏器（适合高位脊髓损伤）；呼吸肌训练。' },
  { m: '25P', q: '囊性纤维化（CF）的遗传学、发病机制与病理改变？', a: '常染色体隐性遗传，CFTR基因异常所致，基因位于7号染色体长臂，编码1480个氨基酸的cAMP依赖性氯离子通道蛋白（CF跨膜调节因子）。发病率：白种人1/3200、非裔1/15000、西班牙裔1/14000~1/10000、亚裔1/35000；白人最常见突变ΔF508（66%为纯合子），我国常见G970D、c.1766+5G>T、I1023R等，ΔF508少见。\n突变分6类：I类——不能合成蛋白或合成缺陷；II类——蛋白不能正常转运至细胞膜顶部（如ΔF508）；III类——影响CFTR激活和氯离子转运（如G551D）；IV类——细胞膜顶部功能减低；V类——有活性CFTR合成减少；VI类——CFTR在细胞膜顶部结构不稳易断裂。\n发病机制：CFTR异常→氯离子通道功能障碍→分泌物黏稠→器官功能障碍。呼吸道：钠重吸收增加、水分泌减少→分泌物脱水黏稠→纤毛清除障碍→分泌物滞留阻塞气道→气道炎症、慢性感染、进行性小气道阻塞和支气管扩张。汗腺：氯离子通道异常→盐过度丢失，皮肤表面氯钠浓度升高（较正常高3~5倍）。\n病理改变：肺脏早期为毛细支气管炎，进展为支气管炎（Goblet细胞增生、黏液下腺体肥大），后期闭塞性细支气管炎、囊状支气管扩张、大泡性肺气肿，最终肺纤维化；胰腺出生时即有受损，85%~90%患者腺泡破坏代以纤维脂肪组织，胰岛β细胞10~20岁开始破坏；肝脏局部胆管硬化，约30%脂肪浸润；95%以上男性附睾体尾部、输精管、精囊闭塞→成年后不育；鼻息肉、鼻窦炎、直肠脱垂等。' },
  { m: '25P', q: '囊性纤维化的临床表现与诊断标准？', a: '三大临床特点：弥漫性慢性阻塞性肺疾病、胰腺功能不全、汗液中钠氯浓度增高。约半数1岁前诊断，约80%在5岁内诊断。\n1. 呼吸道：90%以上反复上下呼吸道感染（支气管炎、肺不张、肺炎），病原以铜绿假单胞菌和金黄色葡萄球菌为主——金葡多见于诊断早期及6个月以下，铜绿假单胞菌是病情恶化和死亡率增加的重要病原；咳嗽最常见，晨起及活动后加重，痰多黏稠；病程长者有活动不耐受、气短、咯血、生长落后，最终肺心病死于呼吸衰竭；X线早期两肺普遍性肺气肿及弥漫性肺不张，黏液嵌塞呈"手指样"分叉状阴影自肺门向外伸展（多见于上叶），5岁以上80%以上有支气管扩张；查体桶状胸、杵状指/趾。\n2. 消化道：新生儿10%~20%胎粪性肠梗阻；5%~15%肝硬化门脉高压；胰腺外分泌不足→脂肪和蛋白质吸收障碍→低蛋白血症、营养不良性贫血、生长发育迟缓、脂溶性维生素（A、E、K）缺乏；30%患儿15岁前肝功能异常；11~17岁8%、18~24岁18%出现胰岛素依赖型糖尿病（酮症酸中毒不多见）。\n3. 汗腺：盐缺乏，低氯性碱中毒（假性巴特综合征），皮肤"盐霜"或咸味。\n4. 泌尿生殖道：性腺发育延迟约2年；95%男性无精子症；女性生育率降低。\n诊断标准：有CF家族史或典型临床表现，①2次汗液氯离子≥60mmol/L；或②汗液氯30~59mmol/L+CFTR纯合或复合杂合致病突变；或③汗液氯30~59mmol/L+CFTR功能异常（鼻电位差或肠电流测定）。\n辅助检查：汗液试验（毛果芸香碱离子透入法，收集至少75mg最好100mg汗液；氯<30正常、30~59可疑、≥60确诊）；基因检测（中间值者确诊/除外，亦用于产前诊断和新生儿筛查）；胰蛋白酶缺乏；脂肪吸收不良检查（口服碘油查尿碘、胡萝卜素/维生素A吸收、血清胆固醇低）。鉴别：哮喘、百日咳、支扩、肺结核、免疫缺陷、原发性纤毛运动障碍等。' },
  { m: '25P', q: '囊性纤维化的治疗与预后？', a: '治疗需多学科联合团队（内科、护理、营养、呼吸/物理治疗、遗传咨询、心理）及规律监测。\n1. 肺部病变治疗：清除气道分泌物（胸部物理疗法、体位引流、用力呼气技术、呼气末正压、支气管镜灌洗）+化痰（重组DNA酶、高渗盐水雾化）+体育锻炼；急性加重及时病原学检查、合理抗菌（铜绿假单胞菌吸入抗菌药物+定期痰培养；小剂量大环内酯类）；并发症治疗（肺不张、咯血、气胸、ABPA、呼吸衰竭、右心衰竭）。\n2. 消化道治疗：饮食疗法——高热量（比年龄计算高30%~50%）、高蛋白（6~8g/kg·d）、脂肪占35%~40%、单纯糖（不含淀粉）、多种维生素（维生素A每日10000IU、维生素E 100~200IU、维生素K用于凝血酶原延长者）、膳食内补充食盐；胰酶替代——婴儿2000~4000单位脂肪酶/120ml奶，1~4岁2000~4000单位/克膳食脂肪，4岁以上每餐每千克500单位渐增至1000~2500单位，每日总量不超过10000单位/kg（疗效满意表现：腹胀减轻、大便次数减少成形恶臭减轻、体重增加）；并发症治疗（胎粪性肠梗阻、直肠脱垂、肝病、胰腺炎、高血糖）。\n3. 靶向治疗：①增强剂——依伐卡托（ivacaftor）用于III类（G551D）或IV类突变，延长CFTR通道开放时间；②校正剂——鲁玛卡托（lumacaftor）改善II类突变蛋白加工表达，与依伐卡托联合用于2岁以上ΔF508纯合子；依来卡托（elexacaftor）+替扎卡托（tezacaftor）+依伐卡托三联用于12岁以上ΔF508纯合子，疗效显著；③通读剂——促进过早终止密码子通读，用于I类突变。估计高达50%CF患者可得到靶向治疗。\n4. 基因治疗：基因替代和CRISPR/Cas9基因编辑是未来方向（已可修复CF患者肠干细胞CFTR功能），但CFTR有限表达阻碍该策略，临床应用尚需数年。\n预后：早期诊断及合理治疗后死亡率明显下降，中位数生存期大于40岁；中国CF患儿中位数诊断年龄10岁，36%报道时已死亡（死亡中位数11岁），提示我国患者未得到及时诊断和有效治疗。' },
