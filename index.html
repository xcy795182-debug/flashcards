const CARDS_CH30 = [
{ m: '30A', q: '儿童神经系统一般检查的要点（意识、皮肤、头颅、眼耳口腔、姿势表情、脊柱、特殊气味）？', a: '意识状态：根据对声、光、疼痛、语言刺激的反应判断，分嗜睡、意识模糊、昏睡、昏迷。\n皮肤：结节性硬化——面颊皮脂腺瘤+色素脱失斑；神经纤维瘤病——咖啡牛奶斑；色素失调症——暗褐色色素增生；脑三叉神经血管瘤病——面部三叉神经分布区红色血管痣。\n头颅：测头围，头围过小见于脑发育畸形、狭颅症；过大见于脑积水、硬膜下血肿；前囟12~18个月闭合，后囟2~3个月闭合；囟门早闭见于小头畸形，闭合过晚见于脑积水、佝偻病；前囟膨隆提示颅内压增高；颅骨透照试验阳性提示硬膜下积液。\n眼：角膜K-F环见于肝豆状核变性；球结膜毛细血管扩张见于共济失调-毛细血管扩张症。\n舌：宽大多见于呆小病、唐氏综合征、黏多糖病。\n姿势：不自主伸舌提示脑损伤；凝视提示胆红素脑病、颅内出血、中枢感染；落日眼提示脑积水、颅内出血、脑水肿、胆红素脑病。\n脊柱：后正中线色素沉着、小凹陷、一簇毛发提示隐性脊柱裂或皮样窦道/囊肿。\n特殊气味：苯丙酮尿症、枫糖尿症（焦糖味）。' },
{ m: '30A', q: '脑神经检查要点：视神经、面神经、动眼滑车展神经、霍纳综合征？', a: '嗅神经：观察对香精薄荷反应，排除慢性鼻炎。\n视神经：①视力——婴儿4~6周开始两眼注视，视动性眼球震颤说明有皮质视觉；②视野——面对面检查法；③眼底——视神经萎缩时乳头苍白血管稀少（正常婴儿乳头小、略灰白勿误诊）；视盘水肿见于颅内压增高（静脉扩张、动脉搏动消失、乳头充血边缘模糊隆起）；黄斑部变性可见樱桃红点。\n动眼、滑车、展神经：支配眼球运动及瞳孔反射；颅内压增高时突然两侧瞳孔不等大，瞳孔散大侧为动眼神经麻痹（小脑幕切迹疝）。\n三叉神经：运动支支配咀嚼肌；运动支受刺激时咀嚼肌强直、牙关紧闭，见于破伤风。\n面神经：末梢性麻痹——病侧面肌上下部都麻痹，额纹消失、不能闭眼、眼裂大、鼻唇沟浅；中枢性麻痹——仅病侧下部面肌麻痹（鼻唇沟变浅，眼裂变大、不能闭眼不明显）。\n霍纳综合征：眼球轻微下陷、眼裂稍小、同侧面部少汗，由颈部或脑干部交感神经受损引起。' },
{ m: '30A', q: '运动系统检查：肌张力、肌力分级、共济运动、步态？', a: '肌张力：低下见于弛缓性瘫痪、小脑疾患、低血钾、深昏迷、严重缺氧、肌病；过高见于锥体系受损（折刀样）及锥体外系疾病（齿轮样/铅管样强直）；生后4~5个月以内屈肌张力过高是正常现象。\n肌力0~5度分级：0度无运动；1度消除重力后才有运动；2度可抗重力、运动范围完全；3度可抵抗轻度外加阻力；4度可抵抗中度阻力；5度正常。锥体外系疾病时肌力不减弱。\n共济运动：婴幼儿观察拿玩具准确性；年长儿指鼻试验；Romberg征双足并拢直立，摇摆欲倒为阳性；一侧小脑半球病变共济失调见于同侧肢体，中线病变以躯干及下肢为最明显；小脑病变时睁眼闭眼差别不大，前庭或深感觉障碍时闭眼时更显著。\n步态：小脑性共济失调步态两足分开宽、左右摇摆、视觉不能帮助平衡；感觉性共济失调步态跨步大、举腿高、落足用力过度、视觉可协助平衡（脊髓或末梢神经病变）；痉挛性步态僵直拖拽；剪刀式步态——两下肢伸肌及内收肌紧张、两足交叉前进；鸭步——盆带肌无力、左右摇摆（肌病）。' },
{ m: '30A', q: '深反射、浅反射、病理反射及其中枢定位？', a: '深反射（腱反射）：\n下颌反射——脑桥；肱二头肌反射——颈髓5~6；肱三头肌反射——颈髓6~8；膝反射——腰髓2~4；跟腱反射——骶髓1~2。\n深反射减弱消失：反射弧损伤、锥体束急性损害、小脑病变、低钾、深睡昏迷休克、大量镇静药；亢进见于锥体束病变，高度亢进可出现踝阵挛。\n浅反射：角膜反射（中枢脑干，传入三叉神经、传出面神经）；咽反射（延髓，延髓麻痹时消失、假性延髓麻痹时存在）；腹壁反射（上中下分别胸髓7~8、8~10、11~12）；提睾反射（腰髓1~2）；跖反射（骶髓1~2）；肛门反射（骶髓4~5）。\n病理反射：①巴宾斯基征——趾背屈、四趾扇形分开为阳性；新生儿婴儿期为生理现象，2岁以后出现为锥体束损害重要体征；②Gordon征（捏压腓肠肌）、③Chaddock征（足背外踝下由足跟向足尖划）、④Oppenheim征（拇指沿胫骨由上而下擦过）、⑤Schaffer征（挤压跟腱）——意义同巴氏征；⑥Hoffmann征——轻弹中指末节出现各指抓握状，锥体束损伤征。' },
{ m: '30A', q: '新生儿和婴儿神经发育性反射（原始反射）的出现与消退时间及临床意义？', a: '暂时性反射应在一定年龄出现、一定年龄消退；不按时出现、不随年龄消退、消退后重现或两侧明显不对称均提示神经系统异常。\n吸吮和觅食反射：出生出现，4~7个月消退；锥体束病变时持续不退或消退后重现。\n握持反射：出生出现，2~3个月消退（代之以有意识握物）。\n拥抱反射（Moro反射）：出生出现，3~6个月消退；引不出说明脑损伤，不对称提示脑损伤或臂丛损伤。\n颈肢反射（紧张性颈反射）：2个月出现，6个月消退（非对称性）；对称性颈肢反射4~6个月以前存在为正常。\n交叉伸展反射：出生出现，2个月减弱，6个月持续存在为异常。\n支撑反射和迈步反射：出生出现，2~3个月消失；4个月后仍有下肢伸直反应提示脑性瘫痪。\n安放反射：出生即存在，6周消退。\n颈矫正反射：出生出现，6个月消失。\n侧弯反射：出生存在，3个月后消失，持续存在说明脑损伤。\n拾躯反应（Landau反应）：6~10个月出现，30个月消退；10~12个月尚不出现可能有脑性瘫痪或智力障碍。\n降落伞反应：9~10个月出现，终身存在；10个月后无此反应属异常。\n平衡反射：10~12个月出现，终身存在。\n反射水平：交叉伸展反射是脊髓水平；颈肢反射、支撑反射、迈步反射是脑干水平；颈矫正反射是中脑水平；平衡反射是大脑皮质和小脑水平。' },
{ m: '30A', q: '脑脊液检查：腰穿适应证、禁忌证及儿童脑脊液正常值？', a: '适应证：①中枢神经系统感染性疾病、变性疾病等；②脊髓病变行脊髓液动力学检查；③神经系统特殊造影；④椎管内治疗性药物输入或减压引流。\n绝对禁忌证：①颅内压明显增高，特别是有脑疝形成早期迹象；②穿刺点局部皮肤/皮下组织/脊柱感染灶；③病情危重处于休克期或心肺功能不全；④怀疑后颅窝占位性病变。\n相对禁忌证：①出血性疾病（凝血因子缺乏或血小板减少）；②开放性颅脑外伤或有脑脊液漏；③腰椎严重畸形；④频繁抽搐或躁动不安。\n儿童脑脊液正常值：压力70~200mmH2O（新生儿30~80）；外观清亮透明，潘氏试验阴性；白细胞（0~10）×10⁶/L（新生儿或婴儿0~20）；蛋白0.2~0.4g/L（新生儿0.2~1.2）；糖>3.3mmol/L（或>2/3血糖），新生儿>2.2mmol/L（或>2/3血糖）。' },
{ m: '30A', q: '神经电生理与影像学检查的选择要点（EEG、BAEP、VEP、SEP、EMG、CT、MRI、MRS、DSA、SPECT/PET）？', a: '脑电图EEG：癫痫诊断及分型的常规检查，长程视频脑电图意义大；5%~8%健康儿童可有脑电异常（无临床发作不能诊断癫痫）；剥夺睡眠、光刺激、过度换气可提高阳性率。\nBAEP（脑干听觉诱发电位）：评估脑干受损敏感客观指标；主波I、Ⅲ、V分别对应听神经、上橄榄核、下丘；不受年龄限制、不需配合、无损伤，适用于新生儿听力障碍早期诊断及听路损害定位（周围性vs中枢性）。\nVEP：反映视网膜神经节细胞至视觉中枢传导功能，用于脑白质发育不良、脱髓鞘疾病、脂质沉积症累及视通路疾病。\nSEP：用于躯体感觉传导通路损害病例。\nEMG：判断神经和肌肉功能，用于肌源性疾病、神经-肌肉接头和周围神经病鉴别（脊髓性肌萎缩、脊髓灰质炎、周围神经病变、肌营养不良、重症肌无力等下运动神经单元病变）。\nCT：解剖结构检查，对颅脑外伤、蛛网膜下腔出血、颅内钙化优于MRI。\nMRI：软组织对比优于CT，后颅窝和脊髓病变、脑白质病、癫痫灶定位显著优于CT；FCD常需1.5岁后复查才能发现。\nMRS：测定N-乙酰天门冬氨酸、胆碱、肌酐、乳酸水平。\nDSA：确定颅内血管性病变、肿瘤、外伤后出血（脑血管畸形表现异常血管团块）。\nSPECT（Tc-HMPAO）：反映脑血流灌注，癫痫发作期血流增加、发作间期减低；PET：F-FDG测定脑血流和局部氧、葡萄糖代谢，用于癫痫灶定位。' },
{ m: '30B', q: '惊厥的定义、发病机制（为什么婴幼儿易发）及病因分类？', a: '定义：随意肌剧烈不自主痉挛性收缩（强直）或收缩松弛交替（强直阵挛）导致的发作，可局部或全身，常伴意识丧失；可为癫痫性（脑神经元一过性大量同步化放电）或非癫痫性（如破伤风）。癫痫性发作是症状不等于癫痫（慢性脑功能障碍疾病）。\n婴幼儿易发机制：\n①发育期脑相对兴奋性高——皮质功能发育未完全，较弱刺激即引起强烈兴奋扩散；\n②神经髓鞘未完全形成，冲动易泛化；\n③生化基础：抑制性介质GABA（氨基丁酸）及其代谢产物β-羟化氨基丁酸缺乏；\n④血脑屏障功能差，毒性物质易透入脑组织；\n⑤水电解质代谢不稳定；\n⑥末梢神经肌肉刺激阈值较低（游离钙降低时一般冲动也可引起惊厥）。\n病因：\n感染——颅内感染（脑膜炎、脑炎）、颅外感染（热性惊厥、脓毒症脑病、破伤风）；\n非感染——颅内疾病（癫痫、颅内占位、颅脑损伤、先天发育异常、脑退行性变）、全身性疾病（代谢性：低血糖、半乳糖血症、氨基酸代谢障碍；维生素缺乏：B1、B6；水电解质紊乱：低钙低镁、高钠低钠；缺氧缺血性脑病；肾源性：尿毒症；中毒：氨茶碱、异烟肼、有机磷、毒鼠强、白果、苦杏仁、一氧化碳；其他：瑞氏综合征）。\n年龄特点：新生儿期以围产期损伤、窒息、低血糖低钙、败血症、破伤风常见；1月~1岁以围产期损伤后遗症、化脑、婴儿痉挛多见；1~3岁以热性惊厥、脑膜炎脑炎、脓毒症脑病多见；学龄期以颅内肿瘤、外伤、中毒、癫痫多见。' },
{ m: '30B', q: '热性惊厥（FC）的定义、单纯型与复杂型分类、预后及预防？', a: '定义：生后3个月至5岁，体温38℃或以上出现的惊厥，除外中枢神经系统感染及引发惊厥的任何其他急性病，既往无无热发作史；患病率2%~5%，是婴幼儿最常见惊厥性疾病；ILAE已不再将FC列为癫痫类型。\n遗传：25%~40%患儿有阳性家族史，同胞发生FC危险性9%~22%。\n分型：\n单纯型（占75%）：全面性发作，无局灶性特征；持续<15分钟；24小时内或同一热性病程中仅发作1次。\n复杂型：①持续>15分钟；②局灶性发作；③24小时内或同一热性病程中发作≥2次。\n预后：总体良好，无直接致死病例；90%以上日后不患癫痫；首次后约30%在以后的呼吸道感染中复发。复发危险因素：①18个月龄前发病；②发作时体温<38℃；③FC家族史；④发热时间短（<1小时）。具所有危险因素者76%复发，无危险因素者仅4%。\n预防：绝大多数不主张任何预防性治疗（退热治疗对预防复发无效）；过于频繁（每年>5次）或出现过FC持续状态（>30分钟）者可谨慎考虑：①长期预防（丙戊酸、左乙拉西坦或苯巴比妥）；②间断临时预防（发热早期地西泮0.3mg/kg，每8小时1次，最多3次）。\n热性惊厥后癫痫危险因素：复杂型、存在中枢神经系统异常（发育落后）、癫痫家族史。' },
{ m: '30B', q: '癫痫的定义、病因分类及ILAE癫痫发作分类（2017）？', a: '定义：以持久性产生癫痫发作倾向为特征的慢性脑部疾病；癫痫发作是脑神经元异常过度、同步化放电造成的一过性临床症状和/或体征；癫痫是儿童最常见神经系统疾病，患病率3‰~9‰。\n病因6类：遗传性、结构性、感染性、免疫性、代谢性、未知病因。\nILAE分类历程：1960国际癫痫分类→1981癫痫发作分类→1989癫痫和癫痫综合征分类→2010重新定义发作起始、分类及病因学→2014临床实用性定义→2017分类意见书。\n发作分类（3大类）：\n①局灶性发作：每次都起源于固定的单侧半球致痫网络，可扩散或不扩散至双侧；按意识是否受损分意识清楚/意识受损局灶性发作；按起始症状分运动起始（自动症、失张力、阵挛、癫痫性痉挛、过度运动、肌阵挛、强直）和非运动起始（自主神经症状、行为停止、认知障碍、情绪障碍、感觉障碍）；可演变为双侧强直-阵挛发作。\n②全面性发作：每次起源于包括双侧半球的致痫网络并迅速扩散至双侧，伴意识障碍；包括运动性发作（全面性强直阵挛、全面性肌阵挛、全面性失张力）和非运动性发作（失神发作）。\n③起始不明的发作。\n癫痫类型4种：局灶性、全面性、兼有全面性及局灶性、不能确定分类性。癫痫综合征：一组具有相近特定临床表现和电生理改变的癫痫（脑电-临床综合征）。\n诊断5轴：轴1描述发作期症状；轴2癫痫发作类型；轴3癫痫综合征；轴4相关疾病；轴5WHO功能残障评估。' },
{ m: '30B', q: '常见全面性发作类型的临床及EEG特点（强直阵挛、强直、阵挛、肌阵挛、失张力、失神）？', a: '强直-阵挛发作：强直期（全身骨骼肌伸肌或屈肌强直性收缩伴意识丧失、呼吸暂停发绀）→阵挛期（反复短促猛烈屈曲性抽动）→发作后状态（昏睡，自动症、头痛、疲乏）；EEG强直期全导10Hz以上快活动→阵挛期棘慢波→发作后低平慢波。\n强直性发作：全身肌肉强烈收缩伴意识丧失，固定于某种姿势（头眼偏斜、双上肢屈曲或伸直、呼吸暂停、角弓反张），持续5~20秒或更长；EEG低波幅10Hz以上快活动或棘波节律。\n阵挛性发作：仅肢体躯干面部肌肉节律性抽动而无强直成分；EEG 10Hz以上快活动及慢波或棘慢波。\n肌阵挛发作：突发全身或部分骨骼肌触电样短暂收缩（0.2秒），点头、前倾后仰、两臂快速抬起，重者跌倒；EEG全导棘-慢或多棘慢波爆发。\n失张力发作：肌张力突然短暂丧失致姿势改变（头下垂、肩或肢体突然下垂、屈髋屈膝或跌倒）；EEG多棘慢波或低波幅快活动。\n失神发作：①典型失神——突然停止活动、意识丧失但不摔倒、两眼凝视，持续数秒钟后意识恢复，发作后不能回忆，过度换气可诱发；EEG全导同步3Hz棘-慢复合波，发作间期背景正常；②不典型失神——开始及恢复较慢，EEG 1.5~2.5Hz全导棘慢波，发作间期背景异常，多见于广泛脑损害患儿。' },
{ m: '30B', q: '儿童常见癫痫综合征（CAE、BECTS、婴儿痉挛）的特点？', a: '儿童失神癫痫（CAE）：占儿童癫痫12%，起病5~7岁，与遗传有关；发作频繁每日可上百次，持续10秒左右；EEG两半球弥漫对称同步3Hz棘慢波或多棘慢波；90%于进入成年之前消失，失神持续存在则出现全面性强直阵挛发作。\n伴中央-颞区棘波的儿童良性癫痫（BECTS）：儿童癫痫最常见类型之一，占8%~23%，3~13岁起病，预后很好；典型发作为睡眠中一侧面肌抽搐、口齿不清、流涎伴呼噜音，可不伴意识丧失，可继发全面性发作；EEG发作间期中央及中颞区（Rolandic区）棘波。\n婴儿痉挛（West综合征）：4~8月龄高发；频繁短暂（0.5~2秒）痉挛发作呈丛集性，颈部屈曲或伸展伴上肢外展或内收，每天成串发作，发作后疲倦嗜睡；不对称发作提示一侧大脑病损；70%患儿发作前即有发育迟滞并进行性减退；EEG高度失律（hypsarrhythmia）。' },
{ m: '30B', q: '癫痫持续状态（SE）的定义、分期分类及治疗？', a: '定义：持续频繁的癫痫发作形成固定的癫痫状态；传统定义——一次发作持续30分钟以上或连续发作、发作间歇期意识不能完全恢复；操作性定义倾向于缩短至5分钟（超过5~10分钟很难自行缓解，强调早期处理）。\n分期：①即将/早期SE——全面性惊厥性发作持续>5分钟，或非惊厥性/部分性发作持续>15分钟，或5~30分钟内两次发作间歇期意识未完全恢复，需紧急治疗阻止演变；②已建立（完全）SE——发作持续30分钟以上或连续发作间歇期意识不能完全恢复；③难治性SE（RSE）——经一种苯二氮䓬类及一种其他一线药物充分治疗仍无明显改善，发作持续超过30~60分钟。\n分类：惊厥性SE（全面性及部分性）、非惊厥性SE（失神性及精神运动性）、癫痫性电持续状态；GCSE（全面性惊厥性）最严重，死亡原因主要是潜在基础疾病，但惊厥本身或治疗不当也可致死。\n治疗原则：①尽快控制发作——首选苯二氮䓬类：地西泮静注首剂0.2~0.5mg/kg（最大10mg，速度1~5mg/min），10~15分钟可重复；咪达唑仑肌注0.2~0.3mg/kg（门急诊/院前急救首选之一）；10%水合氯醛0.5ml/kg（50mg/kg）稀释至3%灌肠；②积极寻找潜在病因，针对性病因治疗；③加强护理监护，RSE转ICU，及时处理脏器功能障碍、低血糖电解质紊乱，严重低氧血症及时插管机械通气；④序贯治疗——停静脉止惊剂前提前加用口服抗癫痫药防止复发。' },
{ m: '30B', q: '癫痫的药物治疗原则及预后分类？', a: '药物治疗原则：\n①适时开始——一般间隔24小时以上的2次非诱发性发作即可考虑开始治疗；\n②首选单药、合理选药——能诊断综合征的先按综合征选药原则，不能诊断的按发作类型选药；\n③小量开始、缓慢调整（start low，go slow），换药逐渐过渡，避免突然停药（可使发作加重，尤其巴比妥类及苯二氮䓬类）；\n④合理联合——不同作用机制药物联合；\n⑤坚持长期规律服药；\n⑥注意药物相互作用；\n⑦疗程要长、缓慢减停——至少连续2年不发作且EEG癫痫样放电完全或基本消失才开始减药，减停过程>3~6个月，多药联合者每次只减停一种；\n⑧定期随访监测不良反应。\n其他治疗：病因治疗（维生素B6依赖性癫痫、葡萄糖转运子I缺乏症等）；手术治疗（正规药物治疗不能控制、局灶病损者评估手术：儿童颞叶切除后无发作占78%，颞叶外或多病灶切除仅54%，肿瘤切除后无发作率82%，皮质发育异常50%~80%；胼胝体切开术、多处软脑膜下横切术、迷走神经刺激术）。\n预后四类：①预后良好的自限性癫痫（20%~30%，如BECTS）；②药物敏感性癫痫（30%，如CAE，几年后完全停药不复发）；③药物依赖性癫痫（20%，如青少年肌阵挛，撤药后易复发，多需终身治疗）；④药物耐药性癫痫（13%~17%，难治性，预后不佳）。特发性/隐源性癫痫缓解率是重症症状性癫痫的3倍。' },
{ m: '30C', q: '溶酶体贮积症（LSDs）的概念及主要脑脂质贮积病的酶缺陷对应？', a: '溶酶体贮积症：溶酶体中不同的水解酶缺陷导致相应的蛋白质、碳水化合物、脂质和硫酸盐等物质不能降解而贮积出现临床症状；常见有脂质贮积病、黏多糖贮积症、糖蛋白贮积病和粘脂质贮积病等。除溶酶体水解酶缺陷外，还可由4种鞘脂类激活糖蛋白（sap-A、sap-B、sap-C、sap-D）和GM激活蛋白（GMAP）缺陷以及转运体缺陷导致。\n主要脑脂质贮积病的酶缺陷对应（表30-3）：\nGM1神经节苷脂贮积病——β-半乳糖苷酶（GLB1，3p21.33）；\nGM2神经节苷脂贮积病（Tay-Sachs病）——β-己糖胺酶A（HEXA，15q23~q24）；\nSandhoff病——β-己糖胺酶A+B（HEXB，5q13）；\n尼曼-匹克病A/B型——酸性鞘磷脂酶（SMPD1，11p15）；\n尼曼-匹克病C型——NPC1/NPC2；\n戈谢病——β-葡糖脑苷脂酶（GBA，1q21~q31）；\nFabry病——α-半乳糖脑苷脂酶A（GLA，Xq22）；\nKrabbe病（球形细胞脑白质营养不良）——半乳糖脑苷脂酶（GALC，22q13）；\n异染性脑白质营养不良（MLD）——芳基硫酸酯酶A（ASA，14q31）；\nFarber病——酸性神经酰胺酶（ASAH1，8p22~p21.3）。\n治疗手段缩写：ERT酶替代治疗、SRT底物清除治疗、HSCT造血干细胞移植、S/S对症及支持治疗。' },
{ m: '30C', q: 'GM1神经节苷脂贮积病和GM2（Tay-Sachs病、Sandhoff病）的分型与特点？', a: 'GM1神经节苷脂贮积病：β-半乳糖苷酶（GLB1）基因突变；外周血淋巴细胞有空泡、眼底樱桃红斑、骨骼X线特征性改变；确诊靠白细胞或成纤维细胞酸性β-半乳糖苷酶活性测定+GLB1基因检测。\nⅠ型（婴儿型）：出生后不久发病，全身肌张力低下、吸吮力差、肝脾大、丑陋面容（前额凸出、大耳、鼻梁低平、巨舌）、精神运动发育迟缓，对声音敏感易惊跳，约50%眼底樱桃红斑，多在2岁左右死于支气管肺炎。\nⅡ型（晚发婴儿型）：12~18个月发病，步态异常首发，运动倒退至痉挛性四肢瘫，癫痫常见；无肝脾大，视网膜角膜无病变，常因肺部感染3~10岁死亡。\nⅢ型：4岁后发病，构音障碍和肌张力异常为主，可迟至三四十岁。\nGLB1缺陷广谱表型：以骨骼及肝脾受累为主、尿中硫酸角质素排泄增加、中枢几乎不受影响者称Morquio B综合征（黏多糖ⅣB型）。\nGM2（己糖胺酶Hex缺乏）：\nTay-Sachs病（B型GM2）：最多见，出生正常，生后4个月左右对声音异常敏感（突发惊跳），4~6个月精神运动发育倒退，8~9个月眼震、失明、樱桃红斑；HexA活性降低而HexB正常。\nSandhoff病（O型）：HexA和HexB活性均丧失，临床表现与TSD极相似但伴轻度肝脾大，病情进展迅速，2岁内死亡。' },
{ m: '30C', q: '戈谢病（GD）的分型、诊断与治疗？', a: '病因：β-葡糖脑苷脂酶（GBA）基因突变，葡糖神经酰胺（GL1）不能正常分解，常染色体隐性遗传，是脂类贮积症中最常见类型；主要临床特征为肝脾大、脾功能亢进、骨骼病变、造血系统和中枢神经系统症状。\n分型：\nⅠ型（慢性非神经型）：最常见，无原发性中枢神经系统症状，GBA活性约为正常人18%~40%；可自生后数月至70岁发病，多数学龄前期因肝脾大和贫血就诊，脾大显著伴脾亢，X线可见股骨远端烧瓶状、骨质疏松、骨髓腔增宽，暴露部位色素沉着。\nⅡ型（急性神经型）：新生儿至18个月发病（以3~4个月多见），GBA活性低于正常人5%，预后最差；哭声微弱、吸吮差、肝脾进行性增大，斜视、角弓反张，6~9个月肌张力增高、腱反射亢进、惊厥，2岁内死于肺部感染。\nⅢ型（亚急性神经型）：GBA活性约为正常人12%~20%，2岁左右发病，以脾大为主，3~7年无症状期后出现神经系统症状（斜视、肢体强直痉挛、智力低下、惊厥），常死于神经症状出现后2年左右。\n诊断：骨髓、脾、肝或淋巴结穿刺液发现Gaucher细胞（充满脂质的巨噬细胞，镜下皱纹纸样外观）可初步诊断；确诊靠外周血白细胞GBA酶活性检测，酶活性正常需行GBA基因检测除外sap-C缺陷。\n治疗：Ⅰ型ERT已成功应用（不能通过血脑屏障，故不能用于Ⅱ、Ⅲ型）；Ⅰ、Ⅲ型可行脾切除（可能加重骨骼和神经系统病变，宜推迟或部分脾切除）；HSCT在Ⅰ型和Ⅲ型已获满意效果，时机至关重要；Ⅱ型主要对症治疗。' },
{ m: '30C', q: '尼曼-匹克病（NPD）的分型、诊断与治疗？', a: '一组鞘磷脂代谢异常的常染色体隐性遗传性溶酶体贮积症；充满脂肪的巨噬细胞（泡沫细胞）沉积于肝脾肺脑导致肝脾大、肺部和神经系统症状。\nA/B型：由SMPD1基因突变导致酸性鞘磷脂酶（ASM）活性减低。\nA型（婴儿型）：最常见，宫内娩出正常，生后数周肌力肌张力低下、喂养困难，3~6个月肝脾淋巴结极度肿大，6个月即精神运动发育倒退，约半数眼底黄斑樱桃红斑，多在3岁左右死亡。\nB型（慢性非神经型）：发病较A型稍晚，以脾大起病，侵犯神经系统少，身材矮小，肺部弥漫浸润易感染。\nC型（慢性神经型）：NPC1/NPC2基因突变，胆固醇从溶酶体排出受阻；任何年龄发病，早期表现语言障碍、共济失调、癫痫发作，特征性垂直核上性凝视麻痹（VSGP），部分肌张力过高和手足徐动症；多在幼儿期死亡，亦可儿童期或青春期起病，20~30岁死于吸入性肺炎。\n诊断：肝脾大+早期神经系统症状+骨髓涂片泡沫细胞可初诊NPD A/B型，确诊靠白细胞ASM酶活性+SMPD1基因检测；NPC型以胆固醇分析作为初筛（已取代皮肤活检），NPC1/NPC2基因检测为确诊手段。\n治疗：无特效治疗；HSCT对晚发型NPD效果更好；咪格司他（糖磷脂生物合成的小分子抑制剂）可减缓NPC神经症状。' },
{ m: '30C', q: '异染性脑白质营养不良（MLD）、Krabbe病和法伯病的要点？', a: 'MLD：芳基硫酸酯酶A（ASA）缺乏致髓磷脂代谢缺陷，常染色体隐性；分3型——婴儿型（最常见，占60%~70%，1~2岁起病，已能走后出现进行性行走困难、双下肢无力弛缓性轻瘫，后转为痉挛性，1/3视神经萎缩，3~7岁死亡）；晚发型（3~10岁至青春期成人，先学习工作效率下降、行为异常，逐渐共济失调和锥体束征，病程5~10年甚至20~30年）。\n辅助检查：MRI典型脑室周围和顶枕部对称性豹纹样脑白质病变；确诊依据血中ASA酶活性降低+尿中硫脂+基因检测。注意ASA假缺乏症（ASA-pd，活性为正常人10%~15%但无MLD症状）及sap-B缺陷，确诊MLD前均需行ASA-pd和sap-B突变筛查。\n治疗：缺乏特效治疗，HSCT对晚发型效果更好，婴儿型治疗越早越好。\nKrabbe病（球形细胞脑白质营养不良）：GALC缺乏使半乳糖脑苷脂不能降解；所有患者均有周围运动感觉神经病，婴儿型以中枢功能障碍为主；婴儿型2~5个月起病（易激惹哭闹、肌张力降低、肌阵挛、锥体束征），1岁眼震斜视视神经萎缩，多数2岁内死于呼吸困难或肺部感染；确诊靠外周血白细胞GALC酶活性（正常需基因检测排除sap-A）；HSCT对婴儿晚发型（需在神经系统症状出现之前）和青少年型有效。\n法伯病（Farber病）：酸性神经酰胺酶（ASAH1）缺乏；典型症状为皮下结节、关节疼痛肿胀、声音嘶哑和失声；眼底最常见樱桃红斑；1型经典型婴儿期起病，活不过2~3岁，肺部炎症是主要死因；诊断靠ACDase酶活性或ASAH1基因检测；对症治疗为主，ERT在研究中。' },
{ m: '30C', q: 'Fabry病的临床、诊断与治疗？', a: '病因：α-半乳糖苷酶A（α-GalA）活性缺陷致酰基鞘氨醇三己糖（Gb3）不能降解而蓄积，X连锁遗传的鞘糖脂贮积病；Gb3广泛累及血管内皮、平滑肌、肾小球、心肌等导致多脏器受累。\n临床：平均发病10岁；四肢反复发作烧灼样或刀割样疼痛和肢端感觉异常最先出现（运动、疲劳、感染发热诱发）；典型皮损为血管角化瘤（脐至膝之间对称分布的暗红或蓝黑色斑疹，压之不褪色），多数伴少汗症；裂隙灯见早发角膜混浊；肾脏血管病变儿童期出现，20~40岁肾功能衰退；高血压、左心肥大、心肌缺血梗死、心衰及脑卒中中年后逐渐发生，40~45岁多死于尿毒症、心衰或脑卒中。\n诊断：间歇性肢端剧痛（或肢端感觉异常）+皮肤血管病变（血管角化瘤）+排汗减少，或家族男性成员有不明原因心肌肥厚、脑卒中、慢性肾病均应怀疑；确诊行白细胞α-GalA酶活性检测（男性酶活性明显减低可确诊），症状不典型或酶活性部分残余需基因检测。\n治疗：ERT可减轻疾病程度/减缓进展；对症治疗——避免曝晒高温、足量饮水，加巴喷丁、普瑞巴林、卡马西平、阿米替林减轻疼痛，避免非甾体抗炎药，氯吡格雷和阿司匹林预防血管栓塞。' },
{ m: '30C', q: '肾上腺脑白质营养不良（ALD）的临床分型、诊断与治疗？', a: '罕见的过氧化物酶体病；X连锁隐性遗传为主（X-ALD，致病基因ABCD1），少数为常染色体隐性遗传的新生儿型（NALD）；ABCD1突变导致极长链脂肪酸（VLCFA）氧化分解障碍，血浆VLCFA异常增高；病理特点为中枢神经进行性脱髓鞘和/或肾上腺皮质萎缩或发育不良。\nX-ALD男性患者分7型：\n儿童脑型：最常见（占35%），4~10岁男孩；神经系统症状（多动、攻击行为、智力倒退、学习困难、步态不稳、痉挛性瘫痪）和肾上腺皮质功能不全（皮肤黏膜色素沉着变黑、失盐征）可同时或相继出现；进行性，多在15岁以内死亡。\n青少年脑型：10~20岁，视力减退最常见首发，进展较慢。\n肾上腺脊髓神经病型：20岁以后成年男性，进行性脊髓功能障碍、下肢痉挛性截瘫，肾上腺皮质功能不全症状较重。\n成人脑型、橄榄-脑桥-小脑型、单纯肾上腺皮质功能减退型、无症状型。20%~30%女性携带者30岁后轻微痉挛性截瘫。\n诊断：①头颅影像特征性——病变由后头部开始，依次累及枕、顶、额区对称性白质病变；MRI顶枕叶深部白质长T2信号，增强可见病灶周边蝴蝶状强化；②血清VLCFA增高（特别是C26增高，C26/C22比值增加）有诊断意义；③男性Addison患者即使无神经症状也应检测VLCFA以免漏诊；④ABCD1基因分析。\n治疗：无特效；肾上腺皮质功能不全时激素替代（对神经系统症状进展无作用）；低脂饮食和Lorenzo油可使VLCFA减少但临床效果不明确；干细胞移植适用于影像显示中枢受累而临床尚无神经症状者。' },
{ m: '30C', q: '佩-梅病（PMD）、Canavan病、亚历山大病（AXD）和Cockayne综合征的要点？', a: '佩-梅病（PMD）：X连锁隐性，PLP1基因突变致神经髓鞘合成障碍；典型表现眼球震颤、肌张力低下、进行性运动功能障碍、痉挛性截瘫、共济失调伴认知损害；MRI脑白质弥漫性高信号、髓鞘发育不良或完全无发育（类似新生儿）；分6型（先天型最严重，常PLP1点突变；经典型最常见1~5岁起病，多PLP1重复突变）。\nCanavan病（海绵状白质脑病）：常染色体隐性，ASPA基因突变致天冬氨酸酰基转移酶缺陷，NAA堆积；分先天型/婴儿型（最常见2~6个月）/少年型；尿NAA明显增高是重要生化诊断指标，MRS示NAA峰显著升高。\n亚历山大病（AXD）：第1个被发现的遗传性星形胶质细胞病，常染色体显性，95%为GFAP基因突变；Ⅰ型（<4岁）智力运动发育迟滞或倒退、大头、癫痫，MRI 5条标准（额叶为主广泛对称白质病变、脑室周围线样低信号、基底节丘脑异常、脑干异常、结构强化）中符合4条确诊；Ⅱ型（>4岁）以幕下病变为主。\nCockayne综合征（侏儒-视网膜萎缩-耳聋综合征）：常染色体隐性，CSB（ERCC6）和CSA（ERCC8）基因；不匀称矮小、早老面容、小头、智力运动落后、光敏性皮肤损害、视网膜色素变性；诊断3项主要指标（生长障碍<5百分位、发育落后、小头畸形）+3项次要指标（皮肤光敏感、色素性视网膜病/白内障、感音神经性耳聋、釉质发育不全、眼球内陷）即可临床诊断；ERCC6/ERCC8基因确诊；无有效治疗。' },
{ m: '30C', q: 'Leigh综合征（LS）的临床表现、诊断标准与治疗？', a: '定义：儿童最常见的以进行性神经退行性病变为表现的线粒体脑肌病，又称亚急性坏死性脑脊髓病；1951年Leigh首次描述；96个致病基因，高度遗传异质性；头颅MRI双侧对称性基底节和/或脑干异常是特征。\n病因：mtDNA突变占30%（MT-ATP6最常见，其次MT-ND6、MT-ND3），nDNA突变是主要病因（SURF1最常见约10%，其次PDHA1）。\n临床：生后3~12个月发病（2岁以内占83%，中位7个月），常由急性感染、手术、禁食等代谢应激触发；发育倒退是发病标志；神经系统首发多样——1岁内多生长迟缓、喂养困难、持续呕吐、肌张力低下、发育落后，标志是急性失代偿脑病和癫痫；2~3岁多步态异常、肌张力障碍、共济失调、眼睑下垂、眼外肌麻痹；常合并眼震、吞咽困难、呼吸不规则（脑干受累）；39.2%合并癫痫；心脏受累最常见（心肌病、心律失常）；消化系统以肝脏受累最多；眼症状突出。\n辅助检查：血和/或脑脊液乳酸升高（>70%），脑脊液乳酸升高更有意义，乳酸正常不能除外；MRI典型双侧对称基底节区/脑干病灶（Leigh样影像学改变，壳核、苍白球、尾状核、中脑导水管周围、红核、黑质、脑桥背部及延髓），急性期DWI高信号，MRS病灶部位可有乳酸峰。\n诊断标准（2016 Lake）：①智力和运动发育落后和/或倒退；②与对称性脑干和/或基底神经节神经放射学异常相一致的临床表现；③氧化磷酸化或丙酮酸脱氢酶复合物活性缺陷的代谢异常，或线粒体功能障碍相关的分子遗传学诊断，或脑脊液乳酸>1.8mmol/L或血乳酸>2.2mmol/L。\n治疗：缺乏根本治疗；鸡尾酒疗法（辅酶Q、L-肉碱等）缺乏循证依据；特异性——BBGD给生物素10~20mg/(kg·d)+硫胺素100~300mg/d；生物素酶缺乏给生物素5~10mg/(kg·d)；避免丙戊酸、巴比妥类等损害线粒体功能的抗癫痫药；营养支持重要。\n预后：总体差，中位死亡年龄2.4岁。' },
{ m: '30C', q: 'MELAS（线粒体脑肌病伴高乳酸血症和卒中样发作）的临床、诊断与治疗？', a: '定义：mtDNA突变所致母系遗传性线粒体脑肌病；1984年Pavlakis首先报道；以反复卒中样发作、癫痫发作、运动不耐受、肌无力、偏头痛、生长迟缓、乳酸酸中毒为主要表现。\n病因：MT-TL1基因最常见，m.3243A>G为热点突变（占80%以上），其次m.3271T>C和MT-ND5 m.13513G>A；卒中样发作机制认为是NO不足导致的缺血性微血管病。\n临床：发病高峰2~10岁；卒中样发作和癫痫发作是两大核心症状和最常见首发症状；几乎所有患者都有卒中样发作（癫痫、视力下降、语言障碍、轻偏瘫、头痛呕吐，多在应激时发病，易误诊为病毒性脑炎），可致持续性部分性癫痫（EPC）；其他：身材矮小、多毛、运动不耐受、偏头痛、感音神经性耳聋、预激综合征、心肌病、糖尿病和肾病。\n病理：骨骼肌破碎红纤维（RRFs，改良Gomori三色染色可见）。\n诊断标准4条：①主要症状一条（卒中样发作、癫痫和/或认知障碍）；②其他症状一条（感音神经性耳聋、糖尿病、身材矮小、运动不耐受、胃肠功能障碍）；③血乳酸增高或MRS/脑脊液乳酸增高或FGF21、GDF15升高；④线粒体功能障碍证据之一（明确MELAS相关基因突变、骨骼肌活检线粒体异常、线粒体酶复合物活性降低）。符合4条确诊、前3项拟诊、前2项疑诊。\n鉴别：病毒性脑炎（学龄期发病、脑外多系统受累、乳酸增高而脑脊液细胞数不高、卒中样发作反复出现）；脑梗死（病灶为非血管支配区域分布，MRA未见血管异常）；脑肿瘤。\n治疗：无特异；急性期静脉精氨酸（可缩短卒中样发作时间，美国线粒体学会共识推荐），长期口服精氨酸可预防；糖皮质激素稳定血脑屏障；避免丙戊酸（损害线粒体）；避免氨基糖苷类、利奈唑胺等线粒体毒性药物；鸡尾酒疗法（辅酶Q10、艾地苯醌、左卡尼汀、B族等）缺乏循证依据；平均生存期发病后16.9年，死亡高危因素为癫痫持续状态、6岁以前发病和严重乳酸血症。' },
{ m: '30D', q: '无菌性脑膜炎综合征的定义、病因分类与诊断分级？', a: '定义：脑膜炎症，即脑脊液淋巴细胞≥5个/mm³并与感染过程无关，但患者有脑膜刺激症状；又称浆液性脑膜炎；是除外性诊断。\n病因4大类：\n①脑膜受累的全身性疾病：白塞综合征、结节病、系统性红斑狼疮、肉芽肿性多血管炎；\n②药物引起：4种主要药物——NSAIDs（尤其布洛芬）、抗生素（尤其磺胺、青霉素）、静脉注射免疫球蛋白（尤其输注太快）、单克隆抗体；停药后预后非常好；\n③肿瘤性脑膜炎：实体癌转移（乳腺癌、肺癌、黑色素瘤）或恶性血液病（淋巴瘤、白血病），占所有肿瘤3%~8%；\n④非细菌（病毒）引起：最常见肠病毒（夏末秋季流行），HSV是最常见原因（通常HSV-2），其他有流感、麻疹、水痘-带状疱疹、腺病毒等。\n临床表现：发热86%、头痛79%、脑膜征70%、意识改变50%、肌痛54%；5岁以下儿童风险最大。\n诊断（Shukla标准）：脑脊液细胞增多、淋巴细胞≥5个/mm³、革兰染色及脑脊液培养均阴性；分3级——1级CSF培养阴性且无抗生素暴露史，2级培养阴性有抗生素治疗史，3级伴脑炎症状。\n治疗：病因不同治疗方法不同，大多数患儿无需医疗可在两周内自行康复。' },
{ m: '30D', q: '脑脓肿的病因分类（感染途径）、病理三阶段、临床表现与治疗？', a: '定义：化脓性致病菌侵入脑组织内所形成的坏死性脓腔；表现为隐性感染、颅内压增高及脑局灶性症状体征；年发病率（0.3~1.3）/10万，儿童约0.5/10万；80%可明确诱发因素。\n感染途径：\n①血源性（约30%）：与菌血症有关（先天性发绀型心脏病、肺部疾病、牙源性感染），儿童脑脓肿4%~7%由先心病引起（红细胞增多血液浓缩易血栓、低氧环境利于细菌增殖、左向右分流降低肺部细菌滤过）；\n②邻近感染局部扩散（30%~50%）：中耳炎乳突炎→颞叶和小脑脓肿，鼻窦炎→额叶脓肿；\n③损伤性（约10%）：神经外科手术或头部外伤；\n④隐源性（约20%）。\n病原：邻近扩散多为链球菌（肺炎链球菌、溶血性链球菌）+厌氧菌；外伤/手术后多为金黄色葡萄球菌。\n病理三阶段：①急性脑炎阶段（局限性化脓性脑炎，全身感染反应）；②化脓阶段（软化坏死区融合扩大，肉芽组织形成，全身症状可好转）；③包膜形成阶段（婴幼儿对感染局限能力差，脓肿大而无明显包膜，可破入脑室致化脓性脑室炎）。\n临床表现：经典三联症为发热、头痛和局灶性神经系统症状；颅内压增高（退热后仍头痛、喷射性呕吐）；局灶体征（额叶——淡漠性格改变；颞叶——同向偏盲、感觉性失语；小脑——共济障碍、眼震）。\n治疗：包膜形成前可抗生素+降颅压（单纯药物治疗指征——一般状况差不能耐受手术、多发小脓肿、位于重要功能区尤其优势半球、伴脑膜炎或室管膜炎、脑积水需分流）；包膜形成后（>2.5cm）应及早手术（立体定向抽吸最常见），术前后均用大剂量敏感抗生素；经验用药——邻近扩散：三代头孢+甲硝唑（疑MRSA加万古）；外伤术后：万古+甲硝唑+三四代头孢。\n预后：死亡率5%~10%；27%遗留癫痫发作（建议治疗后无论有无发作预防性服抗癫痫药1~2年）；45%遗留不同程度神经功能障碍。' },
{ m: '30D', q: '亚急性硬化性全脑炎（SSPE）的病因、临床分期、实验室检查？', a: '病因：由突变的麻疹病毒引起的缓慢进行性脑部疾病；是波及全脑的炎症性变性病；初次感染后约1~10年（7~11年）发展；好发5~15岁（高峰），5岁以下麻疹患者风险最高；普遍接种麻疹疫苗后发病率大幅下降，SSPE发病率与麻疹成正比。\n临床4期：\n第Ⅰ期（早期）：行为改变、嗜睡、疲倦、学校适应困难、性格变化，神经功能下降不超过30%；\n第Ⅱ期：肌阵挛是特征性表现（弥漫性、重复性、频发，大多对称，全身性肌阵挛每5~10秒一次，锥体外系刺激性病变所致），严重精神衰退，周期性阵挛；\n第Ⅲ期：无动性缄默症、痉挛卧床不起；\n第Ⅳ期：植物状态，自主神经功能衰竭，最终死亡。\n眼部症状可在神经症状前数周到数年出现：脉络膜视网膜炎伴黄斑侵犯是SSPE特征。\n实验室：\n脑脊液：通常正常或蛋白轻度升高，但免疫球蛋白升高明显（CSF免疫球蛋白占总蛋白20%以上是标志性异常）；CSF和血清中高滴度麻疹IgM和IgG是诊断金标准（CSF中抗麻疹IgM滴度高于血清，表明IgM在中枢神经系统产生）；寡克隆区带约90%阳性。\n脑电图：广义周期性复合波或放电（周期性暴发抑制EEG仅见于第2期）。\n神经影像：晚期局灶性白质低密度（主要影响枕区），终末期脑萎缩。' },
{ m: '30D', q: 'SSPE的诊断标准与治疗？', a: '诊断（传统5点线索，符合3条可确诊）：①典型的临床表现；②特征性脑电图式样（广义周期性复合波）；③脑活检或尸检证实的典型组织学改变；④脑脊液球蛋白增高>总蛋白量的20%；⑤血清和脑脊液麻疹病毒抗体滴度升高（血清>1:24，脑脊液>1:8补体结合抗体）。\n简化标准：目前只要具备相应的临床表现（不一定十分典型）以及脑脊液麻疹抗体升高2项条件即可建立诊断；如还具备麻疹病史或接种史、典型分期、EEG异常、脑脊液球蛋白升高及神经影像动态变化等支持条件则诊断更肯定。\nMRI：SSPE早期表现正常，晚期异常位于皮质下、脑室周围和皮质灰质，胼胁体、基底节、小脑和脑干受累较少。\n鉴别：自身免疫性脑炎（与急性暴发性SSPE有相似性）、单纯疱疹病毒性脑炎、神经梅毒、进行性多灶性白质脑病；如出现视盘水肿、局灶神经功能缺损和局灶发作可误诊为脑肿瘤；白质影像学特征与ADEM相似但SSPE对免疫疗法无效。\n治疗：缺乏特效疗法。①异丙肌苷100mg/(kg·d)分次服用，可能增加存活时间、改善某些症状；②干扰素鞘内注射或静脉注射可延缓病情进展；③对症治疗（止惊、防治感染、理疗及护理）。' },
{ m: '30D', q: '非传统性进行性脑病（PML、进行性风疹全脑炎、库鲁病）的要点？', a: '病因：并非通常所说的病毒，而是比病毒还小的致病因子（朊病毒等）。\n进行性多灶性白质脑病（PML）：罕见、进行性、致命的脱髓鞘疾病，可杀死少突胶质细胞（记忆力下降、失去协调、精神错乱、视力受损）；由多瘤病毒家族引起，通常是JC病毒；多达5%的艾滋病患者可发展为PML；可能是JC病毒潜伏感染（潜伏于肾）的重新激活；患者常有免疫系统异常；无特效疗法。\n进行性风疹全脑炎（PRP）：风疹病毒感染后非常罕见的后果；最初感染通常是先天性或出生后不久，PRP发作在8~19岁，病程可持续多年；临床表现类似SSPE但肌阵挛不如SSPE明显；可有癫痫发作、进行性痉挛状态、共济失调、智能损害和惊厥，无头痛发热颈抵抗；EEG弥漫性慢波无周期性；先天性风疹患儿出现进行性神经症状+脑脊液细胞计数/总蛋白/丙种球蛋白增高+脑脊液和血清抗风疹病毒抗体效价升高+脑组织中发现风疹病毒即可确诊；无特异疗法。\n库鲁病（kuru）：首先发现于新几内亚，与食人习俗有关；妇女儿童因承担准备尸脑任务而感染机会大；初次接触后4~20年发病；早期体征为轻微震颤伴平衡障碍及共济失调，逐渐进展为步态异常、面肌异常和语言障碍，精神和认知早期保持较好，晚期严重痴呆；终末期严重嗜睡、易激惹终致昏迷；病程数月至2年，多数1年内死亡；实验室检查常无阳性发现，诊断主要靠病理检查（弥漫性神经元变性、小胶质增生、星形胶质细胞肥大、大脑皮质灰质海绵样变，小脑脑干基底节尤重，全脑圆形淀粉样变斑块，形态与疯羊病脑内纤丝相似）；无特效疗法。' },
{ m: '30D', q: '脓毒症相关性脑病（SAE）的定义、发病机制、临床表现与诊断？', a: '定义：大脑没有直接感染的临床或实验室证据，由全身炎症反应或脓毒症引起的弥散性脑功能障碍；SAE是ICU中最常见的脑病，70%的脓毒症患者具有从嗜睡到昏迷等不同程度的神经系统症状，超过80%存在脑电图异常；可能是脓毒症的首发症状（一半以上患者入院前以脑病症状出现）；死亡率随SAE严重性增加，高达70%。\n机制：感染引起全身炎症反应作用于大脑，导致脑内炎症反应、微循环、血脑屏障及神经递质传递异常；可能致病因素包括细菌内毒素、氧化应激、血脑屏障通透性改变、促炎因子升高、谷氨酸兴奋毒性、线粒体和血管内皮功能障碍、脑血管功能障碍；脓毒症患儿脑血流自主调节功能受损+全身血压降低，是诱发小儿SAE的主要因素；炎症介质可引起颅内血流动力学变化及血脑屏障损伤，导致脑水肿。\n临床：SAE相关认知或脑功能改变可出现在脓毒症或全身炎症反应症状前36~48小时；早期主要表现为谵妄等精神状态急剧改变（注意力不集中、定向障碍、烦躁到嗜睡昏睡昏迷）；随后可出现扑翼样震颤、眼震样运动、多灶性肌阵挛、呼吸急促、张力性强直、足底伸肌反应、惊厥等；过度通气可能是早期SAE的特征，甚至是唯一神经系统症状。\n诊断：排他性诊断，必须排除药物使用、电解质紊乱和中枢神经系统紊乱等的影响；排除CNS感染（细菌、病毒、真菌、寄生虫脑膜炎，硬膜外/下积脓，脑脓肿，免疫相关脑炎）、酒精或药物中毒、非惊厥持续状态、Wernicke脑病、可逆性后部脑病综合征、血清素综合征、肝性脑病、镇静剂或阿片类药物撤药反应、抗精神病药恶性综合征等；EEG是较敏感的工具（12%~100%背景异常，6%~12%三相波异常）。\n预后：多数脑症状经适当治疗后24小时内消失无后遗症；昏迷久者后遗症可能性大（智能不全、失明、耳聋、肢体强直、瘫痪、癫痫）；SAE患儿短期随访神经发育迟缓、语言智商低、学业成绩下降。' },
{ m: '30D', q: '硬脊膜外脓肿的感染途径、临床表现（三期）、诊断与治疗？', a: '定义：脊髓的外壳与脊柱骨头之间（椎管内硬脊膜外间隙）积聚脓液和细菌；胸段最常见（50%），其次腰骶段（35%）、颈段（15%）；多位于脊髓神经节后方（82%）。\n感染途径：①血液和淋巴传播（最常见，皮肤疖肿占15%，细菌性心内膜炎、呼吸道感染、口腔脓肿）；②直接扩散（腰骶部压疮、椎体结核腰大肌脓肿、开放性外伤、硬膜外麻醉、腰椎穿刺等）；③隐源性（约50%，多数实际为血源性）。\n病原：最常见金黄色葡萄球菌（占50%），其次链球菌；慢性者多继发于椎体结核（占25%）。\n临床表现三期：①根痛期——感染中毒症状1~3天后出现相应脊髓节段神经根刺激症状（难以忍受的疼痛、脊柱叩击痛；患儿表现为哭闹不安、脊柱侧弯、强迫体位；胸腰段者剧烈腹痛或下肢痛易误诊急性阑尾炎）；②脊髓功能障碍期——根痛期数小时或几天内发生脊髓横贯性损害（双下肢麻木、迅速进展性肌力减退、括约肌功能障碍）；③完全瘫痪期——肢体完全性软瘫，一切反射消失，大小便潴留。\n辅助检查：MRI典型为T1低或等信号、T2高信号硬膜外占位，增强扫描脓壁环状薄壁强化。\n治疗：早期未出现完全性截瘫前诊断并积极手术治疗（一旦延误出现完全性截瘫则术后脊髓功能难以恢复）；手术切除脓肿部位椎板（上下界达正常硬脊膜），不可切开硬脊膜以免感染向硬脊膜下腔扩散；抗生素疗程——单纯硬脊膜外脓肿静滴3~4周后继续口服4周，合并椎体骨髓炎者静滴6~8周。\n预后：第一或第二期手术效果较好，截瘫出现6~12小时后手术则神经功能恢复者甚少；死亡率18%~23%。' },
{ m: '30D', q: '硬脑膜外脓肿（IEA）的感染途径、临床表现、CT特征与治疗？', a: '定义：硬脑膜与头骨或脊柱骨头之间积聚脓液；多数由金黄色葡萄球菌感染引起。\n感染途径：①邻近感染直接扩散（颅骨骨髓炎破坏颅骨内板、额窦炎破坏额窦后壁、中耳炎或乳突炎破坏岩骨鼓室盖或乙状窦前壁）；②血行感染（头皮疖肿或面部感染经颅骨导静脉扩散，化脓性栓塞静脉炎）；③开放性颅脑损伤后异物存留。\n致病菌：鼻窦炎继发者最常见链球菌；外伤后感染和颅骨骨髓炎导致者常见金黄色葡萄球菌或表皮葡萄球菌。\n临床表现：急性期全身感染反应（畏寒高热血象增高）；局限性头痛（位置多与脓肿部位一致，局部硬膜炎症刺激）；严重感染可出现高热寒战谵妄抽搐和脑膜刺激征；合并硬膜下积脓时可出现脑水肿和颅内压增高；因硬脑膜组织致密，单纯硬脑膜外脓肿往往感染较局限，颅内压增高症状和脑脊液炎症细胞检查常不明显；慢性期症状反而减轻。\n特征性表现：继发于颅骨骨髓炎/外伤异物——局部肿胀、脓肿窦道；额窦炎——额部和眶周皮肤肿胀、眶上神经带状疱疹样感觉过敏带、叩击痛；乳突炎中耳炎——乳突根部肿胀压痛，侵及岩骨尖出现同侧三叉神经和外展神经损害（岩尖综合征）。\nCT特征：颅骨内板下方梭形低密度病变、范围较局限、脑组织受压内侧移位，增强扫描内缘炎症反应的硬脑膜明显带状强化是特征性影像表现，脓腔内积气时可出现气液平面；鉴别硬膜外血肿（血肿CT值高于脓肿，增强扫描无包膜内缘弧形强化）。\n治疗：首选手术彻底清除病灶，术前术中术后均用大剂量抗生素控制感染扩散；清除硬脑膜外脓液后探查增厚的硬脑膜，小心清除表面肉芽组织并避免穿通硬脑膜；所有异物取出（骨蜡、化学性止血材料）；硬脑膜外腔与骨性含气腔隙的所有通道均应封闭；单纯性硬脑膜外脓肿早期手术切除后预后良好。' },
{ m: '30D', q: '瑞氏综合征（Reye syndrome）的定义、病因、临床表现（分期）、诊断与治疗？', a: '定义：罕见的可致命儿童疾病，伴有脂肪肝衰竭的急性非炎性脑病；以服用水杨酸类药物（阿司匹林）为重要病因；通常始于服用阿司匹林的病毒性疾病恢复后的几天；病理基础是广泛的线粒体受损，也是全身性线粒体功能障碍性疾病。\n病因：①感染（病前常见病毒感染，流感、水痘-带状疱疹、副流感、肠道病毒、EB病毒等）；②药物（病毒感染时服用水杨酸盐者发生本病可能性大，已证实对线粒体有多方面抑制作用；丙戊酸、氰化物、胺碘酮等也可引起相同症状）；③毒素（黄曲霉素、有机磷与有机氯杀虫剂）；④遗传代谢病（全身性肉碱缺乏症、鸟氨酸氨甲酰基转移酶缺乏的高氨血症等，称瑞氏样综合征）。\n临床表现：6个月至4岁多见；前驱病毒感染后数日或2~3周出现急性脑病和肝功能异常；频繁呕吐（颅内压增高刺激脑干），24~48小时精神状态改变（嗜睡、谵妄、去皮质或去脑强直）；一般无高热，神经系统局灶征和脑膜刺激征不明显，无黄疸，肝脏轻中度肿大。\n分期（Lovejoy 1974）：Ⅰ期呕吐、嗜睡、淡漠；Ⅱ期定向力丧失、谵妄、不安、呼吸深快、腱反射亢进、肝功能不全；Ⅲ期意识模糊或昏迷、去皮质强直、过度换气、病理反射、肝功能不全、EEG明显异常；Ⅳ期昏迷加深、去大脑强直、瞳孔散大对光反应消失、脑干功能障碍、视乳头水肿；Ⅴ期全身肌张力消失、腱反射引不出、对外界刺激无反应。Ⅰ、Ⅱ期代表脑水肿加重和肝功能障碍所致代谢紊乱，Ⅲ、Ⅳ、Ⅴ期是颅内压增高和脑疝的发展。\n辅助检查：血氨早期升高（可达176μmol/L以上，数日内降至正常）；血清转氨酶升高、凝血酶原时间延长；低血糖（婴儿最明显）；血乳酸丙酮酸增高，代谢性酸中毒和呼吸性碱中毒并存；线粒体酶活性明显降低而细胞质酶活性正常；脑脊液压力增高但无炎症改变（细胞数蛋白正常）；脑电图弥漫性脑病改变广泛高幅慢活动。\n诊断：前驱病毒感染+急性进行性脑症状（呕吐、惊厥、意识障碍）+无神经系统局灶征+脑脊液压力高但无炎症改变+生化代谢特点（血氨高、血糖低、凝血酶原时间延长、转氨酶升高、血胆红素不高）；肝活检电镜检查是确诊依据。\n鉴别：中枢神经系统感染（脑脊液有炎症改变）、病毒性肝炎脑症状（有黄疸和持续性肝功能损害）、急性中毒性脑病（无线粒体病变、不伴内脏脂肪变）、Leigh病及脑型婴儿脚气病。\n治疗：综合措施——①纠正代谢紊乱（低血糖及时纠正、电解质酸碱平衡、维生素K）；②控制脑水肿降颅压维持脑灌注压（甘露醇0.5~1.0g/kg每4~6小时1次，地塞米松，血液渗透压维持315~320mOsm/L，脑灌注压=平均动脉压-颅内压，维持50mmHg以上；过度通气使PaCO2降至4.67kPa左右）；③降血氨（精氨酸滴注、新霉素口服或灌肠、苯乙酸钠-苯甲酸钠，血氨>500μg/dl需血液透析或血浆置换）；④护理控制惊厥。\n预后：病死率10%~40%；早期昏迷、去大脑强直、反复惊厥、血氨176μmol/L以上、高血钾、空腹血糖2.2mmol/L以下者预后不良；存活者可有智力障碍、癫痫、瘫痪、语言障碍或行为异常。' },
{ m: '30E', q: '自身免疫性脑炎（AE）的概述、抗体分类及儿童常见类型？', a: '定义：由自身免疫性炎症介导的脑炎；2007年发现抗NMDAR脑炎以来一系列抗神经元表面或突触蛋白自身抗体被发现；抗NMDAR脑炎最常见（约占AE的80%），也是儿童AE最主要类型。\n抗体分类：\n①抗细胞外抗原（突触受体、离子通道等）抗体——通常是致病性抗体；\n②抗细胞内抗原抗体——只是提示自身免疫反应的生物标志物，很可能非致病性。\n成年AE患者一部分为副肿瘤性，儿童AE患者肿瘤发生率远低于成人。\n儿童中最主要的抗体：NMDAR、MOG（髓鞘少突胶质细胞糖蛋白）、GAD65（谷氨酸脱羧酶65）；也可见GABA受体、多巴胺2型受体（DR）、甘氨酸受体（GlyR）和代谢型谷氨酸受体5（mGluR5）抗体相关AE；儿童AE中50%可伴前驱发热，癫痫发作、运动障碍、认知下降和行为改变较多见。\n各型特点：\n抗NMDAR脑炎：精神行为异常、癫痫发作、运动障碍，常见言语减少/缄默、睡眠障碍、自主神经不稳定；MRI 65%正常；EEG 90%以上异常（广泛慢波、局灶痫性放电或持续纺锤/delta刷）；脑脊液抗体阳性优于血清；女性尤其12岁以上注意排查肿瘤（卵巢畸胎瘤）。\n抗MOG抗体：可表现ADEM、伴癫痫发作的皮质脑炎、脑干脑炎、不伴脱髓鞘的脑膜脑炎；血清MOG抗体检测优于脑脊液；单相病程抗体滴度下降快，复发性病程抗体持续存在。\n抗GAD65：记忆力减退、认知下降、小脑共济失调、颞叶起源癫痫；血清滴度高且脑脊液阳性才有致病性；免疫治疗常效果欠佳。\n抗LGI1：面-臂肌张力不全发作（FBDS）；抗CASPR2：莫旺综合征。' },
{ m: '30E', q: '自身免疫性脑炎的诊断标准（2017中国共识及2020儿童标准）？', a: '2017年中国AE诊治专家共识——诊断条件：\n1）临床表现：急性或亚急性起病（<3个月），具备1个或多个：①边缘系统症状（近期记忆减退、癫痫发作、精神行为异常）；②脑炎综合征（弥漫或多灶性脑功能障碍）；③基底节和/或间脑/下丘脑受累表现；④精神障碍（不符合精神科疾病特点）。\n2）辅助检查1项以上：①脑脊液异常（有核细胞>5×10⁶/L、淋巴细胞样炎症或寡克隆区带阳性）；②神经影像学或电生理异常（MRI边缘系统T2/FLAIR异常信号；PET边缘系统高代谢；EEG局灶性癫痫样放电或弥漫/多灶慢波节律）；③与AE相关的特定类型肿瘤（如青春期女性抗NMDAR脑炎合并卵巢畸胎瘤）。\n3）确诊试验：抗神经元表面抗原的自身抗体阳性（间接免疫荧光法/基于细胞底物的CBA法，尽量同时检测脑脊液和血清）。\n4）合理排除其他可引起脑炎/脑病的病因。\n诊断标准：可能AE=符合第1、2和4条；确诊AE=符合第1~4条。\n2020年AE国际工作组儿科小组标准：分可能AE、很可能的抗体阴性AE、确定的抗体阳性AE三类；要点——既往健康儿童≤3个月内出现神经和/或精神症状；≥2个神经功能障碍特征（精神状态/意识改变、局灶神经功能缺陷、认知障碍、急性发育倒退、运动障碍、精神症状、癫痫发作）；脑脊液炎症性改变（白细胞>5/mm²和/或寡克隆区带）、MRI脑炎特征或脑活检炎症浸润；血清和/或脑脊液AE相关抗体。注意：如脑脊液中检测到NMDAR、GABAAR或GAD65抗体，不需要神经炎症辅助检查证据即可诊断；但如仅有血清抗体阳性，则需至少1个神经炎症辅助检查标准。\n鉴别：病毒性脑炎、脓毒症脑病、FIRES（热性感染相关癫痫综合征）、急性坏死性脑病、中毒性脑病、Rasmussen脑炎、遗传代谢性脑病、神经精神性狼疮、原发中枢小血管炎、精神科疾病。' },
{ m: '30E', q: '自身免疫性脑炎的治疗与预后？', a: '治疗：\n确定的抗体阳性AE主要治疗为免疫治疗；\n一线免疫治疗：糖皮质激素、静脉注射免疫球蛋白（IVIg）、血浆置换；\n二线治疗：利妥昔单抗与环磷酰胺；一线免疫治疗后2周左右效果不佳考虑二线；糖皮质激素总疗程约6个月；\n复发性AE：可选用吗替麦考酚酯或硫唑嘌呤，儿童复发性AE患者也可选用利妥昔单抗预防复发；副肿瘤性AE患者应首先切除肿瘤；\n很可能的抗体阴性AE也应考虑一线免疫治疗，效果不佳先进一步鉴别诊断再考虑二线；可能的AE尽可能寻找辅助检查证据并鉴别，可尝试一线免疫治疗；\n对症治疗：抗癫痫、精神症状治疗及康复治疗。\n预后：儿童AE总体预后良好，80%的抗NMDAR脑炎患者功能恢复良好，早期接受免疫治疗和非重症患者预后较好；少数完全康复需要2年以上；复发定义——症状好转或稳定2个月以上重新出现症状或症状加重（改良Rankin评分增加1分及以上）。' },
{ m: '30E', q: '急性播散性脑脊髓炎（ADEM）的临床、诊断标准与治疗预后？', a: '定义：儿童及青少年期最常见的获得性中枢神经系统炎症性脱髓鞘疾病，多于前驱感染或疫苗接种后急性发病，表现为伴有脑病的多样化中枢神经系统症状；50%~75%患者起病前有前驱病毒感染，部分有疫苗接种史；病理为小静脉袖套样脱髓鞘伴炎症细胞浸润。\n分单相性ADEM和多相性播散性脑脊髓炎（MDEM）。\n临床：通常急性起病；前驱感染或疫苗接种史可见于80%以上患儿；神经系统症状2~5天达高峰，进展期<3个月；所有患儿均有脑病症状（意识障碍和/或行为异常，不能用发热或癫痫发作后状态解释）；其他：偏瘫、锥体外系症状、共济失调、癫痫发作、视神经炎、脑干及脊髓受累；ADEM患儿发热和癫痫发作症状较其他急性中枢脱髓鞘综合征更常见。\n辅助检查：MRI——不对称边界欠清晰T2/FLAIR高信号病灶，累及皮质下白质、中央区白质、基底节、脑干、丘脑和小脑，30%增强可强化；脊髓受累约1/3；脑脊液42%~72%细胞数正常，蛋白升高23%~62%；血清MOG-IgG可见于约40%的ADEM患儿。\n诊断标准（2013 IPMSSG）：①第1次多灶性CNS脱髓鞘发作；②必须有脑病表现（意识障碍或行为改变，且不能用发热或癫痫发作后状态解释）；③起病3个月后无新的临床或MRI病灶出现；④急性期MRI异常，典型特点——病灶广泛、边界欠清晰、常>1~2cm、累及大脑白质为主、可伴深部灰质核团（基底节或丘脑）病灶。MDEM：两次符合ADEM诊断标准的发作，间隔至少3个月。\n鉴别：多发性硬化（病灶多以脑室旁为主，常可见垂直于胼胝体的椭圆形病灶）、CNS血管炎、感染、大脑胶质瘤病、遗传性脑白质病（白质病灶多为双侧对称性）。\n治疗：急性期一线糖皮质激素（4~6周减停）；可同时用大剂量丙种球蛋白（总量2g/kg）；少数严重者可血浆置换；对症（止惊、降颅压）。\n预后：大多数预后较好，死亡率1%~3%；约75%单相性病程，其余可演变为MDEM、ADEM-视神经炎、NMOSD、MS等。' },
{ m: '30E', q: '视神经脊髓炎谱系疾病（NMOSD）的核心症状、诊断标准（2015国际）与治疗？', a: '概述：儿科较常见的中枢神经系统炎症性脱髓鞘综合征；以视神经炎、长节段脊髓炎及延髓最后区综合征为主要核心症状；1894年最早描述（Devic病）；2004年检测到AQP4-IgG使该病从MS中独立出来；2015年国际NMO诊断小组制定新标准。\n发病机制：AQP4抗原主要表达于形成血脑屏障及突触周围的星形胶质细胞终足、郎飞结及渗透压敏感区；AQP4-IgG进入血脑屏障后与AQP4抗原结合，导致中性粒细胞募集，通过补体介导及抗体介导的细胞毒性引起少突胶质细胞损伤、脱髓鞘甚至神经元丢失。\n临床：儿童NMOSD女性多见（男性约占30%）；急性或亚急性起病，多相性病程；①视神经炎（视力下降、眼球运动疼痛）；②脊髓炎（多≥3节段长节段脊髓炎，运动感觉障碍、膀胱直肠功能障碍）；③延髓最后区综合征（顽固性呃逆、恶心呕吐，无其他原因解释）；④脑干症状（头晕复视）、间脑综合征（发作性睡病样症状、低钠血症、体温调节异常）、大脑综合征；可合并干燥综合征、SLE、桥本甲状腺炎等。\n辅助检查：血清AQP4-IgG推荐CBA法检测（成人阳性占63%~76%，儿童阳性率较低约30%）；血清MOG-IgG可在AQP4-IgG阴性的部分NMOSD患者中检测到（儿童多见）；脊髓MRI长节段病变（纵向延伸≥3个椎体节段以上），轴位呈圆形或H型、中央灰质受累；急性视神经炎易累及视神经后段及视交叉（病变>1/2视神经长度）。\n诊断标准（2015国际）：\n①AQP4-IgG阳性：至少满足1项核心特征+可靠方法检测AQP4-IgG阳性+排除其他诊断。\n②AQP4-IgG阴性或未知：至少2个核心临床特征（其中1个必须是视神经炎、急性脊髓炎或最后区综合征之一；空间多发）+满足相应MRI要求+排除其他诊断。\n核心特征6项：视神经炎、急性脊髓炎、最后区综合征、脑干综合征、间脑综合征、大脑综合征。\n鉴别：AQP4-IgG阴性者需进行血清MOG-IgG检测；鉴别MS、CNS血管炎、噬血细胞综合征、感染、遗传性脑白质病。\n治疗：急性期——糖皮质激素（疗程通常<3个月），反应欠佳或病情重可加大剂量丙球（2g/kg），严重者血浆置换；预防性——AQP4-IgG阳性患儿90%为复发性病程，首次诊断即可考虑开始；常用吗替麦考酚酯、利妥昔单抗和硫唑嘌呤；前景药物托珠单抗（IL-6受体单抗）、依库丽单抗（补体C5单抗）；MS治疗药物（β干扰素、醋酸格拉替雷）不适合NMOSD。\n预后：多数复发性，反复发作后多遗留视力障碍及锥体功能障碍；儿童NMOSD 2年EDSS评分2.25±1.25。' },
{ m: '30E', q: '多发性硬化（MS）的临床、诊断标准（2017 McDonald及2013儿童IPMSSG）与治疗？', a: '定义：具有时间多发性与空间多发性特征的慢性反复性中枢神经系统炎症性脱髓鞘疾病；遗传因素与环境因素共同作用；病变包括髓鞘脱失、轴索损伤及炎症细胞浸润（T淋巴细胞、B淋巴细胞、巨噬细胞、小胶质细胞）。\n危险因素：维生素D不足、HLA-DRB1*15:01基因型、既往EB病毒感染。\n流行病学：MS患者中儿童期起病者（18岁以前）仅占3%~4%，多数11岁后起病；多见于高加索人，亚裔少见；成年及青春期女性居多。\n病程分型：①复发缓解型（成人80%以上，儿童97%以上）；②继发进展型（5~10年后持续缓慢进展）；③原发进展型（成人10%，儿童极罕见）。\n临床：首次发作多急性或亚急性；肢体无力、麻木、感觉异常、视力下降（视神经炎）、复视、共济失调或横贯性脊髓炎；多为复发缓解性病程，首次发作后2年内再发风险较高，儿童年复发率1.2%~1.9%（较成人更高）。\n辅助检查：头颅MRI典型特点为垂直于侧脑室的边界清楚的椭圆形或手指状病变（Dawson指）、弯曲的皮质下病灶、T1WI黑洞样病灶；脊髓MRI<3个节段（少数长节段）；脑脊液特异性寡克隆区带可见于90%以上MS患者（阴性要尤为注意其他鉴别诊断；并非MS特异，AE、NMOSD也可见）；血清AQP4-IgG及MOG-IgG检测对鉴别诊断有重要意义。\n诊断：三要素——时间多发性（DIT）、空间多发性（DIS）及排除其他疾病；2017 McDonald标准——DIS：4个部位（脑室旁、皮质或皮质下、幕下、脊髓）中至少2个部位存在≥1个MS特征病灶；DIT：同时存在非增强和增强病灶，或随访出现新病灶。\n2013 IPMSSG儿童标准（强调非脑病发作的重要性）任一：①≥2次非脑病CNS事件，间隔30天以上，累及1个以上部位；②1次非脑病发作+MRI符合空间多发性+随访出现至少1个新增强或非增强病灶；③1次ADEM发作至少3个月后出现非脑病临床发作+MRI符合空间多发性；④第1次急性发作不符合ADEM特点+MRI同时符合空间和时间多发性（仅用于12岁以上）。\n鉴别：NMOSD（好发亚裔及儿童；视神经炎、长节段脊髓炎、最后区综合征3大核心症状；AQP4-IgG或MOG-IgG阳性；脑脊液常有细胞数增多，少见寡克隆区带）；MOG抗体相关疾病（人种差异不明确，儿童好发；ADEM和ON最常见）。\n治疗：急性期大剂量糖皮质激素（短期），严重者可血浆置换、大剂量丙球；预防疾病活动（DMD）——一线干扰素β-1b、干扰素β-1a及醋酸格拉替雷；二线富马酸二甲酯、特立氟胺、芬戈莫德、利妥昔单抗、那他珠单抗等；干扰素β已获批12岁以上儿童适应证，芬戈莫德获批10岁以上复发缓解型MS；传统策略逐步升级治疗（每3~6个月评估，失败升级二线），儿童MS约60%需升级治疗，目前观点倾向早期使用更强二线。治疗目标——消除疾病活动（NEDA），至少疾病活动最小化。\n预后：儿童疾病活动度较成人高、复发更频繁，但功能障碍累积速度反而较慢（发育期脑可塑性强）；认知功能损害至少见于1/3患者。' },
{ m: '30E', q: '急性横贯性脊髓炎（ATM）的诊断标准、治疗与预后？', a: '定义：免疫介导的脊髓急性脱髓鞘疾病，以肢体无力、感觉障碍及括约肌功能障碍为主要特点；通过分子相似性及超级抗原效应等机制发病；可作为特发性ATM独立发生，也可作为ADEM、NMOSD、MS、MOG抗体相关疾病的一部分或继发于全身结缔组织病。\n临床：儿童ATM占20%，男:女约（1.1~1.6）:1，好发年龄双峰（5岁以下和10岁以上）；66%患儿发病前30天内有前驱感染史；后背痛常首发，随后运动障碍、感觉障碍及膀胱/直肠功能障碍；症状通常2~4天逐渐加重，5~6天达高峰。\n辅助检查：颈段及颈胸段脊髓受累多见（64%~76%），病灶中心性分布；长节段脊髓炎见于66%~85%儿童ATM患者；20%~50%脑脊液正常；需检测血清AQP4-IgG、MOG-IgG、ANA、SSA、SSB等。\n诊断标准（2002年横贯性脊髓炎工作组）——纳入标准：①脊髓病变导致的感觉、运动及自主神经功能障碍；②双侧症状和/或体征（不必完全对称）；③明确的感觉平面；④影像学排除脊髓外受压；⑤提示脊髓内炎症的证据（CSF细胞增多、鞘内IgG指数升高、MRI病灶增强；如起病时不符合，2~7天内复查）；出现症状后4小时~21天进展至高峰。\n排除标准：过去10年脊髓放射史；脊髓前动脉血栓血管分布区功能障碍；脊髓动静脉畸形；结缔组织病血清学及临床证据；CNS梅毒、莱姆病、HIV、HTLV-1、支原体及病毒感染；脑MRI异常提示MS；视神经炎病史。\n鉴别：吉兰-巴雷综合征、急性弛缓性脊髓炎、脊髓肿瘤、脊髓损伤、脊髓血管病变、髓外压迫、遗传代谢病。\n治疗：急性期首选糖皮质激素，可联合大剂量丙种球蛋白；效果不佳的重症者可血浆置换；支持对症（康复训练、抗痉挛、膀胱直肠功能锻炼）。\n预后：儿童总体优于成人，近半数2年内完全恢复；43%患儿中位随访3年时无法行走30英尺；恢复多始于病后1个月内，可持续半年。预后不良因素：起病年龄<3岁、症状24小时内达高峰、背痛作为首发症状、完全性截瘫、锥体束征持续阴性、感觉平面达颈段皮节；预后良好因素：平台期<8天、锥体束征阳性、病程1月内可独走。' },
{ m: '30F', q: '智力障碍（ID）的定义、分级及病因？', a: '定义：起病在发育时期（18岁以下），由生物学因素、心理社会因素等原因导致智力发育不全或受阻，同时伴有适应性行为缺陷的一组疾病；儿童患病率约1%~3%；ICD-11更名为智力发育障碍；DSM-5分智力障碍、全面性发育迟缓（5岁以下，两个或多个发育领域低于平均分≥2个标准差）和非特定智力障碍。\n诊断三标准（缺一不可）：①智力明显低于平均水平（IQ低于人群均值2个标准差，一般IQ在70或75以下）；②适应行为缺陷（个人生活和履行社会职责明显缺陷）；③表现在发育年龄（18岁以下）。单有智力缺陷或单有适应行为缺陷都不能诊断。\n分级（按IQ及适应行为4级）：\n轻度IQ 50~69（占70%~80%），成年后智力相当于9~12岁；\n中度IQ 35~49（占12%），相当于6~9岁；\n重度IQ 20~34（占8%），相当于3~6岁；\n极重度IQ<20（占1%~5%），低于3岁。\n病因两大类：\n①生物因素（占90%）：产前（遗传——染色体畸变如唐氏综合征、18-三体、猫叫综合征、脆性X，单基因病如苯丙酮尿症、结节性硬化；母孕期有害因素——风疹和巨细胞病毒感染、水杨酸及抗癫痫药、辐射、母体严重疾病、母龄>40岁染色体畸变、胎盘功能不足、母孕期情绪因素）；产时（窒息、颅内出血、产伤）；出生后（脑炎、脑膜炎、脑病占28.2%、惊厥后脑损伤20.1%、社会文化落后21.6%等）；\n②社会心理文化因素（占10%）。\n量表：格塞尔发育量表（DQ<75提示落后，4~6岁）、DDST（0~6岁筛查）、绘人试验（5~12岁筛查）、韦氏智力量表（WISC适用6~16岁，IQ切值70，误差+3）、斯坦福-比奈（2~18岁，切值68）；适应行为量表——Vineland（0~30岁）、AAMD适应行为量表等。' },
{ m: '30F', q: '脑性瘫痪（脑瘫）的定义、诊断条件、病因与临床分型？', a: '定义：出生前、出生时及生后脑发育早期各种原因所致的非进行性脑损伤或脑发育缺陷，主要表现为中枢性运动障碍及姿势异常。\n诊断条件2条：①婴儿时期出现症状（运动发育落后或各种运动障碍）；②需除外进行性疾病（代谢病或变性疾病）所致的中枢性瘫痪及正常小儿一过性运动发育落后。\n患病率：全球1‰~5‰；我国2010年32万1~6岁调查发病率2.48%、患病率2.46%；80年代后新生儿死亡率明显下降但脑瘫患病率反增多（围生医学、NICU进步使低体重儿和高危新生儿存活）；男孩多于女孩（1.45:1）。\n病因（危险因素）：\n出生前——多胎妊娠、遗传因素、胎儿脑发育畸形；\n出生时——新生儿窒息、缺氧缺血性脑病（HIE）及机械损伤；分娩过程中缺血缺氧高危因素：宫缩时正常胎心率变化消失持续时间长、胎心监测不到、生后有气管插管和心肺复苏史、脐动脉血pH<7.0且BE<-12mmol/L、HIE病史尤其伴惊厥、生后5/10/20分钟Apgar评分低、子宫破裂胎盘早剥脐带脱垂大出血等；\n新生儿期——早产和低出生体重（胎龄越小体重越低发生率越高；脑室周围白质软化是脑瘫患儿常见病变之一，更易发生于早产儿；足月儿出血部位往往在白质区或皮质区）、胆红素脑病（核黄疸）、各种中枢神经系统感染；约1/4脑瘫患儿找不到病因。\n临床分型（按肌张力及运动障碍性质）：\n①痉挛型：占60%~70%，病变以锥体束受损为主，肌张力增高，上肢屈肌张力过高（握拳状拇指内收）、下肢大腿内收肌张力过高（剪刀样步态、尖足），腱反射亢进，踝阵挛阳性，2岁后巴宾斯基征仍阳性；\n②不随意运动型（约占20%，锥体外系受累）；\n③共济失调型；\n④混合型。\n按受累部位分7种：四肢瘫、截瘫、偏瘫、三肢瘫、单瘫、双侧瘫痪（四肢受累但两下肢重）、双重偏瘫（双上肢重、下肢轻或左右严重程度不一致）。' },
{ m: '30F', q: '脑瘫早期诊断方法与治疗原则、康复训练要点？', a: '诊断方法：主要依靠病史+体格检查。早期检测（高危新生儿、<5月龄）最准确方法三结合——①全身运动评估（GMA，灵敏度95%~98%）；②头颅MRI（灵敏度80%~90%，可了解颅脑结构异常、探讨病因及判断预后，但正常MRI不能排除诊断）；③危险因素病史；加哈默史密斯婴儿神经系统检查（HINE，灵敏度96%）。5月龄后用MRI、HINE、幼儿发展评估表（DAYC）等。诱发电位判断视听障碍，脑电图了解是否合并癫痫。典型表现：拥抱反射6个月不消失、颈强直性反射持续存在阻碍翻身、握持反射延长呈握拳状、降落伞反射8~9个月引不出、保护性反射延缓出现。\n治疗原则4条：①早期发现早期干预（运动系统发育期易纠正）；②按小儿运动发育规律循序渐进促进正常发育、抑制异常运动姿势；③综合治疗（语言障碍、智力障碍、癫痫、行为异常均干预，培养生活/社交/职业能力）；④家庭训练与医生指导相结合（康复是长期过程）。\n功能训练：PT运动训练（粗大运动，Vojta、Bobath、引导式教育）；OT技能训练（目标导向、家庭方案、限制诱导、双手强化）；ST语言吞咽训练（发音、咀嚼吞咽、口周面部软腭舌肌控制，配助听器）。\n其他：矫形器矫正异常姿势防畸形；针灸推拿等中医疗法；水疗电疗光疗磁疗生物反馈；手术（选择性脊神经后根切断术、选择性周围神经切断术、颈动脉鞘交感神经网剥脱术、骨关节肌腱矫形术如跟腱延长术，主要适用于痉挛型）；药物无特效，不随意运动型可小量苯海索、苯二氮草类或巴氯芬，合并癫痫用抗癫痫药。\n伴随疾病：约半数合并智力障碍（痉挛型四肢瘫及强直型最常见），痉挛型偏瘫约半数合并癫痫，常合并斜视屈光不正偏盲、听觉障碍（胆红素脑病所致者尤甚）、行为语言障碍。' },
{ m: '30F', q: '神经纤维瘤病I型与Ⅱ型的临床表现、诊断标准与治疗？', a: '神经纤维瘤病：常见常染色体显性遗传神经皮肤综合征。\nI型（NF1）：基因NF1位于17q11.2，患病率约1/3000。表现：出生时即可见咖啡牛奶斑（浅棕、界限清楚、卵圆形，随年龄增多，正常小儿可有1~2个但>2个仅占0.75%）；腋窝/腹股沟雀斑（临床意义同咖啡斑）；皮肤神经纤维瘤（针头至葡萄大小、质软、有蒂或无蒂）；约半数有神经系统症状（小儿常见单发颅内肿瘤，较大儿童见椎管内肿瘤；丛状神经纤维瘤常波及面部，50%学习障碍、<10%智力障碍、6%~10%惊厥）；眼部Lisch小体（虹膜栗粒状棕黄结节，6岁后开始出现，特征性，成年95%有）、15%视神经胶质瘤（视力丧失、视神经萎缩、眼球突出）；骨骼（体格矮小、骨发育不良、病理性骨折、脊柱侧凸多位于下颈部）。\nI型诊断（符合2项即可）：①≥6个咖啡牛奶斑（青春期前横径>5mm、青春期后>15mm）；②≥2个任何类型神经纤维瘤或1个丛状神经纤维瘤；③腋窝或腹股沟雀斑；④视神经胶质瘤；⑤≥2个Lisch小体；⑥骨病变（蝶骨发育不良、长骨皮质变薄、假关节）；⑦一级亲属有I型患者。\nⅡ型：基因位于22q12.2，患病率约1/60000，完全外显。主要表现为双侧前庭神经鞘瘤（可波及三叉神经），可伴脑膜瘤、室管膜瘤（听力丧失、耳鸣、眩晕、平衡障碍、面肌无力）；皮肤咖啡斑或神经纤维瘤较I型少。诊断（符合1项）：①双侧前庭神经鞘瘤；②一级亲属为Ⅱ型+30岁前一侧前庭神经鞘瘤；③一级亲属为Ⅱ型+脑脊膜瘤、神经鞘瘤、室管膜瘤中2项。\n治疗：均以手术为主（肿瘤压迫神经有症状时切除）；FDA已批准司美替尼治疗I型；合并癫痫用抗癫痫药；NF1患儿每年评估脊柱。' },
{ m: '30F', q: '结节性硬化症（TSC）的临床表现、诊断标准与治疗？', a: '结节性硬化症（TSC）：常染色体显性遗传多系统疾病，新生儿发病率1/6000~1/10000；80%~85%由TSC1（9q34.3）或TSC2（16p13.33）突变引起；TSC2突变表型更重（肾脏肺部受累、智力障碍、癫痫及脑内面部病变更多），致病变异比例TSC2:TSC1约2:1。\n临床表现：癫痫突出（80%~90%，婴儿期发作易为婴儿痉挛，抗癫痫药难控制）；约60%智力低下；30%孤独症样表现或ADHD；皮肤改变——色素脱失斑（90%婴儿期可见，0.5~2cm或纸屑状，头皮发生处毛发变白）、面部血管纤维瘤（1~4岁出现、鼻唇沟附近最多、青春期明显）、指/趾甲纤维瘤（15%~20%）、鲨鱼皮样斑（20%~30%）；肾脏受累常见（血管肌脂瘤和肾囊肿，是症状和死亡主因）；心脏横纹肌瘤50%~60%（婴儿早期发现，可自行消退，胎儿超声提示预示75%~80%风险为TSC）；约50%视网膜错构瘤；肺淋巴管平滑肌瘤病（女性）。\n临床诊断（2012共识，表30-9）：确诊需2条主要指标或2主要+1次要；可能为1主要+1次要；疑似为1主要或2次要。主要指标：色素脱失斑≥3块（直径≥5mm）、面部血管纤维瘤≥3块或前额斑块、甲周纤维瘤≥2个、鲨鱼皮样斑、多发视网膜错构瘤、脑皮质发育不良、室管膜下结节、室管膜下巨细胞星形细胞瘤、心脏横纹肌瘤、淋巴管平滑肌瘤病、血管肌脂瘤≥2个。次要指标：纸屑样色素脱失斑、牙釉质小凹陷>3个、口腔纤维瘤≥2个、视网膜无色性斑块、多发肾囊肿、非肾性错构瘤。\n基因诊断：正常组织鉴定出TSC1/TSC2致病性突变可独立确诊；10%~25%常规基因检测阴性（嵌合或内含子剪接变异），基因阴性不排除诊断。\n治疗：mTOR抑制剂雷帕霉素、依维莫司（抗肿瘤并控制癫痫）；氨己烯酸（喜保宁）为婴儿痉挛及TSC继发局灶性癫痫首选，有效率95%以上（注意视野监测）；致痫结节外科切除或激光/热凝消融。' },
{ m: '30F', q: '脑面血管瘤病（Sturge-Weber综合征）、色素失调症与伊藤色素减少症要点？', a: '脑面血管瘤病（Sturge-Weber综合征）：GNAQ基因体细胞突变；以面部、脉络膜和软脑膜血管瘤为特征——面部葡萄酒色痣（常与三叉神经分布一致）、软脑膜血管瘤（最常见于枕叶、与皮肤血管痣同侧，其下皮质退行性变及钙质沉着）、青光眼；患病率约1/（20000~122000）。约75%患儿癫痫（1岁内首发，多为局限性运动发作，可继发全面发作）；约83%有认知问题；25%~40%青光眼。诊断：面部酒红斑+惊厥+智力障碍；颅骨X线轨道状双道钙化线（与脑回一致，但多在青春期后）；CT示患侧皮质钙化，MRI增强显示软脑膜血管瘤。治疗：对症治疗（左乙拉西坦或奥卡西平一线，顽固者手术切除病变脑组织；低剂量阿司匹林降低中风样发作频率；青光眼降眼压或手术）。\n色素失调症（IP，Bloch-Sulzberger综合征）：X连锁显性，IKBKG（旧称NEMO）缺陷；男性半合子多在胎儿期死亡，女性因X染色体选择性失活存活。诊断唯一主要标准：沿Blaschko线的4阶段皮肤改变——Ⅰ红斑水疱期（生后2周内，疱液嗜酸性粒细胞多、无细菌，易误诊脓疱病）、Ⅱ疣状增生期、Ⅲ色素沉着期（特征性，黄褐/灰黑、大理石花纹样）、Ⅳ萎缩期。次要标准：毛发/指甲/牙齿/眼/乳头乳房异常、中枢神经异常、多例男性胎儿流产史等。神经受累：认知行为问题70%、癫痫50%。治疗无特异，对症。\n伊藤色素减少症（无色素性色素失调症）：罕见，女性为男性2.5倍；沿Blaschko线分布的低色素沉着斑（轮状、斑块状或线状，肢体屈侧腹部多见，不累及手掌脚掌黏膜）；可累及神经（癫痫、智力障碍）、肌肉骨骼、眼；与染色体嵌合体相关。皮肤无需治疗，合并癫痫用抗癫痫药。' },
{ m: '30F', q: '脑积水的定义、脑脊液循环途径、分类、病因与临床表现？', a: '定义：脑脊液动力学改变引起的颅内压异常升高；基本特征是脑室、脑池及蛛网膜下腔内脑脊液总量增多，扩大正常脑脊液所占空间；颅缝融合前发生则头颅增大显著。多在生后6个月以内出现。\n脑脊液循环：侧脑室脉络丛分泌（大部分）→侧脑室→室间孔（Monro孔）→第三脑室→大脑导水管→第四脑室→2个侧孔（Luschka孔）及1个中孔（Magendie孔）→小脑幕下蛛网膜下腔→①中脑四周空隙→大脑蛛网膜下腔→蛛网膜颗粒（上矢状窦旁）吸收→静脉系统；②小脑延髓池→脊髓蛛网膜下腔→返回基底池。吸收：4/5经上矢状窦旁蛛网膜颗粒，1/5经脊髓静脉蛛网膜绒毛。\n产生机制三种：①脑脊液循环障碍（最常见）；②蛛网膜吸收障碍；③脑脊液产量过多（如脉络丛乳头状瘤）。\n分类：梗阻部位在第四脑室孔以上=非交通性（梗阻性）脑积水；第四脑室孔以下=交通性脑积水。\n病因：梗阻性——导水管狭窄、Chiari畸形、Dandy-Walker畸形、门罗孔闭锁、占位（肿瘤、囊肿）、炎症性脑室炎；交通性——先天性畸形（Chiari、Dandy-Walker、脑膨出、蛛网膜绒毛发育不全）、脑膜炎（病毒、细菌）、蛛网膜下腔出血、癌性脑膜炎。\n临床表现（婴幼儿）：最突出大头颅且增长迅速（面身相对较小）、骨缝分离、前囟扩大饱满、头皮静脉扩张、叩诊破壶音、颈肌不能支持头重；落日征（眼球下转伴上部巩膜外露）；眼肌麻痹斜视、眼球震颤；重者视盘水肿萎缩；烦躁不安、嗜睡、食欲差、营养不良、发育迟缓，偶呕吐惊厥；腱反射亢进或减弱，四肢痉挛状态；晚期皮质受压变薄智力减退。大龄儿童：头围变化不明显，急性者头痛、呕吐、眼球运动缺陷（第Ⅵ神经和凝视麻痹）、意识改变，重则昏迷脑疝。' },
{ m: '30F', q: '脑积水的诊断鉴别、非手术与手术治疗方法？', a: '诊断：典型表现诊断不难，多次复查头围增长过速可协助诊断；大龄儿童有颅内压增高表现应考虑；颅缝已闭合者无头颅增大。大头畸形鉴别：婴儿良性大头颅畸形或外部性脑积水（无与脑脊液动力学改变相关的颅内压升高）；未成熟儿（头围增大快但脑室不大）；佝偻病（方颅）；慢性硬脑膜下血肿（外伤史、硬脑膜下腔增宽、穿刺橘红/黄色液体）；颅内占位。影像：梗阻性脑积水脑室明显扩张变圆钝（室间孔梗阻→单/双侧侧脑室扩张而三四脑室正常；导水管狭窄→双侧侧脑室+第三脑室扩张而第四脑室正常；第四脑室中孔侧孔阻塞→所有脑室扩张）；交通性脑积水脑室球形扩张程度较轻、第四脑室扩张最小、基底池扩张、脑沟增宽；MRI梗阻时脑脊液经室管膜渗出形成脑室周围间质性水肿（质子加权像脑室周围高信号圈，有重要诊断价值）。注意脑萎缩所致脑室扩大、染色体疾病脑室扩大均无颅内压升高。\n非手术治疗：仅缓解症状——甘露醇、呋塞米等利尿渗透性药物，乙酰唑胺减少脑脊液分泌。\n手术治疗：①解除梗阻病因的手术（首选，如切除颅咽管瘤、小脑星形细胞瘤等占位，导水管狭窄导管扩张/置管，第四脑室正中孔粘连松解切开成形）；②脑室-腹腔分流术（最常用，穿刺侧脑室额角经皮下隧道至腹腔）；③脑室-上矢状窦分流术（创伤小符合生理但不适于12岁以下儿童）；④脑室-心房分流术（不常用）；⑤内镜下第三脑室造瘘术（ETV，微创、符合生理性脑脊液循环，适用于脑脊液循环通路梗阻而无吸收障碍的非交通性脑积水，尤其导水管梗阻；失败原因：瘘口闭合、梗阻合并吸收障碍）。\n预后：病因可根治者可能完全治愈且智力不受影响；约1/3患儿病情可自然静止；梗阻原因难解除或合并其他先天畸形者预后差。' },
{ m: '30F', q: '脑皮质发育畸形（MCD）概述、FCD的ILAE分型及治疗？', a: 'MCD：神经干细胞增殖、神经元迁移及脑皮质构建过程异常所致皮质结构异常的总称，是癫痫和发育迟缓的常见病因；症状出现年龄和癫痫严重程度取决于病变发生时的大脑发育时期而非病变类型——MCD越严重症状越早、癫痫综合征越重（West综合征、Lennox-Gastaut综合征均相关）。常见类型：局灶性皮质发育不良（FCD）、半侧巨脑回畸形、无脑回畸形、灰质异位、多小脑回畸形、脑裂畸形、前脑无裂畸形等。诊断主要靠头颅MRI，7.0T MRI及PET提高阳性率，立体定向脑电图（SEEG）识别MRI阴性的致痫灶。治疗：手术切除 vs 药物（抗癫痫药）取决于病变范围严重程度和部位（避开语言区、初级运动区、视觉区）；mTOR抑制剂（依维莫司、西罗莫司）用于TSC结节；难治性癫痫早期手术改善预后；FCDⅡ型较I型预后好，切除越彻底预后越好。\nFCD的ILAE 2011分型（孤立型I、Ⅱ型，结合型Ⅲ型）：\nFCD Ia——皮质存在成熟神经元但放射状层状结构不良；\nFCD Ib——6层构筑存在但切线方向结构不良；\nFCD Ic——Ia+Ib并存；\nFCDⅡa——存在异形神经元；\nFCDⅡb——异形神经元及气球样细胞；\nFCDⅢa——颞叶皮质层状异常合并海马硬化；\nⅢb——毗邻胶质瘤或神经节细胞瘤；Ⅲc——毗邻血管畸形；Ⅲd——合并出生后早期获得性损害（创伤、缺血、梗死、脑炎）。\nMRI表现：局灶性皮质增厚、灰白质边界不清、皮质/皮质下高T2 FLAIR信号、脑回增宽。相关基因：FCDⅡa/Ⅱb与mTOR通路基因（MTOR、TSC1/2、AKT3、DEPDC5）高度相关。' },
{ m: '30F', q: '灰质异位症、无脑回畸形与多小脑回畸形的要点？', a: '灰质异位症（GMH）：胚胎期神经迁移障碍致神经元未迁移到正常部位而在白质中异常积聚。病因：射线、中毒、缺氧、感染影响移行，或室周基质神经母细胞凋亡失败；遗传——FLNA/ARFGEF2变异致结节型，DCX/LIS1致带型。MRI分3型：Ⅰ型室管膜下（结节）型（灰质结节紧贴脑室壁或突入脑室）；Ⅱ型皮质下型（异位灰质与皮质相连向白质延伸）；Ⅲ型带型（双皮质综合征，带状灰质位于侧脑室与皮质之间、隔以薄层白质）。临床：癫痫（约80%，迟发难治性）和智力障碍。MRI：脑室周围或白质内灰质信号（T1略低T2略高），无水肿无强化。治疗关键控制癫痫，单侧单发结节型手术切除效果好。\n无脑回畸形（lissencephaly）：神经元移行障碍，预后差。致病基因LIS1、DCX（最常见）、ARX等。表现：严重智力障碍、肌张力低下、运动发育迟缓、癫痫（出生时正常，新生儿期喂食困难、角弓反张，多数1岁内确诊）。MRI特征：大脑皮质表面光滑、脑沟缺如、仅存数个宽平粗大脑回，灰质增厚白质变薄、灰白质界面平滑，常伴透明隔间腔、脑室扩大、蛛网膜下腔增宽。治疗差，需多药联合抗癫痫。\n多小脑回畸形（PMG）：MCD中最常见；皮质多个过度折叠小脑回。病因：先天性感染（巨细胞病毒、梅毒、水痘-带状疱疹）、缺血缺氧、代谢病；基因（Tubulin家族、GPR56、PAX6、WDR62等）。表现：约78%伴癫痫，70%发育迟缓，50%痉挛型脑瘫。MRI三点：皮质表面不规则、皮质轻度增厚或过度折叠、灰白质交界区圆齿状不规则（特征性，其他皮质畸形极少见）。无特异治疗，对症+遗传咨询。' },
{ m: '30F', q: '隐性脊柱裂（SBO）与脊髓栓系综合征（TCS）的分类、表现、诊断与治疗？', a: '隐性脊柱裂（SBO）：闭合性脊柱发育不良——脊柱背侧皮肤完整，一个或数个椎骨椎板闭合不全，椎管内脊髓神经组织不直接突出皮肤表面。人群发病率约17%，男女约2:1，儿童高于成人，绝大多数位于腰部；8岁以下儿童SBO可能暂时存在，青春期或成年后消失。\nTortori-Donati放射学分类：仅有椎弓板闭锁不全、脂肪脊髓脊膜膨出、终丝末端增厚、背部皮下窦道、椎管内脂肪瘤、终丝牵拉征、脊髓皮样囊肿、神经管原肠囊肿、脊髓纵裂等。\n临床表现：大部分无临床症状。局部特征——脊柱畸形和闭合不全（脊柱侧弯、椎骨滑脱、半椎体、椎弓板缺失、骶骨发育不全）、背部皮肤异常（多毛症、血管瘤、脂肪瘤、痣、色素沉着、臀裂畸形）；下肢感觉运动障碍（肌肉萎缩、不对称性反射减退）；部分肛门直肠畸形和Currarino综合征。合并脊髓栓系综合征（TCS）者：下肢弛缓性瘫痪、肛门括约肌障碍、下尿路功能障碍（尿失禁、遗尿、尿频、尿潴留、排便失禁），症状较显性脊柱裂轻且出现晚（可到青少年甚至成年）。\n诊断：尿失禁和反复尿路感染是最常见就诊原因；腰骶部皮肤异常体征提示进一步检查。影像学：腰骶部X线（筛选常规方法）；MRI（确定脊髓裂畸形及相关病变程度，CT脊髓造影/3D螺旋CT为补充）；B超（妊娠中晚期可诊断胎儿）；尿动力学检查（确定神经源性膀胱及严重程度，制定治疗方案、决定是否手术、长期随访依据）。\n治疗预防：大多数无需治疗；有神经损害者早发现早治疗。手术主要方式脊髓松解术，适应证：神经功能恶化、脊柱侧弯、先天性闭合不全（脊髓脊膜膨出）、脑膜炎、脑脊液漏、神经症状恶化后应立即手术；SBO合并TCS早期手术70%排尿症状改善；无症状但MRI示脊髓栓系者可行预防性手术或保守观察；有神经症状但无栓系者终丝溶解术效果良好；后期脊柱侧弯进展需脊柱融合。神经源性膀胱积极管理（治尿路感染、清洁导尿、抗胆碱药）。预防：孕前至妊娠3个月每天服400μg叶酸可减少神经管畸形发生。\n预后：SBO本身不妨碍健康；有脑脊膜膨出者囊肿壁薄易破继发脑膜炎；囊内无神经组织者切除可治愈；有神经系统症状者预后不良，切除囊肿后症状难改善且往往加重。' },
{ m: '30G', q: '儿童急性偏瘫综合征的病因分类与诊断关注要点？', a: '概述：由不同临床症状组成的一组疾病；偏瘫是脑组织缺血、供血不足或灌注不良所致缺血坏死的重要表现；动脉缺血性脑卒中（AIS）是最需考虑的诊断；类似卒中的表现还有颅内出血、脑瘤等，神经影像学是重要鉴别手段。病因（10类）：\n①脑动脉阻塞性疾病——各种动脉炎（结核、梅毒、钩端螺旋体等）和动脉血栓形成；少数小儿动脉血栓继发于动脉壁局限性病变（类脂斑溃烂、内膜不规则增生、动脉中层内弹力层外膜钙化、夹层动脉瘤）；\n②感染性疾病——局部咽耳鼻鼻旁窦感染及颈淋巴结炎、咽后壁脓肿、腮腺炎、各种病毒性脑炎、预防接种后脑炎、支原体肺炎感染过程中突发偏瘫（感染、毒素或感染后免疫反应损害颈动脉内膜/外膜致脑血栓、动脉炎）；\n③先天性发绀型心脏病——红细胞>800万/mm³血黏度增高或血氧饱和度不足并发脑血栓或脑脓肿；风心病、房颤、心律不齐、心内膜炎可脑栓塞；心脏黏液瘤；\n④外伤——脑挫裂伤、颅内血肿；头颈外伤、颈椎骨折脱位、头过度后仰旋转使颈外/颈动脉或椎动脉闭塞；口腔内异物（筷子勺子）损伤扁桃体隐窝致颈内动脉血栓（受伤至偏瘫约3~24小时，血栓形成所需时间）；\n⑤全身性疾病——SLE、风湿病、结节性动脉周围炎、原发性肉芽肿性动脉炎、糖尿病、血液病（镰状细胞贫血、红细胞增多症、血栓性血小板减少性紫癜）、严重脱水消耗性腹泻；\n⑥癫痫持续状态——Todd麻痹（全身强直阵挛发作后偏瘫，持续数小时至数天）；\n⑦动静脉畸形——畸形血管破裂或皮质内血肿致偏瘫；\n⑧脑内占位病变；\n⑨遗传代谢病——高胱氨酸尿症、高氨血症、乳酸酸中毒、有机酸血症等致脑血栓；MELAS最典型（生长落后病史）；\n⑩特发性（原因不明，随诊断技术进步日益减少）。\n诊断关注要点：①起病时间——急性（数小时内，最常见）/亚急性/短暂发作/反复发作；慢性进行性偏瘫早期肢体无力被忽视，偏瘫婴儿常在建立优势手或走路后才被发现（静止性脑结构异常，脑瘫型偏瘫）。②偏瘫定位——急性起病常上肢及面部受累明显、肢体远端重于近端；上肢伸肌群及下肢屈肌群瘫痪明显（上肢屈曲、下肢伸直、手指屈曲）；浅感觉常不受损，较大患儿实体觉位置觉两点分辨觉异常；同侧偏盲、聚合性内斜视弱视，中枢性面瘫最多见；周围性面瘫+偏瘫交叉出现高度提示脑干病变；昏迷患儿凝视偏向一侧提示大脑半球病变（可为偏瘫唯一征兆）。' },
{ m: '30G', q: '动脉缺血性脑卒中（AIS）的发病机制、临床表现、检查、治疗与预后？', a: 'AIS是儿童最常见的获得性脑损伤病因，是脑动脉某一分支梗死造成的局部脑梗死；好发于大脑中动脉及大脑前动脉，后动脉较少；临床表现不典型、无特异性，常被误诊漏诊。\n发病机制3个（多数患儿多种机制并存）：①动脉疾病机制（首要原因，占50%以上）——局灶性/局限性血管炎（局灶性脑动脉疾病FCA、暂时性脑动脉疾病TCA、水痘后血管病）、广泛或双侧血管炎（原发性中枢神经系统血管炎、大动脉炎）、颅内血管异常（颈动脉夹层、烟雾病、脑血管肌纤维发育不良、可逆性脑血管收缩综合征Call-Fleming、PHACES综合征）；②心源性栓塞（约占儿童AIS的25%）——复杂先天性心脏病最常见，也见心律失常、心肌病、感染性心内膜炎；卵圆孔未闭可交叉性静脉血栓栓塞；所有疑AIS患儿都应做全面心脏血管检查、心电图、超声心动图；③血液病机制——缺铁性贫血、镰状细胞贫血（SCA患AIS风险较常人高400倍）、凝血功能障碍（先天性如FvL突变、后天性如抗磷脂抗体、血栓前状态、口服避孕药、门冬酰胺酶化疗）；其他危险因素：偏头痛、急慢性全身性疾病、违禁药物毒药等。\n临床表现：急性起病的局灶性神经功能障碍都应首先考虑脑卒中；最常见为轻偏瘫，可有视力、语言、感觉、平衡障碍；急性新生儿期脑卒中通常只表现为癫痫发作。\n检查：AIS既是临床诊断又是影像诊断——CT显示大面积陈旧性AIS并除外出血；MRI显示早期较小病灶，DWI可显示数分钟内脑卒中，MRA明确血管梗阻及病因。\n治疗：①儿童无溶栓治疗（安全性未知），一般用肝素抗凝+阿司匹林抗血小板，按病因溶栓属个别情况；②神经保护（控制血糖、体温、癫痫发作，维持脑灌注压即收缩压正常高值；最初72小时内可恶性脑水肿危及生命，可急诊手术减压）；③病因治疗（SCA输血、血管炎免疫抑制、烟雾病血管成形术）；长期目标防二次卒中（抗血小板，有心脏问题加抗凝）；急性新生儿AIS神经保护，仅心源性血栓需急性溶栓；④多模式家庭为中心康复。\n预后：儿童脑卒中死亡率6%~10%；神经系统功能障碍发生率60%~70%；癫痫发作发生率15%；预后与受损面积、部位、病因有关，伴结构损伤者复发可能性大需定期影像随访。' },
{ m: '30G', q: '儿童急性偏瘫的辅助检查与偏瘫定位鉴别（皮质/内囊/脑干）？', a: '辅助检查（根据初步临床诊断选择）：\n①血液学——全血计数、血气、血沉、凝血酶原时间、纤维蛋白原、电解质、血尿氨基酸乳酸尿糖有机酸血脂、尿素氮肝功能；疑自身免疫病查狼疮抗体、抗磷脂抗体；\n②影像学——显示血管病变部位范围性质，明确区分梗死和出血；\n③脑脊液——必须在完成影像学检查后按需进行；小儿急性偏瘫一般不做腰穿（脑脊液无特异改变），除非确认脑膜炎或蛛网膜下腔出血；\n④神经电生理——脑电图和肌电图按需。\n脑动脉血栓形成（脑血栓形成是小儿偏瘫最常见的病因）：常在安静状态发病（血流慢时）；多累及颈内动脉、颈总动脉、椎-基底动脉；症状取决于受累血管——颈内动脉：对侧偏瘫（上下肢瘫痪程度相仿）、同侧视力减退/Horner征、对侧感觉减退、主半球受累失语；椎-基底动脉：意识障碍、延髓麻痹、球麻痹、共济失调、四肢瘫、中枢性高热，可突然昏迷死亡；进展性——头痛惊厥在先，数小时或数日内进行性偏瘫，急性期脑水肿、颅高压表现重。\n影像：脑梗死24小时内CT可无异常，24~48小时后可见梗死灶；MRI DWI梗死早期即呈高信号；MRA/CTA/DSA显示血管病变；亚急性期梗死灶可点状强化，慢性期软化灶、脑萎缩。' },
{ m: '30G', q: '颅内静脉窦及脑静脉血栓（CVT）的病因、临床表现（各静脉窦特点）、检查与治疗？', a: 'CVT：多种原因所致脑静脉回流受阻的一组血管性疾病；颅内静脉窦（硬脑膜窦）包括上矢状窦、下矢状窦、岩上窦、岩下窦、海绵窦、直窦、侧窦（乙状窦和横窦）、窦汇；脑静脉分深静脉组（大脑中深静脉、基底静脉、大脑内静脉、大脑大静脉）和浅静脉组。儿童发病比成人常见，新生儿发病风险最高。\n病因5类：①高凝状态——先天（凝血酶基因20210A突变）、后天（抗磷脂抗体）、药物（天冬酰胺酶、口服避孕药）、缺铁性贫血、严重脱水；相关全身病：白血病、炎性肠病、肾病综合征；②头颈部感染——脑膜炎、中耳炎、乳突炎致感染性血栓性静脉炎；③外伤（尤其颅骨骨折）；④医源性（颅脑静脉通路附近手术操作）；⑤其他——新生儿颅缝未闭合，产道挤压或生后仰卧位经枕骨挤压深部矢状窦。\n临床表现：多样不典型；新生儿多为弥漫神经系统症状及癫痫发作；儿童常表现为进行性头痛、视盘水肿、复视、视力障碍、眼胀结膜充血、耳鸣、脑鸣、颈部不适、急性局灶神经功能障碍、癫痫发作、昏睡意识模糊；头痛最常见（约80%患者有，小婴儿打头撞头）。\n各静脉窦特点：①海绵窦血栓（儿科相对多见）——常由外伤、AVM阻塞、眼眶周围/鼻/面部化脓性感染引起；急性起病发热头痛呕吐意识障碍，眼眶静脉回流障碍致眼周红肿、球结膜水肿、突眼、眼睑不能闭合、视盘水肿，可并发脑膜炎脑脓肿，脑脊液白细胞增高；②上矢状窦血栓——多发生于婴幼儿严重脱水，急性或亚急性起病，最主要为颅内压增高症状（头痛恶心呕吐视盘水肿），可仅表现为不明原因颅内高压（视盘水肿为唯一体征），旁中央小叶受累可小便失禁及双下肢瘫，下肢更易受累；婴儿可喷射性呕吐、前后囟及额面颈枕静脉怒张迂曲；CT细绳征及三角征（血栓密度增高），MRV静脉窦充盈缺损；③侧窦血栓（横窦+乙状窦）——化脓性乳突炎/中耳炎常引起乙状窦血栓；头痛呕吐视盘水肿；扩展至岩上/下窦→同侧三叉神经及外展神经损害（患侧乳突部红肿压痛、静脉怒张，伴发热寒战白细胞增高）；延伸至颈静脉→颈静脉孔综合征（吞咽困难、饮水呛咳、声音嘶哑、心动过缓、耸肩转头无力）；④大脑大静脉血栓——多为非感染性，累及间脑基底节内囊等深部结构、常双侧；颅内高压症状+嗜睡精神症状反应迟钝、记忆力计算力定向力减退、手足徐动或舞蹈样锥体外系表现；可昏迷高热痫性发作去大脑强直甚至死亡。\n检查：非增强CT灵敏度低；CTV发现脑静脉系统灌流不足意义重大；头颅MRI及MRV对比；MRV公认是目前最好的无创性脑静脉成像诊断方法（对较大脑静脉和静脉窦显示好）；脑脊液主要压力增高，早期常规生化正常，中后期蛋白轻中度增高，发现红细胞提示出血（但高颅压者腰穿可诱发脑疝）。\n治疗：①抗凝——低分子肝素；静脉栓塞后出血倾向不是抗凝绝对禁忌证；通常3个月后复查影像，血管再通则停药，仍有栓塞延长至6个月；新生儿抗凝有争议但证据表明安全（约30%未治疗新生儿确诊后第1周内血栓进展），指南支持早期抗凝但新生儿疗程缩短为6周至3个月；有持续危险因素者需长期抗凝防复发；②对症支持（抗感染、保证水分、神经保护——正常体温血压、控制癫痫）；③并发症治疗——继发高颅压的视神经疾病需眼科规律检眼镜检查+降颅压；多数患儿有一定神经系统功能异常，双侧栓塞者更重，建议全面神经康复训练。' },
{ m: '30G', q: '烟雾病的定义、临床表现分型、诊断标准与治疗？', a: '定义：慢性闭塞性脑血管病，特征是双侧颈内动脉末端、大脑前动脉和中动脉起始端进行性狭窄或闭塞，伴侧支循环建立形成烟雾样血管；1957年日本首次发现，因颅底异常血管网脑血管造影形似烟雾得名；主要影响儿童，东亚发病率高于欧美；病因不明，属多因素多基因疾病（RNF213关系密切，与HLA-B51相关，免疫介导炎症反应可能起重要作用）。\n临床表现：常见缺血性卒中、TIA、脑出血、癫痫发作、智力发育障碍；绝大多数患儿起病以脑缺血为主（脑出血多见成人型）；分出血型、梗死型、TIA型、频发TIA型、头痛型、癫痫型。\n分型要点：①TIA型约占特发性烟雾病70%——反复一过性瘫痪或力弱（多为偏瘫，可左右交替或双侧），发作后运动功能完全恢复，病程多良性、可自发缓解；②梗死型（栓塞/血栓性闭塞致局部梗死，主要累及前循环）——最常见缺血症状是偏瘫，其次言语障碍和半球感觉异常，表现形式与年龄明显相关；③出血型（约30%患者）——蛛网膜下腔出血，多因动脉瘤或脉络膜前动脉破裂、烟雾状血管破裂，出血位置多位于脑室、丘脑和基底节周围；④癫痫型——频繁癫痫发作、部分性发作或癫痫持续状态伴脑电图癫痫样放电；⑤头痛型。\n辅助检查：实验室为鉴别诊断（血常规、CRP、血沉、抗O、结核菌素、钩体凝溶试验）；脑电图无特异性（病灶侧或两侧慢波增多）；脑血管造影是确诊主要手段和金标准；MRI显示陈旧/新脑梗死、出血高信号、局限性脑萎缩（额叶底部及额叶最明显）、颅底异常血管；CT见多灶脑梗死、继发脑萎缩、脑室扩大、脑出血；PET/SPECT评估脑灌注和脑代谢、确定外科指征、监测疗效。\n诊断标准（金标准脑血管造影）：典型表现①双侧颈内动脉末端狭窄或闭塞；②基底部位纤细异常血管网呈烟雾状；③广泛血管吻合（大脑后动脉与胼周动脉吻合）；④可合并ACA和MCA近端狭窄或闭塞，约25%患者椎基底动脉系统亦受累；确诊需排除合并疾病（动脉粥样硬化、自身免疫病、脑膜炎、神经纤维瘤病、颅内肿瘤、Down综合征、头外伤、放疗、甲亢、镰状细胞贫血等）。MRI/MRA标准：ICA末端和/或ACA、MCA起始段狭窄闭塞+基底节区异常血管网（1个扫描层面基底节区2个以上明显流空血管影提示）+双侧性。患者具备A（DSA）或B+C可确诊；儿童单侧脑血管病变+C也可确诊。\n治疗与预后：内科无确切有效药物（慢性期/烟雾综合征可针对危险因素用药：抗血小板、抗凝、血管扩张剂；长期服用阿司匹林可致缺血型向出血型转化且出血后不易止血，需警惕）；外科颅内外血管重建手术是主要治疗方法（直接、间接及联合血管重建），有效降低梗死风险和TIA发生率、改善脑血流动力学；一旦确诊应尽早手术但避开脑梗死或颅内出血急性期；预后与发病年龄、血管病变发展速度范围、神经症状有关，发病越早预后越差，应早发现早治疗，在不可逆神经功能损伤前手术恢复灌注预防二次卒中。' },
{ m: '30G', q: '小儿脑血管畸形的分类、AVM与海绵状血管瘤的临床特点？', a: '脑血管畸形：大脑芽胚血管组织发育分化过程中形态变异，致脑局部血管数量和结构异常并影响正常脑血流；45%~80%位于大脑半球，8%~18%位于基底节或脑室，10%~32%位于小脑；约40%患儿以脑出血为首发症状；情绪激动、精神紧张、过度疲劳、外力打击等易诱发畸形血管破裂出血。\n分型：①增生性血管肿瘤（即血管瘤）；②非增生性血管畸形——毛细血管型、静脉型、海绵型、动脉型、动静脉分流型、混合型；③综合征型。\n动静脉畸形（AVM）：最多见，约占颅内血管畸形90%；多见于额叶与顶叶，也见基底节、丘脑、脑干；一团动脉静脉杂乱血管无毛细血管床；脑血流短路（盗血）是重要机制；未破裂前可无症状，也可发育延缓、癫痫、头痛、偏瘫、视力障碍；体积大者颅高压、脑积水、颅内血管杂音；每年2%~4%概率发生脑出血；症状以出血、癫痫、头痛、进行性神经功能障碍及智力减退最多见；约18%~40%发生癫痫发作（全身性最常见，药物治疗反应好）；头痛约5%~14%；局灶神经功能缺损1%~40%（仅5%~15%与出血无关，病理生理为血管盗血和/或静脉高压）；诊断金标准脑血管造影（早期引流静脉可视化证实动静脉分流存在）；治疗——一般部位可手术切除或微导管血管内栓塞，重要功能区/深部巨大病灶DSA下动脉内栓塞减少供血，利于进一步切除或放射治疗。\n海绵状血管瘤：密集薄壁血管，大小约0.3~4.0cm；发生率仅次于AVM；儿童期常无症状偶然发现，年长儿或成人才出现症状；常见家族性显性遗传病例，也见于视网膜、肝、肾、皮肤；癫痫发作是最常见症状（幕上脑实质内病灶、额叶或伴钙化者癫痫发生率可达50%以上）；亚临床微出血几乎所有患者均可出现，但有临床症状出血相对较少（多在病灶周围脑实质内，少数破入蛛网膜下腔或脑室）；局灶神经症状与颅内部位有关。\n静脉血管瘤（脑静脉性血管畸形）：较常见，好发大脑半球，多见于年长儿；由静脉成分组成，约15%有钙化；现认为属良性病变，引流静脉同时是正常脑组织引流静脉，切除后致静脉引流突然中断出现脑充血脑水肿（后颅窝中线部风险更大），故多数主张保守治疗（尤其无症状、无出血、症状轻或功能区者），反复出血或较大血肿者才考虑手术。\n先天性脑动脉瘤：动脉管壁异常膨胀形成球形血液囊，壁薄易破裂；可发生于任何年龄，80%左右在颈内动脉系统；人群发生率1.5%~8.0%，病死率高达36%；儿童形成重要因素为血管壁缺陷、胎生血管发育异常和血管畸形；约71%患者最终破裂出血，15%可再出血；先兆症状——局限性头痛、眼痛、视力减退、恶心、颈部僵痛、眩晕或感觉障碍；根本疗法是手术治疗，应尽早手术避免破裂，预后与蛛网膜下腔出血有关，出血次数越多病死率越高。\n颈内动脉海绵窦瘘：海绵窦段颈内动脉或其分支裂口与海绵窦短路沟通；多因外伤引起（占75%~85%）；海绵窦淤血静脉压增高致同侧眼球突出、海绵窦与眶上裂综合征；常以外伤或眼征首发，有颅内杂音、搏动性突眼、球结膜充血水肿、视力减退及神经功能缺失（易漏诊误诊；大儿童可因夜间颅内杂音响亮难入睡）；脑血管造影可确诊；MRI良好显示眼静脉扩张、海绵窦扩大及血栓形成；首选数字减影下经血管内送入可脱性球囊闭塞瘘口并保持颈内动脉通畅，亦可注入黏合胶或固体栓塞材料。\nGalen大静脉畸形：脑大动脉和Galen静脉之间血管交通，见于新生儿和婴儿；大量血液分流——新生儿进行性高搏出量心力衰竭、生长发育受阻（易误认为先心病）、颅内血管杂音明显，婴儿期脑积水；病死率很高约50%；分流量不大者心衰较轻、可反复一过性偏瘫；血管壁较厚少见破裂出血；治疗困难可分期手术。' },
{ m: '30H', q: '特发性扭转性肌张力不全（早发性）与多巴反应性肌张力障碍（DRD）的要点？', a: '特发性扭转性肌张力不全：曾称变形性肌张力不全；主动肌和拮抗肌共同收缩导致异常姿势和体位，不自主、持续，一般不伴其他神经系统异常；90%在儿童或青春期起病（早发性扭转性肌张力不全），占早期发病肌张力障碍16%~53%；常染色体显性遗传为主，主要致病基因TOR1A（9q34.11），最常见突变为3个碱基对缺失c.907_909delGAG。表现：起病4~64岁（平均12岁），多由一侧肢体（下肢多见）开始，主动肌拮抗肌同时持续收缩使受累部位固定于特殊体位，逐渐波及对侧，面颈少见；最初5年内进展迅速常发展为全身性，部分最初5年内自行缓解甚至消失但可复发；认知功能正常，无惊厥、无感觉腱反射异常、无锥体束征及异常眼动。诊断：肌张力不全姿势/运动障碍±震颤+围产期及既往发育正常+无智力障碍/小脑感觉异常/锥体束征+可有家族史+实验室影像正常，排除其他原因；TOR1A基因检测确诊。鉴别：获得性非进行性肌张力不全（窒息缺氧脑瘫、脑炎、外伤、中毒、脑血管病）、药物诱发（卡马西平、苯妥英钠、酚噻嗪类、丁酰苯类含氟哌啶醇、氯喹、锂剂等）、先天性代谢异常（肝豆状核变性、脑脂质沉积症、有机酸血症、PKU）、线粒体病、多巴胺反应性肌张力不全（起病年龄小、下肢持续异常、晨轻暮重、腱反射亢进、对多巴胺显著效果）。治疗：综合疗法多学科协作，长期服药——抗胆碱能药、多巴胺能药物、巴氯芬、苯二氮草类；肉毒杆菌毒素局部注射是多数局灶性肌张力障碍首选（眼睑痉挛、局灶性上肢、咽喉内收肌，隔几个月重复，可产生抵抗）；鞘内巴氯芬；药物失败选深部脑刺激（DBS）、选择性周围神经切断或射频损毁。预后多留有轻中度功能障碍，无完全康复报道。\n多巴反应性肌张力障碍（DRD）：基因突变致多巴胺合成代谢异常、不伴神经元丢失，患病率0.5~1/100万，女性为男性2~4倍。经典型：10岁内起病女性多，首发非对称性下肢姿势异常（尖足行走、马蹄内翻足扭转痉挛、跨步大易跌倒），明显昼夜波动（清晨或休息后缓解，午后或运动后加重），症状进行性加重逐渐不对称累及头颈躯干，40岁后多不再进展，智力基本正常；非经典型（DRD-plus）起病更早更重（严重肌张力低下、咀嚼吞咽困难、精神运动发育迟缓、动眼危象、震颤、自主神经功能障碍）。病因亚组：AD-DRD（GTP-CH-1缺乏症即Segawa病，最常见，GTH1基因杂合突变，无高苯丙氨酸血症，小剂量左旋多巴疗效显著）；AR-DRD（GTP-CH-1完全缺乏、酪氨酸羟化酶TH缺乏——A型婴儿期起病进展缓慢左旋多巴疗效好、B型新生儿期脑病病情重1/3对左旋多巴无反应；墨蝶呤还原酶SR缺乏——脑脊液生物蝶呤升高，需左旋多巴联合5-羟色胺）。诊断治疗时机决定预后，原因不明步态异常均应考虑本病；疑似后做遗传学检查、脑脊液神经递质浓度（高香草酸、新蝶呤、生物蝶呤、5-羟吲哚乙酸）、苯丙氨酸负荷试验或酶活性检测；与脑瘫鉴别（DRD进展性+昼夜波动，脑瘫静止性+影像结构异常），与遗传性痉挛性截瘫鉴别（后者锥体束受累、症状无波动性）。治疗：早诊断早治疗，左旋多巴+苄丝肼小剂量起始（全日0.5~1mg/kg分3次，数日数周加1mg/kg，1~5mg/kg效果显著，最大报道20mg/kg）；BH4缺乏者补5-羟色胺1~8mg/(kg·d)；左旋多巴和5-羟色胺致脑脊液叶酸降低应补叶酸15mg/d；疗效差可DBS。早期坚持治疗者大多预后良好。' },
{ m: '30H', q: '少年帕金森病、哈勒沃登-施帕茨病（PKAN）与亨廷顿病的要点？', a: '少年帕金森病（JP）：21岁前以帕金森症状（运动迟缓、肌强直、静止性震颤）为主要表现，罕见、与遗传密切相关、常有家族聚集，属早发型帕金森病子类（JP占早发型约7%，中位起病17~18岁）；0~29岁发病率约0.8人/10万。致病基因：PARKIN（PARK2，左旋多巴反应良好型中最常见）、PINK1、DJ1、ATP13A2、PLA2G6、FBXO7等。病理：选择性黑质致密层神经元严重变性丢失。临床6特点：①震颤肌强直运动迟缓早期不典型，常伴姿势性震颤、静止性震颤少见；②姿势保持障碍和上肢轮替运动障碍较重；③腱反射可活跃甚至亢进；④症状有波动（晨轻暮重、睡后减轻）；⑤病程长进展相对缓慢；⑥多数对左旋多巴反应较好但易早期出现严重运动障碍。需与DRBA药源性、外伤性、颅内感染、结构性病变等继发性帕金森综合征鉴别。治疗：对症治疗（帕金森症状——左旋多巴、多巴胺激动剂、单胺氧化酶B抑制剂；DBS丘脑底核或苍白球内侧部）。\n哈勒沃登-施帕茨病（PKAN）：罕见常染色体隐性神经退行性病，又称泛酸激酶相关神经退行性病；主致病基因PANK2（20p12.3~13）；机制——辅酶A代谢障碍→泛酸激酶缺乏→半胱氨酸复合物沉积于基底节、铁整合+氧自由基损害神经元；大体病理苍白球和黑质网状部呈典型锈褐色。经典型6岁前起病：渐进性加重的肌张力障碍、运动发育落后为主的发育迟缓、步态僵硬、智力障碍，常伴色素性视网膜变性；非典型型发病晚（>10岁）：突出言语缺陷、精神障碍、渐进性肌张力障碍及痉挛状态，视网膜病变少见。MRI特征：T2加权苍白球低信号中央高信号——虎眼征（10岁以前明显）。诊断：家族史+临床+影像+分子遗传学；鉴别神经元蜡样质脂褐质沉积症、少年亨廷顿病、神经棘红细胞症等。治疗：无特异——禁用加重肌张力不全的酚噻嗪类和丁酰苯类；左旋多巴、溴隐亭、铁螯合剂（去铁胺）无效；震颤试用苯甲托品，口面舌严重肌张力不全用肉毒毒素；癫痫用抗癫痫药；大剂量维生素B5（泛酸）及omega-3脂肪辅助；理疗语言治疗心理支持。\n亨廷顿病（HD）：常染色体显性遗传，缺陷基因HTT（≥36个CAG三核苷酸重复扩展）；5%~10%在20岁前起病为青少年HD（10岁前起病者30%有癫痫发作），突出表现为运动和小脑症状、语言缺陷、严重精神症状恶化。经典症状三领域：运动（早期运动增多伴不自主舞蹈，后期运动迟缓和肌张力障碍）、认知（运动症状前数年即可观察到认知缺陷）、精神行为（早期注意力不集中冲动易怒，晚期冷漠缺乏主动性——冷漠是最常见特征）；家族性患者发病年龄有提前趋势。无特异疗法：按运动障碍症状选抗胆碱药、苯二氮草类、左旋多巴或氟哌啶醇；癫痫发作者用抗癫痫药；丙戊酸或其他抗精神病药改善精神障碍；基因治疗、干细胞移植、高剂量肌酸等新疗法疗效安全性待评估。' },
{ m: '30H', q: '良性家族性舞蹈症、家族性基底节钙化（Fahr病）、婴儿良性阵发性斜颈与点头痉挛的要点？', a: '良性家族性舞蹈症（BHC）：罕见儿童发病性非进行性舞蹈症；与NKX2.1（TITF1）基因突变有关（但>70%病例未检出突变）；突变者伴甲状腺和肺缺陷（脑肺甲状腺综合征）。典型运动症状：肌张力低下、婴儿期运动里程碑延迟；舞蹈症发作多在儿童早期（中位2.5~3岁），累及全身，压力或刺激加重；多数稳定或在青春期和成年早期改善；无癫痫发作，可伴轻度智力障碍和行为障碍；脑电图影像基本正常。诊断靠病程、家族史、遗传学检查，鉴别早发性舞蹈症等。无特异疗法，儿童期左旋多巴可改善症状，苯海索和氯硝西泮部分有效。\n家族性基底节钙化（Fahr病）：病理为两侧对称性基底节脑血管壁钙化（也见小脑、大脑皮质）；最常见常染色体显性遗传，SLC20A2为主要致病基因（隐性遗传相关MYORG、JAM2）。主要体征症状为运动障碍（运动迟缓、肌肉僵硬、震颤、各种肌张力障碍、四肢运动不受控制、异常步态）和精神行为问题（注意力不集中、记忆力减退、性格改变、精神病、痴呆）；精神和行为问题常始于30~60岁。CT特征：对称性双侧脑钙化，主要见基底节，也见小脑齿状核、丘脑和脑白质（诊断必需）；继发性基底节钙化见于甲状旁腺功能低下/亢进、假性甲旁低、Cockayne综合征、结节性硬化等需鉴别。无特殊疗法，药物对症（运动障碍、癫痫、焦虑抑郁、精神病、尿失禁）。\n婴儿良性阵发性斜颈：病因不明常有家族性，部分有偏瘫性偏头痛家族史者可能存在CACNA1A基因突变。2~8个月起病，女性约70%，易早晨发病；无明显诱因和先兆的间歇性斜颈（头部斜向任一侧，伴或不伴轻度旋转），发作时无意识障碍，持续数分钟至数天后自行缓解（多1~3天，最长1~2周），每年发作约2~5次，可伴呕吐、面色苍白、易激惹、乏力或共济失调；脑脊液、脑电图、头颅CT、颈椎MRI均正常。自限性，4~5岁前发作自行消失；年长儿可能出现良性阵发性眩晕、偏头痛或晕动症等发作形式；已被国际头痛分类第3版列为可能与偏头痛相关的周期性综合征。鉴别胃食管反流、颈椎脱位、颅后窝肿瘤、小脑脑干病变、前庭功能紊乱、先天性斜颈。不需特殊治疗。\n点头痉挛（spasmus nutans）：常起病于4~18个月；以间歇性眼球震颤、点头和斜颈为特征三联征（并非均同时具备）；眼球震颤是核心症状（快速细颤动，一侧性或一侧为主，方向水平垂直旋转均可，遮盖眼睛或入睡时消失）；点头频率较低（2~3Hz），直立位加重；斜颈可为代偿性体位；神经系统查体、脑电图、眼底正常，头颅影像大多正常（既往认为与视路胶质瘤相关的观点已被否定）。病因不明，危险因素：拥挤居住环境、低社会经济地位、佝偻病、缺铁性贫血、营养不良、创伤、癫痫、药物滥用及儿童虐待。约2~3岁内逐渐自愈不需特殊治疗；部分亚临床眼震持续至5~12岁，或出现屈光不正、斜视、弱视（眼震幅度越大斜视弱视发生率越高），故并非完全良性。鉴别遗传性眼球震颤（家族倾向、生后数周内起病、两眼均震颤、摇头与眼震方向一致）。' },
{ m: '30H', q: '良性特发性震颤与急性小脑性共济失调的病因、表现、诊断治疗？', a: '良性特发性震颤（ET）：约一半由基因突变引起（常染色体显性，基因座ETM1/2/3及FUS、HTRA2等）；10~20岁起病（35岁以上成人有第二高峰）。缓慢进行性姿势性震颤——双上肢对称性姿势性震颤持续至少3年，伴或不伴头、声音、双下肢震颤；无其他神经系统症状；频率4~12Hz，小儿平均7Hz（高于成人且随时间减慢）。年轻患者治疗保守，仅限功能受损者；一线普萘洛尔和普里米酮，二线苯二氮草类、托吡酯和加巴喷丁。\n急性小脑性共济失调：一组导致小脑急性功能障碍的后天性疾病，与感染、感染后、副肿瘤综合征引起的小脑炎症或中毒有关；6岁以下儿童共济失调最常见原因（占30%~50%）。病因：最常见于急性发热性疾病后（也可无前驱史），病原体——柯萨奇、ECHO、肠道病毒、EB、甲肝、单纯疱疹Ⅰ型、HHV-6、麻疹、腮腺炎、微小病毒B19、莱姆病螺旋体、疟疾、支原体等；疫苗接种后也有报道但发病率远低于自然感染（如水痘相关发病率至少是疫苗接种后35倍）；中毒（酒精、苯妥英钠过量）较少见；多数学者认为与自身免疫反应相关。\n临床表现：多见于1~3岁幼儿；约80%病例在共济失调前2~3周有前驱感染史；症状迅速进展，数小时至1~2天内达高峰。小脑功能障碍：语言障碍（构音障碍）、眼球震颤、肢体共济失调、姿势和步态障碍；单纯性者精神状态无明显异常，若伴精神状态突然改变、谵妄幻觉嗜睡提示毒物摄入或严重中枢疾病（酒精中毒、药物中毒、卒中、ADEM）；无发热、脑膜炎、癫痫发作；眼底正常。辅助检查：脑脊液可正常或轻度淋巴细胞增多和蛋白升高（25%~50%）、IgG指数增加（50%）和/或寡克隆带（10%~17%）；脑电图多正常，急性期慢波增多；头颅MRI排除占位，水痘后病例可有小脑蚓部脱髓鞘病变；合并眼阵挛或肌阵挛者做腹部影像学寻找神经母细胞瘤。\n诊断与鉴别：典型者特点——急性发病+近2~3周前驱感染史+无提示其他诊断的体征症状；鉴别：有毒物质摄入、感染性脑膜炎脑炎迷路炎、感染后免疫性疾病（急性小脑炎、ADEM）、结构性（头部外伤、脑血管意外、后颅窝肿瘤、神经母细胞瘤伴或不伴眼阵挛-肌阵挛综合征）、代谢和神经退行性疾病、常染色体显性遗传共济失调、感染性多发性神经根炎。\n治疗：对症支持；症状持续或恶化或出现新症状（局灶神经功能缺损、眼阵挛/肌阵挛）应进一步评估；恢复不全者考虑感染性小脑炎则清除感染灶，排除活动性感染后仍无缓解则试验性免疫抑制——甲泼尼龙冲击3~5天，无效选血浆置换或IVIG二线。\n预后：通常2~3周内消退不伴后遗症，中位症状持续10~12天；10%可有长期后遗症（震颤、语言不清）；诊断时年龄较大、合并EB病毒感染者预后较差；恢复阶段20%儿童有行为或学习困难，大多数6个月内恢复；症状恶化或复发应重新考虑诊断。' },
{ m: '30H', q: '遗传性小脑共济失调的分类、Friedreich共济失调（FRDA）与共济失调毛细血管扩张症（AT）的要点？', a: '分类两大类：①酶缺陷引起的共济失调（常染色体隐性，多发生于儿童期，部分可治疗）；②进行性退行性共济失调——按遗传方式分常染色体隐性（Friedreich共济失调最常见；还有DNA修复机制缺陷的着色性干皮病、Cockayne综合征、共济失调毛细血管扩张症）、常染色体显性（脊髓小脑性共济失调SCA、发作性共济失调、X连锁共济失调）。\nFriedreich共济失调（FRDA）：最常见遗传性共济失调之一，发病率约12/10万。20岁以前发病（2~16岁最多，10岁前起病约占半数）。首发症状95%为共济失调、5%为脊柱侧弯；病程缓慢进展，发病后20年多数不能行走；上肢共济失调比下肢更常见程度更重；几乎所有患者指鼻试验不稳伴运动性/意向性震颤及轮替动作不能；75%腱反射消失（下肢腱反射消失是基本特征之一），伸性跖反射约90%；深感觉异常多见（足部关节位置觉振动觉消失约90%，手部27%）；半数以上骨骼关节畸形（79%脊柱侧弯、55%弓形足）；心肌病40%~70%（活动时呼吸困难心悸心绞痛，1/3~1/2心律失常或充血性心衰）；眼震约50%；糖尿病约10%（多20~30岁，胰岛素难控制，是死亡原因之一）。诊断：10岁左右发病+进行性共济失调伴构音障碍+腱反射消失应怀疑；DNA检查确诊，多数存在FXN基因GAA扩增（短扩增表型轻、长扩增更严重早发）。治疗：辅酶Q/维生素E疗法有效（大部分FRDA患者血清辅酶Q降低）；艾迪苯（辅酶Q10短链类似物）改善心脏和神经功能；抗氧化剂缓解氧化应激；抗痉挛药缓解疼痛性肌痉挛，脊柱侧凸可手术。\n共济失调毛细血管扩张症（AT）：发病率1/80000~100000；三大特点——进行性小脑性共济失调、眼结膜和皮肤毛细血管扩张、免疫缺陷。神经系统症状始于婴幼儿期：共济失调生后12~14个月出现（学步困难躯干不稳），6岁后十分明显，10~11岁常借助轮椅；其他：舞蹈样动作、手足徐动、肌阵挛、反射消失、眼球运动异常。毛细血管扩张起始于2~7岁（球结膜首先受累，渐波及鼻翼、耳朵、颈部、肢体屈侧；日光照射辐射摩擦后加重）。辅助检查：甲胎蛋白升高见于90%以上患者（约10ng/ml），CEA也升高；IgA和IgE降低或缺如（IgM、IgG1、IgG3正常或升高，IgG2、IgG4降低）；神经电生理感觉神经动作电位异常；影像见小脑萎缩。诊断标准——确定诊断：辐射诱导染色体断裂增加+进行性小脑共济失调+AT两个等位基因功能缺失突变；疑似（4条中3条）：眼/面部毛细血管扩张、血清IgA低于正常2SD、甲胎蛋白高于正常2SD、辐射诱导染色体断裂增加；可能（4条中1条）。治疗：严重反复感染和IgG低者IVIg；早期持续物理治疗减少挛缩和脊柱侧弯；监测儿童恶性肿瘤早期征象；避免电离辐射（CT扫描），AT患者对放疗化疗极敏感、常规剂量放化疗可能致命（易患溃疡性皮炎、严重食管炎、深部组织坏死）。左旋多巴衍生物和抗胆碱能药改善基底节功能障碍；金刚烷胺、氟西汀或丁螺环酮助平衡和言语；震颤用加巴喷丁、氯硝西泮。预后不良，2/3死于20岁以前（主因感染和恶性疾病，15%死于非霍奇金淋巴瘤和T细胞白血病）。' },
{ m: '30H', q: '脊髓小脑性共济失调（SCA）、X连锁共济失调及可治疗的酶缺陷性共济失调要点？', a: '常染色体显性遗传性共济失调：最常见是脊髓小脑共济失调（SCA），已鉴定40多种。常见CAG重复序列编码聚谷氨酰胺片段（类似Huntington病），致体细胞和生殖细胞遗传稳定性下降——连续几代发病年龄逐渐提早、后代表型逐渐加重（遗传早现）。代表：SCA1（锥体束征、周围神经病变）、SCA3（扫视缓慢、锥体外系体征）、SCA6（CACNA1A，起病晚、眼球震颤）、SCA7（视网膜黄斑变性）、DRPLA（舞蹈症、癫痫、肌阵挛、痴呆）。\nX连锁共济失调：临床表现高度异质的罕见病；伴共济失调的X连锁铁粒幼细胞性贫血（ABCB7基因，Xq13）——病情较轻、对吡哆醇无反应、以非进行性小脑性共济失调为特征；肾上腺脑白质营养不良（X连锁隐性）的非典型表现可为进行性共济失调和运动协调欠佳。\n可治疗的酶缺陷性共济失调（重点记忆）：①维生素E缺乏性共济失调——α-生育酚转移蛋白基因突变（8q13.1），缓慢进行性共济失调，早期补充维生素E和其他脂溶性维生素改善神经病变和视网膜病变；②无β-脂蛋白血症——微粒体甘油三酯转移蛋白基因突变，脂肪吸收不良（apoB表达下降），血清胆固醇极低密度脂蛋白甘油三酯极低、β脂蛋白缺失；进行性视网膜变性、周围神经病变和共济失调，早期补维生素E；③脑-腱黄瘤病——线粒体固醇27羟化酶基因（2q33）突变致胆汁酸合成受阻，血清胆固醇正常基础上迅速升高；表现共济失调、神经病变、白内障、跟腱黄瘤；鹅去氧胆酸治疗显著降低血清和脑脊液胆固醇、阻止疾病发展，确诊后尽早治疗；④Refsum病——PHYH基因突变致植烷酸不能降解；常染色体隐性共济失调+鱼鳞病+色素性视网膜炎+周围神经病变三联症应怀疑；严格限制饮食中植烷酸摄入显著改善周围神经病变和共济失调；⑤Wilson病——神经型表现构音障碍、张力障碍、震颤或帕金森病，最初可单侧肢体；铜螯合剂（青霉胺或三烯胺）治疗至病情稳定，有神经系统症状者对三烯类反应更佳。' },
{ m: '30H', q: '阵发性共济失调（EA1~EA8）的分型要点与治疗？', a: '原发性阵发性共济失调（EAs）：常染色体显性遗传，特征为短暂反复发作的躯干不协调和不稳，伴眩晕恶心呕吐头痛（偏头痛）、视力障碍、构音障碍等；已报道8型（EA1~EA8），大多数成年之前发病，EA1和EA2占多数；多与离子通道基因突变有关，诊断基于病史和临床特征。\nEA1：KCNA1基因杂合突变（编码电压门控钾通道Kv1.1α1亚基）。发作仅持续数秒至数分钟；小脑功能障碍（步态不稳、肢体共济失调、构音障碍、蹒跚步态、姿势性震颤），常伴肌纤维颤搐（肌肉波纹现象）；诱因：运动、应激、环境温度、惊跳、姿势改变、情绪、饥饿、酒精、咖啡因等；发作间期可伴小肌肉抽动（手部及眼周）；儿童期或青春期发病；唯一病理关联是小脑蚓部极轻微萎缩。卡马西平是首选治疗药物，部分病例乙酰唑胺和丙戊酸也可能有效。\nEA2：最常见最典型的EA综合征，CACNA1A基因突变（编码电压门控钙通道Cav2.1α1A亚基，减少浦肯野细胞钙依赖性神经递质释放）。发作持续数小时至数日，伴严重眩晕恶心呕吐头晕头痛；发作期或间期均有眼球震颤（向外及下视明显）；可发展为持续性小脑症状及小脑萎缩；发作可自发或由体力消耗、疲劳、情绪困扰诱发；发病年龄婴儿期到儿童早期可持续至成人。治疗：乙酰唑胺（每天使用可预防或减轻发作）和4-氨基吡啶（改善浦肯野细胞起搏活动、减少发作频率）。\n其他：EA3（1q42连锁，前庭型共济失调+眩晕+耳鸣，耳鸣最明显，乙酰唑胺有效）；EA4（周期性前庭小脑性共济失调，无明确基因，乙酰唑胺无效）；EA5（CACNB4基因，钙通道β4亚基，临床类似EA2但发病晚20~60岁，乙酰唑胺有效）；EA6（SLC1A3基因，编码兴奋性氨基酸转运蛋白EAAT1，致谷氨酸过度细胞外积累，表型异质性大，可有发热诱发阵发性共济失调、癫痫、偏头痛、交替性偏瘫）；EA7（19q13，阵发性共济失调无力构音障碍数小时至数天，运动或兴奋触发，20岁以前发病）；EA8（UBR4错义突变，共济失调全身无力言语不清，数分钟至数小时，对氯硝西泮有反应、乙酰唑胺无效）。此外FGF14基因致病突变相关阵发性共济失调（发作多由发热诱发，可持续数天，部分对乙酰唑胺有反应）被建议列为EA9。\n鉴别：苯妥英钠等抗癫痫药过量所致共济失调；代谢病（丙酮酸脱羧酶缺乏、Leigh病、枫糖尿症、尿素循环障碍、维生素E缺乏、Refsum病、Hartnup病）；免疫介导性复发型小脑共济失调、脊髓小脑变性、中枢脱髓鞘病、间歇性梗阻性脑积水、癫痫、体位性眩晕、椎基底动脉缺血、梅尼埃病等。' },
{ m: '30H', q: '遗传性痉挛性截瘫（HSP）的临床分型、诊断标准与治疗？', a: 'HSP（Strumpell-Lorrain病）：高度临床和遗传异质性的罕见神经系统变性疾病，主要表现缓慢进展的双下肢无力和痉挛性截瘫；总体发病率1~10/100000，发病年龄从新生儿到老年。遗传方式多样：常染色体显性、常染色体隐性（最常见）、X连锁隐性、线粒体遗传，偶有散发。共同病理特征：皮质脊髓束和薄束后索轴突的长度依赖性变性（皮质脊髓束以胸段最重，薄束以颈段最重）。\n临床分型：①单纯型——逐渐进展的双下肢痉挛、步态不稳、腱反射亢进，可合并膀胱括约肌功能障碍，上肢反射也可增强，脑神经很少受损；②复杂型——除上述外伴共济失调、严重肌萎缩、视神经萎缩、视网膜色素变性、精神发育迟滞、锥体外系症状、智力障碍、耳聋、鱼鳞病、周围神经病、癫痫等（国外最常见合并肌萎缩，国内是智力障碍）。代表亚型：SPG3A（最常见儿童期起病的常显HSP，ATLS基因，10岁前起病，可非进展性，散发者易误诊脑瘫，多单纯型）；SPG11（最常见常隐HSP，发病1~27岁，多复杂型——痉挛性截瘫伴认知障碍、胼胝体薄或脑白质异常、构音障碍、眼球震颤或手臂无力）。\n诊断（Harding标准）：①双下肢无力、肌张力过高等上运动神经元受累症状，逐渐步态异常，进行性发展为双下肢痉挛性截瘫，可伴尿频尿急、认知障碍、癫痫、视力下降、锥体外系症状；②神经系统检查主要为锥体束征，下肢较明显；③脑和脊髓CT/MRI多正常（部分脊髓和/或小脑萎缩、胼胝体萎缩）；④多有家族史（常显、常隐、X连锁隐性或线粒体母系遗传），偶有散发病例；⑤排除其他疾病（脑瘫、多发性硬化、肾上腺脑白质营养不良、运动神经元病等）。基因检测是金标准（二代测序、目标基因高通量测序、全外显子组测序；复杂型合并智力障碍可考虑Array CGH）。鉴别：运动神经元病、脊髓结构性损害、脑白质营养不良、脱髓鞘疾病、自身免疫性炎症性疾病、硬脊膜动静脉瘘、肌张力障碍、代谢性疾病、伴显著痉挛的遗传性共济失调。\n治疗：无有效方法，以缓解症状提高生活质量为主——巴氯芬、替扎尼定、加巴喷丁、普瑞巴林口服缓解肌张力；肌内注射肉毒杆菌毒素防挛缩畸形；鞘内巴氯芬注射和机器人步态训练改善单纯型平衡行走能力；选择性外周神经切断术等外科及软组织局部外科干预。' },
{ m: '30H', q: '阵发性运动障碍（PD）的分型（PKD/PNKD/PED）、病因与治疗？', a: '阵发性运动障碍（PD）：临床表型和病因异质性的运动障碍性疾病，发作表现为突发的异常运动或姿势（肌张力障碍、舞蹈-手足徐动症或投掷动作等），可独立或同时发生，反复发作。\n分型（基于发作诱因）：①PKD阵发性运动诱发性运动障碍；②PNKD阵发性非运动诱发性运动障碍；③PED阵发性过度运动诱发性运动障碍。\n病因：原发性（家族性及散发，40%~70%病例为家族性，常显或常隐）和继发性。PKD最常见突变基因PRRT2（27%~65%PKD患者存在，家族病例高于散发病例；PRRT2也是ICCA婴儿惊厥伴发作性舞蹈徐动症和BFIE良性家族性婴儿癫痫的致病基因，同一家族不同成员可表现为BFIS、ICCA、PKD单独或合并出现）；还可检出SCN8A、KCNMA1、SLC2A1、KCNA1、DEPDC5等。PNKD基因是PNKD家系主要致病基因。SLC2A1基因（编码GLUT1，介导葡萄糖通过血脑屏障的主要转运体）是家族性PED患者最常见致病基因——杂合突变致GLUT1缺乏综合征（智力障碍、获得性小头畸形、癫痫发作、阵发性运动障碍和复杂运动障碍）。继发性病因：中枢感染（巨细胞病毒、梅毒、AIDS、SSPE）、代谢紊乱（Wilson病、枫糖尿症、假性甲旁减伴基底节钙化、甲旁减、甲亢、低血糖高血糖低钙）、缺血缺氧性脑损伤、脊髓损伤、脑瘫或颅脑外伤、血管性（烟雾病、TIA、卒中）、结构性（Arnold-Chiari畸形伴脊髓空洞、皮质发育不良）；哌甲酯等药物可诱发PKD。\n临床表现：①PKD——由突然运动、加速、运动方向改变或惊吓引起，以肌张力障碍最常见（一个或多个肢体短暂肌张力障碍，持续数秒至数分钟），意识清楚，可有肢体感觉异常等先兆；儿童期及青少年期起病，青春期达高峰；②PNKD——间歇性肌张力障碍、舞蹈-手足徐动，由咖啡因、茶、困倦、酒精或压力诱发（不由运动诱发），发作较长（数分钟至数小时）、频率相对少，发作时意识清楚；婴儿期或幼儿期起病，男性多见，青春期高峰，成年后可能缓解；③PED——由持续运动引起（其他触发：振动、低温、神经电刺激），最常见肌张力障碍，舞蹈-手足徐动及投掷动作也可出现，下肢最常受累，持续约5~30分钟，通常无感觉先兆。\n诊断：详细病史、家族史和发作记录视频，视频脑电图监测排除癫痫；排查继发性病因（头部影像排除血管性结构性病因；血生化电解质血糖甲功排除内分泌代谢病；外显子组测序找遗传病因）。注意PKD患者可检测到脑电图异常。鉴别：癫痫、多巴反应性肌张力障碍、心因性疾病。\n治疗预后：①PKD对调节电压门控钠通道的抗癫痫药非常敏感——苯妥英钠、卡马西平、奥卡西平、拉莫三嗪（剂量通常低于治癫痫常用剂量），其他如苯巴比妥、左乙拉西坦、加巴喷丁、丙戊酸钠、托吡酯少数有效；②PNKD避免触发因素（咖啡因、酒精、压力）是治疗基石，除苯二氮草类（氯硝西泮和地西泮）外对常规抗癫痫药反应不佳，个别对氟哌啶醇、抗胆碱药、乙酰唑胺、左乙拉西坦、丙戊酸钠有反应；③PED对抗癫痫药、左旋多巴、乙酰唑胺反应不一、通常欠佳，避免长时间运动是基础，GLUT1缺乏综合征可用生酮饮食。继发性PD对潜在病因的识别和正确治疗有助于疾病控制；神经调控如DBS在成人对部分难治性舞蹈症、肌张力障碍可能有改善，儿童应用较少。' },
{ m: '30I', q: '脊髓性肌萎缩（SMA）的定义、发病机制、临床分型与诊断标准？', a: '定义：SMN1（运动神经元存活基因1）突变所致常染色体隐性遗传病；脊髓和脑干运动神经元变性，主要表现为近端肢体和躯干进行性、对称性肌无力和肌萎缩，智力认知正常，感觉无受累；重症常死于呼吸衰竭。活产婴儿发病率约1/6000~1/10000，中国人群携带者频率约1/42。\n发病机制：SMN1基因位于5q11.2~13，95%患者为SMN1基因第7或第7、8外显子纯合缺失突变，5%为复合杂合突变；SMN蛋白缺失导致肌动蛋白减少和运动神经元生长障碍。修饰基因SMN2与SMN1高度同源（5个碱基差异），约10%SMN2 pre-mRNA可被正确剪切表达全长功能蛋白，起剂量补偿作用；SMN2拷贝数与表型严重程度负相关（1型多2拷贝、2型多3拷贝、3型多3~4拷贝、4型多>4拷贝），但不能完全预测表型。\n分型（由重到轻）：0型（胎儿期发病，胎动减少，生后即四肢无力、喂养困难呼吸困难，6个月内死亡，最严重）；1型Werdnig-Hoffman病婴儿型（最常见，约占45%，生后6个月内发病、1/3新生儿期发病，始终不能独坐）；2型Dubowitz病中间型（占30%~40%，6~18个月起病，进展较慢，最大运动能力独坐但不能独站独走）；3型Kugelberg-Welander病青少年型（2~7岁或更晚起病，早期运动发育正常可独走，逐渐步态异常、下肢近端无力，缓慢进展，可存活至成人，脊柱侧弯关节过伸常见）；4型成人型（20~30岁后发病，肢体近端无力，症状轻微进展缓慢，预期寿命正常）。\nSMA1型特征：①对称性肌无力（先双下肢，进展迅速，近端最重，不能独坐，最终仅手足轻微活动）；②肌肉松弛张力极低（蛙腿体位——髋外展膝屈曲）；腱反射减低或消失；③肌肉萎缩（四肢颈躯干胸肌）；④肋间肌麻痹（代偿性腹式呼吸，重症吸气时胸骨上凹陷即胸式矛盾呼吸，胸廓钟形畸形；膈肌运动和括约肌始终正常）；⑤运动脑神经受损以舌下神经最常见（舌肌萎缩及震颤），哭声低弱、吸吮无力、咽反射减弱易误吸，但表情正常；多在2岁内死亡，肺炎是最常见死亡原因。\n实验室检查：血清CK正常或轻度升高；肌电图自发电活动（正相、束颤、纤颤电位）明显增多，轻收缩运动单位电位时限延长波幅增高（巨大动作电位），重收缩运动单位数量减少；运动神经传导速度正常或轻度减慢。\n诊断标准：①躯干四肢近端进行性对称性肌无力肌萎缩，腱反射减弱消失，无感觉缺失及智力障碍；②CK正常或轻度升高；③肌电图广泛神经源性受损；④运动NCV正常或轻度减慢；⑤SMN1基因第7或第7、8外显子纯合缺失（0拷贝），或一个SMN1缺失伴另一SMN1微小突变（1拷贝）；⑥肌活检符合前角细胞病变。临床典型高度怀疑者可直接基因检测；肌活检仅用于基因检查阴性者。鉴别：婴儿型与弛缓型脑瘫鉴别（脑瘫腱反射存在、常伴智力障碍；SMA腱反射消失、智力正常、肌电图神经源性受损）；还应与先天性肌病、肌营养不良、线粒体肌病、重症肌无力、先天性肌无力综合征、周围神经病鉴别。' },
{ m: '30I', q: 'SMA的治疗（诺西那生、基因替代）与遗传咨询要点？', a: '治疗：既往仅对症支持。主要方向——调节SMN2基因表达和SMN基因替代治疗提升SMN蛋白表达。\n①反义寡核苷酸药物诺西那生（nusinersen）：通过改变SMN2基因剪切增加全功能SMN蛋白，明显改善运动功能、提高生存率，安全性耐受性好；2016年12月国外首次获批，已获中国国家药监局批准，用于全年龄段SMA患者；需鞘内注射给药，每4个月1次，终身治疗，费用昂贵；\n②基因替代药物onasemnogene abeparvovec-xioi：2019年5月FDA批准，用于治疗2岁以下SMA患儿；尚未在我国获批上市，有效性安全性仍需研究。\n综合管理：多学科动态评估运动功能、呼吸功能、营养状况、脊柱侧弯和髋关节脱位；定期物理治疗、正确使用支具或矫形器、规律运动、功能训练、吞咽功能训练及呼吸功能训练；积极康复治疗是干预、延缓疾病进展的主要手段，贯穿治疗全过程；晚期患儿加强护理防肺部感染及压疮，严重呼吸功能不全时需有创通气。\n遗传咨询：常染色体隐性遗传，已确诊家庭每次怀孕约25%再发风险。产前诊断适用于所有存在生育SMA患儿风险的家庭——一般10~12孕周采集绒毛，18~22+6孕周采集羊水，明确胎儿为患者、携带者或健康人；ACMG建议对所有育龄人群实施SMN1携带者基因筛查，对高风险胎儿实施产前诊断或植入前诊断。注意：约4%携带者为2+0型（2个SMN1拷贝位于同一条染色体），再发风险和产前诊断策略与单拷贝携带者相同；约2%先证者可能一个等位基因为新发SMN1突变，此时仅一个亲本为单拷贝携带者，几乎不增加再发风险。' },
{ m: '30I', q: '吉兰-巴雷综合征（GBS）的病因机制、临床表现与分型？', a: '定义：免疫介导的急性炎性周围神经病，又称急性感染性多发性神经根神经炎，是继小儿麻痹消灭后导致儿童急性弛缓性麻痹的主要疾病；病变主要侵犯脑神经、脊神经，以运动神经受累为著，少数累及感觉和自主神经；以对称性、弛缓性四肢麻痹为主要表现，重症累及呼吸肌致呼吸衰竭；急性发病，有自限性，大多预后良好。\n病因机制：感染后自身免疫性疾病——病原体某些组分与周围神经髓鞘结构相似，感染后通过分子模拟引起交叉免疫反应；空肠弯曲菌是中国和亚洲地区最常见前驱感染因子（其表面脂寡糖与神经节苷脂GM1、GD1a结构类似，诱发抗GM1和抗GD1a抗体），其他：巨细胞病毒、EB病毒、流感病毒、肺炎支原体等。自身抗体与周围神经抗原结合，激活补体形成攻膜复合物（MAC），造成轴索损伤或髓鞘脱失。\n流行病学：年发病率0.16~4/10万；国内北方夏秋季节多发，农村远多于城市。\n病理：最主要改变为周围神经单核细胞浸润及节段性脱髓鞘；血管周围淋巴细胞及巨噬细胞浸润形成血管鞘；AIDP以巨噬细胞介导的脱髓鞘+淋巴细胞浸润为主；AMAN仅少数神经纤维轴索变性。\n临床表现：60%患者神经症状前1~6周有前驱感染史（上感、消化道感染）；绝大多数急性起病，体温正常，1~2周达高峰，2~4周开始恢复。①运动障碍——进行性肌肉无力为突出症状，多双下肢无力起病，瘫痪上行性进展（少数下行性）；对称性（双侧肌力差不超过一级），远端重于近端；腱反射减弱或消失；②脑神经麻痹——常Ⅸ、Ⅹ、Ⅺ、Ⅻ受累，语音小、吞咽困难呛咳、面无表情；偶见视盘水肿；③呼吸肌麻痹——分度：Ⅰ度语音较小咳嗽力弱无呼吸困难；Ⅱ度语音小咳嗽力弱有呼吸困难，稍深吸气时上腹部不鼓起反下陷（腹膈矛盾呼吸）；Ⅲ度重度呼吸困难，平静呼吸即呈腹膈矛盾呼吸或胸式矛盾呼吸；④自主神经障碍——出汗过多或过少、肢体发凉、阵发皮肤潮红、心率增快，严重病例心律失常、血压不稳（可突然升降交替），可有膀胱肠道功能障碍（一过性尿潴留或失禁、便秘腹泻）；⑤感觉障碍——不如运动障碍明显，主观感觉障碍（痛麻痒）为主，维持时间短常一过性，年长儿可有手套袜套式或根性感觉障碍，神经干压痛（抬腿时疼痛）。\n分型：①AIDP急性炎性脱髓鞘性多发性神经病（经典型，任何年龄季节，多有前驱感染，单相病程4周内达高峰，对称性肢体无力多由远端向近端、下肢向上肢发展，可累及躯干脑神经呼吸肌，腱反射减弱消失，病理反射阴性，脑脊液蛋白细胞分离，肌电图以神经传导速度减慢和F波改变为主）；②AMAN急性运动轴突性神经病（多见儿童青少年，明显季节性6~10月，我国北方农村多见，前驱感染以空肠弯曲菌多见，除无客观感觉障碍外类似经典型，部分血清抗GM1、抗GD1a抗体阳性，肌电图CMAP波幅降低、F波潜伏期正常或轻度延长、感觉神经传导正常，提示运动神经轴索受累为主）；③AMSAN急性运动感觉轴突性神经病（类似AMAN但伴感觉障碍，症状较重多伴脑神经受累）；④Miller-Fisher综合征（AIDP变异型，眼肌麻痹、共济失调、腱反射消失三联症，多数血清抗GQ1b、抗GT1a抗体阳性，脑脊液蛋白增高，周围神经电生理可正常或以感觉神经受累为主；Bickerstaff脑干脑炎为其变异型——眼肌麻痹、共济失调、意识障碍可伴锥体束征）；⑤急性感觉神经病（仅四肢感觉损害，急性深感觉障碍和感觉性共济失调，十分罕见）；少见变异型还有急性泛自主神经病、多发脑神经型、咽-颈-臂型、截瘫型。' },
{ m: '30I', q: '吉兰-巴雷综合征的诊断要点、鉴别诊断与治疗方法？', a: '诊断（无特异性方法，依靠临床+实验室，排除其他疾病）：①急性发病，单相病程，不伴发热，上行性对称性四肢麻痹，腱反射减低或消失，病程进展不超过4周；②感觉症状一般远较运动障碍轻微；③可伴运动性脑神经障碍（常见面神经、舌咽、迷走神经受累），病情严重者常有呼吸肌麻痹；④脑脊液蛋白细胞分离现象；神经电生理检查见周围神经脱髓鞘或轴索损害表现。\n脑脊液：压力大多正常；蛋白细胞分离（蛋白增高而细胞数正常）为本病特征之一，病程2~3周达高峰；少数病例细胞数可轻微增高（单核为主，一般<10×10⁶/L）；蛋白高达2g/dl时可引起颅内压增高和视乳头水肿（蛋白过高增加脑脊液黏稠度致再吸收障碍）。血液：可检出抗GM1、GD1a、GQ1b、GT1a等神经节苷脂自身抗体（IgG、IgM、IgA亚型）。肌电图：神经传导速度减慢与髓鞘受损有关，CMAP波幅降低与轴索损害有关；F波潜伏期延长或消失提示周围神经近端或神经根受损。脊髓MRI：马尾神经增粗、增强可见马尾神经及神经根强化（不具临床特异性）。\n不支持GBS的表现：①显著、持续的非对称性肌无力；②以膀胱或直肠功能障碍起病；③存在持续的膀胱或直肠功能障碍；④存在明显感觉平面；⑤脑脊液有核细胞数>50×10⁶/L。\n鉴别诊断：①脊髓灰质炎（先发热，2~3天热退后不对称弛缓性麻痹，早期脑脊液细胞数增加蛋白正常即细胞蛋白分离，肌电图神经源性损害，粪便病毒分离阳性；我国已被消灭）；②急性脊髓炎（起病较缓慢，早期发热背痛腿痛，脊髓休克期急性弛缓性麻痹，休克解除后上运动神经元性瘫痪、肌张力增高腱反射亢进，明显感觉障碍平面及括约肌障碍，脑脊液炎症性改变，脊髓MRI助诊）；③脊髓肿瘤（一侧间歇性神经根痛渐发展为两侧持续痛，脊髓压迫致运动感觉障碍，脑脊液黄变蛋白量增高，脊髓MRI）；④低血钾性周期性麻痹（近端为重弛缓性麻痹，腱反射减弱，无感觉障碍，病程短，血钾<3.5mmol/L，心电图U波和ST-T改变，补钾很快恢复）；⑤重症肌无力（病程缓慢缓解和急性加重交替，肌无力波动性晨轻暮重，上睑下垂或复视，抗乙酰胆碱受体抗体阳性，重复电刺激试验助诊）；⑥CIDP慢性炎性脱髓鞘性多发性神经病（隐匿起病慢性进展或缓解复发，少数急性起病4周内达高峰需鉴别——病情4周后继续进展或复发2次者考虑CIDP）；⑦癔症性瘫痪（进展快，腱反射存在，无脑神经和呼吸肌麻痹，无肌萎缩，暗示疗法很快恢复）。\n治疗：密切监护、精心护理、预防并发症是治疗重点，急性期尤其呼吸肌麻痹时积极抢救度过危险期。\n①一般治疗——防坠积性肺炎、脓毒血症、压疮、血栓性静脉炎；保持呼吸道通畅防窒息（雾化吸入、拍背、体位引流）；勤翻身防压疮；保持瘫痪肢体功能位置防足下垂；严格消毒隔离（气管切开后无菌操作）；自主神经紊乱致心律失常者持续心电监护（窦性心动过速常见通常不需治疗）；\n②静脉大剂量丙种球蛋白——总量2g/kg分2~5天静脉输注，自慢速（40ml/h）渐增至100ml/h；机制：中和髓鞘毒性抗体、抑制补体活化、调节T细胞功能；可缩短病程、抑制急性期病情进展；\n③血浆置换——疗效与IVIG相似，越早越好，可缩短病程但不降低死亡率；每次置换血浆量30~50ml/kg，1~2周内置换3~5次；需加肝素抗凝，清除血浆后将血细胞加血浆代用品回输；条件要求高、有创伤，我国未广泛采用；\n④糖皮质激素——单独应用无确切疗效，与IVIG联合也无显著差异，仅病情重而无法接受IVIG或血浆置换时考虑；\n⑤呼吸肌麻痹治疗——保持呼吸道通畅，正确掌握气管切开适应证；气管插管/切开+呼吸机指征：Ⅲ度呼吸肌麻痹；Ⅱ度伴舌咽迷走神经麻痹；Ⅱ度以上伴肺炎、肺不张；暴发型（发病24~48小时内呼吸肌麻痹进入Ⅱ度）；轻度麻痹尚能满足生理通气量者吸气末双手紧压胸部刺激咳嗽排痰，雾化吸入及体位引流；\n⑥其他——抗生素积极控制细菌感染；B族维生素（B1、B6、B12）促进神经代谢；恢复期早期针灸、按摩、体疗防肌萎缩和关节挛缩。\n预后：大部分患者数周至数月内完全恢复，少数遗留疼痛、疲倦感、足下垂；约4%复发；病死率不到5%，常见死亡原因为呼吸衰竭、严重感染、血压剧烈波动或严重心律失常。' },
{ m: '30I', q: '遗传性运动感觉神经病（CMT/HMSN）的分型、临床表现、电生理与治疗？', a: '定义：一组进行性周围神经病变，Charcot、Marie和Tooth 1886年报道故称CMT病；人群患病率约40/10万，以HMSN（遗传性运动感觉神经病）最多见。CMT1型称脱髓鞘型，CMT2型称轴索型；90%的CMT患者包含4种基因变异之一：PMP22、GJB1、MPZ、MFN2。\n分型与病因：CMT1型（脱髓鞘型，常显）——1A型最常见（占CMT1型80%~90%），17p11.2区域含PMP22基因的DNA片段重复所致；MPZ基因突变致1B型；CMT2型（轴索型，常显或常隐以显性多见）——CMT2A2致病基因MFN2（线粒体融合蛋白2，约25%CMT2型由其突变导致）；Dejerine-Sottas病HMSNⅢ型（常显为主，致病基因PMP22、MPZ、PRX、EGR2、FIG4，神经活检严重脱髓鞘，有学者归为CMT1）；CMT4型（常隐，4A为主要亚型，GDAP1基因）；CMTX型（X连锁，X1型主要亚型为GJB1基因，男性重于女性，男性患者拇短展肌比第1骨间背侧肌无力更重、大鱼际运动功能不成比例丧失，可呈split hand syndrome）；DI-CMT中间型（DNM2、YARS、MPZ基因）。\n病理：CMT1型——有髓神经大中等直径纤维明显减少，反复节段性脱髓鞘及髓鞘再生，施万细胞突起反复缠绕形成同心圆样洋葱球状结构，神经粗大；继发轴索变性和脊髓后索变性（薄束较楔束明显）。CMT2型——轴索变性为主，脱髓鞘不显著，洋葱球及神经粗大少见。\n临床表现：典型表现——进行性下肢远端肌无力和肌萎缩、感觉障碍、腱反射减弱、足部畸形。肌无力自双下肢远端开始（足背屈肌无力为主），平地绊跤、行走跑步困难；肌萎缩自腓骨伸趾总肌及足部小肌肉开始，渐及胫前肌，向上不超过大腿下1/3，大腿小腿鲜明对比——鹤腿征（倒置酒瓶样）；高足弓、足下垂内翻、锤状或爪形趾；跨阈步态；数年后手部前臂肌肉萎缩（爪形手，精细动作困难），上臂不受累；深感觉受累表现为黑天步态不稳或闭目难立征阳性；部分痛阈提高温度觉异常；足部皮肤苍白肢端发凉少汗；早期膝反射消失随后其他腱反射相继消失；约10%脊柱后凸或侧凸、骨盆发育不良；脑神经心脏胃肠道自主神经一般不受影响；智力和寿命不受影响。\n各型特点：CMT1型儿童或青春期起病（约2/3病例10岁前发病），同一家族内发病年龄及严重程度变异大；CMT2型发病较晚（约2/3病例10岁后），进展较慢病情较轻，早发型（婴儿期或儿童期）病情重，部分成年后需轮椅；DSD幼年发病严重型（2岁前），先天性肌张力低下、发育迟缓、共济失调、双下肢远端无力肌萎缩、中重度深浅感觉缺失、腱反射消失，脑神经受累（瞳孔异常如Argyll Robertson瞳孔、听力受损、轻面瘫），脊柱后凸侧弯、弓形足、身材矮小；CMTX型10~20岁发病，手部远端无力肌萎缩为主，男性重于女性。\n电生理：CMT1型运动和感觉神经传导速度明显减慢——婴儿NCV低于正常值60%以上，大于3岁患者NCV低于38m/s；CMT2型周围神经动作电位波幅<正常低限80%，NCV正常或轻度减慢；DSD患者NCV明显降低（通常<10m/s）；CMTX型男性运动NCV 25~45m/s，女性正常或接近正常。\n诊断鉴别：据家族史、典型病史体征及实验室检查确诊，基因检测用于亚型诊断；鉴别——CIDP、代谢性周围神经病、远端型脊髓性肌萎缩、远端型进行性肌营养不良。\n治疗：无特效疗法——物理治疗、作业疗法、支具治疗为主，必要时外科手术矫正足部畸形；AFO踝-足矫形器用于肌无力明显者；肌腱延长术/移植改善挛缩，截骨术或踝关节融合术减轻弓形足足下垂；手指关节挛缩可完全丧失进食写字功能、足部畸形可致完全不能行走，需及早治疗维持基本手足运动能力。' },
{ m: '30J', q: '儿童颅脑损伤的分类分型、儿童特点、临床表现与治疗原则？', a: '概述：颅脑损伤是引起儿童死亡和致残的最常见原因；全年龄组颅脑外伤中5岁以下是一个发病高峰；主要原因是坠落、撞击（新生儿主要由产伤引起）。发病率：每年约10/10万儿童死于头部外伤；5岁以下头部外伤年发生率150/10万，5~15岁100/10万；各年龄组男性均高于女性。\n分类：原发性（脑震荡、脑挫裂伤、原发性脑干损伤、硬脑膜外血肿、硬脑膜下血肿、多发/混合性血肿、脑室内出血）；继发性（脑移位或脑疝引起的压迫性损伤、弥散性脑肿胀、脑梗死等）。\n分型：按格拉斯哥昏迷评分（GCS）——轻型13~15分、中型9~12分、重型3~8分；按损伤程度——轻型（无颅骨骨折且意识丧失≤30分钟）；中型（颅骨骨折、轻度脑挫裂伤，或伤后意识丧失30分钟至12小时）；重型（颅内血肿、脑挫裂伤、脑干损伤，意识丧失12小时以上或意识障碍逐渐加重）；特重型（深昏迷伴去大脑强直，双瞳散大，生命体征严重紊乱或呼吸近停止）。\n儿童颅脑损伤特点（减轻损伤的一面）：婴幼儿颅骨薄而弹性好、骨缝未闭合易变形，缓冲撞击能量减轻加速性损伤；颅前中窝底相对平坦光滑，对移动脑组织摩擦抵抗力小，减轻减速性对冲伤；蛛网膜下腔较成人小，脑组织活动幅度小，脑表面挫伤较少。加重损伤的一面：头皮各层连接疏松血管丰富，损伤后广泛头皮下血肿且不易自限，可致失血性休克；颅骨骨折伴硬脑膜撕裂者因脑搏动冲击使骨折线进行性增宽，形成儿童特有的生长性骨折，可致骨质缺损甚至局部脑膨出；脑组织血流量较成人大、表面血管密集，颅骨变形致血管撕裂后出血凶猛；血脑屏障发育不完善，外伤后脑水肿肿胀明显，加重继发性脑损伤。\n临床表现：新生儿颅脑损伤几乎都是产伤所致（颅骨变形引起颅内出血，常伴脑缺氧损害）——产后不哭、面色苍白、四肢活动少、呼吸急促或不规则；体征颅骨变形、囟门张力高搏动差、四肢肌张力肌力减弱或生理反射消失。小儿脑组织挫裂伤时临床反应严重，生命体征紊乱明显易出现休克；常有延迟性意识障碍（伤后原发性昏迷短暂或缺如，哭闹后又陷昏睡数小时或嗜睡数天，易与继发性脑损伤的二次昏迷混淆）；频繁呕吐、头痛、癫痫发作、颈项强直、双侧瞳孔不等或眼肌运动障碍；局部脑损害——肢体瘫痪或抽搐、失语、偏身感觉障碍；脑膜刺激征（腰穿多血性脑脊液）；脑水肿→颅高压、生命体征变化；小脑幕切迹疝和枕骨大孔疝——意识障碍加重、阵发性角弓反张、瞳孔不等大、光反射消失、呼吸循环衰竭。小儿颅内血肿临床表现较轻，脑疝症状出现较晚，但病情变化急骤，一旦瞳孔散大迅即进入濒危状态。\n诊断：外伤史易诊断，判断轻重需结合辅助检查；腰穿对判断蛛网膜下腔出血或高颅压有帮助但应慎用以防诱发脑疝；X线判断颅骨骨折；CT是发现脑挫裂伤、颅内血肿、脑肿胀和颅骨骨折最重要的检查手段；早期监测生命体征和意识、瞳孔、自发运动、脑干反射的变化。\n治疗：重度患者首先保持呼吸道通畅和循环功能稳定，及早纠正失血性休克和肺通气不足；治疗重点放在控制颅内压增高上，必要时颅内压持续监测；对严重挫裂脑组织和有占位效应的颅内血肿引发的颅高压应尽早手术清除血肿。降颅压：开始可过度换气降低PaCO2；无效时用渗透性利尿剂和激素；人工冬眠和亚低温技术减少脑代谢率降颅压（严重颅脑损伤可用）。小儿维持水电解质平衡功能弱——脱水同时防治低血钠低血钾代谢性酸中毒和过度脱水；脑外伤后2~4天常因抗利尿激素不适当分泌综合征（SIADH）引起水潴留（稀释性低钠血症），血浆渗透压下降脑细胞内水肿；外伤早期大量输液有造成颅高压危险，小儿急性脑水肿补液量每天30~60ml/kg（年长儿）或50~100ml/kg（婴幼儿）；纯糖液不适用，用碱性含盐液纠正代谢性酸中毒。惊厥及时控制——咪达唑仑静脉滴注每小时0.2~0.3mg/kg，避免与苯巴比妥同用以免呼吸抑制。注意合并其他脏器和脊髓复合性损伤。轻型闭合性颅脑损伤有一过性意识障碍者密切观察，一旦意识障碍加深、瞳孔不等大应紧急CT检查。' },
{ m: '30J', q: '新生儿颅脑损伤（头皮损伤、颅骨骨折、脑损伤、颅内出血）的要点？', a: '定义：胎儿分娩过程中因胎头过大、产道异常或接生处理不当造成的颅脑机械性损伤；生后1个月内新生儿头部外伤也属此类（缺氧缺血性脑损伤另述）。\n头皮损伤：新生儿头皮薄血管丰富易出血水肿。①胎头水肿（产瘤）——子宫收缩影响胎头血液循环、局部浆液渗出；出生即存在，头顶基底宽软大包块、表皮红肿，1~2日自行消退不需治疗；②帽状腱膜下血肿——头皮自帽状腱膜下撕脱出血，疏松结缔组织出血易扩散形成较大血肿甚至波及全头；小者不处理自行吸收，过大时需输血治疗，局部穿刺抽血后弹力帽压迫；③头颅血肿——骨膜与颅骨外板分离造成骨膜下出血；多发生于初产妇及难产新生儿；范围局限在每块颅盖骨内不超过骨缝（区别于产瘤），多见于顶部，较产瘤硬，吸收消退缓慢需数周甚至数月；吸收过程中周边变硬易误诊凹陷骨折；不需治疗可自行吸收，过大可穿刺抽血；吸收不全可血肿钙化致局部颅骨增厚，极少数形成骨囊肿。\n颅骨骨折：新生儿颅骨薄而柔韧、仅一层无内外板板障之分。①颅缝重叠骨折——胎头经产道受压变形，额骨枕骨经冠状缝和人字缝叠于顶骨之下；生后颅内压作用下很快恢复；少数产道滞留长、受压过度者颅缝撕裂重叠不能很快复位（多合并脑损伤）；不需特殊处理随生长发育慢慢复位；②枕骨人字缝撕裂骨折——多臀位产，枕骨在耻骨联合处受阻撕裂分离；枕部头皮肿胀或血肿；一般无症状不需处理，合并硬脑膜撕裂者少数形成颅骨生长性骨折（需观察复查头颅X线）；③凹陷骨折——骨性产道挤压或产钳助产手指压迫造成，乒乓球样凹陷（多无骨折线）；凹陷浅平坦者不需治疗可自行复位；凹陷深度>0.5cm即手术指征；>1cm特别是锥形凹陷必须复位手术，否则影响脑组织发育甚至造成癫痫。\n脑损伤：难产（臀位产、产程过长过急、过期胎儿、胎头过大、骨盆狭窄畸形、产钳、胎头吸引）致胎儿头颅过度挤压，脑组织局部或多处挫伤、出血水肿、软化坏死，局部囊肿或脑室穿通畸形。表现精神淡漠、厌食吐奶、抽搐、肢体瘫痪，少数易漏诊。凡有头皮及颅骨损伤的新生儿都要严密观察警惕合并脑损伤。头颅CT早期点状高密度出血或混杂密度影，晚期较大面积低密度或囊性改变。较重者吸氧、脱水及促脑神经细胞恢复药物治疗。\n颅内出血：新生儿创伤性疾病中最严重的一种，引起窒息与死亡的重要原因；死亡率高达40%~60%，生存者约一半致残；占新生儿所有疾病14.9%、非感染性疾病22.2%。病因三类：①分娩时头颅机械性损伤（本文重点，多发生于足月或过期产——头盆不称、产钳或胎头吸引器过度挤压使胎头极度变形，大脑镰和小脑幕受牵拉超过弹性限度撕裂，多撕裂静脉及静脉窦引起静脉性出血；出血部位硬脑膜下、蛛网膜下隙、脑实质内及脑室，硬脑膜外出血少见）；②脑内缺氧致脑血管通透性增加（多发生在早产儿）；③凝血机制障碍或先天性出血性疾病。临床表现：出血时窒息、呼吸困难浅而不规律、皮肤青紫苍白；窒息恢复后哭闹不安尖叫或哭声细微、嗜睡、四肢肌紧张或抽搐、体温不升或升高、拒奶、前囟膨隆搏动消失、颈项强直、眼球震颤斜视、瞳孔不等、腱反射亢进或消失、肢体瘫痪。诊断：据分娩及出生时表现；疑颅内出血时前囟穿刺或腰穿脑脊液血性可确诊；CT准确判断出血部位及类型（新鲜出血脑实质内、硬脑膜下、蛛网膜下隙、脑池、脑室内高密度影；慢性硬脑膜下血肿脑表面半月形高/等/低密度影，可伴脑萎缩脑室扩大）。治疗：保持呼吸道通畅、充足氧吸入；止血、镇静、维生素及脱水药物；保暖、维持营养、防并发症；蛛网膜下腔出血严重者腰穿放液；硬脑膜下出血经前囟硬脑膜下血肿穿刺抽血；脑室出血脑室穿刺引流或留置Omaya囊；脑实质内大量出血、脑受压明显或脑疝者钻孔穿刺抽血或开颅清除血肿。' },
{ m: '30J', q: '颅骨生长性骨折（GSF）的定义、机制、诊断与治疗？', a: '定义：婴幼儿早期头外伤后罕见并发症（1816年John Howship提出）；发生概率0.05%~1.6%；约90%发生在3岁之内，50%发生于1岁之内；多有外伤病史（坠落伤、车祸伤、钝器伤等）；发生部位多在顶部，其次枕部额部、后颅窝、眶顶。\n机制：颅骨骨折同时发生的硬脑膜破裂是重要致病因素；脑组织生长速度快，被撕裂的硬脑膜产生张力性回缩，使蛛网膜、软脑膜甚至脑组织疝出硬脑膜缺损处；脑脊液进入囊肿速度大于流出速度，单向瓣膜效应使囊肿逐渐增大，最终产生脑膜脑膨出；脑脊液波动压力传导+脑组织快速发育（生后第一年头围可增加12cm，占生后总增加长度的34%）对颅骨产生向外扩张力，致骨折缺损处逐渐增大。颅骨缺损区通常在2个月内发展最快。\n易发原因：①婴幼儿颅骨薄、伸展弹性大变形幅度大；②婴幼儿硬脑膜与颅骨内面粘连紧密，剧烈变形运动后硬脑膜蛛网膜撕裂分离；③婴幼儿颅脑快速发育对颅骨产生向外扩张力；④脑及脑脊液搏动致骨折边缘脱钙、骨质逐渐被侵蚀使骨折无法愈合；⑤婴幼儿颅骨血液供应主要来自硬脑膜动脉，骨折后颅骨外膜与硬脑膜大片分离，颅骨供血阻断影响愈合。\n诊断：明确颅脑外伤史+骨折后逐渐增大的颅骨缺损或局部波动性肿块+动态影像学观察见线性骨折、骨折缝进行性增宽即可诊断；原认为颅骨骨折缘距离4mm以上是确诊标准，3岁以下婴幼儿标准应适当放宽以利于及早手术。\n治疗：符合诊断标准者应在生命体征平稳后及早手术，预防脑脊液漏——①剥离颅骨与粘连破损处硬脑膜，清除坏死软化灶；②咬除骨折端碎骨片，缺损处四周剥离硬脑膜至正常边缘；③缓慢释放脑脊液降颅压后还纳膨出部分，人工/自体/异体材料严密修补硬脑膜，逐层关颅；近年人工脑膜修补基础上自体骨瓣成型移位固定，一期手术促进颅骨愈合。硬脑膜破损和颅骨骨折是GSF病理基础，及早手术干预修复硬脑膜对愈后起决定性作用；否则可导致脑坏死软化、癫痫、偏瘫等神经功能障碍，影响大脑发育。' },
{ m: '30J', q: '脑震荡与脑挫裂伤的临床特点、诊断、治疗与预后？', a: '脑震荡：伤后立即发生的短暂性、可逆的功能丧失（意识丧失多在半小时以内）。表现：外伤后短暂意识丧失；较大儿童清醒后持续性头痛、呕吐、眩晕、精神紧张、逆行性遗忘（归因于脑干内传导束轴突剪切应力损伤）；婴幼儿短暂意识障碍不明显，仅外伤后短暂发愣、对外界刺激无反应，随后恢复肢体运动、嗜睡易激惹呕吐；婴幼儿脑震荡后可发生弥漫性脑肿胀，伤后神经功能恶化、迟发性呕吐和嗜睡（小儿脑震荡综合征，可能与组胺类神经活性物质刺激迷走神经有关——经侧脑室第三脑室弥散到第四脑室底需一定时间）。诊断：外伤史+短暂意识丧失+逆行性遗忘+无神经系统阳性体征；颅骨X线无骨折，腰穿测压正常、脑脊液无红细胞；脑电图低或高幅快波，偶见弥散性慢波，1~2天恢复正常；CT平扫及增强无异常；SPECT示青少年小脑枕叶血流降低，PET示脑组织葡萄糖利用增加呈高代谢。治疗：无需特殊治疗，卧床1周、减少外界刺激、对症镇痛镇静；多数2周内恢复正常，预后良好；小儿脑震荡必须留观24~48小时，密切观察生命体征、意识、瞳孔、肢体运动；频繁呕吐者静脉补液防脱水电解质紊乱；镇静药选不影响生命体征观察的药物。\n脑挫裂伤：严重闭合性颅脑损伤致脑组织在颅腔内滑动碰撞，变形和剪切应力致脑表面挫伤及点状出血，严重时脑灰白质撕裂；损伤多在暴力直接作用部位和对冲部位（颅前窝底、眶顶、颞叶前部多见）；大龄儿童多见，婴幼儿少见（颅骨柔韧缓冲、蛛网膜下腔窄限制脑移动、颅前中窝底光滑）。\n儿童特点：①婴幼儿常表现为损伤区域脑白质广泛裂伤（多见于额叶眶区和颞叶），白质撕裂形成许多小裂口和不规则腔隙但出血轻微；②婴幼儿钝性外伤可仅引起基底节区损伤而脑皮质损伤不明显，临床常表现为对侧偏瘫；③儿童脑组织对挫伤的反应是脑肿胀明显，且脑肿胀多因血管扩张、脑血流增多引起（不是水肿）。\n临床表现：①意识障碍——最突出（多合并脑干网状结构损伤），伤后立即昏迷，数分钟至数小时数日或迁延性昏迷；②局灶性神经损伤症状——皮质功能区受损时伤后立即出现肢体瘫痪、偏身感觉障碍、失语或偏盲（额颞叶前部损伤可无局灶症状）；③头痛（胀痛或跳痛，蛛网膜下腔出血、脑水肿、脑肿胀所致）；④癫痫发作——多在挫裂伤早期（伤后数小时或数日内频繁发作），全面性和局限性发作为主（儿童脑皮质抑制功能发育不完善对损伤敏感）；⑤恶心呕吐——蛛网膜下腔出血刺激、颅压变化、脑脊液冲击四脑室底兴奋延髓呕吐中枢，伤后立即频繁喷射性呕吐（小儿尤其常见），可误吸窒息，频繁呕吐致严重脱水电解质紊乱；⑥脑膜刺激症状（颈项强直、屈腿伸直试验阳性）；⑦体温升高常见（下丘脑体温调节中枢不稳定+血性脑脊液刺激）。\n辅助检查：腰穿脑脊液均匀血性（与脑震荡鉴别点），可测颅压及引流血性脑脊液，但有颅高压者禁忌；颅骨X线；头颅CT——首选，典型为低密度脑水肿区内多发散在斑点状高密度小出血灶（部分融合小血块），周围水肿带明显；头颅MRI对脑干微小挫伤、弥漫性轴索损伤及早期梗死灶优于CT（不作急性首选）。\n诊断：严重闭合性颅脑损伤+伤后意识障碍重持续时间长+头痛频繁呕吐+局灶性神经功能障碍和脑膜刺激症状+腰穿血性脑脊液，结合CT排除颅内血肿。\n治疗：非手术——轻中型对症处理，密切观察生命体征神经反射，防治脑肿胀水肿，及时复查CT除外迟发性血肿；延迟性昏迷者保持呼吸道通畅必要时及早气管切开，加强营养支持防治水电解质紊乱；中枢性高热、癫痫持续发作、头痛躁动必须及时处理（增加脑耗氧加重脑水肿），可冬眠亚低温治疗度过早期脑水肿阶段；有颅高压者有条件时颅内压监测，常规激素及脱水治疗；平稳期促神经功能恢复（营养神经药物促进脑细胞复苏、调节下丘脑功能、改善脑干网状结构功能）。手术——挫碎脑组织肿胀水肿致进行性颅高压、降颅压措施无效、迟发性脑内血肿和继发性脑损伤、脑疝前期征象时紧急开颅清除糜烂肿胀脑组织，行内、外减压术；儿童去骨片减压要慎重（尤其婴幼儿，多采内减压或骨瓣飘浮）——小儿脑损伤后水肿明显，去骨片后局部脑膨出嵌顿骨缘可形成局部缺血坏死造成不可逆神经功能障碍。\n预后：治疗及时得当多数预后良好；小儿脑组织对损伤反应重但承受能力大、代偿能力强，恢复较快后遗症较成人少得多；极少数遗留外伤性癫痫、肢体轻瘫。' },
{ m: '30J', q: '原发性脑干损伤（含弥漫性轴索损伤）的机制、临床表现、辅助检查与治疗预后？', a: '机制：头部受外力时外力直接致脑组织移位使脑干撞击坚硬的颅底斜坡或小脑幕游离缘，或旋转剪切应力致脑干扭转牵拉损伤；小儿颅骨受直接暴力时变形度大，脑室内脑脊液产生强烈冲击波造成中脑导水管周围或四脑室底液压冲击伤也是重要原因。多位于一侧脑干被盖部或中央部，局部挫裂伤伴灶性出血水肿，后期可缺血梗死软化坏死。弥漫性轴索损伤（DAI）属原发性脑干损伤类型——头部加速性旋转外力时剪切应力造成弥漫性神经轴索挫伤，病理改变主要位于脑中轴部分（胼胝体、大脑脚、脑干、小脑上脚），白质传导束挫伤、出血、水肿。\n临床表现：①意识障碍——伤后立即持续昏迷，轻者对强痛刺激可有反应，重者所有生理反射消失、四肢弛缓性瘫痪进入濒死状态（脑干网状上行激动系统受损）；②生命体征改变——脑桥呼吸节律调节中枢受损致呼吸节律不规则、陈-施呼吸或抽泣样呼吸，延髓神经元受损致呼吸暂停、变慢变浅；延髓首端腹外侧区（心血管活动中枢）受挫致血压下降、心律失常或心搏骤停；自主神经中枢障碍——中枢性高热、消化道应激性溃疡、顽固性呃逆；③眼球运动和瞳孔改变——动眼神经核、外展神经核或侧视中枢损伤：眼球分离、双眼同向凝视和同向运动障碍；瞳孔时大时小双侧交替变化、极度缩小成针状或散大固定、形状不规则，对光反射多消失；④锥体束征——肢体瘫痪、肌张力增高、腱反射活跃、浅反射消失、一侧或双侧病理征阳性；严重时一切生理反射消失、肌张力松弛；⑤去大脑强直——中脑损伤重要体征（前庭核水平促进伸肌收缩中枢与中脑红核及周围网状结构伸肌抑制中枢之间横断性损伤）：全身肌张力增高、阵发性四肢过度伸直、头后仰呈角弓反张，外界稍刺激即可诱发，重者持续强直。\n辅助检查：①颅内压持续监测鉴别原发性和继发性脑干损伤（前者颅内压多正常，后者多增高）；②脑干听觉诱发电位准确反映脑干损伤平面和程度并助预后判断——外伤后深度昏迷者BAEP有异常发现者69%能恢复、31%死亡，BAEP根本无反应者100%死亡；③头颅CT——脑干被盖部或导水管周围不规则斑点状高密度小出血灶，周围低密度水肿区，脑干肿胀、脑池闭塞；④头颅MRI——急性期短T1长T2高信号出血改变，对脑干细微损害优于CT，晚期DAI致脑干变细；⑤脑干生理病理反射——病理性掌颏反射提示脑干皮质-皮质下区平面；睫脊反射、掌颏反射消失提示间脑平面受累；额眼轮匝肌反射消失+角膜下颌反射出现为间脑-中脑水平；瞳孔对光反射消失+角膜下颌反射出现提示损伤扩及中脑水平；角膜反射和咀嚼肌反射消失是脑桥水平受损；眼心反射及以上反射都消失是损伤直达延髓的征象。\n诊断：颅脑外伤后即陷入持续深度昏迷+眼球分离、瞳孔大小多变、生命体征紊乱明显、去大脑强直发作、角弓反张、四肢肌张力增高及病理征阳性；CT排除颅内血肿+腰穿压力不高则诊断成立。\n治疗：与重度脑挫裂伤基本相同，主要是非手术支持治疗——急性期维持生命体征平稳（呼吸道通畅，深度昏迷尽早气管切开，呼吸功能不全者呼吸兴奋剂+机械通气，维持血压心率水电解质内环境稳定）；减轻脑水肿脑肿胀（激素+高渗性脱水药+人工冬眠亚低温——降低脑组织代谢率、增加缺氧耐受、减轻脑肿胀）；去皮质强直和肌张力增高及时控制（抗癫痫药或镇静药）以免加重缺氧脑水肿；恢复期高压氧+促脑组织代谢药（胞磷胆碱、脑活素、ATP能量合剂），防压疮肺炎泌尿系感染。预后：成人多数预后不良；儿童处在脑发育期代偿能力极强，只要度过急性期绝大多数有比较满意的恢复，有的昏迷数月清醒后逐渐能正常生活。' },
{ m: '30J', q: '硬脑膜外血肿的发病机制、临床表现（儿童特点）、诊断与治疗？', a: '定义：血液在颅骨内板和硬脑膜之间的蓄积；是儿童颅内血肿中最常见类型，约占小儿急性外伤性颅内血肿总数60%；婴幼儿较少见，随年龄增长发病率增加。\n机制：头颅外力作用下较大变形，硬脑膜动静脉剥离或撕裂出血，血肿达一定体积出现颅压增高和/或脑受压；典型为额颞外伤、骨折线跨越脑膜中动脉穿行区，骨片移位撕裂血管；儿童冲击伤致颅骨剧烈变形使硬脑膜和颅骨剥离，板障内静脉、脑膜动静脉小分支或静脉窦撕裂，通常不伴明显骨折；血肿可因破裂血管继续出血或血肿剥离撕裂周边小动脉而渐进性增大。\n儿童特点：①成人多为动脉性出血且多合并颅骨骨折，儿童婴幼儿通常是静脉性出血，30%~40%不合并颅骨骨折；②成人典型"原发性昏迷-中间清醒期-继发性昏迷"，儿童外伤初期仅片刻发愣，随后哭闹激惹，继发昏迷出现前36~48小时内经常无神经系统异常发现；③儿童未成熟颅骨极具扩展特性，有时100ml以上血液积存于硬脑膜外腔，在婴儿导致出血性休克；④新生儿产钳助产后通常发生硬脑膜外血肿和颅骨骨折，血肿可经分离骨缝或骨折线进入帽状腱膜下腔；⑤约50%儿童和85%婴儿并没有意识丧失，只随血肿发展出现意识变化；⑥后颅窝硬脑膜外血肿儿童期常见（占儿童后颅窝外伤25%~38%，多为坠落跌伤，出血最常见来源为硬脑膜静脉窦或板障静脉），65%患儿伴枕骨骨折。\n临床表现：小儿多为静脉性出血、血流压力低出血缓慢+颅内代偿能力强，急性脑受压症状轻、出现较晚；①意识障碍——年长儿典型"原发昏迷-中间清醒期-继发昏迷"，婴幼儿表现为伤后哭闹激惹烦躁不安随后意识障碍进行性加深直至脑疝；②颅内压增高——头痛呕吐前囟张力增高膨隆（小儿出现较成人晚，可仅表现精神变弱嗜睡躁动；呕吐出现频率高且多在外伤后早期，可能因脑室内压力突然变化刺激第四脑室底呕吐中枢）；③瞳孔改变——受伤当时部分患儿双侧瞳孔扩大随后恢复；脑疝前期血肿侧瞳孔缩小对光反射迟钝（动眼神经受刺激，临床上很难发现）；脑疝后血肿侧瞳孔散大、对光反射消失、眼球固定（动眼神经受压麻痹，提示小脑幕切迹疝，病情危重需紧急手术）；④局部神经体征——外伤后易癫痫发作（血肿对皮质的压迫刺激+小儿皮质抑制功能发育不完善），可由一侧肢体局限性抽搐渐发展为全面性发作；血肿位于运动区附近致对侧肢体无力或瘫痪（上下肢程度可不等、对侧锥体束征阳性）；脑疝使大脑脚受压也可出现对侧偏瘫；⑤生命体征——颅压不断增高出现Cushing反应（脉搏减慢、血压增高、呼吸加深减慢）；婴幼儿血压心率变化不明显可掩盖脑疝早期征象；脑疝压迫脑干时血压下降、心率呼吸节律紊乱，最后脑干功能衰竭死亡。\n辅助检查：腰穿急性期禁忌（防诱发脑疝）；头颅CT首选——颅骨内板下梭形高密度影，边缘光滑锐利，脑组织及脑室系统受压移位，中线结构偏移，骨窗像显示颅骨骨折。\n诊断：小儿急性硬脑膜外血肿临床表现多不典型，外伤后出现嗜睡、不安、易激惹、呕吐、癫痫发作或一侧肢体肌力减弱应考虑颅内血肿可能，进一步头颅CT；意识障碍进行性加深+瞳孔变化和生命体征紊乱提示脑疝前期需紧急手术。注意迟发性硬脑膜外血肿——首次CT无异常，相隔几小时或数天后复查才发现（占硬脑膜外血肿总数5%~22%）；机制：外伤时硬脑膜出血源因脑水肿颅高压的填塞效应受压，过度换气、强力脱水或全身血压降低使颅内高压急剧降低，出血点失去填塞效应造成硬脑膜剥离引发迟发血肿；此类患儿常有病情突然恶化，一旦诊断明确尽早手术清除血肿。\n治疗：保守治疗适用于病情平稳、无意识障碍、无眼底水肿及神经病理体征、CT示血肿量小中线结构无移位者——严密观察下脱水、激素、止血治疗；入院后2~3天常规每日CT或症状随时检查；一旦血肿增大或出现脑疝前期征象需紧急手术。手术——开颅清除血肿，消除占位效应，电凝破裂血管控制出血；硬脑膜表层残留少量凝血块不必勉强剥离以免新出血；骨窗四周硬脑膜悬吊防继续剥离；硬脑膜张力高、颜色变蓝者常规切开硬脑膜下探查。预后：处理及时得当且术前未出现脑疝等严重并发症者预后良好，多数不遗留神经系统功能障碍。' },
{ m: '30J', q: '硬脑膜下血肿（急性与慢性）的要点？', a: '定义：血液在蛛网膜和硬脑膜之间腔隙的蓄积；发生率较硬脑膜外血肿低，约占儿童颅内血肿25%；分急性、亚急性和慢性。\n急性硬脑膜下血肿（外伤后3天内出现症状）：发生率明显低于硬脑膜外血肿（小儿脑组织弹性好、颅骨内板光滑，对冲性损伤引起的硬脑膜下血肿较成人少得多）。\n临床表现：复合型（多合并原发性脑挫裂伤）——症状严重、发展迅速，伤后多有原发性昏迷且不断加深，极少有中间清醒期；按脑挫裂伤和血肿部位出现各种局灶性神经体征或癫痫发作；血肿占位效应致脑疝时出现生命体征和瞳孔变化（瞳孔不等大、病理性呼吸）。单纯性——多无原发性意识障碍，仅外伤后精神变弱或烦躁哭闹易激惹，多伴抽搐、频繁呕吐；血肿压迫皮质出现局限性神经体征；前囟未闭者多数前囟张力增高或膨隆。\n诊断：主要依靠CT——颅骨内板下"新月形"或"半月形"高密度影，病变范围广泛，脑组织受压皮质界面内移；合并脑挫裂伤时脑实质内斑点状不规则高密度影周围水肿带明显；占位效应时脑室受压中线结构移位；骨窗像仅11%~40%发现颅骨骨折。\n治疗预后：急性期多为硬脑膜下腔凝固血块，经皮硬脑膜下腔穿刺引流无明显效果；有临床症状、CT示高密度血块形成者急诊开颅血肿清除+控制出血是首选；复合型常需同时清除碎烂肿胀脑组织行内减压术，术中可决定去骨瓣减压或颞肌下减压；儿童头皮薄一般尽可能不做外减压以免伤口脑脊液漏或感染。预后好于成年患者（代偿能力强）。\n慢性硬脑膜下血肿（外伤后3周以上始出现症状、已形成包膜）：可发生于各年龄阶段，发病高峰6个月以内；绝大多数来自轻微被忽略的头部外伤，也可因产伤；小儿双侧居多；出血多来源于大脑表面汇入上矢状窦的桥静脉破裂，压力低血肿形成慢，通常不引起颅内压快速增高。\n病理：包膜伤后7~10天开始形成，2~3周完成；硬脑膜侧较厚血供丰富粘连紧密，蛛网膜侧囊壁薄连接疏松；囊内积血多已液化（变性血红蛋白和胆红素呈酱油色或咖啡色）；包膜内液化血液蛋白成分高呈高渗状态，通过内侧纤薄囊壁吸收低渗脑脊液使血肿不断增大（或包膜新生血管壁通透性增高致白蛋白渗漏造成高渗）；症状进行性加重不完全因血肿压迫——大面积血肿包膜机化造成残留引流桥静脉牵拉狭窄，导致大脑半球静脉回流减少，静脉栓塞产生静脉回流性脑水肿使神经受损症状加重；包膜刺激皮质可促发癫痫。\n临床表现：慢性脑受压和局灶性神经定位体征，进展缓慢；约60%患儿头围进行性增大、前囟膨隆、呕吐、易激惹或嗜睡；年长儿头痛头昏、注意力不集中、记忆力下降、视力减退，眼底视盘水肿或视网膜出血。与先天性脑积水鉴别——前者头颅增大程度不如后者；脑积水顶枕区叩诊鼓音或破壶音，慢性硬脑膜下血肿叩诊钝性实音，骨缝分离在脑积水更明显。约40%患儿因皮质受压出现局灶性神经损害（偏侧肢体肌力减弱、轻瘫、锥体束征阳性、中枢性面瘫、失语）。\n诊断：年龄<6个月+轻微外伤或产伤史+逐渐头围增大、慢性颅内压增高+局灶性神经功能受损体征应考虑；CT示颅骨内板下"新月形"密度均匀稍低密度占位（密度稍高于脑脊液——蛋白含量高），增强扫描血肿包膜强化；MRI慢性血肿T1、T2加权像均为高信号；高度怀疑者诊断性穿刺（前囟侧角距中线3cm处，45°角进针0.5cm即达硬脑膜下腔，见大量陈旧棕色或褐色液流出可确诊）。\n治疗：年长儿同成人，多钻孔冲洗+外引流术；婴幼儿双侧慢性液化血肿且症状轻微（呕吐易激惹而无意识水平变化和运动障碍）可反复经前囟穿刺引流——避免一次放液过多过快以免脑位移过多造成对侧血肿，多数数次穿刺后可治愈；反复穿刺仍持续积液者行硬脑膜下-腹腔分流术；脑室内镜钻孔冲洗可降低积液复发率；包膜粘连增厚妨碍脑组织发育者开颅将血肿积液连同包膜一并切除——脏层包膜尽可能切除，脑镰或侧裂等反折粘连严重部位不可强行剥离以免损伤脑实质，不能切除的囊壁放射状切开充分解除脑组织束缚；壁层与硬脑膜粘连、大量新生血管，强行剥离易再出血应慎重。\n预后：多数及时有效治疗后症状好转并完全康复；包膜钙化粘连严重者限制幼儿脑组织正常发育，可遗留智力障碍、偏瘫、癫痫等后遗症。' },
{ m: '30J', q: '脑内血肿与硬脑膜下积液的要点？', a: '脑内血肿：头部外伤后血液在脑实质内积聚，约占儿童外伤性颅内血肿10%；可伴脑组织挫裂伤，常与硬脑膜下血肿并发（同部位不同类型血肿称分层血肿或多发血肿）；主要为皮质下血管在外界剪切应力下破裂，少数因凹陷性骨折刺破脑组织所致。\n病理：浅部血肿多由脑挫裂伤发展而来（额叶或颞叶底面，常合并硬脑膜下血肿）；深部血肿位于基底节、脑干、小脑深处（外伤时颅内震荡引发深部血管破裂，或血管痉挛梗死后出血）；早期血凝块与碎烂脑组织混杂周围水肿；4~5天后液化成棕褐色陈旧凝血，周围胶质细胞增生；2~3周后包膜形成。\n临床表现：高峰为外伤后2~4天，类似急性硬脑膜下或硬脑膜外血肿但局限性神经定位体征更突出——多表现为癫痫发作和运动功能障碍；颞叶血肿对侧上肢和面部肌肉瘫痪多见；年长儿左额叶血肿出现失语；底节区血肿致偏瘫、偏身感觉障碍或偏盲；小脑血肿共济失调、平衡障碍、眼震。\n辅助检查：CT最常用——非挫裂伤引起的脑内血肿边界光滑、圆形或卵圆形、轴向多朝向脑表面；挫裂伤后血块融合者形状不规则无明显边界；血肿周围明显低密度水肿带；血肿形成1~2周后因周围新生血管形成出现环状强化，随后环状强化消失、血肿变低密度或等密度（脑组织软化区形成）。\n诊断治疗：明确外伤病史+典型症状影像特征；需与动脉瘤、动静脉畸形等脑血管病引起的脑实质内自发性血肿鉴别。与脑实质外血肿不同，脑内血肿通常不需手术清除，除非占位效应和继发性脑损伤将致神经功能障碍或颅压增高危及生命才考虑；对儿童深部或重要功能区血肿多采取慎重态度——脑实质内血肿手术仅是抢救生命手段而非保存恢复神经功能的治疗措施；脑内血肿患儿如有外伤后癫痫，即使血肿清除对抽搐也无大的改善。\n硬脑膜下积液：多发生于颅脑外伤后，脑组织剧烈位移致局部蛛网膜撕裂，脑脊液通过裂孔进入硬脑膜下间隙形成局部硬脑膜下腔内脑脊液过量积聚；发生率约占外伤性颅内血肿10%。与液化慢性硬脑膜下血肿区别：慢性血肿多合并脑挫裂伤、内容主要为暗褐色或酱油色液化血液，积液急性期多为淡血性脑脊液、后期转为黄染清亮液体蛋白稍高；积液性状与脑脊液大致相同（含白蛋白前体，液化血肿中常无此物质）；硬脑膜下血肿常有增厚粘连包膜，积液包膜缺如。\n机制：外伤所致蛛网膜裂孔像单向活瓣，患儿挣扎屏气咳嗽等用力动作时脑脊液顺压力梯度不断进入硬脑膜下腔却不能返回蛛网膜下腔，积液逐渐增大压迫局部脑组织致颅内压增高；蛛网膜最常见撕裂部位在外侧裂，故积液部位以额颞顶区（半球凸面）居多。\n临床表现：类似硬脑膜下血肿（急性、亚急性和慢性之分），穿刺前鉴别困难；多为慢性病程，外伤后逐渐加重的慢性颅内压增高征象和局部脑组织受压症状；部分患儿嗜睡、精神减弱、进行性头围增大、前囟膨隆张力增高、头痛频繁呕吐视盘水肿；局灶神经症状多表现为对侧上肢或面部瘫痪、运动性或混合性失语；后期积液持续压迫影响脑组织正常发育致脑皮质萎缩（约20%慢性硬脑膜下积液患者有局部脑萎缩）。\n诊断：CT示颅骨内板下低密度、范围广泛占位，密度等同脑脊液；MRI区分不同物质信号——积液信号等同脑脊液，慢性血肿T1、T2均高信号。\n治疗：积液薄、无压迫症状通常不需治疗；有临床症状者多钻孔引流术（积液腔最低处密闭式外引流，术后72小时积液腔明显缩小拔管）；钻孔引流后复发常见（脑组织不能及时膨起、残留积液空腔）；引流无效者硬脑膜下-腹腔分流术（低压分流管或剪除腹腔侧伞端以利通畅），积液彻底消失半年或一年后拔管（并非必需）。' },
{ m: '30J', q: '脊髓损伤的病因病理、临床表现（各节段特点）、检查与治疗？', a: '定义：外界暴力直接或间接作用于脊柱，引起脊椎骨骨折累及脊髓神经节的损伤；分开放性和闭合性；儿童期较少发生，约占所有脊髓外伤2%~5%（婴幼儿头部占比大外伤易致颅脑损伤；儿童脊柱和支持组织柔韧性好可伸缩性大；椎骨椎间盘弹性可压缩性大不易骨折，减少脊髓间接损伤）。\n病因：直接暴力（重物冲击腰背部、后仰跌倒背部撞击凸起石块、腰背部挤压伤）致与外力部位一致的脊髓损伤，临床较少见；间接损伤——高处落下、头部打击、脊柱过伸过屈或扭转造成椎体骨折脱位或脊髓血液循环障碍。儿童期最常见原因：坠落伤（56%）、车祸伤（23%）。成人常见损伤部位胸腰椎移行段其次颈椎；儿童最常见颈髓（57%）、其次腰段（16.5%），胸段受肋骨骨性胸廓保护受伤机会少。\n病理：①脊髓震荡（脊髓休克）——伤后立即短暂性脊髓功能丧失，无肉眼可见损伤；②脊髓挫裂伤——脊髓部分或完全断裂，碎烂出血水肿液化坏死，脑脊液血性；血管痉挛可致上下数个节段血供障碍；后期液化坏死空泡、胶质瘢痕纤维增生、蛛网膜粘连增厚形成囊肿；③脊髓受压——突入椎管内的骨折片、脱位椎骨、撕裂韧带、脊髓外血肿压迫；④脊髓缺血和中央出血性坏死——微血管破裂、血管痉挛或血栓形成致缺血性损害液化坏死，静脉回流受阻致脊髓水肿；儿茶酚胺类神经递质过度释放易致脊髓血管痉挛梗死出现中央出血性坏死。\n临床表现：1.脊髓震荡——外伤后立即损伤平面以下肢体弛缓性瘫痪、肌张力低、深浅反射消失、皮肤苍白干燥、尿潴留，一般数小时后开始恢复，如无其他实质损害2~4周内恢复正常。2.脊髓损伤——渡过脊髓休克期后损伤平面以下肌张力增高、腱反射亢进、出现病理反射；运动和感觉恢复程度取决于损伤程度（部分性损伤平面以下仍有部分运动感觉；完全性损伤感觉运动完全消失，早期低位自主反射可出现）。横断面不同部位损伤：①脊髓半横断损伤综合征——同侧运动和深感觉障碍、对侧痛温觉障碍；②脊髓中央性损伤——受损节段神经分布区痛温觉缺失而触觉深感觉存在，肌肉下运动神经元瘫痪；③脊髓前部损伤——损伤平面以下完全瘫痪及浅感觉迟钝或消失，后索深感觉保存，伴括约肌功能障碍；④脊髓后部损伤——深感觉（定位觉振动觉）缺失、痛温觉保存，肌肉瘫痪不完全。3.不同节段损伤特点：①高颈段（C1~C4）——C1~2损伤严重者多立即死亡；C3~4损伤膈神经和呼吸肌支配神经麻痹致呼吸困难，损伤平面以下痉挛性瘫痪、括约肌障碍；上颈段三叉神经脊髓束损伤面部"洋葱皮样"感觉障碍（Dejerine综合征）；自主神经损伤持续性高热、单侧或双侧Horner综合征；②颈膨大（C5~T1）——肋间神经麻痹呼吸困难，上肢弛缓性瘫痪，下肢痉挛性瘫痪，损伤平面以下深浅感觉消失，自主神经括约肌障碍多见；③胸部中下段（T3~T12）——明确感觉障碍平面，平面以下感觉运动消失，脊髓休克期后出现"集合反射"（刺激下肢出现肌肉痉挛、膝髋关节屈曲、下肢内收、腹肌收缩、反射性排尿、出汗、立毛反射）；胸段损伤交感神经功能障碍明显；④腰膨大（L1~S2）——下肢弛缓性软瘫，腹壁反射存在，膝腱反射消失；⑤脊髓圆锥损伤——脊髓排尿中枢受损，自律膀胱、小便失禁、直肠括约肌松弛，会阴部马鞍形感觉消失，肛门反射消失，膝腱跟腱反射存在，可无肢体瘫痪；⑥马尾神经损伤——多为不完全弛缓性瘫痪，腱反射消失，感觉障碍不规则，括约肌障碍明显。\n检查：局部查体（脊柱局部变形肿胀压痛棘突分离）；神经系统查体（深浅感觉运动功能、生理病理反射判断损伤平面部位程度）；腰穿（脑脊液血性提示脊髓挫裂伤、有无蛛网膜下腔梗阻）；脊柱X线（椎体压缩、椎板关节突骨折脱位、椎间隙椎管狭窄、小关节交锁；小儿脊柱弹性强可瞬间脱位又自行复位，故可明显脊髓损伤而X线正常）；脊柱CT（椎体小关节骨折、碎片突入椎管、脊髓点片状挫伤出血，严重时脊髓密度低外形肿胀、蛛网膜下腔受压闭塞）；脊髓MRI（清楚显示脊髓受压移位、挫伤出血、水肿，对脊髓损伤有确诊意义，急性期应力争做）。\n诊断：明确外伤病史+特征性临床表现不难，明确损伤部位程度需仔细神经系统查体和必要辅助检查。\n治疗：①外伤早期一定制动——怀疑脊柱骨折切不可站立坐起（必要时镇静剂），搬运禁忌一人抱起或两人对拾（使脊椎弯曲加重脊髓损伤），保持脊柱固定，最好用平板担架转运，头部牵引保持中间位置；②非手术治疗——椎体脱位闭合复位术+药物治疗（甘露醇、呋塞米、激素减轻急性期脊髓水肿；甲泼尼龙首次30mg/kg冲击疗法，后5.4mg/(kg·h)持续泵维24小时；血管扩张药或纳洛酮减轻脊髓内微血管痉挛防止继发性脊髓中央缺血坏死；高压氧改善脊髓缺氧缺血）；③手术治疗——目的解除脊髓压迫、防治继发性损伤；适用于X线已明确椎骨脱位和骨折片突入椎管内者、伤后神经症状进行性加重者、伤后脊髓功能部分恢复但后期改善停止或加重者；脊椎脱位超过椎体1/2以上+临床表现完全性损伤时手术为相对适应证；④后期治疗——防治压疮、泌尿系统感染和肢体挛缩，康复治疗加强肢体被动性功能锻炼。' },
];

const CARDS_CH31 = [
{ m: '31A', q: '下丘脑分泌的激素及其主要作用？', a: '下丘脑位于第三脑室周围和底部，是自主神经和内分泌的高级整合中枢，是下丘脑-垂体-靶腺系统的控制系统。\n已知下丘脑激素：GHRH（生长激素释放激素）、GHRIH/SS（生长抑素）、TRH（促甲状腺素释放激素）、CRH（促肾上腺皮质激素释放激素）、LHRH/GnRH（促性腺激素释放激素）、AVP（精氨酸升压素）、OXT（催产素）。\nGHRH：44肽，基因20q11.23；神经元位于弓状核和腹内侧核，经门脉进入垂体前叶促进生长细胞生成增殖及GH分泌；受GH负反馈，需生长抑素共同抑制；α-肾上腺素能激动剂刺激GHRH分泌。\n生长抑素SS（SRIH）：14肽和28肽（基因位于20号染色体，一个mRNA不同拼接生成）；下丘脑含量最高，抑制GH、TSH和胰岛素分泌，与GHRH共同调节GH；胰岛D细胞、胃肠道、胸腺等广泛分布，多旁分泌起作用。\nTRH：3肽（焦谷酰胺-组氨酸-脯氨酸）；主要分泌于室旁核；促使TSH合成分泌，TSH作用于甲状腺形成下丘脑-垂体-甲状腺轴；T3、T4对TRH和TSH有负反馈；TRH还刺激PRL分泌（经PIT-1中介）。\nCRH：41肽，基因8p；神经元多位于室旁核小细胞区，与AVP共存；促进ACTH合成分泌；CRH-ACTH-肾上腺轴有昼夜节律；受皮质醇长反馈和ACTH短反馈调节；低血糖和神经肽Y刺激CRH释放；CRH对GH分泌有抑制作用。\nGnRH：酰胺化10肽，基因8号染色体；神经元分布广泛（下丘脑前部、中间部、底部、弓状核、视前隔区）；促进促性腺激素分泌；以脉冲式释放促使垂体促性腺激素脉冲分泌——GnRH是排卵前LH按时间精确分泌的关键；对LH主要正调节。\nAVP（抗利尿激素）：视上核和室旁核合成，经轴索达垂体后叶储存分泌；对渗透压改变非常敏感——血浆渗透压<1%变化即引起分泌改变，释放阈值280mOsm/kg，渗透压升高1% AVP约增加0.9pmol/L可使尿渗透压增加200mOsm/kg；血容量减少8%刺激AVP释放（心房/颈动脉窦/主动脉弓压力感受器经迷走神经传入）；受体V1（血管收缩、肝糖原分解）、V1b/V3（垂体促肾上腺细胞增强ACTH分泌）、V2（肾小管集合管——激活腺苷酸环化酶cAMP，水通道Aquaporin2插入，水重吸收浓缩尿）。\n催产素OXT：与AVP同为9肽（仅第3、8位氨基酸不同），基因同在20p13转录方向相反；刺激子宫收缩促进胎儿产出，刺激乳腺肌上皮细胞收缩使乳汁流出；排卵、分娩及哺乳时增高；乙酰胆碱、多巴胺、疼痛、体温升高可抑制其释放；近年证明直接作用于催乳素细胞刺激PRL释放。' },
{ m: '31A', q: '腺垂体前叶激素（GH、TSH、ACTH、促性腺激素、PRL）的要点？', a: '①人生长激素hGH：垂体前叶嗜碱性粒细胞合成，垂体分泌量最大的激素；191个氨基酸单链蛋白，22kD；基因簇位于17q22~24（GH1为正常基因）；自然分泌脉冲式（约每2~3小时一峰值），夜间入睡后分泌增高，与睡眠深度有关（Ⅲ、Ⅳ期睡眠相达高峰）；高血糖抑制、低血糖刺激分泌；可乐定、左旋多巴、精氨酸可刺激GH分泌（用于GH激发试验）；大部分功能经IGF-1介导（GH与受体结合经JAK-2激活引起IGF-1基因转录）。\n②IGF系统：GH是调节血IGF-1和IGFBP-3浓度的最主要因素；IGF-1（碱性肽71氨基酸，基因12q23.2）广泛分布，肝脏是最大合成场所；血循环中90%IGF-1与IGFBP结合（仅1%游离），IGFBP-3是出生后血清中最大量结合蛋白；IGF-1和IGFBP-3水平相对稳定、无明显脉冲和昼夜节律变化，能较好反映内源性GH分泌状态。\n③TSH：嗜碱性促甲状腺细胞分泌的糖蛋白，α亚单位与LH、FSH相同，β亚单位各异（发挥生理功能主要成分）；刺激甲状腺滤泡细胞增生和甲状腺激素合成；受体14q31.1，G蛋白偶联受体，激活腺苷酸环化酶cAMP第二信使；受TRH严格控制，T3、T4负反馈（T3在垂体形成更重要）；TSH受体抗体（IgG）激活受体增加甲状腺激素分泌（Graves病机制）。\n④ACTH：嗜碱性粒细胞分泌，前体为阿黑皮素原POMC（经蛋白水解产生39肽ACTH、β-内啡肽、促脂素LPH、γ-MSH等）；下丘脑CRH控制分泌，室旁核分泌的AVP也是促肾上腺皮质激素释放因子可直接刺激ACTH；作用于肾上腺皮质促进皮质激素合成；糖皮质激素对ACTH和CRH有反馈作用构成CRH-ACTH-肾上腺轴；应激时激活使血浆皮质醇增高；分泌有昼夜节律——早晨8点最高，夜晚10点至凌晨2点最低。\n⑤促性腺激素LH、FSH：嗜碱性促性腺细胞分泌；LH作用于睾丸间质细胞（Leydig细胞）促进睾酮合成分泌，FSH作用于睾丸滋养细胞（Sertoli细胞）促进精原细胞分化增殖精子生成；FSH刺激卵巢滤泡早期生长；性激素负反馈主要作用于垂体；FSH刺激产生的抑制素抑制FSH分泌、活化素刺激FSH分泌（活化素在睾丸有旁分泌作用促进睾酮产生）。\n⑥催乳素PRL：垂体前叶嗜酸性催乳细胞分泌，199氨基酸单链肽，基因6p22.3，结构与GH相似；分泌由抑制因子和释放因子控制——吸吮乳头是最强刺激（催产素和VIP有生理意义），多巴胺为主要的PRL抑制因子（经D2受体抑制腺苷酸环化酶）；脉冲性分泌，睡眠后即将清醒前血中浓度最高；作用于乳腺促进乳腺增生分泌乳汁并维持泌乳；大量PRL分泌时抑制卵巢孕酮合成导致月经失调；对免疫功能有上调作用。' },
{ m: '31A', q: '下丘脑-垂体-IGF-1生长轴相关基因缺陷（按环节）有哪些？', a: '①垂体发育相关转录因子：HESX1、SOX2、SOX3、LHX3、LHX4、PITX1、PITX2（早期）及PROP1、POU1F1（晚期）；异常除生长障碍还伴其他发育异常（视中隔发育不良/眼部缺陷——HESX1、OTX2、SOX2、SOX3；骨骼缺陷——LHX3、PITX2；智力缺陷——SOX3、SOX2）；GLI2（Shh通路，突变致IGHD或CPHD、垂体后叶异位、多指畸形、面中部发育不良如腭裂）、FGF8、FGFR1、PROKR2、PROK2（调控腺垂体、晶状体和嗅觉基板）、ARNT2（多种垂体激素缺乏+垂体发育不良+胼胝体薄）、IGSF1（X连锁，男性先天性中枢性甲减、巨睾症）。POU1F1/PIT-1（3p11）突变致GH、TSH、PRL缺乏；PROP1（5q35）突变致GH、TSH、PRL缺乏+促性腺激素缺乏。\n②GH合成分泌相关：GH1基因缺陷——纯合/复合杂合变异致IGHD IA型（常隐，GH完全缺乏，初期对GH治疗反应良好但易产生抗体）；GH1杂合变异致IGHDⅡ型（常显）；Xq22 BTK基因变异致IGHDⅢ型（伴免疫球蛋白缺乏）；GH1突变与GH生物失活有关（GH水平正常或升高但出现IGHD类似表型）。\n③GHSR（Ghrelin受体）：突变可致ISS、GHD、CDGP（体质性青春期生长延迟）。\n④GH不敏感（GHR）：GHR纯合/复合杂合突变致完全性GH不敏感即Laron综合征（显著矮小、GH升高或正常、IGF-1及IGFBP-3低、外源GH不能刺激IGF-1升高）；已发现70余种GHR突变；杂合突变致不同程度GH不敏感。\n⑤IGF1/IGF1R：IGF1基因缺失或纯合功能丧失突变——严重宫内及生后生长障碍、小头畸形、智力障碍，IGF-1显著降低、GH正常或升高；IGF1R杂合突变/缺失致IGF-1不敏感综合征（宫内生长迟缓、生后生长障碍、小头畸形，IGF-1正常或升高）。IGF2：父源IGF2基因突变或表达不足致生长受限；约60%Silver-Russell综合征由11p15.5印记区域父源性H19/IGF2 IG-DMR低甲基化、父源IGF2表达减少所致（SRS典型表现：产前开始的身材矮小、头相对大、前额隆起、三角脸、小下颌、小指内弯、躯体不对称、喂养困难、BMI低，IGF-1和IGFBP-3相对较高提示部分IGF-1抵抗）。\n⑥STAT5B：GHR下游信号主要蛋白，纯合失活突变致典型GH不敏感（显著矮小伴免疫缺陷——湿疹和慢性肺病）；杂合突变身高轻度降低。\n⑦三聚体缺陷（IGF、ALS、PAPP-A2）：IGF1循环中与IGFBP3和不稳定酸亚基ALS结合成三聚体延长半衰期；IGFALS双等位基因功能丧失突变——轻度矮身材、性发育迟缓、IGF-1和IGFBP-3升高；PAPPA2（负责IGFBP3和IGFBP5蛋白水解释放IGF1）基因缺失——矮身材、IGF-1和IGFBP-3明显升高但游离IGF-1低、骨龄与实际年龄相称，可伴小头、长骨变薄、骨密度低、胰岛素抵抗。' },
