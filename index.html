{ m: '28A', q: '新生儿及婴幼儿肾功能特点：GFR、尿浓缩能力、保钾能力有何特点？少尿、无尿、多尿的诊断标准？新生儿排尿时间特点？正常尿蛋白排泄量与蛋白尿、镜下血尿的判定标准？', a: '新生儿/婴幼儿肾功能：\n①GFR：新生儿仅为成人的1/4（生后7天约35ml/(min·1.73m2)），1~2岁达成人水平；原因是出入球小动脉阻力高、滤过膜通透性低、血压低、滤过面积小（约为成人1/8）。\n②尿浓缩能力差：30~35周早产儿最大尿渗量仅360mOsm/L，成熟儿380~800，1.5岁才达成人水平，故新生儿易脱水、水肿。\n③保钾能力差：即使严重缺钾时，尿中每天仍排钾5mmol以上。\n尿量标准：\n①少尿——<0.8ml/(kg·h)，或学龄儿童<400ml/24h、学龄前<300ml、婴幼儿<200ml；②无尿——<30~50ml/24h；③多尿——>3ml/(kg·h)或>2000ml/24h（14岁以上>2.5L）。\n排尿：92%新生儿生后24小时内、99%生后48小时内开始排尿；72小时仍无排尿应考虑泌尿道或肾脏疾患。\n蛋白尿判定：正常尿蛋白≤4mg/(m2·h)或≤100mg/(m2·d)；尿蛋白>150mg/24h或>4mg/(m2·h)、定性阳性即蛋白尿；随意尿蛋白/肌酐比值(UP/Cr)应<0.2。\n镜下血尿：离心沉淀后镜检红细胞≥3/HPF；肉眼血尿指出血量≥1ml/L（每升尿含血1ml即现淡红色）。' },
{ m: '28A', q: '蛋白尿的分类（生理性与病理性）？选择性蛋白尿指数（SPI）的计算与临床意义？各型管型的临床意义（红细胞管型、白细胞管型、上皮细胞管型、颗粒管型、蜡样管型、脂肪管型、宽大管型）？尿蛋白定性方法的优选？', a: '蛋白尿分类：\n①生理性（无症状性）蛋白尿：功能性蛋白尿——剧烈运动、发热、低温、精神紧张等所致暂时性轻度蛋白尿，定性一般不超过(+)、定量<0.5g/24h，诱因消失后尿蛋白迅速消失；体位性（直立性）蛋白尿——卧床时阴性、起床活动后出现（可达+++）、平卧后又转阴，常见于青少年。\n②病理性蛋白尿：肾前性（溢出性）——血中大量低分子蛋白经肾小球溢出，如本-周蛋白（BJP，多发性骨髓瘤）、肌红蛋白、血红蛋白；肾性——肾小球或肾小管疾病；肾后性。\n选择性蛋白尿指数：SPI=（尿IgG/血IgG）÷（尿转铁蛋白/血转铁蛋白）。SPI≤0.1为高选择性（病变轻微，如微小病变性肾病，对激素和免疫抑制剂疗效好）；0.1~0.2为中度选择性；>0.2为非选择性（病变严重，如膜性肾病后期、膜增殖性肾炎、局灶节段性肾小球硬化，对激素反应差）。\n管型意义：\n①红细胞管型——提示肾小球出血：急性肾小球肾炎、紫癜性肾炎、狼疮肾炎、肾梗死、肾静脉血栓；\n②白细胞管型——肾脏细菌性/免疫性炎症：急性肾盂肾炎、急性肾小球肾炎、间质性肾炎、狼疮性肾炎；\n③肾小管上皮细胞管型——肾小管坏死：急性肾小球肾炎极期、急性肾衰、肾移植排异、重金属/药物性肾小管坏死；\n④颗粒管型——各种肾实质病变；\n⑤蜡样管型——局部肾单位长期阻塞、病变严重、预后较差：重症急性肾炎、急进性肾炎、慢性肾炎晚期、肾衰竭；\n⑥脂肪管型——肾病综合征、慢性肾炎肾病期；\n⑦宽大管型（肾衰竭管型）——预后不良，见于慢性肾功能不全晚期。\n尿蛋白定性：200g/L磺基水杨酸法是首选方法（灵敏，可检出0.05~0.1g/L）；50%加热醋酸法是参考方法；肾脏病患儿尿蛋白检查不能用干化学试带法（对白蛋白敏感、对球蛋白不敏感，大剂量青霉素可假阴性）。' },
{ m: '28A', q: '早期肾损伤的检测标志物（肾小球标志物与肾小管标志物各有哪些）？补体检测在肾小球疾病中的意义（急性链球菌感染后肾炎、膜增殖性肾炎、乙肝相关性肾炎）？为什么BUN不能用于早期肾损害评估？Schwartz公式各年龄K值？肾活检的适应证、禁忌证与主要并发症？', a: '早期肾损伤标志物：\n①肾小球标志物：微量白蛋白尿（mAlb，30~300mg/24h，糖尿病肾病、高血压肾病早期，临床蛋白尿之前出现）；尿转铁蛋白；尿IgG（反映滤过膜基膜受损程度）。\n②肾小管标志物：尿α1-微球蛋白（低分子量蛋白中首选指标，已取代β2-微球蛋白）；β2-微球蛋白（酸性尿中迅速降解）；视黄醇结合蛋白（RBP）；尿NAG酶（溶酶体酶，反映肾小管活动性损伤最灵敏，急性肾衰时可升高达正常40倍，肾移植排异前1~3天即增高，但环孢素肾毒性可干扰）；溶菌酶。\n补体意义：①急性链球菌感染后肾炎——约90%病例早期总补体CH50及C3下降，6~8周恢复正常；②膜增殖性肾炎——约68%病例持续性低补体血症，可检出C3肾炎因子（提示替代途径活化）；③乙型肝炎相关性肾炎——约1/2患儿C3下降。\nBUN的局限：只有当GFR下降到正常的1/2时尿素才开始升高，且受尿流量、蛋白入量、肝功能、感染、利尿剂等影响，故不能用于早期或轻度肾小球功能受损的评估。\nSchwartz公式：eGFR=K×身高(cm)/Scr(mg/dl)。K值——1岁以内足月儿0.45、1岁以内出生体重<2.5kg婴儿0.33、儿童及青春期女孩0.55、青春期男孩0.7；酶法测Scr的升级版：GFR=0.413×身高/Scr。校正Ccr正常80~120ml/(min·1.73m2)。\n肾活检：\n①适应证——孤立性血尿（变形红细胞或红细胞管型提示肾小球性）、持续性孤立蛋白尿、肾炎型或激素治疗无效的肾病综合征、急进性肾小球肾炎（原则上应活检）、急性肾衰竭（除外肾前肾后因素仍原因不明者）、继发性或遗传性肾脏病明确诊断、肾移植后排异或肾功能下降原因不明。\n②禁忌证——出血性疾病、抗凝治疗、肾血管异常、未控制的高血压、孤立肾、异位肾、马蹄肾；肾内肿瘤、大囊肿、脓肿、肾盂肾炎亦禁忌。\n③并发症——镜下血尿几乎100%（1~2天）；肉眼血尿<5%（1~3天多消失）；肾周血肿48%~85%（多无临床症状）；动静脉瘘44%~75%（多在数月内自愈）。' },

{ m: '28B', q: '肾不发育：先天性单肾缺如的临床表现与合并畸形？双侧肾不发育（Potter综合征）的特点？肾发育不全的定义与分型（单纯性、节段性、先天性肾单位减少伴代偿肥大）？', a: '肾不发育：\n①先天性单肾缺如——临床多无症状，发病率约1:1500~1:1800，男:女=1.8:1，左侧多见；半数以上伴同侧输尿管缺如或闭锁；10%~15%男性和25%~50%女性合并生殖器畸形。B超和静脉尿路造影显示一侧肾缺如、对侧肾代偿性增大。最大危险是孤立肾因病变或外伤被误切，故肾切除术前必须查明对侧肾情况。\n②双侧肾不发育（Potter综合征）——常合并Potter面容（睑裂间距大、鼻宽广、耳大低位、小下颌），多见于男性、早产、低体重儿，约40%死产；常合并肺发育不全而呼吸困难，常伴心血管（30%）、胃肠道（25%）畸形；即使活产，生后数日即死于肾衰竭。\n肾发育不全（肾体积小50%以上，肾单位数目减少，肾小盏少于5个）：\n①单纯肾发育不全——90%以上散发，多表现为双侧或一侧发育不全伴对侧不发育→肾功能不全、脱水、生长发育迟滞，是小儿慢性肾功能不全最常见原因之一；单侧者常因高血压就诊。\n②节段性肾发育不全——少见，多见于女性，小肾合并节段性皮髓质发育不全，多以严重高血压为主要表现，50%有视网膜病变。\n③先天性肾单位减少伴代偿肥大（oligomeganephronia）——双侧，多见于男性，肾单位仅为正常的1/5但肾小球体积增大7~12倍；表现为进行性肾功能不全、多尿、烦渴、生长停滞，多进展至尿毒症，是肾移植的对象。' },
{ m: '28B', q: '肾囊性病变的分类？多房性肾囊性变（新生儿最常见腹部肿物）的特点与治疗？多囊肾两型的遗传方式、临床表现与预后？', a: '肾囊性病变分类：多囊肾（常隐ARPKD、常显ADPKD）、髓质囊肿（少年性肾单位肾消耗病、髓质囊性病、髓质海绵肾）、肾小球囊性病、多房囊性肾发育不良、单纯性肾囊肿、肾多房性囊肿、获得性囊性肾病、综合征合并囊性肾病（结节性硬化、Meckel综合征、Von Hippel-Lindau病）。\n多房性肾囊性变：\n①新生儿及小婴儿最常见的腹部肿物，多单侧、无家族倾向；是胎儿早期输尿管梗阻的最严重后果，常伴输尿管缺如/闭锁；\n②腹部肿物为最常见症状，透光试验阳性；静脉肾盂造影患侧不显影，大剂量造影剂早期摄片可见肥皂泡样肾形态；\n③双侧及孤立肾病变无法治疗；单侧可做肾切除，但必须先了解对侧肾脏情况并首先解除对侧梗阻。\n多囊肾：\n①婴儿型多囊肾（ARPKD）——常染色体隐性遗传，均伴肝脏病变；双肾显著增大、切面海绵状；分四个临床亚型：围产期型（90%以上肾组织囊性变，多在围产期或生后3个月内死亡）、新生儿型（约60%肾单位异常，多于生后6个月内死于尿毒症）、婴儿型（25%~50%肾单位囊性变，儿童期出现肝功能衰竭）、童年型（肾囊性变<10%，肝病变为主，10~20岁发病）；\n②成人型多囊肾（ADPKD）——常染色体显性遗传，16号染色体短臂，可用DNA探针产前诊断；约1/3合并肝囊肿（不引起功能障碍），儿童期引起肾衰竭者罕见，治疗主要是处理并发症（高血压、心衰、肾衰）。' },
{ m: '28B', q: '异位肾的类型（盆腔肾、胸内肾、交叉异位肾）？蹄铁形肾的病理与临床表现？先天性肾盂输尿管连接部梗阻（UPJO）：病因、临床表现、诊断与治疗？', a: '异位肾：\n①盆腔肾——占异位肾的60%，因肾上升障碍，肾小呈扁平球形、输尿管短；约10%为孤立肾；可因梗阻、结石、感染产生症状；\n②胸内肾——极少见，约半数合并横膈疝，多无症状，胸片偶然发现；\n③交叉异位肾——一侧肾跨过中线移至对侧，分融合型与非融合型；多无症状或表现为下腹肿物及压迫症状。\n蹄铁形肾（最常见的融合肾）：\n①约90%为两肾下极在脊柱前（腹主动脉及下腔静脉之前）融合，融合部称峡部；\n②输尿管越过峡部前面下行，引流不畅，易并发肾积水、感染或结石；\n③主要症状为神经丛或输尿管受压所致脐周痛或胃肠道症状；\n④诊断：静脉尿路造影示肾长轴延长线向尾侧汇合（与正常相反）；无症状不治疗，有压迫症状可切断峡部。\nUPJO（先天性肾积水最常见的原因）：\n①病因——连接部狭窄最多见（胶原纤维介于肌细胞间阻断蠕动电活动传导）；其他：肾下极异位血管或纤维索压迫、高位输尿管开口、息肉、瓣膜；\n②表现——儿童以腹痛（似胃肠道疾患）、血尿、感染多见，婴儿以腹部肿物为主；大量饮水后出现腰痛是特点；多见于左侧、婴幼儿及男性；\n③诊断——静脉泌尿系造影见肾盏肾盂扩张、患侧输尿管不显影；超声示肾积水而输尿管不扩张；MRI水成像清楚显示梗阻部位；核素扫描了解分肾功能、利尿肾图鉴别机械性梗阻；\n④治疗——离断性肾盂成形术（Anderson-Hynes术式）为经典术式，成功率95%~98%以上；患肾功能<10%或并发肾发育异常时行肾切除；术后已扩张的肾盂肾盏仅约10%能恢复正常，但临床症状消失即为治愈。' },
{ m: '28B', q: '重肾双输尿管的临床特点与Weigert-Meyer定律？输尿管口异位的临床表现（男女差异）？输尿管膨出的分型与表现？巨输尿管的分类（三类）？', a: '重肾双输尿管：\n①上肾部小（仅占全肾1/4~1/3），双输尿管可全长分开或Y形汇合；尸检约1%，造影约2%~3%；常合并输尿管口异位、输尿管膨出；\n②Weigert-Meyer定律：副输尿管芽位于头端→引流上肾部，开口靠内、靠下（常异位/膨出）；下肾部输尿管开口靠外、靠上（常反流）；\n③上半肾输尿管口异位→正常排尿+尿间滴尿；上半肾输尿管膨出→排尿困难、尿道口肿物脱出或感染。\n输尿管口异位：\n①约80%患侧为重复肾双输尿管；异位口常在括约肌控制之外；\n②女性——异位口位于尿道远端、阴道、子宫颈、前庭，特点为正常分次排尿后仍有持续/间断滴尿（站立活动时明显，入睡后外阴不潮湿）；\n③男性——异位口位于后尿道（括约肌近端）、精囊、输精管、附睾，仍在括约肌控制之内，多无滴尿现象，可表现为附睾炎或精囊增大（肛门指诊触及）；\n④治疗：来自重肾上肾部且功能严重丧失者行上肾部（半肾）切除；来自单一肾盂者做防反流的输尿管膀胱再吻合。\n输尿管膨出：\n①输尿管下端各层形成膨出突入膀胱，外层为膀胱黏膜、内层为输尿管黏膜；分单纯型（成人型，较小）与异位型（较大，并发重肾双输尿管，开口于膀胱颈或后尿道）；\n②表现——以尿路梗阻并发感染为主：反复发热、脓尿、排尿困难甚至尿潴留；女孩排尿时部分膨出可脱垂至尿道口外；\n③诊断——婴幼儿尤其女性反复泌尿系感染+排尿困难或尿道口可复性小肿物脱出者应行静脉尿路造影。\n巨输尿管（膀胱及其出口正常）：\n①原发性巨输尿管——无机械性梗阻，远端扩张而无伸长屈曲，多见于男性，左侧多见；\n②反流性巨输尿管——高度膀胱输尿管反流所致，原则上应早期做防反流的输尿管膀胱再吻合术；\n③机械梗阻性巨输尿管——远端狭窄段，用点滴静脉肾盂造影及逆行输尿管造影诊断。' },
{ m: '28C', q: '脐尿管畸形的四种类型？膀胱憩室的病因与表现？膀胱外翻的临床特点与治疗原则？后尿道瓣膜：分型、临床表现、并发膀胱输尿管反流的比例、治疗与预后？前尿道瓣膜的特点？', a: '脐尿管畸形四型：脐尿管瘘（脐部漏尿）、脐尿管囊肿（两端闭锁中间囊腔，脐下正中深部肿物）、脐尿管窦道（远端未闭残留，脐部炎症渗出）、脐尿管憩室（近段未闭，偶然发现）。\n膀胱憩室：膀胱黏膜自逼尿肌薄弱处向外膨出；先天性多见于男性、单发、位于输尿管口附近；憩室内输尿管口可致反流；排尿性膀胱造影见排尿时憩室显著变大、排尿终了内容回入膀胱（假性剩余尿）；治疗主要解除下尿路梗阻，巨大憩室或输尿管开口于憩室内者须切除憩室并抗反流移植。\n膀胱外翻：\n①约3万~5万出生儿中1例，男性多；下腹壁、膀胱前壁及尿道背壁缺失，可直接看到外翻的膀胱后壁和三角区；\n②合并耻骨联合分离（摇摆步态）、尿道上裂、外生殖器畸形；极易发生膀胱输尿管反流（输尿管几乎无膀胱壁内段）；\n③治疗目的：修复腹壁及膀胱、保存肾功能、控制排尿、修复外生殖器；生后72小时内可不做髂骨截骨只做膀胱内翻缝合，超过72小时或耻骨分离过宽需骨盆截骨+膀胱内翻缝合；应尽早修复膀胱以增加日后获得排尿控制的机会。\n后尿道瓣膜（男性儿童先天性下尿路梗阻最常见疾病）：\n①Young分型——I型：瓣膜起自精阜远端向下向前至尿道前壁，占梗阻瓣膜的95%；II型：自精阜近端延至膀胱颈，不造成梗阻，无临床意义；III型：虹膜样，罕见；\n②临床表现——新生儿期排尿滴沥、费力甚至急性尿潴留、胀大膀胱；可伴尿性腹水（最多见新生儿腹水原因）；婴儿期以尿路败血症、生长发育迟滞就诊；\n③40%~60%并发膀胱输尿管反流；确诊靠排尿性膀胱尿道造影；\n④治疗——先纠正水电解质失衡、控制感染、引流下尿路，然后经尿道电灼瓣膜；小婴儿尿道细小者可先做膀胱造口；\n⑤预后不良——仅约10%患儿青春期后可有正常的肾功能和膀胱功能，多因胎儿期梗阻致肾发育不良、解除梗阻后持续下尿路功能障碍及反流肾瘢痕形成。\n前尿道瓣膜：\n①位于阴茎阴囊交界部尿道腹侧，发病率约为后尿道瓣膜的1/6；\n②表现为排尿困难、尿滴沥、膀胱剩余尿；排尿性膀胱尿道造影见阴茎根部以上尿道扩张；\n③经内镜电灼切开瓣膜，治疗及时预后一般较后尿道瓣膜好。' },
{ m: '28C', q: '尿道下裂：发病率、分型、病因与手术时机？尿道上裂的分型与特点？Prune-Belly综合征（腹肌发育缺陷三联症）的组成与处理原则？', a: '尿道下裂：\n①小儿泌尿生殖系最多见的畸形之一，约每125~250出生男婴中1例，近年发病率有增高趋势；女性极罕见；\n②病因多因素——胎儿睾丸雄激素产生异常、靶组织对雄激素敏感性受限、5α-还原酶缺陷或雄激素受体缺陷等；\n③四型：阴茎头型（尿道口位于包皮系带部，最常见）、阴茎型（尿道口位于阴茎体腹侧）、阴茎阴囊型（尿道口位于阴茎根部与阴囊交界处，阴囊对裂）、会阴型（尿道口位于会阴部，外生殖器酷似女性，可合并隐睾呈男性假两性畸形，常合并肛门直肠畸形）；\n④典型外观：阴茎向腹侧弯曲、腹侧无包皮、背侧包皮呈帽状覆盖；\n⑤危害：不能站立排尿、痛性勃起、成年后不能性生活，必须手术；手术基本要求是充分矫正阴茎下弯+尿道口位置正常，应学龄前完成，现多主张1岁左右（Duckett主张生后3~8个月）手术。\n尿道上裂：\n①尿道背壁部分或全部缺如，尿道开口于阴茎背面，膀胱外翻基本都并发尿道上裂；男女之比约5:1；\n②男性三型：阴茎头型（最少见，多无尿失禁）、阴茎体型（部分尿失禁）、完全型（耻骨联合部，膀胱直接向外开口，有尿失禁）；\n③手术于2~5岁进行，目的是矫正阴茎上弯、延长阴茎、重建尿道和控制排尿；阴茎短小可试用1~2个疗程绒毛膜促性腺激素。\nPrune-Belly综合征（腹肌发育缺陷综合征）：\n①三联症：腹肌缺损+尿路畸形（输尿管扩张迂曲、膀胱壁厚、前列腺部尿道梭形扩张/巨尿道）+双侧隐睾；约40000初生儿中1例；\n②输尿管肌纤维被纤维组织代替，蠕动不良，输尿管成形术不能消除反流；\n③死产和新生儿期死亡者20%源于肾发育不良和肺发育不全；\n④处理——新生儿期首先观察；仅在感染药物不能控制时做膀胱造口或肾盂输尿管造瘘；一般保守观察（腹壁折叠术不能改善尿路引流）；隐睾因位置高难于下降固定，新生儿期手术者日后较易成功。' },
{ m: '28C', q: '隐睾：定义、发生率变化规律、诊断（滑动睾丸/睾丸上缩的鉴别、未触及睾丸的定位）与治疗时机？隐睾与睾丸恶变的关系？鞘膜积液的分类与转归？小阴唇粘连、尿道黏膜脱垂、处女膜无孔的临床特点？', a: '隐睾：\n①定义——阴囊内无睾丸，包括睾丸缺如、睾丸异位及睾丸下降不全；\n②发生率——出生体重<900g的早产儿约100%，足月新生儿约4%，1岁约1%，成人约0.7%；\n③滑动睾丸——可将睾丸推入阴囊但抬手后迅速回缩，按隐睾治疗；睾丸上缩——推入阴囊后不迅速回缩（提睾肌作用），不必治疗；\n④未触及睾丸（约占隐睾20%）的定位——约50%位于腹股沟部，20%~25%位于腹腔内，15%位于腹股沟外环下，10%睾丸缺如；双侧不能触及者可行hCG激素试验（hCG后睾酮上升提示有睾丸）；腹腔镜检查对摸不到的隐睾最有意义；\n⑤治疗——生后6个月仍未下降则自行下降机会极少，应尽早治疗；1岁内可试行激素（hCG）治疗但效果不确切，无效或就诊年龄超过1岁者应行睾丸固定术；\n⑥恶变——腹腔内睾丸恶变风险较其他部位高6倍；睾丸固定时年龄越大恶变风险越大，故应早期手术也便于检查。\n鞘膜积液（腹膜鞘状突闭合不全）：\n①精索鞘膜积液——精索部长圆形光滑肿物，透光试验阳性，睾丸可于肿物下端触及；\n②睾丸鞘膜积液——阴囊内光滑肿物，透光阳性，多不能触及睾丸；\n③交通性鞘膜积液——鞘状突完全开放，平卧挤压肿物可完全消失、起立后徐徐出现（与腹股沟斜疝不同点：通路狭小，肠袢不能进入；通路大即为斜疝）；\n④新生儿和小婴儿有自愈可能，随诊至1岁以后决定是否手术；手术重点是结扎未闭合的鞘状突。\n女性外阴畸形：\n①小阴唇粘连——多见于2岁以下，外阴可见两侧小阴唇中线粘连成膜状，前端近阴蒂处留小孔排尿；治疗简单，一般无麻醉下用蚊氏钳轻柔分开，涂抗生素软膏；\n②尿道黏膜脱垂——尿道口环形红色肿物、中央有一小孔排尿，触之易出血，多见于婴幼儿和8~12岁女孩；导尿管自此可插入膀胱即可确诊；症状轻微可保守（坐浴、外用雌激素/抗生素）；\n③处女膜无孔（处女膜闭锁）——青春期前多无症状；青春期表现为第二性征发育正常但无月经初潮、周期性下腹痛，阴道口膨出紫蓝色球状肿块；针穿刺抽出紫褐色黏稠血液可确诊；治疗为处女膜十字切开排出积血。' },

{ m: '28D', q: '尿路梗阻：上下尿路梗阻的划分及各自对肾功能的影响特点？肾积水的病理生理与病程分期？两侧输尿管完全阻塞时尿毒症发生的时间与可恢复性？尿路梗阻的常见病因（尿道、膀胱、输尿管、肾）？诊断方法与排尿性膀胱尿道造影的要点？', a: '上下尿路梗阻：\n①输尿管口以上为上尿路梗阻——梗阻距肾近，肾积水发展快，但仅患侧受累，对侧肾代偿性增大，总肾功能可正常；\n②膀胱及以下为下尿路梗阻——膀胱作为缓冲区域，肾积水发展慢，但双侧肾受累、总肾功能低下；膀胱肌束代偿增厚→小梁及假性憩室形成。\n肾积水病理生理：\n①梗阻→肾内压升高→肾盏肾盂尿液排出障碍、肾盂扩张→肾曲管内压升高影响尿的分泌→压迫附近血管引起肾实质贫血性萎缩；\n②病程三期：肾盂扩大、肾盂壁变薄→肾乳头萎缩（肾盂造影杯形肾小盏变平向外凸出）→肾实质进行性萎缩变薄；肾内型肾盂者实质萎缩更早更严重；\n③部分尿液可经肾盂淋巴管、肾盂静脉反流，稍降低管内压力。\n两侧输尿管完全阻塞：尿毒症常在3天内发生；如梗阻在8天内消除，肾功能常可恢复。\n常见病因：\n①尿道——狭窄（创伤/炎症，可在包皮口、尿道口或尿道）、先天性前/后尿道瓣膜、前尿道憩室、尿道结石；\n②膀胱及膀胱颈部——神经性膀胱功能障碍较常见，膀胱憩室、重复膀胱、结石、肿瘤；女童重复肾上肾单位的输尿管膨出可造成膀胱出口梗阻；\n③输尿管——三个解剖狭窄部位（起始部、壁内段、跨越髂血管处）常出现先天性狭窄；结石、盆腔肿瘤压迫；\n④肾及肾盂——最多见肾盂输尿管连接部先天性狭窄，也可因瓣膜、异位血管压迫或息肉造成。\n诊断：\n①静脉肾盂造影是主要方法（造影剂剂量：新生儿8~10ml、<6个月10~12ml、6~12个月12~15ml）；\n②超声可准确定位：输尿管近端梗阻→输尿管不扩张；下尿路梗阻/远端梗阻/反流→输尿管扩张；\n③肾核素扫描了解分肾功能；MRU清楚显示上尿路梗阻定位；尿流动力学对下尿路梗阻重要；\n④排尿性膀胱尿道造影是诊断儿童下尿路梗阻的必要检查——注意：排尿时多次摄影观察有无反流；膀胱充盈至相应正常容量（预期膀胱容量2~16岁=(年龄+2)×30ml）才能准确判断膀胱小梁；排尿后注意剩余尿量；斜位摄片清晰显示男性尿道全长。\n治疗：最理想是解除梗阻、改进或维持肾功能；危急或梗阻原因不能解除时在梗阻之上做尿液改道引流（肾造瘘、输尿管造口、膀胱造口），可同时抗感染。' },

{ m: '28E', q: '肾小球疾病的临床分类（2000年珠海会议）？原发性肾病综合征的诊断标准与四大特点（必备条件）？肾炎性肾病的四项诊断条件？激素效应分型（SSNS/SRNS/SDNS）与频复发的定义？各临床类型对应的常见病理类型？', a: '临床分类（分原发、继发、遗传三大类）：\n①原发性肾小球肾炎——急性肾炎（病程1年内）；急进性肾炎（数周至数月进展至肾衰）；迁延性肾炎（血尿/蛋白尿迁延1年或6个月以上，不伴肾功能不全或高血压）；慢性肾炎（病程>1年，伴肾功能不全和/或持续高血压，预后较差）；\n②原发性肾病综合征——四大特点：大量蛋白尿(定性+++~++++，定量>50mg/kg/24h)、低白蛋白血症（血浆白蛋白<25g/L）、高胆固醇血症（>5.72mmol/L即220mg/dl）、水肿（可轻可重）；其中以大量蛋白尿及低蛋白血症为诊断必备条件；\n③孤立性血尿或蛋白尿；\n④继发性：紫癜性肾炎、狼疮性肾炎、HBV相关肾炎、ANCA相关小血管炎等；\n⑤遗传性：先天性肾病综合征（生后3~6个月内发病，分芬兰型/法国型）、Alport综合征、家族性再发性血尿等。\n肾炎性肾病（除四大特征外具以下一项或以上）：①尿RBC>10/HP（2周内离心尿3次以上）并证实为肾小球性血尿；②反复或持续高血压（学龄儿童>130/90mmHg、学龄前>120/80mmHg，排除激素所致）；③持续性氮质血症（BUN>10.7mmol/L，排除血容量不足）；④血总补体或C3持续降低。\n激素效应分型：①激素敏感型（SSNS）——泼尼松足量治疗≤4周尿蛋白阴转；②激素耐药型（SRNS）——足量治疗>4周尿蛋白仍阳性；③激素依赖型（SDNS）——敏感但连续2次减量或停药2周内复发。频复发（FR）：6个月内复发≥2次，或1年内复发≥4次。\n临床-病理对应：急性肾炎→毛细血管内增生性肾炎；急进性肾炎→新月体性肾炎（>50%肾小球）；迁延性/慢性→膜增殖性等；肾病综合征激素敏感→微小病变（小儿占76%，成人仅20%）；激素不敏感→局灶节段性硬化等。\n小儿以微小病变为主，但转诊病例中因多为难治病例，微小病变比重下降、非微小病变增多。' },
{ m: '28E', q: '常见肾小球疾病病理类型的特点：微小病变、局灶节段性肾小球硬化（FSGS）、膜性肾病、膜增生性肾炎（含致密沉积物病）？肾小球疾病的免疫发病机制（循环免疫复合物、原位复合物、细胞免疫、补体旁路活化）？', a: '病理类型特点：\n①微小病变——光镜肾小球形态正常，电镜下上皮细胞弥漫性足突融合，免疫荧光多阴性；临床多表现为单纯性肾病，对激素敏感；\n②FSGS——光镜局灶节段性硬化/玻璃样变，电镜弥漫足突融合，免疫荧光IgM和C3局灶巨块状沉积；临床表现为激素不敏感的肾病综合征；\n③膜性肾病——光镜弥漫基膜增厚，电镜上皮下电子致密物+基膜钉突样改变（四期演变：上皮下沉积→钉突→钉突连接包绕沉积物→基膜不规则增厚虫蚀状），免疫荧光IgG、C3沿基膜细颗粒沉积；以蛋白尿或肾病综合征为主要表现；\n④膜增生性肾炎（系膜毛细血管性）——系膜细胞和基质增生+毛细血管基膜增厚；I型：系膜插入内皮下致基膜双轨状；II型（致密沉积物病DDD）：基膜内飘带样电子致密物沉积为诊断金标准，典型仅见C3沉积，与补体旁路活化有关；III型：内皮下+上皮下均有沉积；临床常伴血补体C3下降。\n免疫发病机制：\n①循环免疫复合物沉积——抗原稍多于抗体时形成可溶性免疫复合物沉积于肾，激活补体损伤肾小球；免疫荧光呈颗粒状沉积，血中可检出免疫复合物；\n②原位复合物——a.抗GBM型：抗体与肾小球固有抗原反应，免疫荧光沿基膜线形沉积，人类肾炎中约5%属此类，代表为Goodpasture综合征，血清可检出抗肾抗体；b.植入抗原：非肾小球抗原种植于肾小球后与抗体原位结合，荧光也呈颗粒状但血中无免疫复合物；\n③细胞免疫——T细胞介导（释放淋巴因子、细胞毒性T细胞杀伤），微小病变肾病可能与之有关；\n④补体旁路活化——血中C3因持续消耗而经常降低、肾小球内只有C3而无或极少Ig沉积，人类II型膜增生性肾炎可能属此类。\n治疗原则即针对各环节：去除抗原（清除感染灶）、抑制抗体（细胞毒药物）、激素阻断淋巴因子、抗凝（肝素）、抗血小板聚集（潘生丁、阿司匹林）、抑制前列腺素（消炎痛）、血浆置换去除免疫复合物和介质。' },
{ m: '28F', q: '急性链球菌感染后肾小球肾炎（APSGN）：致病菌型与前驱感染间歇期？发病机制与病理（电镜/免疫荧光特征）？典型临床表现与水肿性质？非典型表现三型？三大严重并发症的表现与处理原则？ASO与补体C3的变化规律？治疗要点？', a: '病因与间歇期：\n①A组β溶血性链球菌（GAS）感染后的免疫复合物性肾炎；呼吸道感染所致以12型为主（侵袭率约5%），皮肤感染以49型为主（侵袭率可达25%）；\n②前驱感染至发病的无症状间歇期：呼吸道感染约10天（6~14天），皮肤感染约20天（14~28天）；\n③3~8岁多见，2岁以下罕见，男女比约2:1。\n病理：弥漫性毛细血管内增生性肾小球肾炎；电镜特征为上皮下驼峰状电子致密沉积物；免疫荧光为IgG、C3和备解素沿毛细血管袢/系膜区弥漫颗粒状沉积。\n典型表现（前驱感染后经1~3周间歇期急性起病）：\n①水肿最常见——非凹陷性，初累及眼睑颜面晨起重（与肾病综合征的可凹性水肿不同），系GFR下降、水钠潴留所致；\n②血尿——半数肉眼血尿，酸性尿呈烟灰/棕红色，中性或碱性尿呈鲜红/洗肉水样；肉眼血尿1~2周转镜下血尿，镜下血尿持续1~3个月；\n③高血压30%~80%，为水钠潴留血容量扩大所致，1~2周随利尿消肿降至正常；\n④非典型三型——无症状亚临床型（仅C3降低，6~8周恢复）；肾外症状型（水肿高血压明显而尿改变轻微，C3呈典型急性期下降6~8周恢复）；具有肾病表现型。\n三大严重并发症（多发生于起病1~2周内）：\n①循环充血状态——气急、不能平卧、肺底湿啰音、肝大、奔马律；系血容量扩大所致而非心肌泵衰竭（心搏出量常增多、洋地黄类效果不佳而利尿剂有效）；近年发生率已降至2.4%；治疗重点是纠正水钠潴留，必要时酚妥拉明/硝普钠，控制不佳者透析；\n②高血压脑病——血压（尤其舒张压）急剧升高致脑水肿；剧烈头痛、频繁呕吐、视力障碍、惊厥昏迷；血压>140/90mmHg伴视力障碍、惊厥、昏迷三项之一即可诊断；治疗快速镇静、利尿、扩血管降压，紧急降压选硝普钠（1分钟见效，维持3~5分钟，需避光静滴，0.25μg/(kg·min)起）；\n③急性肾衰竭——急性肾炎死亡的主要原因（少尿无尿、BUN/Scr升高、高血钾、代谢性酸中毒）。\n实验室规律：\n①ASO阳性率50%~80%，感染后2~3周出现、3~5周达高峰，6个月内恢复正常；仅表示近期链球菌感染，与病情严重性无关；皮肤感染灶者阳性率低；\n②血补体C3病程早期明显下降，6~8周后恢复正常——此规律为本症典型表现；低补体血症持续8周以上应考虑膜增生性肾炎、狼疮肾炎等其他类型。\n治疗：\n①急性期卧床休息2~3周；②低盐饮食60mg/(kg·d)，氮质血症者限制蛋白0.5~1g/(kg·d)；③感染灶用青霉素7~10天；④利尿（氢氯噻嗪，无效用呋塞米）；⑤降压（硝苯地平0.25~1mg/(kg·d)；卡托普利0.5~5~6mg/(kg·d)）；⑥一般不用肾上腺皮质激素。\n预后：住院病死率已降至0.5%~2.0%，绝大多数2~4周肉眼血尿消失，残余少量蛋白尿及镜下血尿多于6个月内消失。' },
{ m: '28G', q: '急进性肾小球肾炎（RPGN）：诊断标准？免疫病理三型的特点与所占比例？ANCA两种类型的靶抗原与对应疾病？与APSGN的鉴别要点？预后不良的指征？治疗方案（冲击疗法、血浆置换、四联疗法）？', a: '诊断标准：①发病3个月以内肾功能急剧恶化；②少尿或无尿；③肾实质受累（蛋白尿和血尿）；④既往无肾脏病史；⑤肾脏大小正常或轻度肿大；⑥肾活检显示50%以上肾小球有新月体形成（有的作者认为20%即可考虑诊断）。病理：肾小囊壁层上皮细胞增生形成新月体，毛细血管袢坏死、基膜断裂。\n免疫病理三型：\n①I型抗GBM抗体型（约30%）——外周血/肾洗脱液可检出抗GBM抗体，免疫荧光沿基膜线状沉积，主要为IgG；1/2~2/3可伴C3沉积，可使移植肾再次发生肾炎；伴肺出血者即Goodpasture综合征；\n②II型免疫复合物型（约40%）——循环免疫复合物和冷球蛋白可测出，免疫荧光沿基膜上皮细胞侧颗粒状沉积（IgG、IgM、C3）；见于狼疮肾炎、紫癜性肾炎、链球菌感染后肾炎等；\n③III型寡免疫复合物型（约40%）——荧光阴性或微弱，血C3不低，50%~80%患儿血清ANCA阳性，为系统性小血管炎肾损害：显微镜下多血管炎（MPA）、韦格纳肉芽肿（WG）、变应性肉芽肿性血管炎（CSS）。\nANCA分型：cANCA（胞质弥漫颗粒状）靶抗原PR3，主要见于WG；pANCA（环核型）靶抗原MPO等，主要见于MPA和结节性多动脉炎。\n与APSGN鉴别：APSGN病初多有链球菌感染史、抗O升高、少尿持续很少超过2周、肾功能不全较轻、极期C3下降并随病情好转逐渐恢复（RPGN补体多不降低）；病理上APSGN为内皮和系膜细胞增生，RPGN为毛细血管外（壁层上皮细胞）增生形成新月体。\n预后不良指征：①非链球菌感染后类型；②少尿持续较久超过3~4周；③血BUN>56.3mmol/L（150mg/dl）；④肾小球新月体形成数目超过70%。\n治疗（无特异治疗）：\n①甲基泼尼松龙冲击——剂量15~30mg/(kg·d)（最大不超过1g/d），溶于5%葡萄糖100~200ml中1~2小时静滴，每天或隔日一次，3次为一疗程，可用1~3个疗程；\n②环磷酰胺冲击与MP冲击联合——目前推荐的基础治疗；\n③四联疗法——泼尼松+免疫抑制剂+双嘧达莫及抗凝剂（尿激酶、肝素、华法林）；\n④血浆置换——疾病早期（出现少尿之前或肾功能下降到依赖透析之前）应用强化血浆置换联合激素及细胞毒药物对I型RPGN有一定疗效，儿童剂量40~50ml/kg，直至血清抗GBM抗体转阴；Goodpasture综合征弥漫肺泡出血为血浆置换一类推荐；\n⑤早期透析，有利于病变肾脏休息；抗GBM抗体阳性者需等待转阴后再肾移植，否则可使移植肾再次发生病变。' },
{ m: '28H', q: '肾病综合征的病理生理（四大特点的发生机制，选择性vs非选择性蛋白尿）？蛋白丢失所致的其他后果？五大并发症（感染、高凝/肾静脉血栓、低血容量、急性肾衰、肾小管功能障碍）的机制与表现？激素治疗的方案（初发诱导缓解+巩固维持，2016循证指南）？免疫抑制剂的选择与副作用？', a: '病理生理：\n①大量蛋白尿是最根本的病理生理改变——滤过膜电荷屏障和/或分子筛受损；微小病变主要是电荷屏障减弱→带阴电荷的白蛋白漏出→选择性蛋白尿；非微小病变分子筛也受损→非选择性蛋白尿；\n②低蛋白血症——大量白蛋白从尿丢失是主因，蛋白分解增加为次要原因；白蛋白<25g/L时出现水肿，是病理生理的关键环节；\n③高脂血症——低蛋白血症致肝代偿性合成脂蛋白增加+脂蛋白脂酶活力下降；白蛋白<30g/L即血胆固醇增高；\n④水肿——传统理论（胶体渗透压下降+继发醛固酮/ADH等水钠潴留）+近年提出的原发肾性水钠潴留共同作用。\n其他蛋白丢失后果：转铁蛋白丢失→小细胞低色素性贫血；锌结合蛋白丢失→锌不足；25-羟骨化醇结合蛋白丢失→钙代谢紊乱/骨钙化不良；IgG、IgA丢失→抗感染力下降；抗凝血酶III丢失→高凝及血栓形成。\n并发症：\n①感染——最常见并发症及死亡主要原因（ISKDC统计占肾病患儿死亡的70%）；原因：体液免疫低下（Ig丢失）、细胞免疫和补体不足、蛋白质营养不良、激素免疫抑制剂；不主张预防性用抗生素；\n②高凝状态及血栓栓塞——纤维蛋白原增高、第V/VIII凝血因子增加、抗凝血酶III下降、血小板聚集力增高；肾静脉血栓最受重视：急性型骤发肉眼血尿+腹痛+脊肋角压痛+肾区肿块，双侧者急性肾功能减退；慢性型仅水肿加重、蛋白尿不缓解；\n③低血容量——不恰当忌盐+吐泻/大剂量利尿/放腹水→体位性低血压、肾前性氮质血症甚至休克；\n④急性肾功能减退——原因：低血容量灌注不足甚至肾小管坏死、严重肾间质水肿+蛋白管型堵塞、药物肾毒性、双侧肾静脉血栓；\n⑤肾小管功能障碍——糖尿、氨基酸尿、失钾失磷、浓缩功能不足。\n激素治疗（2016循证指南）：\n①诱导缓解——足量泼尼松60mg/(m2·d)或2mg/(kg·d)（按身高标准体重，总量≤60mg），先分次口服，尿蛋白转阴后改每晨顿服，共4~6周；\n②巩固维持——泼尼松2mg/kg（最大60mg/d）隔日晨顿服4~6周，然后逐渐减量，总疗程9~12个月；隔日晨顿服对HPA轴抑制最小；\n③非频复发——重新诱导缓解（转阴3天后改40mg/m2或1.5mg/(kg·d)隔日晨顿服4周再渐减）；感染时改隔日为每日同剂量口服可降低复发率。\n免疫抑制剂（用于激素耐药、频复发、依赖或副作用严重者）：\n①环磷酰胺——口服2~3mg/(kg·d)分次8周，或静冲8~12mg/(kg·d)每2周连用2天，总剂量≤168mg/kg；近期副作用出血性膀胱炎（需水化碱化尿液）、骨髓抑制、脱发；远期性腺损伤（青春期前男孩可影响生精功能）；\n②环孢素A——4~6mg/(kg·d)，血药谷浓度80~120ng/ml，疗程1~2年；肾毒性最受关注；CsA>36个月、用药年龄<5岁、大量蛋白尿持续>30天是CsA肾毒性（CsAN）的独立危险因素；停药后易复发；\n③吗替麦考酚酯——20~30mg/(kg·d)，疗程12~24个月，对CsA抵抗/依赖/频复发患儿可替代CsA；\n④他克莫司——0.05~0.15mg/(kg·d)，维持血药浓度5~10μg/L，效应为CsA的10~100倍；\n⑤利妥昔单抗——375mg/m2每周1次用1~4次，能完全清除CD19细胞6个月或更长，用于上述治疗无反应、副作用严重的SDNS。\n激素副作用两类：①长期超生理剂量——库欣面容、负氮平衡肌肉萎缩、高血糖、水钠潴留高血压、高尿钙骨质疏松、消化性溃疡、感染/结核播散、白内障、股骨头无菌坏死、生长期小儿生长迟缓；②急性肾上腺皮质功能不全和戒断综合征——突然停药或遇感染、手术等应激时出现恶心呕吐、腹痛、休克前期乃至休克。' },
{ m: '28H', q: '肾病综合征的疗效与预后：激素敏感的近期疗效（临床分型与病理类型）？远期复发规律？各病理类型进展为慢性肾衰的比例？水肿的治疗（利尿剂选择、扩容、白蛋白输注原则）？', a: '近期疗效（与类型有关）：\n①临床分型——单纯性病例78.9%呈完全效应，肾炎性仅34.3%；\n②病理类型（ISKDC 471例）——激素效应者中微小病变占93.1%、局灶节段硬化占29.7%、系膜增生占55.6%、膜增生肾炎仅占6.9%。\n远期复发：对激素敏感却易复发是常见现象，国外报道仅23%的病例初治缓解后不再复发；初治疗程与复发有关（4周、8周、12周疗程后12个月内复发率分别为81%、61%、36%）；复发病例多发生于2年内，但缓解多年后仍可复发；激素敏感者虽多次复发，敏感性多不变，少数可由敏感转为耐药。\n预后：发展成慢性肾衰或死亡的比例——微小病变占7%、局灶节段硬化占38%、膜性肾病占8%、膜增生性肾炎占41.5%。5年病死率由无抗菌药物年代的60%~70%降至泼尼松年代的10%左右，免疫抑制剂应用后又进一步下降。\n水肿治疗：\n①一般应用激素后7~14天内多数患儿开始利尿消肿，可不用利尿剂；\n②开始用氢氯噻嗪1mg/kg每天2~3次，2天内无效可加至2mg/kg并加用螺内酯；\n③效果差时用袢利尿剂（呋塞米或依他尼酸钠）；不宜长期大量应用或骤然大量利尿（注意尿中失钾及低血容量）；\n④对利尿剂无效且血浆蛋白过低者，可先扩容继之利尿——低分子右旋糖酐5~10ml/kg加多巴胺（2~3μg/(kg·min)，增加肾血流并排钠利尿）、酚妥拉明，滴毕静注呋塞米1~2mg/kg，重症水肿可连用5~10天；\n⑤白蛋白/血浆输注——近年注意到活动期输注后常于24~48小时内自尿中排出，多次输注对缓解及复发不利，故仅对白蛋白<15g/L、一般利尿措施无效或伴低血容量者给予。' },
{ m: '28I', q: '迁延性肾炎的定义（两类情况）与处理？慢性肾小球肾炎的诊断要点与起病方式？按病理类型慢性肾炎的临床特点（膜增生、FSGS、膜性、硬化性、系膜增生）？IgA肾病：诊断要点、临床类型、临床表现特点（儿童最常见类型）、血IgA变化与治疗共识？', a: '迁延性肾炎（两类情况）：①有明确急性肾炎病史，镜下血尿和/或蛋白尿迁延达1年以上，不伴肾功能不全或高血压；②无急性肾炎病史，但持续性血尿和蛋白尿病程已达6个月以上，不伴肾功能不全或高血压。常表现为不伴明显临床症状的持续蛋白尿伴镜下血尿；病理多呈非特异局灶性肾炎或单纯系膜增生；无特异药物治疗（预防感染、避免过劳），如为进行性肾小球肾炎则针对治疗。\n慢性肾小球肾炎：病程超过1年，伴不同程度肾功能不全和/或持续性高血压，预后较差，多以慢性肾衰为最终结局。诊断三要素：①肾炎性尿改变（蛋白尿、血尿、管型尿）；②不同程度肾功能不全和/或高血压；③病程1年以上。起病方式三种：以急性肾炎或肾病起病迁延不愈；隐匿起病体检发现尿异常或高血压；以苍白、乏力、生长发育迟缓等非特异症状就诊时已有肾衰。\n按病理类型的特点：\n①膜增生性肾炎——多见于学龄儿童及青少年，女多于男；特点之一为血补体C3低下（又称低补体性肾炎）；病程迁延，最终大多出现慢性肾功能不全；对激素常不敏感；移植后可于移植肾复发；\n②FSGS——约1/3~1/2病例起病时即有高血压、血尿和血肌酐增高；呈肾病者多激素耐药；恶性型可于数月至3年内进入肾衰竭；肾移植后20%~30%病例复发；\n③膜性肾病——小儿少见，蛋白尿非选择性常伴镜下血尿，早期一般不伴高血压和肾功能不全；预后在小儿较成人相对好（5年随访10%进入慢性肾功能不全）；\n④硬化性肾小球肾炎——多伴高血压和肾功能减退；\n⑤系膜增生性肾炎——病程迁延但真正进入肾功能不全者为少数，多表现为迁延性肾炎。\n慢性肾炎治疗原则：去除已知病因、保护肾脏、避免和预防诱发因素、对症治疗；低盐低磷优质动物蛋白饮食；ACEI（卡托普利）不仅控制全身高血压，还能控制肾小球局部高灌注、高滤过，延缓肾损伤进展。\nIgA肾病（Berger病）：\n①本质是免疫病理诊断——肾小球系膜区广泛、显著IgA沉着为诊断必需条件（免疫荧光），需排除紫癜、SLE、肝病等继发性IgA沉着；\n②临床表现7型，儿童以孤立性血尿型最常见（70%患儿以此起病）——多为发作性肉眼血尿，常于血尿前1~2天有呼吸道或胃肠道感染（与APSGN的1~3周间歇期不同），肉眼血尿3~7天内消失但可反复发作；年长儿可诉腰痛，少见水肿和高血压；\n③21%~75%患儿血IgA升高（近年发现低糖基化IgA1升高更特异）；\n④病理光镜以系膜增生为主，推荐Lee分型（MEST评分：系膜增生M、内皮增生E、节段硬化/粘连S、小管萎缩/间质纤维化T）；\n⑤预后——日本241例15年随访11%发展为慢性肾功能不全；小儿起病者10年存活率>90%（成人80%~85%）；\n⑥治疗——无特效；对蛋白尿的共识：ACEI/ARB可有效减少尿蛋白（轻度可考虑用，中度建议用，可联合；Ccr<30ml/(min·1.73m2)时慎用）；新月体型或急进性表现者参照血管炎治疗，免疫抑制剂首选环磷酰胺；终末期需透析/肾移植，但移植后可复发。' },
{ m: '28J', q: '儿童血尿的诊断标准？如何鉴别假性血尿？肾小球性与非肾小球性血尿的定位方法（尿三杯试验、尿红细胞形态标准）？各年龄阶段血尿的常见病因？单纯性血尿的两种表现形式与处理？需鉴别的四种疾病（IgA肾病、薄基底膜病、Alport、特发性高尿钙症、胡桃夹现象）的要点？', a: '诊断标准（2004年肾脏学组）：离心尿RBC>3/HP或>8000/ml；非离心尿>1~2/HP且2~3周内重复2~3次尿检仍异常。尿潜血试验仅为过筛检查，不能作为确诊依据。\n假性血尿鉴别：阴道或下消化道出血混入（青春期女孩先排除月经污染）；红色尿——卟啉尿、药物色素（利福平、柔红霉素、氨基比林、刚果红）、新生儿尿酸盐尿布红染、血红蛋白尿及肌红蛋白尿、食物色素。\n定位方法：\n①尿三杯试验——初段血尿提示尿道疾病；终末血尿见于膀胱颈、三角区、后尿道疾病；全程血尿提示肾、输尿管、膀胱疾病；\n②尿红细胞形态（普遍采用）——肾小球性血尿红细胞穿过病变的GBM及肾小管时受挤压和渗透压/pH影响，呈大小不等形态各异：常见标准——严重变形率（面包圈样、穿孔样、芽胞样）≥30%；或畸形RBC率≥60%；或多形型（形态≥3种）；或面包圈样≥5%同时穿孔样RBC（G1细胞）≥1个；非肾小球性血尿红细胞形态基本正常均一；\n③注意双向性血尿（IgA肾病、薄基底膜病、Alport、肉眼血尿发作、利尿剂应用），应多次多种方法定位。\n年龄病因谱：新生儿期——自然出血症、严重缺氧窒息、肾静脉血栓、急性肾乳头坏死；婴幼儿期——泌尿系感染和先天性尿路畸形最常见，其次肾肿瘤、HUS、Alport；儿童期——急性肾炎综合征最常见，其次泌尿系感染、高钙尿症、胡桃夹现象；青少年——肾小球肾炎、结石、肾结核。\n单纯性血尿两种表现：\n①复发性——肉眼血尿反复发作，每次持续一般不超过2~5天，发作前1~3天多有感染或剧烈运动史，间歇期尿检正常或镜下血尿；\n②持续性——多系体检偶然发现的镜下血尿；\n③多数预后好、病理多为非特异轻微改变，不需肾穿刺，定期随访；如血尿逐渐加重或病程持续1年以上可有选择地肾穿；一旦伴发蛋白尿提示有肾脏病理变化，应行肾穿刺。\n鉴别要点：\n①IgA肾病——复发性血尿，红细胞呈肾小球性严重变形，部分患儿血清IgA升高，确诊靠肾活检免疫荧光；\n②良性家族性血尿（薄基底膜病）——家族史，良性过程，电镜见肾小球基膜菲薄；\n③Alport综合征——家族史+神经性高频耳聋+进行性肾功能减退；X连锁者皮肤活检检测IV型胶原α链有助诊断；\n④特发性高尿钙症——孤立性血尿重要病因（Stapleton报道83例中27.7%为高尿钙）；初筛随机尿Ca/Cr(mg/mg)≥0.2，确诊需24小时尿钙≥4mg/(kg·d)；治疗：足够液量、限钠、避免草酸过多食物（果汁、巧克力），噻嗪类利尿剂氢氯噻嗪1mg/(kg·d)4~6周；\n⑤胡桃夹现象（左肾静脉受压综合征）——青春期身长速增、夹角变窄致左肾静脉受压；一侧性（左侧）肾出血，尿红细胞形态属非肾小球性；可伴左腰不适或腹痛（喜俯卧位）、精索静脉曲张；超声是简单无创的诊断方法；一般无需治疗，随年龄增长或侧支循环建立症状缓解。' },

{ m: '28K', q: '乙型肝炎病毒相关肾炎（HBV-GN）：常见病理类型？发病机制要点（HBeAg与膜性肾病）？临床特点（三性）？诊断标准（1989座谈会+2008修订）？治疗原则（儿童自然缓解倾向、抗病毒、激素使用注意事项）？紫癜性肾炎：诊断标准（2009）、临床分型、病理分级（ISKDC 6级）、治疗按临床/病理分层方案与预后？', a: 'HBV-GN：\n①病理类型——主要为膜性肾病（占80%，ASRDS报告小儿66.1%）、膜增生性肾炎、系膜增生性肾炎；光镜多为不典型膜性肾病（基膜弥漫增厚+系膜增生，大块嗜复红蛋白沉积使基膜呈链环状）；\n②发病机制——循环免疫复合物沉积激活补体为主要机制；HBeAg分子量小，其免疫复合物可穿过内皮但过不了上皮细胞裂缝而沉积于上皮下引起膜性肾病；宿主T、B细胞免疫缺陷无法有效中和HBeAg是HBV相关膜性肾病的条件；\n③临床特点（三性）——非典型性（可表现为肾炎或肾病，但大量蛋白尿者水肿多不重、胆固醇升高不明显；以血尿为主者血压多不高、血沉不快）、多变性（肾炎与肾病表现可互相转变）、迁延性（对激素治疗反应欠佳）；\n④诊断——1989年座谈会标准：血清HBV抗原阳性+患肾小球肾炎并除外狼疮等继发性+肾组织切片中找到HBV抗原（③为最基本条件，缺此不能诊断）；2008年修订：确诊可依据①2+3条同时具备，或②1+2条且病理为膜性肾病，或③2+3条（肾小球有HBV抗原沉积）即使血清学阴性也可确诊；约半数患儿补体C3或C4下降；\n⑤治疗——儿童有一定自然缓解倾向，以抗病毒和对症为主：尿蛋白<1g/d者仅需对症治疗（双嘧达莫、ACEI/ARB）；体内有HBV活动者抗病毒（干扰素或拉米夫定，国内儿童拉米夫定3mg/kg/d疗程至少1年）；NS表现久治不愈者才考虑抗病毒+免疫抑制（不建议单用激素；肝炎活动期或HBV复制指标阳性时激素免疫抑制剂应谨慎）；根本预防是乙肝疫苗接种。\n紫癜性肾炎（HSPN，2009年统一命名）：\n①诊断标准——过敏性紫癜病程6个月内出现血尿和/或蛋白尿（血尿：肉眼或镜下；蛋白尿：1周内3次尿常规蛋白阳性，或24h尿蛋白>150mg，或1周内3次尿微量白蛋白高于正常）；\n②临床分型——孤立性血尿型、孤立性蛋白尿型、血尿和蛋白尿型、急性肾炎型、肾病综合征型、急进性肾炎型、慢性肾炎型；97%患儿肾脏受累发生于紫癜起病后6个月内；\n③病理分级（ISKDC 6级）——I级肾小球轻微异常；II级单纯系膜增生；III级系膜增生伴<50%肾小球新月体形成/节段性病变；IV级50%~75%肾小球伴上述病变；V级>75%；VI级膜增生性肾小球肾炎；免疫荧光以IgA沉积为特点（与IgA肾病相似）；\n④治疗分层——孤立性血尿或病理I级无特异治疗（随访至少3~5年）；孤立性蛋白尿/血尿+蛋白尿或病理IIa级建议ACEI和/或ARB；非肾病水平蛋白尿或病理IIb、IIIa级、持续蛋白尿>1g/(d·1.73m2)已用ACEI/ARB且GFR>50者可给予糖皮质激素治疗6个月；肾病水平蛋白尿/NS或病理IIIb、IV级建议激素联合环磷酰胺；急进性肾炎或病理IV、V级常用甲泼尼龙冲击1~2疗程后口服泼尼松+环磷酰胺；\n⑤不建议应用激素预防紫癜性肾炎（国内外指南）；\n⑥预后——肾衰概率2%~15%，宜加强随访至少5年；预后差相关因素：成人期发病、急性期肾功能损伤/高血压/重症蛋白尿、病理增生程度及新月体多少、肾小管间质病变。' },
{ m: '28L', q: '狼疮性肾炎（LN）：小儿SLE肾脏受累的发生率与特点？发病机制（核小体/ANA）？肾活检指征与ISN/RPS 2003病理分型（I~VI型）？免疫荧光满堂亮？实验室检查特点（补体、抗dsDNA、抗Sm、抗C1q）？治疗（2016循证指南：增殖性LN的诱导缓解与维持治疗）？预后？', a: '概述：肾脏是SLE最常侵犯的脏器——疾病早期25%~50%患儿出现尿检异常或肾功能减退，以后发展至80%出现明显肾脏损害（比成人多见且相对较重）；IV型（弥漫增殖型）为主；SLE死亡原因中1/3为肾衰竭；多见于女性（80%~90%），5~10岁发病占1/4~1/3。\n发病机制：公认观点为自身抗体通过核小体介导与肾脏结合而致病——核小体（组蛋白+DNA）作为自身抗原诱导产生抗核小体抗体（ANA），核小体一端与GBM/系膜结合、另一端暴露抗体结合位点；核小体中组蛋白或DNA与肾小球不同成分结合导致不同部位沉积，从而产生不同的临床表现和病理分型；ANA的敏感性特异性优于抗dsDNA抗体，且与蛋白尿、疾病活动性显著相关。\n肾活检指征（2012年EULAR/ACR指南）：SLE患儿出现任何肾脏受累表现均为肾活检指征（除非强禁忌证），特别是尿蛋白≥0.5g/24h伴肾小球性血尿和/或细胞管型——因为从临床、血清学或实验室检查均不能准确预测肾脏病变程度。\nISN/RPS 2003病理分型：I型系膜轻微病变型；II型系膜增生型；III型局灶型（受累肾小球<50%）；IV型弥漫型（受累肾小球>50%，分节段型S和球性G）；V型膜型（上皮下沉积，可与III/IV型联合）；VI型进行性硬化型（≥90%肾小球球性硬化——注意50%~90%硬化者仍属IV型，仍有药物治疗机会）。儿童LN中I~II型占25%，III~IV型占65%，V型占9%；各型之间转型常见。\n免疫荧光：以IgG为主，IgA、IgM也存在，早期补体C4、C1q与C3一起，三种免疫球蛋白+C3+C4+C1q均存在时称满堂亮（full house），见于1/4~2/3患儿。\n实验室检查：\n①低补体血症75%（C3下降，C4、C1q下降为主者更提示LN）；\n②抗核抗体95%阳性（活动期滴度>1:160；膜型为急性期特征）；\n③抗dsDNA抗体97%阳性（监测疾病活动，可在LN临床表现之前先下降…即先升高）；抗Sm抗体30%阳性（对SLE诊断较特异）；\n④抗C1q抗体与LN关系密切（IV型阳性率67.1%），可作活动指标；抗磷脂抗体29%~50%阳性（与血栓、血小板减少、血管性肾损伤有关）；\n⑤狼疮细胞70%~80%阳性。\n诊断（2010年我国指南）：凡符合WHO的SLE诊断标准并有肾受累表现（任一项：24h尿蛋白>0.15g或1周3次尿蛋白定性阳性；持续血尿>5/HP；肾功能异常；肾活检异常）即可诊断LN。\n治疗（2016循证指南）：\n①治疗原则——尽早肾活检；积极控制SLE活动；坚持长期正规合理药物治疗；\n②羟氯喹推荐全程用药（每3个月眼科检查）；\n③控制高血压和蛋白尿首选ACEI/ARB；\n④增殖性（III型和IV型）LN——诱导缓解（一般6个月）：首选糖皮质激素+环磷酰胺冲击；泼尼松1.5~2.0mg/(kg·d)6~8周缓慢减量；肾增生病变显著时甲泼尼龙冲击（15~30mg/(kg·d)最大1g/d，3天一疗程）；CTX冲击两种方法：500~750mg/(m2·次）每月1次共6次，或8~12mg/(kg·d)每2周连用2天共6~8次，累计150~250mg/kg；MMF可作CTX替代（儿童20~30mg/(kg·d)）；维持治疗不少于3年：激素减至最小维持量（5~10mg/d）长期服用，CTX后2周加MMF或硫唑嘌呤（1.5~2mg/(kg·d)）序贯；\n⑤V型——非肾病水平蛋白尿用羟氯喹+ACEI；大量蛋白尿加激素+免疫抑制剂；V+III/V+IV按增殖性LN治疗；\n⑥难治性LN——常规CTX无效且无CTX方案亦无效者：MMF+他克莫司联合，或利妥昔单抗（375mg/m2每周1次2~4次，静注前给抗组胺药预防过敏），或血液净化；\n⑦重复肾活检指征——维持治疗12个月仍未完全缓解（更换方案前）；怀疑病理类型转变；肾功能恶化。\n预后：10年生存率已增至78%~92%，但10%~30%确诊后15年内逐渐发展为终末期肾衰；预后不良因素——社会经济地位低、持续高血压、贫血及肌酐升高、病理IV型（广泛新月体和坏死性病变）、病理慢性指标高（<2者10年肾存活率100%，2~4者70%，>4者仅35%）、治疗不及时或第一年效果不佳。肾脏5年存活率44%~93%，未达完全缓解者5年、10年肾脏存活率仅46%、31%。' },
{ m: '28M', q: '溶血尿毒综合征（HUS）的三联征、分型及主要鉴别点？', a: '三联征=微血管病性溶血性贫血+血小板减少+急性肾损伤，与TTP同属血栓性微血管病。\n分型：\n①感染相关性STX-HUS（占90%）：大肠埃希菌O157:H7等产志贺毒素菌，典型者腹泻阳性（D+）。\n②不典型aHUS：补体介导与非补体介导（DGKE/THBD/PLG/MMACHC基因异常）。\n③继发性：SLE、药物、肿瘤、妊娠、移植后。\n鉴别要点：肺炎链球菌相关HUS（Sp-HUS）Coombs试验阳性（STX-HUS阴性）、90%前期肺炎、高峰1岁，唾液酸酶暴露TF抗原。' },
{ m: '28M', q: 'aHUS的常见基因突变及各自特点？', a: '①H因子突变20–30%最常见：5年ESRD达50–80%。\n②MCP（CD46）8–10%：C3多正常，复发率58–90%但预后相对好。\n③I因子4–10%；④C3突变4–8%；⑤B因子<1–4%。\n⑥抗H因子抗体占5–20%（印度高达56%），多伴CFHR1纯合缺失，多见于5–10岁。\n突变外显率仅50–60%（多重打击学说）。' },
{ m: '28M', q: 'HUS的诊断思路与检查要点？', a: '①所有非STX-HUS查ADAMTS13活性排除TTP（<10%=TTP）。\n②筛查维生素B12代谢（MMACHC基因，钴胺素代谢异常）。\n③年龄策略：<6月龄首先考虑aHUS；6月–5岁勿漏Sp-HUS；青春期以补体介导aHUS最多见。\n补体异常提示：C3降低、Bb及sC5b-9升高（eculizumab有效可佐证补体参与）。' },
{ m: '28M', q: 'HUS的治疗原则（STX-HUS、aHUS）？', a: '支持治疗：腹泻4天内积极补液可减轻AKI。\n血液：Hb<70g/L输新鲜红细胞5–10ml/kg，避免输血小板。\n透析：约50%需透析，指征为无尿>24h、血钾>6.5mmol/L、pH<7.1、利尿剂无效的液体负荷；婴幼儿首选腹膜透析。\naHUS一线=血浆置换（FFP 1.5倍血浆量或60–75ml/kg/d），MCP突变者无效。\n补体介导aHUS最佳/一线推荐eculizumab（抗C5单抗）：85%缓解，注意脑膜炎球菌感染风险（用药前疫苗±抗生素预防）。\n抗H因子抗体阳性加免疫抑制（激素+CTX/MMF/抗CD20）。\n肾移植：aHUS复发率高（H因子突变68–90%、MCP 10–20%），避免活体供肾。' },
{ m: '28M', q: 'HUS的预后与抗生素使用注意事项？', a: '预后：\nSTX-HUS急性期病死率<5%，但25–30%遗留CKD。\nSp-HUS死亡率12.3%。\naHUS急性期死亡10–15%，复发率50%。\n抗生素注意：β内酰胺类和磺胺异唑-甲氧嘧啶可增加HUS风险（刺激毒素释放）；磷霉素最可能减少HUS发生。' },
{ m: '28N', q: '遗传性肾病综合征与Alport综合征的要点？', a: '遗传性肾病综合征：基因突变所致，生后3个月内起病=先天性，4–12个月=婴儿型。病理光镜可微小病变/弥漫系膜硬化/FSGS，电镜均有足细胞融合、裂孔隔膜消失。激素及免疫抑制剂无效，确诊后应渐停用，可用ACEI/ARB减尿蛋白；原发性辅酶Q10缺乏者用辅酶Q10。多数进展至ESRD需移植。\nAlport综合征：血尿+感音神经性耳聋+眼异常+进行性肾功能减退，又称遗传性进行性肾炎。\n遗传方式：X连锁显性约85%（COL4A5/COL4A6），常隐约15%（COL4A3/COL4A4），常显极少。\n病理金标准：电镜GBM薄厚不均、分层化、撕裂、篮网状。\n男性重于女性：男性平均24.3岁进CKD，女性多仅血尿。\n耳聋67%、眼疾37%（圆锥形晶体最有诊断价值）。\n治疗：一线ACEI、二线ARB/螺内酯；移植后可发生抗GBM肾炎（3–5%，75%在1年内）。' },
{ m: '28N', q: '肾单位肾痨、常染色体隐性多囊肾病、Dent病、Lowe综合征的鉴别要点？', a: '肾单位肾痨（NPHP）：肾纤毛病，30岁前ESRD最常见单基因遗传病。儿童型最常见，多饮多尿、遗尿、贫血、生长落后，无明显血尿蛋白尿，血压不高；50%皮髓交界处囊肿；儿童型ESRD平均13岁。致病基因NPHP1最常见。\nARPKD：活产儿发病率1/20000，PKHD1基因。肾脏集合管纺锤形扩张+先天性肝纤维化。围产期发病者双肾增大、羊水少，30%围产期死亡；新生儿期死因主要是肺功能不全。超声：双肾对称增大、强回声、皮髓质分界不清。\nDent病：X连锁隐性近端肾小管病。小分子蛋白尿+高钙尿+肾钙沉积/肾结石+CKD；1型CLCN5（60%），2型OCRL（15%）。男性10岁前小分子蛋白尿，30–50岁30–80%进展ESRD。治疗：噻嗪类降尿钙+ACEI/ARB。\nLowe综合征：X连锁隐性，先天性白内障+精神运动发育落后+近端肾小管功能障碍（Fanconi综合征但几乎无糖尿），OCRL基因。' },
{ m: '28O', q: '小儿泌尿道感染的流行病学特点与致病菌？', a: '流行病学：发生率仅次于呼吸道和消化道感染；75%发生在生后头2年；第一个高峰在生后第1年，第二个高峰在2–4岁。1岁内男孩多于女孩（3.7% vs 2%），未割包皮男婴高达20.3%（女孩5%）；2岁后女孩多见（3% vs 1%）。初次UTI后约30%在12个月内复发。未包皮环切男孩UTI发生率是已环切者的5–20倍。\n致病菌：80–90%为大肠埃希菌（G-），其余为变形杆菌、克雷伯杆菌、腐生葡萄球菌；G+菌（肠球菌、葡萄球菌）占5–7%。新生儿A、B组溶血性链球菌相对常见。\n感染途径：上行感染最多见；血行感染多在新生儿及小婴儿。' },
{ m: '28O', q: 'UTI的易感因素与肾瘢痕形成的高危因素？', a: '易感因素：\n①生理特点：尿布污染、女婴尿道短、男婴包皮（细菌储存库）。\n②母亲妊娠期菌尿使婴儿UTI机会增加4倍；缺乏母乳喂养者危险增加。\n③抗生素破坏尿道周围共生菌群。\n④尿路上皮细胞特性：伞型受体密度（P血型者受体多，P1血型反复肾盂肾炎危险比P2大11倍）、TLR功能异常。\n⑤分泌型IgA减低。\n⑥膀胱防御机制：规律排空清除细菌；不完全排空（排空功能紊乱、神经源性膀胱、VUR）致残余尿。\n⑦先天尿路梗阻是最常见因素。\n肾瘢痕高危因素：\n①反复发作UTI（发作次数越多危险指数增长）。\n②延误诊断和治疗（感染7天内迅速有效治疗可预防瘢痕）。\n③年龄：幼儿更常见，4岁后新瘢痕一般不再发生（已有瘢痕者任何年龄可新发）。\n④梗阻性尿路病。\n⑤VUR和肾内反流：严重VUR者肾瘢痕危险比无VUR高8–10倍，瘢痕为节段性。' },
{ m: '28O', q: 'UTI的诊断标准、实验室检查与影像学检查策略？', a: '诊断：AAP 2011标准=尿液分析提示感染（白细胞尿和/或菌尿）+插管或耻骨上穿刺尿培养≥50000CFU/ml；国内标准=清洁中段尿沉渣白细胞≥5个/HP或尿培养菌落≥1×10⁵/ml，两者缺一不可。\n尿标本：耻骨上膀胱穿刺是金标准（有G-菌生长即确诊）；清洁中段尿最常用；尿袋法假阳性率85–99%，仅阴性时有价值。\n尿液分析：标本室温放置勿超4小时（须冷藏或2小时内送检）。白细胞酯酶特异度69–98%，亚硝酸盐特异度高（75–100%）但敏感度低（G+菌可阴性），联合检测敏感性接近100%。沉渣涂片每个视野≥1个细菌提示菌尿10万/ml以上。\n影像学：首次发热性UTI常规做泌尿系超声；DMSA诊断急性肾盂肾炎敏感度96%、特异度98%，急性感染后3个月复查评估瘢痕（金标准）；新指南不推荐首次UTI常规MCU——≤2岁者超声+DMSA，异常才做MCU；MCU是确诊VUR的金标准。' },
{ m: '28O', q: 'UTI的治疗原则与抗生素疗程？', a: '治疗原则：积极控制感染、防止复发、去除诱因、减少肾损害。明确尿检异常即可在培养同时开始经验性抗菌治疗（发热性UTI尽早用药）。\n急性肾盂肾炎：≤3月龄全程静脉敏感抗生素10–14天；>3月龄静脉2–4天后改口服，总疗程10–14天。RCT显示口服10天、静脉3天改口服7天与完全静脉7–14天瘢痕风险无差异。\n急性膀胱炎：推荐短疗程口服2–4天（以往7–14天）；AAP建议至少7天。\n常用经验药：二代以上头孢、氨苄西林-克拉维酸；复方磺胺甲噁唑（2月龄以下禁用）、呋喃妥因（饭后服）；氨基糖苷类肾毒性大慎用；诺氟沙星二线、一般不用于幼儿。\n无症状菌尿一般不需治疗（合并梗阻/VUR/瘢痕者例外）。\n预防性用药：首次UTI不推荐常规预防；高风险者（高级别VUR、不明原因复发）用治疗量1/3睡前顿服（首选呋喃妥因或磺胺），疗程3–4个月。\n48小时评估疗效，无效者重新培养调整。预后：半数复发，广泛瘢痕者3–10%发展为终末肾衰。' },
{ m: '28P', q: '膀胱输尿管反流（VUR）的分级、自然病程与治疗？', a: '定义：尿液自膀胱非生理性反流入输尿管、肾盂，是儿童常见尿路畸形。\n病因：原发性=UVJ瓣膜样功能先天性发育不全（输尿管芽萌出异常）；继发性=下尿路梗阻（后尿道瓣膜、神经源性膀胱）或反复UTI炎症破坏。输尿管膀胱壁段长度与直径比达5:1方能防反流。\n流行病学：正常人群0.4–1.8%；发热性UTI患儿20–40%；新生儿期UTI中50–70%有VUR；1岁内男孩多见，1岁以上女孩多见。有遗传倾向（常显，同胞发病率27.4%）。\nIRSC五级：Ⅰ级仅达输尿管；Ⅱ级达肾盂肾盏无扩张；Ⅲ级输尿管肾盂轻中度扩张、穹窿变钝；Ⅳ级中度扩张、穹窿角消失但乳头形态维持；Ⅴ级重度扩张迂曲、失去乳头形态、肾实质内反流。Ⅲ级以下轻度，Ⅳ级以上重度。\n诊断：MCU是金标准（可分级）；超声首选筛查；DMSA是诊断肾瘢痕（反流性肾病RN）的金标准。\n肾瘢痕：反流程度升1级瘢痕危险升3.5倍；Ⅳ–Ⅴ级瘢痕风险为无VUR的22倍；RN所致ESRD占儿童慢性肾衰的12–21%，高血压10–30%。\n自然病程：4–5岁内低级别（Ⅰ–Ⅱ级）自愈率80%，Ⅲ–Ⅴ级30–50%。\n治疗目的：减少UTI、防止肾损害。保守治疗（观察+预防性抗生素）为低级别首选；手术指征为高级别反流、保守治疗无效、肾瘢痕进展。' },
{ m: '28Q', q: '包茎与嵌顿包茎的诊断及处理要点？', a: '包茎：包皮口狭小紧包阴茎头、不能向后翻开显露阴茎头。先天性包茎几乎所有男婴出生时存在，绝大多数2–3岁内自行消失；包皮垢呈乳白色豆腐渣样，隔着包皮可见白色小肿物（勿误认为肿瘤）。后天性（病理性）包茎=纤维性狭窄环，继发于阴茎头包皮炎反复发作、瘢痕挛缩，不能自愈，必须包皮环切。\n处理：婴幼儿先天性包茎可轻柔反复上翻扩大包皮口，露出阴茎头清洁后必须复位（否则造成嵌顿）；局部外用类固醇激素改善包皮弹性；后天性包茎行包皮环切术。\n嵌顿包茎：包皮上翻至冠状沟未及时复位，狭窄环阻塞形成水肿恶性循环。嵌顿1–2天内绝大多数可手法复位（先挤压减轻水肿）；复位失败即行包皮背侧切开术（要点是切断狭窄环，有槽探子插入保护海绵体），消肿后择期包皮环切。嵌顿日久可包皮坏死。' },
{ m: '28Q', q: '阴茎头包皮炎、睾丸附睾炎、外阴炎阴道炎的诊治要点？', a: '阴茎头包皮炎：见于包茎或包皮过长男孩，包皮垢刺激所致。包皮充血水肿、尿道口脓性分泌物。治疗：口服抗菌药+局部3%硼酸或1:4000呋喃西林溶液温浸，急性期控制后行包皮环切，尿道口狭窄者同期尿道口切开。\n睾丸炎：继发于外伤、腮腺炎或其他部位化脓感染（小婴儿多为金黄色葡萄球菌）。附睾炎：多系上行感染（尿道狭窄、留置导尿管），也可经淋巴或血行感染。表现体温升高、阴囊肿痛、可触及肿大压痛的睾丸/附睾、精索肿胀压痛。超声可鉴别阴囊急症：睾丸扭转时睾丸实质血流消失或减少；睾丸附件扭转可见肿大的附件而睾丸附睾无肿胀。治疗以抗菌药物为主，化脓者切开引流，同时处理原发病变（尿道狭窄）。\n外阴炎阴道炎：病原除细菌外，虫、滴虫也可引起；局部积垢或阴道异物为诱因。外阴红赤、阴道少量黄白色分泌物；急性期可并发原发性腹膜炎。治疗：抗菌药+局部清洁，虫/滴虫者驱虫、内裤煮沸消毒；一般1.5岁左右可训练不穿开裆裤；淋球菌感染用足量青霉素并暂时隔离。' },
{ m: '28R', q: '急性肾损伤（AKI）的诊断标准与分期（KDIGO 2012）？', a: 'AKI定义：不超过3个月的肾脏结构或功能异常。\n诊断标准：肾功能48小时内突然降低，至少2次血肌酐升高绝对值≥26.5μmol/L（0.3mg/dl）；或血肌酐较前升高≥50%；或持续6小时以上尿量<0.5ml/(kg·h)。\nKDIGO 2012分期：\n1期：肌酐达基线1.5–1.9倍或升高≥26.5μmol/L；尿量<0.5ml/(kg·h)持续6–12小时。\n2期：肌酐2.0–2.9倍；尿量<0.5ml/(kg·h)持续≥12小时。\n3期：肌酐≥3倍或≥353.6μmol/L（4.0mg/dl），或开始肾脏替代治疗，或<18岁eGFR<35ml/(min·1.73m²)；尿量<0.3ml/(kg·h)持续≥24小时或无尿≥12小时。\n注意：单独按尿量分期须除外尿路梗阻等可逆因素。' },
{ m: '28R', q: '急性肾衰竭的病因分类与少尿期的临床表现？', a: '病因：\n①肾前性：血容量减少致肾血流下降（失血、感染性腹泻脱水、休克、烧伤）。\n②肾性：儿科最常见。肾小球疾患（急性链球菌感染后肾炎、急进性肾炎、紫癜性肾炎、狼疮性肾炎、ANCA血管炎、HUS）；肾小管疾患（缺血、肾毒性药物如氨基糖苷类、磺胺、造影剂，重金属，肌红蛋白）；急性间质性疾患（急性间质性肾炎、急性肾盂肾炎、药物过敏）。\n③肾后性：尿路梗阻（结石、肿瘤压迫、双侧输尿管梗阻、先天畸形）。小儿勿忘先天发育异常。\n少尿期（尿量<250ml/m²）主要问题：\n①水潴留：全身水肿、胸腹水，重者心衰肺水肿脑水肿（此期死亡重要原因）。\n②电解质紊乱三高三低：高钾、高磷、高镁、低钠、低钙、低氯。高钾>6.5mmol/L为危险界限，是此期死亡首要原因（心电图帐篷T、QRS增宽、传导阻滞、室颤）。\n③代谢性酸中毒：进行性、不易纠正。\n④氮质血症：消化道症状最先出现，10–40%消化道出血。\n⑤心力衰竭（约1/3）、高血压。\n⑥易合并感染：约70%，以呼吸道及泌尿道最常见，约1/3死于感染。\n多尿期：尿量渐增，5–6天达利尿高峰，持续5–10天，注意低钠脱水、低钾；入量以尿量2/3为宜。' },
{ m: '28R', q: '肾前性与肾性急性肾衰竭的鉴别（尿诊断指标）？', a: '鉴别要点：\n①尿常规：肾性蛋白+管型；肾前性基本正常。\n②尿比重：肾性约1.010；肾前性>1.020。\n③尿钠：肾性>40mmol/L；肾前性<20mmol/L。\n④尿渗透压：肾性<350mOsm/L；肾前性>500mOsm/L。\n⑤尿/血渗透压：肾性<1.2；肾前性>1.5。\n⑥钠排泄分数Fena：肾性>2–3%；肾前性<1%——最敏感指标，阳性率98%。\n⑦肾衰指数RFI：肾性>1（可达4–10）；肾前性<1。\n⑧自由水清除率：肾性>0；肾前性<-25。\n辅助试验：\n补液试验：2:1等渗液15–20ml/kg 30分钟快速输注，尿量明显增加为肾前性。\n利尿试验：20%甘露醇0.2–0.3g/kg，尿量>40ml/h为肾前性；或呋塞米1.5–3mg/kg仍无改善提示肾实质性肾衰（甘露醇肾衰时不能排出可致循环充血，慎用）。\n注意：应用利尿剂、白蛋白、甘露醇后影响尿诊断指标，最好用药前留尿。' },
{ m: '28S', q: '慢性肾脏病（CKD）的诊断、GFR分期及小儿特点？', a: 'CKD诊断（KDIGO，满足其一）：\n①GFR<60ml/(min·1.73m²)持续3个月以上，无论是否存在其他CKD指标；\n②GFR>60但伴有结构损伤证据或功能异常指标（蛋白尿、白蛋白尿、肾小管疾病、组织学或影像学异常）。\nGFR分期（不适用于2岁以下）：\nG1≥90；G2 60–89；G3a 45–59；G3b 30–44；G4 15–29；G5<15（肾衰竭）。\n病因变迁：先天性肾脏和尿路畸形（CAKUT）、遗传性肾病、反流性肾病渐成主要病因。\n发病机制：残存肾单位高灌注、高压力、高滤过→肾小球硬化恶性循环；肾间质纤维化（RIF）是各种CKD进展为终末期的共同途径，与肾功能相关性比肾小球硬化更密切。RAS系统（AngⅡ）加速进展。危险因素：持续蛋白尿、高血压、贫血（独立危险因素）、高脂血症、慢性炎症、高尿酸。\n小儿特点：生长停滞突出；肾性骨病易骨骼变形、骨痛、骨脱位；心血管常有心衰、心包炎；神经系周围神经改变比成人少，但婴幼儿起病者可有惊厥、脑萎缩、智力落后；可有青春期发育延迟。' },
{ m: '28S', q: '慢性肾衰竭的主要病理生理改变与治疗原则？', a: '主要病理生理改变：\n含氮代谢产物潴留（GFR下降）；酸中毒（排固定酸、合成氨、排H保HCO₃能力下降）；尿浓缩力减退；失钠（溶质利尿）与钠潴留并存；高血钾；生长障碍；肾性骨病（1,25(OH)₂D₃不足、低钙高磷、继发性甲旁亢）；贫血（EPO减少为主）；出血倾向（血小板功能缺陷）；高血压；心包炎心肌病；神经系统症状；高甘油三酯；葡萄糖不耐受。\n治疗：\n①饮食营养：优质蛋白0.8–1.5g/100kcal，CKD3期DPI 100–140%DRI，4–5期100–120%DRI；补充水溶性维生素；必要时必需氨基酸/α-酮酸。\n②水电酸碱：限钾（血钾>5.8mmol/L药物治疗）；酸中毒HCO₃<15mmol/L给碳酸氢钠2–3mmol/kg（纠正时注意低钙抽搐）。\n③并发症：CKD-MBD从G2期监测钙磷PTH，用骨化三醇；贫血补叶酸铁剂+rHuEPO（初始80–120U/kg/周，Hb目标11–12g/dl）；高血压优选ACEI/ARB（GFR<60慎用，血肌酐>265.2μmol/L需严密观察）；身材矮小可用重组人生长激素（CKD3–5期或透析中）。\n④G4期准备肾脏替代治疗，G5期开始RRT。\n总目标：减慢进展、预防心血管并发症及肾性骨病贫血、提高生存率和生活质量。' },
{ m: '28T', q: '透析指征、HD与PD的比较及透析方式的选择？', a: '急性透析指征：①严重容量负荷（肺水肿、重度高血压、左心衰）；②血钾≥6.5mmol/L；③严重酸中毒（HCO₃<15mmol/L）药物不能缓解；④严重氮质血症（BUN>50mmol/L）伴尿毒症症状；⑤外源性毒物药物中毒。\n慢性维持透析指征：肌酐清除率降至5ml/(min·1.73m²)即应开始；或Hb<60g/L、HCO₃<10mmol/L、血磷>3.2mmol/L、血钾>6.5mmol/L、严重高血压、肾性骨病、心包炎、GFR<15伴营养不良或生长迟缓。\nHD优点：小分子清除率高、人力时间少、疗效迅速；缺点：设备昂贵、血流动力学变化大、婴幼儿造瘘困难、透析失衡综合征、需抗凝。\nPD优点：设备简单易操作、中分子清除佳、很少失衡综合征、不需抗凝、血流动力学稳定；缺点：人力时间多、小分子清除不及HD、易并发腹膜炎、蛋白氨基酸丢失多。\n选择：<3岁、体重<20kg、血流动力学不稳定者选腹透；<5岁首选腹透；>6岁可选血透。肾移植是最佳替代方式，活体供肾优于尸肾。' },
{ m: '28T', q: '腹膜透析与血液透析的常见并发症？', a: '腹透并发症：\n①腹膜炎最常见：细菌侵入12小时后出现腹痛、发热、腹胀、透析液混浊；G-菌占60%、G+约40%、真菌约3%。危害：蛋白丢失增加5–10倍、纤维素阻塞导管、腹膜粘连。治疗：改IPD冲洗、透析液加肝素500–1000U/L+抗生素约2周。\n②营养不良（丢失综合征）：白蛋白、球蛋白、氨基酸、维生素丢失，高蛋白摄入1.2–1.5g/d。\n③腹膜衰竭：Ⅰ型高通透性（超滤衰竭最常见）、Ⅱ型低通透（粘连硬化）、Ⅲ型淋巴回流过多。\n血透并发症：\n①透析失衡综合征：溶质清除过快所致恶心呕吐、抽搐惊厥；预防为控制血流速度和透析时间，静滴甘露醇0.5–1g/kg。\n②低血压：最常见并发症（10–50%），主因有效血容量减少；处理暂停超滤。\n③高血压：分透析间期（容量负荷）与透析中（RAAS活性增高等）。\n血透充分性：URR目标65%；Kt/V目标1.2–1.4。' },
{ m: '28T', q: '儿童肾移植的病因、时机与免疫抑制方案？', a: '病因（NAPRTCS）：CAKUT占31%（最主要）、遗传性肾病16%、FSGS 12%、其他肾小球肾炎11%、反流性肾病及肾盂肾炎/间质性肾炎7%。与成人（糖尿病、高血压为主）不同。\n时机：建议1–12岁，有条件者1–5岁；及早登记等待可择“抢先”移植（不经过透析）。\n绝对禁忌：广泛播散或未治愈肿瘤、严重精神疾病、不可逆脑损伤、药物滥用、急性活动性肝炎。\n配型要求较成人更高（考虑远期存活）。等待儿童获额外加分，18岁以下死亡供肾优先给儿童。\n免疫抑制：诱导用IL-2受体拮抗剂或淋巴细胞清除性抗体；维持联合用药：CNI（他克莫司或环孢素）一线+霉酚酸一线抗增殖+激素；低免疫风险且已诱导者可激素撤离；用mTORi时应联合低剂量CNI而非撤离CNI。\n术后注意排异、感染、原发病复发、生长发育及向成人科转诊。' },
{ m: '28U', q: '肾静脉血栓形成（RVT）的病因、临床表现与诊断？', a: '流行病学：占小儿腹部静脉血栓栓塞症10%，90%在1岁以下，75%在1月龄以下。新生儿RVT是新生儿静脉血栓最常见原因之一。\n病因：高凝状态（大儿童最常见于肾病综合征，新生儿多由严重脱水引起）、肾静脉受压（腹膜后纤维化、肿瘤、创伤）、血管壁损伤。\n肾病综合征高凝机制：小分子抗凝因子（抗凝血酶Ⅲ、纤溶酶原）从尿中丢失，而大分子促凝因子（纤维蛋白原、Ⅴ、Ⅷ因子、α2巨球蛋白）不丢失且肝脏代偿合成增加；血小板增多活化、血容量低、血液黏稠、激素应用加重高凝。\n临床表现：新生儿急性完全性RVT=腰部光滑坚硬肿物+肉眼血尿+脱水酸中毒。典型症状：①剧烈腹痛或腰胁痛伴肾区叩击痛；②肉眼血尿（几乎均有镜下血尿）；③肾病患儿突发大量蛋白尿；④肾功能突然恶化（双侧受累）；⑤发热；⑥病程长者高血压、肾性糖尿、远端肾小管酸中毒。慢性小血栓占75%常无症状。\n实验室：90%血小板进行性减少；D-二聚体升高、纤维蛋白原降低、ATⅢ下降。\n检查：彩色多普勒超声（国内首选）；CT血管造影（敏感性特异性近100%，国外首选）；选择性肾静脉造影是金标准（有创，不常规）。' },
{ m: '28U', q: 'RVT的治疗与预后？', a: '治疗包括原发病治疗、一般对症、抗凝及溶栓。\n①抗凝：肝素为首选（静脉注射首剂50U/kg，以后每4小时50–100U；或静滴1mg/kg/d，2–4周一疗程），APTT维持正常对照1.5–2.5倍；低分子量肝素（那屈肝素钙0.01ml/kg，q12h，疗程≤10天）；病情好转转口服华法林（首日0.2mg/kg，维持INR 2.0–2.5，疗程3–6个月）。NS患儿ATⅢ缺乏可致肝素抵抗，必要时补充ATⅢ。出现症状后2小时内给抗凝药最有效。\n②溶栓：尿激酶（3–6）万U/d，1–2周一疗程；美国血液病协会仅推荐用于危及生命或器官功能时，不作预防。\n③抗血小板：双嘧达莫5–10mg/(kg·d)、阿司匹林小剂量1–3mg/(kg·d)。\n④介入：局部溶栓、取栓、滤器置入。\n预后：新生儿不及时治疗死亡率可高达95%，综合治疗已降至20%以下。急性RVT可使单纯性肾病转化为难治性肾病；肺栓塞常见（小儿多为无症状）。' },
{ m: '28U', q: '肾血管性高血压（RVH）的病因、诊断与治疗？', a: '流行病学：占儿童高血压5–10%，占继发性高血压5–25%；26–70%无临床症状。\n诊断标准：①间隔2–4周、不同时间3次以上血压≥同年龄性别身高第95百分位；②影像显示肾动脉主干或主要分支狭窄≥50%。\n病因：肾动脉肌纤维发育不良（重要原因，特发性非炎症）、多发性大动脉炎（非白种人常见）、肾动脉血栓/栓塞/瘤、神经纤维瘤病、肾移植后狭窄。\n机制：RAAS激活——肾缺血→球旁细胞分泌肾素→AⅡ（升压作用比去甲肾上腺素强10倍）+醛固酮。AⅡ受体AT1R（17号染色体）、AT2R（X染色体）。\n临床表现：枕部头痛、眩晕，重症高血压脑病（有惊厥者高达25%）；约50%腹部血管杂音；下肢血压>上肢血压；眼底改变分4度。\n筛选：超声（一侧肾长径<对侧1.5cm以上提示单侧狭窄；Doppler敏感度84–100%）；周围PRA（<5ngAI/(ml·h)基本可除外）；分侧肾静脉PRA比值≥1.5:0有意义；卡托普利试验敏感性特异性均90%。\n确诊：肾动脉造影是金标准；CTA敏感度96%/特异度97%；MRA敏感性特异性90%以上（中重度肾衰慎用）；卡托普利肾动态显像。\n治疗：介入PTRA（儿童主张球囊扩张为主，FMD疗效好；指征：狭窄≥70%、跨狭窄收缩压差>20mmHg）；手术（伴闭塞或动脉瘤者）；药物：儿童肾性高血压首选ACEI/ARB（双侧肾动脉狭窄禁用！单侧可用但需评估健侧肾功能），二线CCB或利尿剂；β受体阻滞剂多用于联合，不作初始；高肾素时不宜用利尿剂。' },
{ m: '28V', q: '下尿路功能障碍（LUTD）的定义、分类与主要类型？', a: '定义：存在明显下尿路症状（LUTS）但无相关神经学或解剖学异常；学龄期发病率高达21.8%。若伴神经病变（脊膜膨出、脊髓栓系等）归神经源性膀胱；伴尿路解剖异常（尿道瓣膜等）超出LUTD范畴。\n尿动力学分4型：\n①特发性逼尿肌过度活跃（IDOD）：逼尿肌过度活跃，排尿时盆底EMG安静，滞后时间<1秒。\n②机能失调性排尿（DV）：排尿时EMG活跃（括约肌不松弛），断续排尿、排尿时间延长；无神经损伤者=非神经源性DV。\n③不能充分运用逼尿肌（DUD）：自主减少排尿，膀胱容量增大，排尿时EMG安静。\n④原发膀胱颈功能失调（PBND）：膀胱颈开放受损，EMG滞后时间>6秒，最主要症状排尿等待。\n主要类型：膀胱过度活动症（OAB）——尿急为核心症状，是仅次于遗尿的第二常见LUTD，典型特殊尿姿势=文森特屈膝礼；延迟排尿与膀胱活动低下；DV；PBND；咯咯笑尿失禁（几乎只发生于女孩）；阴道排尿（女孩日间漏尿常见原因，两腿外展前倾姿势纠正）。\n相关综合征：肠道膀胱功能障碍（BBD/DES）=便秘+LUTD；Hinman综合征（非神经源性神经性膀胱）表现最严重，半数伴外括约肌区尿道狭窄和严重VUR。' },
{ m: '28V', q: 'LUTD的评估与治疗原则？', a: '评估：\n①排尿日记是最有用的诊断工具。\n②尿常规（必做）；尿培养。\n③无创尿流率+盆底肌电图（判断逼尿肌-括约肌协调性；Qmax约等于排尿体积的平方根）。\n④盆腔超声：测膀胱容量、排尿后残余尿；膀胱壁增厚提示慢性尿潴留。\n⑤Bristol粪便量表。\n⑥VCUG和尿动力检查：LUTS严重且持久者。\n⑦腰骶椎MRI：神经检查异常时除外神经源性膀胱。神经系统检查重点：肛周反射、球海绵体反射（骶反射弧S2–S4）。\n治疗：首先非手术——行为矫正、生物反馈、盆底肌训练（Kegel）、生活方式调整（减少咖啡因/碳酸饮料/柑橘/巧克力等刺激性食物）、定时排尿、治疗便秘。\n药物：OAB用抗胆碱能药（奥昔布宁2.5–5mg每日3次）；PBND用α受体阻断药放松膀胱颈；DV通过学会放松盆底肌改善。\n并发症：UTI（DV和膀胱活动低下致排空不全者风险高）；VUR（LUTD使VUR缓解延迟、手术失败率增加）。' },
{ m: '28W', q: '遗尿症的定义、病因机制与分型？', a: '定义：夜间睡眠中无意识排尿。中国共识（2014）：年龄≥5岁，平均每周至少2次夜间不自主排尿并持续3个月以上（大年龄儿童次数标准可放宽）。\n患病率：中国5–18岁总体4.8%（幼儿园12.1%、小学5.1%、初中1.1%、高中1.4%）。每年约15%自发缓解。\n三大发病机制：\n①睡眠觉醒障碍：脑觉醒中枢发育延迟，觉醒阈值升高；\n②夜间多尿（NP）：夜间尿量超过预期膀胱容量（EBC）的130%，与夜间ADH分泌不足、尿液浓缩功能异常有关；EBC=（年龄+1）×30ml；\n③膀胱功能障碍：功能性膀胱容量减少、逼尿肌不稳定、尿道括约肌盆底肌协调障碍。\n分型：\n按症状分：单症状性夜遗尿（MNE，仅夜间遗尿）与非单症状性（NMNE，伴日间下尿路症状）。\n按时程分：原发性（自幼遗尿、无6个月以上不尿床期）与继发性（曾有≥6个月不尿床期后再次出现）。' },
{ m: '28W', q: '遗尿症的治疗方案？', a: '①基础治疗（所有患儿）：病情评估+宣教+行为训练——调整饮水饮食习惯、日间膀胱功能训练、规律作息、规范排尿行为、保证睡眠；排除治疗诱因（便秘、UTI、高钙尿症、腺样体肥大等）。\n②去氨加压素（DDAVP）：国际儿童尿控协会推荐一线药物，模拟ADH浓缩夜尿。0.2mg/次睡前1小时服，夜间限制饮水，3个月一疗程，逐渐停药减少复发。\n③唤醒训练：定时唤醒+遗尿报警器（尿湿报警器），同为一线治疗。\n④抗胆碱能药（奥昔布宁、托特罗定、索利那新）：抑制逼尿肌过度活动，增加膀胱容量；排除神经源性膀胱后可与DDAVP联用。\n⑤中医药、生物反馈及控尿功能训练（跳绳、蛙跳、Kegel训练）：适用于膀胱尿道功能紊乱者。\n原则：分级诊疗、定期随诊、减少复发。' },
{ m: '28X', q: '儿童尿路结石的病因类型、临床表现与治疗？', a: '特点：占尿路结石2.0–4.3%，主要为上尿路结石；成分以磷酸钙、草酸钙最常见，尿酸和嘌呤结石为透光结石。\n病因类型：\n①钙性结石（最常见）：高尿钙（正常上限4mg/(kg·24h)或尿钙/肌酐>0.25）；原发性高草酸尿症4–5岁前形成肾结石及肾钙化，进行性致肾衰。\n②胱氨酸结石（约1%）：肾小管对胱氨酸等重吸收不良的遗传缺陷。\n③继发性结石：尿路梗阻、感染（细菌尿素酶分解尿素→磷酸镁铵结石）。\n④尿酸结石（5–10%）：透X线，高尿酸+尿量少+持久酸性尿；Lesch-Nyhan综合征、G-6-PD缺乏、短肠综合征、肿瘤。\n⑤酶代谢缺陷：发病早（2–3岁），原发性高草酸尿症、黄嘌呤尿（常隐，血尿酸<1mg/dl）。\n临床表现：血尿（活动后）、腰腹或腹股沟疼痛；膀胱尿道结石多见4岁以下——排尿困难疼痛、尿中断、手牵拉阴茎、脱肛；双侧输尿管梗阻可急性无尿（三聚氰胺相关结石）。\n诊断：腹部X线平片（含钙结石）、超声（强回声伴声影，敏感性特异性均高）、CT。\n治疗：大量饮水为基础；调节饮食；碱化尿液（胱氨酸结石pH>7.5）；别嘌醇降尿酸。ESWL、PCNL、输尿管镜；先天性梗阻者开放/腹腔镜手术。' },
{ m: '28X', q: '神经源性膀胱的病因、检查与治疗原则？', a: '定义：神经系统调控紊乱导致的下尿路功能障碍，须有神经病变前提。常见病因：脊膜膨出/脊髓脊膜膨出（最常见）、椎发育不良（骶椎缺损）、脊髓肿瘤、椎体骨髓炎、外伤或医源性损伤、感染（横断性脊髓炎多暂时性、预后好）。\n临床表现：充盈性尿失禁（大量残余尿200–300ml）、肛门松弛、马鞍形麻痹；上尿路损害可致肾功能不全、贫血、高血压。\n检查：静脉尿路造影（生后6–8周即可，以后每年1次）；排尿性膀胱尿道造影（膀胱塔松状、憩室、伴VUR）；超声随访每3–6个月；尿动力学检查是分类诊治基础（新生儿期即应常规）。膀胱容量估算=（年龄+2）×30ml；膀胱储尿期压力一般应<15cmH₂O，逼尿肌漏尿点压力>40cmH₂O明显增加上尿路损害危险。\n治疗：首要目标保护肾功能（低压贮尿+良好排空），其次控尿。\n①CIC清洁间歇导尿：基本治疗、首选（金标准组合=奥昔布宁+CIC）；\n②药物：奥昔布宁最常用（叔胺类M受体阻滞剂，12月内0.1mg/kg tid，1岁以上0.1–0.2mg/kg tid，>5岁缓释片5mg/d起最大20mg/d）；\n③BTX-A膀胱壁注射（5–12U/kg，最大300U）；\n④膀胱扩大术（CIC+抗胆碱无效、压力仍高者；术后10年开始肿瘤监测）；\n⑤输尿管再植（单纯抗反流手术多徒劳，须同时解决膀胱高压）；⑥可控性尿流改道（Mitrofanoff）；⑦膀胱颈/出口手术。' },
{ m: '28X', q: '睾丸扭转的临床表现、鉴别与治疗？', a: '病因：精索扭转致睾丸附睾血流障碍梗死坏死；扭转部位三处：鞘膜外（新生儿多见，睾丸及鞘膜均梗死）、鞘膜内（青少年，系膜过长）、睾丸与附睾之间。\nWatson经验：新生儿左侧扭转多顺时针、右侧逆时针。\n临床表现：突发局部剧痛向腰腹放射，恶心呕吐发热；阴囊皮肤充血水肿发热；提睾肌痉挛精索短缩→睾丸被提至阴囊上部（位置升高）；阴囊透光呈蓝色（蓝斑征）。新生儿及小婴儿常无痛苦，睾丸增大变硬无压痛，阴囊内容物粘连。\n鉴别：\n①睾丸及附睾炎：发病缓慢，托起阴囊疼痛减轻（Prehn征）；睾丸扭转移动或提起阴囊疼痛加重。\n②睾丸肿瘤：无疼痛。\n③嵌顿疝。\n超声观察睾丸实质血流灌注是最准确的诊断与鉴别方法（扭转时血流消失或减少）。\n治疗：确诊后立即手术，扭转后4–6小时内睾丸尚有保留希望（时间+扭转度数决定存活）。复位+睾丸固定于阴囊壁；已坏死则切除；一侧坏死切除者可同时固定对侧。2小时内无法手术可尝试手法复位（握住睾丸顺时针旋转，不成功则反方向；复位成功疼痛瞬间减轻），但即使成功也必须手术探查固定防复发。\n睾丸附件扭转：米勒管残留体，10–14岁多见，症状较轻，睾丸上端豆大压痛肿物+蓝斑征；明确者可保守，不能区分时积极探查。' },
];
