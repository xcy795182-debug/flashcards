const CARDS_CH32 = [
{ m: '32A', q: '遗传病的分类与流行病学数字？', a: '遗传病分四类：①单基因遗传病——由一对等位基因控制，遵循孟德尔遗传规律，目前已知7000余种，总发病率约2%；②多基因遗传病——由多对基因控制，每个基因作用微小但有累加效应，同时受环境因素影响，人群总发病率15%~20%；③染色体病——染色体数目或结构异常所致，新生儿发病率约0.5%；④线粒体遗传病——由线粒体DNA突变所致。\n出生缺陷（先天畸形）总发生率约5.6%。\n各类遗传病总的发病率：染色体病新生儿约0.5%，单基因病约2%，多基因病15%~20%；把三者合计，遗传病的总发病率约20%~25%。\n每个人均携带约6个隐性有害基因（近亲婚配时后代患病风险明显增大即源于此）。' },
{ m: '32A', q: '染色体的形态结构与显带技术要点？', a: '形态结构：染色体由两条姐妹染色单体组成，经着丝粒相连；着丝粒将染色体分为短臂（p）和长臂（q）；短臂末端有随体（通过随体柄与短臂相连，随体柄部为核糖体RNA基因所在处，即核仁组织者区）；染色体末端为端粒（由重复DNA序列构成，保护染色体末端免于降解和融合）。\n核小体：染色质基本结构单位，由核心颗粒（组蛋白八聚体H2A、H2B、H3、H4各两分子）加外围缠绕约146bp DNA组成。\n显带：用胰蛋白酶等处理染色体后 Giemsa 染色得到G带；中期染色体G带约400~550条带，分辨率5~10Mb。\n核型书写：先写染色体总数，再写性染色体组成，如46,XX（正常女性）、46,XY（正常男性）。\n常用细胞分子技术：①FISH（荧光原位杂交）——用荧光标记的DNA探针与中期染色体或间期核杂交，可检测微小缺失、重复、标记染色体来源；②CMA（染色体微阵列，芯片）——全基因组高分辨率检测CNV（拷贝数变异），分辨率可达几十kb；③MLPA（多重连接探针扩增）——检测特定基因外显子缺失重复；④CNV-seq（低深度全基因组测序）——检测CNV。' },
{ m: '32A', q: 'DNA与基因的结构要点？', a: 'DNA：双螺旋结构，两条链碱基互补配对（A-T、G-C），方向相反（一条5′→3′，另一条3′→5′）；真核生物DNA与组蛋白组成核小体形成染色质。\n重复序列按长度：①卫星DNA——大段高度重复序列，位于着丝粒区；②小卫星DNA（VNTR）——重复单位较长，高度多态，可用于DNA指纹/连锁分析；③微卫星DNA（STR）——重复单位2~6bp，分布广泛、高度多态，是目前最常用的遗传标记。\n基因：编码蛋白质或功能RNA的DNA片段，由外显子（编码序列）和内含子（非编码序列）交替组成；内含子5′端起始碱基几乎均为GT、3′端均为AG（GT-AG法则，RNA剪接识别位点）；基因还包括启动子、增强子等调控序列。\n顺式作用元件：位于基因旁侧、只调控同一条DNA链上基因表达的序列（启动子、增强子、沉默子）；反式作用因子：由远处基因编码、可扩散结合调控序列的蛋白质（转录因子）。' },
{ m: '32A', q: 'DNA复制与基因表达（中心法则）的要点？', a: 'DNA复制：半保留复制——每条亲代链作为模板合成新链，子代DNA含一条旧链一条新链；复制时一条链连续合成（前导链，5′→3′），另一条不连续合成冈崎片段再连接（后随链），即半不连续复制；复制具有高度保真性（3′→5′外切酶校读）。\n基因表达：①转录——以DNA一条链为模板合成mRNA（真核生物转录后需剪接去除内含子、加5′帽和3′polyA尾）；②翻译——mRNA上每3个相邻核苷酸构成1个密码子，共64个密码子：61个编码氨基酸（其中AUG兼作起始密码子）、3个终止密码子（UAA、UAG、UGA）；tRNA携带氨基酸按密码子顺序在核糖体上装配成多肽。\n中心法则：DNA→RNA→蛋白质（逆转录病毒的逆转录为RNA→DNA，是对中心法则的补充）。' },
{ m: '32A', q: '基因表达调控的层次与表观遗传机制？', a: '调控层次：①转录水平（最重要）——转录因子与启动子/增强子结合、顺式作用元件与反式作用因子相互作用；②转录后水平——mRNA剪接、编辑、稳定性；③翻译水平——翻译起始调控；④翻译后水平——蛋白质修饰（磷酸化、糖基化）、降解。\n表观遗传（不改变DNA序列的可遗传调控）：①DNA甲基化——主要发生在CpG二核苷酸中的胞嘧啶（形成5-甲基胞嘧啶），启动子区CpG岛高甲基化通常使基因沉默；②组蛋白修饰——组蛋白乙酰化使染色质松散、促进转录（组蛋白乙酰转移酶HAT催化），去乙酰化使染色质致密、抑制转录；③染色质重塑；④非编码RNA——miRNA（微小RNA，约18~25bp）与靶mRNA互补结合促其降解或抑制翻译；siRNA、lncRNA等。' },
{ m: '32A', q: '人类基因组作图的两种图谱？', a: '①遗传连锁图（linkage map）——以遗传重组率作为图距，单位厘摩（cM），1%重组率=1cM；标记的代际传递：第一代RFLP（限制性片段长度多态性）→第二代STR（短串联重复，微卫星）→第三代SNP（单核苷酸多态性）；连锁图反映基因/标记的相对位置。\n②物理图（physical map）——以实际物理距离（bp、kb、Mb）为图距；常用标记STS（序列标签位点）；人类基因组计划将两种图谱整合完成全基因组测序。\nHapMap（国际人类基因组单体型图计划）：构建人类基因组常见SNP的单体型图谱，用于疾病关联研究和药物基因组学。' },
{ m: '32A', q: '基因突变的类型与影响因素？', a: '突变类型：\n①点突变（碱基替换）——转换（嘌呤换嘌呤或嘧啶换嘧啶）/颠换（嘌呤换嘧啶或反之）；对编码序列的影响分：同义突变（密码子改变但氨基酸不变）、错义突变（氨基酸改变）、无义突变（变为终止密码子，肽链提前终止）、终止密码子突变（终止密码变为氨基酸密码子，肽链延长）、剪接位点突变（破坏GT-AG保守序列致剪接异常）；\n②移码突变——插入或缺失非3的倍数的核苷酸，下游阅读框全部改变，后果通常严重；\n③动态突变——三核苷酸重复序列拷贝数在世代传递中不断增加（如脆性X、亨廷顿病、强直性肌营养不良）；\n④缺失、插入、重复——较大片段的DNA改变；\n⑤染色体水平畸变（见染色体病）。\n突变率：自然突变率约10⁻⁶（每基因每世代）；CpG二核苷酸是突变热点（胞嘧啶甲基化后易脱氨变成胸腺嘧啶）。\n影响因素：父龄效应——父亲年龄大，精子形成过程中突变累积，常染色体显性遗传病（如软骨发育不全、Apert综合征、Marfan综合征）随父龄增长发病率升高；母龄效应——母亲年龄大，卵细胞减数分裂染色体不分离率升高，染色体病（尤其21三体）发病率随母龄增长明显升高。' },
{ m: '32A', q: '遗传基本规律（三大定律）的内容？', a: '①分离律（孟德尔第一定律）——成对遗传因子在形成配子时彼此分离，各进入一个配子；每个个体的一对等位基因一个来自父方一个来自母方。\n②自由组合律（孟德尔第二定律）——非同源染色体上的非等位基因在形成配子时自由组合。\n③连锁互换律（摩尔根）——位于同一条染色体上的基因彼此连锁遗传，减数分裂时同源染色体非姐妹染色单体之间可发生交换（互换），使连锁基因重组；基因间距离越远，互换率越高（连锁图图距即据此厘摩计算）。' },
{ m: '32A', q: '遗传与环境相互作用的概念（反应规范、表现度、外显率、致畸敏感期）？', a: '①反应规范（norm of reaction）——同一基因型在不同环境条件下可形成不同表型的范围，即基因型决定了对环境反应的规范。\n②表现度（expressivity）——在已表达表型的个体中，表现的程度轻重不一（量的差异）；受修饰基因和环境影响。\n③外显率（penetrance）——群体中携带致病基因并表现出相应表型的人数百分率（质的概念，有或无）；外显不全时可呈隔代遗传。注意：外显率是“是否表现”，表现度是“表现轻重”，两者概念不同。\n④致畸敏感期——胚胎发育第3~8周（妊娠前3个月内）是器官形成期，对致畸因子最敏感，此期受有害环境因素（药物、辐射、感染等）影响最易发生先天畸形。' },
{ m: '32B', q: '常染色体显性遗传（AD）的特点、举例与特殊遗传现象？', a: 'AD特点：①致病基因位于1~22号常染色体，男女患病机会均等；②垂直传递——连续几代中都有患者；③患者双亲之一为患者（双亲无病者一般为新生突变所致）；④杂合子即可发病；⑤患者同胞患病风险50%；双亲均患同病时子女风险75%。\nAD常见举例：多指（趾）/并指（趾）、成骨不全（COL1A1/COL1A2）、软骨发育不全（FGFR3）、Marfan综合征（FBN1）、Huntington舞蹈病（HTT，延迟显性，35岁后发病）、神经纤维瘤病Ⅰ型（NF1）、结节性硬化症（TSC1/TSC2）、Noonan综合征（PTPN11）、遗传性球形红细胞增多症、成人型多囊肾（PKD1/PKD2）、腓骨肌萎缩症（CMT1B，MPZ）。\nAD特殊遗传现象：①完全显性——杂合子Aa与纯合子AA表型完全相同（如亨廷顿病），占少数；②不完全显性（半显性）——杂合子与纯合子表型严重程度不同（如成骨不全：纯合AA婴儿期可死亡，杂合Aa轻者仅蓝色巩膜），多数AD属此；③共显性——杂合子两种等位基因作用都表现，无显隐之分，如ABO血型（复等位基因Iᴬ、Iᴮ、i；Iᴬ与Iᴮ共显性、对i均为显性，6种基因型只显4种表型A、B、AB、O）；④延迟显性——杂合子致病基因早期不表达，到一定年龄才发病（亨廷顿病35岁后）；⑤不规则显性——携带同一致病基因的不同个体有的发病有的不发病，取决于外显率（如多指外显率75%）。' },
{ m: '32B', q: '常染色体隐性遗传（AR）的特点与举例？', a: 'AR特点：①致病基因位于常染色体，男女患病风险均等；②纯合子或复合杂合子（一对等位基因突变位点不同）才发病，杂合子为携带者，无异常表型但可将致病基因传给子代；③系谱中水平分布——患者出现在同胞中，亲代和子代不发病，常散发或隔代出现；④双亲均为携带者时：子女患病风险25%、携带者50%、完全正常25%；⑤近亲婚配时后代风险明显增大（每个个体携带约6个隐性有害基因）。\nAR常见举例（多为代谢病）：苯丙酮尿症（PAH，12q23.2）、甲基丙二酸尿症、白化病（TYR）、肝豆状核变性（ATP7B，角膜K-F环）、先天性肾上腺皮质增生症（CYP21A2）、脊肌萎缩症Ⅰ型（SMN1）、Friedreich共济失调（FXN）、GM1/GM2神经节苷脂贮积症、Hurler综合征、Gaucher病（GBA）、囊性纤维化（CFTR，白种人高发）、半乳糖血症、糖原贮积症、范科尼综合征、Crigler-Najjar综合征。' },
{ m: '32B', q: 'X连锁遗传的共同特点、X连锁显性遗传（XD）与X连锁隐性遗传（XR）的特点及举例？', a: 'X连锁遗传共同特点：①男性为半合子——男性只有一条X，X上致病基因无论显隐均表达而致病；②交叉遗传——男性X连锁基因只能来自母亲并传给女儿，无男传男现象；③女性杂合子表达有差异——与X染色体随机失活（Lyon化）有关。\nXD特点：①患病群体中女性患者比男性多近一倍，女性病情相对较轻；②患者双亲中必有患者；③男性患者的女儿全部患病、儿子全部正常（父传女）；④女性杂合子患者子女患病风险各50%；⑤连续传递。举例：抗维生素D性佝偻病（低磷酸盐血症性佝偻病，PHEX基因Xp22.1）、Alport综合征（COL4A5）、鸟氨酸氨甲酰基转移酶缺乏症（OTC）、Rett综合征（MECP2，Xq28，男性胚胎致死）。\nXR特点：①患病群体中男性远多于女性，系谱中往往只见男性患者；②双亲无病时儿子可患病（母亲为携带者），女儿不患病但有50%可能为携带者；③男性患者的兄弟、外祖父、姨表兄弟、外甥、外孙可能为患者（交叉遗传表现）；④女性患者罕见——若女性为患者，其父亲一定是患者、母亲为携带者或患者。举例：Duchenne肌营养不良（DMD，Xp21，3~4岁走路笨拙、Gower征、腓肠肌假性肥大，20岁失去独立生活能力）、血友病A/B（F8/F9）、Lesch-Nyhan综合征（HPRT1，自残）、G-6-PD缺乏症、Menkes综合征（ATP7A）、肾上腺脑白质营养不良（ABCD1）、Hunter综合征。\nY连锁遗传：致病基因位于Y染色体，随男性传递，女性不患病；主要有SRY基因（睾丸决定因子）、外耳道多毛等。' },
{ m: '32C', q: '多基因遗传的基本概念（微效基因、数量性状、易患性、阈值、遗传度）？', a: '多基因遗传（多因子遗传）：遗传性状或疾病由两对以上多对基因共同作用，基因间无显隐性、为共显性，每对基因作用微小称微效基因，各对基因有累积效应称累加基因；同时受环境因素影响，故又称复杂疾病。\n数量性状：多基因遗传的性状在群体中的分布是连续的、有一个峰（平均值），个体间差异是量的变异；相对于单基因遗传的质量性状（有或无）。\n易患性（liability）：遗传因素与环境因素共同决定个体患多基因病的可能性；在群体中呈正态分布。\n易感性（susceptibility）：特指由遗传因素决定的患病风险（区别于易患性含环境因素）。\n阈值（threshold）：决定多基因病发病的最低易患性界限——个体易患性超过阈值即发病；一般群体和患者一级亲属的易患性均呈正态分布，患者一级亲属的分布曲线整体右移（平均值高于群体）。\n遗传度（heritability）：多基因病形成中遗传因素所产生影响的程度，用%表示；遗传度越大遗传因素贡献越大、环境因素作用越小。常见多基因病遗传度：唇腭裂、先天性幽门狭窄、先天性髋关节脱位、幼年型糖尿病、支气管哮喘、精神分裂症约70%~80%；无脑儿、脊柱裂、马蹄内翻足、冠心病、原发性高血压约60%~70%；各型先天性心脏病、成年型糖尿病、消化性溃疡不足40%。\n多基因遗传病同胞发病率远比单基因遗传低，约1%~10%。' },
{ m: '32C', q: '多基因病再发风险的估计方法与规律？', a: '估计方法：①Edward公式——一级亲属再发风险f=群体发病率P的平方根（f=√P）；如唇裂我国人群发病率1.7‰，一级亲属风险=√0.0017≈4%；此法对群体患病率高于10%或低于0.1%者不准确；②直接查阅常见多基因病再发风险值表（唇腭裂群体0.17%、一级亲属4%、遗传度76%、男:女1.6:1；先天性幽门狭窄0.3%、男2%/女10%、男:女1:5；先天性巨结肠0.02%、遗传度80%、男:女1:4；脊柱裂0.2%、一级亲属4%；先心病0.5%、2.8%；哮喘4%、一级亲属20%；精神分裂症1%、10%；高血压4~8%、15~30%）；③Smith表格——已知遗传度、群体患病率及双亲/同胞中患者数时查表估计；④已知群体患病率、一级亲属患病率、遗传度三者之二，可按三者关系图检索第三者。\n一般规律：①一级亲属再发风险约2%~10%，与群体患病率正相关；②再发风险有性别差异——发病率低的性别其亲属再发风险反而高（如先天性幽门狭窄男多女少、先天性巨结肠男多女少；先天性髋关节脱位女多男少）；③同卵双生子同病率21%~63%（远低于100%但远超异卵，说明环境起作用）；④同一家系中患者越多再发风险越高——如一对父母有1例单侧唇腭裂孩子再发风险4%，有2例者增至10%；⑤病情越重再发风险越高——如先天性巨结肠受累肠段长者比短者风险高。\n注意这些规律不符合孟德尔遗传比例。' },
{ m: '32C', q: '线粒体DNA（mtDNA）的结构与遗传特点？', a: '结构：人类mtDNA全长16569bp，双链闭环分子；外环为重链H（G含量高），内环为轻链L（C含量高）；含37个编码基因：13个氧化磷酸化酶亚基多肽链、22个tRNA、2个rRNA；重链分布28个基因、轻链9个基因；基因连续编码、无内含子；含1122bp的D环（不编码，为重链复制起始点及轻、重链转录启动子所在，具调控功能）。一个线粒体内有2~10余个拷贝mtDNA，一个细胞含数百至数千个mtDNA（大多数体细胞500~10000个，含量与细胞能量需求有关）。\n遗传特点：①母系遗传——受精卵中线粒体全部来自卵子；②不均等有丝分裂（复制分离）——mtDNA在减数分裂和有丝分裂中随机分配，母亲突变mtDNA经随机进入子细胞，使子代不同细胞、不同组织突变比例不同（亲代与子代之间可产生差异）；③同质性与异质性——同一细胞全部mtDNA相同（全突变或全野生型）为同质性；突变型与野生型共存为异质性；异质细胞中突变mtDNA达到一定比例才出现功能障碍，称阈值效应——阈值依赖受累细胞/组织的能量需求，高能量需求的脑、骨骼肌、心脏、肝脏最易受影响；④mtDNA突变率比核基因高10~20倍（缺乏组蛋白和内含子保护、无有效修复系统、复制不对称产生的单链DNA易自发脱氨基、处于高超氧化物环境）；⑤突变可在体细胞中积累，随年龄增长发展为均质性突变。' },
{ m: '32C', q: 'mtDNA突变的类型与儿科常见线粒体病？', a: '突变类型：①点突变——发生于蛋白质编码序列引起错义突变（如Leber遗传性视神经病LHON）；发生于tRNA/rRNA基因则影响mtDNA编码全部肽链的翻译，致呼吸链多种酶合成障碍（典型：MERRF、MELAS）；②缺失或插入——缺失多见，常无家族史，缺失片段较大（如Kearns-Sayre综合征）；③mtDNA拷贝数突变——拷贝数大大低于正常，少见（致死性婴儿呼吸障碍、乳酸酸中毒等）。\n儿科常见线粒体病（表32-11）：\n①Leigh亚急性坏死性脑脊髓病——突变m.3243A>G（MT-TL1）、m.8344A>G（MT-TK）、m.8993T>G/C（MT-ATP6）；共济失调、肌张力异常、发育迟缓或倒退、视神经萎缩、眼外肌麻痹，MRI基底节和脑干长T1长T2，血/尿/脑脊液乳酸、丙酮酸明显增高；约20%由mtDNA突变引起，余为一组核基因突变所致。\n②MELAS线粒体脑病-乳酸酸中毒-卒中样发作综合征——m.3243A>G（80%）；脑卒中样偏瘫、构音障碍、脑病、偏头痛样发作、皮质盲、惊厥，RRF(+)；MRI卒中样发作时枕区长T1长T2、后期脑萎缩。\n③MERRF肌阵挛性癫痫伴破碎红纤维综合征——m.8344A>G（80%）；儿童期发病，肌阵挛癫痫、小脑共济失调、智能减退、听力视力减退、周围神经病，RRF(+)。\n④KSS线粒体缺失综合征——最常见缺失m.8470-13446del4977bp；视网膜色素变性、进行性眼外肌麻痹（PEO）、上睑下垂、复视、心脏传导阻滞、智力减退、小脑共济失调；血氨高。\n⑤进行性眼外肌麻痹PEO——主要眼部症状，重症发展成KSS。\n⑥Pearson综合征——2岁内发病，铁粒幼细胞贫血、胰腺外分泌功能异常；存活至10岁后出现KSS。\n注：呼吸链5种酶复合物由mtDNA和核基因共同编码，核基因突变也可产生线粒体病表型，使遗传学病因诊断困难。' },
{ m: '32C', q: '非经典孟德尔遗传包括哪些？X染色体失活（Lyon假说）的要点与遗传学意义？', a: '非经典孟德尔遗传：动态突变（三核苷酸重复扩增）、基因印记、单亲二体、表观遗传机制。\nLyon假说要点：①雌性哺乳动物体细胞两条X染色体中有一条没有遗传活性；②失活是随机的——可来自父亲也可来自母亲；③失活发生在胚胎早期（始于桑葚胚期，约合子后64~100细胞阶段即孕16天完成），一旦发生，由该细胞繁衍的子细胞都保持同一条失活X染色体（Lyon化）；④女性体细胞间期可见失活X异固缩于核膜内缘，为深染的Barr小体；⑤女性进入性成熟期后，处于失活状态的X在初级卵母细胞进入减数分裂时恢复活性（故桑葚胚期之前女性两条X均有活性）。\n调控：X失活受Xq13失活中心（XIC）调控；XIST基因（Xq13.2，长非编码RNA，编码约19kb非翻译RNA）由即将失活的X表达，大量积聚并包裹该X染色体，启动失活；TSIX为XIST的反义抑制子；组蛋白修饰、CpG甲基化、染色质结构蛋白均参与。约15%的X连锁基因逃避失活而保留转录活性；X短臂和长臂末端的假常染色体区（PAR）为双等位基因表达。\n遗传学意义：①基因剂量补偿——男女X连锁基因表达趋于平衡；②嵌合体——女性随机失活使体内部分细胞母源X有活性、部分细胞父源X有活性，表型取决于两种细胞群的比例；③失活偏斜（skewed X-inactivation）——X发生缺失/重复时该X常处于失活状态，X与常染色体易位时衍生染色体保持活性而正常X失活；Rett综合征、DMD女性携带者患病均认为与失活偏斜有关；对累及X染色体的遗传病，分析X失活是否偏斜有助于临床表型分析。' },
{ m: '32D', q: '遗传病诊断的临床线索（症状与体征）有哪些？', a: '多数儿科遗传病以发育障碍就诊，共同线索：\n1.全身情况——发育迟缓：身高体重生长落后，运动发育里程碑延迟，智力发育障碍。\n2.头面部——头颅畸形（小头、大头、舟状头、方颅、枕骨扁平、窄前额、中面部发育不良）；发际过高或过低；眼部异常（眼距宽、眼球内陷或突出、内眦赘皮、小眼球、眼角上斜或下斜、眼睑下垂、虹膜缺如、蓝巩膜、角膜混浊、白内障、斜视、眼球震颤）；耳部（低位耳、小耳/大耳、耳郭畸形、附耳、耳道闭塞、耳聋）；鼻（鼻梁低平、鼻根宽大、鼻孔前倾、后鼻孔闭塞）；口（唇腭裂、高腭弓、鲤鱼嘴、小口、齿龈畸形）。\n3.颈部——颈短、蹼颈。\n4.躯干——鸡胸、漏斗胸、盾状胸、脊柱裂、脊柱侧弯/前后凸、乳间距宽、乳房发育异常、内脏畸形和异位、疝。\n5.四肢和关节——短肢、肘内外翻、多指/趾、并指/趾、短指、蜘蛛指/趾、摇椅样足底、指/趾弯曲、关节运动受限、脱臼、过度伸展。\n6.皮肤——色素过多/过少和色素斑、角化过度、鱼鳞病、皮肤菲薄、光敏感、弹性异常、多毛、早秃、念珠发、易碎发、浅色发、无汗、皮肤纹理改变。\n7.生殖器官——两性畸形外观或发育不全、隐睾、小阴茎、尿道下裂、无肛畸形。\n8.新生儿期特殊信号——黄疸不退、长期腹泻、持续呕吐、肝脾大、呼吸困难、低血糖、酸中毒、高氨血症、电解质紊乱、惊厥、昏迷、身体或尿液特殊气味，常提示代谢异常（见遗传代谢病章）。\n诊断还需详细询问家族史并绘制家系图，帮助确定遗传方式。' },
{ m: '32D', q: '皮肤纹理（皮纹）检查的要点？', a: '皮纹（dermatoglyph）：表皮隆线形成的纹理；胚胎6~7周开始发育，至6个月左右完全形成，终身基本不变；形成受遗传因素影响，先天甚至后天疾病可改变其形态，是遗传病诊断的重要方法之一。观察部位：手指足趾远节掌面、手掌及跖部前端。\n指纹三种基本形态：弓形纹A（占1%~4%，甚少）、箕形纹L、螺形纹W；指纹中箕纹+螺纹合计占96%以上。\n掌线与atd角：大鱼际线与小鱼际线交汇处为轴三射（t）；t点至腕关节屈曲线距离占掌正中线全长（FM）15%以下为t（正常）、15%~40%为t′、40%以上为t″（异常）。atd角：连接a、t、d三点，正常45°以下；45°~56°为at′d、56°以上为at″d，均属异常，角度越大异常越著；小儿atd角估计法=49°-年龄，成人40°±6°。\n两条水平线关系五型：正常型（互不通连，常人85%~88%）、猿线/通贯手（两线合一贯通全掌，常人5%~8%）、过渡Ⅰ型桥贯手（有交通支，1%~8%）、过渡Ⅱ型叉贯手（线上有分支，0.4%~0.8%）、悉尼型/中贯手（一条贯通全掌，<1%）。\n异常皮纹表现：弓纹增多在4个以上且总纹数减少；女性螺纹增多；第4/5指为桡侧箕纹；第5指单一屈曲线（小指短而内屈仅一条屈曲线——常为唐氏综合征表现）；桡侧箕纹过多；第3指间区出现箕纹；轴t点成t′/t″或atd角>50°；双侧通贯手；足底球部胫侧弓状纹或S状弓纹；十指均尺侧箕纹；双侧中贯手；大小鱼际出现纹型。\n意义：异常皮纹常见于染色体畸变综合征（21、18、13三体、45,X、47,XXX、47,XXY、47,XYY、Wolf-Hirschhorn、cri-du-chat、18p缺失等），也见于Rubinstein-Taybi、Zellweger、Seckel综合征等；但皮纹异常无疾病特异性，不能单独诊断。' },
{ m: '32D', q: '遗传病的实验室诊断技术要点（核型分析指征、FISH、CMA、MLPA、Sanger、NGS等）？', a: '染色体核型分析：诊断染色体畸变重要手段；可取代分子方法诊断“不平衡”变异，但对平衡性结构变异无法取代；常用外周血淋巴细胞培养，必要时骨髓细胞或皮肤成纤维细胞。\n应做核型分析的情况：①发育迟缓或智力障碍，伴或不伴先天畸形；②出生缺陷累及两个或以上组织器官、不能特异地诊断或异常间互不关联无因果关系；③相关家族史：父母自然流产史、不孕、有学习困难或畸形的亲属、父母为染色体平衡畸变携带者；④性腺发育不良或两性畸形；⑤原发性闭经的女性与不育的男性；⑥青春期后特殊体态（身材过高/矮小、男性乳房发育等）。\n分子/细胞技术：①FISH——荧光标记探针检测亚显微缺失/重复（微缺失微重复综合征），间期细胞可快速诊断染色体数目异常；亚端粒区FISH可鉴定微小重排；②CMA染色体芯片（array CGH和SNP array）——全基因组高分辨率检CNV，用于多发畸形、发育迟缓、智力障碍、孤独症谱系病；不能检出平衡性重排；SNP array可检出杂合性丢失（LOH），诊断单亲二体；③MLPA——一个反应检测多种突变/多位点，用于缺失重复、点突变、甲基化；④CNV-seq——二代测序低深度检测CNV，费用低于CMA、通量高，缺点是可检出更多临床意义不明的CNV；⑤Southern印迹——经典技术，目前仍是脆性X综合征诊断金标准；⑥Sanger测序——单基因病诊断最常用、最准确，直接检出点突变或小片段缺失重复插入；⑦NGS二代测序——边合成边测序、大规模并行，数据量大成本低，可做panel、全外显子、全基因组测序，可检测低比例嵌合突变；缺点是有盲目性、检出大量无关变异和假阳性，阳性结果需Sanger验证。\n其他：PCR方法（常规/多重/等位基因特异/实时定量/RT-PCR）；RFLP；DHPLC（变性高效液相色谱筛突变）；生化检查与酶活性测定（血尿氨基酸、有机酸GC-MS/MS-MS串联质谱诊断氨基酸、有机酸、脂肪酸氧化缺陷和溶酶体贮积症）；免疫学检测；X线（骨骼受累、黏多糖贮积症等）；CT/MRI（颅脑脊髓畸形、脑白质病变）；脑电图（Rett、脆性X、Turner可有Rolandic区放电；Angelman综合征额枕区持续高波幅慢波棘慢波）；肌电图（神经肌肉病）；B超及超声心动。' },
{ m: '32D', q: '遗传咨询的内容、目的与指征？', a: '遗传咨询：帮助人们理解和适应遗传因素对疾病的作用以及遗传对医学、心理和家庭影响的过程；核心是分析和评估一个家庭内遗传病的发生或再发风险。儿科临床最常见指征：一对夫妇已生育过遗传病或畸形患儿，希望通过咨询和产前诊断再生育健康孩子——遗传咨询是一个家庭范围内预防严重遗传病患儿出生的最有效手段。\n内容：①通过分析家族史解释和评估疾病发生及再发风险率；②进行遗传方式、实验室检测方法、诊断、治疗及预防的教育，提供可获得帮助的渠道；③辅导促进知情选择、对再发风险的逐步认知接受以及采取最适当的决策。\n目的：使咨询者了解所患遗传病的本质、预后、随诊及处理；了解遗传方式和再发风险；了解防止发生或再发的可选方法（产前诊断、辅助生殖、避孕等）；采取咨询者或家属认为最可行的措施，改变或调节生活和健康。\n指征：①遗传筛查阳性者；②高龄孕妇（≥35周岁）；③曾怀孕过有遗传病或畸形的胎儿、生育过遗传病或畸形患儿；④父母或一方自身患遗传病；⑤反复自然流产、胎死宫内、不孕不育史夫妇；⑥染色体平衡易位、倒位携带者；⑦父母是遗传病基因携带者；⑧夫妇一方有遗传病家族史；⑨近亲婚配；⑩有外环境致畸物接触史。\n伦理与法律：遗传病终身影响的特性要求咨询中保护隐私、知情同意、非指令性原则（由家庭自主选择）。' },
{ m: '32E', q: '遗传病的治疗方式（饮食药物、酶疗法、外科疗法）？', a: '总原则：补充缺乏物质，避免和去除有害物质（环境工程）；或用人工方法改造修补缺陷基因（基因工程）。\n（一）饮食及药物疗法：①补充缺乏物质（补其所缺）——补充维生素、电解质、氨基酸、葡萄糖等代谢所需物质，或按病因针对性补充所需成分；②避免摄入有害物质（禁其所忌）——避免摄入或摄入后体内代谢产生过多无用/有害产物的物质；③排除过多有害物质（去其所余）——促排泄剂、螯合剂、代谢抑制剂、平衡清除法、换血或血浆置换/过滤等，物理化学方法排除过多毒物或抑制其生成。\n（二）酶疗法：①酶诱导——药物增强体内酶活性或合成，如苯巴比妥使肝葡萄糖醛酰转移酶活性增强，治疗Crigler-Najjar综合征、Gilbert综合征等新生儿黄疸；②酶补充——补充缺乏的酶：黏多糖贮积症Ⅰ型用Laronidase替代治疗（对非脑部症状有效）、黏多糖贮积症Ⅱ型（Hunter）无神经系统症状者用Idursulfase、Fabry病用agalsidase α/β，均被证明有一定疗效。\n（三）外科疗法：①脏器移植——从某种意义上讲移植脏器是单基因病的终极遗传学治疗：可代替脏器作用、产生酶和基因产物（激素、免疫物质、凝血因子等）维持正常代谢，或将蓄积物质分解排泄；临床肾、肝、脾、肺、心、胸腺等器官移植取代患病器官；器官来源困难是重大课题；②干细胞移植——造血干细胞已用于临床40多年，能分化成粒系和淋巴系，可用于一些早期溶酶体贮积症和脑白质营养不良患儿；体干细胞（造血干细胞和非造血来源）可否跨器官分化尚不肯定；人胚胎干细胞（hES，源于囊胚内细胞团的原始多能干细胞）是各种组织细胞起源，可用于定向分化修复组织器官（仍在研究阶段）；③矫形手术——矫正各种畸形、帮助恢复功能。' },
{ m: '32E', q: '基因治疗的概念、基本条件、策略与载体？', a: '基因治疗：利用载体介导将遗传物质转移到细胞内，纠正基因缺陷引起的临床表现。基本条件（符合才可进行基因治疗）：①疾病发病的分子机制及致病基因的分子结构清楚；②目的基因能被克隆、其表达调控机制已较清楚；③该基因可在体外和体内繁殖和表达；④有安全可靠的载体包装细胞系；⑤基因转移细胞有极好繁殖力并能在体内长期存活；⑥目的基因在受体细胞内能完整、稳定、剂量适当地整合和表达。\n基本策略：①基因修复——修复缺陷基因（目前尚无法做到）；②基因替代——去除整个异常基因以正常基因代替（目前也无法实现），多为此类研究；③基因抑制或失活——导入外源基因抑制异常基因表达；④基因增强——将目的基因导入异常细胞或其他细胞，使其表达产物补偿缺陷细胞功能，适于单基因隐性遗传病，是目前应用最多的策略；⑤重新开放已关闭的基因。\n两个目标：①生殖细胞基因治疗——将正常基因转入突变的生殖细胞使发育成正常个体且有害基因不再传给下一代，最理想的根治方法，但伦理学不被国际社会接受；②体细胞基因治疗——目的基因转入体细胞使症状消失或减轻，致病基因仍可传给下一代；最理想状态是将正常基因导入靶细胞内染色体特定基因座实现正确表达，目前染色体定位转移仍有很大困难。安全导入外源基因和正确高效表达是基因治疗的关键。\n基因转移方法：①物理法——显微注射（一次只能注射一个细胞）、电穿孔、微粒子轰击（金/钨颗粒吸附DNA高压导入）、脂质体法；②化学法——磷酸钙、DEAE葡聚糖等沉淀DNA微粒（转移效率低）；③生物学法——病毒载体（均经基因工程改造删除致病组分）：反转录病毒RV载体（RNA病毒，反转录为DNA整合入宿主基因组；转染效率高、稳定表达、宿主广；缺点容量小、可致细胞恶变；常用莫洛尼鼠白血病病毒Mo-MLV；慢病毒可感染不分裂细胞、效价高、表达时间长）、腺病毒AdV（双链DNA，缺失E1/E3不能自我包装需293细胞辅助；插入片段长、不需分裂靶细胞、原位感染、滴度高；一般不整合入宿主基因组减少插入突变危险；已用于肺、肝、CNS等，呼吸系统可反复滴注）、腺病毒相关病毒AAV（微小单链DNA，无病原性免疫原性，肌肉/肝脏/神经组织感染效率高、长期表达稳定；缺点容量小、不同血清型组织亲和性不同）。\n其他挑战：如何使输入基因表达水平达到改变表型的程度、不诱发宿主防御反应、减少整合性载体的插入突变、使被纠正的细胞有选择优势。' },
{ m: '32E', q: 'RNA修饰治疗、基因组编辑技术与SMA基因治疗的进展？', a: 'RNA修饰治疗（着眼于mRNA，抑制其表达或改变/增加其功能）：①反义寡核苷酸ASO——单链DNA 18~30bp，碱基互补结合目标mRNA降低基因表达，理论上过量表达突变蛋白的疾病均适用；②RNA干扰RNAi——自然存在，介导mRNA降解或翻译阻滞，挑战是有效性、特异性、准确导入靶细胞；③反式剪接——调控前mRNA水平：STS节段性反式剪接解决了传统病毒载体难以转入的大基因（如DMD基因），用两个独立载体各编码独立前mRNA，经剪接体介导的反式剪接产生完整前mRNA；④核糖核酸酶——有酶活性的RNA分子，识别特异性RNA序列并进行位点特异性切割（两翼反义区+核苷酸水解基序）。最大临床应用障碍是转移问题。\n基因组编辑技术——CRISPR/Cas9（成簇间隔短回文重复序列及其相关基因9）：利用Cas9核酸酶在短RNA（向导gRNA）引导下切割与靶序列匹配的DNA双链，诱发细胞自身修复机制修正突变，可精准地在DNA水平永久修复基因；尚有脱靶（导致非目标区域DNA编辑）等问题未解决。\nSMA基因治疗进展：反义寡核苷酸药物Nusinersen治疗SMAⅠ型和Ⅲ型完成Ⅲ期临床试验，获美国FDA和欧洲EMA批准，2019年初中国药品监督管理局也批准临床使用——该药需定期鞘内注射；AVXS-101（以AAV9为载体，AAV9可通过血脑屏障，可鞘内注射或静脉给药）获孤儿药资格认定，2016年1期临床15名Ⅰ型患者无一例死亡且均获得发育里程碑进步。' },
{ m: '32E', q: '我国出生缺陷三级预防的内容？', a: '我国为预防和减少出生缺陷实行三级预防政策。\n一级预防（孕前）：普及出生缺陷防治知识，增强群众自我保健意识和能力；开展针对性优生咨询（特别是遗传咨询），倡导适龄生育、科学备孕。内容：科学补服叶酸预防神经管缺陷；南方地中海贫血高发省份开展包括基因型的筛查；常见耳聋基因位点筛查；脆性X综合征基因筛查；逐步增加高发隐性遗传病的基因筛查。\n二级预防（产前）：减少严重出生缺陷儿出生——对高危孕妇（高龄妊娠、有不良孕产史、血清学或无创产前筛查NIPT唐氏或其他染色体异常高风险、孕期B超等影像学检查发现胎儿结构异常、明确的单基因病和基因组病携带者或染色体平衡变异携带者），通过有效遗传咨询指导其及时到有资质的医疗机构接受产前诊断服务；对明确诊断的各类严重出生缺陷病例及时给予医学指导和建议。\n三级预防（出生后）：全面开展新生儿常见和可干预疾病的筛查——如苯丙酮尿症、先天性甲状腺功能减退和听力障碍筛查等；加强新生儿疾病筛查阳性病例的随访、确诊、治疗和干预，提高确诊病例治疗率；根据各地区条件逐步扩大筛查病种。' },
{ m: '32F', q: '染色体病与基因组病的概念及染色体病的共同表型？', a: '染色体病：染色体发生数目或结构异常引起的疾病，通常指显微镜下可见的染色体异常；已发现的染色体病约200多种。注意：染色体异常（畸变）不等于染色体病——一些染色体结构“平衡变异”本身不引起表型效应。基因组病（Lupski JR 1998年提出）：基因组自身结构特性导致的人类基因组结构重组的一系列疾病，累及DNA片段大于1kb，基础是DNA重组，涉及剂量敏感基因的缺失、重复和断裂；多为散发；通常指显微镜下不可见的CNV引起的疾病；CNV引起的综合征约140余种（含已命名的微缺失/微重复综合征）。\n染色体是基因载体：全套父源和母源23条染色体上有序排列人类全部基因，染色体越大携带基因越多（最小的21号染色体也有225个蛋白编码序列）。畸变后许多基因受累，造成基因剂量增多/减少、基因断裂损伤或相对位置变动，故染色体畸变常表现为多发畸形、多系统受累、多种功能障碍的综合征；累及片段越大受累基因越多，临床表现越严重，严重者致死；同种畸变造成的综合征表型相同，无家族、民族、种族差异。\n染色体病共同表型（诊断线索）：出生体重异常（低体重多见）、生长发育落后、精神运动发育迟缓、智力障碍、肌张力异常、面容特殊、器官和肢体畸形、生殖器官发育不良及皮纹改变等。\n染色体畸变也是胚胎死亡重要原因：流产及死胎中染色体畸变可高达50%~70%；活产新生儿染色体异常发生率约0.5%~1%。' },
{ m: '32F', q: '染色体病/基因组病的实验室检查方法（核型分析、SCE、FISH、CMA、MLPA等）？', a: '①染色体核型分析——检出染色体数目或结构畸变的最基本最重要细胞遗传学方法，至今仍是诊断染色体病的金标准；肝素抗凝外周血淋巴细胞培养、G显带、光镜1000×分析，按ISCN书写核型；中期/早中期染色体400~550条带、分辨率约5~10Mb；疑染色体两个末端畸变用R带；累及着丝粒或判定结构性异染色质变异用C显带；银染法（Ag-NOR）鉴定核仁组织区随体柄随体；Y染色体远端畸变可用氮芥喹吖因（QM）Q带荧光分析；嵌合体异常细胞比例低时可选皮肤成纤维细胞培养。\n②姐妹染色单体交换（SCE）——复制中一条染色体两姐妹染色单体间的交换，交换频率是反映DNA损伤最敏感的方法之一；用于染色体断裂综合征辅助诊断（常规核型可正常，但自然或诱导断裂率、染色单体交换率增高）。\n③FISH——荧光标记特异探针与玻片上染色体或间期核杂交，检测被检序列有无、定位及基因剂量增减；分辨率提高10~100倍，检出光镜不可见的微缺失、重复、插入、易位等及断裂点定位；间期细胞可快速诊断数目异常。\n④多色FISH（M-FISH）和光谱核型SKY——24种颜色显示22条常染色体+2条性染色体，确定复杂核型、鉴定未知标记染色体来源；贵、周期长，临床应用少。\n⑤CMA染色体芯片——array-CGH（双色：患者DNA与参照DNA不同荧光标记等量杂交于BAC/寡核苷酸芯片）和SNP array（单色，可检测等位基因数目、区分杂合性、分析杂合性丢失诊断UPD及鉴别缺失/重复双亲来源）；全基因组范围检测已知和未知缺失重复，分辨率几十至100kb；不能检出平衡性改变（平衡易位、倒位）。\n⑥MLPA——用于染色体数目异常、亚端粒重排、常见微缺失/微重复综合征及不明原因原发性智力障碍病因检测；简便快捷，范围小于CMA，可作初检或第二种方法验证。\n⑦DNA分子检测——PCR是最常用基本方法，结合酶切、毛细管电泳、测序、定量PCR检测单基因突变、三核苷酸重复延伸、UPD和基因印记；Southern印迹仍被认为是脆性X综合征诊断金标准。\n⑧NGS和CNV-seq——NGS读长增大可确定平衡性变异断裂点DNA序列；CNV-seq分辨率同CMA，已用于临床诊断染色体病和微缺失/微重复综合征。' },
{ m: '32G', q: '21三体综合征（Down综合征）的病因、核型分型、临床表现与预后？', a: '最常见的染色体病，发病率1/800~1/1000；发病率与母亲分娩年龄密切相关：35岁及以上约1/350、40岁约1/100、45岁可高达1/20；我国孕期血清学唐氏筛查+NIPT高风险者行产前诊断已大大减少DS患儿出生。\n病因核型分三型：①三体型——47,XX(XY),+21，占95%；起自父母生殖细胞减数分裂期21号不分离，来自母亲的占90%以上，高龄母亲卵子老化是重要原因（还有父母生殖细胞嵌合21三体细胞系、母源21号单亲二体等少见原因）；②易位型——约占4%，最常见D组14号与G组21号罗伯逊易位，核型46,XX(XY),rob(14q;21q)(q10;q10),+21；也见13、15与21罗伯逊易位、21与22及21与21易位；部分源自父母之一是相同罗伯逊易位携带者，发现后应查父母核型；③嵌合型——47,XX(XY),+21/46,XX(XY)，约占1%，不分离发生在合子后有丝分裂姐妹染色单体不分离，发生越晚正常细胞比例越大表型越轻。\n关键区：产生DS表型特征的21号染色体关键区DSCR在21q22.13-q22.2；候选基因DYRK1A（双重特异性酪氨酸磷酸化调节激酶1）、OLIG2（少突胶质细胞系转录因子2）、APP（β淀粉前体蛋白）。\n临床表现：发育迟缓、智力障碍（智商约25~60，嵌合型可达50以上）；身材矮、肌张力低、步态笨拙；特殊面容——张口伸舌、头前后径短枕部平（扁头）、头发稀疏发旋多居中、前囟闭合晚、顶枕中线第三囟门、额鼻颌骨发育不良呈平脸、鼻短矮、舌胖大有齿压痕、牙齿发育不全缺牙、眼裂上斜内眦赘皮、浅色虹膜Brushfield斑（国人虹膜棕黑色常看不到）、耳小耳垂小或缺如、颈短赘皮；皮纹——手掌指骨短、三叉点t向远端移位、通贯掌、小指中节骨发育不良弯曲且掌侧单一横褶、指纹可全为尺侧箕纹、足短小呈草鞋足（躅趾与第二趾间距宽、足底深沟状跖褶）；骨盆发育不良髋臼浅；生殖器官发育不良、性腺功能减低；近50%有先天性心脏病（室缺、房缺、动脉导管未闭多见）；部分胃肠道畸形（肠闭锁、膈疝、脐疝）；白血病发生率明显高于一般人群（急性淋巴细胞性白血病多见）；甲状腺功能减退、听力障碍较常见。\n实验室检查：核型分析是唯一能够明确21三体类型的方法；FISH用21号特异探针间期细胞诊断；MLPA、CMA、CNV-seq均可诊断。\n治疗预后：婴幼儿体弱易患感染，针对感染治疗；先心病择期手术；加强教育训练改善发育。婴幼儿期常反复呼吸道感染，先心病者常因此早期死亡；肌张力随年龄增长改善，与正常儿生长差距渐加大；80%DS可存活至10岁、一半超过50岁；几乎所有DS患者40岁后患Alzheimer病（与APP基因相关）。' },
{ m: '32G', q: '18三体综合征、13三体综合征及其他三体（8/9三体嵌合型）的要点？', a: '18三体（Edwards综合征）：第2位常见常染色体病，发病率1/6000活产儿，女:男=3:1；90%以上源于母亲卵子减数分裂不分离，与母亲高龄相关；核型47,XX(XY),+18，少部分为嵌合体。临床表现：严重智力障碍；宫内即生长迟缓故出生体重低；哭声低微、皮肤松弛、前额及背部多毛、大理石样花纹；头小前额窄枕部隆突、耳位低耳郭畸形、睑裂小、口颌小腭弓窄、胸骨短、乳头小；先天性心脏畸形发生率高达80%以上；外生殖器发育不良；特殊手姿势——手足紧握、示指及小指叠压中指环指；低弓形指纹、摇篮底足；肌张力高、骨盆小髋外展受限；可伴唇腭裂、眼睑下垂、内眦赘皮、角膜混浊、乳距宽、肺叶发育不良、横膈疝、肛门畸形、麦克尔憩室、肾输尿管畸形、马蹄内翻足、甲状腺胸腺发育不良、血小板减少。诊断：核型分析、FISH、MLPA、CMA、CNV-seq。预后：生活能力低，常呼吸暂停吸吮差需鼻饲，多在出生后几周内死亡，10%活到1岁，个别超过10岁。\n13三体（Patau综合征）：发病率约1/10000；严重智力障碍；小头、前脑无裂畸形、前额小、顶部头皮缺损、偶呈独眼畸形、小眼球、视嗅神经发育不良；耳畸形低位；唇腭裂、肋骨不全、先心病及其他内脏生殖器畸形；手指弯曲、多指/趾、指甲窄凸；血甲胎蛋白持续存在、中性粒细胞鼓槌体增多；部分源于家族性罗伯逊易位携带者。\n8三体嵌合型：发病率约1/20000；轻到中度智力障碍伴共济失调；身材细长、前额凸、眼窝深、斜视、耳轮大厚、鼻根宽鼻孔朝前、唇厚口颌小腭弓高；第2~5指/趾屈曲、前臂后旋受限；骨盆窄小，部分椎体脊柱畸形、耳聋、隐睾、再生障碍性贫血。\n9三体嵌合型：胎儿期即生长发育不良、严重智力障碍；面形狭长、前额窄小、眼窝深、鼻梁高、小颌、上唇后缩、耳低位后旋；先心病、肾畸形、脊柱后凸侧弯、髋膝肘手足关节畸形挛缩、生殖器官发育不良。\n注：除21、18、13外其他常染色体三体（8、9三体）均为与正常二倍体细胞系并存的嵌合体，三体型细胞比例越少表型越轻；单体型仅见于X（45,X），常染色体单体不能存活；多体型仅见于性染色体。' },
{ m: '32G', q: 'Klinefelter综合征（先天性睾丸发育不全）的要点？', a: '男性最常见的染色体病，发病率1/1000男性新生儿，为新生性染色体畸变，母源和父源约各占50%，随母亲妊娠年龄增大发病率增高。\n病因：正常男性核型中多一条X染色体，多数核型47,XXY，源自父母生殖细胞染色体不分离；少数嵌合型47,XXY/46,XY；还有更多X者（48,XXXY/49,XXXXY），X染色体数目越多临床表现越重，常伴智力障碍。因男性性别决定基因SRY定位于Y染色体，增加几条X染色体患儿均表现为男性。\n临床表现：儿童期不明显，青春期后出现症状——身材高、肌力差、小阴茎、小睾丸、皮下脂肪丰满、皮肤细嫩、可有乳房发育、阴毛分布呈女性三角形分布、腋毛稀少、无喉结胡须；无精或少精子症伴精小管透明化和纤维化；多数智力正常（IQ 85~90），语言低于动作；性格内向胆小，部分有精神和行为问题；促性腺激素增高、睾酮低。\n治疗：自儿童期根据情况选用睾酮治疗促进第二性征发育；选长效制剂，定期测血睾酮和促性腺激素，调节剂量使血睾酮维持7.8ng/ml以上；11岁起每3周注射1次25mg，渐增至50mg，以后每年增加50mg，至成年时每次250mg。\n相关疾病：46,XX男性（性逆转，SRXY）——约1/20000男性表型似Klinefelter但身材不高大，核型46,XX，病因为SRY基因易位到X染色体。' },
{ m: '32G', q: 'Turner综合征（先天性卵巢发育不全）的病因、核型、临床表现与治疗？', a: '新生女婴发病率约1/2000~1/4000。\n病因：缺少一条正常X染色体，典型核型45,X；少数为X结构改变：46,XX,del(p)；46,XX,del(q)；46,X,r(X)环形；46,X,i(Xp)；46,X,i(Xq)；也有X与常染色体间易位；少数数目异常嵌合体45,X/46,XX；45,X/47,XXX/46,XX等。45,X源于生殖细胞减数分裂不分离产生X缺体配子，丢失的性染色体3/4来自父亲，与母亲高龄关系不大。\n临床表现（不同核型表现相同特征）：患者均为女性；出生即身材矮小（低于平均成人身高20cm左右，一般低于同胞）；智力通常正常；卵巢发育不良，生殖器官呈幼女型；青春期无第二性征、无乳房发育无月经；促性腺激素增高、雌激素极低；胎儿期淋巴水肿至出生时大多消退，残留指/趾背部肿胀，颈部消退后表现颈蹼；面部异常：上颌及腭弓窄、下颌小、内眦赘皮、耳上部凸出；后发际低、颈短、盾状胸、乳距宽；皮肤色素痣；肘外翻、第四掌骨短、指甲窄隆突呈半圆柱状、膝关节异常、髋脱位；心脏畸形以主动脉或主动脉瓣狭窄和二尖瓣脱垂常见；偶见睑下垂、白内障、斜视、蓝色巩膜；易患特发性高血压、糖尿病、甲状腺病；除核型为嵌合体且正常核型比例大外无生育能力。\n治疗：目的为提高成年身高、诱导性发育、维持第二性征使子宫正常发育、提高骨密度达峰值骨量。①生长激素——一般4~6岁即可开始使用；②雌激素——11~12岁开始，促进第二性征、生殖器官发育及骨密度，两年后可加用孕激素建立人工月经周期；③其他并发症治疗和心理治疗。' },
{ m: '32G', q: 'X三体（47,XXX）与XYY综合征（47,XYY）的要点？', a: 'X三体（超雌综合征）：多一条X，核型47,XXX，多数源于母源性染色体不分离；发病率1/1000女性新生儿，多数为新发性。临床表现：身高高于正常女性平均身高，发育基本正常；平均智商稍低（低于同龄女性10~15分），部分有轻度学习、语言和行为障碍；多数第二性征发育正常并能生育，少数卵巢功能低下、原发或继发闭经、乳房发育不良。若多一条X以上（48,XXXX、49,XXXXX）：常表现智力障碍，X越多表型越显著——身材矮小、骨龄延迟、肥胖、眼距宽、眼裂上斜、斜视、耳低位、先心病、骨骼畸形、乳腺发育不良、卵巢功能差、不孕。治疗：针对性康复训练和青春期性激素替代疗法。\nXYY（超雄综合征）：多一条Y，核型47,XYY，源于父亲，发病率1/1000男性新生儿；多数智力和表型正常，身材高大；可有性格行为异常——多动、注意缺陷、学习能力差、性情暴躁易暴发攻击行为；青春期多患痤疮；少数伴先心病及骨骼异常；可生育。Y多于一条以上（48,XYYY、48,XXYY、49,XXYYY及嵌合体）智力障碍和畸形可能性增大，尚无适当治疗方法。' },
{ m: '32G', q: '性发育疾病（DSD）的染色体机制与相关基因？', a: '性别决定机制：正常男性Y染色体短臂末端（Yp）与X短臂末端（Xp）有约2.5Mb高度相似序列区，即假常染色体区1（PAR1）；SRY基因（性别决定基因）位于Yp11.3近着丝粒端。减数分裂时X和Y的PAR1区可发生类似同源染色体的交叉互换——若交换使携带SRY的一部分Y染色体转移到X染色体上，子代遗传父亲这条携带SRY的X染色体则表型为男性；若子代遗传父亲无SRY的Y染色体则表型为XY女性。另一部分XY女性由SRY基因点突变引起，其性腺呈索条状，第二性征发育不良。\n46,XX男性（性逆转SRXY）：约1/20000，表型似Klinefelter但身材不高大，核型46,XX，病因为SRY易位到X染色体。\nDSD相关基因突变：SRXY6（46,XY性逆转，常显，MEKK1基因5q11.2）；SRXY3/SRXX4（NR5A1基因9q33.3）；SRXX5（NR2F2基因15q26.2，常显）；SRXY7（DHH基因12q13.12，常隐）。伴性腺/性征异常的单基因病：Denys-Drash综合征（WT1基因11p13）、短肢发育不良伴性反转（SOX9基因17q24.3）、米勒管发育不良和雄激素增多（WNT4基因1p36.12）等。' },
{ m: '32F', q: '染色体结构畸变的类型（缺失、重复、易位、倒位、环形、等臂、插入、标记染色体）？', a: '结构畸变多起自生殖细胞减数分裂时同源染色体间交叉和不等互换，或非同源染色体间断裂和重接；引起基因组剂量不平衡变化（缺失或重复）时即引起表型异常。\n①缺失del——染色体缺失部分片段，末端缺失较常见，也可中间缺失；大片段缺失常致死。\n②重复dup——增加某个相同区段；重复片段方向与原片段一致为正向（串联）重复，反之为倒位重复；一般重复的危害性小于缺失。\n③易位t——两条或以上非同源染色体各断裂一次，不含着丝粒的断片重接到另一条染色体断端；两条染色体的相互易位最常见；无染色体物质增减为平衡易位——个体无表型异常（平衡易位携带者），但减数分裂可形成不平衡畸变配子使子代患病；断裂点累及基因也可致表型异常。\n罗伯逊易位rob——整臂易位的特殊类型，发生于近端着丝粒染色体之间（D组13、14、15与G组21、22），携带者染色体数目45条：两条近端着丝粒染色体在着丝粒处断裂，两条长臂形成一条衍生染色体，两条短臂连成小染色体随后丢失；携带者可形成三体配子，产生三体患儿，以21三体最常见，也可产生13三体。\n④倒位inv——两处断裂、中间断片倒转180°再重接；臂内倒位（两断点在同一臂）和臂间倒位（断点一在短臂一在长臂，较常见）；多为平衡性，但可造成子代不平衡畸变或因断裂损伤基因及位置改变而表型异常。\n⑤环形染色体r——两末端断裂丢失末端物质后两端连接成环；丢失两端物质可致表型异常；环形不稳定，细胞分裂时部分细胞丢失成单体。\n⑥等臂染色体i——由两个短臂或两个长臂组成，一得一失；源于有丝分裂后期着丝粒横裂后再复制；大多致死，临床最常见等长臂X染色体i(Xq)。\n⑦插入ins——一条染色体断裂后中间插入另一条染色体片段；若插入片段来自缺失该片段的染色体，则全套染色体无得失，为平衡畸变携带者，表型正常但子代可发生不平衡畸变。\n⑧小的额外标记染色体sSMCs——二倍体外多余、形态可辨认但传统显带不能识别来源的细小染色体（≤20号染色体大小），核型47,XX/XY,+mar；近1/3携带者表型异常；倒位重复invdup最多见——inv dup(15)含15q11~13区则致智力障碍、语言障碍、癫痫；inv dup(22)引起猫眼综合征（虹膜缺损/小眼、耳前窝、先心病、肛门闭锁、轻中度智力障碍）；父母携带t(11;22)平衡易位致衍生22的Emanuel综合征；i(12p)引起Pallister-Killian综合征（严重智力障碍、惊厥、耳聋、肌张力低、膈疝、多乳头，sSMC在成纤维细胞更易检出）；i(18p)中重度智力障碍伴惊厥。' },
{ m: '32G', q: '猫叫综合征与Wolf-Hirschhorn综合征的要点？', a: '猫叫综合征（5p-缺失综合征）：活产儿发病率1/20000~1/50000；多数缺失显微镜下可见，父源缺失多见；因婴儿期哭声高调尖锐似猫叫得名。临床表现：低出生体重、新生儿期喂养困难、生长发育迟缓、严重智力障碍；小头伴额缝凸出、圆脸、眼距宽、内眦赘皮、睑裂下斜、斜视；耳位低及发育不良、高腭弓；掌骨短、通贯掌纹；器官畸形相对少（先心病、唇腭裂、肾畸形、脾缺如、脊柱侧凸、尿道下裂、隐睾、腹股沟疝等）。无特异性治疗，早期对症支持治疗和康复训练。\nWolf-Hirschhorn综合征（4p16.3缺失综合征）：缺失片段大小不一，一部分显微镜下可见。临床表现：低出生体重、生长发育迟缓、中-重度智力障碍，常有癫痫；特殊“希腊盔甲”面容——眼距过宽、鼻宽呈勾状、耳低位、耳郭扁平、耳前赘或陷窝；人中短、口角向下呈鱼嘴形、小颌；先心病、尿道下裂、隐睾、马蹄内翻足。无特异性治疗，对症治疗和康复训练。' },
{ m: '32F', q: '染色体病的遗传咨询与再发风险要点？', a: '首先要明确患儿染色体畸变是父母遗传还是新生性（de novo）变异——一旦发现患儿染色体畸变，均应对父母进行染色体核型检查。\n①数目畸变、嵌合体及父母核型正常的新生性结构畸变——多为新生变异，再发风险相对较低；但父母可能存在不易检出的生殖细胞系嵌合体使再发风险升高，这样的夫妻再孕时应行产前诊断（取绒毛或羊水做核型分析和适当的分子遗传学检测）。\n②母龄超过35岁——染色体不分离增多，生育三体患儿风险加大，均应行产前诊断。\n③父母为染色体结构平衡畸变携带者——再发风险较高，但并非高达减数分裂产生不平衡畸变配子的理论预期值：以罗伯逊易位型21三体rob(14q;21q),+21为例，母亲携带者实际再发风险约20%，父亲携带者仅约5%（父源较低原因未明，可能携带畸变的精子首先到达卵子并受精的可能性较小）。若为21与21号罗伯逊易位，除自然流产外活产儿均为21三体，不能生育正常孩子。\n④少数染色体病患者（携带部分缺失/重复或21三体者）虽有智力障碍或生长落后但有生育能力，特别是女性——其再发风险同常染色体显性遗传，有50%概率传给子代，一定要建议产前诊断避免患儿出生。' },
{ m: '32H', q: '基因组病的分子机制（NAHR、NHEJ、FoSTeS）与微缺失/微重复综合征概念？', a: 'CNV（拷贝数变异）作为遗传标记相对SNP有更高突变频率；基因组中大量重复序列（LCRs、SINEs、LINEs）在CNV形成中起重要作用；致病性CNV世代传递遵循孟德尔遗传规律。\n致病性结构重排分两类：①再发性重排——不同个体相同染色体区段发生缺失或重复，片段大小一致，断点附近富集LCRs（低拷贝重复）；LCRs可介导减数分裂中同源染色体间、姐妹染色单体间或染色单体内发生非等位同源重组（NAHR）；相同位点既可有缺失也可有重复。②非再发性重排——片段大小不一致，但可能具有共同的最小重叠区（SRO），SRO内有一个或多个基因对表型起重要作用；机制与非等位同源末端连接（NHEJ）及复制叉停滞模板转换（FoSTeS）等复杂机制有关。\n微缺失/微重复综合征：因染色体结构“微小”异常（缺失或重复片段通常小于5Mb，显微镜显带技术不能识别）引起的具复杂临床表现的遗传病，归于基因组病；一部分由NAHR介导（片段大小相似，称再发性微缺失/微重复综合征，如17p12缺失/重复、22q11.2缺失/重复），一部分与NHEJ等有关（片段大小不同仅含共同SRO，称非再发性，如17p13.3缺失综合征Miller-Dieker）。表型效应主要与DNA片段内基因剂量敏感性相关——基因对单倍剂量不足和三倍剂量均敏感时，缺失或重复均致病。共同临床表现同染色体病：出生体重异常、生长发育落后、精神运动发育迟缓、智力障碍、面容特殊、多发畸形、孤独症谱系样表现。染色体亚端粒区基因丰富，其重排是导致原发性智力障碍的主要原因之一。\n常见综合征：1p36缺失（智力运动障碍、癫痫、小头、直眉弓、先心病）；Williams-Beuren 7q11.23 del 1.5~1.8Mb（平均IQ56、友善多话、声音沙哑、唇厚、星状虹膜、高血钙）；WAGR 11p13 del（WT1/PAX6：Wilms瘤、虹膜缺如、生殖器发育不良、智力障碍）；Rubinstein-Taybi 16p13.3 del（CREBBP：宽拇指、多指并指、弓眉）；Smith-Magenis 17p11.2 del 3.7Mb（RAI1：睡眠障碍、行为异常、声音沙哑）与Potocki-Lupski 17p11.2 dup（生长迟滞、孤独症样）；Miller-Dieker 17p13.3 del（无脑回）；17q12 del/dup（HNF1B：多囊肾、孤独症）；DiGeorge/ velocardiofacial 22q11.2 del 1.5~3Mb（TBX1：胸腺甲状旁腺发育不全、细胞免疫缺陷、低血钙抽搐、先心病、腭裂）。' },
{ m: '32H', q: '脆性X综合征（FXS）的病因、CGG重复分级、临床表现与诊断？', a: 'X连锁智力障碍疾病，是引起智力障碍和孤独症谱系障碍最常见的单基因病，发病率仅次于21三体；男性约1/4000、女性约1/6000~1/8000；因体细胞在低叶酸培养基诱变处理后部分细胞Xq27.3出现脆性部位而得名；是第一个被发现的三核苷酸重复扩增病（TRED）。\n病因：FMR1基因（Xq27.3，长38kb、17个外显子）5′非翻译区CGG三核苷酸重复序列异常扩增及相邻CpG岛异常甲基化。CGG重复分级：①正常6~53次（一般30左右，CGG之间常含2~3个AGG“中断”保持稳定）；②灰色区40~54次（或35~45次而无AGG中断），有不稳定趋势但稳定程度难预测；③前突变55~200次（不稳定前突变序列）——男性易患震颤共济失调、女性易患卵巢功能早衰；④全突变>200次——男性患FXS。传递规律：前突变母亲传给子代可成为全突变（遗传早现）；父亲无论前突变或全突变只能将前突变传给子代；全突变男性罕有生育。机制：全突变时扩增CGG及CpG岛高度甲基化抑制FMR1转录，不能产生FMRP（脆性X智力障碍蛋白，胞质RNA结合蛋白，调节神经发育基因表达和神经元突触可塑性）；女性因仍有一条正常X，表型轻或无。邻近的FRAXE（FMR2，CGG扩增致脆性XE综合征，表型与FRAXA相似但较轻）和FRAXF（无病理意义）。\n临床表现：主要见于男性——智力障碍（智商多30~55）、语言及行为异常（注意力不集中、多动、易兴奋或孤僻、逆反或孤独症样）；出生体重较高、生后头几年生长快；头大、前额突出、窄长脸、下颌大、鼻梁宽、耳大（招风耳）；青春前期睾丸增大、青春期后睾丸可达30~50cm、阴囊厚（大睾丸症）；部分惊厥、腱反射增强、关节松弛。女性携带者可轻度智力障碍，更多为行为问题（害羞、焦虑、多动、注意力不集中）。\n实验室检查：①细胞遗传学脆性部位检查（仅4%~40%细胞显示，有假阳性假阴性）已不用；②Southern印迹——用EcoRI和甲基化敏感的EagI消化、StB12.3探针杂交，分析CGG片段长度和甲基化状态，是鉴别前突变/全突变的国际公认金标准；③PCR扩增CGG重复+毛细管电泳，可检出前突变、全突变及嵌合状态，判断女性杂合/纯合及AGG中断。\n遗传方式：X连锁不完全显性，患儿的母亲是前突变或全突变携带者。治疗无有效方法，语言训练助益大。' },
{ m: '32H', q: '其他常见三核苷酸重复扩增疾病（MD1、亨廷顿病、Friedreich共济失调）的要点？', a: '三核苷酸重复扩增病（TREDs）：致病基因内三核苷酸重复次数不稳定异常扩增，传递中拷贝数不断变化，呈动态突变；重复超过阈值即出现异常表型，且世代传递中重复次数逐代增多——临床表现为遗传早现（发病年龄逐代提前、表型逐代加重）。重复序列可为CCG、CAG、GAA、CTG、GCG；位于编码区者（CAG/GCG）使编码蛋白出现延长的多聚谷氨酰胺/多聚丙氨酸链影响蛋白功能；位于非编码区者多引起蛋白表达减少。迄今已发现20多种TREDs。\n①强直性肌营养不良1（MD1，AD）——DMPK基因（19q13.3）3′非翻译区CTG重复：正常5~34次，前突变35~49次，50~150次轻度表现（肌强直、白内障），>100~1000次典型MD（肌强直无力萎缩、吞咽言语障碍、白内障、智能减退、心律失常、胰岛素抵抗、性腺发育不全），>2000次先天性MD（喂养困难、呼吸窘迫）；典型遗传早现。\n②亨廷顿病（HD，AD）——HTT基因（4p16.3）编码区第一外显子CAG重复（多聚谷氨酰胺病）：正常<26次，中间型27~35次（传递下一代可扩增，父源比母源更易扩增），36~39次不完全外显，≥40次完全外显；表现运动减少、肌强直、共济失调、癫痫、精神智能衰退（舞蹈动作少见）；少年型5%~10%在20岁前发病，重复常>60次。\n③Friedreich共济失调（FRDA，AR）——FXN基因（9q13）编码线粒体共济蛋白frataxin（调节铁代谢），第一内含子GAA重复扩增是最常见突变，96%患者一对等位基因均为GAA重复扩增：正常5~30次、异常70~1000次纯合；平均发病10~15岁；表现进行性姿势和步态共济失调、构音障碍、腱反射消失、深感觉消失、心律失常。\n遗传咨询：这类疾病无有效治疗方法，预防再发最有效；发病率较高的FXS应在不明原因男性智力障碍患儿中行分子检测，确诊后建议一级亲属检测并在妊娠时行产前诊断。' },
{ m: '32H', q: '单亲二体（UPD）的概念、分类、机制与相关疾病？', a: 'UPD：一对同源染色体均来自同一个亲本（另一条亲本的该染色体完全缺失），不能用细胞遗传学方法鉴别，核型均正常；分子水平通过DNA多态性标记（STR或SNP）分析基因型或单体型鉴别。\n分类：单亲异二体（UPHD）——一对同源染色体均来源于同一亲本的一对同源染色体（源于减数分裂Ⅰ不分离）；单亲同二体（UPID）——同一亲本的同一染色体两个姐妹染色单体（减数分裂Ⅱ不分离）。UPID可使该染色体上携带的隐性致病基因呈纯合状态而出现隐性遗传病——每人携带6个左右隐性致病基因，若某个体出现两种以上隐性遗传病应考虑UPID可能。\n发生机制（三种）：三体自救、单体自救、有丝分裂时发生错误。\n临床意义：UPD本身多无影响，但若该染色体上基因被印记，UPD可因亲本效应决定的基因表达差异引起表型异常。已知与印记有关的染色体：6、7、11、14、15、20号。已明确与UPD相关的7个综合征：Prader-Willi综合征、Angelman综合征、Beckwith-Wiedemann综合征、Silver-Russell综合征、新生儿短暂性糖尿病、母源UPD14、父源UPD14。几乎每条染色体都被观察到UPD，大多数UPD对表型无影响。' },
{ m: '32H', q: 'Prader-Willi综合征与Angelman综合征的病因、临床表现与比较？', a: '两病是基因组印记病最典型代表：70%患者都是15q11-q13区5~7Mb缺失，但缺失来源不同导致两个临床表现完全不同的综合征。15q11-q13是基因组印记区：父源表达MKRN3、MAGEL2、NECDIN、NPAP1、SNURF-SNRPN及snoRNA、IPW；母源表达UBE3A和ATP10A；印记中心分两部分分别调控父源和母源基因表达；正常个体需要双亲等位基因均表达。\n基因组印记：双亲一对等位基因由于差异性DNA甲基化，使源自父母一方的一个等位基因有转录活性、另一方沉默。\nPWS（肌张力低下-肥胖-手足小-生殖器官发育不良）：病因——父源印记功能缺陷：70%父源15q11-q13缺失，25%母源UPD，2%~5%印记中心缺陷，极少见15号长臂易位/倒位。临床表现：新生儿期肌张力低下、喂养困难（100%表型）；幼儿期肌张力改善但食欲过强、嗜睡、渐出现肥胖；智力障碍（智商20~80）、学习困难、性格友善；身材矮、双额径窄、额发上扫、杏仁眼、斜视、薄上唇、口角下斜；手足小、粗细动作协调差；阴茎小、隐睾、性腺功能减退、促性腺激素分泌不足；糖耐量降低可发展为糖尿病；胎动少、常臀位产。治疗：婴儿期鼻饲保证营养，1岁后严格控制饮食防肥胖，监测血糖；身材矮小用生长激素；青春期睾丸素替代。\nAS（严重智力障碍-愉快-共济失调）：病因——70%母源15q11-q13缺失，3%~5%父源UPD，2%~5%印记中心缺陷，10%~15%UBE3A突变，10%不明表观遗传错误。临床表现：严重智力障碍、运动发育迟滞；不合时宜地突发大笑和愉快（快乐木偶）、语言不发育；惊厥发作、脑电图异常（高波幅2~3Hz棘波）、共济失调；头小且扁有枕沟；眼脉络膜及虹膜色素浅、眼窝深陷、大嘴伸舌、凸颌、牙间隙宽；肌张力低、CT示脑萎缩；父源UPD者较母源缺失者临床表现相对轻。治疗：抗癫痫（药物难控制）。' },
{ m: '32H', q: 'Beckwith-Wiedemann综合征与Silver-Russell综合征（11p15.5印记病）的要点？', a: '11p15.5为基因印记区，有两个印记域：从着丝粒端向短臂末端依次为CDKN1C、KCNQ1OT1、IGF2、H19四个与表型相关基因；IGF2和H19之间的印记中心1（IC1）调节该两基因表达，KCNQ1内含子10的印记中心2（IC2）调节CDKN1C和KCNQ1OT1表达。正常父源表达IGF2和KCNQ1OT1，母源表达H19和CDKN1C。印记区被扰乱引起两个临床表现相反的综合征：过度生长及偏身肥大的BWS和生长落后及偏身发育不良的SRS。\nBWS（脐疝-巨舌-巨体综合征）：病因机制——父源11p15.5UPD（20%）、母源IC2丢失甲基化（50%）、母源CDKN1C点突变（5%）、母源IC1获得甲基化（5%）、11p15.5结构异常（倒位、插入、易位、微缺失/重复）；父源UPD使IGF2和KCNQ1OT1双等位表达而H19和CDKN1C沉默，基因不平衡是过度生长基础。临床表现：巨舌、脐膨出、巨体、耳垂皮肤横行皱褶；出生体大、发育不对称；生长过速、骨骼成熟快、骨变宽而骨干过细；焰色毛细血管扩张痣；内脏器官发育不良（肾巨大分叶状、胰腺发育过度胰岛过剩、肾上腺皮质胎儿型、性腺间质增生）；腹直肌分离、脐疝、隐睾；新生儿早期红细胞增多症；半侧肥大；易患多种胚胎性肿瘤（Wilms瘤、肝母细胞瘤、神经母细胞瘤、横纹肌肉瘤）——父源UPD和母源IC1获得甲基化者患肿瘤风险更高。治疗：约半数新生儿低血糖，用氢化可的松1~4个月；巨舌致喂养困难及呼吸受阻宜侧卧；缜密观察腹部内脏肿瘤及时治疗。\nSRS1：母源11p15.5UPD（常为体细胞嵌合体、比例很小）；父源IC1丢失甲基化占35%~50%；母源CDKN1C点突变、父源IGF2突变等。SRS2：7号染色体母源UPD（约占10%），7p11-p13及7q31-qter有调控生长的印记基因。临床表现：胎儿早期宫内生长落后、身材矮小、骨骼不对称、小指弯曲；智力多正常或轻度迟缓；头大、前囟晚闭、三角脸、口角向下；婴儿期蓝色巩膜、皮肤咖啡牛奶斑；婴儿期体弱多汗、易发生自发性停食性夜间低血糖；儿童中期骨龄异常增高。治疗：针对生长迟缓可用生长激素。' },
{ m: '32H', q: '染色体断裂综合征（染色体不稳定综合征）的要点（FA、Bloom、AT、NBS、XP）？', a: '定义：发生在体细胞的染色体断裂（不稳定倾向），主要遗传方式为常染色体隐性或X连锁遗传，有不同程度易患肿瘤倾向；根本原因是DNA修复缺陷——“不稳定”指染色体倾向发生重排或其他细胞遗传学行为。遗传咨询遵循常染色体隐性遗传病原则。SCE（姐妹染色单体交换）频率是反映DNA损伤最敏感的方法之一。\n①范科尼贫血FA（AR，遗传异质性，相关基因20余个，仅FANCB为X连锁）——A型致病基因FANCA位于16q24.3，突变引起2/3病例（大缺失与Alu序列重组有关）；细胞遗传学特点：自发性或诱导性染色体断裂增多，培养细胞对交联剂敏感（丝裂霉素C和双环氧丁烷）。临床共同特征：进行性骨髓衰竭致全血细胞减少，多伴先天畸形（尤其骨骼畸形）——矮小、头小、拇指发育不全或缺如、桡骨畸形、约半数男孩隐睾；1/3患儿无明显畸形；染色体不稳定易断裂重排而发生肿瘤尤其易患白血病；多在儿童期死于白血病或全血细胞减少。\n②Bloom综合征（AR；BLM基因15q26.1，编码DNA RecQ解旋酶，维护基因组稳定）——染色体断裂发生在同源染色体之间，SCE异常增高（正常人SCE在8以下，本病可高达200以上），自发染色体单体断裂增加形成典型对称四射体结构。临床：矮小、小头、长脸、颧骨发育不良；面中部毛细血管扩张性红斑呈蝴蝶状、日光敏感；智力正常；免疫球蛋白缺乏（主要IgA及IgM减低）；易患多种恶性肿瘤尤其白血病，多在30岁前死于癌症。\n③共济失调毛细血管扩张症AT（AR；ATM基因11q22.3，编码丝氨酸蛋白激酶，属抑癌基因，是BRCA1相关基因组监控复合体BASC重要组成）——染色体断裂增加，淋巴细胞有7和14号染色体（7p14、7q35、14q12、14q32）非随机重排，偶见于X；重排断点涉及T细胞受体和免疫球蛋白重链基因，故易患免疫缺陷。临床：累及脑、免疫系统和癌症——婴儿期起进行性共济失调、手足徐动、语言障碍、智力及生长发育障碍；结膜及眼周皮肤毛细血管扩张（可越过鼻梁、扩展至耳郭）；皮肤咖啡牛奶斑；卵巢发育不良易发生无性细胞瘤；细胞免疫缺乏（胸腺、扁桃体、腺样体发育不良，IgA及IgE可缺如）；易反复呼吸道感染、进行性支气管扩张；多在成年前死于感染或神经系统退行性病变。\n④Nijmegen断裂综合征NBS（NBS1基因8q21，编码nibrin蛋白与ATM相互作用；常见突变为c.657~661缺失5bp纯合子）——小头、生长落后、免疫缺陷和癌症倾向综合征；细胞遗传学与AT相同（易7和14号重排），对放射线敏感；宫内生长落后、矮小、小头伴脑发育不良；智力障碍随年龄增长出现，学龄期显著（轻-中度）；易患恶性肿瘤，约40%患者20岁前患癌症。\n⑤着色性干皮病XP（多亚型，相关基因DDB2、ERCC1~5、POLH、XPA、XPC）——对日光紫外线极度敏感：照射后DNA损伤形成嘧啶二聚体的修复功能缺陷；皮肤首次日光照射即过敏，进行性萎缩伴色素斑、毛细血管扩张、血管瘤、角化过度，3~4岁即可发展为基底细胞癌、鳞癌或黑色素瘤，多在20岁前死于恶性肿瘤；25%有神经系统表现（获得性小头、深腱反射减弱或消失、进行性感觉神经性听力丧失、进行性认知障碍）。' },

    if (!m.color) m.color = PALETTE[_pi++ % PALETTE.length];
  });

  let selected = new Set(MODULES.map(m => m.id));
  let mode = 'seq';
  let deck = [], idx = 0, flipped = false;
  let roundKnow = 0, roundTotal = 0;
  let weakThisRound = {};
  let gradeTally = [0, 0, 0, 0]; // SRS 本轮 重来/困难/良好/简单
  const GRADE_NAMES = ['重来', '困难', '良好', '简单'];

  const $ = id => document.getElementById(id);

  // ---- 章节手风琴 ----
  const CHAPTERS = {
    '00': '抗菌药物速查',
    '14': '新生儿疾病', '17': '变态反应性疾病', '18': '风湿性疾病',
    '19': '病毒感染性疾病', '20': '细菌感染性疾病', '21': '小儿结核病',
    '22': '真菌性疾病', '23': '螺旋体和立克次体感染', '24': '寄生虫病',
    '25': '呼吸系统疾病', '26': '消化系统疾病', '27': '心血管系统疾病',
    '28': '泌尿生殖系统疾病', '29': '血液系统疾病', '30': '神经系统疾病',
    '31': '内分泌疾病', '32': '遗传与染色体疾病'
  };
  const chOf = m => { const n = (m.id.match(/^\d+/) || ['00'])[0]; return +n < 10 ? '00' : n; };
  const cardCount = {};
  CARDS.forEach(c => { cardCount[c.m] = (cardCount[c.m] || 0) + 1; });

  const chipsBox = $('moduleChips');
  const groups = {};
  MODULES.forEach(m => { (groups[chOf(m)] = groups[chOf(m)] || []).push(m); });
  const chKeys = Object.keys(groups).sort((a, b) => a === '00' ? -1 : b === '00' ? 1 : (+a - +b));
  const chipEls = {}, chMetas = {};

  chKeys.forEach(ch => {
    const g = document.createElement('div');
    g.className = 'ch-group';
    const head = document.createElement('div');
    head.className = 'ch-head';
    const arrow = document.createElement('span');
    arrow.className = 'ch-arrow'; arrow.textContent = '▶';
    const title = document.createElement('span');
    title.className = 'ch-title';
    title.textContent = (ch === '00' ? '' : '第' + ch + '章 ') + (CHAPTERS[ch] || '其他');
    const meta = document.createElement('span');
    meta.className = 'ch-meta';
    const allBtn = document.createElement('button');
    allBtn.className = 'ch-all'; allBtn.textContent = '全选';
    head.appendChild(arrow); head.appendChild(title); head.appendChild(meta); head.appendChild(allBtn);
    head.onclick = () => g.classList.toggle('open');
    const body = document.createElement('div');
    body.className = 'ch-body';
    groups[ch].forEach(m => {
      const c = document.createElement('span');
      c.className = 'chip on';
      c.textContent = m.id + ' ' + m.name;
      c.onclick = () => {
        if (selected.has(m.id)) { selected.delete(m.id); c.classList.remove('on'); }
        else { selected.add(m.id); c.classList.add('on'); }
        updateStat();
      };
      chipEls[m.id] = c;
      body.appendChild(c);
    });
    const setChapter = on => {
      groups[ch].forEach(m => {
        if (on) selected.add(m.id); else selected.delete(m.id);
        chipEls[m.id].classList.toggle('on', on);
      });
      allBtn.textContent = on ? '清空' : '全选';
      updateStat();
    };
    allBtn.onclick = e => { e.stopPropagation(); setChapter(allBtn.textContent === '全选'); };
    g.appendChild(head); g.appendChild(body);
    chipsBox.appendChild(g);
    chMetas[ch] = { meta, mods: groups[ch], allBtn };
  });

  function updateChMetas() {
    Object.entries(chMetas).forEach(([ch, v]) => {
      const selN = v.mods.filter(m => selected.has(m.id)).length;
      const cardsN = v.mods.reduce((s, m) => s + (cardCount[m.id] || 0), 0);
      v.meta.textContent = `已选 ${selN}/${v.mods.length} 模块 · ${cardsN} 张卡`;
      v.allBtn.textContent = selN === v.mods.length ? '清空' : '全选';
    });
  }

  $('btnExpandAll').onclick = () => Object.values(chipsBox.children).forEach(g => g.classList.add('open'));
  $('btnCollapseAll').onclick = () => Object.values(chipsBox.children).forEach(g => g.classList.remove('open'));
  $('btnSelectAll').onclick = () => { MODULES.forEach(m => selected.add(m.id)); Object.values(chipEls).forEach(c => c.classList.add('on')); updateStat(); };
  $('btnSelectNone').onclick = () => { selected.clear(); Object.values(chipEls).forEach(c => c.classList.remove('on')); updateStat(); };

  document.querySelectorAll('.mode-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); mode = b.dataset.mode;
      updateStat();
    };
  });

  function getDeck() {
    let pool;
    if (mode === 'srs') {
      return dueCards();
    } else if (mode === 'weak') {
      pool = CARDS.filter(c => (stats[c.m + ':' + c.q]?.wrong || 0) > 0);
      if (!pool.length) pool = CARDS.filter(c => selected.has(c.m));
    } else {
      pool = CARDS.filter(c => selected.has(c.m));
    }
    pool = pool.slice();
    if (mode === 'shuffle') {
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
    return pool;
  }

  function updateStat() {
    const total = CARDS.filter(c => selected.has(c.m)).length;
    const weakCount = Object.values(stats).filter(s => s.wrong > 0).length;
    const dueN = dueCards().length;
    $('statLine').textContent = `已选 ${selected.size} 个模块 · 共 ${total} 张卡 · 历史错题 ${weakCount} 张 · 📅 现在到期 ${dueN} 张`;
    updateChMetas();
  }
  updateStat();

  $('startBtn').onclick = start;

  function start() {
    deck = getDeck();
    if (!deck.length) {
      alert(mode === 'srs' ? '🎉 所选模块目前没有到期的卡片，明天再来吧！\n（到期时间会按记忆曲线自动安排）' : '请至少选择一个模块');
      return;
    }
    idx = 0; roundKnow = 0; roundTotal = 0; weakThisRound = {};
    gradeTally = [0, 0, 0, 0];
    $('setup').classList.add('hidden');
    $('result').classList.add('hidden');
    $('quiz').classList.remove('hidden');
    const isSrs = mode === 'srs';
    $('freeActions').classList.toggle('hidden', isSrs);
    $('srsActions').classList.toggle('hidden', !isSrs);
    $('srsInfo').classList.toggle('hidden', !isSrs);
    showCard();
  }

  function showCard() {
    if (idx >= deck.length) return finish();
    flipped = false;
    const c = deck[idx];
    $('card').classList.remove('flip');
    $('qText').textContent = c.q;
    $('aText').textContent = c.a;
    const mod = modMap[c.m];
    ['tagFront', 'tagBack'].forEach(t => {
      const el = $(t); el.textContent = mod.id + ' · ' + mod.name; el.style.background = mod.color;
    });
    $('counter').textContent = `第 ${idx + 1} / ${deck.length} 张`;
    $('moduleName').textContent = '';
    $('knowCount').textContent = `已掌握 ${roundKnow}`;
    $('progressBar').style.width = (idx / deck.length * 100) + '%';
    if (mode === 'srs') {
      const s = srs[keyOf(c)] || srsNew();
      const isNew = s.reps === 0;
      $('srsDueInfo').innerHTML = isNew
        ? '<span class="due-line">🆕 新卡</span>'
        : `<span>第 ${s.reps + 1} 次复习 · 上次间隔 ${ivlLabel(s.ivl)} · 熟练度 ${s.ease.toFixed(2)}</span>`;
      const rest = deck.length - idx - 1;
      $('srsStreak').textContent = `剩余 ${rest} 张`;
      [0, 1, 2, 3].forEach(g => {
        $('g' + ['Again', 'Hard', 'Good', 'Easy'][g]).textContent = `${GRADE_NAMES[g]} · ${ivlLabel(nextIvl(s, g))}`;
      });
    }
  }

  function flip() {
    if (flipped) return;
    flipped = true;
    $('card').classList.add('flip');
  }
  $('card').onclick = flip;

  // ---- SRS 评分（Anki 式：未翻面先翻面，再评分）----
  function srsGrade(g) {
    if (idx >= deck.length) return;
    if (!flipped) { flip(); return; }
    const c = deck[idx];
    applyGrade(c, g);
    gradeTally[g]++;
    const key = keyOf(c);
    stats[key] = stats[key] || { right: 0, wrong: 0 };
    if (g >= 2) { stats[key].right++; roundKnow++; }
    else if (g === 0) {
      stats[key].wrong++;
      weakThisRound[c.m] = (weakThisRound[c.m] || 0) + 1;
    }
    localStorage.setItem(LS_KEY, JSON.stringify(stats));
    roundTotal++;
    idx++;
    showCard();
  }
  $('gAgain').onclick = () => srsGrade(0);
  $('gHard').onclick = () => srsGrade(1);
  $('gGood').onclick = () => srsGrade(2);
  $('gEasy').onclick = () => srsGrade(3);

  function mark(knew) {
    if (!flipped) flip(); // 先自动翻面让用户看到答案再进入下一张？不：直接记
    const c = deck[idx];
    const key = c.m + ':' + c.q;
    stats[key] = stats[key] || { right: 0, wrong: 0 };
    if (knew === true) { stats[key].right++; roundKnow++; }
    else if (knew === false) {
      stats[key].wrong++;
      weakThisRound[c.m] = (weakThisRound[c.m] || 0) + 1;
    }
    if (knew !== null) roundTotal++;
    localStorage.setItem(LS_KEY, JSON.stringify(stats));
    idx++;
    showCard();
  }

  function finish() {
    $('quiz').classList.add('hidden');
    $('result').classList.remove('hidden');
    if (mode === 'srs') {
      const [nAgain, nHard, nGood, nEasy] = gradeTally;
      $('scoreText').textContent = `${roundTotal} 张`;
      $('resultSub').textContent = `重来 ${nAgain} · 困难 ${nHard} · 良好 ${nGood} · 简单 ${nEasy}`;
      const left = dueCards().length;
      $('resultNext').textContent = left
        ? `仍有 ${left} 张已到期（多为"重来"的卡片，10 分钟后可再刷）`
        : '🎉 全部刷完！下次到期时间已到卡片会按时自动出现，记得每天回来复习';
    } else {
      $('scoreText').textContent = roundTotal ? Math.round(roundKnow / roundTotal * 100) + '%' : '—';
      $('resultSub').textContent = `掌握 ${roundKnow} / ${roundTotal} 张（跳过不计）`;
      $('resultNext').textContent = '';
    }
    const weakList = $('weakList');
    weakList.innerHTML = '';
    const entries = Object.entries(weakThisRound).sort((a, b) => b[1] - a[1]);
    if (!entries.length) {
      $('weakBox').innerHTML = '<h3>🎯 本轮没有错卡，太棒了！</h3>';
    } else {
      entries.forEach(([m, n]) => {
        const div = document.createElement('div');
        div.className = 'weak-item';
        div.innerHTML = `<span>${modMap[m].id} ${modMap[m].name}</span><span style="color:#e8a33d">${n} 张不熟</span>`;
        weakList.appendChild(div);
      });
    }
    updateStat();
  }

  $('againBtn').onclick = () => { $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); };
  $('quitBtn').onclick = () => { $('quiz').classList.add('hidden'); $('setup').classList.remove('hidden'); updateStat(); };
  $('btnYes').onclick = () => mark(true);
  $('btnNo').onclick = () => mark(false);
  $('btnSkip').onclick = () => mark(null);

  document.addEventListener('keydown', e => {
    if (!$('quiz').classList.contains('hidden')) {
      if (mode === 'srs') {
        if (e.code === 'Space') { e.preventDefault(); flip(); }
        else if (e.key === '1') srsGrade(0);
        else if (e.key === '2') srsGrade(1);
        else if (e.key === '3') srsGrade(2);
        else if (e.key === '4') srsGrade(3);
        else if (e.key === 'ArrowLeft') srsGrade(0);
        else if (e.key === 'ArrowRight') srsGrade(2);
      } else {
        if (e.code === 'Space') { e.preventDefault(); flip(); }
        else if (e.key === 'ArrowLeft') mark(false);
        else if (e.key === 'ArrowRight') mark(true);
        else if (e.key === 'ArrowDown') mark(null);
      }
    }
  });

</script>
</body>
</html>
