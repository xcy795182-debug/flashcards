{ m: '31A', q: '身材矮小症的病因分类（生长轴功能障碍）？', a: '身材矮小：身高处于同年龄同性别正常健康儿童生长曲线第3百分位数以下或低于平均数减2个标准差；生长轴任何环节障碍均可致生长迟缓。\n病因分类：\n1.下丘脑-垂体先天异常——中枢神经系统发育异常致生长激素缺乏：全前脑缺乏或无脑、脑裂、视中隔发育不良、视神经发育不良；面部畸形（单门齿脑中线发育不良、视神经伴透明隔发育不良、唇裂腭裂）可伴下丘脑缺陷和/或垂体GH或多种垂体激素缺乏；空蝶鞍（蝶鞍膈缺乏致鞍上蛛网膜腔疝入鞍膜，垂体变平，多伴GH缺乏）。\n2.破坏性病变——颅底骨折或出血、出生时缺血缺氧性脑病、颅内肿瘤（特别是颅咽管瘤、神经胶质瘤）、脑膜炎、颅内结核、弓形虫病、肉芽肿病、颅内血管瘤；对颅脑、眼及中耳部放射治疗（CNS恶性肿瘤及白血病头颅放疗）可影响生长轴：放疗开始年龄小者危害更大；总剂量>1800~2000cGy时GH轴障碍发病率较高且发病早；<1800cGy可改变青春期GH自发分泌增高；>2400cGy时GH自发分泌减少而刺激后仍可正常反应；>2700cGy时自发分泌和刺激后均受影响；短时间大剂量放疗危险更大；化疗药物颅内或脊髓腔内注射也是生长障碍的部分原因。\n3.特发性下丘脑-垂体功能减低（IGHD）——多数患儿功能减低而未能发现明显病变，病变多在下丘脑，常散发；有些为臀位产，与出生时窒息或产钳助产等缺血缺氧有关。\n4.遗传性生长轴功能障碍：\n①GH1基因缺陷致单纯性GHD（IGHD）——分Ⅰ型（常隐）、Ⅱ型（常显）、Ⅲ型（X连锁）；IA型GH完全缺乏（初期对GH治疗反应良好但易产生抗体）；Ⅲ型（Xq22 BTK基因）还伴免疫球蛋白缺乏。\n②遗传性多种垂体激素缺乏（MPHD）——常隐或性连锁遗传，GH、TSH、ACTH、LH、FSH缺乏而PRL多正常或升高；给各种激素释放因子试验垂体常能反应，说明病变在下丘脑；PIT-1基因突变引起GH、PRL、TSH减少（GHD+甲状腺功能减退）。\n③GH不敏感症（GHI）——GH受体基因缺失或突变：Laron综合征（常隐，严重生长障碍常伴低血糖，GH高而IGF-1非常低，对外源GH无反应，可用IGF-1治疗）；非洲俾格米侏儒——IGF-1受体缺陷（常隐），GH正常或升高、IGF-1减少、IGF-2正常，外源GH不能改善生长。\n④精神性生长障碍（曾称精神剥夺性侏儒）——环境因素经CNS产生抑郁情绪致下丘脑-垂体GH分泌减低；改变环境、心情舒畅后GH分泌可恢复正常，生长随之改善。' },
{ m: '31A', q: '生长激素缺乏症（GHD）的临床表现、辅助检查（GH激发试验、IGF-1）与诊断？', a: '临床表现：出生时身长和体重多正常（GH不敏感或受体缺陷者出生身长可低于正常）；严重GH缺乏（如GH基因缺失）1岁时即可明显矮于正常平均值4SD；缺乏较轻者出生1岁后逐渐生长减慢；身高常在同年龄同性别第3百分位数以下或-2SD以下；生长速度一般<4cm/年；头部圆形、面部幼稚、皮肤细腻、头发纤细、鼻梁较矮、牙齿萌出较迟，四肢和身体比例匀称，躯体稍胖、手足较小；智力多正常；骨骼生长落后；少数可有空腹低血糖；男孩可有小阴茎。下丘脑或垂体受损严重时可多种垂体激素缺乏——伴ACTH缺乏者易发生低血糖，伴TSH缺乏者食欲缺乏活动较少等轻度甲减症状，伴促性腺激素缺乏者性腺发育不全（小阴茎、青春期无第二性征发育）。器质性GHD可发生于任何年龄——围产期异常导致者常伴尿崩症；颅内肿瘤（多为颅咽管瘤或鞍上鞍内肿瘤）导致者多有头痛、呕吐、视力障碍和眼底改变。\n辅助检查：①骨龄——腕骨片测骨龄通常落后于年龄2岁以上。②GH激发试验——生理状态下GH脉冲式分泌，单次测定不能反映分泌情况，疑诊必须做刺激试验；生理性刺激（睡眠试验、运动试验）在儿童难以获得可靠资料；药物激发用胰岛素（0.075~0.1U/kg静推）、精氨酸（10%精氨酸0.5g/kg最大30g，30分钟内静滴）、左旋多巴（10mg/kg顿服）、可乐定（0.15mg/m²顿服）、高血糖素等；刺激前禁食卧床，试验前30分钟放好留置针，上午8~10时进行；用药前及后30、60、90、120分钟取血测GH，峰值≥10μg/L为正常；两种药物刺激试验GH峰值均<10μg/L为GHD，5~10μg/L为部分缺乏，<5μg/L为完全缺乏；必须两种以上药物刺激试验均不正常方可确诊（一般选胰岛素加可乐定或左旋多巴）；约4%生长正常儿童可出现不正常反应，且激发试验受药物、检测方法、性发育状态影响。GH刺激试验正常而临床仍疑GH轴障碍时，可夜间睡眠中每15~20分钟测定12~24小时GH分泌节律（峰减少峰值减低为GH神经分泌功能障碍GHND）；GHRH刺激试验GH反应正常提示病变在下丘脑。③IGF-1和IGFBP-3——均为检测GH-IGF轴功能的指标，水平稳定无脉冲昼夜变化，较好反映内源性GH分泌状态。④GH-IGF-1轴缺陷相关基因（GH1、GHR、IGF1、IGF1R、STAT5B、IGF-ALS等）分析。\n诊断步骤：①详细病史（母亲妊娠史、分娩史、父母身高、青春发育开始年龄）；②体格检查；③骨龄；④GH激发试验；⑤IGF-1、IGFBP-3；⑥影像学（垂体MRI）；⑦基因检测。鉴别诊断需涵盖家族性矮身材、体质性青春期生长延迟、甲状腺功能减退、Turner综合征、SGA、骨骼发育异常、其他系统慢性疾病等。' },
{ m: '31A', q: '身材矮小症的鉴别诊断思路（9步）与各鉴别点？', a: '诊断步骤：①详细病史（母亲妊娠史、分娩史、父母身高、青春发育开始年龄、营养生长疾病史）；②认真体格测量及全身体格检查；③分析身体比例是否匀称、生长速度、身高体重百分位、智力发育，形成初步诊断路线。\n1.体格匀称矮身材（身高<P3或-2SD，骨龄落后2岁以上，生长速度<5cm/年或生长曲线向下偏离）→ 考虑生长轴障碍，进行生长轴一系列检查确诊。\n2.身体比例不匀称或有明显畸形→ 考虑骨骼代谢病（骨软骨发育不良、黏多糖病、严重性佝偻病）或严重先天性甲减；选适当部位X线和相关实验室检查（甲状腺功能等），必要时基因分析（对遗传性骨病意义重大）。\n3.家族性身材矮小——父母身材矮（男<160cm，女<150cm），患儿身高常在P3左右，但年生长速率>5cm/年，骨龄和年龄相称，智能和性发育正常。\n4.体质性生长及青春发育延迟（CDPG）——多见男孩，可有家族史（父亲一方多见）；青春期开始比正常迟3~5年，青春期前生长缓慢、骨龄相应落后但身高与骨龄一致；最易与GHD混淆——身高落后常在P3上下、骨龄落后2~3岁而与身高龄相符、生长速度和曲线基本在正常低限以上、GH轴功能正常、终身高一般正常。\n5.宫内生长落后（低出生体重儿和小于胎龄儿SGA）——大多数SGA生后6~12个月出现追赶生长，2~3岁时90%实现追赶生长；部分生长一直落后致成年矮身材；≥4岁身高仍低于同年龄同性别均值2SD时可考虑rhGH治疗；SGA成年后肥胖、胰岛素抵抗、糖耐量受损、心血管疾患发病率高于适于胎龄儿。\n6.特发性矮身材（ISS）——病因不明；出生身长体重正常；生长速率稍慢或正常（一般<5cm/年）；两项GH激发试验GH峰值≥10μg/L、IGF-1基本正常；骨龄正常或延迟；无明显慢性器质性疾病、无严重心理情感障碍、无染色体异常；实质是病因未明矮身材疾病的总称（可能存在GH分泌量减少、SHOX基因缺陷、GH启动子功能障碍、GH分子异常、GH信号途径遗传缺陷等）。\n7.Turner综合征——女孩身材矮小应考虑；身材矮小+第二性征不发育+特殊躯体特征（颈短、颈蹼、肘外翻、后发际低、乳距宽、色素痣多）；典型者易区别，嵌合型或等臂染色体者症状不典型需染色体核型分析确定。\n8.Noonan综合征——常染色体显性遗传；特殊面容、矮身材、胸部畸形、先天性心脏病；核型正常，确诊需基因诊断。\n9.其他内分泌代谢病（先天性肾上腺皮质增生症、性早熟、皮质醇增多症、黏多糖病、糖原贮积症）各有特殊表现易鉴别；全身各器官慢性疾病所致矮小应积极治疗原发病（慢性肾衰竭生长减慢病因复杂含GH轴功能障碍，GH治疗可促进生长）。\n其他检查：GHD确诊后查下丘脑-垂体轴其他内分泌功能（TSH、T4或TRH刺激试验、GnRH刺激试验；胰岛素+TRH+LHRH联合测定可同时了解垂体多功能）；矮身材伴体态异常者染色体核型分析（尤其女性矮小伴青春期发育延迟，排除Turner）；已确诊GHD者行头颅MRI（了解下丘脑-垂体发育异常或器质性病变，检测颅内肿瘤意义重大）；二代测序基因检测（HESX1、LHX3、LHX4、PROP1、POU1F1等）。' },
{ m: '31A', q: 'rhGH治疗的方案、监测与不良反应？', a: '适应证：生长激素缺乏症；小于胎龄儿≥4岁身高仍低于-2SD；特发性矮身材等（慢性肾衰竭致生长减慢也可促进生长）。\n方案：0.1U/(kg·d)，每晚临睡前皮下注射一次（或每周总剂量分6~7次注射）；早期开始治疗效果较好，治疗后第1年约增10~12cm，之后生长速率可减慢；治疗中根据生长速率、青春发育状况及IGF-1水平调整剂量，最大量不宜超过0.2U/(kg·d)；促生长治疗持续至骨闭合为止；达成年身高后需再行GH分泌状况评估（多种垂体激素缺乏者除外），如仍存在GH缺乏转成人内分泌科随访并给予小剂量GH替代维持心血管及代谢功能。\n监测：每3个月监测身高、体重、性发育状态、生长速率、身高SDS等生长发育指标及甲状腺功能、血糖、胰岛素等糖代谢指标；每年监测骨龄，必要时肝肾功能、肾上腺皮质功能。治疗前测甲状腺功能，甲减者先给左甲状腺素、甲功正常后再开始rhGH；治疗后前3个月每月监测甲状腺功能。同时伴性腺轴功能障碍的GHD患儿骨龄达12岁可开始性激素治疗（男性睾酮、女性雌激素小剂量开始调整剂量）。\n不良反应：总体发生率低于3%——良性高颅压、糖代谢影响（长期治疗降低胰岛素敏感性、增加胰岛素抵抗，部分患者空腹血糖受损或糖耐量受损，多为暂时可逆极少发展为糖尿病，绝大多数治疗中血糖维持正常——治疗前及过程中定期查空腹血糖胰岛素，必要时OGTT）、甲状腺功能低下、股骨头滑脱、脊柱侧弯、诱发肿瘤的可能性、色素痣、手脚变大；注射局部红肿皮疹不常见，中耳炎、胰腺炎、男性乳腺发育少数报道。临床资料未显示rhGH增加肿瘤发生复发危险或导致糖尿病，但恶性肿瘤及严重糖尿病患者建议不用；治疗前应常规头颅MRI排除颅内肿瘤。考虑合并多种垂体激素缺乏者，治疗过程中监测肾上腺皮质功能——多发垂体功能缺乏如有TSH缺乏产生甲减应给予L-甲状腺素替代；如有ACTH分泌不足，无明显肾上腺皮质功能不全症状时一般不用糖皮质激素，必须用亦需最小量（防止糖皮质激素拮抗GH作用）。' },
{ m: '31A', q: '中枢性尿崩症的病因分类与临床表现？', a: '尿崩症（DI）：患儿完全或部分丧失尿液浓缩功能，以多饮、多尿和排出稀释性尿为特点的临床综合征；与AVP神经元完整性及AVP结构、合成、转运、分泌和功能异常有关；分中枢性尿崩症和肾性尿崩症。\n中枢性尿崩症病因：\n1.先天发育异常——脑中线发育不良、全前脑、家族性垂体发育不良、视神经发育不良等；患儿多有面部异常，有的伴渴感异常。\n2.遗传原因——家族性常染色体显性遗传中枢性尿崩症（任何年龄均可发生，多于10岁前出现症状，AVP开始分泌正常后逐渐减少；同一家族高外显率但表现轻重不同；曾发现室旁核缺乏大细胞神经元而视上核有AVP神经元；AVP结构基因单个核苷酸突变已发现30多种，多为点突变，突变产物可引起神经元退行性变和细胞死亡，影响AVP与受体结合或cAMP产生，不同突变者对dDAVP治疗反应不同）；更少见常染色体隐性DIDMOAD综合征（糖尿病-视神经萎缩-耳聋，wfs1基因4p16变异，即Wolfram综合征）。\n3.创伤——颅脑外伤（尤其颅底骨折）、手术损伤（下丘脑或垂体部位手术）、产伤；下丘脑-垂体部手术是易发生尿崩症的原因之一（手术切断神经轴索引起下丘脑神经元退行性变或直接损伤下丘脑神经元）；术后尿崩症三期——①暂时性多尿期（半天至2天，尿量可达>200ml/(m²·h)，局部水肿所致）；②升压素分泌不当（SIADH）期（神经元破坏死亡致AVP释放失控，尿量减少；2期SIADH越严重预示永久性尿崩症可能越大）；③永久尿崩症（约90%AVP神经元破坏）；如同时有皮质醇缺乏（如颅咽管瘤术后）因影响自由水清除尿量增多不明显，糖皮质激素治疗后可突发尿崩症；术后多尿应与术中输液过多鉴别（查输液记录）。\n4.肿瘤——约1/3以上患儿由颅内肿瘤所致；常见颅咽管瘤、视神经胶质瘤、松果体瘤等；AVP神经元集中在下丘脑很大范围，能引起尿崩症的肿瘤或较大、或浸润垂体柄下丘脑-垂体束的重要部位；颅咽管瘤最常见，视神经胶质瘤多数在手术后发生持续性尿崩症；典型松果体瘤发生于下丘脑底部（AVP轴索集中进入垂体后叶之前最易发生尿崩症）；胚胎生殖细胞瘤很小（尿崩症后数年MRI仍无法查见，需测血AFP、βhCG，定期MRI可能发现）。\n5.浸润、自身免疫和感染——朗格汉斯细胞组织细胞增生症（约10%患者发生尿崩症，多病情重病程长，浸润垂体柄MRI示垂体柄较粗3~5mm）和淋巴细胞垂体炎（约半数患者有"特发性尿崩症"，可伴其他自身免疫疾病）最常见；急性髓性白血病可浸润垂体柄和蝶鞍；脑底部炎症（结核性脑膜脑炎、脑膜炎球菌、隐球菌、李斯特菌、弓形体脑膜炎、CMV感染）及脑部非特异性炎症。\n6.其他——儿童原发遗尿可有AVP分泌原发缺陷，用dDAVP治疗效果很好。\n临床表现：任何年龄；烦渴、多饮（可>3000ml/m²）、多尿（每日尿量可达4~10L甚至更多），尿比重和渗透压均很低，夜尿增多可遗尿；喜冷饮；婴儿渴感时哭闹不肯进食、给饮水后安静；喂水不足可便秘、低热、脱水甚至休克，严重脱水可致脑损伤及智能缺陷；烦渴夜尿影响睡眠学习，少汗、皮肤干燥苍白、精神不振、食欲低下、体重不增、生长缓慢；如充分饮水一般情况正常无明显体征。尿比重常<1.010，尿渗透压<300mOsm/kg；血钠增高、血浆渗透压增高。' },
{ m: '31A', q: '尿崩症的诊断（禁水试验、升压素试验）与鉴别诊断？', a: '病史要点：夜间起尿时是否饮水很重要；记录出入量——多饮多尿每日>2L/m²或>50ml/(kg·24h)为病理现象。\n初步检查：血浆渗透压和血Na、K、Cl、Cr、BUN，尿液分析（尿渗透压、尿比重、尿糖）；血浆渗透压>300mOsm/kg+尿渗透压<300mOsm/kg可诊断尿崩症。\n禁水（限水）试验：血浆渗透压>270mOsm/kg时进行；开始前排空膀胱，记录体重、血压、体温、血Na、血浆渗透压；禁水8小时或更长时间；每小时排尿记尿量、尿色、比重，每4小时测血浆渗透压；若每次尿量减少不多、或尿比重和尿渗透压上升不明显，尿渗透压10小时以上一直<600mOsm/kg并血浆渗透压>300mOsm/kg，应考虑尿崩症；尿渗透压>600mOsm/kg并稳定1小时以上可排除尿崩症；如脱水症状明显（发热、烦躁、意识下降、体重下降达5%）且相邻两次尿渗透压之差连续两次<30mmol/L，应终止试验并再测渗透压血钠。\n升压素（垂体后叶素）试验：限水试验后皮下注射垂体升压素1U/m²（1ml=5U），其后每15分钟排尿一次——尿量明显减少、尿比重和尿渗透压上升，尿渗透压上升峰值超过给药前50%为中枢性尿崩症；与肾性尿崩症鉴别时后者对垂体升压素无反应。部分性AVP缺乏者对限水耐受较好，尿渗透压虽能上升但多数不能达600mOsm/kg，也不能尿渗透压/血浆渗透压>1。\n血浆AVP测定：中枢性尿崩症血浆AVP浓度低于正常；肾性尿崩症血浆AVP基础状态可测出、禁饮后明显升高但尿液不能浓缩；精神性多饮AVP分泌正常（AVP半衰期短24分钟、检测繁琐耗时限制应用）。\n病因检查：诊断中枢性尿崩症后进一步查病因，必要时MRI检查下丘脑垂体排除颅内病变；头颅MRI垂体后叶被破坏后图像中垂体后叶亮点消失。\n鉴别诊断：\n1.强迫性多饮（原发性多饮/精神性多饮）——精神因素存在，较大儿童精神刺激后过多饮水形成习惯（或婴儿发热预防疾病习惯性喂水过多）；过多饮水使体液稀释成低渗状态，血浆渗透压减低抑制AVP分泌，肾小管水重吸收减少尿量增多，渴感再饮水形成恶性循环；渐进性起病症状逐渐加重，每日饮水量不固定，虽尿渗透压和尿比重偏低但血浆渗透压不增高；对限水耐受较好可夜间不饮水；AVP分泌能力正常，禁水试验较升压素试验更能使其尿渗透压增高；长期限制饮水病情逐渐恢复正常。\n2.肾性尿崩症——肾脏对AVP部分或完全抵抗；先天遗传性（X连锁显性AVPR2基因突变致V2受体缺陷；常隐Aquaporin-2基因突变）或获得性（锂剂——接受锂治疗者约50%损伤尿浓缩功能、10%~20%发展为临床尿崩症，锂损伤AVP刺激腺苷酸环化酶产生、使Aquaporin基因mRNA在肾集合管表达减少；四环素抑制肾小管上皮细胞水转运；多囊肾、镰状细胞病；蛋白质和钠摄入减少致肾髓质张力减低）；对垂体升压素无反应。\n3.其他多饮多尿——多为高溶质性：糖尿病（尿糖阳性）、高尿钙、肾小管酸中毒；肾功能不全、低钾血症等易鉴别。' },
{ m: '31A', q: '尿崩症的治疗（dDAVP、噻嗪类、阿米洛利、吲哚美辛）与SIADH要点？', a: '中枢性尿崩症治疗：1.病因治疗——肿瘤可手术切除；特发性者检查有无垂体其他激素缺乏；渴感正常者充分饮水，但有脱水、高钠血症时应缓慢给水以免造成脑水肿。2.新生儿和单纯喂奶小婴儿全是液体食物一般不需药物治疗和单独大量饮水；用升压素须注意水中毒危险；尿量太多口渴严重时可用氢氯噻嗪类药物（增加近端肾小管对钠水重吸收减少饮水量）。\n（1）升压素类：①dDAVP（1-脱氨-8-D-精氨酸升压素，去氨加压素）——AVP衍生物（第1个半胱氨酸去氨基、第8位左旋精氨酸改右旋），与V2受体结合促进肾小管水重吸收浓缩尿，是治疗中枢性尿崩症的主要药物；口服缓释片0.1mg/片作用8~12小时，从小量开始一般100~300μg分2~3次口服，同时适当减少饮水防水中毒，不足以维持夜间不起尿时可加量必要时每日2次（婴儿小年龄者减少饮水防水中毒）；喷鼻剂维持12~24小时（100μg/ml），通常2~40μg/次每日1~2次，从小剂量开始（婴儿每次0.5~1μg，儿童自2.5μg起）渐加至疗效满意，用前清洁鼻腔；副作用少见（头痛、腹部不适；喷鼻剂眼刺激、鼻炎咳嗽）。②鞣酸升压素油剂（垂体后叶素油剂）——长效，混悬液用前加温摇匀深部肌注，开始0.1~0.2ml作用维持3~7天，待多饮多尿症状出现时再给药，用药期间控制饮水量防水中毒。③其他替代：氢氯噻嗪（抑制肾髓质及升支部钠氯重吸收，减少近端肾小管水重吸收减少尿量，用于小婴儿中枢性尿崩症，1~2mg/kg分2~3次口服，副作用低钾血症应适当补钾）；阿米洛利（抑制远端肾小管和集合管皮质段钠重吸收，增加水随钠排出，降低肾小球滤过率，与氢氯噻嗪合用治肾性尿崩症）。\n肾性尿崩症治疗：后天原因者消除原因；先天性治疗困难，目的是保证适当热量摄入、保证生长正常、避免严重脱水（早期治疗可减轻生长和智能落后）。①氢氯噻嗪2mg/(kg·d)分2次（增加钠水排出、减少肾小球滤过率、增加近端肾小管钠水重吸收，可引起缺钾宜联合保钾利尿剂）；②阿米洛利5~10mg/次每日2次（减少肾小管上皮对锂的重吸收，更适用锂盐引起的肾性尿崩症）；③吲哚美辛2mg/(kg·d)分3次（抑制肾脏前列腺素合成减少多尿；治疗期间推荐低盐饮食300~500mg/d，因高盐饮食影响肾脏对水的重吸收）。\nSIADH（抗利尿激素分泌失调综合征）：儿童部分为医源性（输液不当输入低张液过多）；可发生于颅内病变（脑膜炎、脑肿瘤、头部创伤）——儿童结核性脑膜炎时AVP分泌增多伴低钠血症预示病情严重和预后不良；下丘脑垂体术后第2期可出现；dDAVP治疗中枢性尿崩症或遗尿药物过量；肺部疾患（肺阻塞疾病、机械高压通气）及药物（卡马西平、化疗药）。主要临床表现为中枢神经系统症状（呕吐、头疼），早期疲乏；主要因肾水重吸收过多引起水潴留、体液容量过大、水中毒和低钠血症，血浆渗透压降低，排出高渗性尿和尿排钠增多；慢性低血钠多无明显症状甚至血Na<120mmol/L；快速不适当输入低张液使血钠较快低于130mmol/L会发生惊厥和昏迷（小年龄儿童），患儿肾功能正常。治疗：慢性SIADH最好治疗是限制饮水（正常人每天肾溶质负荷需水500ml/m²、非肾脏水丢失500ml/m²，限水量1000ml/m²使低钠血症纠正非常慢）；急性SIADH一般无神经症状也只是限水，有神经症状时可给3%NaCl 3~5ml/kg（使血钠上升5~7mmol/L即应停止——醛固酮和心房钠尿肽使钠很快从尿排出不能在血中保留），治疗应是长期限水缓慢纠正；药物尿素口服效果较好。最重要是预防，警惕药物引起的SIADH。' },
{ m: '31B', q: '甲状腺的胚胎发育与胎儿甲状腺功能的建立？', a: '甲状腺起源于内胚层：胚胎第3周出现甲状腺正中原基和侧原基；第4周内胚层细胞增生呈憩室状由舌下向颈前伸展下降（甲状舌骨导管）；第6~7周甲状腺呈两叶移至颈前位置，甲状舌骨导管退化。发育初期甲状腺与心脏大血管相邻，心脏下降后分离，偶有部分甲状腺随心脏下移形成胸腔异位甲状腺。参与甲状腺调控/生成/分化/下降及甲状腺球蛋白和过氧化物酶表达的基因：PROP1、PIT-1、LHX4、HESX1、TSHR、NKX2.1、NKX2.5、TTF-1、TTF-2（Foxe1）、PAX8、DUOX2、TG、TPO、NIS、SLC26A4等。\n功能建立时间线：第4~6周可检测到甲状腺球蛋白Tg合成；6~8周胎儿下丘脑能合成TRH、垂体能分泌TSH；8~10周甲状腺能摄取碘及碘化酪氨酸；第12周能耦联成T3、T4并释放甲状腺激素至血循环；20周前胎儿血清TSH、T4、T3、FT3、FT4水平均低，以后逐渐升高，至足月T4约11.5μg/dl、T3约45ng/dl、TSH约10mU/L。胎儿甲状腺激素合成前约母体T4的1/3可通过胎盘，对胎儿发育尤其脑发育起重要作用；正常情况下羊水TSH测不出，母体TSH不能通过胎盘；妊娠中期胎儿开始建立下丘脑-垂体-甲状腺轴，出生后反馈与负反馈调节逐步完善（胎儿血T4在TSH影响下升高，TBG浓度同时升高，胎儿T4较母体低）。抗甲状腺药包括放射性碘可自由通过胎盘——甲亢母亲孕期接受治疗，胎儿出生后可导致甲减合并甲状腺肿的新生儿；母体TSH不能通过胎盘，但甲亢母亲可将人类甲状腺刺激免疫球蛋白HTSI输至胎儿而发生新生儿突眼性甲亢。\n新生儿出生后变化：生后约30分钟，由于冷环境刺激及低T4反馈的结果，新生儿血中TSH可突升高达60mU/L，1~2天后下降，多数3天后<10μU/ml；T3、T4生后4小时内亦升高（T4 16μg/dl、T3 300ng/dl），1~2周T4下降到12μg/dl、T3下降至<200ng/ml；婴儿期血清FT4 0.9~2.3μg/dl、FT3 540pg/dl；儿童期FT4 0.7~1.8pg/dl、FT3 210~440pg/dl；生后2周rT3为200ng/dl、生后4周降至约50ng/dl。' },
{ m: '31B', q: '甲状腺激素的合成步骤、转运与代谢？', a: '合成四步：①碘的摄取——碘是合成甲状腺激素的重要原料（小婴儿每天需要30μg/kg，儿童90~120μg/kg，青少年成人100~150μg/kg；欧洲最大耐受量600μg/d、美国1100μg/d）；无机碘在小肠吸收，经甲状腺上皮细胞膜碘泵浓集入细胞内（克服膜电位差，钠-碘Na-I转运体参与）。②碘化物氧化及酪氨酸碘化——发生在滤泡细胞微绒毛与滤泡腔胶质交界处，过氧化物酶作用下碘化物氧化成活性碘，与甲状腺球蛋白分子上的酪氨酸结合成一碘酪氨酸MIT及二碘酪氨酸DIT。③激素合成——两个DIT残基共价缩合成一分子T4，MIT和DIT各一分子缩合成一分子T3，T4与T3储存在甲状腺滤泡细胞内。\n④释放——TSH刺激时滤泡细胞胞饮作用使甲状腺球蛋白回到胞质内，胶质小滴与溶酶体融合，蛋白水解酶水解释放T4、T3入血；释放出的MIT和DIT被脱碘酶脱碘，无机碘再利用（碘的甲状腺内再循环）；少量碘由尿排泄，消化道粪便排出也是重要途径；肝脏甲状腺激素与葡糖醛酸或硫酸结合随胆汁入肠道，部分经细菌水解、肠黏膜吸收形成肠肝循环。\n转运：分泌入血后绝大部分与血浆蛋白结合——T4约75%与TBG（甲状腺结合球蛋白，分子量54kD糖蛋白，编码基因位于X染色体）结合、15%与TBPA（甲状腺素结合前清蛋白）结合、10%与白蛋白结合；T3约65%~70%与TBG结合、8%与TBPA结合其余与白蛋白；T3与TBG结合不如T4紧密，且T3与细胞核内甲状腺激素蛋白受体亲和力比T4强10倍，故T3进入细胞较T4容易，生理活性较T4强3~4倍但持续时间短。TBG水平高低影响总T4水平：TBG减低见于先天性TBG缺乏症（X连锁显性遗传，新生儿甲减筛查偶有发现）、摄入雄激素同化类固醇糖皮质激素及左天冬酰胺酶、肝脏疾病或大量蛋白丢失（肾病综合征）；TBG增高见于先天性TBG增高症（X连锁显性遗传）。\n代谢：正常情况下T4分泌率较T3高8~10倍；T4在周围组织（尤其肝肾）经脱碘酶作用，每日分泌T4的30%~40%产生T3（部分产生反T3 rT3）；70%~90%血循环中的T3由周围组织T4转变而来，余10%~30%由甲状腺分泌；rT3仅2%~4%由甲状腺分泌，96%~98%由周围组织T4转变而来。\n调节：①下丘脑-垂体-甲状腺轴反馈调节——FT3、FT4升高经负反馈阻断TRH对垂体的作用减少TSH释放，FT3、FT4降低时TSH分泌增加；②甲状腺自主性调节（缓慢调节）——缺碘时甲状腺球蛋白碘化水平降低、MIT/DIT比值增高、T3产生增加（碘足量时T4增加T3减少），摄碘过多时碘的有机化过程自动减低（Wolff-Chaikoff效应，保护作用）；③其他内分泌激素——大剂量糖皮质激素抑制TSH分泌、外周T4转T3减少；性激素增强垂体对TRH敏感性并使TBG增多。' },
{ m: '31B', q: '甲状腺激素的生理作用？', a: '①氧化产热作用：刺激物质氧化、增加耗氧产热，使Na-K-ATP酶活性增高、ATP利用增多、线粒体氧化磷酸化加强。\n②对物质代谢：蛋白质——生理剂量使蛋白质和核酸合成增加、氮排泄减少；大剂量抑制蛋白质合成、肌肉蛋白分解加强（尿肌酸排出增加，肌酸转变为肌酐能力减低，尿肌酐排出减少）；甲减时尿肌酸排出少而肌酐排出多。糖代谢——促进小肠吸收葡萄糖和半乳糖，加强儿茶酚胺和胰岛素对糖代谢的作用（增强细胞儿茶酚胺受体对肾上腺素敏感性）；胰岛素存在时小剂量增加糖原合成、大剂量促进糖原分解。脂肪——增强脂肪组织对儿茶酚胺、胰高血糖素敏感性（经腺苷酸环化酶活化脂肪酶促使脂肪水解）；加速胆固醇氧化成胆汁酸。水盐——生理剂量利钠排水，甲减时细胞间液增多并聚积白蛋白与黏蛋白引起黏液性水肿；增加尿磷排出；甲减时促红细胞生成素分泌受抑、骨髓生成红细胞减少可产生贫血。\n③对生长与发育：对维持正常脑发育至关重要，胎儿及生后早期甲状腺激素不足可致不可逆脑发育障碍（克汀病）；对骨的正常生长和发育必需——促进骨吸收、使骨转换加快；过量甲状腺激素对破骨细胞作用超过成骨细胞，骨吸收超过骨形成，引起骨量丢失、骨小梁骨皮质变薄，最终可致骨质疏松和骨折。\n④神经系统：甲状腺激素过多可使大脑皮质兴奋性增高（甲亢患者易激动、过度兴奋甚至精神失常）。\n⑤心血管：维持正常心血管功能十分重要；心肌细胞膜上有甲状腺激素受体，结合后使心肌细胞内cAMP增多，增强β肾上腺素能受体对儿茶酚胺敏感性，使儿茶酚胺在心脏中分解降低、加强其对心脏作用。\n⑥消化系统：分泌增多时食欲亢进、肠蠕动增加、大便次数多；减少时常纳呆、便秘；过多对肝脏有直接毒性作用可致肝大、低蛋白血症、黄疸或转氨酶暂时升高（治疗后可恢复）。\n⑦维生素代谢：B1、B2、B6及C需要量增加；促进胡萝卜素转变成维生素A及维生素A生成视黄醛。\n⑧肌酸代谢：过多时肌肉神经应激性增高、震颤（ATP及磷酸肌酸形成减少、肌酸负平衡）——肌无力、肌萎缩；甲亢可伴发周期性瘫痪（与钾代谢紊乱有关，发作时血钾低，可能因细胞外液钾离子转移到细胞内）。' },
{ m: '31B', q: '先天性甲状腺功能减退（先天性甲减）的病因分类？', a: '定义：先天性或遗传因素引起甲状腺发育障碍、激素合成障碍、分泌减少或甲状腺激素受体缺陷，导致生长障碍、智能落后。见于非甲状腺肿流行地区，我国新生儿筛查发病率约1/2050~1/5000。按转归分持续性甲减（甲状腺激素持续缺乏，终身替代治疗）和暂时性甲减（出生时机体甲状腺激素暂时性缺乏，甲状腺功能可恢复正常）。\n按病变部位分原发性（病变在甲状腺，又称TSH依赖性）和继发性（病变在下丘脑和/或垂体）。\n病因（原发性占绝大多数）：\n1.甲状腺发育不全或发育异常（最常见，约占85%）——甲状腺缺如、发育不良、异位（胚胎期甲状腺停留在舌根部，或异位在喉头前、胸腔内或气管内，以舌根部异位即甲状舌管囊肿多见）；因发育不全患先天性甲减的新生儿中2%家族性、98%散发性；约1/3病例放射性核素扫描找不到甲状腺组织（甲状腺未发育），2/3为异位；已证实TSHR、NKX2.1、NKX2.5、TTF-1、TTF-2（Foxe1）、PAX8、DUOX2等基因变异可导致；母亲抗甲状腺抗体（阻断甲状腺生长和细胞毒性抗体）可能是机制之一（见于母体接受放射碘治疗后或母亲患自身免疫性甲状腺疾病）。\n2.甲状腺激素合成缺陷（约占10%，发生率1/30000~1/50000活产）——\n①摄取碘及碘转运缺陷：NIS基因突变（常隐），不同程度甲减伴或不伴甲状腺肿，碘摄取率低，更好诊断指标是唾液碘与血清碘的比值；\n②甲状腺过氧化物酶TPO缺陷致酪氨酸碘化缺陷（常见，常隐，有家族性，甲状腺可肿大，缺陷不完全性时甲减发病可延迟；TPO基因突变活性下降，无机碘不能有机化）；彭德莱Pendred综合征（基因缺陷位于7q31，TPO活性正常，主要表现为甲状腺肿和先天性神经性耳聋）；\n③甲状腺球蛋白TG合成缺陷：TG基因点突变，伴甲状腺肿性甲减，TSH增高、T4低、Tg水平低或测不出；\n3.促甲状腺素受体抑制抗体TRBAb（约占5%）——母体孕期患自身免疫性甲状腺疾病（桥本、Graves、替代治疗的甲减），TRBAb经胎盘抑制胎儿TSH与受体结合，发病率约1/50000~1/100000；孕期应测定母亲TRBAb水平；抗体半衰期21天，出生后3~6个月内不易发病；这种甲减常随母亲抗体清除在1~3个月后消退；同一母亲生产过1名以上新生儿筛查发现原发性甲减的婴儿应怀疑。注意母亲和婴儿血中TRSAb和TPO抗体均可阳性。\n4.对TSH无反应（TSH抵抗）——常染色体显性遗传，由甲状腺激素受体基因（Gsα）突变所致。\n5.母源性药物治疗——放射性碘、碘化物、丙硫氧嘧啶、甲巯咪唑等（抗甲状腺药包括放射性碘可自由通过胎盘）。\n继发性（中枢性）甲减：PIT-1基因突变（TSH、GH、PRL缺乏）、PROP1基因突变（TSH、GH、PRL、LH、FSH、ACTH缺乏）、TRH缺乏症（单纯性或多种下丘脑激素缺乏如颅咽管瘤）、TRH受体突变、TSHβ链突变（TSHB基因，不伴甲状腺肿性甲减，血T4、TSH均低）、对TSH无反应（Gsα基因突变）。下丘脑-垂体性甲减非常罕见（1/50000~1/150000活产）。' },
{ m: '31B', q: '甲状腺功能减退的临床表现（新生儿期、幼儿儿童期、特殊类型）？', a: '甲减三大特点：智力迟钝、生长发育迟缓、基础代谢率低下。甲状腺激素对生长和脑发育的作用比代谢效应更重要——与GH在促进生长发育方面协同；胎儿脑细胞DNA含量及细胞数在妊娠末3个月增长最快，出生后继续增长至5岁接近成人；甲减发病越早脑损害越重且常不可逆，发生较晚者智力缺损尚有可能改善。甲状腺激素过多使大脑皮质兴奋性增高。\n新生儿及婴儿期：母亲怀孕期胎动少、过期产；出生体重常大于第90百分位数，身长较正常矮小20%左右；胎便排出迟缓、嗜睡、吮奶差、生理性黄疸延长、哭声嘶哑低直、腹胀、脐疝、表情呆滞、体温不升、心率减慢、皮肤发凉呈花斑状、皮肤粗干、舌大宽厚（黏液性水肿致鼻塞及分泌物增多）、面容臃肿、鼻根低平、眼距宽、皮肤脂溢；母乳含甲状腺激素可掩盖某些症状使甲减表现出现晚。\n幼儿及儿童期：多数生后数月或1~2岁就诊，甲状腺激素缺乏严重、症状典型。特殊面容及体态——智力低下、表情呆滞、反应迟钝，面部及全身臃肿（多见面部、眼睑、锁骨上凹），眼距宽、鼻根低平、唇厚、舌大宽厚常伸在唇间，手足宽厚、指/趾短；安静少动、怕冷、心率慢、血压低；腹胀、脐疝、纳呆、便秘；四肢伸侧及躯干毛囊角化，前后发际低，毛发稀疏粗脆无光泽；生长发育迟缓（坐站走落后于同龄儿，上/下身比例落后，说话晚，前囟闭合及出牙晚）；胡萝卜素血症致皮肤与手掌足底发黄但巩膜不黄；可合并甲状腺肿，心脏可扩大、心包积液或憋气。\n特殊类型：Kocher-Debre-Semelaigne综合征——甲减患儿常伴腓肠肌及前臂肌肉假性肥大似大力士，原因不详，肌肉活检无特殊改变，甲状腺片治疗后好转；家族性甲状腺肿大型甲减——先天性甲状腺激素合成及功能障碍（常隐或常显），发病年龄较晚，常缺乏典型先甲减症状，仅记忆力减退、反应慢、面色蜡黄、面部稍臃肿、甲状腺轻度肿大；血清T3、T4降低、TSH增高（反馈性TSH增多代偿性甲状腺肿大）；高氯酸盐释放试验可诊断过氧化物酶缺陷（口服碘化钠24小时测吸碘率，再口服过氯酸钾10mg/kg，2小时后复查甲状腺摄碘浓度，下降>10%为阳性）。\n周围组织对甲状腺激素不起反应：细胞核受体异常，临床可有聋哑、甲状腺肿，T3、T4正常或稍高但TSH正常或稍高，rT3U正常。' },
{ m: '31B', q: '甲减的实验室检查、辅助诊断与鉴别诊断？', a: '实验室检查：\n1.血清T4——降低（常用范围4.6~11.2μg/dl即60~145nmol/L；出生后最初4周总T4正常范围7~16μg/dl即90~206nmol/L）；应除外TBG减少致血T4降低者。\n2.血清T3——轻者往往正常，严重甲减时减低；地方性甲减血T3可增高；某些慢性病、肝病时血T3减低但rT3增高（甲状腺功能正常），应配合T4、TSH共同判断。\n3.血清TSH——确诊本病的可靠指标（正常值<10mU/L）：新生儿足跟血TSH≥40mU/L，同时B超显示甲状腺缺如或发育不良，或伴有先天性甲减临床症状体征者，可不必等静脉血结果立即开始治疗；静脉TSH>20mU/L即使FT4正常也应启动治疗；TSH>10mU/L而FT4正常的高TSH血症，复查后TSH仍增高者应予治疗（L-T4起始剂量可酌情减量，4周后根据TSH调整）；TSH始终维持6~10mU/L的婴儿处理方案存在争议（出生后几个月内TSH可有生理性升高，需密切随访）。\n4.TSH、T4均低——为继发性（下丘脑、垂体）甲减，应做TRH兴奋试验鉴别：静注TRH 7μg/kg，注射前及后30、60、120分钟测TSH；正常30分钟后TSH增高5~40mIU/L；如不增高病变在垂体；如增高病变在下丘脑。\n5.新生儿甲减筛查——足跟血TSH（滤纸干血斑），切点值10~20mU/L，TSH>20mU/L者需再取静脉血测T4、T3、TSH以排除暂时性高TSH血症；最好于出生后48~72小时采血（避开生理性TSH上升期）；约5%先天性甲减无法通过筛查系统检出——筛查阴性但有可疑症状仍应采血复查；危重新生儿或接受过输血者可能假阴性；低/极低出生体重儿因下丘脑-垂体-甲状腺轴反馈建立延迟可TSH延迟升高，可生后2~4周或体重超过2500g时重新采血复查TSH和FT4。\n6.血清甲状腺球蛋白TG——T4低而TSH正常可能为先天性TBG缺乏症；TG阴性说明无甲状腺组织或TG合成异常；TG阳性而T4、T3下降、TSH上升说明有残余甲状腺组织。\n7.其他——血糖降低、血胆固醇及甘油三酯增高、血CPK、LDH增高、基础代谢率低。\n辅助诊断：X线骨龄落后（骨数目少且小、点状骨系钙化不全；新生儿小婴儿照膝关节X线观察股骨远端胫骨近端骨化中心，>1岁照腕部）；蝶鞍大且呈圆形、垂体可增大；心电图低电压、窦性心动过缓、P波与T波幅度降低、T波低平或倒置，偶P-R间期延长及QRS波时限增加；放射性核素检查（推荐锝Tc或123I评估发育不良、缺如或异位——99mTc半衰期仅6小时、123I半衰期13小时、99mTc身体放射性很低；131I仅用于已明确甲状腺癌者）；甲状腺超声评估甲状腺发育情况（不要因影像学检查推迟治疗）。\n鉴别诊断：先天性巨结肠（发病早、腹胀顽固便秘、营养不良、智力发育正常，肛查直肠空虚感，钡剂灌肠示痉挛肠管和扩张肠管，甲功正常）；唐氏综合征（21三体，外眼角上吊、眼内赘皮、舌尖外伸、通贯手，可合并甲减）；黏多糖贮积症Ⅰ型（尿黏多糖阳性，头大鼻梁低平、爪形手、肝脾大、肋骨飘带样椎体楔形）；软骨发育不良（体形不匀称、上部量大于下部量、四肢短，长骨骨干变短干端变宽，甲功正常）；家族性TBG缺乏（伴性连锁遗传，血T4降低、rT3U增高，TSH、FT4正常，甲功正常无需治疗；男纯合子女杂合子，男：女9:1，占新生儿甲减一定比例）；对不规则治疗、临床化验不典型病例可停药2~4周观察症状体征及化验指标变化以便确诊。' },
{ m: '31B', q: '甲减的治疗（L-T4剂量、随访）与预后？', a: '治疗原则：早期治疗、终身用药、小量开始逐渐加至足量、定期复查，维持甲状腺正常功能，使患儿正常生长发育尤其智能发育。\n药物：左甲状腺素钠L-T4为首选（较纯、肠道吸收完全）；左旋三碘甲腺酪氨酸钠L-T3作用快但国内难于获得；干甲状腺片很少使用。\nL-T4剂量：新生儿10~15μg/(kg·d)、婴儿5~10μg/(kg·d)，每日1次口服；新生儿较严重甲减（治疗前总T4<5μg/dl或FT4<0.4ng/dl）可从剂量范围较高值开始，尽快使甲功达正常避免脑发育受损；生后早期大脑发育最快，脑细胞内甲状腺素靠局部T4向T3转化（大脑皮质内80%的T3由局部T4转化而来），故替代治疗应采用T4不主张L-T3；新生儿合并严重疾病、TT4或FT4低者给最高初始剂量；潜在心功能不全风险者建议给目标剂量50%，2周后根据FT4增加剂量。治疗越早越好；儿童剂量4μg/(kg·d)，成人2μg/(kg·d)。注意甲状腺激素不要与含大豆蛋白或铁元素食物同服（可与T4结合影响吸收）；L-T4应于早餐前半小时空腹将1日剂量一次性送服；剂量根据T4、FT4和TSH水平调整；注意生后几周维生素D摄入。\n疗效与随访：一般治疗1~2周临床症状改善（食欲好转、心率改善有力、黏液水肿减轻或消失、腹胀好转、大便每日一次、智力进步）；临床应使T4在正常偏高值（参考值上限范围的50%以上），以备部分T4转变为T3；早产儿及低体重儿暂时性甲减也应治疗以免影响脑发育。初始治疗后两周第一次随访，而后每两周评估直到TSH维持正常范围；以后每1~3个月复查直到1周岁；1~3岁每2~4个月随访；3岁以上每3~6个月定期随访直到生长期结束。注意：依从性不好或检查结果异常应增加随访频率；L-T4剂量调整后4~6周再次评估；避免过度治疗；监测甲状腺激素水平使风险最小化。暂时性甲减——为防可能发生远期神经系统发育障碍应接受替代治疗，严密监测，确定甲功正常后可考虑暂时停药，定期随访。\n辅助治疗：长期补充多种维生素（易口角炎者供应核黄素）；钙片长期服用；贫血者加服铁剂。\n毒副作用：药物过量可致甲亢（腹泻、心悸、吐泻、多汗、烦躁不安、发热，长期过量可致消瘦）；个别过敏反应出现频繁期外收缩（宜分多次口服）；合并心包积液者如无心脏压塞症状可不必心包穿刺，甲状腺片治疗后心包积液可吸收消失。\n预后：新生儿筛查可早期发现早期治疗——胎儿后半期及出生后半年正值脑细胞发育阶段，生后2周内开始治疗90%智力可达正常，3岁以后发病者智力多正常；预后与病因有关：无甲状腺者41%智商IQ>85，激素合成障碍者44%IQ>85，异位甲状腺者78%IQ>85。' },
{ m: '31B', q: '地方性甲状腺肿性甲减（地方性克汀病）与获得性甲减的要点？', a: '地方性克汀病：严重地方性甲状腺肿流行地区甲减患病率1%~5%（严重地区5%~10%）；胚胎时期和出生后早期碘缺乏导致甲减，造成大脑与中枢神经系统发育分化障碍。病因是胚胎期碘缺乏——母体妊娠时患甲减是主要危险因素（缺碘使母体及胎儿甲状腺竞争性摄取有限碘化物，同时影响双方甲状腺激素合成）；以神经型为主者因胚胎早期严重宫内碘缺乏损害神经细胞生长发育；黏液水肿型在已存在神经系统缺陷基础上再加甲状腺激素合成能力降低（甲状腺本身正常发育依赖碘）；遗传、自身免疫等因素均未证实。病理无特异性：甲状腺呈代偿性肿大（扫描可小于同龄者、麻点状不均匀提示退化）；大脑发育不全、脑萎缩、中耳骨质增生，神经细胞多退行性变；骨骼发育改变和延迟较散发性克汀病轻微。\n临床表现三型（大多数为混合型）：①神经型——身高低于正常，甲状腺肿占15.3%（多轻度肿大），智力重度及中度减退共占80.6%，表情淡漠、聋哑、不同程度精神缺陷、痉挛性瘫痪，眼多斜视，膝关节屈曲，膝反射亢进，病理反射（巴宾斯基征、戈登征）阳性；无明显甲减表现；②黏液性水肿型——严重甲减表现，典型克汀病面容，便秘及黏液性水肿突出，智力减低略轻，生长迟缓，伴甲状腺肿大（占28%），性发育显著阻滞，腱反射减弱，某些呈家族性发病；③混合型——两型表现兼有。\n诊断标准：①出生居住在低碘地域的地方性甲状腺肿流行区，有精神发育不全及不同程度智力障碍，有不同程度神经系统症状（听力障碍、语言障碍、运动神经障碍）；②甲减症状——克汀病面容及不同程度生长发育障碍；③黏液性水肿型脐血T4降低、TSH增高、T3也可增高；④X线——股骨远端骨胚胎38周左右应出现（克汀病及早产儿可不出现），骨盆股骨头化骨骺呈点彩及畸形（生后半年内出现），骨龄落后，颅骨脑回压迹增多，颅底短小，蝶鞍偶增大；⑤脑电图频率偏低、节奏不整，大多有阵发性双侧同步慢波，可无α波。\n鉴别：聋哑（无智力障碍，尿碘不减少，吸碘率不高，无缺碘或碘饥饿表现）；耳聋甲状腺肿综合征（Pendred综合征，常隐，先天性碘有机化缺陷，生后耳聋多伴哑，甲功基本正常或低下，过氯酸盐排泄试验常阳性超30%，血碘酪氨酸增多，MIT/DIT及碘酪氨酸/碘原氨酸比值增高，尿碘不减少）。\n预防治疗：预防为主——推行碘化食盐消灭地方性甲状腺肿，地方性克汀病随之明显减少甚至消灭；有甲减症状者自生后3个月内开始补充甲状腺激素，原则同先天性甲减；聋哑者应受专门训练。\n获得性甲减：学龄儿童发病率约0.08%（1/1250）；最常见于慢性淋巴性甲状腺炎（约1.3%儿童有自身免疫性甲状腺疾病，女孩:男孩2:1）。病因：①自身免疫——桥本甲状腺炎、多腺体自身免疫综合征Ⅰ、Ⅱ型（Down、Turner、Klinefelter综合征及乳糜泻或糖尿病患儿患自身免疫甲状腺疾病风险更高，可生后1岁发病）；②医源性——丙硫氧嘧啶、甲硫咪唑、碘化物、碳酸锂、α干扰素、沙利度胺、胺鲁米特（胺碘酮含37%碘，应用者约20%发生甲减——过高碘直接抑制5′-脱碘酶活性影响T4向T3转化，用药期间密切检测）；③照射——放射碘、甲状腺切除术后、头颈部位放疗（放疗后1年左右约1/3患儿继发TSH升高，放疗后5~7年约15%~20%患者出现甲减，放疗期间应监测TSH，有专家主张凡放疗者均采用甲状腺激素治疗控制增高的TSH）；④系统性疾病——胱氨酸病、朗格汉斯细胞组织增生症、肝脏血管瘤。\n临床表现：与发病早晚有关，越晚生长发育受影响越轻；3岁以后发病智力可正常，但记忆力与理解力下降；面容不如先甲减典型但可见臃肿状、眼距稍宽、表情呆滞、反应慢、嗜睡、疲乏无力、行动迟缓、皮肤干粗、毛发稀少、食欲差、便秘、腹胀、脉缓；严重黏液性水肿可合并心脏病、心包积液、血压偏低。骨龄往往显著落后（甲减持续时间的指标）；青少年通常青春期延迟，但年龄小儿童可能出现溢乳或性早熟（催乳素分泌增加受TSH刺激所致）；长期甲减常出现垂体增大伴向上扩展，可被误认为垂体瘤；所有改变在适当补充T4后恢复正常，但长期甲减儿童常不能完全追赶生长。\n诊断治疗：临床基础代谢率低表现+血TSH增高+血T4降低；如TSH、T4均减少为继发性甲减，做TRH兴奋试验区别下丘脑或垂体疾病；桥本甲状腺炎血中可测得抗TGAb及TPOAb。治疗同先天性甲减；治疗第1年学习成绩下降、睡眠习惯不好、坐立不安、注意力不集中和行为问题会发生，但都是暂时的，可提醒家长加强管理。' },
{ m: '31B', q: '甲状腺功能亢进的病因分类与Graves病的发病机制？', a: '甲亢：特指内源性甲状腺激素合成和分泌过多导致的高代谢综合征。儿童多种病因中Graves病最常见，占90%左右；儿童Graves病年发病率1/10万~8/10万，患病率约0.02%（1/5000），主要见于11~15岁年龄组，青春期前诊断约占35%，女孩:男孩约5:1；小儿甲亢约占甲亢总病例5%。\n病因分类：\n1.弥漫性甲状腺肿性甲亢Graves病——自身免疫性疾病，遗传因素和环境因素共同作用；相关基因多态性：HLA-D3、HLA-DQ2、HLA-DQA1、CTLA-4（细胞毒性T淋巴细胞相关抗原4）、PTPN22等；环境因素：应激性神经精神压力增加、突然增加碘摄入等，触发TRAb合成。细胞免疫：抑制性T细胞克隆异常、功能下降引起免疫调节障碍，解除对辅助性T细胞、致敏效应细胞的抑制，辅助性T细胞协助B细胞转化为浆细胞产生大量甲状腺刺激性抗体；TRAb主要合成部位为甲状腺、骨髓和淋巴结；TRAb是一组多克隆抗体，分兴奋型TRSAb和阻断型TRBAb两种，Graves病以兴奋型抗体占优势；TRAb刺激甲状腺生长和甲状腺激素合成释放引起弥漫性肿大；Graves眼病可能由眶后结缔组织中的TSH受体样蛋白抗体所致（眼部并发症是自身免疫过程的一部分）。\n2.桥本甲状腺毒症——甲状腺自身免疫性疾病，甲状腺组织受损、滤泡破裂释放甲状腺激素出现甲亢症状（假性甲亢），但甲状腺病理有弥漫性淋巴细胞浸润、上皮细胞萎缩及纤维增生。\n3.毒性腺瘤和毒性多结节性甲状腺肿——源自甲状腺滤泡细胞局灶性和/或弥漫性增生，功能不受TSH调节；两种病变均发现TSH受体体细胞基因激活突变，毒性腺瘤中还发现G蛋白α亚基（Gs-α）激活突变。\n4.亚急性甲状腺炎引致甲亢——甲状腺组织被炎症破坏，储存的甲状腺激素释放至血，暂时性甲亢。\n5.医源性甲亢——甲状腺激素治疗剂量过大。\n6.碘甲亢——投入过多碘剂所致，一般发生在普遍增加碘摄入量或服用含碘药物治疗之后，摄碘后6个月发生；术后甲亢复发率在富碘区比缺碘区高5倍；临床表现与Graves病相似但很少有突眼、血清无甲状腺自身抗体、吸碘率低；停用碘制剂后病情渐好转，重者短期用小剂量抗甲状腺药。\n7.新生儿甲亢——非常罕见（发生率2%左右），临床症状严重，病死率可达12%~20%（心脏衰竭是常见致死原因）；病因主要为甲亢孕妇血中可通过胎盘传给胎儿的促甲状腺受体刺激抗体TRSAb（母体高水平TRSAb预示新生儿甲亢；若新生儿从母体已获得抗甲状腺药物其发病可延迟3~4天，如TRBAb也存在甲亢症状可延迟几周出现；TSH受体突变引起者罕见）；一般为暂时性，2~12周自发缓解（少数迁延数年），主要取决于TRSAb水平；轻者无症状不必治疗，重者极度烦躁不安、易激惹、易饥饿、消瘦、多汗、皮肤潮红、呼吸及心率加快、突眼和甲状腺肿大，可有黄疸和肝大，需治疗。\n8.hCG性甲亢——部分生殖细胞肿瘤患者因hCG亚型浓度高且促甲状腺活性增强，TSH受体直接受刺激发生甲亢；针对肿瘤治疗，硫脲类可作辅助（患者激素在甲状腺内合成）。\n9.TSH甲亢（TSH毒症）——血T3、T4及TSH均增高：①下丘脑及垂体肿瘤分泌TSH增多，或异位肿瘤（肺癌、葡萄胎）分泌TSH样物质；②甲状腺激素不敏感综合征——垂体甲状腺激素受体β基因突变致垂体对甲状腺激素无反应（常显），T3升高、T4亦高但垂体不出现负反馈、TSH仍增高，而α受体为主的部分外周组织对T3、T4仍有反应引致甲亢。\n10.甲亢合并其他疾病——自身免疫性多内分泌腺综合征（可合并特发性艾迪生病、甲旁低、糖尿病、恶性贫血、重症肌无力、SLE、类风湿关节炎等）；还可见于Down综合征及McCune-Albright综合征（MAS）。MAS由体细胞G蛋白α亚基激活突变引起，可见典型三联症（皮肤咖啡牛奶斑、骨纤维异常增殖症、外周性性早熟），甲状腺功能主要表现为T3或FT3升高，合并甲亢可药物治疗但疗程长，需考虑手术切除或放射碘等更持久的方法。' },
{ m: '31B', q: 'Graves病的临床表现、实验室检查、诊断与鉴别？', a: '病理：Graves病甲状腺弥漫性肿大，腺滤泡细胞增多（立方形变为柱状）、血管明显增多、淋巴组织增多；胸腺、淋巴结、脾脏、垂体及心脏常增大；肝脏脂肪变性；骨骼肌脂肪浸润、横纹消失及肌纤维退化；伴突眼者球后组织水肿及脂肪增加、淋巴细胞浸润、退行性变及纤维组织增生；结节性毒性甲状腺肿者甲状腺内有结节（周围组织常萎缩）。\n临床表现：学龄儿童及青少年多见；发病隐匿，诊断前数月已有变化，从发病到确诊平均3~6个月。主要表现甲状腺肿大及全身高代谢综合征，Graves病者还可见突眼。交感神经兴奋性和基础代谢率增加——注意力不集中、学习成绩下降、烦躁易怒、心悸、乏力、怕热、多汗、消瘦、食欲亢进、易饥饿、大便次数多或腹泻；儿童生长加速、骨龄超前；部分儿童伴发低钾性周期性瘫痪和近端肌肉无力、萎缩（甲亢性肌病）；Graves病约1%合并重症肌无力（儿童以眼肌型为主）；青春期女性月经紊乱、闭经及月经过少；腔前黏液性水肿儿童罕见。甲状腺对称性肿大、质地中等、无压痛，上下极可闻血管杂音；结节性甲状腺肿者可扪及大小不一、质硬、单个或多个结节。心血管体征——心率增快、脉压增大、血压增高、心尖部收缩期杂音，可有高血压、心脏扩大及心律失常（心力衰竭或心房颤动小儿少见）。眼部——双眼球突出、瞬目减少、双目炯炯发亮、上睑挛缩、眼裂增宽、眼球辐辏不良；手及舌细微快速震颤。\n实验室检查：\n①血清甲状腺激素——典型TT4、TT3、FT4、FT3均升高；TT3、FT3升高而TT4、FT4正常时对甲亢早期诊断更有意义（提示T3型甲亢可能）；\n②TSH——原发性甲亢时TSH降低，TSH性甲亢时TSH升高或不适当正常；\n③甲状腺抗体——TRAb、抗TGAb、抗TPOAb；TRAb检测无法区别兴奋性和抑制性；鉴别要点——Graves病TRAb明显升高、TGAb及TPOAb轻度升高；桥本甲状腺炎相反（TGAb或TPOAb明显升高）；Graves病测TRAb可观察治疗效果及有无复发可能；\n④BMR正常值±15%（5岁以上测定较有意义，多做几次——由负值低限升至正值高限亦有诊断价值）：BMR（%）=脉搏/分+脉压-111（Gale氏法）；\n⑤甲状腺摄131I功能试验——儿童不常规做，可鉴别Graves病和桥本甲状腺炎引起的一过性甲状腺毒症（Graves病摄碘率增高、摄取高峰前移；破坏性甲状腺毒症如桥本、亚急性甲状腺炎摄碘率降低）；\n⑥甲状腺B超——了解大小、形态、血流、结节性质以除外肿瘤囊肿。\n诊断：①临床甲亢——高代谢症状体征+甲状腺肿大或结节+血清T4、T3、FT3、FT4明显升高伴TSH降低；②Graves病诊断标准——临床甲亢症状体征+甲状腺弥漫性肿大+血清TSH减低伴甲状腺激素水平明显升高+眼球突出和其他浸润性眼征+TRAb明显升高。\n鉴别诊断：①桥本甲状腺毒症——通常引起甲减，但5%~10%儿童疾病初期呈甲亢状态，病程短（≤8周）且不伴Graves眼病，TGAb和TPOAb明显升高、TRAb阴性或轻度升高；②亚急性甲状腺炎（儿童罕见，甲状腺疼痛性肿胀，常由病毒感染引起）；③急性化脓性甲状腺炎（急性细菌感染，甲功多正常，伴滤泡破坏时一过性甲亢；局部红、肿、热、痛，可伴颈部淋巴结肿大疼痛）；④孤立性甲状腺结节（儿童甲亢罕见原因，许多由TSH受体激活突变引起；甲状腺腺瘤通常产生T3——血清T3升高、TSH受抑制、FT4正常或升高，抗体阴性）；⑤MAS（G蛋白α亚基激活突变，三联症，T3或FT3升高）；⑥碘甲亢（儿童罕见，碘暴露前甲功正常，含碘造影剂或胺碘酮诱发）；⑦甲状腺激素不敏感——甲状腺激素β受体基因突变，儿童通常表现甲状腺肿和血清FT4升高、其次T3升高而TSH正常或轻度升高；全身性抵抗者甲功通常正常，以垂体抵抗为主者可能表现甲亢；⑧单纯性甲状腺肿。' },
{ m: '31C', q: '调节钙磷代谢的三种激素（PTH、骨化三醇、降钙素）要点？', a: '甲状旁腺激素PTH：甲状旁腺主细胞合成的84个氨基酸残基单链多肽（唯一或罕有的不含糖多肽激素，分子量9425）；基因位于11p15.3；前甲状旁腺素原115个氨基酸（信号肽31个残基）→甲状旁腺素原90个→完整PTH84个；合成分泌最重要调节是血钙离子浓度——血钙高PTH分泌减少、血钙低分泌增加（低血钙可使PTH分泌增为正常5倍，持续性低血钙可增50倍），还受细胞外磷、骨化三醇及FGF23调节。外周代谢：完整PTH约40%~75%在肝清除、20%~30%在肾清除。生理作用（靶器官骨、肾、肠）：①对骨——PTH受体表达于成骨细胞而非破骨细胞，作用于成骨细胞增强骨重塑；②对肾——减少磷在近端肾小管重吸收、增加远端肾小管钙重吸收、刺激25-羟维生素D在近端肾小管转变为骨化三醇；③通过1,25-(OH)₂D生成增加间接提高小肠钙吸收。\n骨化三醇：维生素D由日光照射皮下脂肪中胆固醇生成或食物吸收；肝经25-羟化酶生成25-(OH)-D₃，肾经1α-羟化酶生成1,25-(OH)₂D₃即骨化三醇（活性激素）；肾还有24-羟化酶可生成24,25-(OH)₂D₃。通过刺激肠钙吸收、动员骨钙、促进肾钙重吸收，与PTH及降钙素组成钙的激素调节系统。\n降钙素CT：甲状腺滤泡旁C细胞分泌的32个氨基酸多肽（分子量3419）；编码基因11p15.2~15.1，与降钙素相关肽、钙抑肽共用（第1~3外显子共用，第4外显子为降钙素专有）；直接抑制破骨细胞活性、减少骨吸收、降低血钙；分泌主要受血钙浓度调节——血钙升高时降钙素升高。' },
{ m: '31C', q: '甲状旁腺功能减退症（甲旁减）的病因分类与临床表现？', a: '甲旁减：PTH缺少引起钙磷代谢紊乱，以低血钙、高血磷、尿钙尿磷低及低钙血症神经肌肉兴奋性增高为特征。\n病因：\n1.先天性和遗传性——①甲状旁腺发育不成熟（母亲高血钙抑制胎儿甲状旁腺发育，早产或低出生体重儿发育未成熟）；②甲状旁腺不发育（母系隐性遗传，X染色体26~27区基因缺陷，男性幼儿到成年均可发病）；③单一甲旁减（11p15基因异常，不伴其他内分泌腺体缺陷，家族性或散发，2岁到成人均可发病，女多于男）；④伴其他发育缺陷——DiGeorge综合征（22q缺失，甲状旁腺和胸腺不发育+心血管异常+圆脸突眼短颈等头面部畸形+细胞免疫功能异常）；HDR综合征（10p13~14区GATA3突变，常显：甲旁减、神经性耳聋、肾发育缺陷）；Kenny-Caffey综合征（1q42~43：甲旁减、矮身材、眼病变、骨硬化、基底节钙化）；Sanjad-Sakate综合征（常隐：先天甲旁减伴智能落后、生长障碍及多发畸形）；CATCH22综合征（22q11基因突变：心血管发育异常、面容不正常、胸腺不发育、腭裂、甲旁减）；甲旁减伴线粒体病（MELAS等）；⑤PTH合成或分泌缺陷（prePTH基因异常或钙敏感受体CaSR基因突变）。\n2.获得性——①甲状旁腺被破坏：颈前部手术、¹³¹I治疗甲亢、代谢性疾病（肝豆状核变性、含铁血黄素沉着症）浸润破坏、药物（天冬酰胺酶使甲状旁腺细胞坏死），甲状旁腺被破坏50%以上时出现临床症状；②自身免疫性甲旁减（血中存在PTH抗体；APS1：常隐，AIRE外显子8基因突变，典型三联症——甲旁减、肾上腺皮质功能减退、皮肤黏膜念珠菌病，还可有外胚层发育不良、斑秃、恶性贫血、慢性肝炎）；③特发性甲旁减。\n临床表现：神经肌肉兴奋性增高——肢端麻木、皮肤蚁行感或不定位肌肉疼痛，膝腱反射亢进，口角抽动或腓肠肌痉挛；手足搐搦发作典型表现为手足肌肉强直性收缩，拇指内收、其他手指并紧、指间关节伸直、掌指关节屈曲（助产士手）。两种试验：①Chvostek征——叩击耳垂前方2cm面神经干分支处引发同侧口轮匝肌、鼻翼肌、眼轮匝肌抽动；②Trousseau征——血压带束臂加压至收缩压和舒张压之间保持3分钟，诱发该侧手足搐搦。低钙严重可惊厥及意识丧失（小婴儿易误诊癫痫）；自主神经兴奋平滑肌痉挛致喉痉挛、支气管痉挛（呼吸困难）、肠痉挛（腹痛腹泻）；牙齿萌出延迟、牙釉质形成不良；皮肤干燥有鳞屑、手足指甲横线、低钙性白内障；心悸、心肌收缩无力、Q-T间期延长。\n实验室：血清总钙<2mmol/L、游离钙<1mmol/L；血磷高、尿钙磷低；PTH低或在正常范围——注意低钙血症对甲状旁腺是强烈刺激（血清总钙≤1.88mmol/L时血PTH应有5~10倍增加），低钙时PTH在正常范围仍属甲旁减，测PTH应同时测血钙综合分析；头颅CT可见基底节钙化；低血钙惊厥时脑电图可异常。' },
{ m: '31C', q: '假性甲状旁腺功能减退症（PHPⅠa/Ⅰb/Ⅱ型、PPHP）的鉴别要点？', a: '假性甲旁减PHP：外周靶细胞对PTH抵抗导致的一组遗传性疾病（PTH不敏感综合征）。\nPHPⅠa型：编码G蛋白α亚基（Gsα）的GNAS1基因（20q13.32，13个外显子）失活性突变——靶细胞膜受体不能与PTH结合、不能激活腺苷酸环化酶系统、不能生成cAMP发挥PTH效应。显著特点：肾脏对PTH存在抵抗。临床表现：手足搐搦、惊厥、白内障、牙齿异常、基底节钙化；特殊体征——圆脸、矮身材、肥胖、掌指/趾骨短粗（短指/趾是特征性体征）、牙发育不良、精神发育迟滞。诊断：特殊体型+低钙血症、高磷血症、碱性磷酸酶正常+注射外源性PTH后肾源性cAMP不增多、尿排磷不增加；X线见第4与第5掌指/趾骨短。PHPⅠb型：GNAS基因上游基因簇甲基化印记缺陷引起Gsα转录减少；缺乏PHPIa典型特殊体征，部分患者可有短指/趾。\nPHPⅡ型：低钙血症、高磷血症、正常碱性磷酸酶、正常或升高的PTH，血cAMP水平正常；注射外源性PTH后尿cAMP增加但尿磷增加低于正常；诊断较复杂。\n假假性甲旁减PPHP：存在PHP的特殊体征（身材矮胖、圆脸、短指/趾、皮下钙化）但缺乏相应生化与代谢异常，无慢性低血钙或手足搐搦；血钙、血磷、碱性磷酸酶、PTH均正常，对外源性PTH反应正常；与PHP有相同发病机制（同一家族可同时有PHP和PPHP）；无需特殊治疗，随访监测血钙即可，无需补钙及维生素D。\n治疗：PHP治疗类似甲旁减，但维生素D和钙剂量通常比特发性甲旁减需要的量少。' },
{ m: '31C', q: '甲状旁腺功能亢进症（甲旁亢）的分类、病因、临床表现与治疗？', a: '分类：原发性、继发性、三发性和假性。原发性PHPT：甲状旁腺组织本身不适当分泌致PTH增高，肾脏过量重吸收钙、尿磷排泄及1,25-(OH)₂D合成增加、骨吸收增加；病理有腺瘤、增生、腺癌三种，以腺瘤最常见。继发性：低钙血症刺激甲状旁腺分泌过多PTH（肾功能不全、骨软化症等）。三发性：继发性基础上腺体受持久强烈刺激，部分增生组织功能自主分泌过多PTH产生高钙血症。假性：某些器官恶性肿瘤分泌类似PTH的多肽类物质致血钙增高。\n原发性病因：①家族性低尿钙性高钙血症FHH（CASR基因失活突变，常显；无症状高钙血症、高镁血症、低磷血症和低尿钙；高钙血症近100%外显率）；②新生儿严重原发性甲旁亢NSPHT（CASR纯合突变：肋骨骨折、钟形胸廓、低肌张力、呼吸窘迫、极严重高钙血症常>4mmol/L、很高PTH，通常致死，除非第1个月行甲状旁腺全切术）；③MEN-1中的甲旁亢（外显率最高，发病早于散发PHPT但晚于FHH）；④MEN-2A中的甲旁亢（外显率低于甲状腺髓样癌及嗜铬细胞瘤，随年龄增长，症状轻）；⑤CDKN1B等CDKI基因突变（散发性腺瘤中较低频率）；⑥CDC73/HRPT2基因（甲旁亢-颌骨肿瘤HPT-JT综合征，与甲旁腺癌风险增加相关）；⑦维生素D受体VDR基因（候选基因）；⑧异位PTH基因表达（非甲状旁腺恶性肿瘤异位生成PTH，十分罕见）。\n病理生理与临床表现：PTH过多→骨钙溶解入血、肾小管重吸收钙增强、1,25-(OH)₂D合成增加促进肠钙吸收→血钙升高；滤过钙增多尿钙增加；PTH强烈抑制磷在近端和远端肾小管重吸收→尿磷增多血磷下降；加速骨吸收长期可致纤维囊性骨炎。表现：①高血钙症状——神经肌肉系统淡漠、嗜睡、性格改变、智力迟钝、记忆力减退、肌张力降低、易疲劳肌无力；消化系统胃肠蠕动减慢（食欲缺乏、恶心呕吐、腹胀腹痛、便秘），高血钙刺激胃泌素致消化性溃疡、激活胰蛋白酶致胰腺炎；②骨骼病变——广泛骨关节疼痛、骨密度减低、严重者骨畸形（肩关节下垂、驼背、肋骨骨盆塌陷）；③泌尿系统——渗透性利尿、多饮、反复泌尿系结石（肾绞痛、血尿）；甲旁腺危象：进行性少尿、氮质血症、意识不清及昏迷；婴儿可肢体发育和智能障碍、惊厥和失明。\n实验室：血清总钙正常2.2~2.7mmol/L，甲旁亢时持续或波动性增高（游离钙测定更敏感准确）；血磷减低；碱性磷酸酶增高（反映骨骼病变，病变越重越高）；1,25-(OH)₂D可位于正常上限或升高。辅助检查：X线普遍性骨质脱钙、骨质疏松（胸腰椎、扁骨、掌骨、肋骨最常见），特征性骨膜下吸收以指骨侧最常见，骨囊性变多发，病理性骨折。\n鉴别诊断：与其他原因高血钙鉴别（维生素D中毒、肿瘤高钙血症、甲亢亦可高血钙）；低血磷与家族性低磷血症鉴别。\n治疗：手术切除腺瘤（4个甲状旁腺均应检查）；新生儿甲状旁腺增生有严重高钙血症时应完全切除腺体；90%患者手术切除病变甲状旁腺后有效缓解，术后可低钙血症应补钙数日；高血钙危象时输入足够生理盐水同时用呋塞米每次1~2mg/kg促进尿钙排出（利尿同时维持电解质平衡，适当补充镁和磷）。药物（双膦酸盐类、雌激素-孕激素、拟钙剂、维生素D类似物）用于不符合手术标准、无法手术或倾向避免手术者。' },
{ m: '31D', q: '肾上腺的胚胎发育、皮质激素生物合成途径与分泌调节？', a: '解剖与胚胎：肾上腺位于腹膜后脊柱两旁双肾上端（第一腰椎水平）；右侧锥形/三角形内侧靠下腔静脉，左侧椭圆形/半月形内侧靠腹主动脉。来源于体腔内层邻近泌尿生殖间充质细胞，胚胎3~4周可识别，6~8周迅速增大——内胚层细胞分化成胎儿带，被膜下分化为成熟带，交感神经成分进入分化为嗜铬细胞形成髓质；9~12周胎儿带能合成类固醇激素；出生后胎儿带逐渐退化，成熟带分化为束状带和球状增殖带；3岁左右束状带和球状带分化完成，网状带到青春期才分化完成。胎儿早期肾上腺发育不依赖ACTH，胚胎中期到分娩ACTH对正常发育起重要作用。两个重要转录因子：SF-1（9q33，缺陷致肾上腺和性腺发育不全）、DAX-1（Xp21，突变致先天性肾上腺发育不全AHC和低促性腺激素性功能减低症）。母体游离皮质醇可穿过胎盘，新生儿CBG含量低故血浆皮质醇多为游离型，皮质醇半衰期较长，生后1个月左右血浆皮质醇降至低水平。\n皮质激素分类（由外向内）：球状带—盐皮质激素（醛固酮）；束状带—糖皮质激素（皮质醇）；网状带—性类固醇激素。\n生物合成：胆固醇为原料；线粒体中胆固醇向孕烯醇酮转化（P450scc/CYP11A1催化20,22碳链裂解）是类固醇生成第一个限速步骤。球状带：孕烯醇酮→（3β-HSD）孕酮→（21-羟化酶）11-脱氧皮质酮→（醛固酮合成酶P450aldo/CYP11B2）醛固酮。束状带：孕烯醇酮和孕酮经17α-羟化酶（CYP17）、21-羟化酶（CYP21）依次合成17-羟孕酮、11-脱氧皮质醇，最后经11β-羟化酶（CYP11B1）合成皮质醇。网状带：17-羟孕烯醇酮经17-羟化酶合成DHEA，再经3β-HSD合成雄烯二酮，进一步合成睾酮和雌激素。\n分泌调节：①皮质醇——下丘脑CRH和垂体ACTH主要调节；肾上腺皮质对ACTH极敏感，血中皮质醇浓度依赖垂体不断分泌ACTH；游离皮质醇对CRH和ACTH有负反馈；应激状态使轴功能活跃；ACTH半衰期5~10分钟（经细胞膜受体激活cAMP系统），皮质醇半衰期60~90分钟（与α-球蛋白和白蛋白结合，仅小部分游离有生理作用）；皮质醇分泌昼夜节律——清晨6~8时最高、午夜最低（由ACTH昼夜节律引起）。②醛固酮——受钠钾代谢和体液容量调节：RAAS系统（肾素使血管紧张素原→血管紧张素Ⅰ→转化酶（肺）→血管紧张素Ⅱ，收缩血管+促醛固酮分泌）、血钾浓度（摄钾多刺激分泌，缺钾抑制）、ACTH（生理条件下兴奋作用不明显，应激时短暂作用）；有昼夜规律上午高晚上低，与体位有关（立位肾血流量减少→肾素增多→醛固酮增多）。③雄激素——ACTH能促进合成；3β-HSD表达相对减少和17,20-裂解酶活性增加促进肾上腺雄激素合成。皮质激素降解：肝脏降解酶系降解后生成四氢代谢产物，与葡糖醛酸或硫酸结合由尿排出。' },
{ m: '31D', q: '先天性肾上腺皮质增生症（CAH）各酶缺陷型的病因与特点？', a: 'CAH：常染色体隐性遗传病，由皮质醇合成过程所需酶先天缺陷所致；皮质醇合成不足→负反馈使ACTH增多→肾上腺皮质增生并分泌过多皮质醇前身物质（11-去氧皮质醇、肾上腺雄酮等）。最常见酶缺陷是21-羟化酶缺乏（约占95%），其次为StAR缺陷、17α-羟化酶/17,20碳链裂解酶缺乏、11β-羟化酶缺乏、3β-HSD缺乏、P450氧化还原酶缺乏等。临床表现严重程度取决于酶活性降低程度。\n1.21-羟化酶缺乏（21-OHD）：CYP21A2基因编码（6p21.3，10个外显子，位于HLA-B与HLA-DR位点之间）；人类存在两个基因位点——功能性CYP21A2和非功能性假基因CYP21A1，活性与无活性基因间可发生重组；可由缺失、基因转换、点突变导致，已报道300多种突变。酶缺陷使皮质醇和盐皮质激素产生不足、17-羟孕酮（17-OHP）堆积，伴肾上腺来源雄激素过多（经典途径的睾酮、雄烯二酮、DHEA、DHEAS；雄激素后门合成途径可能在宫内高雄激素血症中起更关键作用）。\n2.11β-羟化酶缺乏（11β-OHD）：CYP11B1缺乏，CAH高血压类型，约占5%（发病率1/100000~1/200000活产儿）；CYP11B1与CYP11B2（8q21~q23）93%氨基酸序列相同；11-脱氧皮质醇增多、DOC和DHEA、雄烯二酮分泌增多→女性男性化和男性假性性早熟；DOC是盐皮质激素，合成增多潴钠排钾→高血压、低钾低肾素低醛固酮。\n3.17α-羟化酶缺乏（17α-OHD）：CYP17具有17α-羟化酶/17,20裂解酶双重作用（CYP17A1基因，10号染色体）；缺陷使肾上腺、睾丸、卵巢性激素合成完全阻断——男婴女性外生殖器形态，两性青春期无第二性征、女性原发闭经；皮质醇合成受阻、ACTH升高致肾上腺皮质增生；盐皮质激素途径畅通→11-脱氧皮质酮、皮质酮增多→水钠潴留、明显高血压、低血钾、碱中毒；中国人和巴西人相对常见。\n4.3β-羟类固醇脱氢酶缺乏（3β-HSD）：HSD3B2基因突变（1p13.1）致Ⅱ型同工酶缺陷，Δ5类固醇向Δ4类固醇转变受阻、Δ5/Δ4比例增高；醛固酮、皮质醇及性激素合成均受阻、DHEA增加，患儿出生后即严重失盐、脱水、休克；雄激素产生减少只能合成DHEA（雄激素作用弱），但因3β-HSD部分不足可合成部分Δ4（雄烯二酮）→男性外生殖器两性畸形，女性外生殖器正常或轻度男性化；如不及早诊治可死亡。\n5.先天性类脂质性肾上腺增生症（LCAH）：罕见和最严重类型，韩国日本人相对常见；StAR缺陷（8p11.23，7个外显子）或CYP11A1突变→胆固醇不能转变为孕烯醇酮，所有肾上腺及性腺类固醇生物合成均受阻→肾上腺皮质功能减退及性激素合成障碍。类固醇合成两个重要限速步骤：胆固醇经StAR传递至线粒体内膜；P450scc将胆固醇转化为孕烯醇酮。\n各型鉴别要点（表31-3）：失盐——21-OHD经典型有、3β-HSD有、LCAH经典型有、CYP11A1缺乏经典型有，其余无；高血压——11β-OHD有、17α-OHD有、POR缺乏有；外生殖器模糊——21-OHD经典型有、11β-OHD经典型有、3β-HSD经典型46,XX有；激素检测——21-OHD者17-OHP、雄烯二酮、睾酮、DHEA均升高，11β-OHD者DOC、11-脱氧皮质醇、皮质酮升高，17α-OHD者DOC、皮质酮、孕烯醇酮、17-羟孕烯醇酮升高，LCAH及CYP11A1缺乏所有肾上腺类固醇激素均降低。' },
{ m: '31D', q: '21-羟化酶缺乏症（21-OHD）的三种临床类型表现？', a: '依据21-羟化酶残留活性不同分经典型（失盐型、单纯男性化型）及非经典型。\n1.经典失盐型——最严重表型，无残留酶活性；醛固酮、皮质醇完全缺乏，肾上腺来源雄激素生成增多。女性外阴可不同程度两性畸形甚至完全男性化（阴唇融合类似阴囊、阴蒂肥大似阴茎，内生殖器子宫卵巢不受影响）；男孩出生时外生殖器可无明显异常（阴囊色素沉着明显）易误诊。约3/4经典型患儿有失盐表现——皮质醇不足、醛固酮减低、血浆肾素活性增高，肾远曲小管和集合管对水钠重吸收障碍及排钾障碍→低钠血症和高钾血症；临床呕吐、腹泻、喂养困难、体重不增、脱水、酸中毒及难以纠正的低血钠高血钾，多在生后1~2周发病，出生即可肾上腺危象（血容量降低、血压下降、休克）。皮质醇减少使下丘脑-垂体-肾上腺轴负反馈减弱，ACTH分泌增多伴随促黑素分泌增多→全身皮肤黏膜色素沉着（皱褶处、乳晕和外生殖器最明显）。\n2.经典单纯男性化型——残留酶活性约1%~2%，临床无失盐表现；高雄激素血症→女性患儿外生殖器男性化（从单纯阴蒂增大到完全性阴囊性尿道下裂伴隐睾的男性，可被误认为男性化不全的男性）；若不及时治疗阴蒂继续增大、体毛增多、痤疮、女性第二性征发育不良甚至无乳房发育和原发闭经；男性患儿出生时外生殖器可无明显异常易误诊，婴幼儿期阴茎进一步增大而睾丸不大，伴或不伴阴毛早现的外周性性早熟；性激素过早长期作用→儿童期生长过速伴骨龄快速增长，骨过早闭合致成人矮身材。\n3.非经典型（迟发型）——残留酶活性约20%~50%；临床表现不特异，可在儿童期、青春期甚至成人期发病，大多出生时无临床症状、外生殖器正常；女性随年龄增长多毛、面部痤疮、阴毛早现、月经初潮延迟、月经量过少、月经稀发或闭经，部分严重痤疮、不明原因骨成熟增速、生长增快，终身高矮于靶身高；男性可无症状。\n其他：醛固酮缺乏症状可随年龄增长减轻，男性新生儿和小婴儿诊断应提高警惕；11β-OHD类似分型，2/3经典型患儿出现高血钠、低血钾、碱中毒和高血容量、低肾素性高血压，雄性化程度比CYP21轻（女性仅阴蒂增大）；17α-OHD表现为高血压、高血钠、低血钾、代谢性碱中毒+轻度皮质醇不足+男性假两性畸形/男性女性化+女性性幼稚原发闭经；3β-HSD缺乏出生时即失盐和肾上腺皮质功能不全，严重者循环衰竭死亡，男性外生殖器发育不全（小阴茎），女性不同程度男性化多毛月经不调。' },
{ m: '31D', q: 'CAH的实验室检查、ACTH激发试验诊断界值与新生儿筛查流程？', a: '实验室检查：①血皮质醇和ACTH——经典型皮质醇明显降低、ACTH明显升高；非经典型ACTH轻度升高或正常、皮质醇大致正常。②17-羟孕酮（17-OHP）——17-OHP升高对诊断CYP21缺乏有特殊意义（可高于正常几十甚至几百倍，可靠诊断依据）；21-OHD、11β-OHD及CYP17缺乏（主要17,20裂解酶缺乏）时17-OHP均可不同程度升高；受年龄性别分型影响，有昼夜变化，应清晨未服药早上8:00前取血。③DHEA、雄烯二酮AD及睾酮——21-OHD时均增高，AD比T更敏感且比17-OHP稳定，是诊断治疗和监测的重要指标。④快速ACTH激发试验——非经典型21-OHD当17-OHP正常或轻度异常时做，激发后60分钟17-OHP比正常增高超过30nmol/L（>1000ng/dl），杂合子常在10~30nmol/L（330~1000ng/dl）。⑤血浆肾素、血管紧张素PRA及醛固酮——不同程度增高但特异性不高；小婴儿有生理性醛固酮抵抗（婴儿早期肾素醛固酮升高），按此诊断失盐型需慎重。⑥血电解质——典型21-OHP患儿低钠血症、高钾血症及代谢性酸中毒。⑦皮质醇代谢产物——LC-MS/MS可同时测定30种以上血尿类固醇代谢产物（尚未常规应用）；21-OHD尿17-酮（17-KS）和孕三醇排量增多（正常新生儿尿17-酮亦高，需鉴别、反复测定核实）；尿11-脱氧皮质醇及DOC排量增多对CYP11B缺乏诊断有特异性；尿Δ5类固醇增多提示3β-HSD缺乏。⑧染色体核型及基因——鉴别真正遗传性别；婴儿期发现皮质醇低下无论有无性别模糊都必须做染色体核型检查，必要时CAH相关基因诊断确诊。\n2018共识17-OHP界值（指导诊断分型）：①经典型21-OHD空腹17-OHP>300nmol/L（10000ng/dl）；②非经典型空腹6~300nmol/L（200~10000ng/dl）；③不支持CAH诊断空腹17-OHP<6nmol/L（<200ng/dl）。临床疑似或非经典型时做ACTH激发试验，激发后60分钟：17-OHP>300nmol/L（10000ng/dl）为经典型21-OHD；31~300nmol/L（1000~10000ng/dl）为非经典型；<50nmol/L（<1666ng/dl）可排除21-OHD；31~50nmol/L之间建议基因检测。\n新生儿筛查：荧光免疫法测血清17-OHP是一级筛查；正常新生儿生后17-OHP可轻度升高、1~2天迅速下降，建议48~72小时采足跟血；早产儿17-OHP较足月儿升高需建立不同胎龄切值；疾病状态、应激可致17-OHP升高；类固醇交叉免疫反应可致假阳性需二级筛查——推荐LC-MS/MS检测17-OHP（早产儿建议生后2周及4周复测）；其他生物标记物如21-脱氧皮质醇（不同胎龄新生儿浓度无明显差异，避免胎龄影响，但化学发光法受交叉反应影响大，建议LC-MS/MS）。足月儿阳性切值30nmol/L（大于30召回），早产儿50nmol/L；失盐型随机17-OHP浓度>105nmol/L。筛查流程：17-OHP<6nmol/L排除；6~30nmol/L需ACTH激发试验或基因检测明确。注意17-OHP易受体质、胎龄、应激、感染、情绪、疾病、服药时间、检测方法等影响波动，即使基因型相同浓度差异也很大，不能单纯用17-OHP浓度分型。\n鉴别诊断：①先天性肥厚性幽门狭窄（失盐型呕吐脱水鉴别——CAH为低钠高钾性酸中毒，幽门狭窄为低钠低钾低氯性碱中毒，钡餐鉴别）；②肾上腺皮质分泌雄酮的肿瘤（均有男性化及尿17-酮升高，但肿瘤17-酮、DHEA增多更明显——后两者是肿瘤标志物；17-OHP升高和尿孕三醇增多支持CAH；腹部CT定位）；③中枢性性早熟（睾酮增高但最高不超过正常成人男性；LH、FSH升高而17-OHP不高）；④Addison病（有肾上腺皮质功能不全表现和皮肤色素沉着，但无男性假两性畸形或女性男性化，17-OHP正常；Addison患儿肾上腺缩小而21-OHD患儿肾上腺明显增生）。' },
{ m: '31D', q: 'CAH的治疗（糖皮质激素、盐皮质激素、应激剂量、手术、随访监测）？', a: '治疗目的：用糖和盐皮质激素替代治疗，预防肾上腺危象，同时合理抑制高雄激素血症；保证正常线性生长和青春发育、减少成年终身高受损，停止生长和青春发育完成后保护生育能力、预防骨质疏松和减少心血管风险。治疗原则：各型CAH女性和失盐型患者应终身治疗；单纯男性化型男性进入青春期或成人可适当停药动态观察；应激时补充糖皮质激素；剂量由大开始逐渐减至维持量；定期随诊调整剂量；强调个体化。\n1.糖皮质激素：首选氢化可的松——生理性糖皮质激素、有一定潴钠作用、半衰期短。剂量：1岁内8~12mg/(m²·d)（婴儿期对GC抑制生长效应高敏感、对雄激素低敏感，只需覆盖生理分泌量的低剂量）；大于1岁至青春期前10~15mg/(m²·d)，控制雄激素在青春前期正常范围；青春期清除率增高（尤其女孩）需求量大，但为避免生长负面影响建议不超过17~20mg/(m²·d)；分3次口服（最好每8小时1次），按生理节律服药或将全日2/3量或半量睡前服下，以期清晨抑制ACTH释放高峰；以最小有效量维持最好抑制作用。青春期生长停滞阶段氢化可的松15~25mg/(m²·d)，可选用半衰期较长制剂：强的松5~7.5mg/d分2次，或泼尼松龙4~6mg/d分2次，或地塞米松0.25~0.5mg/d每日1次；任何年龄均需个体化用尽可能低剂量。等效量与特性：氢化可的松20mg=醋酸可的松25mg（0.8倍）=醋酸泼尼松5mg（潴钠0.8、抑制生长0.8）=甲泼尼龙4mg（潴钠0）=地塞米松0.75mg（潴钠0、抑制生长80、半衰期150~300min）。\n2.盐皮质激素：经典失盐型婴儿期给高盐饮食（1~2g/d氯化钠分次加入奶中）；9α-氟氢化可的松0.05~0.2mg/d分1~2次口服（目前唯一盐皮质激素）；新生儿小婴儿对盐皮质激素不敏感需更大剂量；婴幼儿单纯男性化型虽无失盐症状，原则上除糖皮质激素10~15mg/(m²·d)分3次外也应给盐皮质激素；部分患者青春期后因食盐增多可不需盐皮质激素，但停药可再现失盐症状；高血钾应用盐皮质激素或补充食盐后可纠正，不需降血钾特殊处理；氢化可的松20mg类盐作用相当于0.1mg 9α-氟氢化可的松，故应激剂量氢化可的松可提供足够类盐皮质激素作用，可暂停盐皮质激素替代。\n3.抗雄激素治疗（联合用药减少皮质激素用量、降低女性PCOS发生率）：①睾内酯（芳香化酶抑制剂，阻止雄激素转化为雌激素，延缓骨闭合）20~30mg/(kg·d)分3次；②氟他胺（雄激素拮抗剂，抑制睾酮并阻断17α-OHP转化为雄烯二酮）5~10mg/(kg·d)分2次。\n4.肾上腺危象治疗：失盐型伴电解质紊乱、低血糖、脱水或休克时及时静脉输液、补充糖皮质激素、扩充血容量和升高血压。\n5.应激状态治疗：常见应激为发热或感染性疾病、手术、创伤等；心理情绪应激和运动不强调增加剂量但需监控血糖。感染时氢化可的松：轻中度感染（体温>38℃、中等程度腹泻）增至原剂量2~3倍分4次至病愈；重度应激（体温>39℃、腹泻呕吐伴脱水）增至4~5倍分4次至病愈；也可按年龄：0~3岁以下25mg、3~12岁50mg、≥12岁100mg每日；成人上午60mg下午30mg（或等效长效制剂）；不能口服时胃肠外给药；病愈后1周内逐步减量至原替代量；氢化可的松有类盐作用，应激时不增加盐皮质激素剂量。注意部分患儿肾上腺髓质发育不良、血儿茶酚胺低下，应激时与皮质醇不足叠加可致低血糖。\n6.外科手术：女孩阴蒂增大需手术治疗，最适宜年龄2岁前（恢复正常解剖结构、减少尿路感染、降低心理压力）；术前需染色体核型检查确定遗传性别；手术目的去除多余勃起组织、保存性敏感阴蒂腺体、提供正常尿道阴道开口；轻型增大经早期合理药物治疗可免除手术。围手术期：术前1~3天静滴氢化可的松50mg/(m²·d)分2次，手术日增至100mg/(m²·d)，术后1~2天减至50mg/(m²·d)，之后快速减量改口服，术后数日至1周内减至原维持量。男性可发生睾丸内肾上腺剩余瘤TART（睾丸内残留肾上腺原基细胞过度增殖性良性病变，多见于控制不良患者）——3岁后每年行睾丸B超检查，围青春期密切监测；出现TART首先较大剂量皮质醇药物治疗，部分可缩小消失，控制不佳者考虑TART剔除术保护正常睾丸组织；病程长瘤体巨大者即使剔除剩余睾丸功能也有不同程度损害。\n7.CAH继发中枢性性早熟：治疗中出现中枢性性早熟、骨龄明显超速时联合GnRHa治疗，抑制性早熟、延缓骨闭合、尽量达到理想终身高。\n8.随访监测：开始每1~3个月复查1次，剂量调好后3~6个月复查；出生后前3个月每月评估，婴儿期每3个月，以后每3~6个月。指标：①身高和发育——生长速度减慢及骨早闭提示过量；②骨龄——每隔1~2年X线检查，药量合适时骨成熟速度减慢，理想剂量使骨龄增长与年龄增长渐一致，骨成熟进展快提示剂量不足；③雄激素水平——早上空腹未服药前采血，每隔3~6个月监测17-OHP、睾酮、孕酮、ACTH、雄烯二酮、11-脱氧皮质酮等，小婴儿和青春期男孩不能用睾酮判断疗效；④血压、PRA和电解质——监测盐皮质激素剂量。控制目标：青春期前空腹未服药血清17-OHP 400~1200ng/dl（12~36nmol/L），雄烯二酮正常范围；肾上腺雄激素不应被完全控制，17-OHP正常通常提示治疗过度；肾素活性抑制表明治疗过度（有高血压风险）。\n预后：取决于酶缺陷程度、就诊及开始治疗早晚、依从性；肾上腺危象可严重危及生命（未经治疗的失盐型婴儿或应激状态）；早期确诊及时治疗或应激时正确处理不影响生命；不能早期治疗或皮质激素过量均可影响最终身高，单纯男性化型最易误诊延迟诊断致身矮；治疗得当多数患者终身高可达正常低限或正常范围，两性均可有正常青春发育和生育功能（单纯男性化比失盐型生育功能好，非经典型较经典型性功能正常者多）；女性经适当治疗可见月经初潮、正常妊娠。' },
{ m: '31D', q: '肾上腺髓质儿茶酚胺的合成代谢与肾上腺素能受体？', a: '肾上腺髓质由含激素的嗜铬细胞及交感神经元细胞组成，分泌有生物活性的儿茶酚胺（多巴胺、肾上腺素、去甲肾上腺素），以肾上腺素为主；胚胎第8周原始干细胞从肾部移行到主动脉后形成交感神经链，分化为嗜铬母细胞和交感神经母细胞，最后形成嗜铬细胞和交感神经节细胞。中枢神经系统一些神经元可产生去甲肾上腺素或多巴胺，肾上腺素能神经元末梢只释放去甲肾上腺素、不能释放肾上腺素；肾上腺髓质中去甲肾上腺素约占儿茶酚胺总量15%~20%。\n合成：酪氨酸→（酪氨酸羟化酶TH，限速酶）多巴→（多巴脱羧酶DD）多巴胺→（多巴胺β-羟化酶DBH）去甲肾上腺素→（苯乙醇胺-N-甲基转移酶PNMT，仅存在于肾上腺髓质）肾上腺素；PNMT使去甲肾上腺素转变为肾上腺素，其酶活性可能依赖糖皮质激素（可增强PNMT活性），肾上腺素对PNMT有抑制作用（负反馈）。TH受胞质内去甲肾上腺素负反馈调节。儿茶酚胺也在脑、交感神经末梢及髓质外嗜铬细胞合成。\n降解：释放后经单胺氧化酶MAO及儿茶酚-O-甲基转移酶COMT降解失活，肾上腺素和去甲肾上腺素最终产物为3-甲氧-4-羟杏仁酸（VMA，香草杏仁酸）；多巴胺代谢失活产生高香草酸HVA；代谢产物直接或间接与葡糖醛酸、硫酸结合由尿排出，部分游离儿茶酚胺亦可由尿排出。\n分泌调节：受神经系统控制，支配神经为脊髓前角神经来的胆碱能纤维，兴奋时促进释放肾上腺素；调节中枢位于脊髓、延髓及下丘脑，以延髓最重要。神经兴奋下肾上腺素和去甲肾上腺素分别选择性释放、不互相伴随；血中肾上腺素由肾上腺髓质释放，去甲肾上腺素大部分自交感神经终端释放。\n受体：肾上腺素能受体分α受体和β受体，各有α₁、α₂及β₁、β₂亚型——α受体兴奋后激活腺苷酸环化酶系统产生cAMP增多（一般α受体激活是兴奋性的，β受体兴奋是抑制性的；刺激肠道α受体使肠平滑肌松弛，刺激心肌β受体是兴奋——增强心肌收缩力、心率增快、房室传导加速，β受体使血管和支气管扩张）；血管还有多巴胺特异受体DA1（兴奋引起肾脏、肠系膜、冠状动脉和脑血管床扩张）和DA2（抑制交感神经终端释放肾上腺素和抑制催乳素释放）。\n生理功能：去甲肾上腺素作为交感神经节后终端的神经递质释放，刺激α受体引起小动脉和静脉收缩、收缩压和舒张压升高；应激时也有激素功能从血中转运到靶器官。肾上腺素显示α和β肾上腺素能作用：增加心率、心肌传导率及心室收缩力，松弛支气管肌肉，促进糖原分解，刺激胰高血糖素和抑制胰岛素分泌，动员脂肪组织释放游离脂肪酸等。' },
{ m: '31D', q: '皮质醇增多症（库欣综合征CS）的病因分类、临床表现与诊断？', a: '皮质醇增多症：肾上腺糖皮质激素分泌过多引起的一系列临床征群，表现为满月脸、多血貌、向心性肥胖、高血压等；分外源性（药源性，长期应用外源性糖皮质激素，儿童CS以外源性多见）和内源性。内源性CS分两大类：\n1.ACTH依赖性CS——垂体或垂体以外肿瘤分泌过多ACTH使肾上腺皮质增生继发分泌过多皮质醇，约占75%~90%儿童CS，主要由下丘脑垂体分泌CRH、ACTH过多（库欣病）所致；6岁以上儿童CS病因主要是库欣病；相关遗传因素有MEN-1基因、AIP基因等；垂体以外肿瘤分泌过量ACTH为异位ACTH综合征（最常见肺燕麦细胞癌，其次胸腺瘤、胰岛细胞瘤、类癌、甲状腺髓样癌，小儿少见，青少年CS不到1%）。\n2.非ACTH依赖性CS——肾上腺皮质自主分泌过多皮质醇（腺瘤、腺癌、皮质结节样增生），约占青春期前儿童CS的15%~20%；6岁以下儿童CS主要病因为肾上腺来源；小儿肾上腺皮质肿瘤50%以上发生于3岁以前、85%见于7岁以前，大部分为恶性肾上腺皮质癌，多为单侧（儿童年发病率0.21/100万，双峰年龄分布——幼儿高峰3岁、成人40~50岁）；肾上腺皮质肿瘤常是混合性的（皮质醇、醛固酮、肾上腺雄酮、雌醇均增多）；相关基因：P53（Li-Fraumeni综合征）、GNAS（McCune-Albright综合征MAS——GNAS基因20q13.3激活突变，内分泌功能亢进+骨纤维异样增殖症+皮肤咖啡牛奶斑）、Menin（MEN-1，11q13常显：肾上腺皮质肿瘤或增生、胰腺肿瘤、甲状旁腺腺瘤、垂体瘤）、IGF-II、H19和CDKI（Beckwith-Wiedemann综合征）、APC（家族性腺瘤息肉病）。根据结节大小分：结节<10mm——原发性色素结节性肾上腺皮质病PPNAD（罕见，多青少年，PRKAR1A基因失活变异所致常显遗传，多合并Carney综合征——黏液瘤、点状色素痣、内分泌肿瘤；双侧肾上腺外观正常或增大、多发色素性小结节）及孤立性小结节性肾上腺增生症iMAD（PDE11A、PDE8B基因失活变异相关）；结节>10mm——原发性双侧大结节性肾上腺增生症PBMAH（罕见，ARMC5基因相关）。\n临床表现（可自新生儿期或婴幼儿开始，起病隐匿，女孩多于男孩）：儿童时期身高增长不足和体重增加是最常见表现——①进行性肥胖（糖异生增加、蛋白质分解和脂肪堆积，满月脸、两颊红润、下颌颈背部腹部脂肪堆积隆起、四肢相对细小、水牛背及向心性肥胖）；②生长缓慢或停滞（身高多数在第3百分位数以下）；③高血压（钠潴留血容量增多，小儿低血钾和血钠增高少见，高血压可致心脏扩大、心衰及肾脏眼底改变）；④骨质疏松（蛋白质分解负氮平衡，骨生长受影响，血钙正常）；⑤皮肤改变（多毛、毛发密厚、面部痤疮、毛细血管变脆、皮肤变薄、大腿臀部紫纹或出血点；ACTH依赖性CS颈部、腋下、腹股沟等受压处皮肤明显色素沉着）；⑥抵抗力下降（易感染甚至败血症，淋巴组织萎缩，婴儿期可见胸腺萎缩）；⑦嗜酸性粒细胞减少（淋巴细胞和嗜酸性粒细胞减少、中性粒细胞及红细胞增多）；⑧性发育异常（多数青春期发育延迟，女孩可见继发闭经；肿瘤常同时分泌皮质醇、盐皮质激素和雄酮——高血压、库欣征伴男性化，女性患肾上腺男性化肿瘤后可阴蒂肥大、阴毛增多，应警惕肾上腺皮质腺癌）；⑨其他（皮质醇对脑代谢重要作用——可有智力障碍、学习退碍、头痛）。肾上腺皮质癌病情进展迅速更严重，表现比年长儿更显著。\n实验室检查：①电解质和糖耐量——葡萄糖耐量减低甚至类固醇糖尿病，血电解质多正常，肾上腺皮质癌、异位ACTH综合征可有低钾碱中毒；②血浆ACTH、皮质醇——ACTH依赖性CS血浆ACTH轻度升高或正常高限，两者失去昼夜节律；2岁以上测上午8时、下午4时、0时（2岁以下小儿尚未建立昼夜变化规律）；午夜皮质醇值>7.5μg/dl可作诊断CS初筛；③24小时尿游离皮质醇UFC——儿童矫正范围25~65μg/(m²·d)，应留2~3天，CS患者常超过90μg/d；尿17-羟类固醇常低于16~56μmol/24h（6mg/24h），超过为排量增多；④午夜唾液皮质醇>0.13μg/dl可作CS初筛（方便无损伤，灵敏度特异性较好，儿童值得推广）；⑤过夜地塞米松试验（筛查）——0点口服地塞米松1mg，次晨8点血皮质醇能抑制到基础值50%或<50nmol/L（1.8μg/dl）可排除CS；⑥小剂量地塞米松抑制试验（定性诊断）——每次30μg/kg最大0.5mg/次，每6小时一次连服8次，单纯性肥胖者尿游离皮质醇被抑制，CS患者不能抑制；⑦大剂量地塞米松试验（病因诊断）——每次120μg/kg最大2mg/次，每6小时1次连服8次，用药后24小时UFC、尿17-OHCS或血皮质醇被抑制超过对照值50%提示库欣病，反之为肾上腺自主功能性肿瘤或异位ACTH分泌；⑧岩下静脉窦采血IPSS——怀疑库欣病而垂体MRI未发现病变时定位垂体微腺瘤。\n影像学：①鞍区MRI——推荐对所有ACTH依赖性CS做垂体增强或动态增强MRI，可显示60%库欣病患者垂体腺瘤；②肾上腺B超、CT、MRI——首选双侧肾上腺CT薄层增强扫描；③颈胸腹盆CT或MRI检测异位ACTH来源；④核素扫描（奥曲肽扫描、PET、68Ga-DOTATATE PET/CT）有助异位ACTH定位。\n诊断步骤：向心性肥胖为主、生长速率减慢、高血压、多毛、水牛背、紫纹、受压部位黑棘皮样改变者诊断CS——第一步测24小时尿游离皮质醇、夜间唾液皮质醇或小剂量地塞米松抑制试验明确是否存在皮质醇增多，再进一步检查明确病因。\n鉴别诊断：①营养性肥胖（生长发育多比同龄正常儿高大、身体匀称，CS患儿向心型肥胖有生长障碍身材较矮；ACTH和皮质醇节律正常，严重单纯肥胖亦可尿皮质醇或17-羟排量增多，小剂量地塞米松抑制试验可使单纯肥胖降至正常）；②多囊卵巢综合征（肥胖、痤疮、多毛、青春期月经量减少或闭经、血睾酮升高、尿17-KS和17-OHCS增高，但可被地塞米松试验抑制，盆腔B超可见多囊卵巢）。\n治疗（策略取决于病因）：1.库欣病——首选经蝶垂体腺瘤切除术（儿童鼻腔狭小多行经颅垂体腺瘤全切或部分切除术，术后并发症：短暂尿崩症、SIADH、多发垂体功能减退、出血、感染、垂体卒中）；垂体放疗作为手术未获预期效果的补充（传统分次照射总剂量4500~5000cGy疗程>6周，儿童效果较佳起效快缓解率80%以上，垂体功能减退是主要不良后果）；肾上腺切除（全切优点较快控制病情避免复发，缺点终身依赖肾上腺皮质激素且约10%患儿发生Nelson综合征——儿童发生率约50%，全切除仅限病情严重者不宜儿童；次全切除——一侧全切另一侧切除大部分，可较好控制且一般不需补充激素，缺点部分复发、部分肾上腺皮质功能不全或垂体肿瘤）；药物治疗（酮康唑抑制皮质醇合成但肝毒性严重；赛庚啶为5-HT拮抗剂抑制CRH分泌，皮质增生患者用3~6个月可缓解但常不能使皮质醇降至正常；米非司酮糖皮质激素受体拮抗剂，副作用低钾、肾上腺功能不全、子宫内膜增厚——均未批准用于儿童）。2.异位ACTH综合征——明确病因和肿瘤定位，无播散者切除原发肿瘤可治愈，无法定位者必要时双侧肾上腺切除。3.肾上腺肿瘤或增生——良性肿瘤首选手术切除患侧肾上腺；双侧皮质增生可选一侧切除或次全切；皮质癌据病情选单侧或双侧切除（皮质癌预后差，顺铂+依托泊苷+阿霉素联合手术研究显示Ⅲ期预后良好、Ⅳ期差）。糖皮质激素替代：接受肾上腺手术者术前、术中、术后均需用糖皮质激素——术前1天肌注氢化可的松50~100mg；手术日术前肌注50mg、术中静滴100~200mg（切除肿瘤时加快滴入速度）；术后1、2日每8小时肌注50mg，第3、4日注射2次，第5天改口服氢化可的松12~15mg/(m²·d)分2~3次；下丘脑-垂体-肾上腺轴功能恢复后渐减量，视病情停药或继续替代；双侧肾上腺切除术后终身使用糖皮质激素和盐皮质激素（氟氢化可的松0.1~0.2mg/d）。' },
{ m: '31D', q: '原发性醛固酮增多症（原醛症PA）的六型病因、临床表现、检查与治疗？', a: '原醛症：肾上腺皮质自主性分泌醛固酮过多引起高血压、低血钾等；我国难治性高血压人群患病率7.1%，小儿少见。六型：醛固酮瘤、特发性醛固酮增多症IHA、原发性肾上腺皮质增生、家族性醛固酮增多症FH、分泌醛固酮的肾上腺皮质癌、异位醛固酮分泌瘤或癌。两个主要原因：醛固酮腺瘤（占35%）和特发性醛固酮增多症（占60%）；腺瘤多为单发（小儿病例有报告，最小3岁），小儿病例多见双侧肾上腺皮质增生引起。约5%病例家族背景、常显遗传，分FHI~V型：FH-Ⅰ（糖皮质激素可抑制性醛固酮增多症）——CYP11B1与CYP11B2基因间不平等互换（两基因均在8号染色体、95%同源性），CYP11B1调节序列与CYP11B2编码序列融合→醛固酮合成酶在束状带异位表达并受ACTH调节；成人PA中占0.5%~1%，儿童高血压筛查占3%；FH-Ⅱ——CLCN2基因（内向整流氯通道CLC-2）；FH-Ⅲ——KCNJ5基因（GIRK4钾通道，改变离子选择性使Na流入、细胞去极化、醛固酮合成增加，罕见）；FH-Ⅳ——CACNA1H基因（电压门控T型钙通道Cav3.2，可不完全外显）；还有CACNA1D基因变异。腺瘤中还发现体细胞突变（KCNJ5、CACNA1D、ATP1A1、ATP2B3、CTNNB1、CLCN2）。\n临床表现：慢性发展，最早出现高血压（多为中等度），随病程发展出现并发症——乏力、头晕、感觉异常；长期高血压引起左心肥大和心衰、眼底小动脉痉挛（高血压视网膜病极少见，可能与肾素-血管紧张素被抑制有关）、高血压肾病；家族性者可合并神经系统表现（癫痫、认知障碍、自闭症）。仅9%~37%患者有低钾血症（正常血钾高血压是最常见表现，低钾血症见于更严重病例——最大研究中仅一半腺瘤患者和17%特醛患者血钾<3.5mmol/L；低钾血症存在敏感性较低，缺乏低钾对PA诊断阴性预测价值较低）。对高血压、低血钾、碱中毒伴多饮多尿、夜尿增多、尿钾增多者应疑诊。\n实验室检查：①血生化——低血钾（多<3.5mmol/L，可间歇性），血钠一般略高于正常（140mmol/L以上，很少>148），血pH偏碱；肾功能、浓缩功能受损，严重时氮质血症、肌酐清除率和尿素清除率减低；血镁降低（醛固酮促镁排出）可手足搐搦；②尿常规——尿量增多（夜尿增多）比重偏低≤1.010且一日间变化小、不受抗利尿激素影响，可有蛋白尿和/或尿白细胞增多，尿钾增多；③醛固酮测定——24小时尿醛固酮（普通饮食钠100mmol/d时正常成人尿排11.08~27.7nmol/24h即4~10μg/24h），该病排量增高≥55.4nmol/24h（20μg/24h）；血浆醛固酮放射免疫法测定；④血浆肾素-血管紧张素活性低于正常，ARR比值增高；⑤心电图——低血钾改变：Q-T间期延长、T波增宽降低或倒置、U波出现或T-U波相连；⑥腹部CT或MRI鉴别肾上腺腺瘤或增生。\n鉴别诊断：①原发性高血压（服利尿剂未补钾可低血钾肌无力，停利尿剂补钾后血钾恢复）；②肾缺血性高血压（血压更高进展快、腹部血管杂音，静脉肾盂造影患侧肾脏显影和消失延迟，血浆肾素活性增高——继发性醛固酮增多；体内钠丢失过多如出汗腹泻肾小管酸中毒血容量减少时亦可生理性肾素-醛固酮增多）；③假性醛固酮增多症Liddle综合征（常显，SCNN1G或SCNN1B基因激活突变→肾小管钠通道ENaC功能增加→远端肾小管钠重吸收增加、钠钾交换旺盛、钾消耗过多：高血压、低血钾、高血钠、碱中毒及尿排钾增高；醛固酮和肾素分泌受抑制；低钠饮食、螺内酯均不能降低血钠，地塞米松无效；氨苯蝶啶治疗——直接抑制远球肾小管钠吸收并减少钾排泄，同时补氯化钾可使血压正常）；④表观盐皮质激素增多综合征（11β-羟类固醇脱氢酶2即HSD11B2基因变异致常隐遗传，可继发于长期服甘草；该酶催化皮质醇转化为无生理功能的可的松，缺陷时皮质醇半衰期延长、活性升高，增多皮质醇活化盐皮质激素受体产生类盐皮质激素作用→血压升高；儿童早发重度高血压和生长发育受限，伴多饮多尿、低钾血症、代谢性碱中毒，可见肾囊肿、高钙尿症、肾钙质沉着症；类似原醛但血浆醛固酮和肾素活性低下、血浆皮质醇正常；治疗低盐饮食+口服高剂量螺内酯2~12.5mg/(kg·d)、阿普洛利、依普利酮，小剂量地塞米松抑制ACTH减少内源性皮质醇产生）；⑤CAH（11β-羟化酶缺乏——11-脱氧皮质酮和11-氧皮质醇增多，潴钠排钾致高血压+性征异常；17-羟化酶缺乏——皮质酮及11-脱氧皮质酮合成增多致高血压、血钠增高、血钾降低、性发育障碍、男性外生殖器女性化表现）。\n治疗：单侧腺瘤或单侧增生切除一侧肾上腺；特发性醛固酮增多症首选药物治疗——醛固酮受体拮抗剂螺内酯首选，其次依普利酮；一侧腺瘤伴两侧增生可做一侧全切另一侧切除一半必要时辅以拮抗剂；手术次全切除后高血压复发者用螺内酯+低盐饮食；糖皮质激素可抑制性醛固酮增多症首选小剂量糖皮质激素治疗。' },
{ m: '31D', q: '肾上腺皮质功能减退症（原发/继发）的病因、临床表现、诊断与治疗？', a: '肾上腺皮质功能减退症AI：各种原因引起双侧肾上腺绝大部分损害，使肾上腺皮质分泌皮质醇和/或醛固酮不足。原发性PAI——肾上腺皮质本身病变引起皮质激素分泌不足和ACTH分泌增多；继发性SAI——垂体、下丘脑病变致ACTH、CRH分泌不足。慢性原发性者称艾迪生病Addison disease。\n继发性病因：①下丘脑及垂体先天缺陷（先天性垂体发育不全常伴肾上腺功能减退及其他多种垂体激素缺乏；相关转录因子HESX1、LHX4、SOX3、PROP1；常合并无脑畸形及全前脑畸形，患儿常保留部分垂体功能；也可继发于下丘脑CRH缺乏）；②孤立性ACTH缺乏症（少见，特发性或淋巴细胞性垂体炎，相关基因TPIT/TBX19、PCSK1、POMC）；③下丘脑垂体破坏性病变（获得性SAI最常见病因为垂体肿瘤——颅咽管瘤为小儿ACTH缺乏最常见原因；还有转移瘤、肉芽肿性疾病、朗格汉斯组织细胞增生症、手术、放疗、外伤）；④外源性糖皮质激素治疗（临床最常见——长期大剂量GC抑制下丘脑-垂体-肾上腺轴，突然停药引起，停药后短期不能恢复，症状常发生在应激时；患者仅有糖皮质激素合成和分泌不足，盐皮质激素不受影响）。\n原发性病因：①先天性肾上腺发育不全（4种形式：散发性合并垂体发育不全；常隐遗传；X连锁巨细胞型合并低促性腺激素性腺功能减退症；X连锁型合并甘油激酶缺陷部分伴肌营养不良——Xp21 DAX1基因突变或DAX1与甘油激酶基因缺失；SF-1致病变异也引起肾上腺皮质功能减退合并XY性反转）；②皮质激素合成先天缺陷——婴幼儿最常见原因为CAH（常隐，最多见21-羟化酶缺陷型）；③ACTH不敏感综合征（少见常隐，糖皮质激素和雄激素缺乏并对ACTH无反应、ACTH高且盐皮质激素多正常；1型家族性糖皮质激素缺乏症——MC2R突变，慢性肾上腺皮质功能减低：糖皮质激素不足、ACTH增高、醛固酮正常，不失盐，表现原发低血糖惊厥和皮肤色素增多、喂养困难生长停滞，ACTH激发试验皮质醇不增加、给低盐饮食醛固酮分泌增加，病理为束状带网状带明显萎缩但保留较少球状带；2型Allgrove综合征/3A综合征——无泪、贲门失弛症、神经系统损害如耳聋，AAAS基因突变）；④感染（结核最常见但近年减少；脑膜炎球菌感染最常见且严重者发生肾上腺危象；HIV、组织胞浆菌病、球孢子菌病；儿童时期少见）；⑤自身免疫性肾上腺炎（APS-Ⅰ型常隐AIRE基因变异，婴儿期发病：慢性皮肤黏膜念珠菌病、甲旁减、艾迪生病、恶性贫血、性腺功能减低、斑秃、白癜风、肠吸收不良；APS-Ⅱ型多基因遗传女性多见、发病高峰20~60岁：1型糖尿病、艾迪生病、自身免疫性甲状腺疾病、原发性性腺功能减退、重症肌无力，与HLA-DR3和DR4相关）；⑥肾上腺脑白质营养不良（X连锁隐性，ABCD1基因突变——过氧化物酶蛋白，极长链脂肪酸不能氧化堆积致细胞死亡；3~12岁起病，中枢神经系统症状为主：行为性格改变、步态障碍、发音吞咽困难、失明，后期惊厥痉挛性四肢瘫痪去皮质体位；约1/3患儿有肾上腺皮质功能不全常起病于4岁后，皮肤色素沉着可在神经系统症状之前或同时出现；可产前诊断）；⑦肾上腺出血（新生儿难产或窒息出血，广泛出血可因皮质功能减退或失血死亡，以后可出现肾上腺钙化）；⑧华佛综合征（细菌性感染休克，详见流脑及感染性休克）；⑨其他（IMAGe综合征CDKN1C基因变异；MIRAGE综合征SAMD9基因变异；线粒体疾病Kearns-Sayre、MELAS）；⑩单纯性醛固酮合成不足（极少见，皮质酮-18-甲基氧化酶Ⅰ和Ⅱ型CMOⅠ/Ⅱ缺陷：CMOⅠ缺乏18-OH-皮质酮正常低值、醛固酮测不出，CMOⅡ缺乏18-OH-皮质酮明显升高、醛固酮正常低值，均血钠严重缺乏伴高血钾代谢性酸中毒，常隐）；⑪假性醛固酮减少症（基因缺陷致高钾血症代谢性酸中毒；Ⅰ型新生儿期发病反复呕吐腹泻喂养困难体重不增高钾低钠低氯代谢性酸中毒，Ⅱ型发病年龄不等高血压发育落后牙釉质发育不全）。\n临床表现三种类型：1.急性肾上腺皮质功能不全（婴儿时期多发生于肾上腺不发育、类固醇合成缺陷及假性醛固酮增多症；出生后不久失盐：呕吐恶心喂养困难体重不增嗜睡脱水体温低低血糖循环衰竭，诊治不及时可迅速死亡）；2.原发性慢性肾上腺皮质功能减退Addison（起病缓慢：疲乏无力、长期食欲缺乏、恶心呕吐腹泻、消瘦、低血压，腹痛类似急腹症；多喜食盐及饮水，食盐不足及治疗不及时可肾上腺危象——发绀、皮肤发冷、脉搏微弱而快、血压下降、呼吸快而费力；皮肤色素沉着常见于面部、手掌纹和指纹、会阴部、乳头、脐部及关节等部位（ACTH不增多者无色素沉着），有时皮肤可见白斑、黏膜黑色素斑；应激时病情突然恶化发生惊厥及昏迷；儿童家族性糖皮质激素缺乏开始不失盐，只是色素沉着增多和低血糖，症状可发生于出生后不久但多数5岁开始，许多患儿因惊厥发作未诊断出低血糖而接受其他治疗）；3.肾上腺危象（急性感染时发生，特别是脑膜炎球菌败血症——很快严重休克进入昏迷+急性紫癜：皮肤出血点很快扩大融合成大片瘀斑，血压下降脉搏增速呼吸困难皮肤青紫发凉；血钠降低可被血液浓缩掩盖；即暴发型流脑或华佛综合征，肾上腺出血仅为病理诊断，循环衰竭主因是毒血症引起的微循环障碍）。\n实验室检查：①血电解质——血钠氯减低、血钾升高、尿排钠氯增加排钾减少；脱水时BUN、NPN增高；一般低血糖不明显，延长空腹可有低血糖；②血清皮质醇——只有晨间血皮质醇才有诊断价值：晨间血皮质醇≤83nmol/L（3μg/dl）可诊断，≥550nmol/L（20μg/dl）可排除；部分患儿基础皮质醇正常但肾上腺对应激反应能力不足；③ACTH激发试验——各年龄段静脉注射标准剂量ACTH（≥2岁及成人250μg；1~2岁125μg；婴儿15μg/kg），30~60分钟内皮质醇峰浓度<500nmol/L提示肾上腺皮质功能减退；注射ACTH后皮质醇明显增加则病变不在肾上腺而在垂体或下丘脑；甲吡酮试验检验垂体ACTH储备；④血ACTH——升高为原发性皮质醇缺乏，减低为继发性；CRH试验帮助确诊病变部位；⑤血肾素血管紧张素醛固酮——怀疑醛固酮分泌不足时测定，对单纯醛固酮合成不足与假性低醛固酮症鉴别有意义；⑥心电图——高血钾改变：T波高尖耸立、S-T段下降、P-R间期延长、心律失常；⑦影像学——腹部X线平片肾上腺区钙化灶（肾上腺出血、囊性病变、结核），胸透心影小而细长（血容量减少），腹部B超/CT/MRI对占位出血结核有帮助；疑继发性者行头颅垂体MRI。\n鉴别诊断：新生儿期呕吐腹泻脱水应与幽门梗阻、重症消化不良鉴别；皮肤色素沉着须与其他皮肤色素浓疾病鉴别（如神经纤维瘤病）。\n治疗：1.急性肾上腺皮质功能不全及肾上腺危象——①纠正水电解质紊乱：立即输入5%葡萄糖盐水20ml/kg于1/2~1小时内快速静滴使血压上升循环改善，按脱水程度补液；第2个24小时皮质醇减量，输液60ml/(kg·d)，必要时加盐皮质激素9α-氟氢可的松0.05~0.1mg/d；病情仍不见好转可输血浆，出血时输血；输液期间防液量过多引起肺水肿或心衰；②皮质醇应用：纠正血容量同时静注氢化可的松，初始剂量儿童100~150mg/m²，然后按50~100mg/(m²·d)每6小时静脉输入；血钾降低后注意补钾；以后渐减为维持量转入慢性期治疗；③控制感染：合并感染同时选用强有力广谱抗生素。2.慢性肾上腺皮质功能不全——①激素替代：氢化可的松HC或醋酸可的松（糖皮质激素活性相当于0.8HC）为儿科首选（儿童应避免泼尼松龙或地塞米松——对生长有很强抑制作用）；HC每日7.5~15mg/(m²·d)分3~4次口服，第一次和稍高剂量早上醒来时使用，最后一次睡前4~6小时使用；HC初始剂量8mg/(m²·d)被认为除CAH外PAI患者的替代治疗量，CAH患者为抑制ACTH需超生理剂量，推荐每日HC总量不超过17.5mg/(m²·d)以尽量减少最终成年身高损害；失盐症状单纯用皮质醇不能纠正时加9α-氟氢可的松0.05~0.2mg/d每日1次晨起口服；婴儿饮食含盐低每日加服食盐1~2g分次加入牛奶或食物中；②应激情况治疗：感染、手术、创伤时不能产生大量激素反应必须加量——急性感染增加原药量2~3倍；严重感染或需手术时按急性肾上腺功能不全补充；应激一旦消除减为维持量以免长期过量引起生长障碍；手术一般术前2天住院准备增加药量，急症手术不能预先准备时术前肌注氢化可的松50mg/m²、麻醉开始即静滴50mg/m²、术中及术后各再给1次。' },
{ m: '31E', q: '性腺与性器官的分化（性腺分化、附属器官分化、睾丸/卵巢功能）？', a: '性分化是复杂连续的动态过程，包括三个互相关联阶段：染色体性别分化、性腺性别分化、表型性别分化（生殖导管和尿生殖窦分化），过程不可逆。\n性腺分化：原始生殖细胞第4~5周开始由卵黄囊内胚层向生殖方向迁移形成未分化原始性腺；受精后5~6周原始未分化性腺形成（三种胚胎细胞成分：原始性索、间充质、原始生殖细胞）；第7周原始性腺开始分化。在性别决定因子SRY影响下，性索分化为曲细精管，支持细胞分化为睾丸滋养细胞（Sertoli细胞），间质细胞分化为睾丸间质细胞（Leydig细胞），逐步初具睾丸形态；无SRY影响时至第13~16周性索分化为胚胎卵泡，间充质分化为胚胎卵泡的膜细胞和基质细胞完成胚胎卵巢形成——此时期必须有两个完整X染色体存在才能分化为正常卵巢。\n性腺附属器官分化：胚胎第6周出现一对中肾管和一对米勒管。男性胎儿睾丸形成后——睾丸分泌雄激素决定中肾管分化发育成附睾、输精管、储精囊和射精管，泌尿生殖窦分化成尿道、前列腺和膀胱；睾丸Sertoli细胞分泌的抗米勒管激素AMH以局部分泌方式在胚胎第8~9周引起米勒管逐渐退化。无睾丸存在时中肾管萎缩，米勒管不退化发育成输卵管、子宫和阴道上半部分；阴道下半部分和膀胱来自泌尿生殖窦。外生殖器分化：睾丸Leydig细胞分泌的睾酮经局部5α还原酶作用还原生成二氢睾酮DHT，DHT作用于男性外生殖器完成男性生殖道分化（雄激素受体完全正常时泌尿生殖褶和隆起分别分化为龟头、阴茎和阴囊）；若无雄激素作用，无论胚胎遗传性别如何，将发育成女性下1/3阴道、阴蒂、大阴唇和小阴唇。\n睾丸功能：由曲细精管（占睾丸体积60%）和Leydig细胞组成，具雄激素合成和产生精子两大功能；Leydig细胞在LH刺激下合成分泌睾酮（约占体内睾酮95%，肾上腺皮质只产生少量）；睾酮与FSH协同作用于Sertoli细胞，明显增加Sertoli细胞内睾酮受体浓度，加强睾酮生物作用并促进曲细精管发育成熟和精子发生。精子生成三阶段：精原干细胞有丝分裂及分化、初级精母细胞减数分裂、圆形精子到长形精子的变形。\n卵巢功能：分外周皮质和中央髓质，皮质内有不同发育阶段卵泡、黄体和间质细胞，卵巢门区主要有分泌性激素的门细胞。三大功能：①合成并分泌性激素及多种肽类物质促使第二性征发育；②产生有受精能力的卵细胞；③为受精卵着床做好准备、支持早期胚胎发育。' },
{ m: '31E', q: '正常青春发育的启动机制与Tanner分期顺序？', a: '青春期是从第二性征开始发育至完全发育成熟具有生育能力的阶段。儿童早期下丘脑-垂体-性腺轴处于抑制状态，青春前期开始启动。启动下丘脑-垂体-性腺轴激活的第一个生化事件是吻肽kisspeptin升高，随后GnRH脉冲发生器被激活，LH脉冲振幅开始在夜间增加，继而白天分泌量也逐渐增加，性腺分泌的雌激素和睾酮量相应上升，青春发育开始。GnRH分泌受中枢神经系统神经递质调控（谷氨酸使GnRH分泌增加，GABA有抑制作用），还与遗传、营养、BMI、能量平衡等因素有关；GnRH自身还在性腺有旁分泌和自分泌调节。肾上腺皮质雄激素也在青春发育成熟中发挥作用——血清DHEA及DHEAS约在6~8岁开始升高，发生于LH和性激素增加及第二性征出现之前。\n女孩青春期发育顺序：乳房发育→阴毛出现→外生殖器发育→月经来潮→腋毛生长，整个过程约需1.5~6年（平均4年）；乳房开始发育1年后身高迅速增长。男孩青春期发育：首先睾丸容积增大（睾丸容积超过4ml标志青春期开始，达6ml以上即可有遗精现象），继之阴茎增长增粗，出现阴毛腋毛生长及声音低沉、胡须等成年男性体态特征，整个过程需5年以上。性发育Ⅱ期后身高开始增速，每年身高约增8~12cm历时两年左右，骨成熟增速至12~13岁以上，女孩月经来潮；男孩12~16岁开始有遗精，最后骨完全闭合身高基本达成年高度。通常女孩11~14岁、男孩13~16岁完成性发育，开始年龄和完成时间个体差异较大。我国定义性早熟：女孩8岁以前、男孩9岁之前出现第二性征发育。' },
{ m: '31E', q: '性早熟的定义与病因分类？', a: '定义：我国以女孩8岁以前、男孩9岁之前出现第二性征发育定义为性早熟。性发育开始年龄不同种族之间可有较大差异。\n病因分类（两大类+不完全性）：\n1.中枢性性早熟CPP（促性腺激素依赖性，又称真性性早熟）——下丘脑-垂体-性腺轴过早启动，GnRH脉冲分泌增强；除第二性征发育外还有卵巢或睾丸发育，性发育过程和正常青春期顺序一致只是年龄提前；是真性同性性早熟，由LH和FSH介导性腺发育；典型CPP儿童有线性生长加速和骨龄提前。病因：①特发性中枢性性早熟ICPP——下丘脑对性激素负反馈敏感性下降、GnRH过早增加分泌所致，女性多见，约占女孩CPP的80%以上；②中枢神经系统病变——肿瘤或占位（下丘脑错构瘤、生殖细胞瘤、囊肿、鞍上畸胎瘤、室管膜瘤及部分松果体瘤、肉芽肿）、CNS感染、获得性损伤（外伤、术后、放疗或化疗）、先天发育异常（脑积水、视中隔发育不全等）；③临床综合征——神经纤维瘤Ⅰ型、结节性硬化、Sturge-Weber综合征；④基因突变——kisspeptin/KISS1及其受体KISS1R基因突变（GnRH脉冲幅度增加和/或信号传导延长）、MKRN3表达缺失（机体丧失对下丘脑-垂体-性腺轴的抑制）、DLK1基因突变（家族性中枢性性早熟）；⑤未经良好控制的外周性性早熟转化而来（如先天性肾上腺皮质增生症）。男孩颅内灰结节错构瘤为最常见的导致中枢性性早熟原因。\n2.外周性性早熟PPP（非促性腺激素依赖性，又称假性性早熟）——有第二性征发育和性激素水平升高，但下丘脑-垂体-性腺轴不成熟；由分泌性激素的腺体或组织自发性分泌、肿物肿瘤或组织增生产生性激素引起，无年龄性别区分，可同性可异性。常见原因：①性腺肿瘤——卵巢颗粒-泡膜细胞瘤、黄体瘤、睾丸间质细胞瘤、畸胎瘤等；②肾上腺疾病——肾上腺肿瘤、先天性肾上腺皮质增生症等；③外源性激素摄入——如误服避孕药、含雌激素的药物食物化妆品；④异位产生促性腺激素的肿瘤；⑤家族性男性限性性早熟；⑥McCune-Albright综合征。\n3.不完全性性早熟（部分性性早熟）——只出现性发育的一种表现：单纯性乳房早发育PT、单纯性阴毛早现PP、单纯性早初潮PM。\n外周性同性性早熟当骨龄达青春发育年龄（10.5~12.9岁）时可以引起中枢性性早熟。' },
{ m: '31E', q: '中枢性性早熟的临床表现、检查、鉴别与治疗（GnRHa）？', a: '临床表现：第二性征发育顺序与正常青春期一致——女性8岁之前乳房发育，男性9岁前睾丸增大、逐渐阴茎增大；临床表现差异较大，症状发展快慢不一，有些可在性发育至一定程度后停顿一段时期再发育，亦有症状消退后再发育。两性均有身高体重过快增长和骨骼成熟加速，骨龄超过实际年龄；以后阴毛生长逐渐增多，男性伴随胡须、痤疮、喉结、声音变粗、体格肌肉发达然后遗精；女性随青春发育身体脂肪增加、臀部大腿脂肪分布增多；盆腔B超子宫卵巢增大、卵巢卵泡增多或出现0.8~1.0cm大成熟卵泡；开始为无排卵月经来潮，数月后变成有排卵规律月经周期。早期患儿身高超过同龄儿童，但骨骼过快增长致骨融合过早，成年后身材反而矮小。肿瘤引起者可有头痛呕吐视力障碍等颅内压增高症状。\n实验室检查：①骨龄测定——骨龄超过实际生活年龄CA；②GnRH刺激试验——ICPP患儿血浆LH基础值可能正常，需借助激发试验诊断，结合性发育状态、性征进展速度、身高骨龄变化综合评估；③盆腔B超——女孩卵巢子宫发育情况；④MRI——怀疑颅内肿瘤者行头颅MRI。\n鉴别诊断：首先与乳房早发育和/或阴毛早现鉴别（两者为部分性性早熟，无骨龄增速或轻度增速，性激素分泌增高不明显）；注意排除CNS、肾上腺、性腺、肝脏肿瘤等。\n治疗目的：①抑制或减慢性发育进程，避免女孩过早月经初潮；②抑制骨骼成熟，改善成人期最终身高；③预防与性早熟可能相关的社会心理问题。1.病因治疗——肿瘤引起者手术切除或放化疗（男孩颅内灰结节错构瘤最常见，一般肿瘤很小不需手术，可用GnRHa治疗）；甲减所致者予甲状腺制剂（左甲状腺素）纠正甲状腺功能；肾上腺功能不全患儿用肾上腺皮质激素（儿童首选氢化可的松）替代。2.药物治疗——国内外主要采用GnRHa：常用曲普瑞林（天然GnRH 10肽第6位L-甘氨酸被D-色氨酸替代）和亮丙瑞林（第6位被D-亮氨酸替代）；作用机制为受体后降调节，抑制垂体-性腺轴，使LH、FSH和性腺激素分泌减少，控制性发育、延迟骨骼成熟、改善成人期身高。治疗决定需综合分析患儿年龄、骨龄、生长速度、激素水平、子宫卵巢卵泡变化、预测身高、家属经济负担及儿童心理等多种因素，这是治疗的主要难题。' },
{ m: '31E', q: '外周性性早熟与不完全性性早熟的要点及治疗？', a: '外周性性早熟PPP（假性性早熟）：有第二性征发育和性激素水平升高但下丘脑-垂体-性腺轴不成熟；由分泌性激素的腺体/组织自发性分泌、肿物肿瘤或组织增生引起，除性征表现外多有其他症状。常见原因：①性腺肿瘤（卵巢颗粒-泡膜细胞瘤、黄体瘤、睾丸间质细胞瘤、畸胎瘤）；②肾上腺疾病（肾上腺肿瘤、CAH）；③外源性激素（含雌激素药物食物化妆品）；④其他——家族性男性限性性早熟、McCune-Albright综合征MAS、异位产生促性腺激素的肿瘤。治疗原则：减少雌激素浓度或阻断雌激素对靶器官作用，使阴道出血停止及防止骨提前闭合影响成年终身高；主要药物——芳香化酶抑制剂（来曲唑，有效降低阴道出血频率、改善成人期身高）和雌激素受体拮抗剂（他莫昔芬与雌激素竞争受体使E₂耗竭）；男孩可给睾酮受体阻滞剂（比卡鲁他胺或螺内酯）与芳香化酶抑制剂联合防止骨龄提前；转变成促性腺激素依赖中枢性性早熟时亦可用GnRHa治疗。\n不完全性性早熟：1.单纯性乳房早发育PT——除乳腺发育外不伴其他性发育征象，多数在2岁之前（有些出生后持续下来）；可能是真性早熟第一个征象，亦可由外源性雌激素引起；需查骨龄、血清FSH、LH、雌激素、盆腔超声，连续动态随访非常重要，部分可退缩或反复出现乳腺发育；注意与中枢性性早熟鉴别。2.单纯性阴毛早现PP——女孩8岁、男孩9岁之前出现阴毛而无其他性成熟表现，女孩多见；阴毛开始在大阴唇上、会阴部发展很慢、最后出现腋毛；生长和骨龄正常或暂时轻度增速；因肾上腺雄激素产生过早（与网状带成熟早一致），血DHEA、DHEAS和雄烯二酮分泌增高达青春发育早期水平，但FSH、LH、E或睾酮均在正常青春期前水平；一般无骨龄成熟加速；需与肾上腺肿瘤、睾丸肿瘤、hCG分泌性肿瘤、轻症肾上腺类固醇生成缺陷鉴别——少数患儿出现全身性雄激素效应（生长增速、女孩阴蒂增大男孩阴茎增大、痤疮、骨龄增速大于实际年龄2岁），用ACTH激发试验血清17-羟孕酮不增高可排除CAH；阴毛早现女孩至成年有发生高雄激素过多症和多囊卵巢综合征的危险，应注意随访。3.单纯性早初潮PM——单独发生月经而无其他性早熟表现，比乳房早发育或阴毛早现少见；大多数女孩仅1~3次阴道出血，青春发育年龄正常、血清促性腺激素水平正常，可能由于卵巢发生激活引起E分泌，偶尔盆腔超声发现卵巢滤泡；应排除误服或接触外源性含雌孕激素样物质所致的阴道撤退性出血，以及阴道炎、阴道异物、尿道息肉、阴道肿瘤等导致的出血。' },
{ m: '31E', q: '青春期发育延迟的定义、三类病因、诊断思路与治疗？', a: '定义：男孩超过14岁、女孩超过13岁无第二性征发育即为性发育延迟；或青春期已开始但进展不正常——女孩从青春期第一个征象开始至月经初潮超过4年半，或男孩睾丸发育后3年半仍未完成青春期发育甚至倒退，应考虑青春期发育延迟。\n病因三类：①功能性青春期发育延迟——体质性青春期发育延迟CDGP和慢性疾病等潜在因素导致的功能性低促性腺激素性腺功能减退症；②先天性或获得性低促性腺激素性腺功能减退症HH（下丘脑、垂体病变引起GnRH分泌减少或作用缺陷；下丘脑-垂体基因缺陷已报道90余个，男性患儿研究51%可找到致病基因——最常见PROKR2 17.6%、FGFR1 13.7%、CHD7 7.8%，寡基因突变9.8%；器质性原因如鞍区垂体肿瘤、创伤、感染、血管性病变、放射性损伤）；③高促性腺激素性腺功能减退症（原发性性腺功能减退，多由性腺本身发育异常所致；烷化剂和苯肼类细胞毒药物对生殖细胞造成永久性损害；肿瘤放疗对性腺直接或间接照射）。Kallmann综合征KS患者多伴嗅觉丧失或明显迟钝。\n临床表现：轻型患者多在青春发育期获得诊断——女孩13岁无青春期发育迹象才意识到问题（出生时外生殖器多正常）；男孩出生时小阴茎、小睾丸或隐睾、尿道下裂提示性腺功能不良可能。无论男女青春期后无第二性征出现，或虽有乳房发育及睾丸体积增大但发育进程缓慢历经4~5年未出现月经或遗精考虑青春期延迟，可伴骨骼成熟延迟。器质性或综合征者伴相应症状：中线发育不良常有唇腭裂、视中隔发育不良；Kallmann伴嗅觉障碍；Klinefelter体格瘦长皮下脂肪丰满可伴智力落后精神异常；Turner伴身材矮小及皮肤色素痣、颈短颈蹼、后发际低、盾状胸、乳头间距增宽、肘外翻、第4及第5掌骨短等；Prader-Willi综合征婴儿松软、肥胖、杏核眼、鲤鱼嘴、肌张力低下。\n实验室检查：①一般检查——肝肾功能血尿常规除外慢性系统性疾病或营养不良；②基础性腺激素FSH、LH、睾酮、E₂、孕酮——重视年龄相关基础LH：LH 0~0.7IU/L提示IHH，LH≥0.7IU/L提示青春发育延迟或部分性IHH；③其他激素——GH/IGF-1、PRL、ACTH/皮质醇（8:00）、24小时尿游离皮质醇、甲状腺功能；④功能试验——GnRH兴奋试验评价下丘脑-垂体-性腺轴；标准hCG激发试验和hCG延长试验评价睾丸功能，hMG试验评价卵巢功能；⑤骨龄——G-P图谱法，正常男性骨龄12岁时青春发育自然启动；IHH或暂时性青春发育延迟者骨龄一般落后生物学年龄2~3年，暂时性者骨龄进展到12岁时自发启动；骨龄>12岁仍无青春发育迹象且LH、FSH和睾酮低下考虑IHH而非CDGP；⑥生殖系统超声——内生殖器附件多呈幼稚状态，部分男性隐睾偶有睾丸微钙化；⑦鞍区-嗅球MRI——发现下丘脑垂体区域肿瘤炎症等后天获得性因素；KS患者嗅球嗅沟明显发育不良需加做嗅球部位MRI；⑧嗅觉测试——不能鉴别酒精、白醋、水和香波等气味可拟诊KS；⑨遗传学检测——评价三类性腺功能低下主要检查；HH患者染色体核型多无明显异常（少部分小Y、大Y、区带易位），推荐家系基因检测；高促性腺激素性者常有染色体异常（克氏、特纳）。\n诊断思路：先判断高促性性腺发育异常可能性，除外后鉴别CDGP、暂时性功能性性腺功能减退还是病理性性腺功能减退。青春期发育延迟伴矮身材而不伴外阴异常可能为CDGP——身高生长速率低于同龄同性别-2SD、骨龄落后实际年龄多2岁以内、骨龄12~13岁可自发出现性发育；男孩多见，促性腺激素水平较低；单纯测定促性腺激素不能区别CDGP和HH，GnRH刺激试验鉴别帮助不大，家族史和随访非常关键。\n治疗：目的促进性腺发育、恢复正常性激素水平及性腺功能、诱导青春发育启动、维持第二性征、避免精神心理异常、减少心血管危险因素、防止骨质疏松、维持肌肉含量。1.低促性腺激素性性腺功能减退症——14岁以后或骨龄12岁以后无青春期发育可进行青春期诱导；成人脉冲式GnRH泵生精疗效优于hCG/hMG治疗（更接近生理状态）。2.性激素替代治疗（不能改善生育能力）——男性：十一酸睾酮注射液250mg每2~4周肌注1次，或十一酸睾酮胶囊40mg每日2~3次（还有庚酸睾酮、丁酸睾酮），常需终身替代，渐增剂量模拟正常青春发育、避免睾酮升高过快导致痛性勃起；女性：小剂量雌激素3~6个月基础治疗后雌孕激素序贯治疗人工周期。' },
{ m: '31E', q: '性发育异常（DSD）的芝加哥共识分类与46,XY DSD总览？', a: '性发育异常DSD：染色体性别、性腺性别和表型性别不一致的一大类疾病总称。2006年ESPE和LWPES达成芝加哥共识，摒弃雌雄同体、两性畸形、性反转等术语，依据染色体核型分三大类：性染色体DSD（47,XXY克氏综合征及其变异型；45,X Turner综合征及其变异型；45,X/46,XY混合型性腺发育不良；46,XX/46,XY嵌合体）、46,XY DSD、46,XX DSD。\n46,XY DSD：核型46,XY但性腺性别和/或表型性别不匹配；任何影响睾丸分化、睾酮合成或作用的因素都可导致。三大类原因：①睾丸发育异常（性腺发育不良）；②雄激素合成及作用异常；③其他。常见类型与激素特征：\n1.46,XY性腺发育不全GD——性腺分化异常致无功能条索性腺（完全性CGD即Swyer综合征）或功能不良的睾丸（部分性PGD）；发病率约1/20000~1/80000；致病基因SRY、SOX9、NR5A1、WT1、CBX2、DHH、MAP3K1等；胚胎早期睾丸停止发育或条索状性腺→T和AMH分泌障碍→沃夫氏管退化、米勒管发育为子宫输卵管阴道上段、外生殖器男性化不全。CGD（社会性别女性）：出生即完全正常女性外生殖器，青春期多因第二性征发育迟缓、原发或继发闭经就诊，身材正常或高大，乳房不发育，外生殖器幼稚（成人阴蒂<2cm），阴毛腋毛缺如；PGD表型异质性大。激素：LH、FSH均高于正常，T、AMH降低（AMH突变者血清AMH测不到）；超声可见阴道子宫输卵管（子宫一般较小）；诊断核型46,XY+临床+激素+基因。治疗：性别选择、性激素替代、发育不良性腺处理（恶变率随年龄渐增高必要时择期摘除）、必要时外生殖器整形；多学科参与下患儿及监护人共同决策。\n2.睾丸退化综合征TRS——46,XY但睾丸组织完全不存在，活产男婴患病率1/20000，占临床诊断隐睾症患者的3%~20%；病因不明，最可能为生殖血管事件（梗阻或睾丸扭转缺血萎缩），残存组织含铁血黄素沉着、营养不良性钙化支持该假说。表现与退化时间相关：胚胎第8周前退化→外阴完全女性表型有子宫输卵管；第8~10周→不同程度男性化不全；第12周以后→男性表型但常伴小阴茎、阴囊内无睾丸或可触及睾丸残基。激素：血基础LH和FSH升高，血清AMH测不到，基础T降低且hCG激发后无增高（单侧退缩者激素可正常）；睾丸残基活检含铁血黄素沉着、营养不良性钙化的纤维血管结节利于诊断。青春期前诊断较困难（男性表型者不易与隐睾鉴别，女性表型者应与CGD鉴别——CGD肯定有子宫）。\n3.Leydig细胞发育不全LCH——睾丸Leydig细胞LH/hCG受体基因LHCGR失活突变（常隐，30余种突变），胚胎干细胞对胎盘hCG或垂体LH反应不良→Leydig细胞发育不全或数量低下、T生成减少；无米勒管结构可有残留沃夫氏管结构，外生殖器男性化不全。分LCH1型（受体完全失活）和LCH2型（保留部分活性）；1型可正常女性外阴伴盲端阴道（青春期无乳房发育原发闭经就诊），2型表型广泛（小阴茎、隐睾、尿道下裂或仅不育）；青春期无第二性征发育，阴毛分布可正常。激素：血基础LH升高、基础T降低且hCG激发后无增高，AMH、INHB通常正常；睾丸活检仅见Sertoli细胞、Leydig细胞明显减少或缺失。\n4.17β-羟基类固醇脱氢酶3型缺陷症17β-HSD3——常隐，HSD17B3基因（9q22.32，11个外显子）突变，已报道40余种；17β-HSD3选择性在睾丸表达，以NADPH为辅酶催化雄烯二酮AD向T转化，缺陷致AD向T转化障碍→46,XY外生殖器男性化不全；46,XX个体表型基本正常。激素特征：FSH及LH可升高、AD升高、T降低或正常，基础或hCG激发试验后T/AD<0.8为激素诊断主要标准；超声无子宫卵巢回声、有睾丸附睾输精管。若性腺未摘除，39%~64%当作女孩抚养的患者青春期出现进行性男性化（有报道39%~64%经历性别转换）——选女性不建议青春期前切除性腺；生殖细胞恶变率高达28%需定期监测肿瘤标记物及性腺超声。\n5.5α-还原酶2缺乏5α-RD——常隐，SRD5A2基因（2p23）变异（已报道100余种，中国常见c.680G>A具有奠基者效应）；5α-还原酶将T转化为活性更强的DHT，DHT使尿殖窦生殖结节等衍化为阴茎、阴茎尿道、阴囊并刺激前列腺分化。表型谱广泛：社会性别女性者生后女性外阴或阴蒂肥大伴腹股沟/阴唇包块、阴道盲端（青春期原发性闭经、无乳房发育或嗓音变粗等男性化表现就诊）；男性者不同程度男性化不全（小阴茎、尿道下裂、隐睾）；青春期均出现睾丸发育、T分泌增多而男性第二性征发育，但胡须及阴毛腋毛稀少、前列腺发育不良。激素：LH、FSH、T与正常男性相似但DHT明显降低、T/DHT增高——基础或hCG激发后T/DHT>15（北京儿童医院研究T/DHT>15诊断灵敏度和特异度最佳）；超声性腺为睾丸，精囊腺附睾输精管射精管正常。以男性社会性别生存者生活质量更优。\n6.雄激素不敏感综合征AIS——X连锁隐性，雄激素受体AR基因（Xq11~12，8个外显子，约90kb）突变，靶组织对雄激素不敏感（以往称睾丸女性化综合征）；男性患儿中发病率1/99000~1/20000；分完全型CAIS、部分型PAIS、轻型MAIS。CAIS：出生时正常女性外阴伴下1/3盲端阴道、小阴唇发育不良，睾丸在腹腔内或腹股沟（婴幼儿以腹股沟或阴唇肿物就诊，青少年常原发性闭经就诊）；青春期乳房发育可同正常女性但乳头小乳晕无着色，体毛稀少、无阴毛腋毛；激素：T及DHT显著升高（hCG激发后明显升高）、LH可增高，AMH和INHB一般正常；超声性腺为睾丸，无子宫卵巢输卵管等米勒管结构（可伴盲端阴道）；核型46,XY、SRY无异常。PAIS表型多样（女性外阴伴阴蒂肥大，或小阴茎伴尿道下裂阴囊分裂，青春期后不同程度男性化，乳房发育程度与受体不敏感度正相关，有阴毛腋毛但较正常男性少）；MAIS多正常男性表型仅青春期男性乳房发育，可不育。CAIS患儿通常按女孩抚养，性腺恶变率<1%建议20岁后再行性腺切除术；不提倡常规阴道延长手术。\n7.NR5A1基因变异——常显，编码类固醇生成因子SF-1（9q33，461个氨基酸），在肾上腺、性腺及下丘脑腹内侧核表达；约占确诊46,XY DSD的10%~15%。表现：肾上腺功能发育不全（生长发育迟缓、频繁呕吐、皮肤色素沉着甚至原发性肾上腺衰竭）；性腺发育不全（部分性和完全性，最常见类型）。激素：FSH明显升高、LH/FSH比值降低（随年龄增长INHB渐降提示Sertoli细胞功能渐降），应监测肾上腺功能。基因检查是确诊唯一方法。随访显示患者最终均选择男性社会性别且满意度好。\n8.P450氧化还原酶缺乏症PORD——POR基因（7q11.23）缺陷，POR是电子供体传递NADPH电子给P450c17、P450c21、芳香化酶P450arom等→不同程度糖皮质激素、盐皮质激素和性激素合成障碍；属CAH特殊类型（21-羟化酶和17α-羟化酶联合缺陷）；伴Antley-Bixler综合征样骨骼畸形（颅缝早闭、前额突出、短头畸形、面中部发育不良、后鼻孔闭锁或狭窄、鼻梁扁平、梨形鼻、高腭弓、低耳位、外耳道狭窄传导性听力损失、脊柱侧弯、新生儿骨折、长骨弯曲、短趾等）及母孕期男性化（痤疮多毛面部肿胀声音低沉）；46,XY及46,XX均可出现性发育异常。激素：ACTH高、皮质醇正常或降低、ACTH激发后皮质醇反应不良，孕烯醇酮孕酮进一步升高。诊断：伴特征性面容骨骼畸形+21-羟化酶和17α-羟化酶联合缺陷+性激素合成障碍应考虑PORD，基因检测确诊。\n9.米勒管永存综合征PMDS——存在米勒管结构（子宫和输卵管）或退化不全，而核型正常男性、外生殖器表型男性；AMH基因（19p13.3）或AMHR基因（12q13）变异（Ⅰ型/Ⅱ型，15%病因未明）；约85%为男性常隐遗传。多因单侧或双侧隐睾、腹股沟疝或不育就诊，体内有输卵管和子宫；成人测AMH有助诊断（AMH变异者难以测出、AMHR变异者AMH增高）；外科手术是唯一有效治疗（残留米勒管结构处理有争议——主张积极者建议子宫全切+双侧输卵管切除防恶变，亦有主张尽量避免伤害性手术防损伤睾丸血运精索）。' },
{ m: '31E', q: '46,XX DSD与芳香化酶缺乏症、男性乳房发育的要点？', a: '46,XX DSD：核型46,XX但表型为非典型女性或性腺为非卵巢；病因：①性腺（卵巢）发育异常（卵睾型、睾丸型、卵巢发育不全）；②雄激素过量（胎儿、胎盘或母亲来源——主要病因，性腺为卵巢、有正常米勒管发育成输卵管子宫阴道、沃夫氏管退化，但外生殖器不同程度男性化）；③泄殖腔外翻、阴道闭锁、其他综合征。卵睾型DSD：同一机体内同时并存卵巢和睾丸两种性腺组织；分三型——片侧型（一侧卵巢常位于左侧、另一侧睾丸，约占30%）、双侧型（双侧均卵睾，约20%）、单侧型（一侧卵睾另一侧单一性腺，约50%）；卵巢常位于正常解剖位，睾丸或卵睾可位于睾丸下降路径上任一点（最常见右侧腹股沟区，常并发腹股沟斜疝）；核型多数46,XX（约70%），46,XX/46,XY嵌合约20%，46,XY约10%；内外生殖器分化主要取决于性腺组织形态、功能和疾病发生孕周，青春期第二性征发育程度取决于优势性腺功能。诊断依赖明确性腺性质——性腺探查或活检证实同时存在睾丸组织及卵巢组织是诊断必要条件，46,XX/46,XY嵌合核型强烈提示诊断；一般性激素水平减低和促性腺激素增高无诊断特异性。\n芳香化酶缺乏症：CYP19A1基因（15q21.2）变异所致罕见先天性雌激素缺乏综合征（已30余例46,XX报道，40余种变异）；芳香化酶是雌激素合成关键酶，将AD、T和16α-羟雄烯二酮分别转换为E₁、E₂和雌三醇E₃；雌激素促进骨骼成熟、维持骨密度、促进女性第二性征发育、调节糖脂代谢。孕期胎儿芳香化酶缺乏→胎盘雌激素合成受阻→母亲及胎儿暴露大量雄激素：母亲孕期痤疮、多毛、嗓音变粗等男性化表现，胎儿出生时外生殖器不同程度男性化。女性：出生时外生殖器男性化（女性外阴伴阴蒂肥大到男性外阴伴尿道下裂甚至正常男性外阴），青春期乳房不发育或发育不良、原发或继发闭经，部分青春期出现男性化、成年身材高大；FSH持续升高过度刺激卵巢易复发性卵巢囊肿。男性患者很难诊断（出生时多无异常，正常进入青春期，但多见青春期和骨龄延迟、身材高大肥胖、胰岛素抵抗、宦官体型，成年可小睾丸、精子生成障碍不育、骨折骨质疏松）。激素：FSH显著升高为最显著特征，LH升高或正常，T正常或升高，青春期E低，青春期前hMG激发试验后E₂无明显升高；骨龄延迟、骨密度减低。诊断主要标准——遗传学发现CYP19A1纯合或复合杂合致病变异。治疗：外阴整形术（早期诊断有助女性性别选择）、雌激素替代（促进骨骼成熟骨融合、维持骨密度、缓解卵巢囊肿促进子宫卵巢发育促进第二性征）、对症治疗骨质疏松和胰岛素抵抗等。\n男性青春期乳房发育：男性乳腺组织良性增生致一侧或两侧乳腺增大（儿童期青春期男性乳腺组织直径>0.5cm即可被临床检查发现），非常普遍可见于新生儿期、青春期、老年期。病理生理：雄激素和雌激素相对不平衡——雌激素绝对或相对升高、游离雄激素合成减少、循环浓度下降及活性减弱、乳腺组织对正常水平雌激素敏感性增高。病因：大多数无明确病因；性腺功能减退和雄激素不敏感（Klinefelter综合征；感染化疗外伤致睾丸功能异常，多伴男性乳房发育）；雌激素增高（性腺外组织对雌激素前体芳香化作用增强——肥胖症、肝病、甲亢）；药物（雄激素、合成类固醇、雌激素、hCG、酮康唑、洋地黄、抑制睾酮合成药物）；家族性（X连锁隐性或常显，Peutz-Jeghers综合征和芳香化酶过剩综合征）。诊断：区分真性男性乳房发育与假性女性型乳房（仰卧位双手置头后，拇指示指放乳房底部缓慢合拢——假性者合拢过程无抵抗感，真性者可触及同心圆状、质地较韧橡胶感组织，可有触痛）。治疗：大多不需特殊治疗，多数1年内自然缓解；乳房直径>4cm、增长快速、压痛疼痛明显或严重心理负担可尽早药物治疗（发现乳房增大12个月内开始最好，时间久腺体被纤维组织替代效果欠佳）——雌激素受体阻断剂为首选（他莫昔芬首选10mg/次每日2次；雷洛昔芬、氯米芬），芳香化酶抑制剂（睾内酯、安那曲唑、来曲唑）临床试验中，达那唑100~200mg/次每日2次；外科指征——慢性乳腺炎、药物治疗失败、增大持续>1年、巨乳症或严重心理疾病（尽量青春期结束后手术减少复发）。警惕肿瘤风险：Klinefelter乳腺癌风险为正常人10~20倍，隐睾史患儿睾丸癌发病率增加，Peutz-Jeghers可合并胃肠道及非胃肠道肿瘤。' },
{ m: '31F', q: '1型糖尿病（T1DM）的流行病学、病因机制与病理生理？', a: '流行病学：发病率受种族遗传、地区、季节、饮食及年龄性别影响，世界不同国家地区种族有数十倍差异——大洋洲、北欧、北美较高（最高芬兰白人62.5/10万人年），亚洲很低（日本约2/10万人，上海3.1/10万人，北京3.26/10万人）；WHO Diamond研究我国0~15岁平均确定发病率0.59/10万人年，是世界上已报道发病率最低的国家之一。全球发病率每年3%~5%速度上升，每年约10万名15岁以下儿童发生；2006年后增长迅速且5岁以下增加比例更大。发病年龄呈双峰分布（4~6岁和10~14岁）；年长青少年中男性高于女性（性别差异），其他年龄无明显性别差异；发病有季节性（高峰冬季，可能与感染、日照有关）。家族聚集性：同卵双胎患病风险约36%，同胞20岁之前约4%、60岁之前约9.6%，无家族史个体仅0.4%。\n病因与发病机制：显著特征是胰岛β细胞数量显著减少和消失致胰岛素分泌显著下降或缺失；Eisenbarth提出自然病程6阶段——遗传易感→环境诱发→胰岛自身免疫激活→胰岛功能损伤→临床糖尿病→胰岛功能衰竭致胰岛素依赖。1.遗传因素——多基因病，GWAS发现60多个相关变异，HLA基因承担约50%遗传风险（HLA-DQ A52位精氨酸+DQB57位非门冬氨酸为易感基因；DQA52位非精氨酸和DQB57位门冬氨酸为保护性——种族国家差异主因）；其他易感性基因：CTLA-4、IL2RA、INS。2.环境因素——病毒感染（先天性风疹、肠道病毒尤其柯萨奇B病毒——主要通过改变免疫状态而非直接侵入胰岛）、饮食（牛奶、谷物纤维、牛奶中的胰岛素、维生素D或omega-3缺乏）、卫生环境洁净假说（清洁环境感染机会少→免疫紊乱机会多）。3.免疫因素——致病性T细胞和调节性T细胞失衡，针对多种胰岛自身抗原的自身反应性T细胞产生并攻击β细胞，胰岛功能逐渐丧失，血糖失代偿后临床发病；胰岛细胞自身免疫和β细胞功能损害发生在诊断前几个月到几年，约90%患者初诊时血中自身抗体阳性——ICA（胰岛细胞抗体）、IAA（胰岛素自身抗体）、GADA（谷氨酸脱羧酶抗体）、IA-2A（蛋白酪氨酸磷酸酶抗体）、ZnT8（锌转运子8）抗体，还有Hsp90抗体、CPH抗体；可合并抗甲状腺抗体、抗肾上腺皮质抗体（自身免疫性多内分泌腺综合征）。\n病理生理：胰岛素绝对缺乏，进餐后无胰岛素分泌高峰，餐后血糖持续升高，血糖超过肾糖阈从尿中排出→渗透性利尿→多尿多饮；脂肪动员分解代谢增加、酮体产生增多→高酮体血症；体内能量丢失体重下降；反调节激素（胰高血糖素、肾上腺素、糖皮质激素、GH）增多进一步加重代谢紊乱、高血糖高血脂高酮体血症，伴脱水、电解质紊乱、血浆渗透压增高→意识障碍甚至昏迷；酮症酸中毒时CO₂潴留、呼吸中枢兴奋→不规则深快呼吸（Kussmaul呼吸），呼气烂水果味。' },
{ m: '31F', q: 'T1DM的临床表现、诊断与鉴别（表31-9）？', a: '临床表现：起病较急，多数因感染、饮食不当诱发起病；三多一少——多尿、多饮、易饥多食、体重减轻；婴幼儿多饮多尿不易发觉而很快发展为脱水及酮症酸中毒；学龄儿童可夜间遗尿；多食并非必有症状（部分食欲正常或减低），体重减轻很快消瘦乏力精神萎靡；可突然恶心呕吐厌食腹痛（考虑DKA可能尽早诊断）；各种感染发热咳嗽外阴炎或结核病等可与糖尿病共存。体格检查一般除消瘦外无阳性体征；合并脱水及DKA时不规则深长呼吸、酮味，严重时神志改变。病程长控制不良者发育落后、身材矮小、肝大和智能落后（糖尿病侏儒）；晚期慢性并发症：白内障、视力障碍及视网膜病变、蛋白尿、高血压、糖尿病肾病甚至失明和肾衰。\n实验室检查：①血电解质、血糖、血酮体、血脂、血气分析、尿糖尿酮体、空腹胰岛素C肽及HbA1c；②OGTT一般不需做（已明确诊断者必要时用馒头餐试验评价β细胞分泌功能——100g面粉馒头相当75g葡萄糖，10岁以下75g、10岁以上100g，测餐前及餐后血糖胰岛素C肽，T1DM患者释放曲线明显低于正常）；③胰岛自身抗体（ICA、IAA、GADA、IA-2A、ZnT8-Ab）是诊断自身免疫性T1DM关键指标，对预测、诊断及与T2DM鉴别有意义；④确诊后筛查甲状腺激素及甲状腺自身抗体、ACTH、Cor及PTH（T1DM常并发其他自身免疫病）。\n诊断：临床特征——发病年龄常在1岁以上，糖尿病症状明显，多以酮症或酮症酸中毒起病，空腹或餐后血清C肽明显降低，出现自身免疫标记，需终身依赖胰岛素维持生命。对发病年龄<1岁（尤其<6月龄）、或有35岁以内发病糖尿病家族史、或仅有空腹血糖轻度增高（5.5~8.5mmol/L）、伴神经性耳聋视神经萎缩或综合征特征（线粒体疾病）者应基因检测排除单基因糖尿病。鉴别：①其他疾病——糖尿（一过性糖尿、肾性糖尿及非葡萄糖糖尿如半乳糖血症、果糖不耐受症，血糖正常）；多饮多尿（与尿崩症鉴别——尿比重低且尿糖阴性）；多食消瘦（与甲亢鉴别）；②1型/2型/单基因糖尿病鉴别（表31-9）——1型：多基因、发病>6个月至1岁、急性迅速发病、自身免疫性、酮症常见、肥胖同一般人群、无黑棘皮、占儿童糖尿病通常90%、家族史80%；2型：多基因、通常青春期或更迟、隐匿到严重不等、非自身免疫、酮症不常见、肥胖常见、有黑棘皮、多数国家<10%、家族史90%；单基因：单基因、通常青春期后除GCK突变和新生儿糖尿病（NDM<6~12个月）、差异较大、非自身免疫、NDM常见酮症、肥胖同一般人群、无黑棘皮、占比1%~9%、家族史<10%。' },
{ m: '31F', q: 'T1DM的胰岛素治疗（剂量、方案、调整、胰岛素泵）？', a: '治疗目的：降低血糖消除症状，预防并延缓急慢性并发症，保证正常生长发育和性成熟，防止和及时纠正情绪障碍。综合治疗——饮食、运动、胰岛素、心理治疗及糖尿病教育监测，需家长患儿积极参与。\n胰岛素类型与作用时间（表31-10）：超速效类似物——开始0.1~0.2h、高峰1~3h、维持3~5h；速效类似物——0.15~0.35h、1~3h、3~5h；短效——0.5~1h、2~4h、5~8h；中效——2~4h、4~12h、12~24h；甘精胰岛素——2~4h、8~12h、22~24h；地特胰岛素——1~2h、4~7h、20~24h；德谷胰岛素——0.5~1.5h、最小峰值、>42h。超速效及速效提供餐时胰岛素，长效提供基础胰岛素。\n剂量：初始一般0.5~1.0IU/(kg·d)；年龄小用量偏小0.25~0.5IU/(kg·d)，青春发育前期偏大0.7~1.0IU/(kg·d)，青春期常>1.0IU/(kg·d)甚至达2.0IU/(kg·d)；蜜月期适当应用有助于保护β细胞功能，用量常<0.5IU/(kg·d)，一般不主张完全停药。\n方案：①一日2次短中效混合——短中效比例1:2或1:3分两次于早餐及晚餐前20~30分钟注射，早餐前2/3量、晚餐前1/3量；②一日3次——早餐前短+中效混合剂，午餐前单用短效，晚餐短+中效混合剂或其他类似方案；③一日4次——每餐前短效（可用速效类似物替代，但应在餐前15分钟或餐后立即注射），睡前中效或长效；④基础-餐时方案——总量40%~60%由基础胰岛素提供（长效胰岛素睡前或分2次早晚注射），餐时胰岛素为速效或短效，目前认为最符合生理性分泌模式，是强化治疗方案。\n剂量调整：根据三餐前后、餐后2小时和夜间血糖，每次增减1~2U。短中效混合：①早餐前高血糖→增加晚餐前或睡前中效；②午餐前或后高血糖→增加早餐前中效或午餐前短效；③晚餐前高血糖→增加早餐前中效或午餐前短效；④早餐或晚餐后高血糖→增加该餐前短效。基础-餐时方案：餐前水平达标表明基础量合适；餐后2小时达标表明前一餐胰岛素量合适；高于目标表明餐前胰岛素不足需加量，反之减量。\n胰岛素泵CSII：1993年DCCT报告为T1DM强化治疗措施之一；全天总量40%~60%作基础量余量分3次餐前大剂量；24小时分日间（6am~10pm）和夜间（10pm~6am）两时段，基础量按2:1分配；根据血糖监测酌情调整（三餐前血糖高增基础量，餐后血糖高增餐前大剂量）；是模拟生理性分泌的最好选择，短期治疗改善血糖、降低HbA1c、减少低血糖、改善生活质量；但近期研究显示长期CSII与常规注射疗效差异不大——CSII只是实施工具不是根治手段，仍需经常严格监测、定期复查、良好依从性及严格饮食管理。' },
{ m: '31F', q: 'T1DM的医学营养治疗（MNT）与运动治疗要点？', a: '医学营养治疗MNT目标：供给营养充足平衡膳食，保证正常生长和青春期发育需要，能与同龄儿童一样参加活动；维持血糖和HbA1c达标，防止DKA和低血糖，防止延缓并发症；实现理想血脂脂蛋白水平，维持正常血压；合理安排三餐，调配多样化饮食。\n总热量：全日摄入能量=1000+年龄×系数（系数100~70）kcal——<3岁按100、3~6岁按90、7~10岁按80、>10岁按70，再根据营养情况、体力活动量及应激状况调整个体化；体重变化作判断能量出入是否平衡的实用参考（营养过剩以降低摄入增加消耗，营养不良增加能量蛋白质摄入促正氮平衡）。\n热量分配：全天分3餐3点心；三餐分配1/5、2/5、2/5或1/3、1/3、1/3；每餐预留15~20g食品作餐后点心。应用胰岛素时注意定时定量进餐，进正餐和加餐时间与胰岛素注射时间及作用时间配合。\n营养素分配：碳水化合物占55%~55%（不应低于每日必需量否则严重影响生长发育），蔗糖每日不超过总能量10%；脂肪25%~35%——推荐单不饱和脂肪酸占10%~20%，限制饱和脂肪酸、胆固醇及反式脂肪酸（不超过供能比10%）；蛋白质15%~20%——3岁以下2g/(kg·d)、3~10岁1g/(kg·d)、青春期0.8~0.9g/(kg·d)，保证优质蛋白，出现微量白蛋白尿和肾病者减至0.8g/(kg·d)但须保证正常生长发育；膳食纤维延缓碳水化合物消化吸收、改善糖脂代谢，推荐14g/1000kcal（≥1岁）每日最低（年龄+5）g，多食可溶性纤维的蔬菜水果豆薯全谷；食盐每日高限6g；维生素除营养评价明显缺乏外不主张额外补充。不适宜食品：肥肉、油炸食品、糖果、含糖饮料、含糖高水果、粉丝粉条凉粉等；正确对待无糖食品（有一定热量，食用后减去相应主食）。饮食管理方法：食物交换份法（我国广泛应用）；碳水化合物计数法步骤简单（只管含碳水化合物食物），广泛用于基础-餐时方案和胰岛素泵治疗，将食物摄入量与血糖水平、胰岛素剂量建立关联。\n运动治疗：1.益处——提高周围组织对胰岛素敏感性，降低血糖血脂血液黏稠度；增强体质改善心肺功能；有氧运动改变机体组分（减脂肪增肌肉骨骼）；有利于慢性并发症预防控制；带来自信心生活乐趣。2.运动处方——无统一标准，据年龄体型体力运动习惯爱好个体化；运动前评估，心肺功能异常或严重高血压、血糖>14mmol/L、反复低血糖或血糖波动大、有DKA等需在专家指导下运动或避免剧烈运动。①强度——ADA建议每天至少30分钟中等强度有氧运动（脉搏达最大心率50%~70%），每日累计60~90分钟更好；②时间频率——餐后1.5小时进行防低血糖，运动前后5~10分钟热身，每次至少持续20分钟（取得健康效应的最短时间）；③方式——快走、慢跑、骑车、游泳、登山、爬楼梯、羽毛球乒乓球等，力量运动与柔韧性训练相结合。3.注意事项——运动前后加强血糖监测；运动前血糖<7mmol/L摄入10~20g碳水化合物，7~10mmol/L有氧运动前无需摄入，10.1~14mmol/L无氧及有氧运动前均不需摄入（选快速吸收碳水化合物）；运动量大或时间长注意增加碳水化合物摄入或减少胰岛素剂量防低血糖；运动后1~2小时适当补充吸收慢的碳水化合物和蛋白质防迟发低血糖；晚餐后或晚间大量运动后睡前摄入含脂肪蛋白加餐防夜间低血糖；注意合适服装鞋袜和运动后清洁卫生；定时定量运动，与定时定量注射胰岛素和进餐同样重要（三定原则）。' },
{ m: '31F', q: 'T1DM的监测指标（血糖、HbA1c、GA、酮体）与低血糖处理？', a: '监测指标：1.血糖监测——DCCT指出恰当血糖控制只能通过频繁精确监测达到；新诊断患儿微量血糖仪每天监测餐前、餐后2小时及睡前7次，必要时夜间监测；达标后调整至2~4次/d；2018年ISPAD指南控制目标：餐前4~7mmol/L、餐后2小时5~10mmol/L、睡前4.4~7.8mmol/L。持续葡萄糖监测CGMS提供全天血糖动态变化，可监测无症状低血糖高血糖、了解异常波动持续时间，弥补指尖血糖和HbA1c局限；与CSII联合称双C治疗。2.HbA1c——葡萄糖与血红蛋白非酶性结合产物，反映近2~3个月平均血糖，评估长期血糖控制及慢性并发症风险；儿童青少年目标个体化，一般不发生严重频繁低血糖情况下HbA1c<7.0%为达标，每3个月检测1次（ISPAD餐前4.0~7.0、餐后5.0~10.0、睡前4.4~7.8、夜间4.5~9.0、HbA1c<7.0；ADA餐前5.0~7.2、餐后5.0~8.3、HbA1c<7.5）。3.糖化清蛋白GA——葡萄糖与清蛋白非酶糖化产物，半衰期17~19天，反映过去2~3周平均血糖，评价更短时期血糖控制及药物疗效；与空腹血糖关系更密切，HbA1c临界值时GA更敏感；GA与T1DM血糖峰值相关（HbA1c与T2DM平均血糖相关），评价血糖偏移时GA更好。4.血、尿酮体——微量血酮体（β-羟丁酸）测定对DKA诊断和治疗监测更直接及时；酮体组成β-羟丁酸78%、乙酰乙酸20%、丙酮2%；尿酮体只能检测乙酰乙酸和丙酮（反映几小时前血酮体水平）；应监测酮体的情况——伴发热和/或呕吐的疾病期间、持续血糖≥14mmol/L、持续多尿伴血糖升高（尤其腹痛或呼吸加快时）；血酮体>3.0mmol/L高度提示酸中毒可能。5.门诊随访——至少每2~3个月专科复查，携带病情记录本；每次测身高体重血压及常规检查；病程5年以上及青春期患者每年查血脂、尿微量白蛋白、眼底及自主神经病变；每年监测甲状腺功能（T3、T4、TSH和甲状腺抗体）及其他自身免疫抗体。\n低血糖：1.发生原因——胰岛素用量过多、影响吸收因素（注射部位、吸收速率变化）、注射后未按时按量进餐、运动前未加餐、蜜月期减量不及时。2.临床表现——焦虑、出汗、颤抖、心悸、饥饿感、头晕，严重时低血糖昏迷甚至惊厥；反复发作可脑功能障碍、智力倒退或癫痫；警惕无感知性低血糖（感觉低血糖症状能力下降或缺失——血糖降至3.6mmol/L以下仍无法感知，很快从感觉良好变为精神恍惚或意识丧失；与低血糖相关自主神经功能缺陷有关，可导致葡萄糖拮抗循环；小心避免低血糖后肾上腺素应答能力可恢复，病程长者只能部分恢复）。3.严重度分级（2019年ADA）——1级血糖<3.9但≥3.0mmol/L；2级<3.0mmol/L（开始出现神经症状需立即处理）；3级与严重认知功能障碍相关（需他人援助）。4.治疗——1或2级：即刻口服快速吸收单糖10~15g（葡萄糖或蔗糖块、甜饮料）；3级：肌注或皮下注射胰高糖素（<12岁或<25kg给0.5mg；>12岁或>25kg给1.0mg），必要时静注10%葡萄糖2~4ml/kg；治疗10~15分钟后复测血糖确保升至4~5mmol/L，否则重复治疗。' },
{ m: '31F', q: '糖尿病酮症酸中毒（DKA）的诱因、表现、诊断标准与治疗？', a: '诱因：新发糖尿病患儿初诊时易合并DKA（年龄小、诊断延迟是高危因素）；已诊断患儿急性感染、过量进食、有意或无意遗漏胰岛素注射、长期胰岛素不足致复发。\n临床表现：常先口渴多尿，伴恶心呕吐，有时以腹痛为突出症状被误诊急腹症；严重者精神状态改变（烦躁、嗜睡、意识障碍甚至昏迷）；呼吸急促深大（Kussmaul呼吸），呼气酮味（烂水果味）；中重度脱水（口唇干裂皮肤干燥短期体重下降，严重时血压下降）；伴严重感染可感染性休克。提高警惕的情况：不明原因昏迷；顽固性脱水酸中毒难纠正；呕吐腹痛伴呼吸深长呼出气烂水果味；已能控制排尿的小儿反复遗尿；食欲下降乏力原因不明；反复皮肤尿路感染不能用其他原因解释——及时查血糖尿糖及酮体；尿糖尿酮体增高同时血糖升高，无论既往有无糖尿病史均应考虑DKA。\n诊断标准：任意血糖>11.1mmol/L；血间隙AG=[K⁺+Na⁺]-[Cl⁻+HCO₃⁻]增高（正常8~16）；血酮体和/或尿酮体阳性。分度——轻度pH 7.2~7.3、HCO₃⁻<15mmol/L；中度pH 7.1~7.2、HCO₃⁻<10mmol/L；重度pH<7.1、HCO₃⁻<5mmol/L。\n治疗（目的：纠正酸中毒酮体转阴；纠正脱水；恢复血糖接近正常；监测治疗并发症；识别处理突发事件；全程守护严密观察——每小时查尿糖尿酮体及末梢血糖（血糖降至15mmol/L缩短监测频率），每2~4小时复查电解质、葡萄糖、BUN、钙镁磷酸盐、血酮体及血气至酸中毒恢复）：1.补液——诊断确定立即开放静脉通道，补液应在胰岛素治疗之前。①复苏补液——脱水无休克者立即0.9%生理盐水扩容，通常30~60分钟内注入10ml/kg（组织灌注不良可更快如15~30分钟，必要时重复）；休克者尽快输注20ml/kg等渗盐水（10~20分钟内），第1小时一般不超过40~60ml/kg；复苏优先晶体液，随后0.45%~0.9%盐水或平衡盐溶液；②序贯补液——总量=累积丢失量+维持量（含口服）；累积丢失量=估计脱水百分数×体重kg×1000ml；维持量体重法（<10kg 80ml/kg、10~20kg 70、~30kg 60、~50kg 50、>50kg 35）或体表面积法（每日1200~1500ml/m²，年龄越小每平方米越多）；快速补液——累积丢失量一半在8~10小时输注，余一半14~16小时，同时给生理需要量；缓慢补液——48小时均匀补充；轻度DKA可口服补液；③成分——累积丢失量用0.45%~0.9%盐水+氯化钾；张力据脱水、血钠和血浆渗透压调整（低血钠或血糖下降血钠不升则增加钠浓度）；不呕吐即尽早口服补液。2.胰岛素——补液开始1小时后开始给予（休克基本纠正后才可用）。①静脉小剂量短效胰岛素——开始0.1U/(kg·h)，0.9%氯化钠稀释，每小时监测血糖渐调减慢，速度一般不低于0.05IU/(kg·h)；血糖下降速度一般2~5mmol/(L·h)，维持血糖8~12mmol/L为宜；②皮下注射——轻度DKA无法持续静输时可每小时或每2小时皮下注射速效类似物（赖脯或门冬胰岛素）：初始0.3IU/kg，1~2小时后改每小时0.1IU/kg或每2小时0.2IU/kg，酮体纠正后改常规方案；③停用指征——血糖降至11.1mmol/L（200mg/dl）以下且酮体消失、血pH>7.3、HCO₃⁻≥15mmol/L、β-羟丁酸<1mmol/L可停止持续静滴；停输前15~30分钟（速效）或1~2小时（常规胰岛素）皮下注射胰岛素，夜间鼓励中长效胰岛素时重叠时间更长，静输速率逐渐减停。3.补钾——DKA钾缺失约3~6mmol/kg，丢失主要来自细胞内（高渗跨膜转移、酸中毒、胰岛素缺乏致糖原分解蛋白水解）；呕吐渗透性利尿丢失；容量减少继发醛固酮增多+胰岛素类似醛固酮作用致尿钾排泄增加；酸中毒时钾由细胞内移至细胞外可造成血钾正常假象，纠正酸中毒尤其应用胰岛素后血钾迅速转入细胞内——无论血清钾浓度如何都需要补钾；低钾血症者初始扩容时和胰岛素治疗之前开始补钾，无低钾者初始扩容后与胰岛素一起补充，高钾血症者待有尿液排出后开始补钾；起始补钾浓度40mmol/L，随后据血钾调整，可口服部分补充。4.含糖液——血糖下降至14mmol/L（250mg/dl）时加用含糖液（浓度最高不超过12.5%），维持血糖8~12mmol/L为宜。5.碱性液——严格掌握指征（不恰当应用可加重中枢酸中毒组织缺氧、加重低钾、改变钙离子浓度）；一般经补液和胰岛素治疗促进有机酸排泄和酮体转化为内源性HCO₃⁻使酸中毒纠正；仅高钾血症或异常严重酸中毒时考虑——5%NaHCO₃ 1~2ml/kg以注射用水稀释成1.4%等张液后1小时以上缓慢输入，避免脑水肿。6.磷的补充——DKA渗透性利尿致低磷血症，红细胞内2,3-二磷酸甘油酸合成不足组织缺氧、乳酸堆积多器官受影响；监测血磷，严重者口服磷酸盐合剂（注意低血钙）。7.消除诱因——有效抗生素积极控制感染。' },
{ m: '31F', q: 'DKA并发症——脑水肿与糖尿病高血糖高渗状态（HHS）的要点？', a: '脑水肿：DKA最常见严重并发症，明显临床脑水肿发生率0.5%~0.9%，死亡率可达21%~24%。少数可在治疗之前发生，最常发生在补液治疗第1个24小时之内（特别是治疗后4~12小时、血糖下降、脱水酸中毒等一般状况改善时）。1.病因——不十分清楚，可能机制为脱水酸中毒性水肿和血管性水肿；机体长时间高渗、抗利尿激素不适当释放及脑细胞对钠渗透性异常增加等导致脑水肿进一步加重。2.危险因素——新发糖尿病、年龄<5岁、症状期血渗透压降低过快、治疗期间血清钠上升速率减慢或早期校正钠下降、血糖浓度下降过快；重度酸中毒或低碳酸血症；血清尿素氮升高、最初4小时内输液量过大、不适当碳酸氢钠治疗。3.临床表现——开始DKA治疗后头痛发作或治疗前头痛治疗后加重；不适当的心率减慢；反复呕吐；意识状态变化（躁动烦躁嗜睡意识错乱大小便失禁）或特定神经体征（脑神经麻痹、瞳孔反射异常）；血压上升；氧饱和度降低；血清钠浓度迅速升高。4.诊断——症状体征变异度大；一项诊断标准/两项主要标准/或一项主要+两项次要标准可临床诊断（敏感性92%、特异性96%），不需神经影像学检查。诊断标准：对疼痛刺激反应异常、无运动或言语反应；去皮层或去大脑强直；脑神经麻痹（尤其Ⅲ、Ⅳ、Ⅵ）；神经源性呼吸异常（叹气样、长吸式呼吸、呼噜、呼吸急促、潮式呼吸、呼吸暂停）。主要指标：意识障碍/意识水平不稳定；持续心率减慢（入睡后 also）；与年龄不一致的尿便失禁。次要指标：呕吐头痛；嗜睡难于唤醒；舒张压>90mmHg；年龄<5岁。5.治疗——一旦怀疑立即治疗，边脱边补、快脱慢补的输液原则（保证维持正常血压避免低血压影响脑灌注，同时避免过多输液）；抬高头部；20%甘露醇2.5~5ml/kg 10~15分钟输入，每2~4小时1次；甘露醇无效伴低钠血症者给3%氯化钠2.5~5ml/kg 10~15分钟输入；必要时呼吸支持转ICU；病情无好转时头颅CT除外其他颅内因素。\n糖尿病高血糖高渗状态HHS：体内胰岛素相对缺乏使血糖升高，进一步引起脱水最终导致严重高渗状态；病死率高。北京儿童医院单中心研究发现几乎无单独HHS存在，均与DKA混合存在（DKA-HHS），更常见于≥10岁患儿；DKA-HHS较单纯DKA代谢紊乱、脱水及酸中毒程度更严重，肾功能异常率更高。临床表现：起病隐匿，一般从开始发病到出现意识障碍需1~2周（偶尔急性起病）；常先多饮多尿乏力等糖尿病症状，病情逐渐加重出现典型症状。' },
{ m: '31F', q: '2型糖尿病（T2DM）的流行病学、病因机制与临床特点？', a: '流行病学：我国儿童糖尿病中T1DM约占89.6%、T2DM约占7.4%；儿童T2DM国际呈流行趋势并有超越T1DM传统模式的趋势，国际糖尿病联盟预测10年内某些种族儿童T2DM比例将超过T1DM；1995—2010年国内儿童T2DM住院疾病构成比从4.1/10万升至10/10万；济南8~16岁调查患病率0.26%。\n病因与发病机制：显著病理生理特征是胰岛β细胞功能缺陷致胰岛素分泌减少（或相对减少）或胰岛素抵抗致胰岛素调控葡萄糖代谢能力下降或两者共同存在；遗传易感性与环境因素共同作用，胰岛素加工受损、胰岛淀粉样多肽IAPP均参与。危险因素：种族、糖尿病家族史、肥胖、青春期、低出生体重及妊娠糖尿病母亲所生后代。1.遗传因素——明显家族种族聚集性，同卵双生子一致性高于T1DM，一级二级亲属T2DM发病率高达74%~100%；妊娠糖尿病母亲所生小儿易发生肥胖和T2DM；母亲孕期血糖偏高与小儿出生体重增加及日后糖尿病发生相关；胰岛素敏感性有种族差异（美国黑人青少年较白人低30%）。2.环境因素——生活方式西化和饮食结构改变，高热量饮食摄入和体力活动减少，热量失衡致超重肥胖增加（患病率急剧上升的根本原因）。3.肥胖——高危肥胖儿童高胰岛素血症和IR在IGT发生前至少10年已存在，内脏脂肪含量直接与高胰岛素血症相关、与胰岛素敏感性负相关；BMI是糖尿病发生的独立危险因素（BMI为正常1.85倍时发生T2DM比率明显上升）；肥胖可致外周靶组织细胞膜胰岛素受体数量减少维持血糖正常最终导致β细胞功能衰竭；肥胖儿童发生IGT与黑棘皮病有统计学意义（是肥胖不伴黑棘皮者的5.56倍）——黑棘皮病是肥胖儿童IGT高危因素和可靠IR皮肤标志（胰岛素与表皮胰岛素样生长因子-1受体结合刺激表皮细胞增殖角化促黑色素颗粒沉着，可能与成纤维细胞生长因子受体-3基因突变有关）。4.青春期——青春期发育导致IR加重，高胰岛素正常血糖钳夹试验显示青春期葡萄糖处理率平均下降30%；GH分泌增加是青春期IR主要原因（性激素作用不明显）；T2DM好发年龄多在10岁以后恰好是青春发育阶段。5.低出生体重——SGA日后发生T2DM概率明显高于AGA（台湾研究足月SGA危险性为AGA的2.91倍）；胎儿期婴儿早期营养供给不足使胰岛发育及功能不可逆损害，成年后暴露高营养状态诱发β细胞衰竭和IR（节俭基因表现型假说）。\n病理自然病程（Weir分4阶段）：①代偿期——β细胞数量增多代偿IR，分泌足够胰岛素维持正常血糖；②轻度失代偿期——β细胞数量不能再增加，血糖开始轻度升高，空腹血糖达6.4mmol/L时葡萄糖诱导的β细胞第一时相胰岛素分泌消失；③严重失代偿期——胰岛素合成能力下降血糖继续升高达糖尿病诊断水平，β细胞对精氨酸等非糖刺激物的分泌反应亦受损；④伴结构破坏的失代偿期。胰高血糖素过高对胰岛素不足时的糖代谢紊乱起更重要作用。\n临床特点：1.肥胖是重要标志——85%儿童T2DM诊断时超重或肥胖（注意既往肥胖病史，有时诊断前数月至1年体重下降掩盖原有肥胖）；儿童肥胖增加致新诊断T1DM也有30%合并肥胖。2.家族遗传倾向——45%~80%患者父亲或母亲一方患T2DM，74%~100%一级或二级亲属有T2DM，往往儿童确诊后其父母亲属DM才被发现。3.临床表现常无典型三多一少，没有或仅轻度多饮多尿、轻微消瘦或体重无变化，往往偶然发现尿糖或血糖增高；约6% 10~19岁患者起病时可发生DKA（多与感染、应激或应用糖皮质激素、非典型抗精神病药有关），无应激感染情况下也可发生；需警惕这些患者。4.代谢综合征——常伴黑棘皮病、多囊卵巢综合征、脂代谢紊乱和高血压；≥10岁MS定义：向心性肥胖（腰围≥同年龄同性别P90为基本必备条件）同时具备至少2项——高血糖（IFG空腹≥5.6mmol/L；或IGT 7.8≤OGTT 2h<11.1mmol/L；或T2DM）、高血压（收缩压或舒张压≥同年龄同性别P95）、低HDL-C（<1.03mmol/L）或高non-HDL-C（≥3.76mmol/L）、高TG（≥1.47mmol/L）。' },
{ m: '31F', q: 'T2DM的诊断（OGTT、C肽切点）、鉴别与治疗？', a: '实验室检查：基本同T1DM；OGTT或馒头餐试验同步测胰岛素C肽有助鉴别T1DM和T2DM、评价胰岛素抵抗及评估潜在糖耐量异常（用于伴肥胖黑棘皮病、T2DM家族史、高危种族的肥胖儿童及多囊卵巢女孩）。方法：禁食8~12小时；口服无水葡萄糖（<2岁2.25g/kg、>2岁1.75g/kg，最大75g）每克加水4ml最大300ml 5分钟内服完，年长儿可服馒头（2.3g/kg生面粉最多100g 10分钟吃完），服糖前及服糖后120分钟取血测血糖胰岛素C肽（必要时0、30、60、120、180分钟）。结果判断：①正常人服糖后30~60分钟胰岛素分泌达高峰可为空腹5倍以上，120~180分钟基本恢复空腹水平；②儿童青少年T2DM空腹C肽平均2.8ng/ml而T1DM仅0.5ng/ml——切点值1.0ng/ml（AUC 0.902，敏感性85.7%、特异性78.6%）；③T2DM主要异常为胰岛素分泌第一时相消失和高峰延迟；④IR患者空腹胰岛素明显增高，服糖后30~60分钟高峰可明显高于正常，120~180分钟仍不能恢复空腹水平呈持续高胰岛素分泌；稳态模型HOMA-IR=FPG(mmol/L)×FINS(mIU/L)/22.5。\n诊断：两步——先肯定糖尿病诊断再分型。有T2DM家族史（尤其母亲）、合并胰岛素抵抗的其他疾病（黑棘皮病、PCOS等）常并发高血压血脂异常者结合临床及实验室诊断不困难；注意发生DKA不能排除T2DM。T1DM与T2DM特定病程中胰岛素和C肽水平可部分重叠（蜜月期T1DM C肽可正常；急性高血糖时高血糖毒性可使T2DM C肽相对低），早期分型困难时引导家长患儿把重点放在控制血糖上，通过治疗反应和追踪观察重新评估分型。\n鉴别：①与T1DM鉴别——鉴别肥胖T1DM与酮症起病的T2DM单凭临床困难，可联合检测胰岛自身抗体、胰岛功能检查（Siraj标准：基础C肽≥0.2nmol/L且6分钟胰高血糖素刺激后C肽≥0.32nmol/L为区分标准）；暂不能鉴别先按T1DM治疗，每1~2年实验室重新评价；注意T2DM血清可检出ICA和GADA（美国青少年T2DM研究中检出率8.1%和30.3%，付勇报告8.1%和19.4%）——存在ICA和GADA并不能除外T2DM；②与单基因糖尿病鉴别——MODY、线粒体基因突变糖尿病、NDM等，基因检测有助明确。\n治疗：以生活方式干预为主，医疗机构、家庭、学校、社会工作者多学科联合管理，减轻体重和增加运动量是基础。1.治疗目的——改善生活方式和整个家庭的行为；正常发育、体重达同龄同性别标准；增加运动能力；血糖正常化（空腹3.9~7.0mmol/L、餐后2小时<8.0mmol/L、HbA1c<7%）；控制并发疾病（血脂异常、高血压、脂肪肝）；防止大小血管并发症；教会自我血糖监测。2.MNT——目的降低体重减少IR延缓β细胞衰竭；超重肥胖者严格控制热量（减轻体重7%~10%；超重10%~20%者热量是健康同龄儿90%，超重20%以上者65%~80%）；脂肪<30%、饱和脂肪酸<7%、胆固醇<200mg/d、避免反式脂肪酸；其他原则同T1DM。3.运动——每周至少5天30~60分钟以上中等至剧烈有氧运动，每周3天以上强化肌肉骨骼运动；脉率达最大心率60%~75%（脉率=(220-年龄)×60%~75%）；心肺功能异常、严重高血压、严重高血糖代谢不稳定者专家指导下运动或避免剧烈运动；每天看电视时间（非学习性）限制2小时内。4.药物——①二甲双胍：最新方案是一经确诊即在生活方式干预同时接受二甲双胍治疗，FDA批准用于10岁以上；改善胰岛素敏感性、增加胰岛素受体数目及酪氨酸激酶活性、增加基础糖无氧酵解、抑制肠道葡萄糖吸收、减少肝糖输出、促进葡萄糖转运子向细胞膜转位；不增加体重、不刺激胰岛素分泌、少有低血糖危险、使TG和LDL-C下降；随机双盲试验证实治疗儿童青少年T2DM安全有效；初始病情稳定首选——开始250mg每日两次，3~4天耐受后增至250mg每日3次，随后3~4周渐增，最大1000mg每日两次；病情严重者需胰岛素强化治疗1~2周后加用，血糖稳定2~6周后逐渐转成完全用二甲双胍（减量中血糖明显上升则放慢），部分患者需二甲双胍+每日1次长效胰岛素联合；肝肾功能异常或心肺功能不全、严重感染者禁用，常见不良反应胃肠功能紊乱（数周自然缓解）；②胰岛素——2020年ADA建议伴酮症或DKA、或不能明确区分T1DM/T2DM、或随机血糖≥13.9mmol/L或HbA1c≥8.5%时应开始胰岛素治疗；新诊断早期胰岛素强化可显著缓解高糖毒性、恢复第一时相分泌、获较长无需药物的血糖稳定期；基础胰岛素是个体化治疗基石；③GLP-1受体激动剂（利拉鲁肽、艾塞那肽）——葡萄糖浓度依赖地促胰岛素分泌并减少胰高糖素分泌，2019年6月FDA批准利拉鲁肽用于10岁以上；④SGLT2抑制剂（卡格列净）——抑制近端肾小管SGLT2减少葡萄糖重吸收、降低肾糖阈增加尿糖排泄，国内2018年获批儿童青少年Ⅲ期临床研究实施中；⑤高血压血脂异常药物治疗——均在生活方式及MNT基础上：血压≥P90经6个月治疗仍≥P90开始ACEI或ARB；≥P95者确诊高血压后即应用；MNT 6个月以上LDL-C仍>3.38mmol/L给予他汀类（理想目标<2.6mmol/L）；TG>4.7mmol/L（空腹）或11.6mmol/L（非空腹）可考虑贝特类防胰腺炎。5.筛查与预防——2020年ADA糖尿病前期概念：IFG（空腹5.6~6.9）、IGT（OGTT 2h 7.8~11.0）、HbA1c 5.7%~6.4%；筛查对象——进入青春期或年龄≥10岁、超重肥胖（BMI≥P95）伴≥1项危险因素（母亲患糖尿病或妊娠糖尿病；一级二级亲属T2DM家族史；高危种族；IR征象——黑棘皮病、高血压、血脂异常、PCOS、SGA）；指标空腹血糖、OGTT 2h血糖、HbA1c三者等效；初次正常每3年筛查1次，BMI渐升者缩短间隔；预防——大庆研究、美国DPP证实健康教育及生活方式干预可成功预防延缓（每日减少400~500千卡、每天中等量运动30分钟、减重5%~7%可降低风险50%以上；芬兰IGT干预4年饮食运动组T2DM危险较对照减少58%）；儿童肥胖是产生T2DM和MS的土壤，防治应从胎儿期开始幼儿期加强，以控制体重为基本理念、行为矫正为关键。' },
{ m: '31F', q: '特殊类型糖尿病（8类）与MODY、新生儿糖尿病、线粒体糖尿病要点？', a: '按2018年ISPAD修订的病因学分类共8类：1.单基因糖尿病（MODY 1~14、新生儿糖尿病NDM、线粒体糖尿病）；2.遗传性胰岛素作用缺陷（INSR基因突变——A型胰岛素抵抗、Donohue综合征、Rabson-Mendenhall综合征）；3.脂肪营养不良性糖尿病（80%先天性全身性脂肪代谢障碍Berardinelli-Seip综合征由AGPAT2或BSCL基因纯合变异致，多常隐；LMNA、PPARG和PIK3R1基因SHORT综合征杂合变异也可引起）；4.胰腺外分泌疾病（胰腺炎、创伤/胰腺切除术后、胰腺肿瘤、胰腺囊性纤维化、血色病）；5.内分泌疾病（肢端肥大症、库欣综合征、胰高血糖素瘤、嗜铬细胞瘤、甲亢、生长抑素瘤）；6.药物或化学品所致（糖皮质激素、生长激素、甲状腺激素、烟酸、二氮嗪、苯妥英钠、噻嗪类利尿剂、β肾上腺素能激动剂）；7.感染（先天性风疹、巨细胞病毒、肠道病毒感染）；8.免疫介导罕见类型（胰岛素受体抗体、APS）；9.其他相关遗传综合征（Down、Klinefelter、Turner、Wolfram、Friedreich共济失调、强直性肌营养不良、卟啉病、Prader-Willi）。\n临床特征：发病年龄小（越早与遗传关系越大，NDM多<6个月提示严重遗传缺陷）；遗传特征（明显家族聚集）；特殊体征（脂肪萎缩、生长发育障碍、肌张力低、性腺发育落后、尿崩症、神经性耳聋）；伴严重IR（与肥胖程度不符的显著黑棘皮征、空腹胰岛素和/或OGTT后胰岛素异常增高——提示胰岛素受体抗体、受体基因突变等）；合并疾病表现（库欣、甲亢、胰腺炎等原发病表现）。分子诊断是金标准；2018年ISPAD共识推荐分子遗传学检测的临床信息：①发病年龄<6月龄；②胰岛自身抗体阴性的6个月~1岁发病；③亲属或父母有糖尿病史，患儿无典型1型（抗体阴性、诊断5年不需要或仅少量胰岛素、C肽>200pmol/L）和2型（肥胖黑棘皮）特征；④空腹血糖轻度非进展性增高（5.5~8.5mmol/L）特别是非肥胖者；⑤伴神经性耳聋、视神经萎缩或综合征特征（线粒体疾病），或胰腺发育不良、胰腺外表现如肾囊肿。\nMODY：最常见单基因糖尿病，占30岁以下诊断糖尿病的1%~6%；常显遗传，已知14个亚型；最多见MODY3（HNF-1α突变）、MODY2（GCK突变）、MODY1（HNF-4α突变）。MODY2：出生即空腹血糖轻度升高，HbA1c正常高限或轻度升高，一般不引起并发症，胰岛素或口服药不能降低血糖/HbA1c，不需特殊治疗（生活方式干预）；MODY1与MODY3：进行性高血糖，均对小剂量磺脲类敏感；MODY5（HNF-1β突变）推荐胰岛素治疗（伴肾脏病变——囊性肾发育不良等）。\n新生儿糖尿病NDM：出生后6个月内出现的罕见单基因糖尿病（部分6个月~1岁发病），发病率1/500000~1/260000；已发现23种亚型（6q24区印迹异常及22个基因突变）。分暂时性TNDM和永久性PNDM各约50%。TNDM：6q24区印迹区域基因变异或甲基化异常最常见（PLAGL1和HYMAI变异），3种分子机制——6号染色体父系单亲二倍体、6q24区父系重复、母亲等位基因低甲基化；常表现为严重宫内发育迟缓、高血糖出现早，伴先天发育异常畸形、中枢神经肾脏缺陷；小剂量胰岛素治疗平均3个月左右缓解（最晚18个月），约50%~60%青春期前后复发（复发后表现类似T2DM）。PNDM：多为出生时小于胎龄儿、诊断年龄稍大，常出现酮症或DKA；最常见致病基因KCNJ11（KATP通道Kir6.2亚单位）、ABCC8（SUR1亚单位）及INS；KCNJ11/ABCC8激活突变时KATP通道对ATP/ADP变化不敏感、葡萄糖刺激下通道无法正常关闭、细胞持续超极化、Ca²⁺无法内流、胰岛素无法正常释放；INS突变致胰岛素原错误折叠聚集内质网、内质网应激和β细胞凋亡；无缓解期需终身治疗；约90%的KCNJ11和ABCC8突变所致PNDM可用磺脲类（低血糖风险小），其余类型需胰岛素。所有6个月内发病NDM均建议基因检测。\n线粒体糖尿病：mtDNA突变致母系遗传，常伴神经性耳聋；最常见突变是线粒体tRNA亮氨酸基因3243位点鸟嘌呤取代腺嘌呤（tRNALeu(UUR) 3243A→G）；β细胞非免疫性进行性损伤；临床表现异质性大（急性起病伴或不伴DKA或缓慢隐匿起病），绝大部分体型正常或消瘦，60%伴不同程度听力障碍（随年龄进行性加重），可有神经肌肉、心肌、视网膜病变合并症；早期可对口服降糖药有反应，随病程延长β细胞功能进行性衰退需依赖胰岛素。' },
{ m: '31F', q: '低血糖的诊断标准、病因分类、临床表现与诊断流程？', a: '低血糖：儿童特别是新生儿和婴幼儿时期最常见的代谢紊乱；反复发作或持续性低血糖可致不可逆脑功能损害、生长发育迟缓、智商低下甚至死亡。诊断标准（多数学者）：新生儿生后24小时内血糖<2.2mmol/L（<40mg/dl），24小时后<2.2~2.8mmol/L（40~50mg/dl）（不需考虑出生体重和孕龄）；较大婴儿和年长儿一般采用血糖<2.8mmol/L。诊断需具备Whipple三联症——血浆葡萄糖浓度减低；与低血糖有关的临床症状；纠正低血糖后相应症状即获改善。\n病因分类（表31-16九类）：1.新生儿暂时性低血糖（基质或酶活性不足——早产儿、SGA、正常新生儿；暂时性高胰岛素血症——糖尿病母亲婴儿、SGA、围产期窒息、新生儿RH溶血）；2.高胰岛素性低血糖症（单基因型先天性高胰岛素血症CHI；综合征型高胰岛素血症；药物导致；胰岛素瘤；胰岛素自身免疫综合征）；3.内分泌激素缺乏即升糖激素缺乏（GH缺乏、ACTH缺乏、胰高血糖素缺乏、先天性甲减、原发肾上腺皮质功能减退）；4.基质限制性（酮症性低血糖；药物性——水杨酸、普萘洛尔、降糖药、化疗药、复方磺胺甲唑；酒精）；5.糖原分解和糖异生障碍（糖原合成酶缺陷、糖原贮积症ⅠⅢⅤⅨ型、半乳糖血症、遗传性果糖不耐受、果糖-1,6-二磷酸酶缺陷、丙酮酸羧化酶缺陷）；6.氨基酸有机酸代谢尿素循环障碍（枫糖尿症、丙酸血症、甲基丙二酸血症、遗传性酪氨酸血症、3-羟-3-甲基戊二酸尿症）；7.脂肪酸氧化障碍（肉毒碱缺乏症、肉毒碱酰基转移酶缺乏、HMG-CoA还原酶缺陷、CPT-1/CPT-2缺陷、极长链长链中链短链乙酰CoA脱氢酶缺陷）；8.肝病（瑞氏综合征、肝炎、肝硬化、肝肿瘤）；9.全身性疾病（菌血症、肿瘤、营养不良、肾衰、胰岛素受体抗体病、术后烧伤心衰腹泻休克、恶性疟疾、荔枝病）。\n临床表现与血糖下降程度、持续时间及机体反应性有关；新生儿幼儿不能可靠表达症状，识别需反复测血浆葡萄糖。1.急性低血糖——血糖急剧下降，交感神经兴奋释放肾上腺素过多：神经紧张烦躁不安易受刺激；面色苍白心慌手足颤抖及饥饿感；多汗软弱无力伴恶心呕吐腹痛；严重者突发惊厥昏迷。2.慢性低血糖——血糖缓慢下降或长期持续，主要表现于较大儿童；脑葡萄糖利用减少以脑功能障碍为主：头痛视力障碍乏力、表情淡漠或抑郁、不安易激动、语言思维障碍注意力不集中、意识模糊智能降低、嗜睡反应迟钝、性格行为改变、癫痫样发作意识丧失甚至永久性神经损伤；血糖下降过快持久时两种综合征可同时出现；常呈阵发性发作，功能性的轻易自行逆转，器质性的重、频繁不易逆转。3.新生儿小婴儿特点——常缺乏症状甚至完全无症状易被忽略，症状非特异性常被伴随疾病掩盖：反应差、喂养困难、阵发性发绀、呼吸困难呼吸暂停、嗜睡惊厥、突发短暂性肌阵挛或面色苍白低体温。\n诊断方法：详细询问病史（低血糖发生年龄时间发作情况诱因）；细致体检寻找病因线索；低血糖发作时及时检测血糖、胰岛素、酮体、丙氨酸、乳酸、血脂和尿酸；必要时胰高血糖素刺激试验和输入丙氨酸甘油后血糖反应；临床无急性发作时可禁食24~36小时诱发；疑内分泌腺功能障碍查相关激素；疑酶缺乏测酶活性。诊断流程（图31-8）：低血糖时测β羟丁酸、游离脂肪酸、血气、乳酸——无酸中毒：β羟丁酸降低+游离脂肪酸降低→高胰岛素血症性低血糖症；β羟丁酸降低+乳酸升高→新生儿垂体功能减退、GHD、肾上腺皮质功能减退；有酸中毒：β羟丁酸升高+游离脂肪酸升高→酮症性低血糖；β羟丁酸升高伴脂肪酸氧化障碍特征→脂肪酸氧化功能障碍；另有糖异生障碍、糖原分解障碍、暂时性新生儿低血糖。' },
{ m: '31F', q: '先天性高胰岛素血症（CHI）与特发性酮症性低血糖（IKH）的要点？', a: '先天性高胰岛素血症CHI：高胰岛素血症性低血糖症HH是胰岛β细胞过量分泌胰岛素或分泌失调所致以顽固低血糖为主要表现的一组疾病，分三类——先天性高胰岛素血症CHI（单基因形式）、类先天性高胰岛素血症性低血糖症（HH-mimickers）、后天获得性HH（倾倒综合征、胰岛素瘤、胰岛素自身免疫综合征Hirata病、药物诱导等）。CHI致病基因：①ATP敏感钾通道KATP——ABCC8（11p15.1，编码SUR1）和KCNJ11（11p15.1，编码Kir6.2），常隐/常显/LOH；②谷氨酸脱氢酶GLUD1（10q23.3，常显）；③葡糖激酶GCK（7p13，常显）；④3-羟基丁酰CoA脱氢酶SCHAD（4q25，常隐）；⑤线粒体解偶联蛋白2 UCP2（11q13.4，常显）；⑥HNF4A（20q13.12）、HNF1A（12q24.31）、HK1（10q22.1）、MCT1、FOXA2等。综合征型HH——Beckwith-Wiedemann综合征（IGF2/H19/CDKN1C/KCNQ1，11p15.4）、Kabuki综合征（KMT2D/KDM6A）、Turner综合征（KDM6A单倍型剂量不足）、先天性糖基化障碍（PMM2/MPI/PGM1）、Sotos综合征（NSD1）、Costello综合征（HRAS）、Timothy综合征（CACNA1C）等。发病机制：正常儿童血糖稳态受神经、基质和激素调节（升糖激素分急性——胰高血糖素、儿茶酚胺；慢性——GH、皮质醇，统称反调节激素；胰岛素是体内唯一降糖激素）；β细胞膜电位维持依赖Na⁺-K⁺-ATP酶和保持开放的KATP通道（由SUR1和Kir6.2构成），通道关闭造成细胞膜去极化→Ca²⁺通道开放→Ca²⁺内流促使胰岛素释放；KATP开闭与细胞内ATP/ADP比值有关，任何造成通道关闭的因素均可致胰岛素过度分泌。诊断：实验室检查应在低血糖时进行——血糖<2.8mmol/L时游离脂肪酸<1.5mmol/L、β羟丁酸<2mmol/L、血浆胰岛素>1μU/ml、C肽可检测到、胰高血糖素刺激试验阳性（血浆葡萄糖升高>1.7mmol/L）可考虑HH；胰岛素半衰期仅6分钟可能错过峰值，同时测游离脂肪酸和β羟丁酸有助诊断。治疗目标维持血糖3.9mmol/L以上：①急诊——意识清楚可进食给含葡萄糖10~20g食物（200ml牛奶后进食碳水化合物）；意识状态改变静注葡萄糖：首剂10%葡萄糖2ml/kg 5分钟内推注，继以10%葡萄糖持续静滴糖速4~6mg/(kg·min)起始；新生儿小婴儿维持正常血糖所需糖浓度>12.5%需中心静脉置管或脐静脉插管防渗透压过高脑水肿脑室出血；无静脉通路者胰高糖素0.01~0.03mg/kg最大1mg（或<25kg 0.5mg、≥25kg 1mg肌注）；②饮食——高碳水化合物饮食增加喂养频率可配生玉米淀粉；GLUD1和SCHAD突变者限制蛋白质摄入；③药物——首选二氮嗪起始5~15mg/(kg·d)分2~3次口服（常与氢氯噻嗪7~10mg/(kg·d)分2次配合，均作用于β细胞SUR1受体使KATP保持开放并减轻水钠潴留；有效指征——停用药物和静注葡萄糖5天后正常喂养下空腹餐前餐后血糖均>3.9mmol/L；副作用多毛症、水钠潴留、中性粒细胞减少、肺动脉高压、反常低血糖）；生长抑素类似物奥曲肽5~35μg/(kg·d)分3~4次皮下注射（不良反应呕吐腹泻、新生儿坏死性小肠结肠炎、胆石症）；胰高血糖素0.5~1mg皮下或1~10μg/(kg·h)持续输注（多形性红斑、呕吐、肝损害）；硝苯地平、西罗莫司；④手术——局灶病变可手术切除病灶（18F-DOPA-PET是术前定位金标准，特异性100%、敏感性88%~94%）；弥漫病灶药物无效可胰腺大部切除。预后：中枢损伤严重程度取决于低血糖持续时间及有无伴随症状（特别是惊厥）；及早发现并纠正可改善预后，部分患儿随年龄增长血糖逐渐恢复正常甚至停药。\n特发性酮症性低血糖IKH：幼儿和儿童低血糖最常见病因，多于18个月~5岁起病，8~9岁自然缓解。发病机制：部分患儿伴血丙氨酸水平降低——输入丙氨酸250mg/kg后血糖明显升高，认为实际是低丙氨酸血症（肌蛋白分解代谢生成丙氨酸作为糖异生基质，丙氨酸是唯一生糖氨基酸，肌肉组织减少时易发生）；患儿血中儿茶酚胺水平降低提示低血糖时儿茶酚胺拮抗机制障碍。临床表现：体格较瘦小肌肉含量低，常为SGA并有暂时性新生儿低血糖病史；发作多于清晨早餐前，常有发作前运动过多、进食减少或晚餐未进食，次晨难以唤醒甚至惊厥；患病伴呕吐进食减少时易发生。诊断：禁食12~24小时后出现低血糖，伴酮血症及酮尿症，血丙氨酸水平降低，血乳酸丙酮酸基本正常，血胰岛素降低、升糖激素水平增加、对胰高血糖素反应正常；无特定内分泌或代谢缺陷，彻底排除常见低血糖相关疾病后才能诊断；肾上腺功能不全、GSD 0/Ⅴ/Ⅸ、果糖-1,6-二磷酸酶缺乏和MCADD所致低血糖伴酮症易误诊为IKH。治疗：勿长时间空腹、睡前加餐、高蛋白高碳水化合物饮食；经常监测尿酮体——尿酮阳性预示数小时后将发生低血糖，应给高碳水化合物饮食防发作，必要时静注葡萄糖纠正。' },
];
