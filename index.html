<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学抽认卡 · 记忆曲线自测（抗菌药物 + 新生儿疾病 + 变态反应性疾病）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2a43 0%, #1a4a6e 100%);
    min-height: 100vh; color: #eaf2f8;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- 顶部 ---------- */
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 24px; letter-spacing: 1px; }
  header p { color: #9fb8cc; font-size: 13px; margin-top: 6px; }

  .panel {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 20px;
  }

  /* ---------- 设置页 ---------- */
  .setup h2 { font-size: 16px; margin: 14px 0 10px; color: #8fd0ff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,0.05); color: #cfe3f2; user-select: none;
    transition: all .15s;
  }
  .chip:hover { background: rgba(255,255,255,0.14); }
  .chip.on { background: #2f81c9; border-color: #2f81c9; color: #fff; }
  .modes { display: flex; gap: 10px; }
  .mode-btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #cfe3f2; cursor: pointer; font-size: 15px;
  }
  .mode-btn.on { background: #2f81c9; border-color: #2f81c9; color: #fff; }
  .start-btn {
    width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(90deg, #2f81c9, #35a7ff); color: #fff;
    font-size: 17px; font-weight: 600; cursor: pointer; letter-spacing: 2px;
  }
  .start-btn:hover { filter: brightness(1.1); }
  .stat-line { margin-top: 16px; font-size: 12px; color: #9fb8cc; text-align: center; }

  /* ---------- 卡片页 ---------- */
  .quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: #9fb8cc; }
  .progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #35a7ff, #6fe3a5); width: 0; transition: width .25s; }

  .card-wrap { perspective: 1200px; margin-bottom: 18px; }
  .card {
    position: relative; width: 100%; min-height: 340px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .45s;
  }
  .card.flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; padding: 26px;
    display: flex; flex-direction: column;
  }
  .face.front { background: #ffffff; color: #17324a; }
  .face.back { background: #f2f9ff; color: #17324a; transform: rotateY(180deg); }
  .tag {
    align-self: flex-start; font-size: 12px; color: #fff;
    border-radius: 6px; padding: 3px 10px; margin-bottom: 16px;
  }
  .q-text { font-size: 20px; font-weight: 600; line-height: 1.6; flex: 1; display: flex; align-items: center; }
  .a-text { font-size: 15px; line-height: 1.8; flex: 1; white-space: pre-wrap; overflow-y: auto; }
  .hint { text-align: center; font-size: 12px; color: #7d94a8; margin-top: 10px; }

  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn-no  { background: #e2574c; color: #fff; }
  .btn-yes { background: #35b06f; color: #fff; }
  .btn-skip{ background: rgba(255,255,255,0.15); color: #cfe3f2; }
  .btn-hard { background: #e8a33d; color: #fff; }
  .btn-good { background: #35b06f; color: #fff; }
  .btn-easy { background: #2f9fd0; color: #fff; }
  .srs-info { display:flex; justify-content:space-between; font-size:12px; color:#9fb8cc; margin:-8px 0 12px; }
  .srs-info b { color:#8fd0ff; }
  .due-line { color:#e8a33d; }
  .quit { margin-top: 14px; width: 100%; background: none; border: none; color: #7d94a8; cursor: pointer; font-size: 13px; }

  /* ---------- 结果页 ---------- */
  .result h2 { font-size: 22px; text-align: center; margin-bottom: 8px; }
  .score { text-align: center; font-size: 42px; font-weight: 700; color: #6fe3a5; margin: 10px 0; }
  .weak { margin-top: 18px; }
  .weak h3 { font-size: 15px; color: #8fd0ff; margin-bottom: 10px; }
  .weak-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .again-btn {
    width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 12px;
    background: #2f81c9; color: #fff; font-size: 16px; cursor: pointer;
  }
  .hidden { display: none !important; }
  kbd {
    background: rgba(255,255,255,0.15); border-radius: 4px; padding: 1px 6px;
    font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📇 医学抽认卡 · 记忆曲线自测</h1>
    <p>儿童抗菌药物 + 诸福棠《实用儿科学》第14章 · 支持 Anki 式间隔重复复习</p>
  </header>

  <!-- 设置 -->
  <section id="setup" class="panel setup">
    <h2>① 选择模块</h2>
    <div class="chips" id="moduleChips"></div>
    <h2>② 抽卡方式</h2>
    <div class="modes">
      <button class="mode-btn on" data-mode="seq">顺序抽卡</button>
      <button class="mode-btn" data-mode="shuffle">随机打乱</button>
      <button class="mode-btn" data-mode="weak">只练错题</button>
      <button class="mode-btn" data-mode="srs">📅 记忆曲线复习</button>
    </div>
    <button class="start-btn" id="startBtn">开始自测</button>
    <p class="stat-line" id="statLine"></p>
    <p class="stat-line">快捷键：<kbd>空格</kbd> 翻面 · <kbd>←</kbd> 不会 · <kbd>→</kbd> 会 · <kbd>↓</kbd> 跳过 ｜ 复习模式：<kbd>1</kbd>重来 <kbd>2</kbd>困难 <kbd>3</kbd>良好 <kbd>4</kbd>简单</p>
  </section>

  <!-- 抽卡 -->
  <section id="quiz" class="hidden">
    <div class="quiz-head">
      <span id="counter"></span>
      <span id="moduleName"></span>
      <span id="knowCount"></span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="srs-info hidden" id="srsInfo"><span id="srsDueInfo"></span><b id="srsStreak"></b></div>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="face front">
          <span class="tag" id="tagFront"></span>
          <div class="q-text" id="qText"></div>
          <div class="hint">点击卡片翻面查看答案</div>
        </div>
        <div class="face back">
          <span class="tag" id="tagBack"></span>
          <div class="a-text" id="aText"></div>
        </div>
      </div>
    </div>
    <div class="actions" id="freeActions">
      <button class="btn-no" id="btnNo">✗ 还不会</button>
      <button class="btn-skip" id="btnSkip">跳过</button>
      <button class="btn-yes" id="btnYes">✓ 已掌握</button>
    </div>
    <div class="actions hidden" id="srsActions">
      <button class="btn-no" id="gAgain">重来</button>
      <button class="btn-hard" id="gHard">困难</button>
      <button class="btn-good" id="gGood">良好</button>
      <button class="btn-easy" id="gEasy">简单</button>
    </div>
    <button class="quit" id="quitBtn">← 返回选择模块</button>
  </section>

  <!-- 结果 -->
  <section id="result" class="panel result hidden">
    <h2>本轮完成 🎉</h2>
    <div class="score" id="scoreText"></div>
    <p style="text-align:center;color:#9fb8cc;font-size:13px" id="resultSub"></p>
    <p style="text-align:center;color:#e8a33d;font-size:13px; margin-top:6px" id="resultNext"></p>
    <div class="weak" id="weakBox">
      <h3>薄弱模块（建议用"只练错题"重刷）</h3>
      <div id="weakList"></div>
    </div>
    <button class="again-btn" id="againBtn">再来一轮</button>
  </section>
</div>


<script>
// 卡片数据：基于《儿童经验性抗菌药物选用流程图》整理
// m = 模块标签, q = 问题(正面), a = 答案(背面)
const MODULES = [
  { id: '00', name: '总览与四步评估', color: '#1e5a8a' },
  { id: '01', name: '常见病原速查', color: '#3d5a6c' },
  { id: '02', name: '呼吸道与头颈部', color: '#2a6f97' },
  { id: '03', name: '重症全身四大感染', color: '#c0392b' },
  { id: '04', name: '肠道·皮肤·链球菌·出疹', color: '#2e7d32' },
  { id: '05', name: '特殊病原四大卡', color: '#6a3d9a' },
  { id: '06', name: '真菌·寄生虫·院内·TORCH', color: '#00695c' },
  { id: '07', name: '药敏判读S/I/R', color: '#37474f' },
  { id: '08', name: '耐药菌升级路径', color: '#455a64' },
  { id: '09', name: '用药注意与缩写', color: '#8e6e2e' },
];

const CARDS = [
  // ===== 模块 00 总览与四步评估 =====
  { m: '00', q: '经验性抗菌治疗前必须评估的五个要素？', a: '① 感染部位 ② 年龄 ③ 严重度 ④ 耐药风险 ⑤ 过敏史\n\n口诀："部、年、重、耐、敏"' },
  { m: '00', q: '给药时间底线：脓毒性休克？其他重症？', a: '脓毒性休克 1 h 内给药；其他重症 3 h 内给药。' },
  { m: '00', q: '按年龄分层的常见病原？', a: '新生儿：GBS / 李斯特菌 / 大肠埃希菌\n1–3 月：李斯特菌 + SP\n婴幼儿/学龄前：SP / Hi / MC / SA\n学龄 ≥5 岁：SP / 支原体 / 病毒' },
  { m: '00', q: '哪些情况提示耐药风险，经验用药如何应对？', a: '院内感染 / 免疫抑制 / 近期广谱抗菌药暴露\n→ 经验方案需抗铜绿假单胞菌 + 覆盖 MRSA / ESBL。' },
  { m: '00', q: 'β-内酰胺过敏的患者如何处理？', a: '按感染部位替换药物（详见各部位卡片，如大环内酯、克林霉素、万古霉素等）。' },
  { m: '00', q: '经验治疗后何时、如何调整方案？', a: '48–72 h 依据病原学与药敏结果"降阶梯"目标治疗；持续发热 48–72 h → 复查培养 + 评估耐药 / 深部灶 / 非感染因素。' },

  // ===== 模块 01 常见病原速查 =====
  { m: '01', q: '血流感染/脓毒症：新生儿 vs 婴幼儿 vs 学龄+ 的常见病原？', a: '新生儿：GBS、大肠埃希菌、李斯特菌、凝固酶阴性葡萄球菌（导管相关）\n婴幼儿：SP、脑膜炎球菌、Hi b、金葡菌\n学龄+：SP、脑膜炎球菌、金葡菌、沙门菌' },
  { m: '01', q: 'CAP 病原随年龄如何变化？', a: '新生儿：GBS / 大肠埃希菌 / 李斯特菌 / 病毒·CMV\n1–3 月：病毒、SP、沙眼衣原体\n3 月–5 岁：病毒、SP、Hi、支原体\n>5 岁：支原体、SP、病毒' },
  { m: '01', q: '泌尿系感染（UTI）的主要病原？什么情况下警惕 ESBL？', a: '大肠埃希菌约 80%，另有克雷伯菌属、肠球菌、奇异变形杆菌；新生儿加凝固酶阴性葡萄球菌。\n反复感染 / 泌尿系结构异常 → 警惕 ESBL 菌株。' },
  { m: '01', q: '腹腔/阑尾炎的常见病原？穿孔时有何不同？', a: '大肠埃希菌、脆弱拟杆菌等厌氧菌、肠球菌、链球菌。\n穿孔性：多菌混合，必须覆盖厌氧菌。' },
  { m: '01', q: '骨关节感染的常见病原（各年龄段）？', a: '金葡菌（50–80%）、A 组链球菌、SP、Hi；<3 岁加金氏菌；镰状细胞病（镰状细胞贫血）患儿：沙门菌、金葡菌。' },
  { m: '01', q: '感染性心内膜炎：天然瓣膜 vs 人工瓣膜/导管的病原？', a: '天然瓣膜：草绿色链球菌、金葡菌、肠球菌。\n人工瓣膜 / 导管：凝固酶阴性葡萄球菌、金葡菌。' },

  // ===== 模块 02 呼吸道与头颈部 =====
  { m: '02', q: '门诊 CAP 一线用药及疗程？', a: '阿莫西林 80–90 mg/(kg·d)（4 月龄–5 岁一线）；过敏→阿奇霉素/克拉霉素；疑早期金葡菌→口服头孢地尼。\n疗程 5–7 天（热退后 2–3 天）。' },
  { m: '02', q: '住院 CAP 经验方案？疑支原体时？', a: '阿莫西林/克拉维酸，或头孢呋辛/头孢曲松/头孢噻肟；疑支原体 → + 大环内酯类。\n疗程 7–10 天（支原体 10–14 天）。' },
  { m: '02', q: '重症 CAP / 坏死性肺炎如何选药？', a: '头孢曲松/头孢噻肟（未完全免疫/高耐药/脓胸）；坏死性肺炎/肺脓肿 → 备选万古霉素或利奈唑胺。\n疗程 10–14 天；坏死性肺炎 2–4 周。' },
  { m: '02', q: '肺炎链球菌（SP）敏感 vs 耐药/重症分别用什么？', a: '敏感 → 青霉素 G / 阿莫西林；\n耐药/重症 → 头孢曲松、万古霉素。\n疗程：肺炎 5–7 天，脑膜炎 10–14 天。' },
  { m: '02', q: '流感嗜血杆菌（Hi）感染首选？什么情况下选头孢曲松？', a: '阿莫西林克拉维酸 / 头孢曲松（Hi b 重症、脑膜炎、会厌炎）。\n疗程：肺炎 7–10 天。' },
  { m: '02', q: '中耳炎经验用药与升级条件？', a: '阿莫西林 80–90 mg/(kg·d)（≥2 岁轻症可观察 48–72h）；48–72h 无效/复发 → 阿莫西林克拉维酸 90/6.4。\n疗程：<2 岁 10 天；≥2 岁轻症 5–7 天；复发 10 天。' },
  { m: '02', q: '鼻窦炎与扁桃体炎（GAS 确诊）的用药？', a: '鼻窦炎：阿莫西林克拉维酸 45/6.4–90/6.4 mg/(kg·d)，10–14 天。\nGAS 扁桃体炎：青霉素 V / 阿莫西林 50 mg/(kg·d)，10 天（阿奇 5 天）。' },
  { m: '02', q: '咽后脓肿 / 扁周脓肿 / 颌下间隙（Ludwig 咽峡炎）经验方案？', a: '咽后脓肿：氨苄西林舒巴坦，或头孢曲松 + 克林霉素（覆盖 GAS/金葡/厌氧）。\n扁周脓肿：青霉素 + 甲硝唑，或克林霉素 ± 穿刺/切开引流。\nLudwig 咽峡炎/颌下间隙：大剂量青霉素/氨苄西林舒巴坦 + 克林霉素，急诊气道管理。' },
  { m: '02', q: '中耳炎出现哪些并发症表现需立即处理？', a: '乳突炎/扁周脓肿/眶蜂窝织炎 → 头孢曲松（±克林霉素），请耳鼻喉科 ± 引流。\n警示：气道梗阻征象（喘鸣/流涎/颈部强直/张口受限）→ 紧急影像 + 耳鼻喉/外科会诊，勿拖延。' },

  // ===== 模块 03 重症全身四大感染 =====
  { m: '03', q: '脓毒症/脓毒性休克 1 h 内的广谱经验方案？', a: '头孢曲松/头孢噻肟，或舒普深/哌拉西林他唑巴坦/头孢吡肟/美罗培南。\n疗程 7–10 天（降钙素原指导）。' },
  { m: '03', q: '脓毒症什么情况下加万古霉素？何时降阶梯？', a: 'MRSA 风险（导管/皮肤灶/定植史）→ + 万古霉素。\n48–72 h 依血培养降阶梯目标治疗；革兰阴性→覆盖铜绿的 β-内酰胺；持续发热 48–72h → 复查培养。' },
  { m: '03', q: '新生儿中枢神经系统感染的经验方案？', a: '氨苄西林 + 头孢噻肟/头孢他啶 ± 万古霉素\n（覆盖李斯特菌/GBS/大肠埃希菌）。\n疗程：GBS/李斯特 14–21 天，革兰阴性 21 天。' },
  { m: '03', q: '≥3 月龄儿童脑膜炎经验方案？', a: '头孢曲松/头孢噻肟 + 万古霉素（覆盖耐药 SP/脑膜炎球菌/Hi）；头孢吡肟可选。\n疗程：脑膜炎球菌 7 天，Hi 7–10 天，SP 10–14 天。' },
  { m: '03', q: '肿瘤/移植/免疫缺陷宿主的 CNS 感染要覆盖哪些特殊病原？', a: '李斯特菌、隐球菌、奴卡菌、结核、CMV、HSV。\n方案：氨苄西林 + 头孢他啶/美罗培南，评估抗真菌。\n疗程：隐球菌 6–12 月，李斯特 14–21 天。' },
  { m: '03', q: '下尿路感染（膀胱炎）的治疗？', a: '口服 3 代头孢：头孢克肟/头孢地尼/头孢泊肟（大肠埃希菌为主），无发热。\n疗程 3–5 天（≥2 岁无发热女童可 3 天短程）。' },
  { m: '03', q: '上尿路感染（肾盂肾炎）何时住院？用什么药？', a: '门诊轻症 → 口服头孢克肟/头孢地尼；发热/呕吐/<2 月龄/脱水 → 住院：头孢曲松/头孢噻肟。\n静脉 2–4 天后改口服，总 10–14 天。' },
  { m: '03', q: 'UTI 合并 ESBL 风险或导尿管/ICU/免疫抑制时如何处理？', a: 'ESBL 风险（反复 UTI/近期广谱/结构异常）→ 哌拉西林他唑巴坦/美罗培南。\n导管/ICU/免疫抑制 + 持续菌尿 + 全身感染征象 → 先拔管，氟康唑 6–12 mg/kg/d 或棘白菌素（念珠菌尿）。' },
  { m: '03', q: '单纯性阑尾炎 vs 穿孔/腹膜炎的经验方案？', a: '单纯/未穿孔：头孢曲松/头孢噻肟/头孢哌酮舒巴坦（舒普深）+ 甲硝唑，术后 3–5 天。\n穿孔/脓肿/休克 → 美罗培南/亚胺培南，或哌拉西林他唑巴坦；需手术/经皮引流。' },
  { m: '03', q: '细菌性肝脓肿与胆道感染的经验方案？', a: '肝脓肿（化脓性：金葡/大肠/克雷伯/厌氧）：头孢曲松 + 甲硝唑，或哌拉西林他唑巴坦；阿米巴性 → 甲硝唑 30–50 mg/kg/d。\n胆道感染（胆管炎/胆囊炎）：哌拉西林他唑巴坦或美罗培南（革兰阴性+厌氧）+ 胆道引流。' },
  { m: '03', q: 'NEC（新生儿坏死性小肠结肠炎）与继发感染性胰腺炎的方案？', a: 'NEC：哌拉西林他唑巴坦，或万古霉素 + 头孢噻肟 ± 甲硝唑；禁食 + 胃肠减压 + 外科评估。\n胰腺炎（继发感染/坏死感染）：碳青霉烯，或头孢曲松 + 甲硝唑；坏死灶经皮/内镜引流。' },

  // ===== 模块 04 肠道·皮肤·链球菌·出疹 =====
  { m: '04', q: '艰难梭菌肠炎的治疗步骤？', a: '先停诱发抗生素；口服万古霉素 10 mg/kg/d（最大 500 mg/d）或非达霉素；复发 → 粪菌移植。\n疗程 10–14 天。' },
  { m: '04', q: '志贺菌痢疾（发热/血便）与弯曲杆菌感染用什么？', a: '志贺：阿奇霉素 12 mg/kg/d 或头孢曲松（重症）；TMP-SMX 耐药率高；疗程 5 天。\n弯曲杆菌（中重症/免疫缺陷/菌血症）：阿奇霉素 10 mg/kg/d（首日 10，后 5 mg/kg/d）；疗程 3–5 天。' },
  { m: '04', q: 'ETEC/EPEC（旅行者腹泻/婴儿腹泻）治疗原则？', a: '口服补液为主；重症 → 阿奇霉素 20 mg/kg 单剂（≤1 岁），或头孢曲松。' },
  { m: '04', q: '皮肤软组织感染：低危 vs MRSA 高危 vs 骨髓炎的方案？', a: '低危（非重症）：一代头孢/阿莫西林克拉维酸（化脓性链球菌/SA）。\nMRSA 高危/重症：万古霉素/克林霉素/利奈唑胺。\n骨髓炎/化脓性关节炎：万古 + 头孢曲松；疑铜绿 → 头孢他啶/头孢吡肟；金氏菌（<3 岁）→ 阿莫西林克拉维酸。' },
  { m: '04', q: '动物咬伤后的抗菌方案？', a: '阿莫西林克拉维酸（覆盖多杀巴斯德菌/厌氧菌/链球菌）+ 破伤风评估 + 冲洗清创。\n疗程 3–5 天（深部/关节 7–10 天）。' },
  { m: '04', q: '坏死性筋膜炎的处理要点？', a: '急诊清创 + 广谱（万古 + 哌拉西林他唑巴坦/碳青霉烯）+ 克林霉素（抑制毒素）；手术部位感染 SSI 按部位/药敏。\n疗程：至清创彻底 + 热退 48h。' },
  { m: '04', q: 'GAS（A 组链球菌）咽炎/皮肤感染及猩红热方案？过敏时？', a: '青霉素 V / 阿莫西林（猩红热同方案）；过敏 → 头孢呋辛/克林霉素/阿奇霉素。\n疗程 10 天（防风湿热/肾小球肾炎）。' },
  { m: '04', q: '风湿热二级预防的用药与疗程？', a: '苄星青霉素 G 60 万 U（≤27 kg）/ 120 万 U（>27 kg）肌注，每 3–4 周一次，5 年或至 21 岁。' },
  { m: '04', q: 'GBS（B 组链球菌）新生儿早发败血症/脑膜炎方案？', a: '氨苄西林 + 庆大霉素（或头孢噻肟）。\n疗程：菌血症 10 天，脑膜炎 14–21 天。' },
  { m: '04', q: '侵袭性 GAS（坏死性筋膜炎/TSS）方案？', a: '青霉素 + 克林霉素（抑毒素）+ IVIG，急诊清创。\nTSS 疗程 10–14 天。' },
  { m: '04', q: '出疹性疾病中哪些需要抗菌/抗病毒，哪些只需支持？', a: '需用药：猩红热→青霉素/阿莫西林（过敏→一代头孢/克林/阿奇）；水痘重症/免疫缺陷/新生儿→阿昔洛韦 10 mg/kg q8h。\n支持治疗：麻疹（补维生素 A）、手足口/幼儿急疹/风疹（不用抗菌药）。' },
  { m: '04', q: '脑膜炎球菌感染（暴发性紫癜）与 SSSS/TSS 的处理？', a: '脑膜炎球菌血症/脑膜炎：头孢曲松/头孢噻肟（±万古）；接触者预防：利福平/头孢曲松。\nSSSS/TSS：萘夫西林/一代头孢或万古 + 克林霉素；TSS 加 IVIG。' },

  // ===== 模块 05 特殊病原四大卡 =====
  { m: '05', q: '中性粒细胞缺乏发热的一线经验方案？', a: '抗铜绿 β-内酰胺单药：舒普深/头孢他啶/头孢吡肟/哌拉西林他唑巴坦/美罗培南。\n疗程：热退 + ANC>500 后 48h（通常 ≥7 天）。' },
  { m: '05', q: '粒缺发热什么情况下加万古？48–72h 仍发热怎么办？', a: '血流动力学不稳 / MRSA 皮肤灶 / 导管征象 → + 万古霉素（至热退 + ANC 恢复）。\n48–72h 持续发热进展 → 换碳青霉烯，评估抗真菌（卡泊芬净/两性霉素 B）。' },
  { m: '05', q: '粒缺发热的诊断标准与初始评估？', a: '发热：≥38.0℃ 一次，或 ≥38.3℃。\n初始评估：血培养 ×2（含导管）+ 尿培养 + 胸部影像（有呼吸道症状时）。\n预防：化疗后 G-CSF 按方案、口腔护理、避免生食。' },
  { m: '05', q: '流感与支原体肺炎的治疗？', a: '流感：奥司他韦按体重 30/45/60/75 mg bid，5 天；重症/不能口服 → 帕拉米韦 10 mg/kg。\n支原体：阿奇霉素 10 mg/kg/d（≤500mg）；>8 岁耐药 → 多西环素。' },
  { m: '05', q: '疱疹病毒（HSV/VZV）与 CMV 的用药？', a: '阿昔洛韦：新生儿 HSV 60 mg/kg/d q8h 静注；VZV 10–20 mg/kg q8h。\nCMV（免疫低下/移植后）：更昔洛韦/缬更昔洛韦（按 CrCl 调整），诱导 14–21 天 + 维持。' },
  { m: '05', q: '百日咳的治疗与暴露后预防？', a: '阿奇霉素 10 mg/kg/d（<6 月龄适用，优于红霉素），5 天；替代：克拉霉素 15 mg/kg bid，或红霉素 40–50 mg/kg/d qid（<1 月慎用——幽门狭窄风险）。\n暴露后预防：同治疗剂量（接触后 21 天内）。' },
  { m: '05', q: '结核初治方案与疗程？潜伏结核（LTBI）方案？', a: '初治敏感：2HRZE → 4HR（INH 10–15 / RIF 10–20 / PZA 30–40 / EMB 15–25 mg/kg/d）；疗程 6 个月（重症 9–12 个月）。\nLTBI：异烟肼 10 mg/kg/d × 9 个月，或 INH+RIF × 3 个月，或 RIF × 4 个月。' },
  { m: '05', q: 'MDR-TB（耐药结核）的处理原则与监测要点？', a: 'MDR-TB/暴露史 → 专科与疾控会诊，按药敏二线方案（通常 ≥18 个月）。\n监测：INH/RIF 每月查肝功；RIF 酶诱导（相互作用）；EMB <6 岁慎用（视神经）；结脑加激素。' },

  // ===== 模块 06 真菌·寄生虫·院内·TORCH =====
  { m: '06', q: '念珠菌血症与侵袭性曲霉病的首选？', a: '念珠菌血症：棘白菌素——卡泊芬净 70→50 mg/m²/d，米卡芬净 2–4 mg/kg/d（或两性霉素 B 脂质体 3–5 mg/kg/d；新生儿首选米卡/脂质体）；稳定敏感 → 氟康唑 6–12 mg/kg/d。\n侵袭性曲霉：伏立康唑 9 mg/kg bid 负荷 → 8 mg/kg bid（儿童剂量高于成人，TDM 谷 1–5.5）；替代：脂质体两性霉素 B。' },
  { m: '06', q: '隐球菌脑膜炎与毛霉病的方案？', a: '隐球菌脑膜炎：两性霉素 B + 氟胞嘧啶 100 mg/kg/d q6h 诱导 2 周 → 氟康唑 10–12 mg/kg/d 巩固 → 维持（诱导 2 周 + 巩固 8 周 + 维持 6–12 月）。\n毛霉：两性霉素 B 脂质体 5–10 mg/kg/d + 急诊手术清创；稳定 → 泊沙康唑/艾沙康唑。' },
  { m: '06', q: '鹅口疮/皮炎与头癣的局部/口服用药？', a: '鹅口疮/皮炎：制霉菌素或氟康唑 3–6 mg/kg/d（血培养转阴后 14 天，深部 4–6 周）。\n头癣：特比萘芬（<20 kg 62.5 mg/d），或灰黄霉素 10–20 mg/kg/d（头癣 4–6 周）。' },
  { m: '06', q: '重症/恶性疟的治疗？间日疟根治注意什么？', a: '重症/恶性疟：青蒿琥酯静脉 2.4 mg/kg（0/12/24h 各 1 次，后 qd），或蒿甲醚肌注；非重症 → 蒿甲醚-本芴醇口服。\n间日疟根治 → 加伯氨喹（先查 G6PD）。\n疗程：青蒿素类 3 天 + 伯氨喹 14 天。' },
  { m: '06', q: '贾第虫/阿米巴、蛔虫/蛲虫、弓形虫的用药？', a: '贾第虫：甲硝唑 15 mg/kg/d 分 tid ×5–7 天；阿米巴痢疾/肝脓肿 → 甲硝唑 30–50 mg/kg/d（10 天，肝脓肿加巴龙霉素/双碘喹啉）。\n蛔虫/蛲虫：阿苯达唑 400 mg 单剂（≥2 岁）；蛲虫 2 周后重复 1 次。\n弓形虫（先天/免疫缺陷）：乙胺嘧啶 + 磺胺嘧啶 + 亚叶酸，先天感染 ≥12 个月。' },
  { m: '06', q: 'HAP（早发 vs 晚发/MDR 风险）的经验方案？', a: '早发（≤4 天住院、无 MDR 风险）：头孢曲松/哌拉西林他唑巴坦，7 天。\n晚发/MDR 风险（ICU、机械通气 ≥48h、近期广谱）：抗铜绿 β-内酰胺（头孢吡肟/头孢他啶/哌拉西林他唑巴坦/美罗培南）± 万古霉素。' },
  { m: '06', q: 'VAP 与 CLABSI 的经验方案？导管相关念珠菌如何处理？', a: 'VAP（晚发/免疫缺陷）：美罗培南/头孢吡肟 + 万古/利奈唑胺；不动杆菌 → 舒普深/替加环素；铜绿耐药 → 联合（β-内酰胺 + 氨基糖苷）。\nCLABSI：万古（TDM）+ 抗铜绿 β-内酰胺；金葡菌 → 拔管 + ≥14 天（复杂 4–6 周）；CoNS → 拔管后 5–7 天；念珠菌 → 棘白菌素 + 拔管。' },
  { m: '06', q: '导管相关血流感染（CLABSI）的预防措施？', a: '每日评估导管必要性；锁骨下优先置管；CHG 消毒；手卫生；HAP 预防：抬高床头 30–45°、口腔护理、避免不必要抑酸。' },
  { m: '06', q: '先天梅毒、先天弓形虫、症状性 CMV、新生儿水痘的治疗？', a: '先天梅毒：水剂青霉素 G 5 万 U/kg（≤7 日龄 q12h / >7 日龄 q8h）静注 ×10 天（中断需重新开始）。\n先天弓形虫：乙胺嘧啶 + 磺胺嘧啶 + 亚叶酸 ≥12 个月。\n症状性 CMV：更昔洛韦 6 mg/kg q12h 或缬更昔洛韦 16 mg/kg bid，≥6 个月。\n新生儿水痘（母亲产前 5 天–产后 2 天）：阿昔洛韦 20 mg/kg q8h 静注。' },
  { m: '06', q: '风疹与细小病毒 B19 感染如何处理？', a: '均无特效药，支持治疗 + 隔离。\nB19 贫血 → 红细胞输注/IVIG（免疫缺陷/慢性溶血）。' },

  // ===== 模块 07 药敏判读 S/I/R =====
  { m: '07', q: 'S / I / R 分别代表什么？判读依据是什么？', a: 'S = 敏感（常规剂量可达有效暴露）；I = 中介（提高剂量/改变给药方式可能有效，提示耐药潜力）；R = 耐药。\n判读依据 CLSI/EUCAST 折点与 MIC。注意：体外敏感 ≠ 体内一定有效（部位穿透差：脑膜炎/脓肿/骨）。' },
  { m: '07', q: 'ESBL、AmpC、碳青霉烯酶的判读线索？头孢他啶-阿维巴坦对哪类无效？', a: 'ESBL：三代头孢耐药（头孢噻肟/头孢曲松）+ 酶抑制剂复方敏感。\nAmpC：头孢西丁耐药提示。\n碳青霉烯酶（mCIM/CDT 阳性）：头孢他啶-阿维巴坦对 KPC/OXA-48 有效，对 NDM 无效。' },
  { m: '07', q: 'MRSA 的判读标准？何时需要做 D 试验？', a: '苯唑西林耐药 = MRSA（对全部 β-内酰胺耐药）。\n红霉素耐药 + 克林霉素敏感 → 做 D 试验；阳性 = 诱导型克林霉素耐药，克林霉素不可用。' },
  { m: '07', q: 'VRE（耐万古霉素肠球菌）可用药物？肺炎链球菌大环内酯耐药时怎么办？', a: 'VRE：利奈唑胺/达托霉素/替加环素。\n耐药肺炎链球菌按青霉素/头孢曲松 MIC 分层选药；支原体大环内酯耐药（我国高发）→ 48h 无效应考虑换药。' },
  { m: '07', q: '常见的"天然耐药"有哪些？', a: '肠球菌 → 头孢/氨基糖苷单药无效；克雷伯菌 → 氨苄西林；沙雷菌/枸橼酸杆菌 → 三代头孢（AmpC）；铜绿假单胞菌 → 天然耐多种；嗜麦芽窄食单胞菌 → 天然耐碳青霉烯；李斯特菌 → 天然耐头孢菌素。' },
  { m: '07', q: '经验治疗无效的"五步查"是什么？', a: '① 药敏真敏感但部位穿透差？（脑膜炎/脓肿/骨）\n② 剂量/给药方式不足？\n③ 耐药是否发展？（重复培养）\n④ 是否需联合？\n⑤ 非感染因素？（导管/脓肿灶/免疫状态）' },

  // ===== 模块 08 耐药菌升级路径 =====
  { m: '08', q: 'ESBL 肠杆菌的目标治疗方案？', a: '轻中度：头孢哌酮/舒巴坦、哌拉西林他唑巴坦；\n重症：美罗培南/亚胺培南。' },
  { m: '08', q: 'CRE（碳青霉烯耐药肠杆菌）的目标治疗？', a: '头孢他啶-阿维巴坦 / 头孢地尔 / 多黏菌素 B（需感染科会诊）。' },
  { m: '08', q: 'MRSA 目标治疗的药物选择按部位？', a: '万古霉素（TDM）→ 利奈唑胺（肺部）/ 达托霉素（血流、骨关节）/ 头孢洛林。' },
  { m: '08', q: '泛耐药不动杆菌（XDR）的联合方案？', a: '替加环素（>8 岁）+ 多黏菌素联合；碳青霉烯耐药铜绿 → 头孢地尔/多黏菌素雾化。' },

  // ===== 模块 09 用药注意与英文缩写 =====
  { m: '09', q: '儿童使用喹诺酮类和四环素类的限制？', a: '喹诺酮类：严格限制，仅特定指征，6 岁以下慎用。\n四环素类（多西/替加/米诺）：8 岁以下禁用或慎用（牙齿沉积）。' },
  { m: '09', q: '哪些抗菌药需要监测血药浓度或毒性？新生儿用药特别注意什么？', a: '万古霉素 / 氨基糖苷类 / 利奈唑胺需监测血药浓度或毒性。\n新生儿（尤其早产儿）剂量与肝肾功能差异大，须按日龄分层并经 NICU 复核。' },
  { m: '09', q: '缩写：SP / Hi / MC / GAS / GBS / SA / CoNS 各指什么？', a: 'SP = 肺炎链球菌；Hi = 流感嗜血杆菌（Hi b = b 型）；MC = 卡他莫拉菌；GAS = A 组链球菌；GBS = B 组链球菌；SA = 金黄色葡萄球菌；CoNS = 凝固酶阴性葡萄球菌。' },

  { m: '14C', q: '枸橼酸咖啡因用法？', a: '负荷 20 mg/kg（= 咖啡因 10 mg/kg），24 h 后维持 5 mg/kg qd；\n有效血药浓度 5–25 mg/L，> 60 mg/L 可惊厥/心动过速；\n已取代氨茶碱；早期使用（< 3 天）减少 BPD。' },
  { m: '14C', q: 'BPD 定义、发生率与分度？', a: '生后不久的呼吸困难需氧/通气，纠正胎龄 36 周仍依赖氧疗 + 肺功能异常；\n< 32 周发生率 20–30%、< 28 周 50–60%；\n诊断：FiO₂ > 21% 超过 28 天；\n分度按矫正 36 周 FiO₂：轻（不需氧）/ 中（< 30%）/ 重（≥ 30% 或需机械通气）。' },
  { m: '14C', q: 'BPD 危险因素与治疗？', a: '危险因素：氧疗、机械通气（容量伤气压伤）、感染（绒毛膜羊膜炎）、PDA；\nDart 方案地塞米松 0.15 → 0.10 → 0.05 → 0.02 mg/kg 递减共 0.89 mg/kg；\n限液 110–130 ml/(kg·d)。' },
  { m: '14C', q: '新生儿氧疗规范？', a: '指征：无发绀窘迫但 SpO₂ < 89%（≈ PaO₂ < 60 mmHg）；\n目标 SpO₂ 90–95%、不超 95%（PaO₂ 60–70 mmHg）；\n严格以最低 FiO₂ 维持。' },
  { m: '14C', q: 'PPHN 定义、病因与病理三型？', a: '肺血管阻力持续增高 → 心房/动脉导管水平右向左分流；\n美国最常见病因 MAS（42%）；缺氧最常见；剖宫产增加；\n母亲 NSAID（有争议）/ SSRI / 甲亢；\n病理三型：血管发育不全 / 发育不良 / 适应不良。' },
  { m: '14C', q: 'PPHN 临床表现与诊断？', a: '严重青紫，生后 12 h 内出现；\n差异性青紫：导管前右手与左手/下肢 SpO₂ 差 > 10%；\n气急不明显、常无三凹呻吟；\n心超：PASP = 4 × 三尖瓣反流速度² + RAP；PASP ≥ 75% 体循环收缩压 = 肺动脉高压。' },
  { m: '14C', q: 'iNO 治疗 PPHN 的指征与用法？', a: '首选；指征：FiO₂ > 60%、PaO₂ < 50 mmHg、SpO₂ < 85%、OI > 25；\n起始 15–20 ppm，30–60 min 起效；\n不可骤停（减至 10 ppm 后每 6–12 h 减 1 ppm）；\n监测高铁血红蛋白 ≤ 3%；\n无 iNO 可用西地那非 1–2 mg/kg q6–12h。' },

  // ===== 模块 14D 神经·黄疸 =====
  { m: '14D', q: 'HIE 病因与发病机制（三阶段）？', a: '围产期缺氧缺血；单纯缺氧不致严重损伤，缺氧 + 缺血才严重；\n三阶段：原发性能量衰竭 → 潜伏期（治疗时间窗约 6 h）→ 继发性能量衰竭。' },
  { m: '14D', q: 'HIE 确诊 4 条？', a: '① 明确宫内窘迫史（胎心 < 100 持续 5 min / 羊水 III 度）\n② 出生时重度窒息（1 min Apgar ≤ 3 且 5 min ≤ 5，或脐血 pH ≤ 7.00）\n③ 生后神经症状持续 24 h 以上\n④ 排除电解质紊乱、颅内出血、产伤、宫内感染等' },
  { m: '14D', q: 'HIE 分度要点？', a: '轻度：兴奋抑制交替、肌张力正常或稍高，症状 72 h 内消失，预后好；\n中度：嗜睡、肌张力减低、常有惊厥，14 天内消失，可能有后遗症；\n重度：昏迷、松软、惊厥可呈持续状态，病死率高，EEG 爆发抑制/等电线。' },
  { m: '14D', q: 'HIE 治疗原则？', a: '对症支持 + 亚低温（唯一被推荐的中重度特殊神经保护，生后 6 h 内开始）；\n苯巴比妥控制惊厥首选但不建议预防用药；\n维持血糖 75–100 mg/dl；不常规甘露醇预防脑水肿。' },
  { m: '14D', q: 'PVL 与 PHI？', a: 'PVL = 脑室周白质缺血性坏死（少突胶质前体细胞易损，分囊性/非囊性）；\nPHI = 出血性坏死，80% 伴大 IVH；\n颅脑超声查局灶 PVL，MRI 对弥漫型敏感；\n统称"早产儿脑病"。' },
  { m: '14D', q: 'GMH-IVH 分级与筛查时机？', a: 'Ⅰ级：室管膜下/少量 IVH（< 10% 脑室）；\nⅡ级：IVH 10–50%，无脑室扩大；\nⅢ级：> 50%，伴脑室扩大；\nⅣ级：合并脑实质出血或 PHI；\n筛查：生后 24 h、3 天、7 天各做颅脑超声，然后每周至出院。' },
  { m: '14D', q: 'IVH 临床三型？', a: '寂静型最常见（50%，仅影像发现）；\n断续进展型次之；\n急剧恶化型最少但最重。' },
  { m: '14D', q: '脑室扩大（PHVD）处理？', a: '缓慢进展 < 2 周 → 观察；\n持续进展 > 2 周 → 连续腰穿（每次 10 ml/kg）；\n快速进展 → 皮下脑脊液存储器（标准治疗）/ 脑室外引流；\nV-P 分流适应证：体重 > 2.5 kg、无感染、CSF 蛋白 < 1.5 g/L。' },
  { m: '14D', q: '新生儿胆红素代谢 5 特点？', a: '① 生成多：8–10 mg/(kg·d)，为成人 2 倍\n② 肝细胞摄取不足：Y/Z 蛋白生后 5 天才近成人\n③ 结合缺陷：UGT 活性仅成人 1%，3 月龄达成人\n④ 排泄缺陷\n⑤ 肠肝循环增加（β-葡萄糖醛酸苷酶；胎粪 1 mg/g，排出延迟加重）' },
  { m: '14D', q: '生理性黄疸特点？', a: '2–3 天出现、4–6 天高峰；\n足月儿 2 周消退、早产儿 3–4 周；\n峰值：足月 ≤ 12.9 mg/dl（220.5）、早产 ≤ 15 mg/dl（256.5）；\n"生理性"黄疸也可发生胆红素脑病（尤其低体重/危重儿）。' },
  { m: '14D', q: '病理性黄疸诊断标准？', a: '24 h 内出现；\nTSB 上升 > 5 mg/dl/d（85.5 μmol/L）或 > 0.5 mg/dl/h；\n结合胆红素 > 1.5–2 mg/dl；\n持续 > 2 周；小时列线图超 P95。' },
  { m: '14D', q: '高胆红素血症严重度分类？', a: '重度：TSB 峰值 > 342 μmol/L（20 mg/dl）；\n极重度：> 427（25）；\n危险性：> 510（30）mg/dl。' },
  { m: '14D', q: '母乳性黄疸（早发型 vs 晚发型）？', a: '早发型 = 母乳喂养性黄疸：生后 3–4 天，摄入不足所致，增加哺乳可预防；\n晚发型 = 真母乳性黄疸：第 1 周末高峰，停母乳 24–72 h TSB 明显下降，3–12 周消退。' },
  { m: '14D', q: 'Rh 溶血病 vs ABO 溶血病？', a: 'Rh：不常见、病情重、水肿常见、肝脾大显著、第一胎很少（约 1%）、Coombs 直接法阳性；\nABO：常见、轻~中度、第一胎 40–50% 受累、多见于 O 型母亲、改良 Coombs/释放试验阳性、外周血小球形红细胞。' },
  { m: '14D', q: '胆红素脑病与核黄疸？', a: '急性胆红素脑病（警告期：嗜睡肌张力低吸吮无力 → 痉挛期：发热角弓反张 → 恢复期）；\n核黄疸 = 慢性后遗症期；\nB/A 比值：1 g 白蛋白联结 8.5 mg/dl 胆红素，B/A > 3 提示有游离胆红素；\n后遗症 4 大特征：锥体外系运动障碍、听觉异常、眼球上转受限、牙釉质发育不良。' },
  { m: '14D', q: '按黄疸出现时间鉴别病因？', a: '24 h 内 → 母婴血型不合溶血、宫内感染、败血症；\n2–3 天 → 生理性、严重疾病（Lucey-Driscoll、C-N 综合征）；\n3 天–1 周 → 败血症、尿路感染；\n1 周后 → 母乳性、溶血急性发作；\n1 月持续 → 母乳性、甲减、胆道闭锁。' },
  { m: '14D', q: '光疗要点？', a: '蓝光 425–475 nm；\n标准光疗 8–10、强光疗 > 30 μW/(cm²·nm)；\n接近换血标准用持续强光疗；\n停光疗：> 35 周 TSB < 13–14 mg/dl；\n每 12–24 h 监测，溶血或近换血水平 q4–6h；\n可致青铜症（结合胆红素高时）。' },
  { m: '14D', q: '换血疗法指征、血源与量？', a: '指征：光疗失败、严重溶血（脐血胆红素 > 4.5 mg/dl + Hb < 110 g/L + 水肿）、已出现急性胆红素脑病表现者（无论胆红素水平）；\n血量 = 2 倍血容量或 150–160 ml/kg，全程 90–120 min；\nRh 溶血选 Rh 同母、ABO 同患儿；ABO 溶血首选 O 型红细胞 + AB 型血浆；\nIVIG 1 g/kg（6–8 h 输注，可 24 h 重复）。' },

  // ===== 模块 14E 血液·消化·感染·代谢 =====
  { m: '14E', q: '新生儿生理性贫血？', a: '足月儿 6–12 周 Hb 降至 95–110 g/L；\n早产儿 4–8 周降至 70–90 g/L；\n原因：EPO 下降、红细胞寿命短（足月 70–90 天/早产 60–80 天）、生长稀释；\n无需治疗。' },
  { m: '14E', q: '新生儿贫血诊断标准与分度？', a: '2 周内：静脉 Hb < 130 g/L、末梢 < 145 g/L、Hct < 0.43；\n分度：轻 90–110、中 60–90、重 30–60、极重 < 30 g/L。' },
  { m: '14E', q: '失血性贫血输血指征与量？', a: '出生 24 h 内 Hb < 130 g/L；急性失血 ≥ 10% 血容量；采血丢失 ≥ 5–10% 血容量；\n肺部疾病或先心左向右分流维持 Hb ≥ 130 g/L；\n输血量 10–20 ml/kg；\n3 ml/kg 浓缩红细胞或 6 ml/kg 全血可升 Hb 10 g/L。' },
  { m: '14E', q: '早产儿输血指征（按呼吸支持分级）？', a: '自主呼吸吸空气 Hb < 70、吸氧 < 80；\nCPAP：< 28 天 < 100、≥ 28 天 < 80；\n有创通气：< 28 天 < 110（FiO₂ < 30%）或 < 120（FiO₂ ≥ 30%）；\n铁剂 2–3 mg/(kg·d) 至少 3 个月。' },
  { m: '14E', q: 'NEC 概述（发生率、好发部位、发病时间）？', a: '小肠结肠坏死性炎症，腹胀主症、肠壁囊样积气为特征；\nVLBW 发生率 5–10%（我国 6.6%）、病死率 20–30%；\n90–95% 为早产儿；生后 2–3 周发病、2–10 天高峰；\n好发回肠远端和升结肠近端。' },
  { m: '14E', q: 'NEC 危险因素？', a: '早产（根本）、感染（败血症）、肠道菌群失衡（早期长时间抗生素）、\n喂养不当（近 90% 发生于开始肠内喂养后）、输血后 48 h 内、H2 受体拮抗剂；\n母乳喂养保护（RR 0.21）。' },
  { m: '14E', q: 'NEC 表现、分期与治疗？', a: '先胃潴留/腹胀（最早）→ 腹泻血便、呕吐咖啡样/胆汁；\nX 线：肠壁囊样积气 → 门静脉积气 → 气腹；\nBell 分期：Ⅰ 疑似 / Ⅱ 确诊 / Ⅲ 进展；\n禁食轻 3–5 天、重 7–10 天，恢复从 1–2 ml/次；\n手术绝对指征 = 肠穿孔。' },
  { m: '14E', q: '新生儿败血症分类与病原？', a: '早发型 EOS（< 7 天，母源：GBS、大肠埃希菌、李斯特菌）；\n晚发型 LOS（≥ 7 天：发达国家 NICU 以凝固酶阴性葡萄球菌最常见，发展中国家以革兰阴性杆菌为主）；\nEOS 发生率 1–4/1000 活产。' },
  { m: '14E', q: '败血症实验室检查（培养/IT/CRP/PCT）？', a: '血培养用药前采 1–3 ml；\nI/T 比值最敏感（24 h 连续 2 次正常 + 血培养阴性，阴性预测价值 100%）；\nCRP 24–48 h 动态（阴性预测价值 99%，不能单独诊断）；\nPCT 生后 24 h 生理性升高、48–72 h 降至正常；\n尿培养不作 EOS 常规。' },
  { m: '14E', q: '败血症经验治疗与疗程？', a: 'EOS 经验：青霉素 + 三代头孢；LOS 据本院流行病学（MRSA 多选万古）；\n疗程自首次培养阴性算起：\n无中枢感染 EOS 10 天、LOS 10–14 天、中枢感染 14–21 天、革兰阴性杆菌中枢感染至少 21 天。' },
  { m: '14E', q: '先天性 CMV 感染？', a: '发生率 0.5–2%；母亲原发感染垂直传播 30–40%；\n诊断：生后 3 周内尿/唾液病毒分离或 PCR；\n治疗：更昔洛韦 6 mg/kg q12h × 6 周；神经受累者缬更昔洛韦 16 mg/kg/d × 6 个月；\n90% 出生时无症状，但 10–15% 2 岁前出现耳聋。' },
  { m: '14E', q: '先天性梅毒？', a: '早期梅毒未治垂直传播 70–100%，晚期潜伏 10–30%；\n2/3 出生时无症状；\n治疗：水剂/普鲁卡因青霉素 5 万 U/(kg·次)\n（≤1 周 q12h、8–30 天 q8h、>30 天 q6h）× 10–14 天；\n随访 RPR：2、4、6、12 个月。' },
  { m: '14E', q: '新生儿破伤风？', a: '不洁断脐，生后 7 天左右发病（"七日风"）；\n苦笑面容、角弓反张、压舌板试验；\n地西泮首选 0.3–0.75 mg/kg q4–6h；\nTAT 1–2 万 U 或 TIG 500 IU；\n青霉素 10–20 万 U/(kg·d) × 10 天，或甲硝唑。' },
  { m: '14E', q: '新生儿真菌感染？', a: '念珠菌占 90–95%；\nVLBW 发生率 1–5%、ELBW 10%、病死率 23–66%；\n两性霉素 B 1 mg/(kg·d)、氟康唑 12 mg/(kg·d)、卡泊芬净 10 mg/(kg·d) 挽救治疗；\n确诊即拔中心静脉导管；\nIFI > 10% 的中心对 < 1000 g 用氟康唑预防 3–6 mg/kg 每周 2 次 × 6 周。' },
  { m: '14E', q: '新生儿低血糖？', a: '诊断：< 2.6 mmol/L（47 mg/dl）不论胎龄均须干预；\n病因：糖原储存不足（早产/SGA）、糖尿病母亲、高胰岛素血症（Beckwith）；\n治疗：早期喂养、10% 葡萄糖 6–8 mg/(kg·min)（< 1.6 mmol/L 给 8–10）、\n惊厥时 25% 葡萄糖 2–4 ml/kg 静注；外周输糖浓度上限 12.5%。' },
  { m: '14E', q: '新生儿低钙血症？', a: '总钙 < 2.0 mmol/L 或离子钙 < 0.9 mmol/L；\n早期型（3 天内：早产、窒息、糖尿病母亲）vs 晚期型（3 天后：牛乳喂养高磷）；\n足月儿无热惊厥最常见原因之一；\n10% 葡萄糖酸钙 1–2 ml/kg 稀释慢滴，心率 < 100 暂停；\n低钙 + 低镁先补镁。' },
  { m: '14E', q: '新生儿高血糖与低钠血症？', a: '血糖 > 7 mmol/L 为高渗血症，VLBW 高血糖发生率 50–60%，持续 > 15 mmol/L 用胰岛素；\n低钠 < 130 mmol/L，< 115 可致严重脑水肿；\n3% NaCl 12 ml/kg 可升钠 10 mmol/L。' },

  // ===== 模块 14F 寒冷损伤·ROP·外科·产伤·筛查 =====
  { m: '14F', q: '新生儿寒冷损伤分度与复温方法？', a: '三评分（体温/硬肿范围/器官功能）：0 分轻、1–3 分中、≥ 4 分重；\n硬肿范围：头颈 20%、双上肢 18%、前后躯干各 14%、臀 8%、双下肢 26%；\n34–35℃ 用预热衣被复温；\n≤ 33℃ 暖箱高于皮温 1℃、复温速度 0.5–1℃/h。' },
  { m: '14F', q: '硬肿症并发症处理？', a: '肺出血最危重（体温 < 30℃ 极期）：早期气管插管正压通气，MAP 7–12，宜高频；\nDIC：微量肝素 0.2–0.5 mg/(kg·d)；\n循环障碍：多巴胺/多巴酚丁胺 5–15 μg/(kg·min)。' },
  { m: '14F', q: 'ROP 发病与筛查时机？', a: '发生在出生体重 < 1500 g 早产儿（1500–2000 g 发生率 5–7%）；\n90% 在矫正胎龄 44 周前出现、高峰 38.6 周；\n首次筛查生后 4–6 周；\n危险因素：氧疗、输血、感染、酸中毒等。' },
  { m: '14F', q: 'ROP 分期与阈值病变？', a: 'Ⅰ期分界线 → Ⅱ期嵴 → Ⅲ期嵴 + 纤维增殖 → Ⅳ期部分视网膜脱离（a 未累及黄斑 / b 累及）→ Ⅴ期全脱离；\nplus 病变 = 活动期指征；\n阈值病变 = Ⅲ期、Ⅰ/Ⅱ区、连续 5 个时钟或累计 8 个时钟 + plus，是治疗关键期。' },
  { m: '14F', q: '先天性食管闭锁-气管瘘（分型与表现）？', a: '发病率 1:(3000~4000)；Ⅲ型（远端瘘）最常见，占 85–90%；\n典型表现：唾液不能下咽、生后流涎带泡沫，喂水奶后呛咳、口鼻溢出；\n诊断：导管不能插入胃；\n合并畸形多（50%，VACTERL），先心病最常见；\nSpitz 分级按体重 + 是否合并严重先心病。' },
  { m: '14F', q: '膈疝、腹裂、脐膨出、肛门闭锁鉴别？', a: '先天性膈疝：呼吸困难 + 舟状腹，患侧胸腔见肠管；\n腹裂：脐旁肠管外露、无囊膜；\n脐膨出：脐部膨出、有囊膜包裹（与腹裂的关键区别）；\n肛门闭锁：无肛，常合并食管闭锁等畸形。' },
  { m: '14F', q: '常见产伤（臂丛麻痹、锁骨骨折、头颅血肿）？', a: '臂丛神经麻痹：患肢下垂内旋呈"waiter tip"、拥抱反射不对称；\n锁骨骨折：骨擦音、拥抱反射不对称；\n头颅血肿：骨膜下出血、不跨骨缝、数周自行吸收。' },
  { m: '14F', q: '我国新生儿疾病筛查项目与采血时间？', a: '我国新生儿筛查始于 1981 年；\n基本筛查（所有活产儿）：苯丙酮尿症 PKU + 先天性甲减 CH，部分地区加 CAH、G6PD 缺乏症；\n扩展筛查（高危儿）：串联质谱一次查 20–30 种遗传代谢病；\n足跟血采血时间：生后 72 h 充分哺乳后（至少哺乳 6–12 次），避免 PKU 假阴性；\n另含听力筛查、ROP 筛查、先心病筛查（双指标法：听诊 + 脉搏血氧）。' },
  { m: '14F', q: 'PKU 与先天性甲减（CH）筛查判读？', a: 'PKU：血苯丙氨酸 > 0.24 mmol/L（4 mg/dl）复查定量，典型 PKU > 1.2 mmol/L（20 mg/dl）；\nCH：干血滴纸片测 TSH，> 20 mU/L 再测血清 T4 和 TSH；\n血清 T4 降低 + TSH 明显增高可确诊；\n早产儿酶成熟迟缓可致 PKU 筛查假阳性。' },
  { m: '14F', q: 'G6PD 缺乏症与 CAH 筛查？', a: 'G6PD：X 性联不完全显性，新生儿期表现为溶血性贫血 + 高间接胆红素血症；\n筛查：荧光斑点法（敏感性特异性较高）；诱因：感染、窒息缺氧、氧化剂类药物（VitK、VitC、阿司匹林、磺胺类）；\nCAH：21-羟化酶缺乏占 90–95%，筛查测 17-OHP；\n17-OHP > 500 nmol/L 为典型 CAH，150–200 nmol/L 可见于各型或假阳性。' },
  { m: '14F', q: '新生儿听力筛查流程？', a: '正常新生儿：生后 48 h 至出院前用耳声发射仪或自动听性脑干反应（AABR）初筛；\n未通过者及漏筛者 42 天内双耳复筛；\n复筛仍未通过者 3 个月内转诊省级指定机构全面诊断；\nNICU 患儿出院前 AABR 筛查，未通过直接转诊；\n高危儿即使通过，3 年内每 6 个月随访 1 次。' },

  { m: '17A', q: '变应性特异性免疫治疗（AIT）？', a: '从低剂量开始接触变应原、逐渐增量至维持量，诱导免疫耐受；\n途径：皮下（SCIT）与舌下（SLIT）；疗程通常 3~5 年；\n我国目前主要针对尘螨，适应对象为鼻炎和/或轻中度尘螨过敏性哮喘；\n皮下注射后严密观察至少 30 分钟。' },
  { m: '17A', q: '特应性进程（allergic march）？', a: '婴儿早期某种变态反应症状常预示未来其他变应性疾病：\n常首先表现为湿疹或食物过敏 → 继之发展为哮喘及变应性鼻炎；\n机制：特应性皮炎皮肤屏障受损 → 表皮致敏 → 诱导 Th2 分化 → 气道致敏；\n一级预防：润肤剂维护皮肤屏障；二级预防：湿疹早期治疗+环境控制；三级预防：已患病儿童的治疗。' },
  { m: '17A', q: '变应性鼻炎（AR）四大症状与典型体征？', a: '四大症状：清水样鼻涕、鼻痒、鼻塞、阵发性喷嚏；\n典型体征：变应性敬礼（手掌向上推鼻尖）、变应性黑眼圈、Dennie-Morgan 线（下眼睑新月形皱褶）、变应性皱褶、唇上摩擦痕；\n鼻部检查：双侧鼻黏膜苍白肿胀、下鼻甲水肿、多量清水样分泌物。' },
  { m: '17A', q: 'AR 的分类分级与确诊条件？', a: '按病程：间歇性 < 4 d/周或 < 连续 4 周；持续性 ≥ 4 d/周且 ≥ 连续 4 周；\n按严重度：轻度 vs 中-重度（影响学习、文体活动和睡眠）；\n确诊：典型症状体征 + 变应原皮肤点刺试验和/或血清特异性 IgE 任一项阳性；\n鼻分泌物嗜酸性粒细胞增多是诊断依据之一，异染细胞仅见于 AR。' },
  { m: '17A', q: 'AR 的治疗（药物阶梯）？', a: '环境控制是基础；\n鼻用糖皮质激素：一线用药，中-重度持续性首选，疗程建议 ≥ 4 周；\n第二代抗组胺药：一线，快速缓解流涕喷嚏鼻痒，疗程 ≥ 2 周，5 岁以下用糖浆；\n抗白三烯药、色酮类（起效慢）；\n减充血剂：推荐羟甲唑啉/赛洛唑啉儿童制剂，禁用萘甲唑啉，连续 ≤ 7 天（防药物性鼻炎）；\nAIT：一线治疗，唯一可能改变自然进程的方法。' },

  { m: '17B', q: '支气管激发试验的要求？', a: '评价气道高反应性（AHR）；\n应在哮喘缓解期进行；\nFEV₁ 不得低于预计值的 70%；\n常用激发物：组织胺、醋甲胆碱、蒸馏水、高张盐水或运动激发。' },
  { m: '17B', q: '儿童支气管哮喘诊断标准（5 条）？', a: '① 反复发作喘息、咳嗽、气促、胸闷，多与变应原/冷空气/物理化学刺激/呼吸道感染/运动有关，夜间和/或清晨发作加剧；\n② 发作时双肺散在或弥漫性、以呼气相为主的哮鸣音，呼气相延长；\n③ 症状体征经抗哮喘治疗有效或自行缓解；\n④ 除外其他疾病所致喘息咳嗽气促胸闷；\n⑤ 不典型者至少具备 1 项：激发/运动激发试验阳性；可逆性气流受限（舒张试验阳性或治疗 1~2 周 FEV₁ 增加 ≥12%）；PEF 每日变异率连续监测 1~2 周 > 13%；\n符合 1~4 项或第 4、5 项者可诊断。' },
  { m: '17B', q: '咳嗽变异性哮喘（CVA）诊断标准？', a: '儿童慢性咳嗽最常见原因之一；\n① 咳嗽持续 > 4 周，夜间和/或清晨发作或加重，以干咳为主；\n② 临床上无感染征象，或较长时间抗生素治疗无效；\n③ 抗哮喘药物诊断性治疗有效；\n④ 排除其他原因引起的慢性咳嗽；\n⑤ 支气管激发试验阳性和/或 PEF 每日变异率 ≥ 13%；\n⑥ 个人或一二级亲属特应性疾病史或变应原检测阳性；\n1~4 项为诊断基本条件。' },
  { m: '17B', q: '5 岁以下儿童喘息的 3 种临床表型？', a: '① 早期一过性喘息：多见于早产和父母吸烟者，肺发育延迟所致，大多数 3 岁内消失；\n② 早期起病的持续性喘息：3 岁前起病，与呼吸道病毒感染（RSV、鼻病毒）相关的反复喘息，无特应性表现；\n③ 迟发性喘息：2~3 岁后起病，有典型特应性背景（常伴湿疹），症状迁延至成人期；\n不宜早期即将婴幼儿反复喘息分型，以免延误维持治疗。' },
  { m: '17B', q: '哮喘预测指数（API）？', a: '预测 3 岁内喘息儿童发展为持续性哮喘的危险性；\n适用对象：过去 1 年喘息 ≥ 4 次；\n阳性 = 1 项主要危险因素 或 2 项次要危险因素；\n主要：父母有哮喘史；经医生诊断的特应性皮炎；吸入变应原致敏依据；\n次要：食物变应原致敏依据；外周血 EOS ≥ 4%；与感冒无关的喘息；\nAPI 阳性建议按哮喘规范治疗。' },
  { m: '17B', q: '儿童喘息的鉴别诊断？', a: '① 呼吸道感染：毛细支气管炎、支气管肺炎、DPB；\n② 先天性喉/气管/支气管异常（先天性喉喘鸣为吸气性）；\n③ 先天性心血管异常：左向右分流压迫大气道（2~9 个月婴幼儿）；\n④ 异物吸入：多发生在 3 岁以下，17% 左右漏诊；\n⑤ 心源性哮喘（小儿见于急慢性肾炎、二尖瓣狭窄）；\n⑥ 纵隔肿物压迫；⑦ 胃食管反流（24 h 食管 pH 监测鉴别）；⑧ 上气道咳嗽综合征。' },
  { m: '17B', q: '哮喘的分期（3 期）？', a: '急性发作期：突然发生症状或原有症状急剧加重；\n慢性持续期：近 3 个月内不同频度和/或不同程度地出现症状；\n临床缓解期：症状体征消失，肺功能恢复到急性发作前水平并维持 3 个月以上。' },
  { m: '17B', q: '哮喘急性发作严重程度分级要点？', a: '轻度：走路时气促、可平卧、能成句；\n中度：说话时气促、喜坐位、说短句、三凹征可有；\n重度：休息时气促、前弓位、说单字、三凹征通常有、烦躁；\n危重度：难以说话、嗜睡/意识模糊、胸腹反常运动、哮鸣音减弱乃至消失、PaCO₂ ≥ 6 kPa；\n判断时只要存在某项严重程度的指标（不必全部）即可归入该级。' },
  { m: '17B', q: '哮喘控制水平分级（表 17-3）？', a: '评估过去 2~4 周：日间症状、夜间症状/憋醒、应急缓解药使用、活动受限（≥5 岁加肺功能、急性发作）；\n控制：全无或日间症状 ≤ 2 d/周、缓解药 ≤ 2 次/周；\n部分控制：任意 1 周出现 1 种上述表现；\n未控制：任意 1 周出现 ≥ 3 项部分控制表现；\n任何一次急性发作都应复核维持治疗方案。' },

  // ===== 模块 17C 哮喘·治疗与管理 =====
  { m: '17C', q: '儿童哮喘常用药物的两大类？', a: '控制类药物（长期使用）：糖皮质激素 ICS、白三烯受体拮抗剂 LTRA、长效 β₂ 激动剂 LABA（不单独用）、缓释茶碱、色甘酸钠；\n缓解类药物（按需）：短效 β₂ 激动剂 SABA、短效抗胆碱药 SAMA、短效茶碱、全身用糖皮质激素、肾上腺素。' },
  { m: '17C', q: '吸入糖皮质激素（ICS）？', a: '最有效的抗变态反应炎症药物，长期治疗持续性哮喘的首选；\n机制：干扰花生四烯酸代谢、抑制 EOS 趋化活化、抑制细胞因子合成、减少微血管渗漏；\n局部不良反应：声音嘶哑、咽部不适、念珠菌感染——吸药后清水漱口、用储雾罐可减少；\n口服：急性发作较重或重度持续吸入大剂量无效者早期口服泼尼松 1~2 mg/(kg·d)，疗程 3~7 天。' },
  { m: '17C', q: '糖皮质激素静脉用药原则？', a: '严重哮喘发作：静脉及时给予氢化可的松（每次 5~10 mg/kg）或甲泼尼龙（每次 1~4 mg/kg）；\n无糖皮质激素依赖倾向者短期（3~5 天）内停药，症状控制后改为吸入激素；\n地塞米松抗炎作用强但半衰期长、抑制 HPA 轴时间长，应尽量避免或不较长时间使用。' },
  { m: '17C', q: '白三烯受体拮抗剂（孟鲁司特）？', a: '拮抗半胱氨酰白三烯受体，抑制肥大细胞和 EOS 释放白三烯的致喘致炎作用；\n剂型：孟鲁司特钠咀嚼片，用于 1 岁以上；\n可作为 2 级治疗的单独用药或 2 级以上治疗的联合用药；\n可减少 2~5 岁呼吸道病毒诱发喘息。' },
  { m: '17C', q: '长效吸入型 β₂ 激动剂（LABA）两药对比？', a: '沙美特罗：30 分钟起效，维持 12 小时以上，50 μg 每天 2 次；\n福莫特罗：3~5 分钟起效，维持 8~12 小时，4.5~9 μg 每天 2 次；\nLABA 与低中剂量 ICS 联合比单纯增加 ICS 剂量效果更明显，GINA 3 级以上首选联合；\n长期应用不引起 β 受体功能下调。' },
  { m: '17C', q: '茶碱类用药注意？', a: '缓释茶碱 6~10 mg/(kg·d) 分 1~2 次：适用于慢性持续哮喘，不适合急性发作；低浓度（血药约 10 mg/L 以下）有抗炎免疫调节作用；\n静脉氨茶碱：负荷量 4~6 mg/kg（6 小时内用过茶碱者减半），维持 0.8~1.0 mg/(kg·h)；\n有效安全血药浓度 5~15 μg/ml，> 20 μg/ml 不良反应明显增多；\n与 β 激动剂联用易诱发心律失常，应慎用。' },
  { m: '17C', q: '短效 β₂ 激动剂（SABA）急性发作用法与警示？', a: '沙丁胺醇/特布他林：缓解轻中度急性症状的首选，数分钟起效；\n雾化：沙丁胺醇 0.05 mg/kg，每 20 分钟 1 次连续 3 次，然后每 2~4 小时；\n急性发作时第 1 小时可每 20 分钟 1 次 × 3 次；\n警示：每月用量 ≥ 10 mg 说明哮喘未被控制应调整方案；≥ 20 mg 提示可能发生严重可威胁生命的哮喘发作；\n不宜长期单一过量使用（β 受体向下调节→临床耐药）。' },
  { m: '17C', q: '抗胆碱能药物（异丙托溴铵）在哮喘中的应用？', a: '阻断节后迷走神经传出支，扩张支气管作用比 β₂ 激动剂弱、起效慢，但联合应用有协同互补作用；\n6 岁以上气雾剂 20~40 μg/次，每天 3~4 次；\n雾化溶液儿童 250 μg/次：哮喘急性发作时雾化吸入每 20 分钟 1 次连续 3 次，然后间隔 2~4 小时 1 次；\n适用于有心律失常、用 β 阻滞剂的患者。' },
  { m: '17C', q: '儿童哮喘急性发作的医院处理流程？', a: '初始评估（病史、体检、SpO₂、PEF/FEV₁、重症查血气）；\n初始治疗：氧疗使 SpO₂ > 94% + 雾化（或 pMDI+储雾罐）速效 β₂ 激动剂 1 小时内每 20 分钟 1 次 × 3 次（可联合抗胆碱药/高剂量 ICS）；无即刻反应或严重发作者给全身性糖皮质激素；禁用镇静剂；\n重新评估分流：疗效良好（末次治疗后缓解持续 60 分钟以上、PEF ≥ 70%、SpO₂ > 94%）→ 回家；\n疗效不完全（PEF < 70%）→ 收住院；进行性加重（PEF < 33%、PaCO₂ > 6 kPa、PaO₂ < 8 kPa）→ 收 ICU，考虑气管插管机械通气。' },
  { m: '17C', q: '≥5 岁儿童哮喘长期分级治疗方案？', a: '第 1 级：按需使用速效 β₂ 激动剂；\n第 2 级：低剂量 ICS（或 LTRA）；\n第 3 级：低剂量 ICS/LABA，或中高剂量 ICS，或低剂量 ICS+LTRA；\n第 4 级：中高剂量 ICS/LABA（可加 LTRA 或缓释茶碱）；\n第 5 级：中高剂量 ICS/LABA + LTRA/缓释茶碱，≥12 岁可加抗 IgE 治疗；\n从未控制治疗者大多数起始从第 2 级开始，严重者起始第 3 级。' },
  { m: '17C', q: '<5 岁儿童哮喘长期治疗要点？', a: '最佳控制药物是 ICS，建议初始治疗选用低剂量；\n低剂量 ICS 无法控制时增加剂量是最佳选择；\n白三烯调节剂可减少 2~5 岁呼吸道病毒诱发喘息，可作为该年龄段单药控制治疗；\n每年必须随访至少 2 次以决定是否继续治疗；\n学龄前喘息儿童用抗哮喘药诊断性治疗 2~6 周后应再评估，每 3~6 个月重新评估。' },
  { m: '17C', q: '哮喘降级治疗原则？', a: '已达到哮喘控制并维持至少 3 个月后，可考虑降级，确定维持控制的最低治疗级别；\n单用中高剂量 ICS 者：病情稳定可在 3 个月内将剂量减少 50%；\n单用小剂量 ICS 达控制：可改为每天 1 次；\nICS+LABA 者：先将 ICS 减少约 50%，达小剂量 ICS 时才考虑停用 LABA；\n最小剂量 ICS 维持控制且 1 年内无症状反复，可考虑停药观察。' },
  { m: '17C', q: '吸入装置的选择（按年龄）？', a: '≤2 岁：雾化器吸入雾化溶液；\n2~5 岁：雾化吸入，或带活瓣的面罩储雾罐（spacer）辅助吸入 pMDI；\n6~7 岁：旋碟式/涡流式吸入器吸入干粉，也可用 pMDI+储雾罐；\n>7 岁：已能使用 pMDI 但常有技术错误，指导吸入方法十分重要；\n治疗效应与吸入器选择和正确使用能力有关。' },
  { m: '17C', q: '哮喘危重状态的临床表现与危险因素？', a: '表现：休息时喘息、端坐呼吸、讲话困难、焦虑、三凹征明显、发绀、血气明显低氧和/或 CO₂ 潴留；\n"哮喘持续状态"（持续 24 h 以上）一词过分强调时间因素，现已不再使用；\n危险因素：既往几乎致命的发作史；过去 1 年内因哮喘住院或急诊；既往气管插管史；正在使用或刚停用口服激素；过度依赖吸入 β 激动剂；不依从治疗计划。' },
  { m: '17C', q: '哮喘危重状态的抢救要点？', a: '① 清理呼吸道分泌物，湿化氧，流量 4~5 L/min，浓度 > 0.4，力争 SpO₂ > 95%；\n② 补液：一般给正常生理需要量的 2 倍，直至尿量达 2 ml/(kg·h)；\n③ 纠正酸中毒：pH < 7.3 且 PaCO₂ 不高时用碱性液（所需 mEq = −BE × 0.3 × kg，紧急先给 5% 碳酸氢钠 2 ml/kg）；PaCO₂ 高时先改善通气再补碱；\n④ β₂ 激动剂开始每 20 分钟 1 次，氢化可的松首次 10 mg/kg；\n⑤ 氨茶碱：入院前 6 h 未用茶碱者负荷量 4~6 mg/kg 30 min 滴完，维持 0.8~1.0 mg/(kg·h)；\n⑥ 有感染者用抗生素。' },
  { m: '17C', q: '哮喘机械通气指征？', a: 'PaCO₂ 持续升高（给氧下二氧化碳分压 > 45 mmHg）；\n全身衰竭状态、呼吸肌疲劳（吸气相呼吸音明显降低）；\n意识障碍；\n给氧情况下仍有低氧血症（氧分压 < 50 mmHg）；\n选用定容型呼吸机辅助通气。' },
  { m: '17C', q: '哮喘控制测试（ACT）？', a: '评估过去 4 周儿童哮喘控制状况的简易工具；\n4~12 岁用 c-ACT：总分 ≤ 19 提示未控制，20~22 分部分控制，≥ 23 分控制；\n≥12 岁用 ACT（与成人相同）：≤ 19 未控制，20~24 良好控制，25 完全控制；\n其他管理工具：哮喘日记、峰流速仪（PEF）监测——急性期或控制不稳定时 PEF 降低、昼夜波动加大。' },

  // ===== 模块 17D 花粉症·食物过敏 =====
  { m: '17D', q: '花粉症的定义与流行病学？', a: '由致敏花粉诱发的 I 型变态反应，具有鲜明的地区性和季节性；\n发作性喷嚏、大量清水样鼻涕、眼痒、咽喉痒、干咳、喘息、荨麻疹等；\n常将花粉诱发的过敏性鼻炎、过敏性结膜炎、过敏性咳嗽和哮喘统称花粉症；\n晴天及刮风时症状加剧，雨天减轻；我国秋季花粉症发病人数最多（蒿属等致敏性强）。' },
  { m: '17D', q: '气传花粉的两个高峰期？', a: '第 1 个高峰期在春季，以乔木开花为主：松科、柏科、杨属及桑科等；\n第 2 个高峰期在秋季，致敏性强的草本植物开花：蒿属、草属、豚草属、藜科及苋科等；\n秋季气候干燥利于花粉传播且致敏性强，我国秋季花粉症发病人数最多，北方尤为突出；\n蒿草是我国的强致敏花粉。' },
  { m: '17D', q: '致敏花粉的特点？', a: '花粉细小而量多（直径约 15~30 μm）、产量大；\n植株多为不完全花、花色不鲜艳、花味不香（非观赏花）；\n不含蜜质、无黏性、质量轻易飘散、播粉期长达数月；\n风媒花可具对称翼状气囊，长时间远距离飘浮。' },
  { m: '17D', q: '花粉症的诊断（非特异 + 特异）？', a: '非特异诊断：\n① 鲜明的季节性发作，多数届时必犯，逾时自行缓解；\n② 以呼吸道为主：发作性喷嚏、大量清涕，鼻/眼/耳/咽/上腭奇痒，鼻黏膜苍白水肿；\n③ 上呼吸道症状后可渐次出现哮喘症状；\n④ 约半数表现为花粉性过敏性结膜炎；\n⑤ 发病与所在地区明显相关；\n特异诊断：特异性皮肤试验（15~20 分钟判读）、血清特异性 IgE、激发试验（不常规使用）。' },
  { m: '17D', q: '花粉症的治疗？', a: '避免：异地避免（发病季节移居）、就地避免（少户外活动、居高层、空气净化装置）；\nAIT：唯一针对致敏花粉种类进行治疗的方法（皮下/舌下）；\n药物：鼻用糖皮质激素是中重度持续性 AR 首选、疗程 ≥ 4 周；第二代抗组胺药疗程 ≥ 2 周；抗白三烯药（伴下呼吸道症状者重要药物）；色酮类可季节前预防；减充血剂连续 ≤ 7 天；\n非药物：鼻腔盐水冲洗、花粉阻隔剂。' },
  { m: '17D', q: '食物过敏的定义与常见致敏食物？', a: '食物进入人体后产生异常 IgE 介导和/或非 IgE 介导免疫反应，导致功能紊乱和/或组织损伤；\n90% 以上的食物过敏由以下食物引起：牛奶、鸡蛋、花生、坚果、贝类、大豆、小麦；\n欧洲最常见花生；我国常见牛奶、鸡蛋、鱼、虾、花生、小麦、大豆、水果；\n主要过敏原：鸡蛋卵类黏蛋白、牛奶酪蛋白和 β 乳球蛋白、花生 Ara h1 和 Ara h2。' },
  { m: '17D', q: '食物过敏的三种机制分类？', a: '① IgE 介导：暴露后 2 小时内发生，速发；\n② 非 IgE 介导：发生较慢（摄入后数小时甚至数天），机制尚不明确；\n③ IgE 和非 IgE 混合介导：如婴儿特应性皮炎、嗜酸细胞性胃肠炎（EG）；\n特殊：α-Gal（半乳糖-α-1,3-半乳糖）过敏——目前已知唯一可引起过敏反应的糖类结构，红肉过敏，与蜱虫叮咬相关，进食后 3~6 小时发作、症状重。' },
  { m: '17D', q: 'IgE 介导食物过敏的临床表现类型？', a: '速发型：进食后 1~2 小时内皮肤（荨麻疹、血管神经性水肿）、呼吸道（咳喘、喉水肿）、胃肠道（腹痛呕吐腹泻）和/或全身表现（低血压、意识丧失）；常见花生、鸡蛋、牛奶、大豆；\n口腔变态反应综合征：IgE 介导黏膜反应，常见于蔬菜、水果，口咽部麻痛肿，24 小时内消失，常合并花粉症（花粉食物过敏综合征）；\n严重过敏反应：暴露后数分钟至 2 小时起病；\n食物依赖运动诱发过敏反应（FDEIA）：摄入食物 2 小时内运动诱发，主要致敏食物小麦、虾，阿司匹林可加重。' },
  { m: '17D', q: '非 IgE 介导食物过敏相关消化道疾病（5 个）？', a: '① 食物蛋白诱导的肠病（FPIE）：1 岁内，摄入后数小时至数天呕吐+慢性腹泻，常见过敏原牛奶；\n② 食物蛋白诱导的小肠结肠炎综合征（FPIES）：2 岁内首发，摄入后 2~6 小时呕吐腹泻，重症脱水低血压休克，回避缓解再激发再现；\n③ 食物蛋白诱导的直肠结肠炎（FPIP）：60% 母乳喂养儿，生后第 1 周至 6 个月内发病，血便、一般状况好；\n④ 乳糜泻；\n⑤ 嗜酸细胞性食管炎（EoE）。' },
  { m: '17D', q: '乳糜泻（celiac disease）要点？', a: '发生于遗传易感个体（HLA-DQ2、HLA-DQ8 基因表型）；\n与摄入麦胶蛋白（小麦、大麦、黑麦、燕麦）有关，非 IgE 介导；\n血清学：抗麦醇溶蛋白抗体 AGA、抗肌内膜抗体 EMA、抗组织转谷氨酰胺酶抗体 tTG-IgA 强阳性；\n黏膜损伤 Marsh 分级（小肠绒毛扁平萎缩）；\n诊断 5 条满足 4 条（未行基因检测时满足其中 3 条）：典型消化道症状、血清学阳性、HLA-DQ2/DQ8、黏膜损伤、去麸质饮食治疗有效；\n30% 患儿牙釉质发育不良。' },
  { m: '17D', q: '嗜酸细胞性食管炎（EoE）诊断三要点？', a: '① 食管功能异常相关症状（婴儿喂养困难哭闹呕吐；青少年胃灼热、腹痛、呕吐、进食梗阻、吞咽困难、食物嵌塞）；\n② 食管嗜酸细胞性炎症：食管黏膜多点活检 EOS ≥ 15 个/高倍镜视野；\n③ 排除其他食管 EOS 增多原因（需与 GERD 鉴别）；\n并发症：食管狭窄、感染、食管穿孔。' },
  { m: '17D', q: '口服食物激发试验（OFC）？', a: '诊断食物过敏的金标准；\n双盲安慰剂对照（DBPCFC）最可靠，需在专业医师指导下、有抢救措施的医院进行；\n准备：试验前 72 小时内停抗组胺药、激素，停用可疑食物至少 2 周；\n从小剂量开始逐渐加量（3、10、30、100、300、1000、3000 mg 食物蛋白），间隔 ≥ 20 分钟；\n判读：2 小时内出现症状 = 速发阳性；离院继续观察 2 周（必要时 4 周），观察期内出现 = 迟发阳性。' },
  { m: '17D', q: '食物过敏的辅助检查判读？', a: '皮肤点刺试验：阴性预测值 95% 以上，可排除 IgE 介导过敏；风团 ≥ 3 mm 阳性；> 8 mm 对牛奶、鸡蛋、花生过敏诊断准确性高达 100%；不能单独作为诊断依据；\n血清特异性 IgE：不受皮肤条件和抗组胺药影响；\n嗜碱性粒细胞活化试验（BAT）：流式检测 CD63、CD203c；\n斑贴试验：诊断非 IgE 介导迟发型过敏反应；\n皮试和 sIgE 仅提示致敏状态，不能预测过敏反应严重程度，大范围筛查不必要。' },
  { m: '17D', q: '食物过敏的自然进程？', a: '牛奶、鸡蛋、小麦、大豆过敏多随年龄增长产生耐受（牛奶 5 岁自然缓解率 80%~90%）；\n鱼、贝类和花生过敏可能是持续性的；\n75% 牛奶蛋白过敏患儿可耐受充分加热的牛奶，加入充分加热牛奶可加速耐受进程；\n对可能自然缓解者每 6~12 个月重新评估（SPT、sIgE、牛奶蛋白激发试验）；\nsIgE 峰值 > 50 kUA/L 提示自然缓解率低。' },
  { m: '17D', q: '食物过敏的治疗管理？', a: '① 食物规避及营养治疗：牛奶过敏配方奶婴儿选深度水解蛋白配方或氨基酸配方；母乳喂养母亲回避牛奶；不推荐其他动物奶替代（交叉反应）；限制性食物疗法 2~4 周（大米、蔬菜、猪肉等）；\n② 严重过敏反应时：肾上腺素笔（0.1 mg/kg，儿童最大不超过 0.3 ml），5~10 分钟可重复；\n③ 特异性免疫治疗：OIT 口服、SLIT 舌下、EIT 经皮；\n④ 奥马珠单抗（抗 IgE）：可治疗 IgE 介导的多重食物过敏，加快免疫治疗进程；国内已批准用于 6 岁以上中重度哮喘。' },

  // ===== 模块 17E 严重过敏反应·变态反应性皮肤病 =====
  { m: '17E', q: '严重过敏反应（anaphylaxis）的定义与流行病学？', a: '严重的、可危及生命的、全身性或系统性过敏性疾病；\n快速进展的危及生命的呼吸和/或循环问题，并通常伴有皮肤黏膜改变；\n属临床危重症，通过 IgE 介导的 I 型变态反应诱发；\n国外数据显示终身患病率约 0.05%~2%；近年因严重过敏反应住院、急诊及重症监护逐年增多。' },
  { m: '17E', q: '严重过敏反应的常见诱因与发作时间？', a: '① 食物（婴幼儿/儿童/青少年最常见诱因）：北美欧洲以牛奶、鸡蛋、花生、坚果、贝类、鱼常见；亚洲以小麦、荞麦、大米更常见；我国 0~3 岁为牛奶、4~9 岁为水果/蔬菜、10~17 岁为小麦；大部分食物过敏发生在 30 分钟内；\n② 药物：静脉用药大多发生在 5 分钟内；\n③ 昆虫叮咬：蜂类蜇伤多在 10~15 分钟内；\n④ 接触变应原（天然橡胶等）；\n找不到诱因者称特发性严重过敏反应。' },
  { m: '17E', q: '严重过敏反应的临床表现与重度标准？', a: '皮肤黏膜：最早征兆（全身风团、瘙痒潮红、血管神经性水肿）；\n呼吸系统：声音嘶哑、喘鸣、气促、发绀、呼吸停止；\n心血管：心悸、面色苍白肢端凉、低血压、休克、心搏骤停；\n婴幼儿提示：皮肤颜色变化、抓挠、流口水、行为改变（易激惹、难以安抚）、尿便失禁；\n重度标准：轻中度症状基础上合并低氧血症（SpO₂ < 92%）、低血压、晕厥、意识模糊/丧失、尿便失禁；\n双相反应：首次症状完全缓解后 1~72 小时内无诱因再次出现（1%~20%）。' },
  { m: '17E', q: '严重过敏反应的低血压定义（按年龄）？', a: '收缩压低于年龄正常值或较基础值下降 > 30%；\n1 月龄至 1 岁：< 70 mmHg；\n1~10 岁：<（70 + 2 × 年龄）mmHg；\n11~17 岁：< 90 mmHg；\n成人：< 90 mmHg 或较基础值下降 > 30%。' },
  { m: '17E', q: '严重过敏反应诊断标准（2006 NIAID/FAAN vs 2019 WAO）？', a: '2006 NIAID/FAAN（符合 3 项标准之一）：\n① 数分钟至数小时急性发作的皮肤/黏膜症状 + 呼吸或循环或严重胃肠道症状；\n② 接触可疑过敏原后数分钟至数小时内出现皮肤、呼吸、循环、消化道中 ≥ 2 系统症状；\n③ 接触已知变应原后数分钟至数小时出现血压降低；\n2019 WAO（符合 2 项标准之一）：更新点——仅表现呼吸道症状（支气管痉挛或喉部症状）也可诊断；\n大部分过敏反应发生在暴露变应原 1~2 小时内，α-Gal 或免疫治疗可迟发（> 10 小时）。' },
  { m: '17E', q: '严重过敏反应的辅助检查？', a: '尚无高敏感性和特异性的生物标记物；\n类胰蛋白酶：肥大细胞特异性活性物质，症状发生后 15~180 分钟内升高，临床较常用；\n但食物诱发的严重过敏反应中类胰蛋白酶通常无明显升高；\n皮试和 sIgE 检测仅确定变应原、不用于诊断严重过敏反应，也不能预测严重程度。' },
  { m: '17E', q: '严重过敏反应急性期处理（三个步骤）？', a: '① 尽可能寻求帮助（呼叫复苏团队/急救中心）；\n② 大腿中部前外侧肌内注射 1:1000 肾上腺素（1 mg/ml），剂量 0.01 mg/kg，儿童最大 0.3 mg，记录时间，必要时 5~15 分钟后重复（多数 1~2 剂有效）；\n③ 仰卧位抬高下肢（呼吸不畅/呕吐时调整体位），面罩 6~8 L/min 高流量吸氧，建立静脉通路、快速输注 0.9% 生理盐水 10 ml/kg，必要时心肺复苏；\n留观：重度呼吸道或心血管损伤者至少 4 小时，其他患儿 8~10 小时。' },
  { m: '17E', q: '肾上腺素自动注射装置（EAI）与随访？', a: 'EAI 剂型：15 kg 以上 0.15 mg，30 kg 以上 0.3 mg；0.1 mg 剂型（2017 FDA 批准）用于 7.5~15 kg；\nEAI 尚未在国内上市，可教家长从安瓿抽取肾上腺素至 1 ml 注射器，紧急情况下院前自行注射；\n随访：食物诱发者急性发作 4~6 周后行皮肤点刺试验确定变应原（皮试阴性可数周至数月再检测）；食物变应原皮内试验在婴幼儿是禁忌；\n制定个性化书面急救行动计划、专科门诊长期随诊；昆虫叮咬所致者可进行特异性免疫治疗。' },
  { m: '17E', q: '特应性皮炎（AD）的遗传学特点？', a: '父母一方有特应性者，其 50% 子女有特应性；双亲均有，70% 子女可能有特应性；\n双生子：同卵双生均发生 AD 者 89%，异卵双生仅 28%；\n2011 年我国汉族人 AD 患者发现 filaggrin（丝聚蛋白）基因等 17 种新突变位点；\n非变应性因素：皮肤屏障破坏、搔抓、金葡菌和糠秕马拉色菌定植、精神因素。' },
  { m: '17E', q: 'AD 的年龄分期与皮损特点？', a: '婴儿期（1 个月~2 岁）：两颊、额及头皮，渗出型（肥胖婴儿，糜烂渗出）与干燥型（瘦弱婴儿，干燥脱屑）；多数 2 岁内逐渐好转；\n儿童期（2~12 岁）：湿疹型（肘窝、腘窝苔藓化）与痒疹型（四肢伸侧背部散在痒性丘疹）；\n青少年与成人期（>12 岁）：肘窝、腘窝、颈前、面部眼周手背，屈侧为重；\n按皮损分急性（渗出糜烂）、亚急性（丘疹鳞屑结痂）、慢性（增厚浸润苔藓样变）三期。' },
  { m: '17E', q: 'AD 的伴随体征（辅助诊断）？', a: '干皮症、耳根裂隙、鱼鳞病、掌纹症、毛周角化、\nDennie-Morgan 眶下皱褶、眶周黑晕、毛周隆起、非特异性手足皮炎、白色糠疹、颈前皱褶、乳头湿疹、复发性结膜炎、白色划痕征。' },
  { m: '17E', q: 'Williams 诊断标准（AD，1994）？', a: '必要条件：持续 12 个月的皮肤瘙痒；\n加以下 5 项中 ≥ 3 项：\n① 2 岁以前发病；\n② 身体屈侧皮肤受累（肘窝、腘窝、踝前或颈周，10 岁以下包括颊部）；\n③ 有全身皮肤干燥史；\n④ 个人史中有其他过敏性疾病（哮喘或花粉症），或一级亲属中有过敏性疾病史；\n⑤ 有可见的身体屈侧湿疹样皮损。' },
  { m: '17E', q: 'AD 的治疗原则？', a: '目的：恢复皮肤正常屏障功能、寻找并去除诱发加重因素、减轻缓解症状（不可追求一次性治愈）；\n基础：保湿润肤、母乳喂养、辅食少量逐一充分蒸煮、纯棉衣物、洗澡 36~38℃ 5~10 分钟后即涂保湿剂；\n外用：糖皮质激素首选强度足够制剂逐渐降阶，炎症控制后每周 2 次外用激素+润肤剂维持；面部颈周腋下腹股沟等薄嫩处用弱效制剂；\n二线：钙调磷酸酶抑制剂（他克莫司软膏、吡美莫司乳膏）；\n系统：抗组胺药止痒；继发细菌感染用一二代头孢或半合成青霉素，继发单纯疱疹首选阿昔洛韦；免疫抑制剂（环孢素等）儿童慎用。' },
  { m: '17E', q: '接触性皮炎的两种发病机制？', a: '① 原发刺激性接触性皮炎：接触物本身有刺激性，任何人接触后均可发病（强酸强碱迅速发病；弱刺激物需长期反复接触）；\n② 变态反应性接触性皮炎：接触物本身无刺激性，仅少数人发病；小分子半抗原 + 表皮载体蛋白 = 完全抗原，引起 IV 型变态反应；\n首次接触需经 4~5 天至 21 天致敏期，再次接触 12~72 小时内发生反应；\n常见类型：尿布皮炎（婴儿最常见刺激性）、化妆品皮炎（最常见变态反应性之一）、镍皮炎、舌舔皮炎、芒果皮炎；\n斑贴试验是诊断变态反应性接触性皮炎简单易行的方法。' },
  { m: '17E', q: '植物日光性皮炎？', a: '摄食或接触光敏性植物后，暴露部位皮肤经日光照射引起的以光毒反应为主要表现的病变；\n相关植物：伞形科（香菜、芹菜、茴香）、芸香科（柑橘、柠檬、橙）、桑科（无花果）等；\n伞形科、芸香科、桑科、豆科均含呋喃香豆素（含补骨脂素结构），是最常见的光敏物；\n表现：进食后数小时至 1~3 天发病，面、手足背暴露部位显著非可凹性水肿，双侧眼睑肿胀，口唇外翻；\n治疗：避免日光照射；轻症口服钙剂、维生素 B/C/P 及抗组胺药；重症足量糖皮质激素。' },
  { m: '17E', q: '荨麻疹的临床表现与治疗？', a: '皮肤黏膜小血管扩张及渗透性增加所致的局限性水肿反应；\n常先皮肤瘙痒，随即出现风团；风团持续数分钟至数小时（不超过 24 小时）自行消退不留痕迹；\n慢性荨麻疹：病程超过 6 周；约 3/4 患者找不到原因；\n治疗：一线第二代非镇静抗组胺药（氯雷他定、西替利嗪等）；\n急性荨麻疹伴呼吸困难倾向者：立即皮下注射 1:1000 肾上腺素 0.3~0.5 ml + 糖皮质激素；\n慢性：疗程一般不少于 1 个月，必要时 3~6 个月；一种药无效可联用两种或加大剂量（2~4 倍）；\n三线：雷公藤多甙片、环孢素、奥马珠单抗、口服糖皮质激素。' },
  { m: '17E', q: '血管性水肿？', a: '又称血管神经性水肿或巨大荨麻疹；真皮深部和皮下组织局限性水肿；\n获得性诱因与荨麻疹相似；遗传性参阅皮肤疾病章节；\n表现：突然发生局部组织水肿，好发于眼睑、口唇、包皮及肢端等组织疏松处；压之无凹陷；持续 2~3 天消退不留痕迹；\n咽喉受累：胸闷、声嘶、呼吸困难甚至窒息；\n治疗同荨麻疹（抗组胺药常有效）；出现喉水肿症状时立即吸氧 + 1:1000 肾上腺素，有窒息危险时立即气管切开术。' },
  { m: '17E', q: '丘疹样荨麻疹？', a: '又称急性痒疹，多见于婴幼儿及儿童；\n病因：多数为臭虫、蚊子、蚤、虱、螨虫等叮咬所致，少数与食物过敏有关；夏秋季较多；\n表现：皮疹分批发生，躯干四肢伸侧多见；微红丘疹 → 绿豆至花生米大纺锤形红色风团样损害（可有伪足，顶端小水疱）；\n7~10 天消退，遗留暂时色素沉着，新旧皮疹常同时存在，剧痒；\n鉴别：水痘（向心性分布、三期皮疹同见、流行性）、Hebra 痒疹（对称、浸润显著、淋巴结肿大）；\n治疗：口服抗组胺药+外用止痒剂；预防以消灭蚊虫为主。' },
  { m: '17E', q: '药物性皮炎（药疹）的发病特点？', a: '药物经各种途径进入体内引起的皮肤或黏膜反应；\n多数为药物变态反应：小分子药物（半抗原）+ 组织蛋白载体 = 完全抗原；\n不属于药理作用，与剂量和毒性反应无关，只发生于少数易感人群；\n潜伏期：首次用药后 4~20 天（平均 8~10 天）致敏期；已致敏者再次用药 24~48 小时内发生；\n可发生交叉过敏（化学结构相近药物）和多价过敏（极期对结构不同药物也过敏）；\n常见四大类致敏药：解热镇痛药、磺胺类、抗生素（青霉素最多，尤其氨苄西林）、镇静安眠及抗癫痫类。' },
  { m: '17E', q: '药疹的临床分型（轻症 vs 重症）？', a: '轻症药疹：荨麻疹型、麻疹或猩红热样发疹型、固定红斑型；\n重症药疹：过敏性休克（青霉素注射后 60 分钟内发生）、重症渗出性多形红斑（SJS）、中毒性表皮坏死松解症（TEN）、药物超敏反应综合征（DIHS）；\n固定型药疹：同一部位反复发生，圆形/椭圆形水肿性紫红色斑疹，消退后遗留色素沉着（常由磺胺、巴比妥类、解热镇痛药引起）；\nSJS：靶形或虹膜样损害，口眼外阴黏膜水疱糜烂；\nTEN：暗红色斑疹融合成松弛性大疱、表皮松解，尼氏征阳性，常由解热镇痛药、磺胺、卡马西平等抗癫痫药引起；\nAGEP：水肿性红斑基础上小而浅表非毛囊性无菌性脓疱，β-内酰胺类和大环内酯类，病程 7~14 天有自限性。' },
  { m: '17E', q: 'DIHS（药物超敏反应综合征）的诊断要点？', a: '特征：急性广泛皮损 + 发热 + 淋巴结肿大 + 多脏器受累 + EOS 增多 + 异型淋巴细胞；\nT 细胞介导的迟发型超敏反应，与代谢因素和病毒感染（HHV-6 再激活）有关；\n诊断 7 条：① 特定药物后迟发发病并迅速扩展；② 停药后症状仍迁延 ≥ 2 周；③ 发热 ≥ 38℃；④ 肝损害（或其他脏器）；⑤ 血液学改变（白细胞 > 11×10⁹/L、异型淋巴细胞 > 5%、EOS > 1.5×10⁹/L 之一）；⑥ 淋巴结肿大；⑦ 再激活 HHV-6；\n典型 DIHS 具备全项，非典型具备 1~5 项；\n常见致敏药：抗癫痫药（卡马西平、苯妥英钠、苯巴比妥、拉莫三嗪）最常见，其次解热镇痛药、抗生素。' },
  { m: '17E', q: '药疹的治疗？', a: '① 过敏性休克：立即注射 1:1000 肾上腺素+静脉氢化可的松，同休克抢救；\n② 停用可疑药物，避免结构相似药物；加速药物排泄（多饮水、静脉输液）；\n③ 轻型：口服抗组胺药、维生素 C 和钙剂，必要时少量短期泼尼松 1 mg/(kg·d)；\n④ 重型：早期激素静脉滴注——氢化可的松 6~10 mg/(kg·d) 或地塞米松 0.3~0.5 mg/(kg·d)，皮损好转后改口服泼尼松渐减，一般用药 7~10 天；\n⑤ 危重（SJS、TEN、DIHS）：激素联合丙种球蛋白冲击——甲泼尼龙 10~20 mg/(kg·d) 连续冲击 3~5 天 + 静脉丙种球蛋白 1 g/(kg·d) 连续 2~3 天，无效者血浆置换；\n⑥ SJS/TEN 护理是关键：保证入量、清洁创面、床边隔离、眼部护理防睑球粘连失明。' },
];

  { m: '18A', q: '风湿热的 5 项主要表现？', a: '① 心脏炎（最常见，50%~70%，可有心内膜炎/心肌炎/心包炎）；\n② 多关节炎（35%~66%，游走性、大关节受累，不留畸形）；\n③ 舞蹈症（Sydenham，8~12 岁女孩多见）；\n④ 皮下小结（<20%，常与心脏炎并存，好发肘膝踝枕骨粗隆）；\n⑤ 环形红斑（5%~10%，躯干四肢屈侧，一过性，不留痕）。' },

  { m: '18A', q: '1992 年修订 Jones 诊断标准？', a: '在链球菌感染证据（ASO 升高/咽培养 GAS 阳性/近期猩红热）前提下：\n2 项主要表现，或 1 项主要表现+2 项次要表现即可诊断；\n次要表现：发热、关节痛、血沉增快/CRP 升高、P-R 间期延长；\n已有心脏炎者再发需更谨慎，以免漏诊。' },
  { m: '18A', q: '2015 年 AHA 修订 Jones 标准要点？', a: '按低危/中高危人群分层（低危指年发病率 <2/10 万）；\n主要表现增加"亚临床心脏炎"（超声检出）；\n环形红斑在中低危人群不再作为主要表现（AHA 认为仅 2%）；\n确诊：2 主要或 1 主要+2 次要+链球菌证据；\n已患风湿性心脏病者复发：1 主要或 2 次要+链球菌证据即可。' },
  { m: '18A', q: '风湿热链球菌抗体检测的时序？', a: 'ASO：感染后 2 周出现，3~5 周达高峰，85% 阳性，6~12 个月转阴；\n抗 DNA 酶 B：第 6~8 周达高峰，持续更久（数月），与 ASO 联合可提高阳性率；\n单项抗体不高不能排除，需动态观察滴度变化。' },
  { m: '18A', q: '风湿热的药物治疗？', a: '清除链球菌：青霉素 V 首选，口服 10 天；苄星青霉素一次肌注（>27kg 用 120 万 U），青霉素过敏者用红霉素；\n心脏炎：泼尼松 2mg/(kg·d)，总疗程 8~12 周，严重用甲泼尼龙冲击；\n关节炎：阿司匹林 80~100mg/(kg·d)，体温正常后渐减；\n舞蹈症：对症支持。' },
  { m: '18A', q: '风湿热的二级预防？', a: '长效青霉素（苄星青霉素）每 3~4 周肌注一次；\n无心脏炎者总疗程至少 5 年，最好到 21 岁；\n有心脏炎但无瓣膜病者至少 10 年；\n有风湿性心脏病者至少 10 年，很多建议终身预防；\n预防期间仍可复发，必须严格执行。' },
  { m: '18A', q: '幼年特发性关节炎（JIA）的 ILAR 分类（7 类）？', a: '① 全身型（sJIA）；② 少关节型；③ 多关节型 RF 阳性；④ 多关节型 RF 阴性；⑤ 银屑病关节炎；⑥ 附着点炎相关关节炎（ERA）；⑦ 未分化型；\n分类目的：指导治疗与预后判断，16 岁以下起病、持续 6 周以上关节炎。' },
  { m: '18A', q: '全身型 JIA（sJIA）的临床特点？', a: '弛张高热（每日体温波动 >2℃，热峰时皮疹明显）；\n短暂、一过性淡红色斑丘疹（热出疹出，热退疹退）；\n关节炎/关节痛（可晚于发热数月出现）；\n可伴肝脾淋巴结肿大、浆膜炎、血白细胞和血小板显著升高；\n最易并发巨噬细胞活化综合征（MAS）。' },
  { m: '18A', q: '少关节型与多关节型 JIA 的对比？', a: '少关节型：4 岁内起病，女:男约 4:1，大关节受累，约 20%~30% 发生慢性虹膜睫状体炎（ANA 阳性者风险更高，需定期裂隙灯检查）；\n多关节型：≥5 个关节，对称性小关节+大关节；\nRF 阳性型：8 岁以上女孩多见，预后较差，易致关节破坏。' },
  { m: '18A', q: '银屑病关节炎与 ERA（附着点炎相关关节炎）？', a: '银屑病关节炎：关节炎+银屑病皮疹/指（趾）炎/指甲凹陷，或一级亲属银屑病；\nERA：男孩多见（6~9:1），8 岁以上起病，下肢大关节+附着点炎（跟腱、足跟痛），HLA-B27 阳性率约 90%；\n可有急性虹膜睫状体炎（但多为急性、疼痛性，与少关节型慢性无痛性不同）。' },
  { m: '18A', q: 'JIA 的治疗药物？', a: 'NSAIDs：一线对症（布洛芬、萘普生）；\n甲氨蝶呤（MTX）：10~15mg/m² 每周一次口服/皮下，是抗风湿基础药；\n生物制剂：TNF-α 抑制剂（依那西普、英夫利西单抗）、IL-6 受体拮抗剂（托珠单抗，用于 sJIA）、IL-1 拮抗剂（阿那白滞素）；\n激素：全身型危重时短期使用，局部关节腔注射可用。' },
  { m: '18A', q: '巨噬细胞活化综合征（MAS）是什么？', a: '噬血细胞性淋巴组织细胞增生症（HLH）在风湿病中的表现；\n以 T 淋巴细胞和巨噬细胞过度活化、细胞因子风暴为特征；\n最常见于 sJIA，也见于 SLE、川崎病等；\n病情凶险，死亡率高（20%~60%），早期识别是关键。' },
  { m: '18A', q: 'MAS 的临床表现与实验室特点？', a: '临床表现：持续高热（常为首发，稽留热）、肝脾淋巴结肿大、全血细胞减少、出血倾向、中枢神经系统症状（嗜睡、头痛、昏迷）；\n实验室：血细胞减低、肝酶迅速升高、纤维蛋白原降低、D-二聚体升高、甘油三酯和 LDH 升高；\n血清铁蛋白显著升高（数千甚至上万 ng/ml）是本病特点之一，可作病情监测指标；\n骨髓/淋巴结/肝脾活检可见吞噬血细胞的巨噬细胞（高度活跃增生）。' },
  { m: '18A', q: 'sJIA 合并 MAS 的 2016 年分类标准？', a: '确诊或疑似 sJIA 的发热患者，符合以下条件可诊断：\n① 铁蛋白 >684ng/ml（必备）；\n② 血小板 ≤181×10⁹/L；\n③ AST >48U/L；\n④ 甘油三酯 >156mg/dl（1.76mmol/L）；\n⑤ 纤维蛋白原 ≤3.6g/L；\n第 1 条必备 + 第 2~5 条中任意 2 条（需除外免疫性血小板减少、传染性肝炎、内脏利什曼病、家族性高脂血症）。' },
  { m: '18A', q: 'MAS 的治疗？', a: '首选大剂量甲泼尼龙冲击：30mg/(kg·d)（最大 1g/d）连用 3~5 天，改口服，可重复；\n激素耐药者用环孢素 A：2~8mg/(kg·d)，重症 12~24 小时即可改善，有学者列为一线；\n2013 年 ACR 推荐方案：激素+钙调磷酸酶抑制剂+阿那白滞素（IL-1）± IL-6 拮抗剂；\n其他：IVIG、VP16、血浆置换（报道较少）。' },
  { m: '18A', q: '风湿热与 sJIA/化脓性关节炎的鉴别要点？', a: '风湿热关节炎：游走性大关节、不留畸形、对阿司匹林反应好，常伴心脏炎和链球菌证据；\nsJIA：弛张热+热出疹出皮疹+显著白细胞升高；\n化脓性关节炎：单关节红肿热痛明显，关节穿刺可确诊；\n白血病关节炎：骨痛明显、血象异常，骨髓检查确诊。' },
  { m: '18A', q: '风湿热时心脏受累的特点？', a: '心脏炎是风湿热最严重表现，决定预后；\n心内膜炎：二尖瓣最常受累（关闭不全杂音），主动脉瓣次之；\n心肌炎：心动过速、心脏扩大、心力衰竭；\n心包炎：心前区痛、心包摩擦音；\n超声心动图可发现亚临床心脏瓣膜反流（2015 标准已纳入）。' },

  // ===== 模块 18B SLE·抗磷脂·肌炎·MCTD·干燥 =====
  { m: '18B', q: '儿童系统性红斑狼疮（SLE）的流行病学与特点？', a: '发病率约（10~20）/10 万，15%~20% 在儿童期发病，约 85% 病例 8 岁后发病；\n儿童 SLE 仅次于 JIA，居儿童全身性结缔组织病第二位；\n女:男约 1:4.3（成人 1:8.5）；\n起病多隐匿，常以发热、皮疹、关节痛或某系统损害为首发，累及多系统多脏器，比成人更重。' },
  { m: '18B', q: 'SLE 的皮肤黏膜表现？', a: '70% 患儿有皮肤症状；\n典型蝶形红斑仅见于 50%：两颊+鼻梁鲜红色/紫红色斑丘疹，边缘清晰，很少累及上眼睑；\n掌跖、指/趾末端红斑；口腔牙龈硬腭软腭红斑、出血点、糜烂溃疡；\n常有脱发、雷诺现象、日光过敏（暴晒后皮疹加重）；\n约 10%~20% 病程中不出现皮疹。' },
  { m: '18B', q: '狼疮肾炎（LN）要点？', a: '临床肾脏受累占 60%~82%，约 22% 发展为肾衰竭，是小儿 SLE 死亡主要原因之一；\n病理采用 2003 年 ISN/RPS 标准分 6 型（I 轻微系膜 → VI 严重硬化），Ⅳ型弥漫增生性最常见且最重；\n表现从无症状蛋白尿/血尿到肾病综合征、急进性肾炎；\n神经精神狼疮发生率 40%~50%，诊断后 1 年内发病约 70%。' },
  { m: '18B', q: 'SLE 的自身抗体谱（重点）？', a: 'ANA：筛选试验，阳性率高但特异性低，周边型（M 型）代表抗 dsDNA，对 SLE 特异性最高；\n抗 dsDNA 抗体：高度特异性，与疾病活动性密切相关；\n抗 Sm 抗体：SLE 标记抗体，特异性最高，但仅 30% 患儿阳性；\n抗 ENA（Sm/RNP/SSA/SSB）抗体谱；\n抗核糖体 P 蛋白抗体与神经精神狼疮相关。' },
  { m: '18B', q: 'SLE 的 1997 年 ACR 分类标准？', a: '11 项中符合 4 项可诊断：\n① 面部蝶形红斑；② 盘状红斑；③ 日光过敏；④ 口腔溃疡；⑤ 关节炎（非畸形性 ≥2 个关节）；⑥ 浆膜炎（胸膜炎/心包炎）；\n⑦ 肾损害（持续蛋白尿 >0.5g/d 或尿蛋白+++，或细胞管型）；⑧ 神经系异常（癫痫/精神症状）；\n⑨ 血液系异常（溶贫+网织红细胞增高+Coombs 阳性，或白细胞 <4.0×10⁹/L，或淋巴细胞 <1500/mm³，或血小板 <100×10⁹/L）；\n⑩ 免疫学异常（LE 细胞/抗 dsDNA/抗 Sm/梅毒血清假阳性）；⑪ ANA 阳性；\n参照 2012 SLICC 和 2019 ACR/EULAR 标准以免漏诊。' },
  { m: '18B', q: 'SLEDAI 评分如何解读？', a: '用于评价疾病活动度：\n0~4 分：基本无活动；5~9 分：轻度活动；10~14 分：中度活动；≥15 分：重度活动；\n8 分项：癫痫发作、精神症状、器质性脑病、视觉受损、脑神经异常、狼疮性头痛、脑血管意外、脉管炎；\n4 分项：关节炎、肌炎、管型尿、血尿、蛋白尿 >0.5g/24h、脓尿；\n高分解项目帮助快速判断病情轻重。' },
  { m: '18B', q: 'SLE 的糖皮质激素与冲击治疗剂量？', a: '一般症状：泼尼松 0.5~1mg/(kg·d)；\n重型（肾/中枢神经/急性溶血）：泼尼松 1.5~2mg/(kg·d)；\n甲泼尼龙冲击：30mg/(kg·d)（最大 1000mg），每日 1 次连用 3~5 天为一疗程，对狼疮危象立竿见影；\n维持量尽量 < 泼尼松 10mg/d，长期用补充钙和维生素 D。' },
  { m: '18B', q: 'SLE 的免疫抑制剂与生物制剂剂量？', a: '环磷酰胺（CTX）冲击：0.5~1g/m²（最大 1g/剂）每月 1 次，连用 6~8 次，可改维持；\n吗替麦考酚酯（MMF）：10~30mg/(kg·d)（最大 2g/d），LN 有效，不良反应较 CTX 轻；\n羟氯喹：5~6.5mg/(kg·d)，控制皮疹光敏感关节症状，每 4~6 个月眼科查视网膜；\n贝利尤单抗（抗 BAFF）：10mg/kg，前 3 次每 2 周一次，随后每 4 周一次，5 岁以上可用；\n利妥昔单抗（抗 CD20）用于难治病例。' },
  { m: '18B', q: 'SLE 的预后？', a: '10 年生存率已达 90%~95%（1955 年 <50%）；\n急性期死因：多脏器严重损害和感染，尤其狼疮肾炎和神经精神狼疮；\n目前感染已代替狼疮肾炎和中枢神经受累成为第一位死因；\n预后不良指征：血肌酐增高、持续尿蛋白 ≥3.5g/24h、肾脏病理慢性指数高。' },
  { m: '18B', q: '新生儿狼疮综合征？', a: '见于患 SLE（或干燥综合征）母亲所生婴儿，母体抗 Ro/SSA、La/SSB 抗体经胎盘传递；\n皮疹：鳞屑状环形红斑（似盘状狼疮），生后数小时至数日出现，数周消退不留痕；\n最严重表现：先天性完全性心脏传导阻滞（CCHB），孕期 22 周可发生，组织学为传导系统纤维化+钙化；\n血液（暂时性白细胞/血小板减少）、肝转氨酶升高、胆汁淤积性黄疸；\n除心脏损害外均为暂时性不需治疗，CCHB 病死率 5%~20%，重者需起搏器。' },
  { m: '18B', q: '抗磷脂综合征（APS）的诊断（2006 悉尼修订标准）？', a: '临床标准（≥1 条）：血管栓塞（任何动脉/静脉/小血管血栓，影像或组织学证实）；怀孕异常（≥10 周不明原因胎死、≥34 周重度子痫/胎盘功能不全早产、或 ≥3 次孕 10 周前自发流产）；\n实验室标准（≥1 条，间隔 ≥12 周两次阳性）：抗心磷脂抗体 IgG/IgM 中高滴度、狼疮抗凝物（LA）、抗 β2GPI 抗体；\n1 条临床+1 条实验室即可确诊；儿童无怀孕表现，诊断参照成人标准更困难。' },
  { m: '18B', q: 'APS 的临床表现与治疗？', a: '表现：血栓形成（儿童以下肢深静脉血栓最常见，动脉血栓多在脑）、血小板减少、网状青斑（80% 患者）、溶血性贫血（Evans 综合征）、心脏瓣膜赘生物；\n原发性 APS 患儿年龄偏小、易动脉血栓（脑血管缺血）；继发性（多继发于 SLE）易静脉血栓；\n治疗：无症状 APL 阳性不需治疗；血栓者肝素/低分子肝素→华法林，静脉血栓 INR 2~3、动脉血栓 INR 3，推荐长期甚至终身抗凝；\n血小板 <50×10⁹/L 禁用抗凝，可用泼尼松+大剂量 IVIG。' },
  { m: '18B', q: '幼年皮肌炎（JDM）的特征性皮疹？', a: '上眼睑或上下眼睑紫红色斑（heliotrope rash 向阳疹）伴轻度水肿——最特征；\nGottron 征：掌指关节、指间关节、跖趾关节伸面紫红色斑丘疹（米粒至绿豆大小），可融合成斑块；\nV 领征：颈部和上胸部 V 字区暗红色斑（日晒部位）；\n甲周毛细血管扩张+瘀点（约 46% 甲床毛细血管扩张症阳性）；\n日晒后皮疹加重或与复发相关。' },
  { m: '18B', q: 'JDM 的肌肉表现与实验室检查？', a: '对称性近端肌无力：上楼困难、不能蹲下、穿衣困难，Gower 征阳性、后滴状征（颈前屈肌无力平卧不能抬头）；\n血清肌酶升高：CK、CPK 最敏感，其次 AST、ALT、ALD、LDH；\n肌酶改变常早于病情变化数周；\n肌电图：肌源性损害（纤颤波、正锐波）；\n肌活检：间质血管周围炎性浸润+血管炎+肌束周围萎缩。' },
  { m: '18B', q: 'JDM 的钙质沉着？', a: '约 25%~50% 患儿出现，是小儿皮肌炎的特殊表现；\n最早可发生于病后 6 个月，也可起病后 10~20 年发生；\n未治疗或治疗不充分、病程迁延者最常见；\n表现为皮下小硬块、关节附近团块、筋膜面片状钙化，可破溃流出白色石灰样物质继发感染；\n危险因素：抗 MJ（NXP-2）、抗 PM-Scl 抗体。' },
  { m: '18B', q: 'JDM 的诊断与治疗？', a: '诊断：典型皮疹+对称性近端肌无力+血清肌酶+肌电图+肌活检（Bohan 标准）；2017 年 EULAR/ACR 评分标准取代 Bohan 标准；\n治疗：泼尼松 2mg/(kg·d) 为首选，总疗程不少于 2 年（死亡原因在激素应用前约 40%，现 90% 可完全缓解）；\n羟氯喹 5~6mg/(kg·d) 治皮疹；MTX 10~15mg/m² 每周一次（激素 2~4 个月无效时加用）；\n危重：甲泼尼龙冲击+大剂量 IVIG；地塞米松可致激素性肌炎应避免。' },
  { m: '18B', q: '混合性结缔组织病（MCTD）的要点？', a: '1972 年 Sharp 提出，特点为同时具有 SLE、JIA、皮肌炎、硬皮病等多种风湿病症状；\n血清学标志：高滴度斑点型 ANA + 高滴度抗核糖核蛋白（抗 u1RNP）抗体（可达 1:1000 以上），抗 Sm、抗 dsDNA 阴性；\n最常见表现：多关节炎（93%）、雷诺现象（85%）、手指腊肠样肿胀；\n最常见并发症：肺动脉高压（与肺间质病变有关），也是最常见死因之一；\n肾脏损害轻（与 SLE 重要鉴别点）。' },
  { m: '18B', q: 'MCTD 的诊断标准？', a: '尚无 ACR 统一标准，对照研究显示 Alarcon-Segovia（1986）和 Kahn（1991）标准敏感性特异性最高：\n血清学标准：抗 u1RNP ≥1:1600（Alarcon）或高滴度 u1RNP+ANA ≥1:1200（Kahn）；\n临床标准 5 条：手肿胀、滑膜炎、肌炎、雷诺现象、肢端硬化；\n确诊：血清学标准+至少 3 条临床标准（必须包括滑膜炎或肌炎）；\n特征性表现总结：雷诺现象+腊肠指+肾脏病变轻+抗 RNP 强阳性。' },
  { m: '18B', q: '干燥综合征（SS）的核心表现？', a: '以外分泌腺体（唾液腺、泪腺）进行性损伤为特征的自身免疫病；\n眼干（干燥性角结膜炎：异物感、砂砾感，Schirmer 试验 ≤5mm/5min）、口干（猖獗齿——牙齿发黑粉末状脱落，腮腺反复肿大）；\n儿童特点：口眼干燥症状常缺乏或出现晚，反复发作的腮腺炎/腮腺肿大是儿童 SS 最常见症状（30%~70%）；\n儿童最常见腺外损害为肾小管间质性病变，以肾小管酸中毒最多见（可致低钾性麻痹）；\n抗 SSA（Ro）阳性率最高，抗 SSB（La）是标记性抗体，90% 患者 RF 阳性。' },
  { m: '18B', q: '干燥综合征 2002 年修订国际分类标准？', a: '6 项中符合 4 项以上（但组织学检查和自身抗体至少 1 项阳性）诊断原发性 SS：\nⅠ 口腔症状 3 中 ≥1（口干 >3 个月、成人后腮腺反复/持续肿大、吞咽干性食物需水帮助）；\nⅡ 眼部症状 3 中 ≥1（眼干 >3 个月、反复砂砾感、每日人工泪液 ≥3 次）；\nⅢ 眼部体征（Schirmer ≤5mm/5min 或角膜染色 ≥4 分）；\nⅣ 组织学：小唇腺灶性淋巴细胞浸润 ≥1 灶（≥50 个淋巴细胞团聚为 1 灶）；\nⅤ 唾液腺受损（涎流率 ≤1.5ml/15min 或腮腺造影/同位素阳性）；\nⅥ 自身抗体：抗 SSA 和/或抗 SSB 阳性；\n需除外头颈部放疗史、丙肝、AIDS、淋巴瘤、结节病、GVH 病。' },
  { m: '18B', q: 'SS 的 2016 ACR/EULAR 评分标准？', a: '纳入标准：至少眼干或口干症状之一；\n排除标准：头颈部放疗、活动性丙肝、AIDS、结节病、淀粉样变、GVH 病、IgG4 相关疾病；\n5 项评分总分 ≥4 诊断原发性 SS：\n① 唇腺活检淋巴细胞 ≥1 灶/4mm²（3 分）；② 抗 SSA 阳性（3 分）；\n③ 至少 1 眼 OSS 评分 ≥5 或 van Bijsterveld ≥4（1 分）；④ 至少 1 眼 Schirmer ≤5mm/5min（1 分）；⑤ 静态唾液流率 ≤0.1ml/min（1 分）；\n敏感性 96%、特异性 95%，尚未在儿童普遍应用。' },

  // ===== 模块 18C 硬皮病·重叠·大动脉炎 =====
  { m: '18C', q: '硬皮病的分类？', a: '按临床表现分两大类：\n系统性硬化症（SSc）：对称性皮肤纤维性增厚变硬+内脏（食管、肺、心、肾）纤维化；\n局灶性硬皮病（LS）：仅皮肤及皮下组织受累；\n儿童期硬皮病的临床模式与成人不同，主要形式是 LS；\n幼年系统性硬化症（JSSc）不常见，但具有最严重的硬化性疾病并发症。' },
  { m: '18C', q: 'JSSc 的临床表现顺序？', a: '起病隐匿，雷诺现象常是最早主诉（可早数年）；\n皮肤按顺序演变：水肿期（非凹陷性肿胀，皮温高可有红晕）→ 硬化期（皮肤蜡样变紧绷，面无表情）→ 萎缩期；\n硬化从双侧对称性肢端（手指背面明显）开始，渐累及颜面、躯干、四肢近端；\n甲周毛细血管扩张/丢失（眼底镜可查）；皮下钙化（肘部、掌指关节、膝）；\n消化道（30%~74%：食管功能障碍、反流、吞咽困难）、肺、心脏、肾脏受累。' },
  { m: '18C', q: 'JSSc 的 2007 年 PRES/ACR/EULAR 分类标准？', a: '主要标准（必需）：近端皮肤硬化/硬结；\n次要标准（≥2 项）：\n皮肤：肢端硬化；\n外周血管：雷诺现象、甲毛细血管异常、指/趾尖溃疡；\n胃肠道：吞咽困难、胃食管反流；\n肾脏：肾危象、新出现肾性高血压；\n心脏：心律失常、心力衰竭；\n呼吸系统：肺纤维化、DLCO 减低、肺动脉高压；\n肌肉骨骼：肌腱摩擦音、关节炎或肌炎；\n神经系统：神经病变、腕管综合征；\n血清学：ANA 阳性+SSc 相关抗体（抗着丝点、抗 Scl-70、抗 RNA 聚合酶等）。' },
  { m: '18C', q: 'JSSc 的治疗与预后？', a: '无统一有效方案，是风湿病中治疗较困难的疾病之一；\n雷诺现象：钙通道阻滞剂硝苯地平 0.2mg/kg 每 8 小时（最大 10mg/剂），严重缺血用静脉类前列腺素，溃疡预防用波生坦；\n间质性肺病：低剂量泼尼松+环磷酰胺；\n皮肤：甲氨蝶呤 15mg/m² 每周一次；\n警惕激素诱发硬皮病肾危象（急进型高血压+急性肾衰），用激素者严密监测血压；\n预后通常优于成人，最常见死因与心肺肾受累有关，心肌病是儿童早期死亡主要原因。' },
  { m: '18C', q: '局灶性硬皮病（LS）的五类亚型？', a: '① 斑块型：最常见、预后最好，卵圆形斑块外周硬化中心苍白，紫红色晕环，多见于躯干；\n② 线型（带状）：儿童青少年最常见亚型，线状条纹从皮肤皮下进展至肌肉骨骼，85%~95% 单侧发病；累及颜面头皮称"刀劈状硬斑病"；\n③ 泛发型：≥3 处解剖部位多发斑块或融合；\n④ 大疱型：可与其他亚型并存，与局部创伤、淋巴回流受阻有关；\n⑤ 深部硬斑病：发病率最低但最易致残，包括嗜酸细胞性筋膜炎等；\n另：儿童致残性全硬化性硬斑病典型发生在 14 岁以前。' },
  { m: '18C', q: '线型硬皮病与深部硬斑病的要点？', a: '线型硬皮病：67% 发病年龄 <18 岁，女:男约 13:1，男女孩均有；\n条纹逐渐硬化，常呈皮节分布，可合并同侧肢体发育障碍、关节挛缩；\n25% 线型患者出现较严重残疾；\n深部硬斑病：上下肢均可受累，常双侧对称，炎症程度比其他亚型更明显；\n44% 深部硬斑病患者出现较严重残疾；\n高滴度 RF 预示严重的皮肤及关节病变。' },
  { m: '18C', q: '重叠综合征（OS）的定义与分型？', a: '同一患者同时或先后患有两种或两种以上自身免疫性疾病（结缔组织病）；\n分三型：Ⅰ型 结缔组织病同时并存；Ⅱ型 不同时间前后重叠或移行型；Ⅲ型 不完全的重叠综合征；\n诊断必须同时符合两种或两种以上结缔组织病的诊断标准（区别于 MCTD：MCTD 不符合任何一种病的完整诊断标准）；\n常见组合：SLE+SSc、SSc+PM/DM、SSc+JIA、SLE+JIA；\n9%~38% 的系统性硬化患者会合并另一种结缔组织病。' },
  { m: '18C', q: '几种常见重叠组合的特点？', a: 'SLE+SSc：病初常为典型 SLE，面部红斑少见，雷诺现象最常见，随后出现泛发皮肤硬化、肺纤维化；较单纯 SSc 发病更早、更易肺动脉高压；\nSSc+PM/DM：皮肤硬化+雷诺+食管蠕动减慢+肺纤维化+近端肌无力，约 1/3 抗 Scl-70 阳性；\nSSc+JIA：JIA 关节表现+雷诺+肢端硬化+肺间质纤维化，抗 Scl-70 及 RF 阳性；\nSLE+JIA：SLE 表现+关节肿痛畸形+高滴度 RF；\n治疗：激素+免疫抑制剂，难治者用 TNF 拮抗剂、利妥昔单抗、IVIG。' },
  { m: '18C', q: '多发性大动脉炎（Takayasu 动脉炎）的概述？', a: '又称缩窄性大动脉炎、高安动脉炎，非特异性大血管炎；\n主要侵犯主动脉及其主要分支（无名、锁骨下、颈、肾动脉），腹主动脉常受累；\n亚洲多见、欧美罕见，好发青年女性，婴幼儿很少见；\n基本病理：慢性渐进性全层动脉炎，节段性分布，内膜增生纤维化、中层弹力纤维断裂，可形成动脉瘤。' },
  { m: '18C', q: '大动脉炎的临床分型？', a: '按病变部位分四型：\n① 头臂动脉型（主动脉弓综合征）：颈动脉椎动脉狭窄闭塞→脑缺血（头昏、眩晕、视力减退、晕厥、卒中），上肢无力发凉，无脉征（颈、桡、肱动脉搏动减弱消失）；\n② 胸主、腹主动脉型：下肢无力、间歇性跛行，肾动脉狭窄→肾血管性高血压（舒张压升高明显）；\n③ 广泛型：兼有前两型，病情多较重；\n④ 肺动脉型：心悸气短、肺动脉瓣区收缩期杂音，肺动脉高压多为晚期并发症；\n儿童常有腹主动脉病变。' },
  { m: '18C', q: '大动脉炎的 2008 年 EULAR/PRINTO/PRES 儿童诊断标准？', a: '前提：主动脉或其主要分支血管造影（含 CT/MR）结果异常；\n加下列 4 条中至少 1 条：\n① 外周动脉搏动减弱伴或不伴肢体间歇性跛行；\n② 双上肢收缩压差 >10mmHg；\n③ 大动脉和/或其分支听诊区可闻及血管杂音；\n④ 高血压（以儿童正常参考范围为依据）；\n鉴别：先天性主动脉缩窄（杂音位置高、限峡部、无炎症表现）、肾动脉纤维肌性结构不良（串珠样改变）、Blau 综合征。' },
  { m: '18C', q: '大动脉炎的治疗？', a: '活动期：泼尼松 0.5~1.0mg/(kg·d)，病情仍反复活动（高热不退、动脉阻塞加重）者甲泼尼龙+环磷酰胺冲击；\n小剂量激素维持可长达 7~10 年；\n控制感染灶（结核抗结核、链球菌清病灶）；\n生物制剂：TNF-α 抑制剂（英夫利西单抗等）、IL-6 抑制剂（托珠单抗）用于难治复发者；\n慢性静止期血管狭窄严重影响功能者：血管成形、支架、搭桥、瓣膜置换等手术。' },

  // ===== 模块 18D 川崎病 =====
  { m: '18D', q: '川崎病的概述与流行病学？', a: '1967 年日本川崎富作首次报道，又称皮肤黏膜淋巴结综合征（MCLS）；\n急性发热出疹性疾病，病理为全身性中、小动脉炎，好发冠状动脉；\n5 岁以下多见（87.4%），高发 6~18 个月婴儿，男:女约 1.8:1；\n北京 <5 岁儿童发病率从 1995 年 18/10 万升至 2009 年 87/10 万，发病率逐年增高；\n未经有效治疗冠状动脉损害发生率达 20%~25%，已取代风湿热成为儿科最常见的后天性心脏病。' },
  { m: '18D', q: '川崎病的病因与发病机制学说？', a: '感染因素：临床表现类似感染（发热皮疹结膜炎口腔炎）、有季节规律（冬春季高峰）、同胞兄妹一周内发病危险增加 10 倍；\n超抗原学说：金黄色葡萄球菌肠毒素、链球菌致热外毒素等以超抗原机制激活 T 细胞；\n热休克蛋白学说：细菌 HSP65 与宿主 HSP63 高度同源，分子模拟致血管自身免疫损伤；\n免疫激活：T 细胞异常活化→分泌 TNF-α、IL-1、IL-6、IFN-γ 等→内皮损伤→血管炎及冠脉瘤；\n易感基因：ITPKC（19q13.2）等。' },
  { m: '18D', q: '川崎病的病理分期（四期）？', a: '基本病理：全身性血管炎，主要累及中等大小动脉，好发冠状动脉；\nⅠ期（1~2 周）：小动脉、小静脉、微血管及周围发炎，大中动脉及其周围发炎，淋巴细胞浸润水肿；\nⅡ期（2~4 周）：小血管炎减轻，以中等动脉炎变为主，冠状动脉全血管炎形成动脉瘤及血栓，单核细胞浸润坏死显著；\nⅢ期（4~7 周）：小血管炎消退，中等动脉发生肉芽肿；\nⅣ期（≥7 周）：急性炎变大多消失，代之以冠状动脉血栓形成、狭窄、梗阻、内膜增厚、动脉瘤瘢痕形成；\n弥漫性间质性心肌炎、心包炎、心内膜炎显著，可波及传导系统。' },
  { m: '18D', q: '川崎病的 6 项主要临床表现？', a: '① 发热：稽留热或弛张热，39~40℃ 以上，持续 7~14 天或更长，抗生素治疗无效；\n② 球结合膜充血：起病 3~4 天出现，双眼非化脓性，热退后消散；\n③ 唇及口腔：口唇充血皲裂，杨梅舌，口腔咽黏膜弥漫充血呈鲜牛肉色；\n④ 皮疹：多形性红斑或猩红热样皮疹，第 1 周出现躯干四肢，无水疱结痂；\n⑤ 手足：急性期手足硬性水肿+掌跖红斑，恢复期指趾端膜状脱皮（特征性表现），指趾甲横沟（Beau 线）；\n⑥ 颈淋巴结肿大：单侧或双侧，直径 ≥1.5cm，坚硬有触痛，表面不红无化脓。' },
  { m: '18D', q: '不典型川崎病的诊断线索？', a: '卡介苗接种处重新出现红斑、硬肿、疱疹或结痂（接种后 3 个月至 3 年内易出现）——对不典型川崎病诊断有重要价值；\n肛周皮肤发红、脱皮；\n婴儿原卡介苗接种处再现红斑；\n血小板显著增多；\nCRP、ESR 明显增加；\n超声心动图冠状动脉扩张或动脉壁灰度增强；\n心脏杂音（二尖瓣关闭不全或心包摩擦音）；\n低蛋白血症或低钠血症。' },
  { m: '18D', q: '川崎病的冠状动脉病变分度与转归？', a: '冠脉瘤定义：冠脉内径 >3mm、形状不规则且局部内径大于附近内径 1.5 倍；\n分四度：正常（0 度）；轻度（Ⅰ度）瘤样扩张局限内径 <4mm；中度（Ⅱ度）4~7mm；重度（Ⅲ度）巨瘤内径 ≥8mm（发生率仅 0.8%，预后不良）；\n最早发病第 3 天即可出现，第 2~3 周检出率最高，多数 3~6 个月内消退，第 8 周后很少出现新病变；\n未经治疗冠脉损害 20%~25%，IVIG 广泛应用后降至 5%~7%（北京 9%）；\n小年龄、远端及梭形瘤更易消退；约 1%~2% 死于心肌梗死或动脉瘤破裂。' },
  { m: '18D', q: '川崎病的诊断标准？', a: '发热 5 天以上，伴下列 5 项中 4 项，排除其他疾病即可诊断：\n① 四肢变化：急性期掌跖红斑手足硬性水肿，恢复期指趾端膜状脱皮；② 多形性皮疹；③ 眼结合膜充血（非化脓性）；④ 口唇充血皲裂+杨梅舌；⑤ 颈部淋巴结肿大（≥1.5cm）；\n5 项中不足 4 项但超声心动图有冠状动脉损害者亦可确诊；\n不完全性（不典型）川崎病：发热 ≥5 天但其他 5 项仅具 2~3 项（占 10%~20%），小婴儿更常见，冠脉并发症危险更大，需查心脏彩超+血沉评估；\n冠脉 Z 值：任何年龄 Z ≥2.5 即认为冠状动脉扩张。' },
  { m: '18D', q: '川崎病的实验室检查？', a: '急性期白细胞增高以中性粒细胞为主伴核左移，半数以上轻度贫血；\nCRP 明显增高可达 100mg/L 以上，血沉第 1 小时可达 100mm 以上；\n血小板早期正常，第 2~3 周明显增多（恢复期）；\n白蛋白减低，高密度脂蛋白降低，纤维蛋白原及 D-二聚体升高；\n免疫学：IgG、IgM、IgA、IgE 和循环免疫复合物升高，IL-6 明显增高，总补体和 C3 正常或增高；\n超声心动图：最重要辅助检查，急性期定期复查（2、4、8 周），8 周正常者半年、1、2、3、5 年仍应复查。' },
  { m: '18D', q: '川崎病的急性期治疗？', a: '阿司匹林：30~50mg/(kg·d) 分 2~3 次，热退后 3 天渐减至 3~5mg/(kg·d)，维持 6~8 周，有冠脉病变时延长直至冠脉恢复正常；\nIVIG：发病后 5~10 天内静脉注射 2g/kg（8~12 小时缓慢输入），可将冠脉瘤风险从 25% 降至 5% 以下，巨大动脉瘤风险降至 1%，应同时合用阿司匹林；\n使用 2g/kg IVIG 者 11 个月内不宜接种麻疹、腮腺炎、风疹和水痘疫苗（活病毒疫苗免疫应答被延迟）；\n长期服阿司匹林者建议接种流感疫苗以防 Reye 综合征。' },
  { m: '18D', q: 'IVIG 无反应型川崎病的定义与处理？', a: '定义：发病 10 天内接受 IVIG 2g/kg（一次或分次）36~48 小时后体温仍 >38℃，或给药 2~7 天后再次发热并符合至少 1 项川崎病诊断标准；\n发生率：日本 22.1%，北京儿童医院 12.8%；\n处理：再追加 1 次 IVIG 2g/kg 是多数学者共识；仍无反应可选糖皮质激素（泼尼松 1~2mg/(kg·d) 清晨顿服 2~4 周渐减）、英夫利西单抗、血浆置换，国外有用 TNF-α 拮抗剂、MTX、环孢素报道；\n同时警惕误诊（类似表现的其他疾病）。' },
  { m: '18D', q: '川崎病恢复期的抗凝与溶栓治疗？', a: '恢复期阿司匹林 3~5mg/(kg·d) 一次服用至血沉血小板恢复正常（一般 8~12 周）；\n小单发冠脉瘤：长期服用阿司匹林 3~5mg/(kg·d) 直到动脉瘤消退或更长，可加双嘧达莫 3~5mg/(kg·d)；\n多发/较大冠脉瘤：无限期阿司匹林+双嘧达莫；\n巨瘤：加用华法林 0.05~0.12mg/(kg·d)（INR 1.5~2.0），易血栓、冠脉狭窄闭塞；\n溶栓（血栓者）：静脉溶栓用 tPA 0.5mg/(kg·h) 静滴 6 小时或尿激酶/链激酶，年长儿建议冠脉内溶栓；小婴儿静脉溶栓。' },
  { m: '18D', q: '川崎病的糖皮质激素使用原则？', a: '一般不作为首选：因可促进血栓形成、增加冠脉病变及冠脉瘤风险、影响冠脉病变修复，也不宜单独应用；\n适用情况：IVIG 治疗无效或存在 IVIG 耐药风险的患儿，早期与阿司匹林+双嘧达莫联用；\n用法：醋酸泼尼松 1~2mg/(kg·d) 清晨顿服，2~4 周逐渐减量停药；\n并发 MAS：首选大剂量激素（甲泼尼龙 30mg/(kg·d) 最大 1g/d 连用 3~5 天）+环孢素 A（2~8mg/(kg·d)）。' },
  { m: '18D', q: '川崎病的心脏手术适应证与随访？', a: '冠脉搭桥适应证：① 严重左心功能不全内科治疗无效；② 冠脉主干闭塞、多支高度闭塞、长段狭窄；\n冠脉瘤切除术及心脏移植报道不多；\n随访：无冠脉病变者出院后 1、3、6 个月及 1~2 年各全面检查一次；未经有效治疗者 10%~20% 发生冠脉病变，每 6~12 个月随访直至冠脉病变消失；\n确诊后至少随访 10~20 年，中危者每 3~5 年心脏评估，高危者每年至少两次全面心脏检查；\n冠脉扩张或冠脉瘤大多病后 2 年内自行消失，但常遗留血管壁增厚和弹性减弱；复发率约 1%~2%。' },
  { m: '18D', q: '川崎病的鉴别诊断（与猩红热、SLE 等）？', a: '猩红热：川崎病皮疹发病 3 天后出现，形态接近麻疹/多形红斑，好发婴幼儿，青霉素无效；\n幼年类风湿病：川崎病发热期较短、皮疹弥漫、手足硬肿掌跖潮红、RF 阴性；\n渗出性多形红斑：眼唇无脓性分泌物及假膜，皮疹无水疱结痂；\nSLE：面部皮疹不显著，白细胞及血小板升高，ANA 阴性，婴幼儿男孩多见；\n急性淋巴结炎：颈淋巴结肿大压痛轻、局部皮肤无红肿、无化脓病灶；\n病毒性心肌炎：冠脉病变不突出、特征性手足改变、高热持续不退；\n麻疹有 Koplik 斑、白细胞减少。' },
  { m: '18D', q: '川崎病的其他系统表现？', a: '神经系统：无菌性脑脊髓膜炎最常见（约 25%，病初 2 周内，脑脊液淋巴细胞轻度增多、糖氯化物正常），可有面神经麻痹（多为外周性）、听力丧失、惊厥；\n消化系统：腹痛、呕吐、腹泻，胆囊积液（亚急性期，可致严重腹痛黄疸），麻痹性肠梗阻、肝大黄疸；\n泌尿系统：尿道炎；\n关节：关节炎；\n极少数急性期发生休克或巨噬细胞活化综合征（MAS）危及生命。' },

  // ===== 模块 18E 血管炎 =====
  { m: '18E', q: '儿童血管炎按血管大小的分类（Chapel Hill）？', a: '大血管炎：多发性大动脉炎（Takayasu）；\n中血管炎：结节性多动脉炎（PAN）、川崎病；\n小血管炎：\n　— 免疫复合物性：过敏性紫癜（IgA 血管炎）、抗 GBM 病；\n　— ANCA 相关性：肉芽肿性多血管炎（GPA/韦格纳）、嗜酸性肉芽肿性多血管炎（EGPA/CSS）、显微镜下多血管炎（MPA）；\n variable 血管炎：白塞病（可侵及动脉和静脉所有大小的血管）。' },
  { m: '18E', q: '结节性多动脉炎（PAN）的概述与病因？', a: '侵犯中、小动脉的系统性坏死性血管炎，受累动脉壁形成小结节和动脉瘤；\n儿童发病高峰 9~11 岁，男女发病率相等；\n病因：与链球菌、乙肝病毒（HBV 相关 PAN 占所有病例 1/3，发生于 HBV 感染后 4 个月内）、丙肝、结核、CMV、细小病毒 B19 感染后的自身免疫反应有关；\n遗传：编码腺苷脱氨酶 2（ADA2）的 CECR1 基因功能丧失性隐性突变与儿童期 PAN 样血管炎相关（DADA2）。' },
  { m: '18E', q: 'PAN 的临床表现与 2008 年 EULAR 诊断标准？', a: '表现：不明原因发热、乏力体重下降；皮肤（斑丘疹样紫癜、网状青斑、沿动脉走行有触痛皮下小结）；肾脏最常受累（60%~80%：高血压、血尿蛋白尿、肾梗死、肾动脉瘤）；消化道（腹痛、出血、穿孔、急性胰腺炎）；约 50% 周围神经受累（麻木、感觉异常）；心血管（心肌炎、心梗）；\n诊断标准：① 必备：组织病理显示中小血管坏死性血管炎，或血管造影见动脉瘤/动脉闭塞；\n② 加以下 5 条中 1 条：皮肤受累（紫癜、网状青斑、触痛皮下小结、皮肤梗死）；肌痛/肌肉触痛；高血压（>P95）；周围神经病变（手套袜套样感觉障碍）；肾脏受累（蛋白尿、血尿、红细胞管型、GFR < 正常的 50%）。' },
  { m: '18E', q: 'PAN 的治疗与鉴别？', a: '轻症无内脏功能不全：单用泼尼松 1~2mg/(kg·d)，提高生存率、降低高血压和肾脏受累；\n激素效果差：加环磷酰胺、硫唑嘌呤或甲氨蝶呤；重症合并动脉瘤：环磷酰胺静脉注射；\n重症：大剂量 IVIG 冲击，血浆置换短期清除免疫复合物（均需同时用激素+免疫抑制剂）；\n有链球菌感染证据者预防性应用青霉素防复发；\n鉴别：早期皮疹与过敏性紫癜类似（皮下结节+多系统受累可鉴别）；肺出血肾炎综合征痰涂片含铁血黄素细胞阳性；WG 有鼻骨破坏和肺结节；嗜酸细胞性筋膜炎嗜酸性粒细胞增高。' },
  { m: '18E', q: '过敏性紫癜（HSP）的概述与病因？', a: '儿童时期最常见的血管炎，又称 Henoch-Schönlein 紫癜、IgA 相关性血管炎；\n侵犯皮肤和其他器官细小动脉和毛细血管的过敏性血管炎，非血小板减少性紫癜；\n四大主征：紫癜样皮疹、关节炎/关节痛、腹痛/消化道出血、肾脏损害；\n<14 岁儿童发病率 135/100 万，男:女 1.4:1，约 90% 患者 10 岁以下，平均 6 岁，秋冬多发；\n病因：多数发病前 1~3 周有上呼吸道感染史（50% 左右有链球菌感染史）；食物/药物/花粉等致敏因素；\n机制：T/B 淋巴细胞活性增强，血清 IgA 升高，大量 IgA 免疫复合物沉积（皮肤、肠道、肾小球血管壁）→ IgA 免疫复合物疾病。' },
  { m: '18E', q: 'HSP 的四大临床表现？', a: '① 皮肤：特征性皮疹为高出皮肤、压之不褪色的可触性紫癜，对称分布、成批出现，多见于下肢远端及踝关节周围、臀部，4~6 周消退不留痕；可合并荨麻疹、血管神经性水肿；\n② 消化道：约 2/3 出现，多在皮疹一周内，阵发脐周绞痛，可有呕吐腹泻、便血呕血（约 1/3 大便潜血阳性），腹痛先于皮疹时易误为急腹症，可并发肠套叠、肠梗阻、肠穿孔；\n③ 关节：大关节（膝、踝）肿痛及触痛，一过性不留畸形；\n④ 肾脏：国内报道 30%~60% 出现肾脏损害，多在紫癜后 2~4 周出现（也可在皮疹消退后），6 个月内出现血尿和/或蛋白尿称紫癜性肾炎，是决定预后的关键。' },
  { m: '18E', q: 'HSP 的 2010 年 EULAR/PRINTO/PRES 诊断标准？', a: '必要条件：皮肤紫癜——分批出现的可触性紫癜（或下肢明显瘀点），无血小板减少；\n加下列至少 1 条：\n① 腹痛：急性弥漫性腹痛，可伴肠套叠或消化道出血；\n② 组织学：典型白细胞碎裂性血管炎，或 IgA 为主的免疫复合物沉积，或 IgA 沉积为主的增殖性肾小球肾炎；\n③ 急性关节炎或关节痛；\n④ 肾脏受累：蛋白尿 >0.3g/24h 或晨尿白蛋白/肌酐比 ≥30mmol/mg；血尿（≥5 红细胞/高倍视野，或尿潜血 ≥2+，或红细胞管型）；\n非典型病例（皮疹出现前已有其他系统症状）易误诊需注意鉴别。' },
  { m: '18E', q: '紫癜性肾炎的临床分型与治疗？', a: '临床分型（国内 2009 试行指南）：孤立性血尿型、孤立性蛋白尿型、血尿和蛋白尿型、急性肾炎型、肾病综合征型、急进性肾炎型、慢性肾炎型；\n肾小球病理分级按 ISKDC：Ⅰ 轻微异常 → Ⅵ 膜增生性肾小球肾炎；\n治疗：单独皮肤关节病变无需激素；激素指征——严重消化道病变（短期泼尼松 1~2mg/(kg·d)）、肾病综合征（泼尼松 1~2mg/(kg·d) 不短于 8 周）、急进性肾炎（甲泼尼龙冲击 20~30mg/(kg·d) 最大 1g，后口服 3~6 个月）；\n免疫抑制剂：CTX 冲击 0.5~1.0g/m² 每月 1 次共 6 次（累积量 ≤200mg/kg）、MMF 20~30mg/(kg·d)、环孢素 A 2~5mg/(kg·d)、硫唑嘌呤；\n双嘧达莫 3~5mg/(kg·d) 抗血小板；急进性肾炎可血浆置换；重症 IVIG 400mg/(kg·d)×2~3 天。' },
  { m: '18E', q: '肉芽肿性多血管炎（GPA/韦格纳）的三联征与抗体？', a: '以上、下呼吸道坏死性肉芽肿性血管炎+肾小球肾炎+其他器官系统性血管炎为特征；\n特征性三联症：鼻窦炎/鼻旁窦炎+肺部浸润+肾脏病变（进行性肾功能衰竭）；\n上呼吸道：持续流涕、鼻黏膜溃疡结痂、鼻出血、鼻中隔穿孔、鞍鼻，中耳炎可致听力丧失（常为患儿第一主诉）；\n肺部：约 79% 患儿病程中出现肺部症状（胸闷、气短、咳嗽、咯血），X 线结节影空洞；\n肾脏：60%~80%（蛋白尿、血尿、管型尿，寡免疫复合物性新月体肾炎），主要死因之一；\n血清学：c-ANCA/PR3-ANCA 高度特异，活动期阳性率 90%~95%；p-ANCA/MPO-ANCA 阳性率约 20% 特异性低；ANCA 阴性不能除外。' },
  { m: '18E', q: '儿童 GPA 的 2008 年分类诊断标准（6 项中 3 项）？', a: '① 组织病理：动脉管壁内、血管周围或血管外有肉芽肿性炎症；\n② 上呼吸道受累：慢性化脓性/出血性鼻分泌物、反复鼻出血、鼻中隔穿孔或鞍鼻畸形、慢性/复发性鼻窦炎；\n③ 喉-气管-支气管狭窄；\n④ 肺部受累：X 线/CT 显示结节影、空洞形成或固定性浸润灶；\n⑤ ANCA 阳性：免疫荧光 c-ANCA 或 ELISA PR3-ANCA 阳性；\n⑥ 肾脏受累：24h 尿蛋白 >0.3g 或晨尿白蛋白/肌酐 >30mmol/mg、血尿或红细胞管型，或坏死性寡免疫复合物性肾小球肾炎；\n治疗：泼尼松 1mg/(kg·d)，危重甲泼尼龙冲击+血浆置换；无器官受累联合 MTX/MMF，有器官受累联合 CTX 或利妥昔单抗，维持 ≥2 年。' },
  { m: '18E', q: '嗜酸性肉芽肿性多血管炎（EGPA/CSS）的要点？', a: '1951 年 Churg 和 Strauss 定义，又称 Churg-Strauss 综合征；\n三阶段：过敏性前驱期（哮喘、过敏性鼻炎、鼻息肉）→ 嗜酸性粒细胞期（嗜酸细胞增多+肺浸润）→ 血管炎期；\n病理三特点：血管炎+嗜酸性粒细胞组织浸润+血管外肉芽肿（并非同时存在）；\n表现：严重哮喘（突出）、外周血嗜酸性粒细胞 ≥10%、周围神经病变（常为突出表现，多发性单神经炎）、肾脏受累不如 GPA/MPA 常见、心脏受累是成人儿童最常见致死原因；\nANCA 阳性率偏低（<50%，儿童约 25%），多为 MPO-ANCA；\nACR 分类标准（≥4 条，敏感性 85% 特异性 99.7%）：哮喘、嗜酸性粒细胞 >10%、过敏病史、单/多神经病、游走性/一过性肺浸润、鼻旁窦异常、血管外嗜酸性粒细胞聚集。' },
  { m: '18E', q: '显微镜下多血管炎（MPA）的要点？', a: '系统性小血管炎：坏死性肾小球肾炎+肺毛细血管炎，血清 ANCA 常阳性；\n2012 年 Chapel Hill 共识命名，与 GPA、EGPA 合称 ANCA 相关性小血管炎（AAV）；\n病理：坏死性小血管炎，无或寡免疫复合物沉积，无肉芽肿形成（区别于 GPA/EGPA 的关键）；\n肾受累几乎 100%（血尿、蛋白尿、肾功能进行性下降，肺肾同受累者 1~5 年内可进展至终末期肾病）；\n肺部：弥漫性肺泡出血（DHA，最严重肺损害，约 1/3 患者无咯血）；\n血清学：p-ANCA/MPO-ANCA 对诊断有特异性，pANCA+MPO-ANCA 同时阳性诊断特异性达 99%；\n儿童好发年龄 9~12 岁，女孩多见。' },
  { m: '18E', q: '三种 ANCA 相关性血管炎的鉴别？', a: 'GPA（韦格纳）：上呼吸道（ENT）病变突出+肺部结节空洞+肾小球肾炎三联征，PR3/c-ANCA 为主，肉芽肿形成；\nEGPA（CSS）：常有哮喘病史+外周血嗜酸性粒细胞明显增加+游走性肺浸润，MPO/p-ANCA 为主，肉芽肿形成；\nMPA：无肉芽肿，突出肾（几乎 100% 受累）+肺泡出血，MPO/p-ANCA 为主；\n鉴别要点：GPA 和 EGPA 受累器官有肉芽肿性炎症，MPA 无；进行性肾功能衰竭在 CSS 不常见；周围神经系统受累常为 CSS 突出特征；\n1/3 抗 GBM 病患者可同时 GBM 抗体+ANCA 阳性（双阳性），常表现为严重肾脏病变。' },
  { m: '18E', q: '白塞病的核心表现？', a: '慢性复发性多系统疾病，基本病理为血管炎，可侵袭循环系统中包括动脉和静脉在内的所有大小血管，又称眼-口-生殖器综合征；\n东亚至地中海地区常见，HLA-B51 密切相关（57%~88% 阳性）；\n① 口腔溃疡：几乎所有患者均有，复发性疼痛性，常为首发症状（舌缘、颊、唇，圆形几毫米至 2cm，黄白色坏死基底，1~3 周愈合）；\n② 生殖器溃疡：男性阴囊、女性大小阴唇，深且痛，复发频率低于口腔溃疡，2~4 周愈合可留瘢痕；\n③ 眼部：葡萄膜炎、视网膜血管炎、眼前房积脓（多在起病 3 年内发生，是失明主要原因）；\n④ 皮肤（80%）：结节性红斑、痤疮样皮疹、假性毛囊炎、血栓性静脉炎；\n⑤ 针刺反应（pathergy test）阳性，特异性较强。' },
  { m: '18E', q: '白塞病的诊断标准？', a: '1990 年国际白塞病研究小组（ISG）标准（敏感性 91% 特异性 96%）：\n反复口腔溃疡（1 年内至少 3 次发作的阿弗他溃疡）+ 下列 4 项中 ≥2 项：\n① 反复外生殖器溃疡；② 眼部病变（前/后葡萄膜炎，玻璃体内有细胞，或视网膜血管炎）；\n③ 皮肤病变（结节性红斑、假性毛囊炎、丘疹性脓疱，或未服激素者的痤疮样结节）；④ 针刺试验阳性；\n儿童共识分类标准（PEDBD）：6 条中 ≥3 条（反复口腔溃疡 1 分、生殖器溃疡 1 分、皮肤病变 1 分、眼部病变 1 分、神经症状除外孤立性头痛 1 分、血管病变动静脉血栓/动脉瘤 1 分）；\n无特异性实验室指标，ANA、ANCA、抗心磷脂抗体均阴性。' },
  { m: '18E', q: '白塞病的治疗？', a: '局部：孤立口腔溃疡、生殖器溃疡局部用类固醇，眼色素膜炎用散瞳剂防粘连；\n秋水仙碱：抑制中性粒细胞趋化，治疗皮肤黏膜损害（尤其结节性红斑）和关节炎，儿童有效；\n沙利度胺：治疗较重皮肤黏膜病变，注意监测神经传导防外周神经病变；\n糖皮质激素：严重口生殖器溃疡、急性眼炎、神经受累、严重血管炎（泼尼松 0.5~1.5mg/kg/d，重症甲泼尼龙冲击 15~30mg/kg 最大 1g×3~5 日）；\n免疫抑制剂（重要脏器损害，常与激素联用）：环磷酰胺、硫唑嘌呤、环孢素 A、甲氨蝶呤；\n生物制剂：TNF-α 拮抗剂（依那西普、阿达木单抗）双盲多中心研究证明有效；\n重症肠白塞并发肠穿孔可手术（术后复发率较高），眼部病变致失明伴持续疼痛可手术。' },
  { m: '18E', q: '肺出血肾炎综合征（Goodpasture 病）的要点？', a: '以快速进展性肾炎+肺出血为特征，抗肾小球基底膜（抗 GBM）抗体致病；\n严格命名限三条件同时具备：肺出血+肾小球肾炎+抗 GBM 抗体阳性；\n机制：产生抗 Ⅳ 型胶原 α3 链非胶原结构域 1[α3(Ⅳ)NC1] IgG 抗体→与肺肾基底膜结合→激活补体经典途径；\n与 HLA-DRB1*1501、*1502 正相关；\n表现：咯血极常见（>90%，重者窒息死亡），痰含铁血黄素细胞；肾脏：急进性肾炎（新月体肾炎，新月体常 >80%），数周至数月进展至尿毒症；少数以肾病起病无肺部受累称抗 GBM 病；\n免疫荧光：IgG、C3 沿基底膜线状沉积（特异性表现）。' },
  { m: '18E', q: '肺出血肾炎综合征的治疗与预后？', a: '病情发展迅速，确诊后立即综合治疗：\n大剂量激素（甲泼尼龙冲击）+免疫抑制剂首选环磷酰胺+血浆置换（去除循环中抗 GBM 抗体）三联；\n建议尽可能在血清肌酐 <600mmol/L（5mg/dl）时开始治疗；\n利妥昔单抗（抗 CD20）有效，可减少激素和 CTX 毒副作用；\n重症尽早血透或肾移植，但不建议对循环抗 GBM 抗体阳性者肾移植；\n预后严重：传统上多在诊断后数周至数月死亡，平均生存期约 15 周；\n高危因素：男性、肌酐 >5.7mg/dl、肾小球系膜增生 >50%、病初需透析者；\n20%~35% 患者抗 GBM 抗体和 ANCA 双阳性，常表现为 GPA/MPA 特征和严重肾脏病变；\n鉴别：特发性肺含铁血黄素沉着症（<16 岁、无性别差异、不引起肾衰）。' },
  { m: '18E', q: '结节性脂膜炎（Weber-Christian 病）的要点？', a: '原发于脂肪小叶的非化脓性炎症，特征为反复发热伴脂膜内局限性炎症性皮下结节或斑块；\n又称特发性小叶性脂膜炎、复发性发热性非化脓性脂膜炎、Weber-Christian 病；\n儿童以男性多见，年长儿和青壮年好发；\n病因：自身免疫（链球菌、支原体、假单胞菌感染诱发）、脂肪代谢障碍、α-1 抗胰蛋白酶缺乏；\n分皮肤型和系统型；\n病理三期：① 急性炎症期（脂肪细胞变性坏死，中性粒细胞为主）；② 巨噬细胞期（组织细胞吞噬脂肪成泡沫细胞/噬脂性巨细胞，有诊断价值）；③ 纤维化期。' },
  { m: '18E', q: '结节性脂膜炎的临床表现与内脏受累？', a: '皮肤：皮下结节为主要特征，多见于四肢（大腿多见）和腹部，成批反复出现，直径 1~2cm（大者 10cm 以上），中等硬度、有明显疼痛和触痛，数周至数月自行消退，消退处皮肤凹陷+色素沉着（脂肪坏死萎缩纤维化所致）；少数结节坏死破溃流出黄棕色油状液体（液化性脂膜炎）；\n全身：不规则或弛张热，先于或同时出现，常伴乏力、恶心呕吐、肌肉关节酸痛，约 10% 患者无发热；\n内脏（系统型）：肝脏最常见（右季肋痛、肝大、黄疸、肝功能异常→门静脉高压、肝性脑病、肝衰竭）；肠系膜/大网膜/腹膜后脂肪受累→反复恶心呕吐、腹痛、腹部包块、肠梗阻、消化道出血；呼吸、心脏、骨髓、肾、中枢神经均可受累；\n实验室：无特异性标志物，ESR/CRP 升高，甘油三酯升高，ANA/RF/ANCA 阴性，补体降低。' },
  { m: '18E', q: '结节性脂膜炎的诊断与治疗？', a: '诊断：反复发作+成批皮下结节，结节疼痛触痛，消退后皮肤凹陷+色素沉着，皮肤结节活检确诊；\n鉴别：感染（细菌、分枝杆菌、真菌、寄生虫）、创伤（寒冷性/人工性脂膜炎）、肿瘤（皮下脂膜样 T 细胞淋巴瘤、白血病）、其他炎症（结节性红斑、狼疮性/皮肌炎性脂膜炎、血管炎、胰腺脂膜炎、α 抗胰蛋白酶缺乏等）；\n一般治疗：去除可疑病因（清除感染灶、停用可疑药物），避免受累部位创伤；\nNSAIDs：萘普生 10~15mg/(kg·d) 分 2 次或布洛芬 20~40mg/(kg·d) 分 3~4 次；\n激素：急性期泼尼松 1.5~2mg/(kg·d)，控制 2 周后渐减，减量/停药后部分病例再发；\n系统型重症：联合免疫抑制剂（MTX、CTX、羟氯喹、来氟米特、硫唑嘌呤、环孢素、MMF），并发 MAS 时甲强龙 15~30mg/kg 冲击；\n预后：系统型累及脏器者预后不良，病死率高。' },
  { m: '18E', q: 'HSP 与特发性血小板减少性紫癜（ITP）等的鉴别？', a: 'ITP：根据皮疹形态、分布及血小板数量鉴别（HSP 血小板正常或升高）；\n外科急腹症：HSP 腹痛剧烈但位置不固定、压痛轻、无腹肌紧张和反跳痛（除非肠穿孔），B 超有利于肠套叠早期诊断；\n细菌感染（脑膜炎双球菌菌血症、败血症、亚急性细菌性心内膜炎）：紫癜中心部位可坏死，一般情况危重，血培养阳性；\n肾脏症状突出时与链球菌感染后肾小球肾炎、IgA 肾病鉴别；\n尚需与 SLE、DIC、溶血尿毒综合征鉴别。' },
