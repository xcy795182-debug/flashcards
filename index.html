  { m: '19B', q: 'HHV-8 与卡波西肉瘤的关系？', a: 'HHV-8（人疱疹病毒 8 型）是卡波西肉瘤（Kaposi 肉瘤）的致病因子；\n卡波西肉瘤多见于 HIV/AIDS 免疫抑制患者；\n也可见于移植后免疫抑制者；\n艾滋病相关性卡波西肉瘤是 AIDS 界定性肿瘤之一。' },
  { m: '19B', q: '人细小病毒 B19 感染的临床表现？', a: '靶细胞为红系祖细胞表面的 P 抗原（糖鞘脂）；\n传染性红斑（第五病）：面颊部潮红（"拍面颊"），四肢花边样网状红斑；\n暂时性再障危象：慢性溶血患儿（如镰状细胞病）感染后红细胞生成骤停，血红蛋白急剧下降；\n宫内感染可致胎儿水肿、流产；\n慢性感染（免疫缺陷者）用 IVIG 0.4g/(kg·d)，5~10 天。' },
  { m: '19B', q: '单纯疱疹病毒（HSV）的分型与潜伏部位？', a: 'HSV-1：主要引起口唇疱疹、龈口炎、脑炎（额颞叶），潜伏于三叉神经节；\nHSV-2：主要引起生殖器疱疹，潜伏于骶神经节；\n新生儿疱疹多由 HSV-2 经产道感染；\n原发感染后病毒终身潜伏，可在劳累、发热、免疫低下时复发。' },
  { m: '19B', q: '新生儿 HSV 感染的三型表现及母亲原发 vs 复发感染风险？', a: '三型：① 皮肤-眼-口型（限局部，预后较好）；② 脑炎型（惊厥、意识障碍）；③ 播散型（累及肝、肺等多器官，未治疗病死率约 90%）；\n母亲原发感染时新生儿感染率 33%~50%，复发感染仅 1%~3%（母传抗体有保护作用）；\n治疗：阿昔洛韦 20mg/kg 静脉 q8h，皮肤眼口型 14 天，CNS/播散型 21 天，继以口服 300mg/(m²·d) 分 3 次，共 6 个月。' },
  { m: '19B', q: 'HSV 脑炎的特点与治疗？', a: '美国儿童散发性脑炎的首位病原；\n病变主要累及额叶、颞叶（出血坏死性脑炎）；\n表现：发热、意识障碍、精神行为异常、惊厥、局灶神经体征；\n尽早（勿等脑脊液结果）阿昔洛韦 30mg/(kg·d) 分 3 次静滴，疗程 14~21 天；\n延误治疗病死率和后遗症明显增加。' },
  { m: '19B', q: '水痘的皮疹特点与传染性？', a: '潜伏期 10~21 天；\n皮疹向心性分布（躯干多、四肢少），同一部位可见斑疹、丘疹、疱疹、结痂各期皮疹同时存在（"四世同堂"）；\n疱疹壁薄易破，周围红晕，瘙痒明显；\n传染性：出疹前 24~48 小时至全部疱疹结痂为止，易感者接触后感染率 >90%。' },
  { m: '19B', q: '水痘的常见并发症？', a: '继发性细菌感染（最常见，A 组链球菌/金黄色葡萄球菌，占 2%~3%，可致脓疱疮、蜂窝织炎、败血症）；\n小脑共济失调：CNS 并发症中最常见（0.5~1.5/1000），表现急性共济失调，预后好；\n肺炎：多见于成人、免疫缺陷者、新生儿；\n脑炎、 Reye 综合征（与用阿司匹林相关，故水痘患儿禁用阿司匹林）。' },
  { m: '19B', q: '水痘的抗病毒治疗与暴露后预防？', a: '口服阿昔洛韦 20mg/kg（最大 800mg）每日 4 次，5~7 天，用于 ≥12 月龄高危者（免疫缺陷、>12 岁、用激素/水杨酸、慢性病）及重症；\n暴露后预防（三选一）：① VZIG 肌注（易感高危者）；② 阿昔洛韦暴露后 8~9 天起用 7 天；③ 暴露后 3 天内接种水痘疫苗；\n疫苗 2 剂优于 1 剂。' },
  { m: '19B', q: '母亲产前感染水痘对新生儿的影响？', a: '母亲于产前 5 天至生后 2 天内发病者，新生儿不能获得母传抗体，可发生重症水痘；\n重症新生儿水痘：播散性皮疹、肺炎、脑炎，病死率最高可达 31%；\n此类新生儿应给予 VZIG 或阿昔洛韦预防/治疗。' },
  { m: '19B', q: '带状疱疹的特点？', a: '潜伏的水痘-带状疱疹病毒（VZV）再激活所致；\n皮疹沿单侧周围神经分布，簇集水疱，一般不超过躯体中线；\n神经痛明显，年长者可遗留带状疱疹后神经痛；\n免疫缺陷患儿可发生播散型（可越过中线、累及内脏）。' },
  { m: '19B', q: '天花的流行病学与皮疹特点（与水痘鉴别）？', a: '1980 年 WHO 宣布全球消灭天花，现已无自然病例（警惕生物恐怖）；\n潜伏期 8~14 天，前驱期 2~4 天骤升 39~40℃；\n皮疹离心性分布（头面、四肢多，躯干少），同期皮疹形态一致（各期皮疹不并存）；\n脓疱期可出现"化脓热"；\n与水痘鉴别核心：天花离心性、各期一致；水痘向心性、"四世同堂"。' },
  { m: '19B', q: '天花的诊断与治疗？', a: '诊断：RT-PCR 检测病毒核酸（痘病毒属特异性 + 正痘病毒种特异性逐级确认）；\n治疗：tecovirimat（ST-246）为 2018 年 FDA 批准的首个抗天花病毒药物；\n对症支持；\n本病按甲类传染病管理意识进行严格隔离。' },

  // ===== 模块 19C 流感·禽流感·腮腺炎·脑炎 =====
  { m: '19C', q: '流感病毒的分型与抗原变异？', a: '正黏病毒科，单股负链 RNA；\n分甲、乙、丙、丁四型（丁型主要感染牛）；\n甲型据 HA（18 个亚型）和 NA（11 个亚型）再分亚型；\n抗原漂移：点突变，甲乙均可发生，引起季节性流行；\n抗原转变：仅甲型，基因节段重配，引起世界大流行。' },
  { m: '19C', q: '流感的临床特点与实验室检查？', a: '潜伏期 1~7 天（平均 2 天）；\n全身症状重（高热、头痛、肌痛、乏力），呼吸道卡他症状轻（与普通感冒相反）；\n婴幼儿表现可不典型（呕吐腹泻、热性惊厥）；\n外周血白细胞正常或减少（合并细菌感染时升高）；\n病原：抗原检测敏感度仅约 50%，核酸检测约 2 小时可出结果。' },
  { m: '19C', q: '流感的并发症有哪些？', a: '继发细菌性肺炎（肺炎链球菌、金黄色葡萄球菌，最常见）；\n神经系统：热性惊厥、脑炎、急性坏死性脑病（丘脑等部位对称性坏死，病死率约 30%）；\n心脏：心肌炎；\n肌肉：肌炎（乙型流感多见，腓肠肌压痛明显）、横纹肌溶解症；\nReye 综合征（与水杨酸应用相关，故禁用阿司匹林）。' },
  { m: '19C', q: '奥司他韦的儿童剂量？', a: '口服，每日 2 次，疗程 5 天：\n体重 <15kg：30mg；\n15~23kg：45mg；\n23~40kg：60mg；\n>40kg：75mg；\n1 岁以下：0~8 月龄 3.0mg/kg，9~11 月龄 3.5mg/kg，均为每日 2 次；\n扎那米韦为吸入剂，用于 ≥7 岁；\n金刚烷胺类已普遍耐药，不推荐。' },
  { m: '19C', q: '流感疫苗的接种策略？', a: '我国批准：三价/四价灭活疫苗（注射），以及减毒活疫苗（鼻喷，批准 3~17 岁）；\n优先接种人群：6~23 月龄婴幼儿、2~5 岁儿童、≥60 岁老人、慢性病者、医务人员、<6 月龄婴儿的家庭成员和看护者、孕妇；\n每年接种（病毒变异）；\n最佳时机为当地流感流行季节前。' },
  { m: '19C', q: '人感染禽流感（H7N9）的特点？', a: '乙类传染病按甲类管理（高致病性禽流感）；\n潜伏期一般 7~10 天；\n有禽类接触/活禽市场暴露史；\n病情重：重症肺炎、ARDS、多器官衰竭；\n甲型流感通用抗原检测阳性率低，确诊需核酸检测；\n尽早（48 小时内）使用神经氨酸酶抑制剂。' },
  { m: '19C', q: '流行性腮腺炎的临床特点？', a: '副黏病毒科，只有一个血清型；\n潜伏期 2~3 周（平均 18 天）；\n以耳垂为中心的腮腺肿胀：边缘不清，表面不红，触之有弹性、压痛，张口咀嚼及进酸性食物时疼痛加重；\n可双侧先后肿胀；\n血、尿淀粉酶升高（但脂肪酶升高才特异提示胰腺炎）。' },
  { m: '19C', q: '流行性腮腺炎的传染期与隔离？', a: '传染期：腮腺肿胀前 7 天至肿胀后 9 天（传染期长于病程）；\n隔离至腮腺肿胀完全消退；\n集体机构（学校、幼儿园）对密切接触者检疫 3 周；\n疫苗：MMR 2 剂（8 月+18 月）保护率约 90%，单剂约 80%；\n丙种球蛋白无预防效果。' },
  { m: '19C', q: '流行性腮腺炎的并发症？', a: '脑膜脑炎：最常见，多发生于腮腺肿胀前后 2 周，脑脊液淋巴细胞为主、糖氯化物正常；\n睾丸炎：青春期后男性多见，多在腮腺肿胀后 3~13 天，多单侧，约 30%~50% 睾丸萎缩，双侧受累可致不育；\n卵巢炎：青春期后女性；\n感音神经性耳聋：多单侧，常在发病 10 天内出现；\n胰腺炎、肾炎（约 1.14%）、心肌炎（2%~4%）。' },
  { m: '19C', q: '病毒性脑炎脑脊液的共同特点？', a: '细胞数轻中度增高，<10% 病例超过 500/μl；\n早期以中性粒细胞为主，很快转为淋巴细胞为主；\n糖和氯化物正常（糖降低提示细菌性、结核性、真菌性脑膜炎）；\n蛋白轻中度升高；\n脑脊液/血清特异性抗体指数 ≥1.5 提示该病原所致中枢感染。' },
  { m: '19C', q: '流行性乙型脑炎的流行病学？', a: '黄病毒科，虫媒病毒；\n传播媒介：三带喙库蚊；\n主要传染源（扩增宿主）：猪（蚊-猪-蚊循环），人为终末宿主；\n显性感染:隐性感染 = 1:1000~2000；\n发病年龄：1~10 岁占 90%；\n严格季节性：7~9 月为主（约 90% 病例），与蚊密度一致。' },
  { m: '19C', q: '乙脑的临床分期与极期表现？', a: '潜伏期 6~16 天；\n五期：潜伏期→前驱期（约 3 天）→极期（约 7 天）→恢复期（1 个月以上）→后遗症期（半年后仍有）；\n极期表现：高热、意识障碍、惊厥、呼吸衰竭（最常见死因）、脑膜刺激征、颅内高压；\n临床分型：轻型、普通型、重型、极重型（暴发型）。' },
  { m: '19C', q: '乙脑的实验室检查与确诊依据？', a: '血象：白细胞 10~20×10⁹/L，中性粒细胞 >80%；\n脑脊液：细胞 50~500/μl，蛋白稍高，糖正常或略高，氯化物正常；\n确诊：血清或脑脊液抗乙脑病毒 IgM 阳性（病后 3~7 天出现，维持约 3 个月），或双份血清抗体 4 倍升高；\n鉴别：化脑（糖氯化物降低）、结脑（糖氯化物均降低、亚急性）、中毒型菌痢（24 小时内查肛拭/灌肠大便）、脑型疟疾。' },
  { m: '19C', q: '乙脑的治疗要点与预防？', a: '无特效抗病毒药，以对症支持为主：\n高热：物理降温+亚冬眠（氯丙嗪+异丙嗪各 0.5~1mg/kg，每 4~6 小时）；\n惊厥：苯巴比妥钠 5~10mg/kg；\n脑水肿：20% 甘露醇 1g/kg；\n呼衰：保持呼吸道通畅、必要时机械通气；\n预防：减毒活疫苗 SA14-14-2，1 岁初免、2 岁和 7 岁加强，每次 0.5ml；灭活疫苗 6 月龄起。' },
  { m: '19C', q: '森林脑炎（蜱传脑炎）的特点？', a: '由森林脑炎病毒引起，蜱叮咬传播，我国主要见于东北林区；\n流行季节 5~8 月（与蜱活动一致）；\n远东型病死率约 20%；\n特征：弛缓性瘫痪，以颈、肩、上肢肌群为主（抬头困难、上肢下垂），属下运动神经元性瘫痪；\n特异性 IgM 抗体 1 周内出现；\n预防：进入疫区前完成疫苗接种。' },

  // ===== 模块 19D 病毒性肝炎·脊灰 =====
  { m: '19D', q: '五型肝炎病毒的传播途径与临床转归总结？', a: '甲肝、戊肝：粪-口传播，只引起急性感染，不慢性化；\n乙肝、丙肝、丁肝：经血、体液、垂直传播，可慢性化；\n丁肝为缺陷病毒，须依赖乙肝病毒提供 HBsAg 外壳才能复制；\n五型肝炎病毒分属不同科属，无交叉免疫。' },
  { m: '19D', q: '甲型肝炎的流行病学与诊断？', a: 'HAV 为 27nm 无包膜 RNA 病毒；\n潜伏期 14~45 天（平均 30 天）；\n粪-口传播，贝壳类水产品（毛蚶等）可致暴发（1988 年上海甲肝流行 31 万例）；\n诊断：抗 HAV-IgM 急性期阳性率近 100%，3~6 个月消失，是现症感染标志；\n隔离 3 周，托幼机构接触者医学观察 40 天。' },
  { m: '19D', q: '甲肝的被动与主动免疫预防？', a: '疫苗：减毒活疫苗（18 月龄以上，1 剂）；灭活疫苗（2 剂，间隔 6 个月）；\n暴露后预防：接触后 2 周内肌注丙种球蛋白 0.02ml/kg，保护率约 90%（可同时接种疫苗，但须不同部位）；\n一般患者可自愈，以休息、保肝、对症为主，不需抗病毒。' },
  { m: '19D', q: '乙肝病毒颗粒与基因组？', a: 'Dane 颗粒为完整病毒颗粒，直径 42nm；\n基因组为部分双链环状 DNA，约 3.2kb，含 4 个开放读码框（S、C、P、X）；\nS 基因编码 HBsAg 及大中小三种表面蛋白；\nC 基因编码 HBcAg 和 HBeAg（前 C 区）。' },
  { m: '19D', q: '乙肝血清标志物（两对半）的意义？', a: 'HBsAg：现症感染标志；\n抗 HBs：保护性抗体（免疫恢复或疫苗接种后）；\nHBeAg：病毒复制活跃、传染性强；\n抗 HBe：复制减低（前 C 区变异者例外）；\n抗 HBc IgM：急性感染/复制活跃（2~6 个月消失）；\n抗 HBc IgG：既往感染；\n窗口期：HBsAg 已消失、抗 HBs 未出现，仅抗 HBc（可含 IgM）阳性。' },
  { m: '19D', q: '乙肝的母婴垂直传播及阻断？', a: '垂直传播以产时、产后为主（宫内感染约 15%）；\n母亲 HBsAg、HBeAg 双阳性者，婴儿 4~6 月龄感染率 >90%；\n阻断：出生 24 小时内（最好 12 小时内）注射乙肝疫苗 10μg（酵母）+ 乙肝免疫球蛋白 ≥100IU（最迟不超过 1 周），此后按 0-1-6 程序完成疫苗；\n孕妇 HBV DNA >2×10⁵ IU/ml 者，妊娠 24~28 周起口服替诺福韦等抗病毒，产后可停药并母乳喂养。' },
  { m: '19D', q: '乙肝感染时的年龄与慢性化关系？', a: '围产期（母婴垂直）感染：慢性化率约 90%；\n婴幼儿期（1~5 岁）感染：25%~30%；\n6~12 岁儿童：约 10%；\n成人急性感染：<5%；\n故新生儿期免疫预防最关键。' },
  { m: '19D', q: '儿童慢性乙肝抗病毒药物的年龄门槛？', a: '干扰素 α：≥1 岁（3~6MU/m²，皮下注射，每周 3 次，疗程 24~48 周）；\n恩替卡韦：≥2 岁；\n替诺福韦酯（TDF）：≥2 岁且体重 ≥10kg；\n替诺福韦艾拉酚胺（TAF）：≥12 岁且体重 ≥35kg（25mg/d）；\n聚乙二醇干扰素 α-2a：≥5 岁；\nHBV DNA 是病毒复制的直接标志。' },
  { m: '19D', q: '丙型肝炎的流行病学与治疗？', a: 'HCV 属黄病毒属，单股正链 RNA，分 6 个基因型（我国以 1b、2a 型为主）；\n潜伏期 21~180 天（平均 50 天），主要经血传播；\n慢性化率 60%~85%；抗 HCV 不能区分现症与既往感染，HCVRNA 是确诊依据（感染 1~3 周即可检出）；\n儿童急性丙肝自发清除率接近 50%；\n治疗：聚乙二醇干扰素 α + 利巴韦林（1、4 型 48 周，2、3 型 24 周）；目前尚无疫苗。' },
  { m: '19D', q: '丁型肝炎的两种感染形式？', a: '丁肝病毒（HDV）为缺陷病毒，需 HBV 提供 HBsAg 作外壳；\n同时感染（co-infection）：HBV 与 HDV 同时感染，两次 ALT 高峰，多呈自限性；\n重叠感染（superinfection）：慢性 HBV 基础上感染 HDV，70%~90% 慢性化，病情重，可致重症肝炎；\n唯一批准的治疗为 α 干扰素；\n预防依赖乙肝疫苗（无单独丁肝疫苗）。' },
  { m: '19D', q: '戊型肝炎的特点？', a: '粪-口传播，常呈水型暴发流行；\n潜伏期 15~70 天（平均 40 天）；\n孕妇感染病情重：重症肝炎病死率 5%~25%，妊娠晚期最重（可流产、死胎）；\n1986~1988 年新疆戊肝大流行 12 万余例，为世界最大一次戊肝流行；\n无商用疫苗（特异诊断可用抗 HEV-IgM）。' },
  { m: '19D', q: '脊髓灰质炎的流行病学与病毒特点？', a: '脊灰病毒属肠道病毒，分 I、II、III 3 个血清型，型间无交叉免疫（I 型致瘫最多）；\n粪-口传播为主，粪便排毒最长可持续 17 周；\n至少 95% 为隐性感染，瘫痪型仅约占感染者的 0.1%，顿挫型约 4%~8%；\n全球目前仅在阿富汗、巴基斯坦仍有野毒株流行。' },
  { m: '19D', q: '脊髓灰质炎瘫痪型的临床特点？', a: '脊髓型（最常见）：弛缓性瘫痪，不对称，远端重于近端，下肢多于上肢，腱反射减弱/消失，感觉正常；\n可有双峰热（约 1/3 儿童：热退 2~5 天后再次发热进入瘫痪前期）；\n脑干型（延髓麻痹）：吞咽、呼吸、循环障碍，危及生命；\n脑炎型（婴儿）：惊厥为主，呈痉挛性瘫痪，是唯一以惊厥为特征的临床类型；\n与吉兰-巴雷鉴别：GBS 对称性上行性瘫痪、80% 有感觉障碍、蛋白细胞分离、进展可持续 2 周。' },
  { m: '19D', q: '脊髓灰质炎的隔离与免疫程序？', a: '隔离 40 天，密切接触者医学观察 20 天；\n我国原程序：2、3、4 月龄各服 1 剂三价 OPV（tOPV），4 岁加强；\n2016-05-01 起全球改用二价 OPV（bOPV，仅 I、III 型）+ IPV 序贯：2 月龄 IPV，3、4 月龄及 4 岁各 1 剂 bOPV（IPV-OPV-OPV-OPV）；\n美国用 IPV 共 4 剂（2、4、6~18 月龄、4~6 岁）；\nOPV 相关麻痹病例（VAPP）：国内约（0.38~0.75）/100 万，严重免疫缺陷者禁用 OPV、可安全使用 IPV。' },

  // ===== 模块 19E 肠道病毒·CMV·EBV =====
  { m: '19E', q: '肠道病毒的共同特点？', a: '小 RNA 病毒科，无包膜、耐酸（胃酸中存活），粪-口传播为主，也可呼吸道传播；\n柯萨奇病毒 A 组：乳鼠接种致广泛性肌炎和弛缓性瘫痪；\n柯萨奇病毒 B 组：致心肌炎、脑脊髓炎、流行性肌痛等；\n包括脊髓灰质炎病毒、柯萨奇病毒、埃可病毒、肠道病毒 68~71 型（新肠道病毒）；\n诊断：双份血清抗体 4 倍升高，或从脑脊液/疱疹液/粪便等标本分离出病毒。' },
  { m: '19E', q: '疱疹性咽峡炎的特点？', a: '病原以柯萨奇病毒 A 组为主；\n好发于夏秋季，多见于 1~7 岁儿童；\n急起高热、咽痛；\n体征：软腭、悬雍垂、腭咽弓等处散在灰白色疱疹（1~2mm），周围红晕，2~3 天破溃成溃疡；\n热程一般 2~4 天，病程 1 周左右，自限性。' },
  { m: '19E', q: '手足口病的病原与皮疹特点？', a: '病原：肠道病毒 71 型（EV-A71）、柯萨奇病毒 A16（亦见 A6、A10）；\n好发于 5 岁以下儿童；\n皮疹：口腔黏膜（舌、颊黏膜、硬腭）+ 手、足、臀等部斑丘疹/疱疹，3~7mm，不痒、不痛、不留疤（"四不"）；\n柯萨奇 A6/A10 感染可致大疱样皮损及病后脱甲；\nEV-A71 是引起重症和死亡的主要病原。' },
  { m: '19E', q: '手足口病的临床五期经过？', a: '第 1 期 出疹期（普通型）：手、足、口、臀皮疹，可自限；\n第 2 期 神经系统受累期（病程 1~5 天）：重症，精神差、嗜睡、肢体抖动、惊跳，脑膜脑炎表现；\n第 3 期 心肺衰竭前期（病程 5 天内）：危重症，心率增快、呼吸增快、血压升高、出冷汗；\n第 4 期 心肺衰竭期：肺水肿/肺出血、休克，病死率高；\n第 5 期 恢复期。' },
  { m: '19E', q: '手足口病重症的高危因素与早期预警指标？', a: '高危：3 岁以下、病程 3 天内、EV71 感染；\n预警指标：持续高热（>39℃，退热处理效果不佳）；\n精神差、呕吐、肢体抖动、无力；\n安静状态下呼吸增快（30~40 次/分以上）、心率增快（>160 次/分）；\n末梢循环不良；\n外周血 WBC ≥15×10⁹/L；\n血糖 >8.3mmol/L；\n血乳酸 ≥2.0mmol/L。' },
  { m: '19E', q: 'EV-A71 脑干脑炎致神经源性肺水肿的机制与治疗？', a: '机制：病毒侵入脑干（延髓）→ 激活交感神经 → 大量儿茶酚胺释放 → 体循环血管收缩、肺毛细血管静水压升高 → 神经源性肺水肿/肺出血；\n脑干脑炎病死率 10%~20%；\n治疗：大剂量 IVIG 1~2g/kg 用于重症自主神经失调期（肺水肿发生前）；\n对症：控制颅高压、米力农/适当液体管理等。' },
  { m: '19E', q: 'EV71 疫苗的特点？', a: '2015 年 12 月获批（我国自主研发）；\n接种对象：6 月龄~5 岁儿童，2 针，间隔 1 个月，鼓励 12 月龄前完成接种；\n保护效力 >90%（针对 EV-A71 所致手足口病）；\n注意：仅预防 EV-A71 所致感染（我国流行株为 C4a 基因亚型），不能预防其他肠道病毒所致手足口病。' },
  { m: '19E', q: '巨细胞病毒（CMV）的传播途径与先天感染？', a: '疱疹病毒科 β 亚科（HHV-5）；\n传播途径：垂直传播（宫内、产道、母乳）+ 水平传播（唾液、尿液、输血、器官移植）；\n先天感染定义：生后 2~3 周内实验室证实感染；\n发展中国家约 80% 儿童 3 岁前已感染；\n先天感染婴儿唾液、尿液排毒可持续数年。' },
  { m: '19E', q: '先天 CMV 感染的临床表现？', a: '颅内感染（特征性）：小头畸形 + 脑室周围钙化；\n感觉神经性耳聋：有症状先天感染者 25%~50%，无症状者 10%~15%，至少 2/3 至学龄前渐进性加重；\n肝脾肿大、血小板减少性紫癜（" blueberry muffin " 紫癜）；\n脉络膜视网膜炎（有症状先天感染 17%~41%）；\n婴儿淤胆型肝炎：与胆道闭锁难鉴别，脾大明显提示 CMV 肝炎；\n病理：受累细胞核内可见"猫头鹰眼"样包涵体。' },
  { m: '19E', q: 'CMV 感染的诊断注意事项与治疗？', a: '诊断：尿/唾液检出病毒（或 DNA）需谨慎——无症状排毒常见；脑脊液、眼玻璃体液 DNA 阳性才有诊断意义；\n更昔洛韦：5mg/kg 每日 2 次诱导 2~3 周 → 5mg/kg 每日 1 次维持，总疗程 3~4 周；\n中重度症状性先天感染：口服缬更昔洛韦 16mg/kg 每日 2 次，疗程 ≤6 个月（2017 年推荐）；\n毒性：粒细胞/血小板减少，中性粒细胞 ≤0.5×10⁹/L 或降幅 50% 时停药；\n带毒母乳处理：-15℃ 冻存 ≥24 小时 + 62~72℃ 加热 5 秒（巴斯德法）后喂养。' },
  { m: '19E', q: '传染性单核细胞增多症（IM）的三联征与典型表现？', a: 'EB 病毒（EBV）原发感染所致，病毒潜伏于记忆 B 细胞，经唾液传播；\n临床三联征：发热 + 咽峡炎 + 颈淋巴结肿大；\n其他：肝脾肿大（约 50%）、眼睑水肿（约 50%）、皮疹（约 10%）；\n皮疹特点：应用氨苄西林/阿莫西林后约 95% 患儿出现皮疹（故本病禁用氨苄西林类）；\n外周血异型淋巴细胞 ≥10%（即活化的 CD8 细胞毒性 T 细胞，Downey 分三型）。' },
  { m: '19E', q: 'EBV 抗体谱的时序与诊断意义？', a: '时序：抗 VCA-IgM/IgG 最早出现（4~8 周）→ 抗 EA-IgG（3~6 个月）→ 抗 EBNA-IgG（发病 4~6 周后出现，终身维持）；\n原发感染核心证据：VCA-IgM 和/或 VCA-IgG 阳性 + EBNA-IgG 阴性（或 VCA-IgG 低亲和力）；\nEBV-DNA：病程 2 周内达峰，病程 22 天后外周血通常测不到；\n嗜异性凝集试验：青少年阳性率 80%~90%，<12 岁儿童仅 25%~50%（国内儿童价值有限）。' },
  { m: '19E', q: '我国儿童传染性单核细胞增多症的诊断标准？', a: '临床诊断：6 项临床表现（发热、咽峡炎、颈淋巴结肿大、肝大、脾大、眼睑水肿）中满足任意 3 项 + 外周血异型淋巴细胞 ≥10%（或 >6 岁者淋巴细胞 >50%）；\n确诊：上述临床诊断 + 原发性 EBV 感染的实验室证据（VCA-IgM/IgG 阳性而 EBNA-IgG 阴性等）；\n重症可用泼尼松 1mg/(kg·d)（最大 60mg）；\n脾大者避免剧烈运动 2~3 个月（甚至 6 个月），防脾破裂；\n本病为自限性，病死率 1%~2%。' },
  { m: '19E', q: '慢性活动性 EBV 感染（CAEBV）的特点？', a: 'IM 样症状持续或反复 >3 个月；\nEBV 感染的 T/NK/B 细胞克隆性增殖；\n特征性表现：蚊虫叮咬过敏（叮咬处红肿 10~20cm，可起水疱、溃疡）；\n唯一根治方法：异基因造血干细胞移植（Allo-HSCT）；\n未移植者约半数于 4~5 年内死亡；\n预后差的因素：发病年龄 <8 岁、血小板 <12×10⁹/L、T 细胞型。' },

  // ===== 模块 19F 狂犬·出血热·登革·RSV·轮状·诺如 =====
  { m: '19F', q: '狂犬病的病原学与流行病学？', a: '弹状病毒科，病毒颗粒子弹状；\n神经细胞胞质内可见嗜酸性包涵体——内氏小体（Negri body）；\n街毒株（野生）致病力强，固定毒株用于制备疫苗；\n一旦发病病死率近 100%；\n我国传染源 90% 以上为病犬；\n潜伏期通常 20~90 天（95% 在 1 年以内，头面部咬伤潜伏期短至 25~48 天）。' },
  { m: '19F', q: '狂犬病的临床表现？', a: '前驱期：50%~80% 患者有原咬伤部位及其神经支配区疼痛、感觉异常（特异症状）；\n狂躁型（最常见）：高度兴奋、恐惧不安，恐水、恐风、恐光，咽肌痉挛、流涎（儿童 80% 以上为狂躁型）；\n麻痹型（约 20%）：无恐水表现，以肢体弛缓性瘫痪为主，可误诊为 GBS；\n病程一般 6 天以内，死于呼吸循环衰竭。' },
  { m: '19F', q: '狂犬病暴露后的伤口处理与免疫预防？', a: '伤口处理：立即 20% 肥皂水与流动清水交替充分冲洗，尽量敞开、不宜缝合；\n被动免疫：人狂犬病免疫球蛋白 20IU/kg，一半剂量伤口周围浸润注射；\n疫苗（HDCV）：五针法于 0、3、7、14、28 天各肌注 1ml（上肢三角肌）；\n头面、颈、上肢咬伤用七针法；\n病毒沿神经轴浆逆向上行约 12~24mm/d，一旦入脑疫苗无效，故暴露后处理越早越好。' },
  { m: '19F', q: '流行性出血热（肾综合征出血热）的病原与流行病学？', a: '病原：汉坦病毒（布尼亚病毒目），基因组分 L/M/S 三个片段；\n我国两型：野鼠型（黑线姬鼠，汉滩病毒 HTNV，病情重）与家鼠型（褐家鼠，汉城病毒 SEOV，病情轻）；\n传播途径：呼吸道气溶胶为主，其次消化道、破损皮肤伤口、螨媒、垂直传播；\n主要青壮年，儿童约占 3%~7%（儿童可发热期直跳至多尿期）；\n三大主症：发热、出血、肾脏损害；典型五期经过。' },
  { m: '19F', q: '流行性出血热五期经过及发热期表现？', a: '潜伏期 4~46 天（一般 7~14 天）；\n五期：发热期 → 低血压休克期（第 4~6 天起）→ 少尿期（第 5~8 天起，<250ml/m²）→ 多尿期（第 8~12 天起，>400ml/m²，持续 7~14 天）→ 恢复期（1~3 个月）；\n发热期"三痛"：头痛、眼眶痛、腰痛；"三红"：面、颈、上胸部潮红（醉酒貌）；\n蛋白尿为早期最常见表现；\n特征：热退后病情反而加重。' },
  { m: '19F', q: '流行性出血热的实验室检查与治疗原则？', a: '实验室：类白血病反应；异常淋巴细胞第 4~6 天达高峰（重症 >15%）；重症血小板 <50×10⁹/L；\n确诊：抗 HV-IgM 阳性（早期诊断），或双份血清 4 倍升高；\n治疗："三早一就"（早发现、早休息、早治疗、就地治疗）+ 把好三关（休克、出血、肾功能衰竭）；\n预防：灭鼠为中心的综合措施 + 双价灭活疫苗（0、14 天 2 针，1 年加强）。' },
  { m: '19F', q: '登革热的流行病学与发病机制？', a: '黄病毒科，分 4 个血清型；\n传播媒介：伊蚊（埃及伊蚊=城市型，白纹伊蚊=农村型）；\n同型感染免疫维持 1~4 年，异型保护仅数月；\n二次异型感染时发生抗体依赖增强（ADE）→ 登革出血热（DHF）/登革休克综合征（DSS）；\n潜伏期为 3~14 天（平均 4~7 天）。' },
  { m: '19F', q: '登革热的临床表现与重症诊断？', a: '高热 + "三痛"：剧烈头痛、眼眶后痛（"眼冒火"）、骨关节疼痛（"断骨热"）；\n皮疹：四肢躯干充血性皮疹/点状出血疹，可见"红海中的白岛"（散在正常皮肤）；\n双相热（鞍形热曲线）：发热 2~5 天后缓解 1~2 天再发热；\n血象：白细胞减少、血小板减少；\nDHF 诊断：出血表现 + 血浆渗漏（血细胞比容升高 ≥20%）+ 血小板 ≤100×10⁹/L + 束臂试验阳性；\nDSS = DHF + 休克；\n禁用阿司匹林（加重出血），治疗核心是补液纠正血浆外渗。' },
  { m: '19F', q: '呼吸道合胞病毒（RSV）感染的特点？', a: '肺病毒科，不分节段负链 RNA，分 A/B 两亚型（G 蛋白抗原性差异仅 1%~7%），F 蛋白为主要保护性抗原；\n是婴幼儿下呼吸道感染最重要的病原（婴儿毛细支气管炎、幼儿肺炎的首要病因）；\n潜伏期 2~8 天（中位 4~5 天）；\n6~9 月龄初次感染者 25%~40% 波及下呼吸道；\n先流涕 1~3 天，后咳嗽、喘息；排毒可持续 3 周。' },
  { m: '19F', q: 'RSV 感染的高危人群、诊断与预防？', a: '高危：青紫型先心病（曾报道病死率 37%）、早产儿、支气管肺发育不良（BPD）；\n诊断：鼻咽分泌物免疫荧光/ELISA 抗原检测（快速）或 RT-PCR；\n治疗：以对症支持为主，利巴韦林雾化疗效不明确；\n预防：高危儿流行季节肌注 RSV 免疫球蛋白或抗 F 蛋白单克隆抗体（palivizumab/nirsevimab），每 28~30 天 1 次；\n尚无疫苗（1960 年福尔马林灭活疫苗致病情加重事故）。' },
  { m: '19F', q: '轮状病毒肠炎的特点？', a: '呼肠孤病毒科，11 节段双链 RNA，电镜下呈车轮状；\nA 组引起婴幼儿重症腹泻（B 组曾在我国成人中流行）；\n抗原分型：G 型（VP7）和 P 型（VP4），VP6 为组特异性抗原（占病毒蛋白 51%）；\n我国流行高峰为秋冬季（10 月~次年 2 月，"秋季腹泻"），占婴幼儿腹泻 40%~60%；\n潜伏期 24~48 小时；蛋花汤样水便，每日 3~10 余次，先吐后泻，等渗或偏高渗性脱水，病程 3~8 天（平均 5 天）。' },

  { m: '19F', q: '诺如病毒感染的特点？', a: '杯状病毒科（诺瓦克病毒为代表）；\n占散发性/暴发性无菌性胃肠炎的 30%~50%，食物源性病毒性胃肠炎流行 90% 由它引起；\n贝类（牡蛎等）为常见食源；\n感染剂量极低（中位数 18 个病毒颗粒）；\n环境抵抗力极强（pH 2.7 中 3 小时仍有感染性，需 10mg/L 氯才灭活），呕吐物气溶胶可传播；\n潜伏期 10~51 小时（平均 24 小时）；儿童呕吐多于腹泻、成人腹泻多于呕吐；病程 12~60 小时自限。' },

  { m: '19G', q: 'HIV 的传播途径与母婴垂直传播？', a: '传播途径：性接触、血液（输血/血制品/共用针具）、母婴垂直；\n儿童感染以母婴垂直传播为主；\n垂直传播不干预时：发达国家 15%~25%，发展中国家 25%~45%（母乳喂养是差异主因）；\n宫内传播约 25%~35%，分娩期约 70%~75%；\n综合干预（孕产期抗病毒+安全助产+避免母乳+暴露儿预防用药）可使传播率降至 1%~2%。' },

  { m: '20B', q: '凝固酶阴性葡萄球菌（CoNS，表皮葡萄球菌）败血症的特点？', a: '多为导管相关感染，是医院内败血症重要病原；\n血培养易污染，需鉴别：两次或以上血培养分离出同一菌种才可信；\n仅 1 瓶阳性需除外污染后才能诊断。' },
  { m: '20B', q: '革兰阴性杆菌及铜绿假单胞菌败血症的特点？', a: '革兰阴性杆菌败血症：内毒素致病，易发生休克、DIC；\n铜绿假单胞菌败血症：多为院内感染，特征性中心坏疽性皮疹，病死率 63~90%；\n厌氧菌败血症：脆弱类杆菌为主，脓液有腐臭甜味；\n真菌败血症：白念珠菌为主，多脏器小脓肿。' },
  { m: '20B', q: '新生儿败血症的早发型与晚发型？', a: '早发型：生后 7 天内发病，多为母亲垂直传播（产前/产时感染），常合并肺炎；\n晚发型：生后 7 天以后发病，多为产后获得性感染（皮肤、脐部、呼吸道等）。' },
  { m: '20B', q: '血培养采血瓶数、血量及采血时机的要求？', a: '血培养瓶数与阳性率：1 瓶约 65%，2 瓶 >80%，3 瓶 >95%；\n血量是影响阳性率的最大变量，婴幼儿每瓶 1~5 ml，不超过总血量的 1%；\n应在用抗生素前采血，已用药者需注明。' },
  { m: '20B', q: '怀疑败血症时的抗生素使用原则？', a: '一旦怀疑立即开始经验用药，但须先采集血培养（用抗生素前）；\n据年龄、原发感染部位、当地耐药谱选药；\n获知培养及药敏结果后调整为针对性治疗。' },
  { m: '20B', q: '败血症常见病原的经验用药选择？', a: '金黄色葡萄球菌：苯唑西林或头孢唑啉，MRSA 用万古霉素；\n肺炎链球菌/溶血性链球菌：青霉素或头孢曲松；\n革兰阴性杆菌：哌拉西林、三代头孢或美罗培南；\n铜绿假单胞菌：头孢他啶、哌拉西林他唑巴坦或亚胺培南；\nESBL 感染：轻中度用酶抑制剂复合制剂，重症用碳青霉烯类；\n厌氧菌：甲硝唑或克林霉素。' },
  { m: '20B', q: '念珠菌败血症的抗真菌方案与疗程？', a: '首选棘白菌素类：卡泊芬净负荷 70 mg/m²（最大 70 mg），维持 50 mg/m²/d；\n或氟康唑：负荷 12 mg/kg 后 6 mg/kg/d；\n疗程：血培养转阴、症状缓解后再用 2 周。' },
  { m: '20B', q: '败血症抗生素的停药指征？', a: '体温正常、临床症状消失后 7 天停药；\n具体尚需结合病原种类、感染灶清除情况（如金黄色葡萄球菌、革兰阴性杆菌疗程更长）。' },

  // ===== 模块 20C 化脑总论·流脑 =====
  { m: '20C', q: '化脓性脑膜炎（化脑）的流行病学与后遗症？', a: '是全球 <5 岁儿童死亡的重要原因；\n我国 5 岁以下儿童发病率 (6.95~22.3)/10 万；\n存活者约 1/3 留有后遗症（听力损害、智力/运动障碍、癫痫等）。' },
  { m: '20C', q: '不同年龄化脑最常见的病原菌？', a: '新生儿：大肠埃希菌（K1 荚膜）、B 族链球菌（GBS）、金黄色葡萄球菌；\n2 月龄以上：肺炎链球菌、脑膜炎球菌、流感嗜血杆菌（三者占 2/3 以上）。' },
  { m: '20C', q: '化脑脑脊液的典型改变？', a: '外观混浊或米汤样，压力增高；\n白细胞数百至数万 (500~1000)×10⁶/L 以上，以中性粒细胞为主；\n糖 <2 mmol/L、显著降低；蛋白 >1 g/L、明显增高；氯化物多正常。' },
  { m: '20C', q: '婴幼儿化脑临床表现不典型之处？', a: '前囟紧张（饱满）见于 50~70%；\n脑膜刺激征可不明显；\n可仅表现为发热、拒食、吐奶、烦躁、嗜睡、凝视、尖叫、前囟饱满、惊厥等非特异症状。' },
  { m: '20C', q: '化脑并发硬脑膜下积液的要点？', a: '多见于 1 岁以内、肺炎链球菌及流感杆菌脑膜炎，发生率 10~60%；\n诊断：硬脑膜下穿刺液 >2 ml、蛋白 >0.4 g/L；\n颅骨透照法：光圈宽度未成熟儿 >3 cm、新生儿 >2 cm、2~12 月 >1.5 cm、13~18 月 >0.5 cm 为阳性。' },
  { m: '20C', q: '化脑并发脑室膜炎的诊断标准？', a: '金标准：脑室穿刺脑室液培养阳性；\n临床诊断参考：脑室液白细胞 ≥50×10⁶/L 且以多核为主，糖 <1.6 mmol/L 或蛋白 >0.4 g/L；\n多见于革兰阴性杆菌（大肠埃希菌）脑膜炎，治疗困难、预后差。' },
  { m: '20C', q: '化脑并发脑性低钠血症的机制与处理？', a: '机制：抗利尿激素（ADH）分泌过多致稀释性低钠（抗利尿激素异常分泌综合征）；\n处理：限入量 800~900 ml/m²/d；\n严重低钠用 3% 盐水 6 ml/kg 静脉输注，可提高血钠约 5 mmol/L。' },
  { m: '20C', q: '化脑患儿出院前听力筛查及激素使用？', a: '听力筛查：出院前行耳声发射（OAE）+ 自动听性脑干反应（AABR）；\n地塞米松 0.15 mg/kg 每 6 h 一次，连用 3~5 天，用于 >6 周龄患儿，应在首剂抗生素前 15~30 分钟给予；\n可减轻炎症、降低流感嗜血杆菌脑膜炎的听力损害。' },
  { m: '20C', q: '化脑的经验治疗方案及疗程？', a: '>1 月龄经验治疗：万古霉素 + 头孢曲松（或头孢噻肟）；\n疗程：流感嗜血杆菌 7~10 天，肺炎链球菌 10~14 天，脑膜炎球菌 7 天，金黄色葡萄球菌及肠道革兰阴性杆菌 ≥3 周；\n脑脊液药物浓度应达 MBC 的 10 倍或 MIC 的 10~20 倍；\n注意青霉素脑病：脑脊液青霉素浓度 >8~10 U/ml 可诱发抽搐。' },
  { m: '20C', q: '流行性脑脊髓膜炎（流脑）的病原与流行菌群？', a: '病原：脑膜炎奈瑟菌（Nm），革兰阴性肾形双球菌，需氧、营养要求高；\n按荚膜多糖分 13 个血清群；\n我国流行以 A 群为主（约 95%），B 群检出呈上升趋势；B 群所致病情重、预后差。' },
  { m: '20C', q: '流脑的潜伏期与临床分期？', a: '潜伏期 2~3 天（1~7 天）；\n四期：上呼吸道感染期 → 败血症期（皮肤瘀点瘀斑，见于 70% 患者）→ 脑膜炎期 → 免疫反应期（关节炎等，免疫复合物所致）。' },
  { m: '20C', q: '流脑的临床分型及暴发型（沃-弗综合征）？', a: '普通型、暴发型、慢性败血症型；\n暴发型：多见于儿童，又分休克型（多见于 2 岁以下，内毒素致微循环障碍、DIC、肾上腺出血，即沃-弗综合征 Waterhouse-Friderichsen）、脑炎型（多见于年长儿，脑水肿、脑疝）、混合型；\n慢性型少见，表现为迁延发热、皮疹、关节痛。' },
  { m: '20C', q: '流脑的病原学快速诊断及腰穿注意事项？', a: '瘀点（斑）涂片找革兰阴性双球菌：阳性率 >50%，简便快速，应作为常规；\n腰穿禁忌（脑疝风险）时先静注甘露醇 0.5~1 g/kg 降颅压后再谨慎操作。' },
  { m: '20C', q: '流脑的抗生素治疗选择？', a: '首选磺胺嘧啶（SD）100~150 mg/kg/d 或青霉素 15~20 万 U/kg/d；\n氯霉素 40~50 mg/kg/d：脑脊液浓度最高，耐药少见，用于磺胺/青霉素过敏者，疗程 3~7 天；\n三代头孢（头孢曲松、头孢噻肟）疗效好，目前最常用。' },
  { m: '20C', q: '暴发型流脑的抢救措施？', a: '抗休克：山莨菪碱（654-2）0.5~1 mg/kg（轻）、2~3 mg/kg（重），每 10~15 min 静注，连用 10 次无效则换其他血管活性药；\nDIC：肝素 100 U/kg；\n降颅压：甘露醇 0.5~1 g/kg；\n强心：毒毛花苷 K；\n肾上腺皮质激素短程大剂量使用。' },
  { m: '20C', q: '流脑的隔离、密切接触者预防及疫苗？', a: '隔离：至症状消失；\n接触者预防：服磺胺嘧啶或利福平 20 mg/kg/d ×4 天；\nA 群流脑多糖疫苗：保护率 80% 以上，保护期约 3 年；\n易复发者需警惕补体 C5~C9 缺陷（CH50 <正常 10%）。' },

  // ===== 模块 20D 化脑各论 =====
  { m: '20D', q: '肺炎链球菌脑膜炎的流行病学、预后与复发原因？', a: '病死率 16~37%，存活者 30~52% 留有后遗症；3 岁以下占 66.5%；\n易复发、再发（可数十次），原因分三类：\n① 治疗不彻底；\n② 先天性缺陷：皮毛窦、内耳畸形伴脑脊液耳漏、脑脊膜膨出（再发病例 1/3 有内耳畸形）；\n③ 后天损伤：颅骨骨折、脑脊液鼻漏/耳溢。' },
  { m: '20D', q: '肺炎链球菌脑膜炎按青霉素 MIC 分层的治疗？', a: '青霉素敏感（MIC <0.1 mg/L）：首选青霉素或阿莫西林；\n青霉素耐药但三代头孢敏感（青霉素 MIC >0.1、头孢曲松/噻肟 MIC <2）：首选头孢曲松或头孢噻肟；\n三代头孢耐药（MIC ≥2）：万古霉素 + 利福平；\n疗程 10~14 天。' },
  { m: '20D', q: 'Mollaret 脑膜炎的特点？', a: '良性复发性脑膜炎；\n多见于青少年；\n脑脊液可见大单核样细胞（Mollaret 细胞），体积为白细胞的 4~5 倍；\n发作间期完全正常，有自限倾向，需与细菌性脑膜炎反复发作者鉴别。' },
  { m: '20D', q: 'b 型流感嗜血杆菌（Hib）脑膜炎的病原学与流行病学？', a: 'b 型占侵袭性感染的 90%，毒力源于多核糖磷酸（PRP）荚膜；\n培养需 X、V 因子，巧克力培养基生长，有"卫星现象"（satellitism）；\n好发 3 个月~3 岁（新生儿受母传抗体保护）；\n病死率 3~15%。' },
  { m: '20D', q: 'Hib 脑膜炎的耐药情况、首选治疗与预防？', a: '流感嗜血杆菌对氨苄西林耐药率 58~60%（以产 β-内酰胺酶为主）；\n首选头孢曲松 100 mg/kg/d，每日 1~2 次，疗程 7~10 天；\n激素（地塞米松）可减轻听力损害；\n密切接触者用利福平 20 mg/kg/d ×4 天预防；Hib 疫苗 2 月龄以上接种。' },
  { m: '20D', q: '金黄色葡萄球菌脑膜炎的治疗？', a: '病死率 30% 以上；\nMSSA：首选氟氯西林、萘夫西林或苯唑西林；\nMRSA：万古霉素，利奈唑胺为备选；\n可用 Xpert 等分子检测查 mecA 基因；\n疗程至少 4 周。' },
  { m: '20D', q: '大肠埃希菌脑膜炎的特点与治疗？', a: '多见于新生儿，K1 荚膜株占 80%；\n新生儿血脑屏障不完善、IgM 不能通过胎盘（无先天免疫），故易感；\n疗程 ≥3 周，易并发脑室膜炎，预后差。' },

  // ===== 模块 20E 布鲁氏菌·白喉·破伤风·百日咳 =====
  { m: '20E', q: '布鲁氏菌病的病原学与临床特点？', a: '病原：布鲁氏菌，胞内寄生、革兰阴性小球杆菌，羊种布鲁氏菌毒力最强；\n临床特点：波浪热（wavy-type fever，体温呈波浪状起伏）；\n小儿较成人起病急、病程短。' },
  { m: '20E', q: '布鲁氏菌病的诊断标准与确诊方法？', a: '血清凝集试验（SAT）：效价 1:100（++）及以上，或双份血清 4 倍及以上升高；\n补体结合试验（CFT）：第三周 1:10（++）以上；\n确诊：血液、骨髓或脑脊液培养分离出布鲁氏菌。' },
  { m: '20E', q: '布鲁氏菌病的治疗方案？', a: '疗程均需 6 周：\n8 岁以下：SMZco 8~40 mg/kg/d 分 2 次 + 利福平 10~20 mg/kg/d；\n8 岁以上：多西环素 4 mg/kg/d + 庆大霉素/链霉素或利福平。' },
  { m: '20E', q: '白喉的致病机制与病理特征？', a: '病原：白喉棒状杆菌（携带产毒噬菌体才产毒，tox 基因）；\n外毒素 535 个氨基酸、62 kD，抑制蛋白质合成；\n特征：假膜牢固附着、不易擦去，强行剥离易出血；\n毒素入血引起全身中毒（心肌、神经）。' },
  { m: '20E', q: '白喉的临床分型及常见并发症？', a: '按假膜部位：鼻白喉（多为 <2 岁）、咽白喉（最常见）、喉白喉（呼吸道梗阻、犬吠样咳）；\n并发症：心肌炎最常见（病后 2 周内，亚临床心肌受累达 68%）；神经炎（病后 3~4 周，以咽腭肌麻痹最常见，10 天左右恢复、自限性）。' },
  { m: '20E', q: '白喉抗毒素的用法及抗生素治疗？', a: '白喉抗毒素为特效治疗，尽早使用（迟于 48~72 h 病死率明显升高），用前皮试、必要时脱敏；\n剂量：鼻白喉 1~2 万 IU，咽/喉白喉 2~4 万 IU，鼻咽白喉或起病延迟者 4~6 万 IU，"牛颈"或 >3 天者 8~10 万 IU；\n抗生素：青霉素轻症 5~10 万 U/kg/d、重症 20~40 万 U/kg/d；\n隔离至连续 2 次培养阴性；DPT 基础免疫自 2~3 月龄起。' },
  { m: '20E', q: '白喉假膜与化脓性扁桃体炎渗出物的鉴别？', a: '白喉假膜：灰白色、牢固附着、不易拭去，强行剥离出血；\n化脓性扁桃体炎：黄色渗出物、易拭去、不出血。' },
  { m: '20E', q: '破伤风痉挛毒素（TeNT）的作用机制？', a: '破伤风杆菌为厌氧芽孢菌；\nTeNT 由 100 kD 重链 + 50 kD 轻链组成，轻链为锌内肽酶；\n经逆行轴突运输至脊髓/脑干，阻断抑制性中间神经元释放甘氨酸和 GABA → 去抑制状态，肌肉强直痉挛。' },
  { m: '20E', q: '破伤风的临床表现与分型？', a: '表现：苦笑面容、角弓反张、牙关紧闭，声光触等轻微刺激诱发痉挛，神志始终清楚；\n压舌板试验：敏感度 94%、特异度 100%；\n潜伏期 4~14 天（新生儿 4~7 天）；\n分型：轻型（潜伏期 >14 天）、中型（7~14 天）、重型（<7 天，48 h 内出现痉挛）。' },
  { m: '20E', q: '破伤风的病死率及预防（主动免疫+被动免疫）？', a: '病死率：抗毒素应用前 85%，应用后 10~30%；\n主动免疫：百白破疫苗 3、4、5 月龄基础 + 18 月 + 6 岁加强；\n被动免疫：TAT 1500~3000 U（污染重者 5000~10000 U，皮试/脱敏）；HTIG（人破伤风免疫球蛋白）250 U，不需皮试、半衰期 24 天。' },
  { m: '20E', q: '破伤风的治疗要点？', a: '止痉首选地西泮（阻断毒素作用，需持续给药）；\n清创：3% 过氧化氢冲洗，伤口敞开不缝合；\n抗菌：青霉素 20 万 U/kg/d ×10 天，或甲硝唑 40~50 mg/kg/d；\n频繁抽搐/喉痉挛者行气管切开。' },
  { m: '20E', q: '百日咳的病原与主要致病因子？', a: '病原：百日咳鲍特菌，严格需氧、只感染人；\n主要致病因子：百日咳毒素（PT），由 ptx 基因编码，为鲍特菌唯一产生的毒素；\n潜伏期 2~21 天，平均 7~14 天。' },
  { m: '20E', q: '百日咳的三期临床表现？', a: '卡他期 1~2 周：上感症状，细菌数量达高峰、传染性最强；\n痉咳期 2~6 周：阵发性痉挛性咳嗽，鸡鸣样吸气吼声（"回勾"），咳后呕吐，舌系带溃疡；\n恢复期 2~3 周：咳嗽渐减；\n小婴儿可仅表现为呼吸暂停、窒息，无典型痉咳。' },
  { m: '20E', q: '百日咳的血象特点与确诊方法？', a: '血象：无免疫接种史者白细胞 3~6 万，以淋巴细胞为主；\n确诊：PCR 敏感性 94%、特异性 97%，发病 3 周内最佳；\n培养阳性率仅 15%（发病 2 周内约 80%），临床价值有限。' },
  { m: '20E', q: '百日咳的治疗、隔离与预防？', a: '首选红霉素 40~50 mg/kg/d ×14 天（卡他期用药可阻止进入痉咳期）；\n或阿奇霉素 5 天方案、克拉霉素 7 天；\n我国大环内酯耐药普遍（北京 91.1%），耐药者用 SMZ/TMP；\n隔离 40 天或痉咳开始后 30 天；接触者药物预防 7~10 天；免疫程序 3、4、5 月龄 + 18 月加强；\n全细胞与无细胞疫苗均不能提供终身免疫。' },

  // ===== 模块 20F 链球菌感染 =====
  { m: '20F', q: '链球菌的 Lancefield 分型与 A 族链球菌（GAS）？', a: '按细胞壁 C 抗原分族（Lancefield 分型）；\n90% 人类致病性链球菌为 β 溶血性，主要为 A 族；\nA 族链球菌 = 化脓性链球菌（GAS）。' },
  { m: '20F', q: 'A 族链球菌的主要毒力因子及所致毒素性疾病？', a: 'M 蛋白：主要毒力因子，具抗吞噬作用，与风湿热有交叉抗原；\n致热外毒素 SPE A/B/C：即红疹毒素，致猩红热皮疹；\n溶血素 O：具抗原性，感染后 2~3 周 ASO 滴度升高（抗链球菌溶血素 O 试验）。' },
  { m: '20F', q: '猩红热的皮疹特点？', a: '多见于 3 岁以上；发热后 24 h 内出疹；\n顺序：耳后、颈部、上胸 → 全身；\n皮疹：鸡皮样、砂纸感、压之苍白；\n特征体征：口周苍白圈、帕氏线（皮肤皱褶处横线状压痕）、草莓舌（1~2 天）→杨梅舌/牛肉色舌（2~3 天）；\n1 周末开始脱屑；轻型多、重症少。' },
  { m: '20F', q: 'A 族链球菌感染的并发症及感染部位与并发症的关系？', a: '非化脓性并发症：\n感染后肾小球肾炎：咽峡炎及脓疱疮后均可发生（2~3 周），与 12 型咽炎及 49 型脓疱疮相关；\n风湿热：仅咽部感染后发生（皮肤感染不引起风湿热）；\n化脓性：蜂窝织炎、扁桃体周围脓肿等；\n链球菌中毒性休克综合征（STSS）：病死率 20~30%。' },
  { m: '20F', q: 'A 族链球菌感染的治疗选择及我国耐药现状？', a: '青霉素首选（迄今 GAS 对青霉素无耐药）；\n青霉素 V 250 mg 每日 3 次 ×10 天（国内多用 5~7 天）；\n苄星青霉素单次肌注 60~120 万 U；\n我国 GAS 对大环内酯类耐药率 90% 以上，不宜首选；\n侵袭性感染/坏死性筋膜炎：加大青霉素剂量至 10~20 万 U/kg/d + 克林霉素（抑制 M 蛋白合成）。' },
  { m: '20F', q: 'B 族链球菌（GBS）的定植率与新生儿感染分型？', a: '无乳链球菌；孕妇带菌率国外约 20%，北京 11.7%；\n早发型：生后 7 天内，产科相关，肺炎/败血症为主，生后 12~24 h 发病，占新生儿 GBS 感染 80%；\n晚发型：生后 7 天后，90% 为 Ⅲ 型，以脑膜炎为主。' },
  { m: '20F', q: 'GBS 感染的产时预防措施？', a: '孕 36~37 周筛查 GBS 阳性者产时预防用药；\n产时青霉素：首剂 500 万 U，之后每 4 h 250~300 万 U；\n可预防 60~90% 早发型 GBS 感染。' },
  { m: '20F', q: '新生儿 GBS 感染的抗菌治疗与预后？', a: 'GBS 对青霉素敏感，但 MIC 比 GAS 高 4~10 倍，需大剂量；\n脑膜炎：日龄 7 天内 25~45 万 U/kg/d，7 天以上 45 万 U/kg/d，疗程 3 周；\n病死率 <10%，但脑膜炎存活者 12~30% 遗留严重神经系统后遗症。' },

  // ===== 模块 20G 伤寒·沙门菌·痢疾 =====
  { m: '20G', q: '伤寒的病原、抗原系统与主要致病物质？', a: '病原：伤寒沙门菌，属 D 群沙门菌；\n抗原：O（菌体）抗原、H（鞭毛）抗原、Vi（荚膜）抗原——Vi 抗体用于带菌者调查；\n致病物质：内毒素（主要）。' },
  { m: '20G', q: '伤寒的典型临床表现？', a: '持续高热（稽留热）、玫瑰疹（2~4 mm、压之褪色、以腹部为主）、相对缓脉、肝脾大；\n血白细胞减少、嗜酸粒细胞减少或消失；\n小儿临床表现常不典型（婴幼儿白细胞可不低、相对缓脉不明显）。' },
  { m: '20G', q: '伤寒的并发症及好发时间？', a: '肠出血：病程 2~3 周，5 岁以上，腹泻和脉搏增快为发生先兆；\n肠穿孔：病程第 3 周，5 岁以上，好发回肠末端 30 cm 内，突发右下腹剧痛；\n支气管炎/肺炎：最常见并发症；\n伤寒肝炎：ALT 升高，热退肝大回缩。' },
  { m: '20G', q: '伤寒复发与肥达反应的解读？', a: '复发：退热后 2 周左右再现症状，目前发生率 1~5%；\n肥达反应：第 1 周阳性率仅 50%，第 4 周达 90%；效价 1:160 以上有参考价值；\n动态观察双份血清 O 和 H 抗体同时升高更有价值；\n阴性不能排除伤寒（14.4% 患者效价始终很低，7.8~10% 全程阴性）。' },
  { m: '20G', q: '伤寒的病原学检查与各自阳性率？', a: '血培养：病程第 1 周内阳性率 85%；\n粪便培养：病程 2~3 周阳性率 80%；\n骨髓培养：阳性率最高（阳性时间也最长）；\n玫瑰疹刮取物亦可培养。' },
  { m: '20G', q: '伤寒（沙门菌感染）的抗菌治疗选择？', a: '目前主力：三代头孢（头孢哌酮有效率 97%、头孢曲松 92%）及喹诺酮类（氧氟沙星、环丙沙星 10~15 mg/kg/d，耐药伤寒首选）；\n氯霉素 30~50 mg/kg/d 因耐多药、灰婴综合征、再障等已少用；\nSMZ-TMP 平均 4.5 天退热；\n氨苄西林 100~200 mg/kg/d，疗程 2 周。' },
  { m: '20G', q: '副伤寒的特点及副伤寒丙的特殊表现？', a: '较伤寒：潜伏期短（5~10 天）、热程短、皮疹较多、肠道并发症少；\n副伤寒丙：常出现迁徙性化脓病灶（骨、关节、软组织等）。' },
  { m: '20G', q: '非伤寒沙门菌感染的特点（鼠伤寒沙门菌）？', a: '鼠伤寒沙门菌最重要，多见于 2 岁以内（82.3%），易致院内暴发；\n多重耐药：对氯霉素耐药 66~94%、氨苄西林 84~100%、SMZco 69~98.8%，对三代头孢敏感；\n临床三型：急性胃肠炎型（80%，粪便性状多样化：水样→黏液脓血→血水样）、败血症型（4~25%）、局部感染型；\n脑膜炎型病死率 43~87.5%；\n治疗首选喹诺酮或三代头孢。' },
  { m: '20G', q: '细菌性痢疾的病原、潜伏期与临床特点？', a: '病原：志贺菌 4 群（A 志贺、B 福氏、C 鲍氏、D 宋内），我国儿童以 D 群 > B 群为主；\n志贺毒素 Stx1/Stx2 与重症相关；\n潜伏期数小时~8 天（一般 1~3 天）；\n急性菌痢：发热、腹泻 10~30 次/日、黏液脓血便、里急后重；\n慢性菌痢：病程 >2 个月；\n粪检白细胞 ≥15/HP 并可见红细胞。' },
  { m: '20G', q: '细菌性痢疾的抗菌治疗？', a: '首选环丙沙星 10~15 mg/kg/d（疗程 ≤7 天）；\n重症可选三代头孢。' },
  { m: '20G', q: '中毒型细菌性痢疾的特点与微循环障碍学说？', a: '多见于 3~7 岁；急起高热、惊厥、循环/呼吸衰竭，肠道症状轻——需用 0.9% 温盐水 200 ml 灌肠取便查病原；\n机制：内毒素致急性微循环障碍，分缺血期→淤血期→休克期→DIC 期→器官衰竭期（祝寿河、方鹤松微循环障碍学说）；\n山莨菪碱（654）因此发现和应用，使病死率从 20~30% 降至 1% 以下；\n分型：脑型、休克型、肺型（ARDS）、混合型。' },
  { m: '20G', q: '中毒型痢疾脑型与休克型的治疗要点？', a: '脑型：654-2 0.5~1（轻）至 2（重）mg/kg 静注，每 10~15 min 一次；甘露醇 1 g/kg 降颅压；地西泮 0.3~0.5 mg/kg 止惊；\n休克型：第 1 小时快速扩容 0.9% NaCl 20 ml/kg 于 5~10 min 推注，可重复，总量 40~60 ml/kg；\n感染性休克诊断（2015 共识）：低血压 + 组织低灌注表现 ≥3 条（心率快、皮肤花纹、CRT>3 s、意识改变、尿量 <0.5 ml/kg/h）；\n抗菌用三代头孢。' },

  // ===== 模块 20H 霍乱·炭疽·鼠疫·其他 =====
  { m: '20H', q: '霍乱的病原、分型与流行史？', a: '霍乱弧菌，列为甲类传染病 + 国际检疫传染病；\n只有 O1 群（古典生物型、埃尔托生物型）和 O139 群致病；\n埃尔托型为第 7 次世界大流行的病原。' },
  { m: '20H', q: '霍乱肠毒素（CT）的作用机制与临床特点？', a: 'CT 为 A1B5 结构：B 亚单位结合肠黏膜 GM1 神经节苷脂受体（结合不可逆），A 亚单位激活腺苷酸环化酶 → cAMP 升高 → 肠液大量分泌；\n临床：米泔水样便、喷射性呕吐；\n腓肠肌痉挛（"吊脚痧"）、腹肌痉挛（"绞肠痧"）；\n脱水期出现循环衰竭。' },
  { m: '20H', q: '霍乱的快速诊断、治疗与隔离？', a: '悬滴试验：穿梭样运动；制动试验：加 O1 群血清后运动停止凝集；\n补液是关键：儿童粪便丢失 Na 105/K 25/Cl 90/HCO₃ 30 mmol/L，有尿后才补钾；80% 可口服补液（WHO ORS）；\n抗生素缩短病程：阿奇霉素 20 mg/kg 顿服、环丙沙星或多西环素；\n隔离至粪便培养 3 次阴性；现代病死率已降至 1% 左右。' },
  { m: '20H', q: '炭疽的病原学与炭疽毒素？', a: '炭疽杆菌：竹节状粗大杆菌，有荚膜和芽孢，芽孢抵抗力极强（土壤中可存活数十年）；\n炭疽毒素三组分：保护性抗原（PA）、水肿因子（EF）、致死因子（LF）；\nPA+EF = 水肿毒素；PA+LF = 致死毒素。' },
  { m: '20H', q: '炭疽的临床类型与治疗？', a: '皮肤炭疽占 98%：无痛性焦痂（黑色如炭）为特点；肺炭疽：纵隔增宽；肠炭疽；脑膜炭疽：脑脊液血性、可见竹节状杆菌；\n皮肤炭疽严禁切开、挤压（防播散）；\n青霉素 G 首选：一般 5~10 万 U/kg/d，败血症/肺肠型 20~40 万 U/kg/d ×2 周；\n暴露后预防：疫苗 + 抗生素 60 天；\n病死率：肺炭疽 90%、脑膜型近 100%。' },
  { m: '20H', q: '鼠疫的临床类型与病原学诊断（四步试验）？', a: '甲类传染病；腺鼠疫（腹股沟淋巴结最常见，2~4 天达高峰）、肺鼠疫（血痰，"黑死病"）、败血症型；\n经蚤叮咬传播（菌栓反流吸入）；\n四步试验确诊：涂片镜检 + 培养 + 噬菌体裂解试验 + 动物实验；\n首选链霉素 20~30 mg/kg/d；未治腺鼠疫病死率 60~90%。' },
  { m: '20H', q: '兔热病的病原、传播途径与临床？', a: '病原：土拉弗朗西斯菌（土拉杆菌）；\n传播：野兔（食入兔肉）、蜱叮咬；\n溃疡腺型最常见（50~80%）：皮肤溃疡 + 引流区淋巴结肿大；\n首选链霉素 25~30 mg/kg/d。' },
  { m: '20H', q: '猫抓病的病原与临床特点？', a: '病原：汉赛巴尔通体（Bartonella henselae），5~14 岁儿童多见，有猫抓咬史；\n表现：局部皮损 → 引流区淋巴结肿大（颈部最多，10~25% 化脓）；\nWarthin-Starry 银染色查菌；\n自限性，治疗用阿奇霉素 5 天方案。' },
  { m: '20H', q: '单核细胞增生李斯特菌病的特点与治疗？', a: 'LM：细胞内寄生的革兰阳性杆菌，耐冷（可在冰箱食物中繁殖），4b 血清型毒力最强；\n传播：经胎盘感染、生冷食物；\n新生儿早发型（败血症、肺炎）/晚发型（脑膜炎，生后 >7 天）；\n孕妇"流感样"表现 + 流产、死胎；\n天然耐药三代头孢（头孢类无效）；\n首选氨苄西林 ± 氨基糖苷类，脑膜炎疗程 14~21 天。' },
  { m: '20H', q: '衣原体的发育周期及沙眼衣原体（CT）围产期感染？', a: '独特发育周期：EB（原体，有感染性）与 RB（始体，有代谢性）；\n沙眼衣原体 CT：围产期垂直传播（20~30% 孕妇宫颈带菌，50% 婴儿获感染）；\n包涵体结膜炎：生后 2 周内发病（胎膜早破者更多）；\n婴儿肺炎：生后 2 周~4 个月无热性肺炎（持续咳嗽、呼吸急促、不发热、肺部湿啰音，X 线肺气肿 + 间质浸润），"双病程"特点；\n诊断金标准：组织培养；治疗：红霉素 50 mg/kg/d ×10~14 天或阿奇霉素（≥8 岁 1 g 单次）。' },
  { m: '20H', q: '肺炎衣原体（CP）与鹦鹉热的特点？', a: '肺炎衣原体 CP：仅一个血清型、只感染人；5~9 岁多见；隐匿起病，常与其他病原混合感染，与哮喘相关；治疗大环内酯类 ≥2 周；\n鹦鹉热：鸟类接触史，高热、剧烈头痛、干咳；治疗四环素或红霉素。' },
  { m: '20H', q: '抗菌药物合理应用的基本原则（8 条）？', a: '① 严格掌握适应证；\n② 病毒感染不用抗菌药；\n③ 针对性选药（最好据病原及药敏）；\n④ 剂量足、疗程够；\n⑤ 防止过敏、毒性及二重感染；\n⑥ 考虑药物吸收与分布（感染部位浓度）；\n⑦ 新生儿肝肾功能特殊、需调整；\n⑧ 依据药动学/药效学（PK/PD）制定方案。' },
  { m: '20H', q: '新生儿禁用的抗菌药物及原因？', a: '氯霉素：灰婴综合征（肝酶不足、代谢受阻）；\n磺胺类：核黄疸/胆红素脑病（置换白蛋白结合胆红素）；\n喹诺酮类：动物软骨损害；\n四环素类：牙齿黄染、骨发育影响，8 岁以下禁用；\n氨基糖苷类、万古霉素：肾、耳毒性；\n呋喃类：G6PD 缺乏者溶血；\nβ-内酰胺类新生儿减量（肾排泄不完善）。' },

  { m: '21A', q: '结核分枝杆菌（MTB）的形态、培养与分型特点？', a: '1882 年 Koch 发现；细长、微弯、两端钝圆、分支状排列，长 2~4μm；\n苯胺类染色后不易被酸性脱色剂脱色，故称抗酸杆菌；\n生长缓慢，分裂繁殖周期 18~22 小时；需氧菌，最适 pH 7.4、PO₂ 100~140 mmHg；营养要求甘油、天冬氨酸/谷氨酸及无机盐；\n分 4 型：人型、牛型、非洲型、鼠型——对人致病主要是人型，其次牛型（饮用病牛乳品，牛型同样可引起结核性脑膜炎）；鼠型不致病。' },

  { m: '21A', q: '结核菌耐药的分类、分子机制及流行病学？', a: '原发耐药：未接触抗结核药即不敏感（儿童多为原发耐药，系耐药菌株传播）；继发耐药：治疗过程中获得；\n耐药基因：INH—katG 或 inhA 突变；RFP—rpoB；SM—rpsL 和 16S rRNA 的 rrs；EMB—embABC 操纵子；PZA—pncA；\n单耐药（RR：仅利福平耐药）；MDR（耐多药）：对两种以上、且必须包括 INH 和 RFP 耐药；\nWHO 估计 2018 年全球新增 MDR/RR 结核约 50 万，治疗成功率仅 56%；我国 2000 年初始耐药率 18.6%、继发耐药率 46.5%。' },
  { m: '21A', q: '非结核分枝杆菌（NTM）病的要点？', a: 'NTM = 分枝杆菌属内除 MTB 复合群和麻风分枝杆菌以外的其他分枝杆菌，已知 154 种；\n传染源来自自然界（水、土壤重要传播途径），无人与人之间传播证据；\n小儿多致周围淋巴结炎（尤其颈部）；\n多数对常用抗结核药物耐药：治疗采用 4~5 种药联合，疗程 18~24 个月或 NTM 培养阴性后至少 12 个月；\nNTM 淋巴结炎主张完全手术切除，彻底切除时可不必加服抗 NTM 药。' },
  { m: '21A', q: '结核病的保护性免疫反应与迟发型变态反应（DTH）？', a: '保护性免疫反应：由细胞免疫介导，致敏 T 细胞在 IL-1、IL-2、IL-12 作用下产生 IFN-γ、TNF-α，活化巨噬细胞杀灭结核菌，局部形成肉芽肿限制感染；\nDTH（迟发型变态反应）：结核菌抗原诱发过量菌负荷、组织坏死和临床症状，干酪坏死为其特征；\n两者密切相关又可分离：刺激抗原不同（r-RNA 介导保护性免疫，结核蛋白和蜡质 D 介导 DTH）；轻度 DTH 与保护性免疫一样具有杀菌功能，过强则致组织破坏、利于播散；\n科赫现象：致敏机体再次受结核抗原攻击时接种部位出现组织坏死。' },

  { m: '21A', q: 'IFN-γ 和 TNF-α 在结核免疫中的作用？', a: 'IFN-γ：激活巨噬细胞，作用举足轻重；缺乏 IFN-γ 基因的小鼠不能控制肺内结核感染；IL-12/IL-23-IFN-γ 通路缺陷者对结核和非结核分枝杆菌易感性增加（可死于 BCG 播散病）；\nTNF-α：对肉芽肿的形成和维持至关重要，是抗结核免疫的关键成分；类风湿关节炎/炎症性肠病患者用抗 TNF 抗体后结核复发危险增加；同时也引起组织坏死、空洞形成和恶病质。' },
  { m: '21A', q: '结核病的 HLA 关联研究（北京儿童医院数据）？', a: 'HLA-B35 与结核病密切相关：相对危险性 7.38%，小儿结核性脑膜炎相对危险性高达 15.21%；\n即携带 HLA-B35 者发生结核病的可能性大 7 倍多、发生结脑大 15 倍多；\nHLA-Ⅱ类基因 DRB1*1501 是各型结核病的易感基因。' },
  { m: '21A', q: '结核病的三种基本病理变化及结核结节构成？', a: '三种基本病理变化：渗出、增殖、坏死，常同时存在；\n增殖性变化：结核结节（肉芽肿）——中心干酪性坏死，周围围绕类上皮细胞和朗汉斯巨细胞，外侧为淋巴细胞浸润和少量成纤维细胞；\n坏死属凝固性坏死：淡黄色、干燥、质硬、形如干酪，称干酪性坏死，含菌量不等可长期休眠，液化后可沿支气管排出或播散形成空洞；\n良性结局：吸收、纤维化、钙化和骨化。' },

  { m: '21B', q: 'PPD 试验的方法、判读标准及意义？', a: '方法：直接注射 0.1 ml（5 U）PPD，48~72 小时后测量硬结平均直径〔（横径+纵径）÷2〕，红晕非特异不作判断指标；属 Ⅳ 型（迟发型）变态反应；\n判读：<5 mm 阴性；5~9 mm 一般阳性；10~14 mm 中度阳性；≥15 mm 或水疱、破溃、淋巴管炎、双圈反应为强阳性；\n意义：中度或强阳性是临床诊断儿童结核病的重要依据；阳性仅表示结核感染，不表示患病及活动性；3 岁以下尤其 1 岁以下未接种 BCG 者阳性即可按活动性结核治疗；强阳性年龄越小越可能是活动性。' },
  { m: '21B', q: '美国 CDC 的 PPD 阳性三切割点标准（2013 修订）？', a: '≥5 mm 为阳性：近期与活动性结核患者接触者、HIV 感染者、胸部影像有陈旧结核纤维钙化灶、器官移植或免疫抑制患者（泼尼松 ≥15 mg/d 持续 >1 个月或 TNF-α 阻滞剂）；\n≥10 mm 为阳性：任何 <4 岁儿童、最近 5 年内来自结核高流行国家、与结核病高危成人有接触；\n≥15 mm 为阳性：无已知结核危险因素的低危人群。' },

  { m: '21B', q: '结核菌素反应减弱或暂时消失（假阴性）的情况？', a: '① 急性传染病（麻疹、百日咳、猩红热、肝炎）后 1~2 个月内；\n② 身体衰弱：重度营养不良、重度脱水、重度水肿；\n③ 严重结核病：粟粒型肺结核、干酪性肺炎、结核性脑膜炎；\n④ 应用肾上腺皮质激素和免疫抑制剂治疗时；\n⑤ 原发或继发免疫缺陷病。' },
  { m: '21B', q: 'γ 干扰素释放试验（IGRAs）的原理与优缺点？', a: '原理：结核感染者体内存在特异效应 T 淋巴细胞，以结核特异抗原 ESAT-6 和 CFP-10 刺激后分泌 IFN-γ，体外检测；两种方法：T-SPOT.TB 和 QuantiFERON-TB Gold In-Tube；\n优点：ESAT-6/CFP-10 仅存在于 MTB 和少数 NTM，不见于任何 BCG 株——不受卡介苗接种和多数 NTM 感染影响，特异性优于 TST；\n缺点：阳性仅表示感染不代表患病；<5 岁儿童及免疫抑制人群不确定结果比例高、需静脉取血、价格贵；WHO 不推荐中低收入国家以 IGRAs 替代 TST 用于疑似儿童结核诊断。' },
  { m: '21B', q: '儿童结核病病原学检查的阳性率与标本采集？', a: '幼儿不会吐痰将痰咽下：用清晨空腹胃洗出液涂片染色或培养，连续 3 次可提高阳性率；\n阳性率：儿童原发灶含菌量少，涂片阳性率一般 <15%、培养阳性率一般 <30%；重症（干酪性肺炎、粟粒型、继发性肺结核）阳性率可达 30%~50%；\n涂片分级（齐-内抗酸染色，观察 300 视野）：阴性；1~8 条/300 视野为阳性；3~9 条/100 视野（+）；1~9 条/10 视野（++）；1~9 条/1 视野（+++）；≥10 条/1 视野（++++）；荧光镜检较光学镜检阳性检出率高 10% 以上。' },
  { m: '21B', q: '结核菌培养与 Xpert MTB/RIF 的要点？', a: '培养：罗氏固体培养需 4~8 周；BACTEC MGIT 960 全自动液体培养（Middlebrook 7H9）阳性时间缩短为 10~14 天，可同时测药敏，但设备昂贵、易污染；\nXpert MTB/RIF：以 rpoB 为靶基因，2 小时内同时检测结核菌 DNA 和利福平耐药；2014 年 WHO 推荐用于所有怀疑儿童结核病的初始诊断试验；儿童肺结核胃液标本汇总敏感性 66%、特异性 98%；脑脊液敏感性 80%、特异性 97%；\nPCR 假阳性最主要原因是实验室污染，假阴性多因技术问题或标本中存在抑制物。' },
  { m: '21B', q: '支气管镜检查在儿童结核病中的价值？', a: '儿童原发肺结核常并发支气管结核，2 岁以下发生率达 55%；\n作用：①观察支气管受压及内膜病变（红肿、溃疡、肉芽、干酪坏死）；②活检及灌洗查病原；③支气管内肉芽摘除解除阻塞、球囊扩张治疗瘢痕狭窄；\n支气管镜下分型：黏膜型、干酪型、管腔型、混合型。' },
  { m: '21B', q: '卡介苗（BCG）接种的对象、方法及保护效果？', a: 'BCG 是毒力很低的牛型结核分枝杆菌，新生儿出生后 3 天内常规接种（出生时未接种者最好 12 月龄内完成，>4 岁不予补种；3 个月以下可直接补种，3 个月以上须 PPD 阴性才补种）；左上臂三角肌上端皮内注射；\n保护效果：接种后头 5 年可达 80%，10~15 年仍可达 59%；WHO 显示对儿童结核病尤其结脑保护力 52%~100%，我国报道对儿童结脑保护力约 80%；\n接种部位腋下淋巴结轻度肿胀（直径不超过 1 cm）约 1~2 个月消退属正常反应。' },
  { m: '21B', q: '卡介苗接种的异常反应、播散性卡介苗病及 HIV 儿童接种策略？', a: '异常反应：局部脓肿或溃疡 >6 个月不愈、淋巴结强反应（>1 cm 热敷，必要时加抗结核药；脓疡抽脓 2~3 次即愈，破溃后 20% PAS 软膏或利福平粉涂敷）；\n播散性卡介苗病：接种后 1~3 个月出现腋下/锁骨下淋巴结肿大破溃，伴肺结核、肝脾结核等；多见于先天性免疫缺陷（IFN-γ 受体/IL-12 通路缺陷、联合免疫缺陷、慢性肉芽肿病等）；\nHIV 儿童：有 AIDS 症状者不接种；结核高流行国家无症状 HIV 感染者仍应接种；美国主张 HIV 阳性婴儿无论有无症状均不接种。' },
  { m: '21B', q: '结核病接触者的观察管理及预防原则？', a: '与活动性肺结核成人接触的儿童均是高危人群，必须结核菌素检查并随访；\n<5 岁尤其未接种 BCG 者：即使 PPD 阴性、无症状且 X 线正常，也应接受异烟肼预防性治疗 3 个月后再行结核菌素检查——仍阴性可停药，转阳则按潜伏结核感染治疗并除外活动性结核；\n控制结核病最有效的武器不是卡介苗，而是发现并治愈痰涂片阳性的肺结核患者（消灭传染源）。' },
  { m: '21B', q: '潜伏结核感染的治疗指征及化学预防方案？', a: '指征（7 条）：①接种过 BCG 但结核菌素最近 2 年内硬结增大 ≥10 mm；②新近由阴性转阳的自然感染儿；③结核菌素强阳性反应的婴幼儿和少年；④阳性并有早期结核中毒症状但肺部 X 线尚正常；⑤阳性且因其他疾病需用肾上腺皮质激素者；⑥阳性的患儿患麻疹和百日咳后；⑦阳性的艾滋病感染者及患儿；\n方案：首选 INH 10 mg/（kg·d）（最大 300 mg/d）顿服 6~9 个月（美国 ATS 建议 HIV 阴性者首选 9 个月方案，INH 最大疗效在 9 个月已达）；或利福平 10~15 mg/（kg·d）×4 个月；或 INH+RFP 联合 3 个月。' },

  // ===== 模块 21C 化疗·药物·耐药 =====
  { m: '21C', q: '结核病化疗的现代观点：病变中三种菌群及对应敏感药物？', a: '① 空洞壁内分裂繁殖活跃菌（10⁷~10⁹）：空洞内 pH 中性，SM 杀菌效果最好，INH、RFP 其次；\n② 闭合干酪病灶内间断繁殖、代谢缓慢菌（10¹~10⁴）：RFP 疗效较好，INH 次之，其他药难发挥作用；\n③ 巨噬细胞内休眠菌（10²~10⁴）：细胞内酸性环境，PZA 有特殊杀灭作用，RFP、INH 亦有较强作用；\n药物浓度达试管内 MIC 10 倍以上起杀菌作用，10 倍以下起抑菌作用。' },
  { m: '21C', q: '全杀菌药、半杀菌药与抑菌药的分类？', a: '全杀菌药：INH 及 RFP——细胞内、外浓度均可达 MIC 10 倍以上，对细胞内外菌均杀灭；\n半杀菌药：SM（细胞外、中性和偏碱性环境杀菌力最强，对细胞内菌无活性）和 PZA（只在酸性环境起作用，对细胞内菌特殊杀灭）；\n抑菌药：乙胺丁醇（EB）、对氨基水杨酸钠（PAS）、氨硫脲等。' },
  { m: '21C', q: '结核病的六大治疗原则？', a: '① 早期治疗：早期菌多繁殖活跃药物易发挥作用，病变易恢复；\n② 剂量适宜：剂量不足致治疗无效并易产生耐药菌；\n③ 联合用药：防止耐药产生（获得性耐药概率 INH 10⁻⁶、RFP 10⁻⁸、PZA 与 SM 各约 10⁻⁵；菌负荷 >10⁶ 即可能含耐药突变株），并针对各种代谢状态细菌选药；\n④ 规律用药：不可随意间断；\n⑤ 坚持全程：消灭持存菌防止复发（短程化疗 6 个月仍须坚持全程）；\n⑥ 分段治疗：强化阶段（短程 2~3 个月，迅速杀灭敏感菌和活跃菌）+ 巩固阶段（短程一般 6 个月，消灭持存菌防复发）。' },
  { m: '21C', q: '小儿一线抗结核药物的剂量与主要副作用？', a: 'INH 10 mg/（kg·d），最大 300 mg/d——肝毒性、末梢神经炎；\nRFP 10~15 mg/（kg·d），最大 450 mg/d——肝毒性、恶心呕吐、流感综合征；\nPZA 25~30 mg/（kg·d）——肝毒性、高尿酸血症、关节痛；\nEB 15~25 mg/（kg·d）——视神经炎、皮疹；\nSM 20~30 mg/（kg·d），最大 0.75 g/d——耳毒性、肾毒性。' },
  { m: '21C', q: '异烟肼（INH）作为小儿化疗首选药物的特点？', a: '① 疗效高：MIC 0.02~0.05 μg/ml，化疗头几天即可杀死病灶中菌群的 90%，杀菌不受环境酸碱度影响；\n② 分子小、通透性强：易透过血脑屏障，脑脊液浓度达血浓度的近 1/3，脑膜炎症时可达血浓度的 90%——对结脑防治有特殊功效；\n③ 副作用少：小儿肝损害发生率仅约 0.5%，剂量 >10 mg/（kg·d）时肝毒性增加；\n④ 价廉方便：口服每日一次顿服。' },
  { m: '21C', q: '利福平（RFP）的特点？', a: '短程化疗的主要药物，杀菌作用发生最快（接触 1 小时即发挥杀菌效力）；\n低浓度抑菌、高浓度杀菌，对细胞内休眠菌亦可杀灭，为全杀菌药；\n机制：抑制结核菌 RNA 聚合酶活性，阻碍 RNA 和蛋白质合成；\n脑膜炎症时脑脊液浓度可增加 4~5 倍；宜早餐前 1 小时顿服（饭后服血浓度低）；\n与 INH 联用为短程化疗最佳联合；主要副作用为肝损害；不可单用（否则产生高耐药菌株）。' },
  { m: '21C', q: '吡嗪酰胺（PZA）的特点？', a: '仅在酸性环境（pH 5.0~5.5）起作用，对巨噬细胞内结核菌有特殊杀灭作用，属半杀菌药；\n脑脊液浓度可近似血浓度，对结脑有效；细胞内休眠菌是结核复发的基础，PZA 对预防复发有重要意义；\nPZA 极易产生耐药，不可单用；高尿酸血症常见但痛风少见；\nINH + RFP + PZA 为最强大灭菌组合。' },
  { m: '21C', q: '链霉素（SM）的特点及现状？', a: '第一个抗结核药物（1944 年）；在细胞外、中性偏碱性环境（pH >8 最强）对繁殖活跃的细胞外菌杀菌，对细胞内菌无活性，为半杀菌药；\n不易通过血脑屏障（脑膜炎时脑脊液浓度仍不足以有效治疗）；对新鲜渗出性病灶和空洞中结核菌作用最强，适于急性血行播散结核；\n毒副作用：听力障碍和耳聋，需电测听监测；可成为 SM 依赖菌，发现耐药应立即停用；\nWHO 已不再推荐链霉素作为儿童淋巴结核和肺结核的一线抗结核药物。' },
  { m: '21C', q: '乙胺丁醇（EB）的特点？', a: '抑菌药，pH 中性时作用最强；WHO 推荐在短程化疗中以 EB 取代 SM 作为一线药物（SM 毒副作用较大）；\n脑膜炎症时脑脊液浓度可达血浓度 20%~40%；常与 INH、RFP 等联合以延缓耐药产生；\n主要副作用为球后视神经炎（视力减退、中心盲点、绿视能力丧失）；剂量减至 15~25 mg/（kg·d）后副作用大大减少。' },
  { m: '21C', q: '二线及新药的特点（利奈唑胺、贝达喹啉、乙硫异烟胺、环丝氨酸、氟喹诺酮）？', a: '利奈唑胺（LZD）：WHO 推荐 MDR-TB 首选 A 组药物；最严重不良反应为神经毒性（周围+视神经）和骨髓抑制，可致乳酸性酸中毒；\n贝达喹啉（Bdq）：抑制结核分枝杆菌 ATP 合成酶，用于 ≥6 岁 MDR-TB；不良反应有 QT 间期延长、转氨酶升高等；\n乙（丙）硫异烟胺（ETH）：INH 衍生物，脑脊液浓度可达血浓度 80%，用于耐药患者；副作用胃肠道反应及肝损害；\n环丝氨酸：副作用惊厥、精神障碍；\n氟喹诺酮（左氧氟沙星、莫西沙星）：抗结核最有效的喹诺酮类，MDR 治疗重要药物；我国限制 18 岁以下使用（软骨发育顾虑），MDR-TB 知情同意下可用。' },
  { m: '21C', q: '各型结核病的短程化疗方案（表21-2）？', a: '结核感染：6H 或 9H；HR 3 个月或 R 4 个月；\n肺结核：2HRZ/4HR；严重时（粟粒肺、干酪性肺炎、支气管结核）2HRZE 或 2HRZS/4~7HR；\n结核性胸膜炎：2HRZ(E)/4~7HR；\n肺外结核（结脑、腹腔结核、骨结核等）：HRZE 或 HRZS 9~12 个月（H 和 R 9~12 个月，E 和 Z 3~6 个月，S 2 个月），WHO 推荐用 E 代替 S；\n异烟肼耐药：RZE 或 RZE+FQ 9~12 个月；RR/MDR-TB 按 WHO 方案。' },
  { m: '21C', q: '耐药结核病的确诊、疑似标准及治疗分组？', a: '确诊：药敏试验或耐药基因检测证实表型/基因型耐药（Xpert MTB/RIF 可直接从标本检测 rpoB 耐药基因实现早期快速诊断）；儿童培养阳性率低，可根据接触成人患者的药敏结果选药；\n疑似：规范一线治疗 2~3 个月无好转或恶化；有不规则治疗史或复发病例；传染源为耐药/可疑耐药患者；\nWHO 药物分组：A 组—氟喹诺酮类、贝达喹啉、利奈唑胺；B 组—氯法齐明、环丝氨酸；C 组—EB、德拉马尼、PZA、乙硫异烟胺、PAS 等；\n儿童 MDR-TB 至少应用 4 种有效药物；可选全部 3 种 A 组药 + 至少 1 种 B 组药；疗程 18~20 个月（轻症 12~15 个月）；贝达喹啉用于 ≥6 岁、德拉马尼用于 ≥3 岁。' },
  { m: '21C', q: '异烟肼单耐药和利福平单耐药结核的治疗？', a: '异烟肼单耐药：推荐 RFP + PZA + EB，病变广泛或结脑时加用一种氟喹诺酮，疗程 9~12 个月；\n高剂量 INH（15~20 mg/kg）可克服 inhA 启动子突变所致的低水平耐药（katG 突变所致高水平耐药无效）；\n利福平单耐药：推荐 INH + PZA + EB + 一种氟喹诺酮，疗程 12~18 个月；\n若 RFP 耐药而其他药物耐药情况未知：因 90% 以上 RFP 耐药菌株合并 INH 耐药，治疗方案与 MDR-TB 一致。' },
  { m: '21C', q: '小儿结核病化疗的注意事项？', a: '① 小儿急性血行播散时最好选用能杀死生长繁殖迅速细菌的药物如 SM；\n② 结核菌繁殖周期 14~22 小时，采用每日 1 次疗法；\n③ 短程化疗方案中 WHO 推荐用 EB 代替 SM（SM 毒副作用大）；EB 有视力副作用，应密切观察并知情同意；\n④ 短程化疗效果取决于：对活跃菌的早期杀菌作用（防耐药）+ 对持存菌的灭菌作用（防复发）；\n⑤ 选药包括强杀菌药（INH、RFP、SM）加灭菌药（RFP、PZA、INH）。' },

  // ===== 模块 21D 肺结核 =====
  { m: '21D', q: '儿童肺结核的五型分类（2018 国家卫生行业标准）？', a: '肺结核占儿童结核病的 80% 以上，五型：\n① 原发性肺结核：包括原发综合征和胸内淋巴结结核，儿童还包括干酪性肺炎和支气管结核；\n② 气管、支气管结核；\n③ 血行播散性肺结核：急性、亚急性和慢性；\n④ 继发性肺结核：浸润性肺结核、结核球、干酪性肺炎、慢性纤维空洞性肺结核、毁损肺；\n⑤ 结核性胸膜炎：干性、渗出性、结核性脓胸。' },
  { m: '21D', q: '原发性肺结核的特点（小儿最常见类型）？', a: '病变发展分四期：浸润进展期、溶解播散期、吸收好转期、硬结钙化期；\n① 机体对结核菌高度敏感性：原发病灶周围出现病灶周围炎（非特异炎症，可完全吸收），常伴多发性浆膜炎、关节炎、疱疹性角膜结膜炎、结节性红斑等过敏表现，结核菌素多强阳性；\n② 淋巴系统广泛受累：颈淋巴结与纵隔淋巴结肿大最显著；\n③ 早期血行播散（第一次菌血症）：25% 可见多个原发灶；约 10% 播散在毛细血管丰富器官形成原发病灶→儿童肺外结核多见；少数成潜伏病灶，为日后成人继发性肺结核的内源性复燃根源；\n④ 愈合方式为钙化。' },
  { m: '21D', q: '原发综合征的组成与 X 线特点？', a: '原发综合征四部分：①肺初染病灶；②支气管淋巴结核；③引导初染灶至淋巴结的淋巴管炎；④初染灶邻近的胸膜炎；\n初染病灶多在肺上叶下部，尤以右侧多见，70% 位于胸膜下；主要发生在肺部占 90%~95%（肠道约 5%）；\nX 线典型表现：哑铃状双极阴影；\n支气管淋巴结结核分肿瘤型（淋巴结高度肿大、边缘锐利）和浸润型（边缘模糊），病变均多见于右侧；患儿结核菌素多强阳性、血沉加速，约 10% 小儿胃液可找到结核分枝杆菌。' },
  { m: '21D', q: '原发综合征淋巴结肿大（肿瘤型）的压迫症状？', a: '支气管交叉处淋巴结肿大：类似百日咳的痉挛性双音咳嗽；压迫或穿孔入支气管：喘息、呼气性或吸气性呼吸困难甚至窒息；\n压迫喉返神经：声音嘶哑；\n压迫静脉：一侧或双侧静脉怒张；\n高度过敏状态小儿可出现结节性红斑和疱疹性结膜炎。' },
  { m: '21D', q: '原发综合征的转归（进展与恶化）？', a: '良性转归：原发灶周围炎或淋巴结周围炎 3~6 个月内吸收；硬结、钙化；可在 2 年内吸收痊愈和钙化；\n恶化（多见于 3 岁以下婴幼儿、初染 6 个月内，病程可迁延 2~3 年）：①原发灶扩大；②出现胸腔积液；③淋巴结-支气管瘘→支气管结核；④原发灶溶解崩溃→支气管播散→干酪性肺炎；⑤原发空洞形成；⑥干酪性肺炎；⑦血行播散→急性粟粒型肺结核或全身粟粒结核病；\n治疗：强化期 HRZ 2~3 个月，继续期 HR 4~6 个月；浸润病变大、中毒症状重或支气管淋巴结结核致呼吸困难时加泼尼松 0.5~1 mg/（kg·d）。' },
  { m: '21D', q: '支气管结核的要点？', a: '发生机制：淋巴结结核病变蚀破支气管壁形成淋巴结-支气管瘘；30%~60% 儿童原发肺结核合并支气管结核（2 岁以下发生率达 55%），易误诊为支气管异物、哮喘和迁延性肺炎；\n表现：咳嗽咳痰咯血；大量干酪样物质突然破溃入支气管可致阵咳、喘息、青紫甚至窒息；\n影像："肺段病变"（局限性肺实变、肺不张或实变-不张），多见于右中叶和右上叶前段；活瓣性阻塞→阻塞性肺气肿或一肺叶不张邻近肺叶肺气肿；长久不恢复可纤维性变、继发支气管扩张；\n支气管镜分型：黏膜型、干酪型、管腔型、混合型。' },
  { m: '21D', q: '干酪性肺炎的要点？', a: '小儿原发性肺结核中最严重的病型之一；大量带结核菌的干酪样物质进入肺组织所致（支气管淋巴结干酪物质破溃入支气管后再吸入）；\n大叶性干酪性肺炎多见于婴幼儿（起病急、高热、严重中毒症状），小叶性多见于较大儿童（较缓、长期低热）；\n影像：大叶性可见大片浓密阴影内有空洞；小叶性两肺散在密度不均团块影，内有蜂窝状空洞或大小不等无壁空洞；\n外周血中性粒细胞明显增多及核左移，痰及胃液可找到结核菌；\n预后不佳，少数就诊过晚可死亡（"奔马痨"，多见于青春期少女）。' },
  { m: '21D', q: '结核性渗出性胸膜炎的要点？', a: '小儿原发性肺结核常并发胸膜炎，以渗出性最多见；3 岁以上占 87.6%，多发生在原发感染 6 个月内；\n起病可急可缓：38~40℃ 高热 1~2 周后渐退为低热，胸痛、咳嗽、气促；积液增多后胸痛渐消失；\n积液：草黄色渗出液，约 3% 呈淡红色血性；胸腔积液结核菌检测阳性率很低（涂片抗酸染色阳性率 <20%）；ADA >40 U/L 对结核性胸膜炎有较高敏感性和特异性（但细菌、支原体感染性胸膜炎 ADA 也可升高）；\n治疗：抗结核 + 胸腔穿刺或引流；糖皮质激素可促使退热、渗液吸收并减少胸膜肥厚和粘连。' },
  { m: '21D', q: '急性粟粒性肺结核的要点？', a: '大量结核菌同时或极短时间进入血流，为全身粟粒结核病在肺部的表现；最多见于婴幼儿初染后 6 个月、特别是 3 个月内；麻疹、百日咳、营养不良常为诱因；\n临床分型：肺型（31.5%，多见于婴幼儿）、伤寒型（5.5%，3 岁以上）、脑膜型（多见于婴幼儿）、败血症型（3.6%，弛张高热+全身紫绀出血）；\n特点为呼吸道症状、肺部体征和 X 线检查的不一致性：症状体征轻而 X 线变化明显——浓密的网状阴影上布满密度、大小、分布均匀一致的粟粒结节（婴幼儿边缘模糊呈雪花状）；典型 X 线改变需在症状出现 1~3 周后才能见到；\n眼底检查 34% 患儿发现脉络膜结核结节；约半数全身淋巴结、肝、脾大；\n激素治疗可促使发热和中毒症状消失、加速病灶吸收、减少肺纤维性变。' },
  { m: '21D', q: '亚急性/慢性血行播散性肺结核与继发性肺结核的区别要点？', a: '亚急性/慢性血行播散：结核菌少量多次入血；多见于 10~12 岁以上年长儿；属继发性肺结核的内源性复发类型；X 线两肺大小不一、密度不均、分布不均的结节，多散在两肺中上部；增殖性病变呈"梅花瓣"状（树芽状）阴影；\n继发性肺结核（成人型）：12 岁以上年长儿及少年；内源性复燃或外源性重染；浸润性病变为主；\n与原发性不同：不易发生淋巴播散，肺门淋巴结不肿大；儿童好发于下肺（与成人不同）；浸润病灶易液化形成空洞，支气管播散是诊断继发性肺结核的主要影像学依据；结核球 0.5~4 cm（1.5~3.0 cm 多见）；纤维空洞壁厚多超过 3 mm。' },

  // ===== 模块 21E 结核性脑膜炎 =====
  { m: '21E', q: '结核性脑膜炎的流行病学与感染途径？', a: '小儿结核病中最严重的病型；好发 1~5 岁，冬春季较多；肺外结核占儿童结核病的 20%~40%；\n感染途径两种：①结核菌入血形成菌血症经血行播散到脑膜或脉络丛血管——常为全身血行播散型结核的一部分，婴幼儿多为此途径（89% 合并活动性肺结核，0~3 岁组 96% 合并，其中肺粟粒结核占 45.67%）；②结核感染后隐匿血行播散在中枢神经系统形成 Richie 病灶，机体内外因改变时病灶破裂排菌入蛛网膜下腔而发病，多见于年长儿（8~14 岁组 18% 胸部 X 线正常）。' },
  { m: '21E', q: '结核性脑膜炎的病理变化（5 方面）？', a: '① 脑膜病变：脑膜充血水肿混浊粗糙，大量灰黄渗出物，颅底渗出性粘连增厚机化、挤压包埋脑神经——颅底脑膜炎症是重要特征性病理表现；\n② 脑实质病变：脑膜炎症累及脑皮质出现脑炎改变（占 75%）；\n③ 脑血管病变：炎症致动脉内膜炎或全动脉炎，内膜纤维蛋白渗出呈洋葱样阻塞管腔（闭塞性动脉内膜炎，占 61.2%）→脑梗死；\n④ 脑积水：炎症侵犯脉络丛及室管膜使脑脊液分泌增加、循环通路阻塞及蛛网膜颗粒吸收障碍→交通性或梗阻性脑积水（发生率 64.4%，出现早且严重是结脑特点）；\n⑤ 脊髓病变：脊髓蛛网膜炎，粘连闭塞蛛网膜下腔。' },
  { m: '21E', q: '结脑的神经系统症状（5 方面）及病程三期？', a: '神经系统症状：①脑膜刺激症状（头痛、呕吐、颈强直、克氏征、布氏征阳性）；②脑神经损害（中枢性面神经及舌下神经麻痹、周围性面神经/动眼神经/展神经麻痹）；③脑实质受损（偏瘫、失语、舞蹈样表现）；④颅压增高（脑积水出现早且严重）；⑤脊髓障碍（根性疼痛、截瘫、大小便失禁或潴留）；\n病程三期：前驱期（早期）1~2 周——结核中毒症状为主；脑膜刺激期（中期）1~2 周——喷射性呕吐、知觉过敏、便秘伴舟状腹、脑膜刺激征及巴氏征阳性、前囟饱满膨隆；昏迷期（晚期）1~3 周——意识朦胧→昏迷，阵挛/强直性痉挛频繁，角弓反张，去脑或去皮质强直，死于呼吸循环中枢麻痹。' },
  { m: '21E', q: 'GCS 评分对结脑的分期？', a: '1 期（Stage 1）：GCS 15 分，意识清楚，无局灶性神经系统体征；\n2 期（Stage 2）：GCS 11~14 分，或 GCS 15 分伴轻度局灶性体征（脑神经麻痹、偏瘫等）；\n3 期（Stage 3）：GCS <11 分，表现晚期症状（昏迷、频繁抽搐、多发或重度偏瘫）。' },
  { m: '21E', q: '婴幼儿结脑的临床特点？', a: '分期可不明显，前驱期短暂或缺如；\n可以惊厥为首发症状：<6 个月婴儿就诊时 67% 已发生惊厥，10.9% 以惊厥为首发；\n颅压增高因颅缝开裂、前囟未闭可暂时缓冲，呕吐发生率低；\n消化道症状以腹泻为主（便秘不明显），呼吸道症状突出（呼吸困难、喘憋明显）。' },
  { m: '21E', q: '结脑脑脊液的典型改变？', a: '压力增高（200~360 mmH₂O）；外观早期无色透明，中晚期混浊呈玻璃样浅黄；65% 标本静置 24 小时可有薄膜形成（典型呈漏斗状、从液面中央倒置至试管底部，薄膜涂片更易找到结核杆菌）；pH 降低呈酸性；\n白细胞轻~中度增高（25~500）×10⁶/L，约 2/3 在 100~500，约 5% 超过 1000；约 86% 以淋巴细胞占优势，但急性期/恶化期中性粒细胞可占优势，约 1 周后转为淋巴；\n蛋白增高（大多 40~300 mg/L），蛋白显著增高提示脑脊液循环障碍/椎管梗阻；糖降低；氯化物降低较化脓性脑膜炎明显；\n糖和氯化物同时降低是结脑的典型改变；改变顺序：最早白细胞升高→其次蛋白升高→再其次糖和氯化物下降（早期糖氯化物可正常）。' },
  { m: '21E', q: '结脑治疗后脑脊液的变化规律及预后提示？', a: '治疗后脑脊液中的糖首先升高，继而白细胞下降、蛋白降低；\n糖持续降低往往提示预后不良；\n脑脊液改变常最早出现白细胞升高，其次蛋白升高，再其次糖和氯化物下降。' },
  { m: '21E', q: '结脑的临床分型（4 型）及预后？', a: '① 浆液型：渗出物局限于脑底，症状和脑脊液改变轻微，多在粟粒性结核常规腰穿时发现；占 2.1%，全部属早期病例（占所有早期结脑的一半）；\n② 脑底脑膜炎型：最常见（占 52.5%），明显脑膜刺激症状及脑神经障碍，无局灶性症状，脑脊液典型；75.5% 属中期；预后较好但原发耐药菌感染者差；\n③ 脑膜脑炎型：炎症蔓延至脑实质（点状出血、脑梗死、结核瘤），颅压增高及脑积水明显；占 43.9%，3 岁以下占 77%；预后差，常留严重后遗症；\n④ 脊髓型（脑脊髓软硬脑膜炎型）：占 15%，多见于年长儿；有明显蛋白细胞分离（脑脊液黄色，蛋白可达 10~40 g/L），常遗留截瘫。' },
  { m: '21E', q: '结脑早期诊断的要点（北京儿童医院 1180 例资料）？', a: '63% 有结核病接触史，92% 未接种过 BCG，约 1/3 发生于春天；\n有接触史、PPD 阳性或已有结核病的小儿出现以下症状应考虑：性情改变、轻微发热、无原因呕吐、顽固性便秘或嗜睡与烦躁交替；\n诊断未确定时不可用肾上腺皮质激素等药物，以免掩盖症状、耽误诊断和治疗；\n脑脊液涂片抗酸染色或培养阳性是最可靠诊断依据，但阳性率一般低于 20%；应尽量在未治疗前留取标本，脑脊液静置薄膜固定于玻片做抗酸染色可提高检出率；\n脑脊液病原学阴性不能排除结脑，不能停止经验性抗结核治疗。' },
  { m: '21E', q: '结脑的辅助检查（Xpert、ADA、CT/MRI、脑电图）？', a: 'Xpert MTB/RIF：WHO 推荐为所有怀疑结脑患儿脑脊液的初始诊断方法，2 小时检出结核菌 DNA 及利福平耐药，汇总敏感性 80%、特异性 97%；\n脑脊液腺苷脱氨酶（ADA）升高（正常人 <9 U/L），敏感高、简便，可协助早期诊断；\n脑 CT：直接征象为结核瘤、基底池渗出物、脑实质粟粒状结核灶（梅花样/串珠样高密度影具定性诊断价值）；间接征象为脑水肿、脑积水、脑梗死（最常见于大脑中动脉供血区）；增强扫描脑膜强化以鞍上池、环池、脑基底池、外侧裂最明显；\nMRI 诊断优于 CT（基底节异常信号灶检出明显优于 CT）；\n脑电图急性期绝大多数异常（弥漫性慢波），无特异性，对随访疗效和判断预后有帮助。' },
  { m: '21E', q: '结脑与化脓性脑膜炎的鉴别？', a: '结脑起病急者易误诊为化脑（2 岁以下约 15% 住院前被误诊，最易混淆者为流感嗜血杆菌脑膜炎，其次流脑、肺链脑膜炎）；\n化脑经不规则抗生素治疗后脑脊液细胞数不很高时又易误诊为结脑；\n鉴别要点：脑脊液细胞数高于 1000×10⁶/L 且分类以中性粒细胞占多数时，应考虑化脓性脑膜炎；\n更重要的鉴别是细菌学检查；结核病接触史、PPD 试验及肺部 X 线检查可协助。' },
  { m: '21E', q: '结脑与病毒性脑炎、腮腺炎脑膜脑炎的鉴别？', a: '病毒性脑炎（乙脑）：急剧凶险，早期即有脑炎症状，3~4 日后进入极期（高热、抽搐、昏迷及呼吸循环衰竭）；脑脊液蛋白仅轻度升高，糖及氯化物正常或增高；\n腮腺炎脑膜脑炎：冬春季流行或散发，腮腺肿大前或无腮腺肿大者易误诊；脑脊液白细胞 25~500，3 岁以下细胞数更高、淋巴细胞占 90%~96%，2/3 蛋白增高、糖可降低甚至长期降低（酷似结脑）——需找结核证据、测腮腺炎病毒抗体；\n病毒性脑膜炎要点：有特定流行季节及特殊全身表现，脑脊液糖及氯化物正常或增高、蛋白多 <1 g/L。' },
  { m: '21E', q: '结脑与新型隐球菌脑膜脑炎、脑肿瘤的鉴别？', a: '新型隐球菌脑膜脑炎：临床表现、慢性病程及脑脊液改变酷似结脑但病程更长；脑脊液涂片墨汁染色见圆形厚荚膜酵母菌，隐球菌多糖抗原可辅助诊断；慢性进行性颅压高突出，与脑膜炎其他表现不平行；\n脑肿瘤易误诊为结脑的原因：小儿肿瘤 70% 位于幕下（第四脑室及小脑），多位于中线上，常见脑室管膜瘤可有脑膜刺激症状，髓母细胞瘤可经蛛网膜下腔播散；\n脑肿瘤与结脑不同：较少发热；抽搐少见且抽搐后神志清楚（结脑晚期抽搐后即陷昏迷）；颅压高与脑征不平行；脑脊液改变轻微；PPD 阴性、肺部正常——确诊及时做脑 CT。' },
  { m: '21E', q: '结脑的其他鉴别诊断？', a: '脑脓肿：多有中耳炎或头部外伤史，常伴先心病，除脑膜炎和颅压高症状外往往有局灶性脑征；脑脊液细胞可从正常到数百、糖氯化物多正常、蛋白正常或增高；鉴别困难时借助超声波、脑电图、脑 CT 及脑血管造影；\nMollaret 复发性脑膜炎（良性复发性无菌性脑膜炎）：反复发作的无菌性脑膜炎症，每次持续 2~7 天，发作间歇数周至数月，脑脊液细胞数百至数千、蛋白轻度增高、糖正常低限，可在发病 12~24 小时脑脊液中查见大型内皮细胞（大单核细胞）确诊；\n狼疮脑病：注意多系统损害（关节、皮肤、肾脏）、血沉明显增快、自身抗体阳性；\n小儿急性偏瘫：结核性脑动脉炎可以急性偏瘫起病、脑膜炎症状不典型、脑脊液改变轻微，易误诊为病毒性脑炎合并偏瘫——急性偏瘫患儿一定要寻找结核感染病因。' },
  { m: '21E', q: '结脑的预后影响因素及复发特点？', a: '影响因素：①原发耐药感染（增加病死率）；②治疗早晚（越晚病死率越高）；③年龄（越小发展越快越严重，同样严重程度 3 岁以下较 3 岁以上差）；④临床类型（脑实质受损严重者差，浆液型病死率为零）；⑤有无合并脑积水（合并者病死率远高于未合并者）；⑥初治或复治（复治较差）；⑦治疗方法（剂量不足方法不当可使早中期变为迁延慢性）；\n复发率一般 5%~10%，多发生在疗程结束后 2 年内（复发病例全部发生在停药后 4 年内，绝大多数在 2~3 年），偶可 3~5 年；\n远期随访至停止治疗后 5 年：疗程结束后 2 年无复发可认为治愈，但仍应继续观察。' },
  { m: '21E', q: '结脑的抗结核药物治疗（方案与各药脑脊液浓度）？', a: '强化期 INH + RIF + PZA + EB 联合，INH 和 RFP 全程应用；疗程 1~1.5 年，或脑脊液正常后不少于 6 个月；耐药结脑加用二线药（丙硫异烟胺、利奈唑胺、左氧氟沙星/莫西沙星、阿米卡星等）；\nINH：脑脊液浓度为血浓度 80%~90%，10~15 mg/（kg·d），最大 300 mg/d；\nRFP：脑脊液为血浓度 10%~20%，脑膜炎症时可获有效浓度，10~15 mg/（kg·d）；\nPZA：脑脊液浓度近似血浓度，25~35 mg/（kg·d），疗程 3~6 个月；\nEB：脑脊液为血浓度 20%~30%（脑膜炎时增加），15~20 mg/（kg·d），疗程 3~6 个月，推荐剂量内视神经炎发生率 <3%；\nSM：不易透过血脑屏障，20~30 mg/（kg·d），1~2 个月后改隔日 1 次，总疗程 3 个月左右，需听力检测；\nPTH：脑脊液浓度为血浓度 80%~90%，用于耐药结脑。' },
  { m: '21E', q: '结脑的激素治疗？', a: '必须与有效的抗结核药物同时应用，剂量疗程适中，越早用越好；\n作用：抗炎、抗过敏、抗纤维性变，使中毒症状及脑膜刺激症状迅速消失，降低颅压，减轻和防止脑积水发生；\n对脑底脑膜炎型效果最好；已到脑膜脑炎型、极晚期或已发生蛛网膜下腔梗阻及合并结核瘤者效果不理想；\n剂量：泼尼松或泼尼松龙 1.5~2 mg/（kg·d），最大不超过 45 mg/d；地塞米松比泼尼松强 5 倍（剂量为其 1/5）；或甲泼尼龙 1~2 mg/（kg·d）静滴 1~2 周后改泼尼松口服；\n用药后 4~6 周缓慢减量，1~2 个月减完；已有脑脊液循环梗阻或有梗阻趋势者可鞘内注射地塞米松。' },
  { m: '21E', q: '结脑脑积水的治疗措施？', a: '脑积水在病程 1~2 周即可从临床上诊断出，及早控制非常重要；\n① 侧脑室穿刺和外引流：适用于急性脑积水，其他降颅压措施无效或疑有脑疝时；引流 1~3 周甚至更久，每天引流量可达 50~200 ml；\n② 高渗液：30% 尿素、20% 甘露醇、25% 山梨醇，剂量 1~1.5 g/kg 于 30 分钟内快速静注，必要时 1 天 3~4 次（抢救脑疝严重脑水肿及 3 岁以上侧脑室引流困难者）；\n③ 乙酰唑胺：碳酸酐酶抑制剂，减少脑脊液生成，20~40 mg/（kg·d）分 2~3 次口服，疗程数周至 6 个月；\n④ 分流手术：梗阻性脑积水、炎症基本控制后行脑室脑池分流术；\n⑤ 鞘内注射：INH 20~50 mg/次，可联合地塞米松，每日或隔日 1 次，2~4 周为 1 疗程（用于严重晚期患儿）。' },
  { m: '21E', q: '结脑并发症与后遗症？', a: '并发症最常见为脑积水、脑实质损害、脑出血、脑软化及脑神经障碍（前三种常为结脑的死亡原因）；\n可表现脑积水、去大脑强直、肢体瘫痪、癫痫、类舞蹈样手足徐动、失明、失语等，可在治疗过程中逐渐消失而无后遗症；\n持久存在则形成后遗症：较轻者有斜视、面神经麻痹、轻度肢体瘫痪、头痛、轻微精神和行为障碍、内分泌障碍（轻度肥胖）；严重后遗症包括脑积水、肢体瘫痪、癫痫、失明、失语、智力低下、尿崩症等。' },

  // ===== 模块 21F 其他肺外结核·先天结核 =====
  { m: '21F', q: '肠结核的要点？', a: '好发部位为回盲部（该段富有淋巴组织、食物停滞较久），其次为空肠下段、回肠、升结肠及阑尾；\n溃疡型：溃疡边缘常有结核性肉芽组织，溃疡深时可发生肠穿孔（但多因局部粘连只引起局限性腹膜炎），愈合后瘢痕形成可致肠狭窄；增殖型：结缔组织过度增生呈肿瘤样团块，多见于回盲部；\nX 线钡剂：回盲部病变处钡剂不停留而病变两端钡剂停留（盲肠钡影残缺）、肠激惹征象、狭窄征象、不完全梗阻征象；\n诊断：纤维结肠镜检查 + 活检（应从黏膜深部取材，取材过浅发现率低）；找干酪坏死性肉芽肿或结核菌可确诊；死于结核小儿尸检有肠结核者达 33%，临床多漏诊。' },
  { m: '21F', q: '肠系膜淋巴结结核的要点？', a: '小儿较多见；可为肠道原发综合征的一部分（肠原发灶很快吸收，肿大的干酪样变肠系膜淋巴结长期存在）；死于结核小儿尸检约 30% 有本病；\n表现：一般结核中毒症状及局部胃肠道症状，以腹痛为最常见；压痛点多在右下腹（相当于阑尾炎点处）或左上腹，常被误诊为急性阑尾炎而手术（我院误诊达 2~3 年者最多）；\n触诊可及肿大淋巴结（小如蚕豆、大可似手拳），可融合成团块与肠管、腹膜、大网膜粘连；压迫症状：压迫门静脉→腹水及腹壁静脉扩张，压迫下腔静脉→下肢水肿，压迫胸导管→乳糜性腹水，压迫幽门→幽门狭窄，压迫肠道→不全性肠梗阻；\n腹部 CT/B 超：淋巴结肿大呈环形强化、中心低密度对干酪样坏死有提示作用；B 超引导下针吸活检阳性率可达 53%。' },
  { m: '21F', q: '结核性腹膜炎的要点？', a: '多为 3 岁以上儿童（学龄前最常见）；临床 3 型：①渗出型（占 40%）：腹水型，典型表现四肢消瘦与腹部极度膨隆形成鲜明对比，腹腔穿刺为草黄色浆液性或浆液纤维素性渗出液（可有血性及乳糜样）；②粘连型（占 49%）：反复不全性肠梗阻表现，腹部柔韧有揉面感，可触到固定肿块；③干酪溃疡型（占 11%）：病变转入干酪坏死液化，弛张热、腹泻腹痛、进行性消瘦贫血、可形成脐瘘/肠瘘；\n预后：渗出型最好（可完全治愈），粘连型较差，干酪溃疡型最差；\n渗出型加用糖皮质激素可促进腹水吸收、减少粘连。' },
  { m: '21F', q: '周围淋巴结结核的要点？', a: '表浅淋巴结结核是儿童期肺外结核的最常见类型，以婴幼儿及学龄前最多见，最多见于颈、下颌下、锁骨上及腋窝淋巴结；\n多数发生于结核菌原发感染 6~9 个月内，最多经淋巴血行播散，常涉及多组淋巴结；颈淋巴结结核与口腔咽部黏膜下淋巴网特别丰富有关；\n表现：淋巴结增大较硬无痛、可移动→彼此粘连成团、极易干酪样变；干酪液化形成冷脓肿，破溃后形成瘘管、愈合慢；双侧多个淋巴结高度肿大时颈部变粗似"牛颈"；约 70% 病例胸部 X 线检查正常；\n实验室：淋巴结培养阳性率 10%~69%，阴性不能排除；穿刺可见上皮样细胞、朗汉斯巨细胞及干酪样坏死；\n治疗：不推荐切开活检（可引起窦道和瘘形成）；局部已形成冷脓肿可先抽脓再注入 SM 0.25~0.5 g 溶液或 2.5% INH 液 1~2 ml（隔日 1 次或每周 2 次），破溃者用 10% PAS 软膏外敷。' },
  { m: '21F', q: '肾结核的要点？', a: '原发结核最晚发生的肺外结核：从初染至临床肾结核间隔 3~20 年、平均 8 年，主要见于学龄儿童和少年；\n感染途径：血行播散经血行至肾，在肾小球毛细血管丛形成结核结节（病理性肾结核，多自行痊愈或长期潜伏）；病灶扩大融合干酪坏死、空洞破入肾盂即临床肾结核；\n多为双侧性（29 例有记录者中 28 例双侧）；病理 4 期：1 期肾实质结核（可保守治疗）→2 期结核性乳头炎→3 期空洞型（不手术很少恢复）→4 期多发空洞广泛破坏（基本需肾切除）；\n最常见症状：尿频尿急尿痛（膀胱刺激征），尿频可多达每日 50~60 次甚至尿失禁；血尿可于尿终末出现；晚期可肾衰竭；\n确诊：尿沉渣涂片抗酸染色阳性、尿 PCR 阳性、尿培养检出结核菌；静脉肾盂造影轻症见肾盏虫蚀状缺损；\n治疗：肾切除术前抗结核药物最少 1 个月，术后继续用药至少 8~12 个月。' },
  { m: '21F', q: '附睾结核的要点？', a: '小儿较少见，可经血行或后尿道感染；\n表现：附睾肿大、形成念珠状硬结，可与阴囊壁粘连，破溃形成瘘管；\n治疗：尽可能不做附睾切除手术，经抗结核药物治疗后常能获得治愈。' },
  { m: '21F', q: '结核性心包炎的要点？', a: '多见于学龄儿童；分渗出性及缩窄性两型；病理过程 4 期：干性、渗出、吸收、缩窄；多由胸腔内淋巴结核、胸膜或腹膜结核经淋巴逆流或直接蔓延而来，也可由心包附近干酪液化淋巴结破溃入心包腔或血行播散所致；\n渗出性：起病可急可缓；疼痛主要在胸骨下（钝痛/紧迫感），但远不如急性非特异性心包炎和化脓性心包炎明显及严重；约半数患儿炎症初期可听到心包摩擦音；心脏压塞症状（心音遥远、奔马律、颈静脉怒张、奇脉、脉压变小、肝大腹水）；\n缩窄性心包炎：起病缓慢，心脏舒张受限制，主要表现为呼吸困难及一系列心脏压塞症状（又称 Pick 病）；可表现长期不明原因胸腔积液或低蛋白血症（蛋白丢失性肠病）；\n确诊关键：心包穿刺——积液常为血性、淋巴细胞为主、蛋白升高；\n治疗：有渗出液时及时加肾上腺皮质激素 3~4 周加速渗出吸收、防止缩窄（停药过早心包渗液可重复出现）；缩窄性心包炎一经确诊应手术剥离粘连及部分切除心包。' },
  { m: '21F', q: '疱疹性角膜结膜炎的要点？', a: '是小儿最常见的与结核感染有关的眼病，为对结核分枝杆菌或其产物的过敏反应（phlyctenular），多见于原发结核患儿尤其 5 岁以下，有时作为原发感染的首发症状；\n表现：细小灰白色或灰黄色小结节（直径 1~3 mm），典型位置在角膜缘，周围结膜扇形充血；角膜受累形成溃疡愈合后留瘢痕影响视力；常伴病性面容（鼻黏膜肿胀糜烂、脓性分泌物、口唇肿胀、湿疹样皮肤改变、颈淋巴结结核）；\n病理：由淋巴细胞、上皮样细胞及巨噬细胞组成的结节，并无结核分枝杆菌；\n高度复发倾向；患儿离开开放结核环境很快恢复；\n治疗：局部滴可的松及抗生素制剂，并用阿托品散瞳；有全身结核者积极抗结核治疗。' },
  { m: '21F', q: '结核性皮肤病的分类与代表疾病？', a: '血行播散性（发疹性）皮肤结核：\n① 粟粒性皮肤结核：婴幼儿，全身淡红至暗红针头至米粒大尖顶丘疹，新鲜丘疹和分泌物中可找到结核菌；\n② 丘疹坏死性结核疹：躯干四肢伸侧（肘膝突出部）左右对称，3~6 mm 毛囊丘疹，1~2 周后中心坏死结痂，脱痂后中心凹陷性小溃疡，坏死中心可找到结核菌，春秋季复发；\n③ Bazin 硬红斑：青春期少女，真皮皮下深层暗红/紫红色结节（直径 1~3 cm），多见于小腿屈面、两侧对称，有疼痛；\n④ 苔藓样结核疹（性苔藓）：黄白色毛囊小丘疹、尖端有角质小棘，多见于背部；\n局限性皮肤结核：\n① 瘰疬性皮肤结核：颈面部多见，结节破溃成溃疡或瘘管，分泌物中易找到结核菌；\n② 寻常性狼疮（真狼疮）：好发面部尤其颊部，玻璃片压诊呈淡黄苹果酱颜色（苹果酱结节），病程中损害一边发展一边中心愈合形成萎缩瘢痕，瘢痕中又可发生新结节。' },
  { m: '21F', q: '骨关节结核的总论要点？', a: '发病率占所有肺外结核病的 15%~20%；主要为血行播散，结核菌经血或淋巴循环侵入骨端（骨骺、干骺端）或关节滑膜；\n好发部位：首先为脊椎，其次为髋关节及膝关节、短骨及长骨骨干；负重大运动多的肢体关节发生率高（脊椎结核多见于已能站立走路的小儿，以负荷最重的胸腰段最易发生）；下肢比上肢多见；外伤可使隐性骨结核变为活动性；\n单纯骨结核较少见（肘关节较多），单纯滑膜结核亦较少见（膝关节较多，其次踝和髋），不及时治疗多于数月至数年内发展为全关节结核；\nX 线异常发现晚于临床症状约 3 个月~1 年。' },
  { m: '21F', q: '脊柱结核的要点？', a: '居小儿全身骨关节结核的首位（约占 1/3），最常见于胸椎；病变一般起源于椎体松质骨的中心或边缘，破坏椎间盘后向邻近椎体蔓延，2~5 个脊椎可同时受损害；椎体破坏失去支重作用→脊柱向后凸出形成角形驼背；\n早期：疼痛（神经根受刺激，按部位放射）、脊柱僵直（保护性肌痉挛，入睡后肌肉松弛移动时疼痛发生夜哭）、特殊姿势（颈椎结核斜颈颈强直喜手托下颌；胸椎结核拾肩挺胸；腰椎结核腹部前挺、双足远离、鸭步）；\n拾物试验阳性：弯腰自地上拾物时取屈膝蹲下姿势、一手扶膝一手拾物；\n寒性脓肿：广泛椎旁脓肿多发生在胸椎，可穿破形成窦道，或向空腔脏器穿破形成内瘘（胸膜腔及肺侵犯最多见）；晚期截瘫等脊髓压迫症状，以上部胸椎结核最多见；\nX 线典型表现：椎体溶骨性破坏（多累及 2 个以上椎体）、椎间隙变窄消失、椎旁脓肿；MRI 有利于确定病变轮廓和鉴别。' },
  { m: '21F', q: '髋关节结核的要点？', a: '多见于学龄前儿童；发病缓慢，最早症状为步态改变（健肢着地重患肢轻、略显跛行）；\n夜惊为小儿髋关节结核的特征；因髋关节位置深、周围软组织厚，关节肿胀常不易看出，肌张力低、肌肉萎缩可为本病早期症状；\n患肢位置改变：早期因肌肉挛缩固定在外展、外旋与屈曲位，骨盆向患侧下沉使患肢似变长；其后闭孔神经受刺激、内收肌痉挛，患肢屈曲内收内旋，骨盆在患侧抬高使患肢似变短；\n治疗：全身休息及局部关节休息皆重要，急性期疼痛剧烈时行皮肤牵引；病灶清除术效果良好。' },
  { m: '21F', q: '膝关节结核与结核性指/趾炎的要点？', a: '膝关节结核：多见于学龄前儿童；最早为轻微跛行及疼痛（间歇性，运动或外伤后加重）；关节肿胀迅速呈梭形肿大，关节腔积液时浮髌现象、滑膜增厚时触之揉面感；患肢取屈曲位（关节结构松弛减少疼痛）；\n结核性指/趾炎（骨气臌）：为短骨及长骨骨干结核，主要见于婴幼儿；多发性病变常同时侵犯数个指骨；指骨呈梭形肿胀、周围组织发红肿胀但无疼痛；X 线见囊性骨质破坏和死骨形成；鉴别首先考虑梅毒性指/趾炎。' },
  { m: '21F', q: '中耳结核的要点？', a: '鼓室和乳突的慢性结核性病变，进展缓慢，中耳原发综合征极罕见；多继发于肺结核，结核菌由鼻咽部经耳咽管直接侵入中耳或血行播散而来；\n表现：似慢性中耳炎但无痛、有分泌物；骨质破坏进展迅速，能早期发生面神经麻痹（面瘫）和耳聋；鼓膜苍白、有穿孔和肉芽组织；常伴耳前、耳后及颈部淋巴结肿大（有时化脓）；耳前瘘管较一般中耳炎发生率高；\n诊断：已有结核患儿发现耳流脓应考虑；无菌生理盐水冲洗耳腔收集分泌物浓缩法查菌阳性率较高；中耳肉芽组织病理切片可确诊；\n治疗：抗结核治疗和乳突根治术。' },
  { m: '21F', q: '先天性结核病的定义、Cantwell 诊断标准与感染途径？', a: '定义：胎儿经胎盘感染的结核病（Bietykl 1935 年拟定标准，Cantwell 1994 年修改）；\nCantwell 标准：①病变证实为结核性；②存在肝原发综合征或肝干酪样肉芽肿；③新生儿于出生或数天内发生结核；④母亲存在胎盘或生殖道结核感染；⑤明确除外生后感染可能；\n感染途径：绝大多数属血行播散（孕母全身血行播散性结核或子宫内膜、胎盘、宫颈结核），多经脐静脉到肝引起肝原发综合征（肝原发灶+肝门淋巴结核）；少数绕过肝经静脉导管到右心到肺，或因胎盘/子宫内膜干酪病灶破溃感染羊水，胎儿宫内吸入/吞入而发生肺或肠原发综合征；\n病理特点：明显干酪坏死而缺乏细胞反应（淋巴细胞上皮细胞少、巨噬细胞不见，病灶边缘可见多形核白细胞），提示结核菌急剧繁殖而机体无抵抗力。' },
  { m: '21F', q: '先天性结核病的临床表现、诊断要点、治疗与预后？', a: '多于生后 1 个月内起病：吃奶不好、呕吐、体重不增、发热等非特异表现；咳嗽、呼吸困难；淋巴结和肝脾大；肝门淋巴结压迫胆管可致阻塞性黄疸；可有结脑表现（鼓膜穿孔致耳聋、面神经瘫）；重症可呼吸衰竭、休克、DIC、多脏器功能衰竭、噬血细胞综合征；易误诊为新生儿肺炎、败血症、先天病毒感染和化脑；\n诊断参考：母亲有活动性结核且生后即隔离或胎盘有结核病变；生后 2 周内发病；肝有原发结核或肺内广泛病变；PPD 生后 4~6 周可阳性但不少患儿始终阴性；白细胞和 CRP 升高类似化脓性细菌感染、多伴血小板减少；胸片多呈粟粒性肺结核或多发结节；腹部 B 超肝脾大、多发病灶、腹腔淋巴结肿大和腹水；胃液或气管吸取液找到大量结核分枝杆菌；\n治疗：强化期 INH + RFP + PZA 联合 2 个月，继续期 INH + RFP 4~10 个月；\n预后较差：不经治疗一般 2 个月内死亡；提高存活率的关键是提高认识与警惕性、早期诊断、合理治疗。' },
];

  // ===== 模块 22A 浅部真菌病 =====
  { m: '22A', q: '真菌性疾病的分类与诊断要点？', a: '按侵犯部位分浅部真菌病和深部真菌病；\n诊断主要依靠皮损的部位、特点和真菌学检查；\n最经典检查：真菌直接镜检和培养；甲真菌镜检和培养均为阴性时可做甲病理切片（过碘酸希夫染色 PAS）；\n深部真菌病可选用血清学试验和皮肤试验；滤过紫外光（伍德灯）可用于各型头癣的鉴别。' },
  { m: '22A', q: '头癣的分型及各自致病菌？', a: '头癣 = 真菌感染头皮和头发，分三型（白癣、黑点癣、黄癣），炎症反应明显时可出现脓癣；好发于儿童，接触患者、动物及污染物传染；\n白癣：致病菌多为动物源性（犬小孢子菌等）；\n黑点癣：主要为毛癣菌（断发毛癣菌、紫色毛癣菌）；\n黄癣：许兰毛癣菌；\n脓癣：亲动物性或亲土性真菌（须癣毛癣菌、石膏奈尼兹菌等）。' },
  { m: '22A', q: '白癣的临床表现与实验室特点？', a: '初起毛囊性红色丘疹，很快扩大成头皮灰白色鳞屑性脱发斑；\n病发在距头皮 3~4 mm 处均匀一致地折断，根部有灰白色菌鞘包绕；皮疹常呈卫星状分布，瘙痒；\n大部分患儿到青春期可以自愈；\n伍德灯：亮绿色荧光；直接镜检：发外包绕密集排列的圆形孢子。' },
  { m: '22A', q: '黑点癣与黄癣的临床及实验室特点？', a: '黑点癣：可家族内互相传染，自儿童期开始、病程慢性可延续数年；病发紧贴头皮折断呈黑色小点状，酷似脂溢性皮炎；一般不能自愈，久者形成秃发；无荧光；镜检发内成串排列的链状孢子；\n黄癣：黄红色斑点→毛囊性脓疱→蝶形蜜黄色痂皮（边缘翘起、中央黏着、毛干穿过），有鼠臭味、易粉碎（由密集菌丝和上皮碎屑组成）；镜检见发内菌丝或关节孢子和气泡，黄癣痂中可见鹿角菌丝；伍德灯暗绿色荧光；去痂后红色潮湿基底、深溃疡，久之萎缩性瘢痕造成永久性脱发。' },
  { m: '22A', q: '脓癣的特点及处理禁忌？', a: '白癣和黑点癣炎症较重者形成头皮脓肿：起病急，一片或数片红肿痛性隆起，质地软、有波动感，外观如"脓肿"但无细菌性脓肿的大量脓液及严重红肿热痛；挤压时毛囊口少量浆液或稀薄脓液流出；毛发松动极易拔出，可形成萎缩性瘢痕永久性脱发；常伴耳后、颈、枕淋巴结肿大，可诱发癣菌疹；\n血常规白细胞明显升高、中性粒细胞为主、CRP 显著升高（继发感染多为金黄色葡萄球菌，用一代头孢口服 1 周）；\n处理禁忌：切忌切开引流和清创——切开后伤口不易愈合、加重炎症和全身中毒反应、严重可危及生命并遗留较大瘢痕；\n内服抗真菌药基础上急性期短期口服泼尼松 1~2 mg/（kg·d）晨顿服，足量 2 周、再 1~2 周减停。' },
  { m: '22A', q: '头癣的治疗"五字方针"？', a: '"剃、洗、擦、煮、服"，内服外用结合：\n服：首选灰黄霉素 15~20 mg/（kg·d）分 3 次口服，疗程 6~8 周，服药时同时进食高脂餐助吸收；失败或过敏用特比萘芬（<20 kg 62.5 mg/d、20~40 kg 125 mg/d、>40 kg 250 mg/d，4~6 周；犬小孢子菌感染者需 6~7 mg/（kg·d）且疗程 ≥8 周）或伊曲康唑 3~5 mg/（kg·d）（最大 200 mg/d，餐后服）；\n剃：每周理发一次；病发用镊子拔除并焚毁；\n煮：理发工具和生活用品煮沸消毒；\n洗、擦：每日早晚温水肥皂洗头，早晨外涂抗真菌药、晚上涂碘伏，至少 8 周；\n监测：服药前、中、后每 2 周查肝肾功能及血常规；每 2 周复查真菌镜检，连续 3 次阴性再结合临床方可认为治愈。' },
  { m: '22A', q: '体癣与股癣的要点？', a: '体癣：致病性真菌寄生在光滑皮肤（除手足、毛发、甲板及阴股部以外）的浅表感染；股癣：发生于腹股沟、会阴和肛门周围的皮肤癣菌感染，是特殊部位的体癣；\n致病菌：红色毛癣菌、须癣毛癣菌等；\n典型皮疹：局部红斑或丘疹离心性扩大成圆形损害，中心好转、边缘隆起并有活动性红斑丘疹水疱，慢慢外扩可融合；儿童炎症反应常较成人重；\n难辨认癣：用药不当使皮疹泛发渗出似湿疹样改变（tinea incognita）；\n治疗：外用抗真菌药 2~4 周；全身泛发或顽固者口服特比萘芬或伊曲康唑 1~2 周。' },
  { m: '22A', q: '手足癣的分型与并发症？', a: '分型：水疱型（小水疱成群或散在，疱壁厚、瘙痒严重）、间擦糜烂型（4~5 和 3~4 指/趾间最常见，多汗浸水穿胶鞋者夏季多发，糜烂浸渍发白）、鳞屑角化型（掌跖弥漫粗糙增厚脱屑，冬季皲裂出血疼痛）；\n浸渍部位取材不易查到真菌，急性期水疱或慢性期鳞屑阳性率高；最常见致病菌红色毛癣菌；\n足癣易合并细菌感染或湿疹化；急性期活动性足癣可出现对皮肤癣菌的变态反应——癣菌疹。' },
  { m: '22A', q: '甲真菌病的分型与治疗？', a: '甲癣 = 皮肤癣菌所致甲板感染；甲真菌病致病菌包括皮肤癣菌、酵母菌和某些霉菌，常继发于手足癣或外伤；\n分型：远端侧位甲下型（DLSO）、近端甲下型（PSO）、浅表白色型（SWO）、甲内型、全甲破坏型（TDO）；\n诊断：真菌镜检证实、培养定菌种；高度怀疑而镜检培养均阴性者做甲病理切片 PAS 染色；\n治疗：系统用药适用于甲母质受累的 DLSO、PSO、TDO——口服特比萘芬/伊曲康唑/氟康唑，指甲疗程 2~3 个月、趾甲 3~4 个月；SWO 及未累及甲母质的早期轻症可单独外用。' },
  { m: '22A', q: '花斑糠疹的要点？', a: '马拉色菌（嗜脂酵母）所致，该菌是人类皮肤表面正常菌群之一；热带地区多见；\n好发于躯干、腋下、面颈等皮脂腺丰富部位，婴幼儿尤以额部、颈后部常见；\n皮损：圆形或不规则形斑疹，多呈淡白色斑片（也可粉红、黄棕甚至灰黑色），表面覆盖细薄糠状鳞屑；\n伍德灯：黄褐色荧光；镜检见菌丝及芽孢；\n鉴别：白癜风、白色糠疹、玫瑰糠疹、贫血痣；\n防治：易复发，应彻底治疗——外用 2.5% 二硫化硒或酮康唑香波洗浴（1~2 周），勤洗澡换衣、内衣煮沸消毒防再感染；可口服特比萘芬或伊曲康唑 3~6 个月。' },
  { m: '22A', q: '孢子丝菌病的要点？', a: '病原：申克孢子丝菌，双相真菌（组织中以酵母相寄生，体外培养呈菌丝相）；\n多有外伤史，皮损好发于四肢和头面部等暴露部位；侵入部位皮下结节或暗红色浸润性斑块，沿淋巴管蔓延出现成串排列的皮下结节（淋巴管型，直径 1~2 cm、无压痛）——固定型/淋巴管型/播散型；\n诊断：脓液或组织真菌培养；组织病理为化脓性肉芽肿，脓肿和多核巨细胞中 PAS 染色可见星状体；\n鉴别：炭疽、皮肤结核、着色真菌病、足菌肿、芽生菌病等；\n治疗：口服特比萘芬或伊曲康唑 3~6 个月，皮疹消退后继服 4 周；亦可用 10% 碘化钾溶液——可使肺结核病播散，须完全排除结核时方可使用；温热疗法（45℃ 电热器局部加温每天 3 次）可辅助。' },

  // ===== 模块 22B 侵袭性真菌病总论·念珠菌病 =====
  { m: '22B', q: '侵袭性真菌病（IFD）的概念、常见病原与高危人群？', a: 'IFD 又称深部真菌病：真菌侵犯皮肤和皮下组织以外，累及深部组织器官甚至播散；\n术语：脏器真菌病（真菌成分侵入某一脏器）、真菌血症（真菌入血）、播散性真菌病（2 个或以上非相邻器官同时感染）；\n常见病原：念珠菌属、曲霉属、隐球菌属，此外还有组织胞浆菌、接合菌、马尔尼菲青霉菌等；\n外源性（经呼吸道、胃肠道或破损皮肤侵入）与内源性（如念珠菌，免疫低下或屏障受损时致病）；\n高危：血液系统恶性肿瘤（尤其急性白血病）、造血干细胞移植（HSCT）、实体器官移植（SOT）、原发/获得性免疫缺陷、早产儿；另有重症患儿、创伤、外科手术（尤其腹部手术或先心病矫正）、接受免疫调节药物治疗者；\n表现缺乏特异性，容易误诊，可致死亡。' },
  { m: '22B', q: '侵袭性念珠菌病的常见菌种及感染途径？', a: '人类可检出至少 15 种念珠菌，>90% 的侵袭性念珠菌病由 5 种引起：白念珠菌、克柔念珠菌、光滑念珠菌、近平滑念珠菌、热带念珠菌；\n念珠菌可寄生于健康人口腔、消化道、阴道，为内源性感染（抵抗力低下时致病）；外源性感染由接触、口咽部吸入或消化道食入引起；\n先天性念珠菌病：宫内感染（母亲胎盘严重真菌感染垂直传播），或分娩前母亲患念珠菌性阴道炎、胎盘未感染而生产时吸入。' },
  { m: '22B', q: '侵袭性念珠菌病的高危因素？', a: '① 早产儿和极低体重儿（新生儿预测模型高危因素：气管插管、中心静脉导管、静脉注射乳剂；另一模型：阴道分娩、孕周、念珠菌样皮炎、中心静脉置管、肠外营养、高血糖及培养前一周抗生素暴露天数和血小板减少）；\n② 各种导管植入：中心静脉置管、气管插管机械通气、腹膜透析、血液净化、胃肠外营养、留置导尿管；\n③ 肿瘤患儿尤其血液恶性肿瘤（急性髓系白血病 AML）及 HSCT 患儿；\n④ 各种原因粒细胞缺乏（原发性及化疗后）；\n⑤ 免疫功能低下：长期大量糖皮质激素/免疫抑制剂、长期广谱抗生素、原发免疫缺陷（重症联合免疫缺陷、STAT1 基因突变、CARD11 基因突变等）。' },
  { m: '22B', q: '念珠菌病的病理变化特点？', a: '基本病理改变是以单核细胞为主的肉芽肿性炎症；早期以渗出为主（巨核细胞、淋巴细胞、上皮样细胞浸润），晚期肉芽肿形成及若干灰色微小脓肿；\n常侵犯血管，呈急性或慢性坏死性血管炎改变——血管弹力纤维受损易致破裂出血，严重的脏器念珠菌病或念珠菌败血症可有广泛出血现象；\n黏膜组织（如气道）：坏死组织、纤维素及大量菌丝孢子构成肉眼可见的假膜，假膜脱落后形成灶形糜烂及深浅不等、易出血的溃疡。' },
  { m: '22B', q: '念珠菌肺炎与食管炎/肠炎的临床表现？', a: '呼吸道：原发性（吸入性）较少见，血源播散引起的念珠菌肺炎更常见；多呈急性肺炎或伴脓毒症，发热、咳嗽咳痰，痰呈黏稠胶冻样（菌丝和细胞碎片组成，有时带血），可伴喘息；影像两肺中下野弥漫性斑片、小片状、大片状阴影，易融合实变，常累及两个以上肺叶，一般不侵犯肺尖，血源播散型可类似粟粒性肺结核；\n念珠菌性食管炎：发病率不低于肠炎，主要症状呕吐及吞咽困难，年长儿进食时烧灼感可致拒食，不及时治疗可入血致败血症；\n念珠菌性肠炎：常由口腔念珠菌病发展而来或多见于口服多种广谱抗生素后，腹泻每日 3~4 次至 20 次不等，大便泡沫状水样或有黏液、有发酵气味，严重者黏膜溃疡、血样大便甚至肠穿孔继发腹膜炎。' },
  { m: '22B', q: '念珠菌病的其他器官表现（肝脾、心内膜、眼、骨髓、脑膜）？', a: '肝脾念珠菌病：常由念珠菌血症播散，恶心呕吐、上腹痛、肝脾大、肝功能损害；腹部超声见低密度坏死灶，典型可见牛眼征；\n念珠菌性心内膜炎：多由白念珠菌以外的念珠菌（近平滑念珠菌等）引起，见于血液恶性肿瘤及免疫抑制治疗期间、原有心脏病或心脏外科术后；类似急性细菌性心内膜炎，外周动脉栓塞表现（奥斯勒结节、詹韦损害、罗斯斑），赘生物脱落可致肺栓塞和心力衰竭，可经血行播散引起脑膜炎、脑脓肿；\n眼部感染：脉络膜视网膜炎和眼内炎，视网膜或玻璃体球蓬松的黄白色斑点伴出血或玻璃体混浊；\n念珠菌骨髓炎：典型累及股骨干骺端，常并发邻近关节脓毒性关节炎；\n念珠菌脑膜炎（HCME）：可无症状或仅发热，最常见特征是意识改变、发育倒退或迟缓，CSF 细胞数增多、中性粒细胞增加、蛋白升高、糖明显降低，病程迁延慢性，常需多次重复脑脊液培养才能确诊。' },
  { m: '22B', q: '念珠菌病的诊断要点（定植≠致病、G试验）？', a: '正常人皮肤、口腔、粪便可分离出白念珠菌而无症状，不能诊断为念珠菌病；鹅口疮有典型临床表现易于诊断，其他念珠菌病无典型表现且不一定并发鹅口疮；\n病原学意义：2 次以上镜检阳性或 2 次以上培养阳性且为同一菌种才有诊断意义；痰或 BAL 只见酵母相应进一步培养鉴定除外隐球菌和组织胞浆菌；BAL 一次镜检或培养阳性应结合临床、影像及高危因素综合判断；尿涂片或培养阳性必须在特定临床背景下评估；\nG 试验：检测血浆 β-D-葡聚糖（真菌细胞壁成分，占胞壁 50% 以上；除接合菌外所有真菌均含，人及动物细胞不含）——升高为侵袭性真菌感染的重要标志，临床症状出现数天后即可阳性，2 小时出结果；\nG 试验假阳性：输注白蛋白或球蛋白、血液透析、使用多糖类药物、标本接触纱布或细菌污染、外科手术后早期。' },
  { m: '22B', q: '念珠菌血症与播散性念珠菌病的表现及治疗原则？', a: '念珠菌血症：病情严重，主要发生于免疫缺陷患儿及与中心静脉导管植入相关者；全程无菌隔离、皮肤准备用氯己定、细致护理导管可预防；\n播散性念珠菌病：急性型——多发性皮肤病变、弥漫性肌痛、低血压、多器官功能衰竭（见于急性免疫功能障碍者）；慢性型——多见于轻度免疫缺陷，表现为皮肤黏膜病变和脏器受累；\n肾念珠菌病：肌酐清除率降低、梗阻性肾病和肾功能衰竭；低出生体重新生儿持续菌尿或严重免疫低下者发热伴菌尿，应考虑播散性念珠菌病；新生儿尿和血液（或尿液和脑脊液）均分离出念珠菌者死亡率增加；\n治疗原则：支持疗法加强营养；去除诱因（拔除所有血管内导管、新部位更换、提升中性粒细胞水平）；\n疗程：末次阳性血培养后 14 天，累及眼部者全身治疗延长至 4~6 周；感染性血栓性静脉炎拔除导管、切开引流并切除受累静脉，疗程末次阳性血培养后至少 14 天；治疗开始后第一周行眼底检查和常规血培养。' },
  { m: '22B', q: '侵袭性念珠菌病的抗真菌药物选择（菌种特异性）？', a: '棘白菌素类（卡泊芬净，负荷 70 mg/m²、维持 50 mg/m²，中重度肝功能不全减量）为多数首选；氟康唑 6~12 mg/（kg·d）；伏立康唑每次 9 mg/kg q12h；脂质两性霉素 B 3~5 mg/（kg·d）；\n克柔念珠菌：不推荐氟康唑，用棘白菌素或伏立康唑；\n近平滑念珠菌：对棘白菌素敏感性低，推荐氟康唑；\n光滑念珠菌：一般用棘白菌素类，除非药敏证实对氟康唑或伏立康唑敏感；\n伏立康唑对氟康唑无明显优势（除口服降阶梯治疗克柔念珠菌或伏立康唑敏感的光滑念珠菌外）；\n心内膜炎等心血管感染建议更大剂量棘白菌素，瓣膜赘生物阻止药物进入，可手术切除赘生物挽救生命；米卡芬净肝肾不全者无需调整剂量。' },

  // ===== 模块 22C 曲霉菌病·隐球菌病 =====
  { m: '22C', q: '曲霉菌病的病原学及三种临床类型（按宿主免疫状态）？', a: '常见致病菌：烟曲霉（最常见）、黄曲霉、黑曲霉、土曲霉、构巢曲霉；烟曲霉、黄曲霉和构巢曲霉常引起肺曲霉菌病、血流感染等全身感染及变应性支气管肺曲霉菌病；\n曲霉广泛分布于空气、发霉的粮食花生干草木材；鸟类尤其易感染；\n三种类型：① 寄生型——宿主免疫功能基本正常，曲霉在支气管扩张空腔、肺结核空洞等空腔病变内寄生（曲霉球）；② 过敏型——宿主过敏体质（哮喘）或患囊性纤维化（ABPA），或轻度免疫低下患慢性肉芽肿病（过敏性肺泡炎），或免疫正常吸入孢子后过敏性肺泡炎；③ 侵袭型——宿主免疫功能低下引起侵袭性肺炎，分急性、亚急性和慢性。' },
  { m: '22C', q: '肺曲霉球（寄生型）的特点？', a: '发生于已存在的肺空洞性病变内，曲霉菌在空腔内腐物性寄生形成曲霉球；一般为单个，偶双肺同时出现；\n咯血是本病的重要症状，可有慢性咳嗽，少数咯出咖啡色颗粒状物（曲菌球脱落的碎片，镜检可找到菌丝）；\n典型 X 线表现：空洞中致密团块状阴影，占空洞的部分或大部分，空洞其余部分呈半月形或新月形气体阴影；\n由于菌丝不侵袭空洞壁，较小的团块状阴影可在空洞内移动、随体位改变而移动。' },
  { m: '22C', q: '过敏性支气管肺曲霉菌病（ABPA）的特点？', a: '曲霉引起的过敏性肺疾病，绝大多数发生于哮喘或有过敏性疾病的患儿；\n典型病理：中央气道扩张、常有黏液堵塞，远端气道通常正常；曲霉菌丝与支气管壁紧密相邻但界限清楚，不侵入管壁和血管；\n表现：首发支气管痉挛短暂、后期慢性；特征性为咳黏液栓性痰（有时棕黄色痰栓）、咯血、间断发热、胸痛、反复肺炎、顽固性喘息；\nX 线：同一部位反复出现或游走性浸润影，黏液栓形成的分支状阴影（指套征）和中心性支气管扩张；孢子阻塞支气管可致短暂性肺段或肺叶不张；\n实验室：外周血和痰液嗜酸性粒细胞升高；血总 IgE 及曲霉特异性 IgG 和 IgE 明显升高；曲霉抗原速发型或迟发型皮肤超敏反应阳性。' },
  { m: '22C', q: '侵袭性肺曲霉菌病的临床与 CT 演变特点？', a: '见于血液恶性肿瘤化疗后、骨髓造血干细胞移植后、麻疹等病毒感染后，免疫受损越严重越易发生急性型；\n表现：长期发热、咳嗽、咳痰；咯血是本病不同于一般细菌性肺炎、有诊断参考价值的症状；约 30% 患者有肺外器官受累（鼻窦、肝、肾、中枢神经系统、心内膜），可迅速进展为呼吸衰竭；慢性型进展缓慢，可长达数月至数年，可波及整个肺、胸腔、纵隔和胸壁（胸壁脓肿）；\n急性型 CT 演变：早期（0~5 天）双肺弥漫性结节实变阴影（多位于胸膜下），周围磨玻璃阴影——晕轮征（halo sign）；5~10 天病灶增大、液化坏死出现空腔阴影；10~20 天病灶呈半月形透光区——空气新月征（air-crescent sign），进一步变为坏死空洞；\n慢性型 CT：单发或多发肺实变伴结节、胸膜肥厚或积液、空洞形成，病灶周围显著炎症反应，慢性组织破坏酷似慢性纤维空洞性肺结核。' },
  { m: '22C', q: '慢性肉芽肿病患儿与曲霉菌感染的关系？', a: '慢性肺部曲霉病主要见于慢性肉芽肿病等免疫缺陷患儿，并可作为免疫缺陷病的首发表现；\n提示线索：肛周脓肿、卡介苗接种部位化脓（卡疤较正常增大）、接种部位同侧腋窝淋巴结肿大破溃或钙化、皮肤或其他部位淋巴结反复化脓形成皮肤瘢痕；\n急性肺部曲霉病早期为弥漫性渗出性改变，之后组织化脓及坏死，病灶内可找到大量菌丝；曲霉菌丝易穿透血管引起血管炎、血栓形成，致组织缺血和梗死；慢性型表现为组织坏死和慢性肉芽肿炎症（尽管有组织坏死，不易找到曲霉菌丝）。' },
  { m: '22C', q: '曲霉菌病的诊断（培养、GM 试验）？', a: '直接涂片：菌丝或曲霉菌孢子；培养：曲霉是实验室常见污染菌，只有反复培养出同一曲霉菌并结合临床表现方有诊断价值；脑脊液呈血性且原因不明时更宜做真菌培养；组织病理：根据病理组织内的真菌形态确诊；\nGM 试验（半乳糖甘露聚糖抗原检测）：半乳糖甘露聚糖仅存在于曲霉细胞壁中，侵袭性感染时释放入血可检出——阳性提示侵袭性曲霉感染；最早可在发病前 5~8 天从血液中检出；\n假阳性率较高人群：新生儿（双歧杆菌干扰）、自身抗体阳性、菌血症患儿、使用半合成青霉素、异体骨髓抑制患儿；\nBAL（支气管肺泡灌洗液）GM 阳性对肺部侵袭性曲霉病有诊断意义；脑脊液 GM 升高提示中枢神经系统曲霉病；脑曲霉病时 GM 可呈阴性。' },
  { m: '22C', q: '曲霉菌病的治疗？', a: '一线方案：两性霉素 B 和伏立康唑；二线：伊曲康唑和卡泊芬净；氟康唑对曲霉菌无效；\n剂量：伏立康唑每次 9 mg/kg q12h；卡泊芬净负荷 70 mg/m²、维持 50 mg/m²；脂质两性霉素 B 3~5 mg/（kg·d）或两性霉素 B 0.7~1 mg/（kg·d）；\n注意：伏立康唑与其他药物相互作用多，肌酐升高的患儿只能口服不能静脉给药（溶媒可在体内蓄积）；卡泊芬净批准用于补救治疗；伊曲康唑用于标准抗真菌治疗无效或不耐受者，儿童剂量尚未确定；难治病例可联合（卡泊芬净 + 唑类或两性霉素 B 脂质体）；\n疗程：侵袭性肺曲霉病至少 6~12 周；免疫缺陷患儿应在免疫缺陷时期持续治疗直至病灶吸收；\n外科：药物治疗后迁延不愈、合并大咯血、病变局限能耐受手术时手术切除病变。' },
  { m: '22C', q: '隐球菌病的病原学与感染途径？', a: '致病菌主要是新生隐球菌及其 9 个变种，其他（浅黄、浅白、罗伦隐球菌）很少见；\n新型隐球菌属酵母菌，圆形或椭圆形，不形成菌丝和孢子，出芽生殖，直径 5~12μm，四周包裹肥厚的荚膜；\n鸽粪被认为是最重要的传染源（马、奶牛、狗、猫、貂、猪及土壤、水果、牛奶中也可分离）；\n感染途径：① 吸入空气中的孢子（主要途径），先到肺部继而播散全身；② 创伤性皮肤接种；③ 摄入带菌食物经肠道播散；\n新生儿可因分娩经过带菌产道受感染，很容易侵犯中枢神经系统引起脑膜炎，也可能经胎盘传染。' },
  { m: '22C', q: '隐球菌病的病理变化特点？', a: '基本病理变化两种：早期弥漫性渗出性病变，晚期肉芽肿形成；\n早期：大量新型隐球菌集聚成团，荚膜物质有抑制中性粒细胞渗出的作用——病灶处主要是单核细胞、淋巴细胞和浆细胞，中性粒细胞很少；菌体周围胶样荚膜使菌体与组织没有直接接触，所以组织的炎症反应不明显；少数失去荚膜的菌体周围可出现较明显炎症细胞浸润；\n免疫功能正常者：常形成非干酪性肉芽肿，巨噬细胞胞质内可见被吞噬的隐球菌；\n免疫功能低下者：不易见到肉芽肿，但肺泡腔中充满隐球菌孢子。' },
  { m: '22C', q: '中枢神经系统隐球菌病的临床与脑脊液特点？', a: '新型隐球菌易侵袭中枢神经系统，引起亚急性或慢性脑膜炎及脑膜脑炎，临床表现颇似结核性脑膜炎；临床分四型：脑膜炎型（最常见）、脑膜脑炎型、肉芽肿型和囊肿型；\n起病缓慢，开始多为轻度阵发性头痛后逐渐加重、经常反复，伴恶心呕吐、眩晕及不同程度发热；可有偏瘫、失语、共济失调；数周或数月后出现颅内压增高（颈强直、脑膜刺激征阳性及视物模糊、眩晕、复视、畏光、眼球麻痹、震颤、弱视等眼部征象），伴眼底水肿及视网膜渗出性病变；严重暴发者数周内死亡；新生儿病程较短、预后恶劣；\n脑脊液与结脑不易区分：外观微浊，白细胞总数约 (0.05~0.5)×10⁹/L、主要为淋巴细胞，糖与氯化物均降低，蛋白常在 2 g/L 以上（与本病炎症表现不相平行）。' },
  { m: '22C', q: '肺隐球菌病与其他部位表现？', a: '肺隐球菌病可单独发生或继发于肺结核、支气管扩张等，可先于中枢神经系统隐球菌病发病（肺部肉芽肿可为原发灶）；症状多较轻，与肺结核不易区分（低热、咳嗽、黏液性痰、胸痛、倦怠、体重减轻），多趋于自愈；少数急性肺炎型迅速进展致呼吸衰竭（多见于严重免疫抑制患儿）；\n影像四型：①双肺小结节或单肺大的肉芽肿（直径可达 6 cm 或更大，可中心坏死和空洞，胸膜下分布、支气管血管束分布多）；②浸润阴影（似肺结核，常伴纵隔或肺门淋巴结肿大）；③两肺类似粟粒性播散（基本见于播散者）；④纵隔淋巴结肿大；钙化、干酪性坏死罕见；\n皮肤黏膜隐球菌病：很少单独发生，面部痤疮样皮疹、硬结或中心坏死形成溃疡；\n骨隐球菌病：好侵犯颅骨及脊柱，慢性多发散在破坏性病变、无骨膜增生；\n播散性：两个不相邻器官同时发生，肝脾淋巴结肾、中枢神经常见，颈部淋巴结肿大常为局部表现。' },
  { m: '22C', q: '隐球菌病的病原学与血清学诊断？', a: '墨汁染色法：迅速、简便而可靠——脑脊液离心沉渣涂片加墨汁镜检，见圆形孢子（直径 5~20μm）、内有反光颗粒、外围一厚膜，有时见出芽孢子、无菌丝；病程早期可出现阴性结果，应坚持多次检查仔细寻找；\n真菌培养：脑脊液、痰液、血液、骨髓等培养，室温或 37℃ 3~4 天见菌落；播散性隐球菌病血液和骨髓培养阳性；\n乳胶凝集试验检测隐球菌荚膜多糖抗原：早期诊断的主要手段，敏感性特异性高、快速灵敏；单独肺部隐球菌病一般阴性，伴有脑膜炎和腹腔隐球菌病时基本阳性；抗原滴度升降可提示疗效和预后——滴度无变化或上升提示疾病恶化和预后不良，痊愈后血清学检测又多次出现抗原应考虑复发。' },
  { m: '22C', q: '隐球菌性脑膜炎的鉴别诊断与预后？', a: '与结脑鉴别：接触史（鸽子 vs 结核病）和病原学检查（脑脊液隐球菌荚膜多糖抗原、墨汁染色或真菌培养）、PPD 试验、肺内有无结核病灶；两者很相似，对无明显结核病接触史的疑似结脑患儿应常规进行隐球菌病原学检查；\n肺部隐球菌病与肺结核鉴别要点：多有鸽子接触史；无结核病接触史、PPD 阴性、抗结核治疗无效；血清、BAL 及脑脊液抗原阳性、墨汁染色或真菌培养阳性；\n预后：隐球菌性脑膜炎如不治疗几乎全部死亡，经适当治疗后病死率降至 25%（多系脑干受压致死）；即使治疗成功往往遗留视神经萎缩、脑积水、性格改变甚至痴呆；治疗后 1~2 年内可以复发，长期随访脑脊液是必要的。' },
  { m: '22C', q: '隐球菌病的治疗？', a: '免疫基本正常、非脑膜炎肺隐球菌：氟康唑 8 周至 6 个月或更长；严重病例两性霉素 B 0.5~0.8 mg/（kg·d），病情控制后换氟康唑 8~10 周或更长；或伊曲康唑口服溶液 6~12 个月；\n免疫正常的中枢或播散性：两性霉素 B 0.5~0.8 mg/（kg·d）± 氟胞嘧啶 25 mg/kg q6h 直到培养阴性，换氟康唑 8~10 周或更长（有推荐氟康唑 2 年防复发）；脑脊液压力很高可脑室引流；播散性感染、有神经系统异常和大量病原体感染（血清高抗原）者诱导期需两性霉素 B + 氟胞嘧啶防止治疗失败；\n免疫抑制宿主：两性霉素 B 0.7~1 mg/（kg·d）+ 氟胞嘧啶 25 mg/kg q6h 直到培养阴性，巩固期氟康唑维持；若能测定抗原，一般治疗至脑脊液抗原滴度 1:4 以下；\n伊曲康唑不易通过血脑屏障（脑脊液浓度低但脑组织浓度高），实际效果次于氟康唑，主张与两性霉素 B 联用或转阴后维持治疗；伏立康唑可通过血脑屏障，有个例报道对耐氟康唑病例有效；\n手术：限局性病灶（皮肤、胸部肉芽肿及脓肿、肺部肉芽肿及空洞）在未合并中枢隐球菌病时可手术切除，手术前后均需用两性霉素 B 等药物。' },

  // ===== 模块 22D 组织胞浆菌·毛霉·马尔尼菲·放线菌 =====
  { m: '22D', q: '组织胞浆菌病的要点？', a: '病原：荚膜组织胞浆菌，以侵犯单核巨噬细胞系统或肺部为主的深部真菌病；本病在我国很少见；\n传染源：自然界带菌的禽鸟类（鸡、蝙蝠、鸽）或其粪便污染的土壤、尘埃；呼吸道是主要传染途径；与城市化、砍伐森林、使用鸟粪有机肥、蝙蝠洞探险有关；\n约半数患儿为儿童，6 个月至 2 岁发病率最高且多为播散型；\n3 个类型：肺型（急性：实变和肺门淋巴结肿大，常误诊结核病；慢性：类似肺结核）、播散型（约半数见于婴幼儿，最常受累的是肺，可感染性休克并发多脏器功能衰竭，肝脾淋巴结肿大、贫血、白细胞及血小板减少，X 线粟粒样肺浸润）、皮肤型（多见于成人）；\n诊断：骨髓涂片见巨噬细胞内椭圆形酵母样孢子；真菌培养 2~4 日出现白色菌落、镜检见大型分生孢子；\n治疗：支持治疗；两性霉素 B 为中~重度或播散性病例一线用药，伊曲康唑用于轻症或降阶梯治疗；局限性皮肤或肺部损害可手术切除。' },
  { m: '22D', q: '接合菌病（毛霉病）的病原学与病理特征？', a: '又称毛霉病、藻菌病；最常见致病菌 4 种：根霉属、毛霉属、犁头霉属、小克银汉霉属；毛霉菌广泛存在于腐朽的草木、含糖成分高的食物、水果和食草动物的粪便中；\n感染途径：孢子经呼吸道进入肺和鼻窦为主，亦可因吞入引起胃肠道感染；多见于骨髓造血干细胞移植后及糖尿病酮症酸中毒患儿；\n病理：侵袭性很强，侵入后很快长出大量菌丝并迅速扩散；侵袭血管能力强——菌丝侵入血管壁形成血栓，引起梗死远端组织缺血、缺氧和酸中毒，导致局部组织出血坏死；\n病变进展较快、病死率较高；浸润、血栓形成、坏死、化脓是病理特征；坏死区、血管壁、血管腔和血栓内均可见大量菌丝，但很少见到肉芽肿（本病的特征性改变）；\n菌丝形态：大量长的分支而不分隔的菌丝，常与血管平行，分支与主干成直角；菌丝很粗，直径可达 30μm，HE 染色较淡、PAS 染色清晰显示，一般无孢子。' },
  { m: '22D', q: '毛霉病的临床表现？', a: '皮肤毛霉病：常见于儿童及少年，多呈慢性经过；\n鼻、鼻旁窦和眼毛霉菌病：常见于糖尿病患儿；初发症状很似细菌性鼻窦炎（低热、鼻窦疼痛、非脓性鼻分泌物、偶带血丝），数日后直接蔓延至眼眶（眼睑下垂、眼肌麻痹、眼球突出、视物障碍）和脑膜；眼部病变也可为播散性病变的一部分或眼外伤/手术后发生；\n肺毛霉菌病：从支气管肺炎到大叶性肺炎，常有空洞可形成毛霉球；毛霉具极强组织穿透能力，常侵蚀肺动脉——肺血管损害致血栓形成和肺梗死、肺动脉瘤和假性血管瘤，可造成支气管-胸膜瘘、支气管-皮肤瘘、支气管-动脉瘘；急性或亚急性起病，病情严重，咯血和胸痛是比较突出和有诊断参考价值的症状，常因大咯血死亡；影像初起支气管肺炎样浸润影或结节影，迅速融合大片实变或肿块样改变、常有空洞，较大肺血管栓塞呈楔形阴影，早期可有反晕轮表现；\n胃肠道毛霉菌病：任何部位多发性溃疡及黏膜缺血性坏死，常见于营养不良及重症体弱儿，可腹泻腹痛血样便、肠穿孔及腹膜炎；\n暴发起病的肺接合菌易发生血行播散（中枢神经、胃肠道、脾、肾、心、肝），几乎都是致死性的。' },
  { m: '22D', q: '毛霉病的诊断与治疗？', a: '诊断：支气管镜可见支气管黏膜红肿、溃疡或黏液、脓性或凝胶状物和坏死组织，坏死组织检查有大量菌丝；肺型和播散型毛霉病临床上很难与侵袭性曲霉菌病区别，需以活检标本培养对病原菌种类进行鉴别；\n治疗：① 继发于糖尿病的鼻、鼻窦毛霉菌病首先认真正规治疗糖尿病，同时外科清创 + 静脉两性霉素 B（鼻窦清创术后可每日用两性霉素 B 1 mg/ml 冲洗窦腔，直至病变停止发展后仍坚持治疗 1 个月）；有条件者手术清除气道和肺部坏死组织；尽力纠正免疫缺陷状态、停用抗生素和类固醇皮质激素、加强支持；\n脂质体两性霉素 B 或两性霉素 B 为毛霉菌病一线用药，治疗直至感染的临床症状和体征、影像学消失或稳定、基础免疫抑制状态好转；\n泊沙康唑用于免疫抑制患儿的二级预防——该菌对伏立康唑耐药，长期使用伏立康唑预防治疗易患接合菌感染。' },
  { m: '22D', q: '马尔尼菲青霉病的要点？', a: '病原：马尔尼菲青霉菌——青霉菌中唯一的温度依赖性双相菌，为条件致病菌，致病性较强、可寄生于细胞内；\n有明显地域性：主要流行于东南亚、东亚，我国患者主要集中在广西、广东（海南也有报道）；多发生于艾滋病患者和其他免疫抑制患者（以 X 连锁高 IgM 为主）；\n局限性肺型：吸入孢子致病，损害单核巨噬细胞系统，临床表现不具特征性，极易误诊为支气管炎、细菌性肺炎、肺结核、肺脓肿，可经血行或淋巴播散；\n播散型：多由肺部播散至全身（肝脾、血液和淋巴结），主要症状为发热（39~40℃、不规则、反复出现且持续时间长），多数伴贫血、体重减轻，肺部受累表现咳嗽咳痰胸痛；淋巴结和肝脾大；\n影像：斑片状实变影、结节状影、结节空洞形成，播散病例弥漫性结节影，可伴纵隔及肺门淋巴结肿大、胸膜增厚、胸腔积液；\n诊断：凝胶状物和坏死组织涂片和培养阳性、血液培养阳性、二代病原微生物测序（NGS）作为确诊依据；\n治疗：对两性霉素 B 和伊曲康唑治疗敏感。' },
  { m: '22D', q: '放线菌病的病原学与病理特点？', a: '病原：人型放线菌（以色列放线菌），厌氧或微厌氧革兰阳性细菌，非抗酸性，菌丝可断裂成杆菌或球菌形；健康人群齿垢、龋齿、牙周脓肿、扁桃体内均可找到该菌；抵抗力低下时由口腔黏膜破损处侵入（经口吞咽者寄居于回盲部或阑尾）；\n病理：慢性化脓性、肉芽肿性疾病；主要侵犯颈、胸部和腹部；病变扩散由原发病灶沿结缔组织直接向周围蔓延——尚未发现经淋巴扩散者，淋巴结不受感染；\n组织产生肉芽肿结节（中央脂肪性变及化脓、周围结缔组织增生，放线菌居于结节中央）；\n特征性：瘘管溢出脓液中含淡黄色硫磺样颗粒。' },
  { m: '22D', q: '放线菌病的临床分型（面颈型、腹部型、胸部型）？', a: '面颈型（最常见）：放线菌由口腔或咽部黏膜伤口侵入，以下颚最易被波及——局部红肿渐次发硬如木质（板样硬），皮肤变暗红或黄紫色时变软成脓肿，穿破皮肤形成多数窦道，排出物含硫磺样颗粒；病变波及咀嚼肌可有牙关紧闭；慢性期痛感尽失，可波及颅骨、眼眶、中耳、肺及脑；\n腹部型：多由肠道而来（最常见原发灶位于阑尾，波及输卵管、胆囊、肝脏等）；急性期初发很像阑尾炎、手术所见亦与化脓性阑尾炎相同，但术后伤口很难愈合终成瘘管；慢性者数月后右髂窝部发生硬性肿物；肝脏受累胀大微痛（易误诊肝脓肿或肝肿瘤）；\n胸部型：原发一般由呼吸道侵入（也可自食管或腹腔继发感染）；初似支气管炎（咳嗽咳痰、痰内可见硫磺样颗粒），进而肺炎样病变（发热 37~39℃、胸痛、呼吸困难，可伴胸腔积液和脓胸）；累及胸壁则皮下肿胀→溃疡及瘘管，溢出脓液含硫磺样颗粒；气管破裂时咳大量恶臭脓性痰，颇似肺脓肿、肺坏疽或支气管扩张。' },
  { m: '22D', q: '肺放线菌病的影像特点与诊断？', a: '影像典型表现：周围结节，进展时形成肿块或慢性节段性实变，常位于肺外周胸膜下，多伴胸膜增厚；病变内可形成低密度液化灶或空洞，液化灶内可有囊性病变和气泡影——气体的分布与重力无关、不形成液平面，称"空气悬浮征"，为肺放线菌病的典型表现（易误诊为曲霉菌球）；增强后病灶呈外周环形强化；可伴胸腔积液或纵隔淋巴结肿大；\n支气管内感染者表现为管腔分泌物堵塞，近端支气管内膜可发生钙化，伴远端阻塞性肺炎；\n患儿多有继发性贫血、白细胞略增多、中性粒细胞显著增多、血沉增快；\n诊断：瘘管溢出液或病变处活组织内查到放线菌（尤其找到硫磺样颗粒）即可确诊；\n硫磺颗粒检查法：取脓液少许放入清水试管内摇动，放线菌颗粒沉于试管底部，取颗粒置两玻片间压碎镜检可见菌体，重复洗净颗粒后可作培养。' },
  { m: '22D', q: '放线菌病的鉴别诊断与治疗？', a: '鉴别：颈部放线菌病与普通化脓性病变（后者发病急、显著疼痛及毒血症症状，切开引流或药物治疗痊愈较快）；活体组织检查与肿瘤鉴别；\n与结核病鉴别：肺放线菌病多有胸痛、纵隔淋巴结无病变，有时病变可穿破胸壁或膈肌（结核病无此现象）；阴性结核菌素反应常有助于鉴别诊断；\n治疗：大剂量长疗程青霉素为标准治疗——静脉注射大剂量青霉素 2~6 周，然后口服青霉素或阿莫西林 6~12 个月；短疗程也可能成功，但少于 3 个月可能导致局部并发症或复发；青霉素过敏者选用红霉素、头孢类、亚胺培南、克林霉素等；\n因细菌耐药常是治疗失败原因，目前建议一线方案包括 β-内酰胺 + β-内酰胺酶抑制剂（如特治星）；\n合并脓胸、脓肿、瘘管、窦道、大咯血可手术治疗，手术切除后需联合长期抗生素治疗。' },
];

const CARDS_CH23 = [
  // ===== 模块 23A 钩端螺旋体病 =====
  { m: '23A', q: '钩端螺旋体病的临床特点与病原学？', a: '临床特点：高热、全身酸痛、乏力、结膜充血、淋巴结肿大、腓肠肌压痛；重者肺出血、黄疸、脑膜脑炎、肾衰竭；\n病原：钩端螺旋体，纤细丝状、圆柱形，有 12~18 个螺旋，两端呈钩状；外鞘膜与细胞壁之间有两根轴丝（内鞭毛）；革兰染色阳性但着色困难；\n培养：需氧，柯氏培养基（含兔血清）；\n抗原分类：全球 25 个血清群、200 多个血清型，我国已发现 19 群 161 型。' },
  { m: '23A', q: '钩体病的传染源、传播途径与流行形式？', a: '传染源：鼠类（南方以黑线姬鼠最重要，携带黄疸出血群、毒力最强）和猪（南北两地均为主要传染源，携带波摩那群、毒力较弱）；犬型毒力较低；\n传播途径：接触疫水（最主要途径，儿童嬉水易感染），也可经黏膜、胎盘及乳汁传播；\n流行形式：\n① 稻田型——南方水稻产区，主要由鼠类传播；\n② 雨水型——暴雨后积水，接触污染的水；\n③ 洪水型——北方主要流行形式，家畜（猪）为主要传染源，洪水后 3~4 天开始发病、9~14 天达高峰，高峰时病例占 70~80%。' },
  { m: '23A', q: '钩体病的潜伏期与三期经过？', a: '潜伏期 2~25 天，多数 7~12 天，平均 10 天；\n三期经过：\n① 早期（钩体血症期）：1~3 天，发热多为稽留热、头痛（前额部突出）、肌痛（以腓肠肌最显著）、结膜充血伴畏光；\n② 中期（器官损伤期）：病后 3~14 天，出现各器官损害表现；\n③ 后期（恢复期/后发症期）：热退后 7~14 天，部分患者出现后发热、眼后发症、神经系统后发症等。' },
  { m: '23A', q: '钩体病的临床分型及各型要点？', a: '① 流感伤寒型：最常见，北方 90% 以上病例属此型，临床表现类似流感或伤寒，无器官明显损害；\n② 肺大出血型：病情凶险，可在数小时内迅速恶化，口鼻涌出泡沫样鲜血，最终心率减慢、呼吸停止；\n③ 黄疸出血型（Weil 病）：3~5 日体温下降时出现黄疸，80% 有出血倾向，可有肾衰竭；抗生素应用前病死率达 60~70%，现已降至 10% 以下；\n④ 脑膜脑炎型：病后 4~7 日出现脑膜脑炎表现。' },
  { m: '23A', q: '钩体病的实验室诊断方法？', a: '① 凝集溶解试验（显凝试验）：抗体效价 ≥1:400，或双份血清效价 4 倍升高——病后 1 周出现；\n② 补体结合试验：效价 ≥1:20，病后 2~3 天即可查出，可用于早期诊断；\n③ 反向乳凝试验：病后 3 日内可查抗原；\n诊断标准分三级：\n疑似诊断——流行病学史 + 三症状（发热、肌痛、乏力）之一；\n临床诊断——再加三体征（结膜充血、腓肠肌压痛、淋巴结肿大）之一；\n确诊——再加以上实验室检查任一阳性。' },
  { m: '23A', q: '钩体病的治疗（首选药、剂量、赫氏反应）？', a: '青霉素 G 为首选：首剂 40 万 U，以后每日 120~160 万 U，疗程 5~7 天；\n赫氏反应：首剂青霉素后 0.5~4 小时出现的治疗加重反应（寒战高热、病情恶化）；重症患者首剂并用肾上腺皮质激素，治疗用氢化可的松 4~8 mg/kg 或地塞米松 1~2.5 mg；\n替代药物：庆大霉素 5 mg/kg、氨苄西林 80~120 mg/kg；\n注意：肺出血型若误诊为细菌性肺炎而用大剂量青霉素，易诱发赫氏反应并导致肺弥漫性大出血，危及生命。' },
  { m: '23A', q: '钩体病的后发症（恢复期表现）？', a: '热退后 7~14 天出现，主要有：\n① 后发热：退热后再次发热，一般较轻；\n② 眼后发症：以葡萄膜炎最常见；\n③ 神经系统后发症：闭塞性脑动脉炎——即烟雾病（moyamoya 病），病后 2~3 个月发病，表现偏瘫、失语，80% 见于儿童，是钩体病最严重的后发症；\n后发症与机体变态反应有关，多数预后较好，但烟雾病可遗留神经系统后遗症。' },
  { m: '23A', q: '钩体病的预防措施？', a: '① 菌苗接种：流行季节前 1~2 个月接种；7~14 岁用成人量减半，2~6 岁用 0.25/0.5 ml；免疫力维持 1 年；新疫区需连续普遍接种 3~4 年；\n② 药物预防：多西环素 200 mg 每周 1 次，保护率 85%；\n③ 管理传染源：灭鼠、管好家畜（猪粪无害化处理）；\n④ 切断传播途径：避免接触疫水、兴修水利防止内涝。' },
  { m: '23A', q: '钩体病肺大出血型的临床表现与抢救要点？', a: '表现：起病后迅速出现咳嗽、痰中带血→大量咯血，口鼻涌出泡沫样鲜血，两肺弥漫性湿啰音；可在数小时内恶化至心率减慢、呼吸停止；\n机制：肺毛细血管广泛出血、渗血；\n抢救：\n① 镇静：减少搬动和情绪刺激；\n② 肾上腺皮质激素：氢化可的松 4~8 mg/kg 或地塞米松 1~2.5 mg 静滴，根据病情可重复；\n③ 抗生素：小剂量青霉素分次静滴（避免大剂量诱发赫氏反应）；\n④ 止血、输新鲜血、纠正休克；\n⑤ 心率减慢是危险信号，可用肾上腺素静注提高心率。' },
  { m: '23A', q: '钩体病与哪些疾病鉴别？鉴别要点？', a: '① 流行性感冒/伤寒：钩体病肌痛显著（腓肠肌）+ 浅表淋巴结肿大是重要鉴别点；\n② 败血症：血培养鉴别；\n③ 流行性出血热：肾功能损害突出、典型五期经过；\n④ 急性黄疸型肝炎：无腓肠肌痛及结膜充血；\n⑤ 肺结核咯血：结合流行病学及血清学；\n鉴别诊断中肌痛显著 + 浅表淋巴结肿大对钩体病最有提示价值。' },

  // ===== 模块 23B 回归热·鼠咬热 =====
  { m: '23B', q: '回归热的病原学与流行病学（虱传 vs 蜱传）？', a: '回归热螺旋体（疏螺旋体属），临床特点为反复急性螺旋体血症——发热期与螺旋体被清除的无热期交替出现；\n病原体抗原变异（VMPs 基因重排）导致回归发作；\n虱传回归热：病原为回归热包柔螺旋体（B. recurrentis），体虱传播——螺旋体存在于血淋巴液中，挤碎虱体后体液经破损皮肤/黏膜进入人体；虱不能垂直传播；\n蜱传回归热：多种疏螺旋体，钝缘蜱传播——夜间叮咬不痛而易被忽视；可经卵垂直传播数代；\n螺旋体长 12~22μm、3~10 个粗螺旋，革兰染色阴性、难着色，微需氧，最适温度 30~35℃，BSK 培养基培养。' },
  { m: '23B', q: '回归热的临床表现与诊断？', a: '潜伏期平均 7 天（4~18 天）；\n表现：急起高热，伴头痛、肌痛、肝脾大；发热期外周血涂片可查到螺旋体（约 70% 检出，无热期查不到——非发热期采血阴性不能排除）；未经治疗者发热 2~7 天后自发危象退热，经无热期后复发，复发次数越多症状越轻；\n诊断：外周血涂片找螺旋体为首选；\n鉴别：伤寒、斑疹伤寒、疟疾、登革热、鼠咬热、钩体病。' },
  { m: '23B', q: '回归热的治疗注意事项？', a: '① 低剂量青霉素开始，体温下降后再加量，避免单剂大剂量——可致脑内残留螺旋体在免疫抑制时被激活；\n② 赫氏反应发生率随青霉素剂量增加：10 万 U 时 5.1%，40 万 U 时达 31.1%；\n③ 8 岁以上用四环素类；7 岁以下蜱传回归热用红霉素 40~50 mg/（kg·d）；\n④ 支持治疗：发作期必须平卧 24 小时以上，防止低血压休克；\n⑤ 维生素 K 治疗凝血酶原时间延长，不推荐肝素；\n预防：灭虱灭蜱，无疫苗。' },
  { m: '23B', q: '鼠咬热的两种病原及流行病学？', a: '① 小螺菌（ Spirillum minor）型：亚洲多见，又称 Sodoku；\n② 念珠状链杆菌型：美国多见，经鼠咬或经口摄入污染牛奶/水（Haverhill 热）感染；\n传染源为鼠类（家鼠、野鼠），其他啮齿动物及猫狗也可带菌；\n两型螺旋体均对青霉素敏感（小螺菌更敏感）。' },
  { m: '23B', q: '小螺菌型鼠咬热的临床表现？', a: '潜伏期 1~4 周（一般 2~3 周）；\n① 原已愈合的伤口处再度出现疼痛、肿胀、发紫甚至坏死，形成类似梅毒下疳的溃疡及硬结（下疳样溃疡）；\n② 发热：弛张热，持续 3~5 天后大汗骤退；\n③ 皮疹：发热第一周出现紫色或红棕色斑疹，多见于肢体等突出部位；\n④ 关节炎、肌痛罕见——是与念珠状链杆菌型鉴别的要点；\n⑤ 发热反复 6~8 次，持续数周至数月；\n⑥ 半数患者梅毒血清学假阳性。' },
  { m: '23B', q: '念珠状链杆菌型鼠咬热的临床表现？', a: '潜伏期 3~21 天（一般 2~3 天）；\n① 伤口很快愈合，无硬结、溃疡（与小螺菌型鉴别要点）；局部淋巴结肿大不常见；\n② 严重游走性关节痛和肌痛——本型标志症状；马鞍形发热；\n③ 发热 2~4 天后出现皮疹：手掌、足跖斑丘疹或麻疹样皮疹、出血点，持续 1~3 周，疹退脱屑；\n④ 半数以上病例于病后 2 周发生多发性关节炎（膝关节最常见，无游走性）；\n⑤ 未治疗者可反复发热、关节炎长达 2 年；25% 梅毒血清假阳性；白细胞可达 30×10⁹/L；\n⑥ 经口感染者为 Haverhill 热，伴呕吐、腹泻等消化道症状。' },
  { m: '23B', q: '小螺菌型与念珠状链杆菌型鼠咬热如何鉴别？', a: '① 原发灶：小螺菌型伤口再度红肿坏死形成下疳样溃疡和硬结；链杆菌型伤口很快愈合、无硬结溃疡；\n② 局部淋巴结：小螺菌型局部淋巴结肿大常见；链杆菌型不常见；\n③ 关节症状：小螺菌型关节炎肌痛罕见；链杆菌型游走性关节痛/肌痛为标志，半数以上有多发关节炎；\n④ 潜伏期：小螺菌型 1~4 周（较长）；链杆菌型 2~3 天（较短）；\n⑤ 两者均约半数梅毒血清学假阳性；\n⑥ 确诊：小螺菌型血液/病灶渗出液暗视野查螺旋体、动物接种；链杆菌型血培养或关节液培养。' },
  { m: '23B', q: '鼠咬热的治疗与预防？', a: '治疗：两型均首选青霉素——普鲁卡因青霉素 40 万 U 每 12 小时一次；\n① 小螺菌型首剂可能发生赫氏反应，宜减量开始；\n② 合并心内膜炎用大剂量青霉素 20~30 万 U/（kg·d），疗程 4~6 周；\n③ 青霉素过敏者可用红霉素、四环素类；\n预后：未经治疗的念珠状链杆菌型死亡率 13%，合并心内膜炎者死亡率 53%；\n预防：灭鼠；被鼠咬后立即彻底清创伤口，并口服青霉素 3 天预防。' },

  // ===== 模块 23C 先天性梅毒·雅司·品他 =====
  { m: '23C', q: '先天性梅毒的病原学与流行病学？', a: '唯一传染源：患梅毒的母亲，经胎盘传播；\n病原：苍白密螺旋体，长 5~15μm、6~14 个螺旋；分裂增殖一次需 30~33 小时；加热 40℃ 即失去传染力，100℃ 立即死亡；\n感染率：早期梅毒母亲胎儿感染率几乎 100%；患梅毒两年后妊娠，胎儿感染率可低至 35%；\n未经治疗孕妇所生新生儿先天梅毒发病率 42%；\n早期先天梅毒：2 岁以内发病，多在 2~10 周龄，类似成人二期梅毒；晚期先天梅毒：2 岁以后，类似成人三期梅毒。' },
  { m: '23C', q: '早期先天梅毒（2 岁以内）的临床表现？', a: '多在生后 2~10 周发病，类似二期梅毒：\n① 梅毒性鼻炎：最早出现的症状——鼻塞、张口呼吸、哺乳困难，分泌物脓血样；\n② 皮肤损害：最常见表现——红斑、丘疹、水疱、大疱、扁平湿疣，好发于口周、臀部、掌跖；特征性皮损为紫红/铜红色浸润性斑块带鳞屑；掌跖大疱及大片脱屑称梅毒性天疱疮；\n③ 骨损害：骨膜炎、骨髓炎、软骨炎，多侵犯长骨干骺端，表现肢体疼痛、假瘫（假性瘫痪），X 线检查才易发现；\n④ 肝脾肿大、全身淋巴结肿大；\n⑤ 可有贫血、血小板减少、黄疸等。' },
  { m: '23C', q: '晚期先天梅毒（2 岁以后）的临床表现与 Hutchinson 三征？', a: '类似成人三期梅毒：\n① 结节性梅毒疹和树胶肿：口周放射状皲裂性瘢痕；\n② 间质性角膜炎：8~15 岁发病，畏光、多泪；\n③ 神经性耳聋：10 岁左右，双侧急性起病；\n④ 楔状齿（Hutchinson 牙）：恒上门齿上宽下窄、切缘弧形缺损；桑葚样磨牙；\n楔状齿（Hutchinson 牙）+ 神经性耳聋 + 基质性角膜炎 = Hutchinson 三征，具有诊断价值。' },
  { m: '23C', q: '先天性梅毒的骨损害（Wimberger 征）？', a: '骨损害为早期先天梅毒重要表现：骨膜炎、骨髓炎、软骨炎，病变多在长骨干骺端；\nWimberger 征：双侧胫骨近端干骺端内侧对称性骨髓炎和病理性骨折——先天性梅毒特征性骨 X 线表现；\n临床：患儿肢体拒动、疼痛性假瘫；X 线片才易发现骨病变；\n机制：螺旋体侵犯生长旺盛的干骺端。' },
  { m: '23C', q: '先天性梅毒的血清学检查（两类试验的用途）？', a: '① 非螺旋体试验：VDRL、RPR、TRUST——检测抗心磷脂抗体；简便快速、定量，可用于疗效观察和判愈；RPR 滴度高于母亲 4 倍以上有诊断意义；\n② 螺旋体试验：TPPA、FTA-ABS、ELISA——检测抗螺旋体抗体；作为证实试验，特异性高，但不能用于疗效观察（治愈后仍可终身阳性）；\n③ 螺旋体 IgM 抗体：可早期诊断；\n新生儿诊断需结合母亲情况：若母亲 RPR 阳性而新生儿滴度 ≤ 母亲 4 倍，需随访。' },
  { m: '23C', q: '先天性梅毒的确诊标准？', a: '符合以下任一条可确诊：\n① 病变部位查到梅毒螺旋体（暗视野）；\n② 梅毒核酸（PCR）检测阳性；\n③ RPR/TRUST 滴度 ≥ 母亲 4 倍，且螺旋体试验阳性；\n④ 螺旋体 IgM 抗体阳性；\n⑤ 出生时血清阴性，随访中转为阳性或滴度升高；\n⑥ 18 月龄后螺旋体试验仍阳性（母亲传来的 IgG 抗体应在 12~15 月龄消失）。' },
  { m: '23C', q: '先天性梅毒的治疗？', a: '① 脑脊液正常：苄星青霉素 5 万 U/kg 单次肌注；\n② 脑脊液异常：\n水剂青霉素——日龄 <7 天：5 万 U/kg 每 12 小时一次；日龄 >7 天：每 8 小时一次；总疗程 10~14 天；\n或普鲁卡因青霉素 5 万 U/（kg·d）肌注，疗程 10~14 天；\n③ 无条件检查脑脊液者：按脑脊液异常治疗；\n治疗后随访：每 3 个月复查 RPR，滴度应在 6~12 个月下降，2 岁时转阴。' },
  { m: '23C', q: '妊娠期梅毒的治疗？', a: '方案：苄星青霉素 240 万 U 肌注，每周 1 次，共 3 次为 1 疗程；\n时机：妊娠早、晚期各治 1 疗程，两疗程间隔 4 周以上；\n临产时才发现梅毒：也给 1 个疗程；\n疗效：规范治疗可显著降低胎儿感染——未经治疗孕妇所生新生儿先天梅毒发病率 42%；\n注意事项：妊娠期治疗可能发生吉海反应（Jarisch-Herxheimer），导致早产、胎动减少，必要时住院观察；青霉素过敏者必须脱敏后用药（四环素类影响胎儿骨骼发育禁用）。' },
  { m: '23C', q: '雅司病的要点？', a: '病原：雅司螺旋体（T. pertenue）；非性病性接触传播，不经母婴传播；\n流行：热带农村地区（非洲、南美、东南亚、大洋洲），儿童为主要人群，原发感染多在青春期以前；\n临床表现：\n① 母瘤（雅司瘤）：覆盆子样皮损 3~4 cm、黄色薄痂，周围卫星状病灶，下肢多见，3~6 个月自愈留瘢痕；\n② 继发皮损：躯干四肢（极少累及生殖器——与梅毒鉴别点），足跖病变压痛致“蟹样雅司”步态；\n③ 晚期（约 10%，感染后 5~6 年）：溃疡 + 色素脱失、萎缩性瘢痕，长骨骨膜、骨质树胶肿性病变；\n骨病变特点：多骨受累、长骨骨干、局限骨膜骨质增生融合、骨皮质增厚，死骨极少见；\n实验室：TPPA/RPR 可诊断但不能与梅毒区分，PCR 可确定；\n治疗：阿奇霉素单次 30 mg/kg（最多 2 g）——WHO 推荐；或苄星青霉素（<10 岁 60 万 U，>10 岁 120 万 U）；\nWHO 2020 年提出消灭雅司倡议。' },
  { m: '23C', q: '品他病的要点？', a: '病原：品他密螺旋体；\n特点：仅皮肤受累、不残疾，称“温和性梅毒”；\n流行：拉丁美洲；\n临床表现：\n① 一期：丘疹，边缘外扩但不形成溃疡；\n② 二期：泛发皮疹；\n③ 三期：变色性斑疹——皮肤呈斑驳状棕色、灰蓝、黑色改变，皮损不能恢复、持续终身；\n实验室：暗视野可查见螺旋体；TPHA/TPPA 阳性且终身不阴转；\n治疗：单剂苄星青霉素（<10 岁 60 万 U），治愈率 97%；治疗后皮损 24 小时内失去感染性。' },

  // ===== 模块 23D 莱姆病·斑疹伤寒·恙虫病 =====
  { m: '23D', q: '莱姆病的病原学与流行病学？', a: '病原：伯氏疏螺旋体（B. burgdorferi），我国主要为伽氏疏螺旋体；\n传播媒介：硬蜱——北方全沟硬蜱、南方二棘血蜱/粒形硬蜱；\n潜伏期 1~180 天，多数 1~10 天，平均 7 天；\n流行：林区、山区，与蜱活动季节一致；\n先天性感染：妊娠最初 3 个月内患莱姆病可传播给胎儿。' },
  { m: '23D', q: '莱姆病第一期（局部 ECM 期）的表现？', a: '慢性游走性红斑（ECM）：蜱咬后 3~30 天（平均 7 天）出现；环形扩展，中央硬结后褪色，直径数 cm 至数十 cm；60~80% 患者出现，有确诊价值；\n局部期 1~4 周，可伴发热、乏力、头痛、肌痛、淋巴结肿大；\n莱姆性淋巴细胞瘤：罕见，耳廓、乳头、阴囊等处的紫红色结节。' },
  { m: '23D', q: '莱姆病第二期（播散感染期）的表现？', a: 'ECM 出现后 2~4 周（神经症状多在 2~6 周）：\n① 神经系统：浆液性脑膜炎、脑炎（约 1/3）；面神经损害（第Ⅵ对脑神经）最常见，可为唯一表现；2~3% 患者跳过皮损期直接表现为面神经麻痹；\n② 心血管系统：4~10% 出现房室传导阻滞，多在 ECM 后 3 周；高度房室传导阻滞需临时起搏器（通常自限）；\n③ 游走性多系统症状。' },
  { m: '23D', q: '莱姆病第三期（持续感染期）的表现？', a: '① 关节炎：起病 4 周后出现，非对称性、多发、游走性大关节炎，膝关节最常受累，持续平均 6 个月；\n② 慢性萎缩性肢端皮炎（ACA）：病后 6 个月~8 年，阿弗西尼螺旋体所致，多见于 40~70 岁女性；\n③ 眼部表现：结膜炎最常见；\n特点：持续感染与免疫介导炎症并存，抗生素疗程需延长。' },
  { m: '23D', q: '莱姆病的诊断与治疗？', a: '诊断：美国 CDC 两步法——ELISA/IFA 初筛，阳性者用 Western blot 确证；急性期仅 20~50% IgM 阳性，抗生素治疗后 2~3 周才 70~80% 阳性；PCR 皮肤活检敏感性高（但螺旋体死后核酸残留可假阳性）；LTT 用于早期经抗生素治疗后血清阴性者；\n治疗：\n早期口服多西环素（>12 岁或 >45 kg：100 mg 每日 2 次；9~12 岁或 <45 kg 第一日 2.5 mg/kg 每日 2 次、此后每日 1 次）；8 岁以下用阿莫西林 50 mg/（kg·d）（<33 kg 者 30 mg/kg 每日 3 次）；\n疗程：局限皮肤 10 天；早期播散 20~30 天；关节炎 30~60 天；神经/心脏 30 天；\n神经受累：静滴头孢曲松 100 mg/（kg·d）（<50 kg 者 80 mg/kg），或头孢噻肟、青霉素 G；\n预防：蜱咬后 24~72 小时内服多西环素 1 次 200 mg；疫苗（OspA）仍在研制中。' },
  { m: '23D', q: '流行性斑疹伤寒的病原、传播与发病机制？', a: '病原：普氏立克次体（R. prowazekii）；\n传播：体虱传播——虱粪污染叮咬伤口或黏膜进入人体；虱感染后 2~3 周死亡，不能垂直传播；冬春季流行；\n复发型：Brill-Zinsser 病（数年后体内潜伏立克次体再度繁殖引起，病情较轻）；\n立克次体特性：严格细胞内寄生、革兰阴性小杆菌、含内毒素样物质、56℃ 30 分钟灭活、-70℃ 可存活数年；\n发病机制：侵入毛细血管、小动脉、小静脉内皮细胞引起血管炎——血管周围炎症、血栓、微循环障碍，重症 DIC、休克。' },
  { m: '23D', q: '流行性斑疹伤寒的临床表现？', a: '潜伏期 10~14 天；\n① 急起高热，可达 40℃，持续；\n② 皮疹：发病 5 天左右出现，从腋窝开始、向心性分布；初为粉红斑疹、按之褪色，后变暗、出血点、融合；面部和手足掌面疹少——重要特征；\n③ 呼吸道：干咳；神经系统：耳聋、耳鸣，重症脑膜刺激征、谵妄、昏迷；\n④ 脾大多见；\n⑤ 病程 2~3 周，恢复体力需 2~3 个月；极重型 8~9 天死亡；\n⑥ 儿童病情总体较成人轻。' },
  { m: '23D', q: '地方性斑疹伤寒的要点？', a: '病原：莫氏立克次体（R. mooseri / R. typhi），亦称鼠型斑疹伤寒；\n传染源：鼠类；传播媒介：鼠蚤；夏秋季散发；\n临床特征与流行性斑疹伤寒相似但病情较轻：潜伏期平均 12 天，发热 1~2 周，第 5 日左右皮疹（斑疹或斑丘疹，多在躯干，偶见掌跖），可伴转氨酶升高、肺炎、脾大、蛋白尿；\n儿童热咳可不典型，经抗生素治疗者可不规则发热，消化道症状（腹痛、腹泻、恶心呕吐、便秘）及呼吸道症状多见；\n与流行性斑疹伤寒鉴别：病原体分离、补体结合试验区分。' },
  { m: '23D', q: '斑疹伤寒的实验室诊断与鉴别？', a: '血常规：白细胞多正常、中性粒细胞升高、嗜酸粒细胞减少或消失、血小板减少；\n血清学：\n① 外斐反应：OX19 效价 ≥1:160 或双份血清 4 倍升高（地方性斑疹伤寒同样阳性）；复发型常阴性；\n② 补体结合试验：1:32，第 1 周即可达；\n③ 立克次体凝集试验：1:40 阳性、特异性强；\n④ 间接免疫荧光：可鉴别普氏与莫氏立克次体；\n鉴别：伤寒（体温渐升、疹少、白细胞可减少）；恙虫病（OXk 阳性、OX19 阴性）；脑膜炎球菌菌血症、中毒性休克综合征等。' },
  { m: '23D', q: '斑疹伤寒的治疗与预防？', a: '治疗：多西环素 4 mg/（kg·d）分 1~2 次（8 岁以上；重症 4 mg/kg 每 12 小时一次，最大 100 mg，疗程 7~10 天）；较小儿童用氯霉素；退热后继续用药 1 周以上；\n注意：β-内酰胺类、氨基糖苷类无效；无快速诊断试验，疑似者确诊前即应开始治疗；医疗条件差、无特效药时病死率曾达 40%；\n预防：彻底灭虱是关键（洗澡、更衣、衣物高温洗涤/蒸煮灭虱），灭鼠灭蚤；无疫苗。' },
  { m: '23D', q: '恙虫病的病原学与流行病学？', a: '病原：恙虫病东方体（Orientia tsutsugamushi，Ot），旧称恙虫病立克次体，又名丛林斑疹伤寒；\n形态：双球或短杆状，严格细胞内寄生，吉姆萨染色显示良好；抵抗力弱，0.5% 苯酚或 56℃ 加热数分钟即死亡；\n传染源：鼠类（主要），食虫动物及猪、兔、家禽也可；人是偶然宿主；\n传播：恙螨幼虫叮咬（恙螨有趋汗性，温暖潮湿草丛丛林）；\n流行：环亚洲-太平洋三角区；我国 2006—2016 年报告 97775 例，广东、云南、安徽等 8 省占 94.67%；南方 6~10 月、北方 10~11 月为高峰；\n血清型：8 个，国际标准株 Karp、Gilliam、Kato；我国长江以南 Karp 型为主、以北 Gilliam 型为主；血清型间交叉免疫不强，可再感染其他血清型。' },
  { m: '23D', q: '恙虫病的临床表现？', a: '潜伏期 4~20 天（多 10~14 天）；急骤畏寒发热，弛张热 40~41℃，发热持续 7~21 天，剧烈头痛、肌痛；\n三联征：焦痂/溃疡 + 发热 + 皮疹；\n① 焦痂与溃疡：叮咬处红色丘疹→水疱→中央坏死出血成黑色焦痂（周围隆起、红晕）→溃疡；多位于隐蔽潮湿部位（腋窝、腹股沟、会阴、肛周）；\n② 皮疹：症状出现后约 5 天躯干暗红色充血性斑丘疹，向肢体扩展；\n③ 淋巴结：焦痂附近局部淋巴结肿大压痛，可伴全身淋巴结肿大；\n器官损害：肝脏最常见（肝功能损伤发生率 74.2%），呼吸系统第二（约 50%）；部分患儿第二周出现震颤、谵妄、耳聋、颈强直；\n严重并发症：肺炎、ARDS、急性肾衰、心肌炎、败血症性休克、MODS、脑膜脑炎；总死亡率可达 11.94%。' },
  { m: '23D', q: '恙虫病的诊断、治疗与预防？', a: '诊断：流行病学（地区、季节）+ 焦痂/溃疡 + 发热皮疹；血常规白细胞早期减低或正常、后期淋巴细胞增多、中性粒细胞减少；\n血清学：外斐反应 OXk 效价 ≥1:160 或双份血清 4 倍升高（约 50% 病例病程第二周阳性；OX19、OX2 不升高；钩体病可交叉反应）；间接免疫荧光/酶染特异性敏感性高；PCR 早期诊断敏感性特异性高；\n鉴别：斑疹伤寒、伤寒、布鲁菌病、钩体病、传单、弓形虫病、登革热；\n治疗：多西环素首选——8 岁以上 4 mg/（kg·d）分 1~2 次，热退后剂量减半，疗程 7~10 天；儿童及孕妇用阿奇霉素 10 mg/（kg·d）；氯霉素因耐药株和再障风险不作首选；喹诺酮类 18 岁以下不宜；耐药株可用利福平；\n预防：灭鼠、减少恙螨滋生地；进疫区穿防护服、用防虫剂；无有效疫苗（型别多、交叉免疫性差）。' },
];
