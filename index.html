  { m: '26A', q: '食管的解剖生理特点及食管先天性疾病有哪些？', a: '解剖生理：食管出生时长约8~10cm，成人约25cm；三个生理性狭窄——起始处（距中切牙15cm）、左主支气管交叉处（25cm）、食管裂孔处（40cm），为瘢痕性狭窄、憩室、肿瘤好发区；LES为食管下段1~3cm高压区，静息压10~30mmHg，比胃内压高5~10mmHg，是抗反流屏障；新生儿婴儿LES发育不成熟、食管呈漏斗状，易发生溢奶。\n先天性疾病：①双食管（极为少见）；②先天性食管狭窄三型——食管蹼（钡餐见蹼状隔膜凸入管腔）、纤维肌肉性狭窄（食管中下段，上段轻度扩张）、气管支气管软骨异位（病变在食管下1/3，进食后持续呕吐无间歇期，4~6个月添加辅食时发病，扩张治疗危险需手术）；③短食管（贲门在横膈以上不随体位改变，竖抱可减轻症状，直立行走后自行消失）；④先天性食管闭锁和食管气管瘘（见新生儿疾病章）；⑤喉气管食管裂（20%伴食管气管瘘，分4型，唾液过多、哭声嘶哑、进食呛咳、反复吸入肺炎，需手术修补）；⑥食管裂孔疝（见先天性膈疝节）。' },
  { m: '26A', q: '食管化学性烧伤的病因病理、临床表现、治疗与预后？食管异物的部位、表现与处理？', a: '食管化学性烧伤：幼儿误服强酸强碱。强酸→凝固性坏死（食管鳞状上皮耐酸，酸入胃致胃损伤更重）；强碱→液化性坏死，溶解蛋白质胶原脂肪，渗入深部，以食管损伤为主。临床表现：中重度烧伤可即刻中毒性休克；口唇口腔黏膜溃疡白膜、咽下疼痛困难、流涎呕吐；强碱伤声门气道可呼吸困难；一周创面修复后饮食改善，数周后瘢痕狭窄再现吞咽困难。并发症：早期——中毒性休克、喉水肿、出血、食管穿孔、纵隔炎、胃穿孔腹膜炎；晚期——狭窄（强酸多并胃幽门狭窄，强碱多为食管狭窄）。诊断：建议误服后24h内（最迟48h）胃镜检查评估（48h后穿孔风险显著增加），内镜分级与预后密切相关。治疗：早期立即洗胃（不建议催吐、不用酸碱中和以免二次损伤），蛋清牛奶保护创面；重度烧伤胃造瘘肠内营养，3周后内镜扩张（至少3周后，食管脆弱易穿孔）；抗生素；激素减少瘢痕狭窄尚有争议。预后：严重透壁性烧伤病死率约20%；41%~80%出现食管狭窄需反复扩张；瘢痕狭窄者远期食管腺癌发生率增加1000倍（10~25年后）。\n食管异物：硬币、纽扣、微型电池、别针、骨片、枣核等；70%停留于环咽肌及其下方，15%在食管中1/3，10%达下1/3；表现——哽噎、疼痛、流涎、吞咽困难、呕吐，误吸或压迫气管可咳嗽呼吸困难喘鸣，可并食管炎、食管气管瘘、穿孔、纵隔炎、大出血（伤及主动脉）、电池化学损伤穿孔；确诊后尽快电子胃镜取出，嵌入食管壁或穿出管外者外科手术。' },
  { m: '26A', q: '胃食管反流（GER）与胃食管反流病（GERD）的发病机制、临床表现、诊断与治疗？', a: 'GER指胃内容物反流入食管甚至口咽部，多数为生理性（1岁左右自然缓解）；GERD为病理性，引起食管内外症状和/或并发症、影响生长发育。胃镜下分3类：非糜烂性反流病（NERD）、反流性食管炎（RE）、巴雷特食管（BE，鳞状上皮被化生柱状上皮代替，可致溃疡狭窄腺癌）。\n发病机制：①抗反流屏障功能低下——LES压力降低是主因；频发短暂性LES松弛（TLESR，约90%GER由其引起）；His角变钝（新生儿婴儿）、腹部食管段和膈肌脚抗反流作用减弱、食管裂孔疝；②食管廓清能力降低（蠕动减弱、唾液分泌异常）；③食管黏膜屏障破坏（胃酸胃蛋白酶、胆酸胰酶攻击）；④胃十二指肠功能失常（胃排空延迟、胃扩张，幽门关闭不全致十二指肠胃反流）。\n临床表现：婴儿——溢奶呕吐最突出，生长迟缓、喂养困难、拒食、易激惹、弓背，消化道外症状少（反复咳嗽、喘息、吸入性肺炎、斜颈即Sandifer综合征、ALTEs）；年长儿——反胃反酸、胸痛胃灼热、进食困难、咽下疼痛，重者呕血、慢性失血性贫血；食管外——反流性咳嗽/咽炎/哮喘（明确相关），鼻窦炎、中耳炎（可能相关）；窒息和呼吸暂停是最严重呼吸道并发症（喉痉挛所致，见于小婴儿和早产儿）。\n诊断：24h食管pH监测是金标准（Boix-Ochoa评分>11.99或酸反流指数RI>4%为病理性酸反流），现常联合阻抗监测区分酸/非酸反流；胃镜+活检（食管炎分级：O级NERD、I级点条状糜烂无融合、II级融合<周径2/3、III级全周性糜烂或溃疡），嗜酸细胞性食管炎鉴别（黏膜沟犁样/气管环样改变，嗜酸细胞>15个/高倍视野）；测压和钡餐主要用于评估动力和排除解剖异常，不建议作为诊断依据。\n治疗：①体位——新生儿婴儿左侧卧位（减少TLESR），床头抬高15°~30°（睡眠仍取仰卧位防猝死）；②饮食——稠厚饮食、少量多次、避免过饱和睡前进食、减肥；③药物——抑酸剂首选（PPI降阶方案，奥美拉唑0.5~1.0mg/kg·d早餐前30min顿服，疗程8~12周；H2RA如西咪替丁、雷尼替丁）、促动力剂（多潘立酮0.2~0.3mg/kg次，注意心血管并发症）、黏膜保护剂（硫糖铝等，铝碳酸镁对胆汁反流有效）；④手术——Nissen胃底折叠术，指征：严重食管裂孔疝并食管炎、难治性溃疡/反复出血/穿孔/瘢痕狭窄、严重食管外并发症、疑巴雷特恶变。' },
  { m: '26A', q: '贲门失弛缓症的病因病理、临床表现、诊断与治疗？', a: '原发性食管动力障碍，特征：吞咽时LES松弛障碍+平滑肌段食管缺乏蠕动性收缩→食管功能性梗阻；发病率0.5~1/10万，儿童少见（平均发病8.8岁，5%新生儿期、20%在1岁内）。\n病理生理：神经源性疾病——肌间神经丛（奥尔巴克丛）节后抑制性神经元（氮能神经释放NO）丢失，胆碱能神经相对保留，致LES松弛不全、静息压升高、食管体部失蠕动；可能与感染后自身免疫有关。\n临床表现：①呕吐（婴幼儿，吐未凝固奶，易误诊GERD）；②吞咽困难（儿童最常见最早，时轻时重，重者站立挺胸大量饮水或Valsalva动作助食通过）；③反流和呼吸道症状（70%，误吸致咳嗽声嘶呼吸道感染，小婴儿可窒息）；④胸痛/胃灼热（30%~50%）；⑤体重下降营养不良。\n诊断：食管测压最敏感——食管远端2/3失蠕动（低幅同步收缩波，最突出特点）+吞咽时LES松弛障碍（两项必需），LES基础压升高；X线钡餐——失代偿期食管扩张延长弯曲，下端变细呈"鸟嘴"状（bird-beak），吞咽时不开放，吸入硝酸异戊酯可松弛（与软骨异位鉴别），诊断阳性率约64%；胃镜（<33%可诊断，可见贲门口持续紧闭）；高分辨率测压分3型（末端食管压力正常/升高/伴食管痉挛，II型疗效最好，III型最差）。鉴别：GERD（LES压力正常或降低、松弛无障碍）、弥漫性食管痉挛（高幅非推进性蠕动波）、胡桃夹食管，及继发性贲门失弛缓（GBS、淋巴瘤）。\n治疗：不能根治，旨在改善LES松弛。①药物——钙通道阻滞剂（硝苯地平舌下含服）、长效硝酸盐、β受体激动剂；②肉毒毒素LES注射（初期有效率90%，3%~7%产生抗体抵抗，致纤维化增加手术难度，仅用于不能手术/扩张者）；③内镜下球囊扩张（单次55%~75%，多次达90%，并发穿孔2%~6%，远期复发率高）；④POEM经口内镜下肌切开（成功率90.9%~100%，并发症：气胸/纵隔积气/皮下气肿、隧道黏膜穿孔、胃食管反流，儿童安全性待明确）；⑤手术——Heller贲门肌切开术（有效率80%~90%，近期并发食管穿孔10%~50%，远期胃食管反流和食管狭窄5%），腹腔镜途径为一线首选，常附加Dor胃底折叠。' },
  { m: '26B', q: '小儿厌食症的病因、诊断参考标准与治疗？', a: '厌食症：排除全身性和消化道器质性疾病，较长时间（≥2个月）食欲减退或消失、食量减少（低于所需量的70%）甚至拒食，可致营养不良、贫血、佝偻病、反复呼吸道感染。\n病因：①未及时添加辅食（味觉敏感期4~6个月、食物质地敏感期6~7个月，错过则1岁后拒新口味）；②疾病因素（胃肠炎、消化性溃疡、肝炎结核，发热降低消化吸收功能，寄生虫、便秘）；③药物影响（红霉素等刺激胃黏膜，广谱抗生素致肠道菌群紊乱，过量钙片/维生素A/D）；④微量元素缺乏（锌、B族维生素缺乏影响味觉素合成和味蕾功能）；⑤内分泌（甲减、肾上腺皮质激素不足）；⑥气候（夏季厌食症）；⑦饮食习惯不良（饭前零食、冷饮过多、不定时、蛋白质糖类比例过大）；⑧神经性厌食（精神刺激、错误教育——强迫喂食、过分关注进食）。\n发病机制：下丘脑食欲调节网络（LH、VMH、ARC、PVN）——饱食信号（瘦素、肽YY、CCK、铃蟾素、胰岛素）与饥饿信号（NPY、甘丙肽）紊乱。\n诊断参考：<14岁、病程≥2个月、食量明显减少（<3岁谷类<50g/d，>3岁<75g/d且肉蛋奶极少）、蛋白质热能摄入<标准供给量70%、厌食期身高体重无明显增长。\n治疗：健康教育+饮食指导（定时按顿、饭前不吃零食、变换花样）+捏脊按摩+运动（避免饭前30分钟剧烈运动）+心理指导（不强迫不威胁）+治疗原发病+补锌（葡萄糖酸锌1~1.5mg/kg·d分2次）；药物——助消化剂、多潘立酮（0.3mg/kg次，每日3次，疗程4周）、赛庚啶（0.25mg/kg·d食欲兴奋剂）、抗抑郁药（阿米替林1.5~2.5mg/kg睡前）。' },
  { m: '26B', q: '反刍综合征与呕吐的鉴别要点（类型、时间、性质如何判断病变部位）？', a: '反刍综合征：胃内容物习惯性反流入口腔再咀嚼咽下以达到自我消解；婴儿患病率1.9%，因长期得不到关怀（自我安慰行为），年长儿多由创伤性社会心理事件触发；病理生理——腹肌收缩致胃内压增加+LES开放，胃空肠测压可见腹压波（R波）同步增加，空腹餐后动力正常；诊断须观察（患儿被观察时立即停止），症状≥2个月——婴幼儿标准：腹肌膈肌舌肌反复收缩+胃内容物不费力反流吐出或重嚼咽下+3条以上（3~8个月发病、GERD治疗无效、无痛苦表情、睡眠/交流时不发作）；较大儿童：进食后不久反复反胃重嚼或吐出、睡眠期不发生、反刍前无干呕、排除进食障碍；治疗——情感交流养育方式（婴幼儿）、多学科（儿童心理、胃肠、营养）。\n呕吐：呕吐中枢位于延髓背外侧。四种类型：①溢乳（小婴儿胃水平位、贲门松弛，奶后口角溢少量乳汁，不影响健康）；②普通呕吐（呕吐前恶心，吐一口或连吐几口，见于消化不良、感染）；③反复呕吐（小婴儿多见于GER，学龄儿多见于再发性呕吐）；④喷射性呕吐（无恶心、大量内容物急剧喷出——吞咽空气、胃扭转、幽门梗阻，更多见于颅内压增高）。\n时间判定位：进食15分钟内呕吐→食管病变（贲门痉挛、食管闭锁）；餐后30分钟内→胃及幽门（幽门痉挛/肥厚、食物中毒、胃炎溃疡）；下胃肠道梗阻和肾衰竭→较晚期呕吐。\n性质：贲门以上病变吐未消化奶食；幽门胃部病变吐奶汁食物；下部肠道梗阻后期吐物带粪便；反复剧烈呕吐可带血或咖啡样物。\n并发症：丢水丢电解质→脱水；丢盐酸过多（幽门梗阻）→碱中毒（呼吸浅慢、游离钙减少致手足搐搦惊厥、尿碱性）；丢失肠道碱性液→代谢性酸中毒；饥饿消耗脂肪→酮血症。治疗：病因治疗、改善哺乳方法、多潘立酮（0.3mg/kg次，每日3次，餐前15~30分钟，婴儿慎用）、昂丹司琼（0.15~0.2mg/kg）、氯丙嗪（0.5~1mg/kg）、低渗ORS、短期禁食4~8小时。' },
  { m: '26B', q: '周期性呕吐综合征（CVS）的罗马IV诊断标准、临床表现与治疗？', a: 'CVS：间断发作性顽固呕吐的功能性胃肠病，学龄前和学龄儿童多发（美国患病率0.2%~1.0%），确诊需1.1~3.4年，青春期后多自然停止。常有家族史；诱因——过食、脂肪过多、便秘、上感、饥饿、剧烈活动、疲劳、精神刺激；青春期前女孩常因焦虑或情绪波动发病，可进展为偏头痛，家庭成员偏头痛发病率较高。\n临床表现：反复刻板发作，每日吐数次至数十次，持续数小时到数天，发作间期无症状（数周至数月）；呕吐剧烈不能进食，重者每小时10余次，可带血丝胆汁或大量咖啡样物质；伴腹痛流涎顽固恶心精神萎靡，自主神经症状（少数高血压），神经系统症状（头痛畏光畏高声眩晕）；易致脱水酸中毒酮血症，血氯低、低钾。\n罗马IV诊断标准：①6个月内≥2次剧烈阵发性呕吐，伴或不伴干呕，每次持续数小时至数天；②发作呈模式化特征；③发作相隔数周至数月，间期恢复基础健康水平。须排除胃肠、神经、代谢及尿路异常（血糖尿粪常规、血气、肝肾功能、钡餐、头颅CT/MR），鉴别颅内压增高、苯丙酮尿症/半乳糖血症/尿素循环障碍等代谢病，伴意识障碍者考虑自主神经性癫痫。\n治疗：目标是减少发作频率和缓解严重程度，分发作期与缓解期。发作期——短暂禁食4~8小时、少量多次ORS；纠正酸中毒酮血症低血糖（葡萄糖+碱性液，每次30~50ml/kg，4:3:2液或1:1加碱液，有尿补钾）；止吐——5-HT3受体拮抗剂（昂丹司琼、格雷司琼）静滴+镇静（劳拉西泮），重症肌注氯丙嗪0.5~1mg/kg或异丙嗪0.5~1mg/kg；缓解期预防——赛庚啶0.2~0.25mg/kg·d，不佳者6岁以上加阿米替林1.5~2.5mg/kg（分2~3次），仍不佳用丙戊酸钠5~10mg/kg·d（监测血药浓度）。' },
  { m: '26B', q: '功能性腹痛疾病（FAPD）罗马IV各型（FD、IBS、腹型偏头痛、FAP-NOS）的诊断标准与要点？', a: 'FAPD为与腹痛相关的功能性胃肠病（脑-肠轴功能紊乱、内脏高敏感、生物-社会-心理模式），不符合IBS/FD/腹型偏头痛标准者称非特异性FAP（FAP-NOS）。慢性腹痛报警征象（需进一步检查）：IBD/乳糜泻/消化性溃疡家族史、持续右上或右下腹痛、吞咽困难/疼痛、持续呕吐、消化道出血、夜间腹泻、关节炎、直肠周围疾病、非控制性体重下降、生长迟缓、青春期延迟、不明原因发热。\n①功能性消化不良（FD）：诊断前至少2个月、每月至少4天符合：餐后饱胀、早饱、上腹疼痛或烧灼感（与排便无关）、排除其他疾病。亚型——餐后不适综合征（餐后饱胀或早饱感）、上腹痛综合征（严重上腹疼痛烧灼感、排便排气不缓解、局限于非全腹）。50%FD患儿胃电图异常、47%胃排空延迟。\n②肠易激综合征（IBS）：诊断前至少2个月、每月至少4天腹痛且至少1项——与排便相关、伴排便频率改变、伴大便性状改变；伴便秘者疼痛不随便秘好转而缓解（缓解则为功能性便秘）；分便秘型、腹泻型、混合型、未定型。感染后IBS与黏膜促炎细胞因子增加有关。\n③腹型偏头痛：诊断前6个月内≥2次发作且全部符合：持续≥1小时的突发急性脐周/中线/弥漫性剧烈腹痛（最严重最痛苦）、发作间隔数周至数月、疼痛难以忍受影响正常活动、有特定发病模式和症状、疼痛伴≥2种（厌食恶心呕吐头痛畏光面色苍白）、排除其他疾病。与偏头痛类似触发因素和伴随症状，成年可转偏头痛。\n④FAP-NOS：诊断前至少2个月、每月至少4次腹痛：发作性或持续性腹痛不完全与生理事件相关、不符合IBS/FD/腹型偏头痛标准、排除其他疾病。\n临床评价要点：FAP腹痛多在脐区或腹上区近中线、隐痛钝痛、间歇期饮食玩耍如常、很少夜间痛醒、每次<1小时；与器质性疾病鉴别——FAP病程长、性质隐痛钝痛（器质呈绞痛锐痛刺痛）、部位弥散。经济排除法（血常规、ESR、生化、CRP、大便潜血）后发生器质性疾病概率仅0~4.5%；粪钙卫蛋白作为肠黏膜炎症非侵袭性筛查优于CRP。治疗——解释+认知行为治疗（6~12个月随访很少复发）；FD避免加重食物、PPI抑酸（奥美拉唑4周优于H2RA）、低剂量三环类；IBS益生菌、薄荷油、FODMAP限制饮食；腹型偏头痛苯噻啶预防。' },
  { m: '26C', q: '婴儿肠绞痛（IC）的罗马IV诊断标准、病因与处理？', a: '婴儿肠绞痛：1~4月龄健康婴儿长期哭闹和难以安抚的行为综合征；特征——长时间哭泣、握拳、臀部弯曲，哭闹主要在下午或晚上，6~8周龄达高峰，3~4月龄逐渐消失；20%小婴儿受累，无性别差异。\n病因（均未确切证实）：中枢神经系统问题、肠道神经暂时性功能失调（胃肠激素胃动素/生长素释放肽失衡→肠痉挛）、食物蛋白过敏（约25%中重度患儿可能存在牛奶依赖性肠绞痛；母乳母亲避牛奶蛋白、人工喂养用水解蛋白配方）、产气增加、乳糖不耐受（关系不清）、肠道菌群失调（罗伊氏乳杆菌可能减少发作）、社会心理因素。\n罗马IV临床诊断标准（须全部满足）：①症状起始和终止时婴儿<5月龄；②无明显诱因下长时间反复哭闹、烦躁或易激惹，监护人难以阻止和安抚；③无生长迟缓、发热或疾病的证据。研究标准另需哭闹≥3h/d、≥3d/周。\n鉴别（危险信号）：发热、嗜睡、反复呕吐、腹胀、喂养不良、体重减轻；排除肠梗阻、肠扭转、嵌顿疝、肠套叠、牛奶蛋白过敏、尿路感染、肛裂、神经系统问题、婴儿虐待等。\n治疗：>90%病例治疗目的是帮监护人顺利度过（自限性，4~5月龄完全恢复），而非治愈——安抚父母、减少刺激（包裹、飞机抱、规律摇摆、白噪声）；喂养（母乳最佳，低乳糖配方短期）；不推荐使用药物（益生菌仅罗伊氏乳杆菌有证据；双环胺有嗜睡便秘呼吸抑制不良反应）；预后良好但可能增加日后反复腹痛、过敏性疾病、睡眠障碍风险。' },
  { m: '26C', q: '婴儿排便困难与功能性便秘（FC）如何鉴别？FC的罗马IV标准、报警征象与治疗？', a: '婴儿排便困难：排便费力伴尖叫哭闹、面色红/青紫，持续10~20分钟，排出软便；因腹腔内压升高与盆底肌松弛不协调；罗马IV标准（<9月龄）：①排出软便或未成功排便前紧张哭闹≥10分钟；②无其他健康问题；生后1个月出现，持续3~4周自行缓解，良性自限。治疗——健康教育（婴儿需学习排便用力同时放松盆底）、避免反复开塞露/液状石蜡刺激、不需轻泻剂。\n功能性便秘：占儿童便秘90%以上，儿童便秘最主要原因；分型——慢传输型（STC）、出口梗阻型（OOC）、混合型；高峰年龄2~4岁（排便训练期），未经系统治疗50%延续至成人。病因——遗传（素质性便秘）、饮食（膳食纤维不足、蛋白质多碳水少）、克制排便（排便疼痛→忍便→粪便潴留干结→疼痛恶性循环）、精神因素（20%）、胃肠激素异常、内括约肌增厚（0.5~1.9mm vs 正常0.4~0.9mm）、解剖异常（直肠前突、内套叠、黏膜脱垂）、肠道菌群改变。\n罗马IV标准——≤4岁（≥2条，持续1个月）：每周排便≤2次、大量粪便潴留史、排便疼痛费力史、大块粪便史、直肠内大粪块、排便训练后每周≥1次大便失禁、大块粪便堵塞马桶；>4岁（≥2条，每周≥1次持续1个月）：厕所排便≤2次/周、≥1次/周大便失禁、粪潴留姿势或过度克制排便、排便疼痛困难、直肠大粪块、堵塞马桶；均须排除IBS。\n报警征象（进一步检查）：胎粪排出>48h、甲功异常、生后第1个月即便秘、肛门异位、先巨结肠家族史、无提睾反射、带状粪、下肢肌力肌张力腱反射减弱、无肛裂血便、骶骨窝、生长迟缓、脊柱毛发、胆汁性呕吐、臀裂偏移、严重腹胀、肛门瘢痕。\n治疗原则——解除粪便嵌塞+维持正常排便：①嵌塞解除——开塞露（高渗性，3~6天）、聚乙二醇4000口服（1~1.5g/kg·d，≤6天）；②维持——聚乙二醇（0.2~0.8g/kg·d，可长期，小剂量维持1年，首选）、乳果糖（渗透性）、膳食纤维（年龄+5~10g/d）、足量饮水、排便习惯训练DHP（18个月开始、餐后30~60分钟、每次5~10分钟、Valsalva技巧、双膝高于臀部）、生物反馈（重建盆底肌协调，对OOC型有效）、益生菌；番泻叶等刺激性泻剂长期使用致泻剂结肠应避免。' },
  { m: '26D', q: '腹泻病的诊断标准、病程与病情分类、病因分类及发病机制？', a: '腹泻病：多病原多因素引起的消化道疾病，WHO列为全球控制战略；2017年资料为5岁以下儿童死亡第二大原因（每年约52.5万死亡）；我国儿童第二位常见多发病。两个发病高峰——夏季腹泻（6~8月，病原为致泻性大肠埃希菌与痢疾杆菌）、秋季腹泻（10~12月，轮状病毒）。联合危险因素：①1岁以内婴儿；②照看人卫生差；③饭前不用肥皂洗手；④既往经常患腹泻；⑤饮用水不洁；⑥禽畜放养。\n诊断标准：必备条件——大便性状改变（稀便、水样便、黏液便或脓血便）；辅助条件——次数比平时增多（每日≥3次）；只要性质异常每日1次也算，性质正常每日3次以上也不算。\n病程分类：急性<2周；迁延性2周~2个月；慢性>2个月。病情分类：轻型（无脱水无中毒症状）；中型（轻至中度脱水或轻度中毒症状）；重型（重度脱水或明显中毒症状——烦躁萎靡嗜睡、面色苍白、体温不升、白细胞明显增高）。\n病因分类：感染性（霍乱、痢疾、其他感染性腹泻）和非感染性（食饵性/饮食性、症状性、过敏性、炎症性肠病、免疫异常相关肠病、结构异常、肿瘤内分泌性、基因代谢性）。\n发病机制：①细菌毒素作用（ETEC、霍乱弧菌分泌肠毒素→前列腺素→腺苷环化酶→cAMP↑→肠黏膜分泌亢进→水稀便）；②病原菌直接侵袭（痢疾杆菌、EIEC、沙门菌→黏膜炎症充血水肿溃疡→黏液脓血便）；③渗透性腹泻（双糖酶缺乏、高渗药——硫酸镁、乳果糖、甘露醇）；④病毒作用（轮状病毒侵犯小肠上皮细胞微绒毛→双糖酶缺乏→渗透性腹泻+毒素→cAMP↑）。\n微生态：健康儿童粪便需氧菌:厌氧菌≈1:1000，腹泻患儿≈1:1——厌氧菌（双歧杆菌、拟杆菌、真杆菌）减少约1000倍，微生态失衡促进腹泻，是微生态制剂的理论依据。\n病原谱：2014-2015年全国监测病毒感染>90%（轮状病毒为主，其次诺如病毒）；农村病原依次——致泻性大肠埃希菌、轮状病毒、志贺菌、空肠弯曲菌；北京——轮状病毒、致泻性大肠埃希菌、志贺菌、沙门菌。耐药：四环素71.1%~83.6%、磺胺54.4%~74.8%、氨苄西林49.1%~97.1%耐药；喹诺酮类耐药率低（儿童可用，注意适应证疗程）。' },
  { m: '26D', q: '致泻性大肠埃希菌五型肠炎及沙门菌、空肠弯曲菌、耶尔森菌、亲水气单胞菌肠炎的临床特点？', a: '致泻性大肠埃希菌五大类：\n①ETEC（产毒素型）：婴幼儿腹泻主要病原之一，流行于夏季；肠毒素（ST耐热型、LT不耐热型）→分泌性水稀便；发热呕吐频繁水样便，多伴脱水酸中毒；占2岁以下婴儿腹泻20%~28%，仅次于轮状病毒。\n②EPEC（致病性）：50-60年代我国主要流行病原（O111:B4占82.1%）；散发时检出意义不大（健康对照亦5.6%），流行时大量检出且血清型集中方有病原学意义；3岁以下婴幼儿夏季多发，水稀便为主，传染性强可暴发，病死率高。\n③EIEC（侵袭性）：不产生肠毒素但侵袭肠黏膜→小肠结肠炎脓血便，临床表现类似细菌性痢疾；豚鼠眼结膜试验（Sereny试验）阳性鉴定；平时检出率低（0.3%）。\n④EAEC（黏附性）：引起迁延性腹泻；三型——局部黏附型LA（刷状缘消失、基底变平）、弥散黏附型DA、自动聚集黏附型AA（肠壁聚集成团链，对迁延性腹泻重要致病作用）；迁延性腹泻患儿分离率26%（印度）。\n⑤EHEC（出血性）：O157:H7为主（还有O26:H11、O111），1982年美国汉堡包食物中毒事件明确；血性腹泻三大特征——特发性痉挛性腹痛、血性粪便（血水便或脓血便）、低热或不发热；严重并发症——溶血尿毒综合征（HUS）、血栓性血小板减少性紫癜。\n沙门菌感染：急性起病发热腹痛腹泻里急后重黏液脓血便，重者类似中毒型痢疾（呼吸/循环衰竭）；鼠伤寒沙门菌和婴儿沙门菌最常见，多侵犯1岁以内久病体弱婴儿，病情重合并症多病死率高，常院内严重交叉感染。\n空肠弯曲菌肠炎：占腹泻病原5%~14%（上海4.43%），人兽共患病原；发热腹痛腹泻，初期水稀便继转痢疾样黏液脓血便；夏秋季高峰，5岁以下农村多见；自限性多数一周内恢复；感染后可致吉兰-巴雷综合征（GBS）。\n耶尔森小肠结肠炎：人畜共患（猫狗猪）；约2/3以急性胃肠炎/小肠结肠炎为主，1/3以败血症为主（伴肝脓肿），可合并关节炎和结节性红斑。\n亲水气单胞菌胃肠炎：水生动物携带，进食污染鱼类等感染；急性胃肠炎型（多数2~5天自愈）、败血症型、创口感染型。' },
  { m: '26D', q: '抗生素相关性肠炎（艰难梭菌、金葡菌、铜绿假单胞菌）、真菌性肠炎和隐孢子虫肠炎的特点？', a: '抗生素相关肠炎（滥用抗生素→菌群紊乱→条件致病菌）：\n①艰难梭菌肠炎（CDAD/假膜性肠炎）：常于应用抗生素4~10天内或停药后数天至1个月起病（也可用药1~2天后）；相关抗生素——克林霉素、广谱青霉素、头孢菌素、莫西沙星；主要引起小肠及结肠黏膜急性坏死性炎症覆假膜；起病急骤，高热中毒症状重（嗜睡萎靡谵妄），腹泻黄稀水样便或水样黏液便、可伪膜脱落，少数血便，痉挛性腹痛可有反跳痛（需与急腹症鉴别）；重者并发脱水、急性肾衰竭、休克、DIC；确诊——粪便厌氧菌培养分离难辨梭状芽孢杆菌+产毒菌株+A毒素B毒素检测。\n②金黄色葡萄球菌肠炎：两型——食物中毒型（呕吐最突出、腹泻相对少、发热<38℃）；抗生素相关型（病情重，全身中毒症状明显发热可达40℃以上、热程5天左右，腹泻为主呕吐较轻，黄绿色糊状或暗绿色水样便似"海水样便"，可合并败血症）；初诊依据粪便涂片见大量革兰阳性球菌，确诊粪便及血培养。\n③铜绿假单胞菌肠炎：滥用抗生素诱发或体弱小婴儿散发/婴儿室暴发；开始水样便后转黏液脓血便，每日可达20次以上，感染中毒症状明显多伴脱水酸中毒，重者休克。\n真菌性肠炎：病程迁延+滥用抗生素史，常伴鹅口疮，肛门周围黄白色伪膜，伪膜及粪便涂片见真菌菌丝确诊；稀便带泡沫、次数不太多但迁延不愈。\n隐孢子虫肠炎：寄生小肠黏膜破坏微绒毛→吸收障碍+双糖酶缺乏→渗透性腹泻；婴幼儿多见，温暖潮湿夏秋季高发，农村>城市，畜牧地区多；免疫正常者多为无症状或急性水样泻（自限性数天~2个月），免疫低下者（婴幼儿、营养不良）病程可达数月至慢性反复；迁延慢性者粪便黏液稀便，伴腹痛腹胀恶心呕吐低热；诊断——粪便呕吐物痰中找到隐孢子虫卵囊。' },
  { m: '26D', q: '病毒性肠炎（轮状病毒、诺如病毒、腺病毒、星状病毒、冠状病毒）的临床特点？', a: '轮状病毒肠炎（RV）：6个月~2岁发病率最高且最严重（6个月以下有母体被动免疫，2岁以上多有抗体）；秋冬季（10~12月）高发；潜伏期24~72h，自然病程3~7天（平均4天，个别延至2周以上）；先呕吐1~2天（首日多见）后水样腹泻，每日数次至数十次，粪便淡绿/黄绿色稀薄水样、偶有黏液、无脓血、镜检无白细胞（部分隐血阳性）；近半数初期伴2~3天低热，40%伴咳嗽等呼吸道症状；可侵犯多脏器（呼吸道、CNS、肝肾心脏），50%~60%患儿血清心肌酶增高，可并发暴发性心肌炎猝死（精神面色差、心律不齐、心音低钝者查心电图心肌酶）；中国儿童急性胃肠炎住院者RV所致>45%居首位。\n诺如病毒（杯状病毒科，诺如+札如）：仅次于RV的急性非细菌性胃肠炎病原，RV疫苗应用后跃居病毒性肠炎首位；粪-口传播，污染食物和水致暴发；腹泻症状较RV轻但呕吐相似，自然病程2h~数天（平均12~72h）。\n腺病毒肠炎：肠道腺病毒40、41、42型（与呼吸道3、7、11型不同）；无明显季节性；腹泻呕吐发热，部分腹痛呼吸道症状，潜伏期约1周（3~10天），病程1周（5~9天）左右，免疫缺陷者慢性。\n星状病毒肠炎：症状较轻，自限性。\n冠状病毒肠炎：3岁前儿童，腹泻94%、呕吐63%、发热51%，病程平均3~5天。趋势：经济发展后细菌性腹泻减少、病毒性相对升高，控制病毒性腹泻主要靠疫苗（轮状病毒疫苗安全性好免疫效果好）。' },
  { m: '26D', q: '急性腹泻病的治疗方案（液体疗法三方案、补锌、饮食、合理用药）？', a: '治疗原则（1992中国腹泻病方案）：继续饮食、预防脱水、纠正脱水、合理用药。旧法（禁食、过多静脉输液、滥用抗生素）已废弃。\n脱水评估：轻度（一般状况好、眼窝正常、有泪、口渴正常、皮肤弹性回缩快）——无脱水征；中度（烦躁易激惹、眼窝下陷、泪少、口渴、回缩<2秒）——"有些脱水"，丢失水分占体重3%~10%；重度（嗜睡昏迷、眼窝明显下陷、无泪、只能少量饮水、回缩>2秒）——丢失水分>体重10%。\n方案一（无脱水，家庭治疗）：腹泻一开始就给更多液体——①米汤加盐溶液（米汤500ml+食盐1.75g，1/3张，防高钠血症；预防脱水40ml/kg，治疗轻中度脱水60~80ml/kg于4~6小时分次服完）；②标准ORS（2/3张，每腹泻一次给50~100ml，注意另补白开水防高钠血症）；③2002年WHO推荐低渗RO-ORS（1/2张：NaCl2.6g+枸橼酸钠2.9g+KCl1.5g+无水葡萄糖13.5g加水1000ml；可减少大便量缩短病程防高钠血症）。ORS原理：1%~2.5%葡萄糖促进肠内水和钠最大限度吸收（提高25倍），葡萄糖>3%反致渗透性腹泻。不禁食继续喂养。\n方案二（有些脱水，约占90%）：RO-ORS纠正，最初4小时用量=体重(kg)×(50~75ml)，4小时后重新评估，纠正后转方案一。\n方案三（重度脱水，约占10%）：静脉输液尽快纠正低血容量，累积损失按100ml/kg——第一阶段20ml/kg等张液（2:1液或0.9%NaCl）1小时（休克可重复1~2次），第二阶段80ml/kg 2/3张或1/2张液（4:3:2液/1:1加碱液/2:3:1液），1岁以内6小时、1岁以上5小时；补钾每日200~300mg/kg（需有尿后静脉给钾，切忌过快）；补钙（维D缺乏者输液同时给口服钙，手足搐搦立即10%葡萄糖酸钙10ml稀释慢静注）；营养不良婴儿液量减10ml/kg；无条件静输可鼻饲管点滴RO-ORS 20ml/(kg·h)×6小时。\n补锌（2002年WHO推荐，急慢性均补）：<6个月葡萄糖酸锌每日10mg，>6个月每日20mg，连服10~14日——缩短病程、减轻严重程度、增强免疫、防复发、改善食欲促生长。\n饮食：继续平时习惯饮食，有食欲即鼓励进食（禁食有害）；母乳继续；人工喂养儿6个月以下奶加等量米汤/水稀释渐增至正常，6个月以上稠粥面条加熟植物油蔬菜肉末；要素饮食；少数严重者静脉营养（脂肪乳2~3g/kg·d、氨基酸2~2.5g/kg·d、葡萄糖12~15g/kg·d）。\n药物：益生菌（病毒性和抗生素相关性腹泻显著有效）；肠黏膜保护剂（蒙脱石粉，吸附病原体毒素）；抗感染——急性水样便多为病毒或产毒素细菌感染，一般不用抗生素（WHO：90%腹泻不需抗生素）；疑似霍乱用多西环素（2.2~4.4mg/kg，8岁以下禁用）；侵袭性细菌感染选当地有效抗菌药，48~72h无效考虑耐药换药——细菌性痢疾（磷霉素、利福昔明、环丙沙星、小檗碱、复方新诺明；头孢克肟3~6mg/kg·d；欧美推荐阿奇霉素5天一线）、致泻性大肠埃希菌（ETEC不用抗生素；磷霉素或三代头孢）、鼠伤寒沙门菌（环丙沙星，重症三代头孢）、弯曲菌（阿奇霉素/红霉素/环丙沙星）、耶氏菌（磺胺/庆大/诺氟沙星）、艰难梭菌（立即停抗生素+甲硝唑25~40mg/kg·d分4次或万古霉素20~40mg/kg·d分3次）、真菌（停抗生素+制霉菌素5万~10万U/kg·d分3次）、阿米巴/贾第虫（甲硝唑）、隐孢子虫（大蒜素）。喹诺酮类儿科应用安全（剂量不宜大疗程不宜长，用前与家长说明）。\n观察：治疗3天内症状不见好转或出现腹泻次数量增加、频繁呕吐、明显口渴、不能正常饮食、发热、大便带血应就诊。' },
  { m: '26D', q: '迁延性与慢性腹泻的发病机制与治疗？肠吸收不良综合征（糖、脂肪、蛋白质）的要点？', a: '迁延性腹泻病程2周~2个月，慢性>2个月（分持续型和复发型）。发展中国家5岁以下腹泻死亡一半死于迁延慢性腹泻及其合并症；迁延慢性腹泻约占儿童腹泻19%，难治性约1%；多发生于营养不良患儿，互为因果恶性循环。婴儿难治性腹泻诊断依据：6个月内发病多见、病程>2周、先前有急性肠炎、多数无特异病原（少数因滥用抗生素继发条件致病菌/真菌/隐孢子虫）、合并营养不良生长障碍、一般治疗无效、预后差病死率高。\n发病机制：①宿主因素——年龄（迁延<1岁，难治3~6个月）、营养不良、免疫功能差（粪便sIgA低、CD4降低CD8增高CD4/CD8降低）；②肠道微生物——弧菌和病毒不引起迁延腹泻；分离率较高的重要病原：EAEC、EPEC、隐孢子虫；我国迁延腹泻病原分离率低，主要是肠道消化功能未恢复，未获病原前不要盲目用抗生素；③肠黏膜继续损害——绒毛萎缩、上皮损害（双糖吸收障碍尤其乳糖、蛋白过敏触发免疫）；细菌过度繁殖分解胆酸→脂肪泻，二羟胆酸和羟脂肪酸入结肠→分泌亢进腹泻；④黏膜修复迟缓——蛋白质-能量营养不良延缓修复。\n治疗：①液体疗法防脱水纠正紊乱；②营养治疗是关键——继续饮食（禁食有害）：母乳继续，人工喂养儿稀释奶由少渐增/酸奶/奶-谷类混合物每天6次，要素饮食，严重者静脉营养；③药物——抗菌药仅用于分离出特异病原者并按药敏；补充锌、铁、维生素A/B/C、叶酸促黏膜修复；微生态疗法恢复菌群平衡；④非感染性腹泻对因（食饵性调整饮食、糖源性去乳糖饮食+乳糖酶、过敏性去除过敏原、症状性治疗原发病）。\n肠吸收不良综合征：小肠消化和/或吸收功能障碍致一种或多种营养成分不能被转运，最常见症状大量腹泻、体重减轻、腹痛。\n糖吸收不良：原发性（先天性乳糖酶缺乏、蔗糖-异麦芽糖酶缺乏、葡萄糖-半乳糖吸收不良——Na+载体先天缺乏、发育性和迟发性乳糖酶缺乏）为常隐遗传，小肠黏膜活检组织学正常而双糖酶活性降低；继发性（急性肠炎、慢性腹泻、营养不良、免疫缺陷、乳糜泻、小肠术后）——乳糖酶在绒毛顶端最易受累且恢复最慢，急性肠炎60%~70%乳糖酶缺乏但多随康复恢复，不需常规去乳糖饮食；临床——糖原性腹泻：水样便含泡沫酸臭味，酸性便致臀红，禁食或去除不耐受糖后迅速改善（特点）；筛选——粪便pH<5.5、粪便还原糖≥0.5g/dl（新生儿>0.75）；呼气氢试验（口服糖1g/kg后呼气氢较基值增高20×10⁴ppm为阳性，抗生素可假阴性）；小肠黏膜活检双糖酶测定是金标准；D-木糖试验反映空肠黏膜面积和通透性（小肠病变时减少，胰腺功能不全时正常）。治疗——去除不耐受糖：先天性乳糖酶缺乏终身禁食乳糖，葡萄糖-半乳糖吸收不良给无糖奶粉+果糖，继发性暂时低乳糖/去乳糖饮食。\n脂肪吸收不良（脂肪泻）：粪便色淡臭味重灰白色含脂肪漂浮水面；见于梗阻性/反流性黄疸（胆汁缺乏不能乳化）、肠道感染、克罗恩病、溃疡性结肠炎、乳糜泻、肠瘘、肠淋巴管扩张症、慢性胰腺炎、囊性纤维化、Shwachman-Diamond综合征；诊断——粪便苏丹III染色（中性脂肪朱红油滴）、猩红染色（1/4以上染红为重度脂肪泻）、碘油耐量试验（第4管1:8显蓝为正常）、血清胡萝卜素（正常4~15μg/L，脂肪泻降至1~2）、粪脂定量（吸收系数=（摄入-排出）/摄入×100%，1岁以上正常≥95%）、¹³C-混合链甘油三酯呼气试验（评估胰脂肪酶活性，敏感性89%特异性81%）、粪便弹性蛋白酶-1（<200mg/g诊断胰腺外分泌功能不全，<100mg/g重度）；治疗——高热量高蛋白低脂肪饮食、补充脂溶性维生素A/D/K、病因治疗（胰酶片、中链甘油三酯——不需胆盐直接吸收、乳糜泻终身禁麦类、淋巴管扩张症禁长链脂肪酸、SIBO用抗生素）。\n蛋白质吸收不良：单独罕见，常伴脂肪吸收不良；肠黏膜渗出丢失（牛奶/豆蛋白不耐受、乳糜泻、贾第虫、IBD、肠淋巴管扩张）→粪便α1抗胰蛋白酶测定证实，粪臭皮蛋气味、低蛋白血症水肿腹水而尿蛋白阴性。' },
  { m: '26E', q: '小儿胃的解剖生理特点及先天性肥厚性幽门狭窄（CHPS）的诊断与治疗？', a: '解剖生理：婴幼儿胃大多呈水平位，位置高于成人1~2椎体，3岁后接近成人；胃容量——出生时7ml、4天40~50ml、10天80ml、1岁末250~300ml、3岁400~600ml；胃酸分泌新生儿少，生后24小时显著增加、10天达高峰后下降（泌酸通过质子泵，抑制质子泵是减少胃酸最有效措施）；胃壁四层结构中胃底腺含壁细胞（泌盐酸，峡部和颈部）、主细胞（胃蛋白酶原，底部）、G细胞（胃泌素，幽门腺1/3处）。\nCHPS：新生儿幽门环形肌肥厚致幽门梗阻；国外2~5/1000新生儿，国内0.3%~1%，男:女=4~5:1，50%~60%第1胎；病因——幽门肌间神经丛异常（神经节细胞减少/退变→括约肌长期痉挛→肌肥厚）、多基因遗传（同胞3%~6%、同卵双生22%）、NOS及Cajal间充质细胞异常分布。\n病理：幽门全层肌肉肥厚以环形肌为著（肌层厚达0.4~0.6cm），肥厚部突然终止于十二指肠起端呈纺锤状肿物（长2~3cm、直径1.5~2cm）。\n临床表现：生后2~3周（吃奶排便正常后）出现进行性喷射性呕吐，每次吃奶后10~30分钟发生，吐奶汁/奶凝块不含胆汁、有酸味（部分咖啡色——GER继发食管炎或胃黏膜损伤出血）；食欲亢进有饥饿感、吃奶迅速有力；脱水营养不良呈老人貌；低氯低钾性碱中毒（呼吸浅慢、喉痉挛抽搐，严重脱水者反而无明显碱中毒），2%~3%出现黄疸（未结合胆红素升高，解除梗阻后迅速消退）；体征——上腹饱满、胃型及从左向右推进的蠕动波（90%）、右上腹肋缘下橄榄样光滑硬如软骨可移动肿物（70%，呕吐后更易触及）。\n诊断：典型病史+胃蠕动波+腹部肿物；X线——幽门管细长狭窄"线样征"、环行肌压迫胃窦"肩征"、十二指肠球蘑菇状"蕈征"、"鸟嘴征"、"双轨征"；超声——幽门肌长径≥16mm、厚度≥4mm、直径≥15mm（确诊率81%~93%）；内镜确诊率97%。\n鉴别：幽门痉挛（生后几天即吐，间歇性非喷射性，无肿物，解痉剂有效）、胃扭转（钡餐双泡征、体位治疗）、贲门松弛和食管裂孔疝（与体位有关）、幽门前瓣膜（症状相似但肌层不厚）、十二指肠梗阻（双泡征，吐胆汁）、喂养不当。\n治疗：幽门环肌切开术（Ramstedt术，腹腔镜最常用）；术前纠正水电解质紊乱贫血；内科治疗仅用于诊断未明/暂不能手术（阿托品1:1000喂奶前口服、稠厚乳液、纠低氯低钾碱中毒不用碱性液、十二指肠管营养）。预后良好（病死率欧美0.12%~0.5%，国内0.5%~1%）。' },
  { m: '26E', q: '胃其他先天性疾病（胃壁肌层缺损、双胃、先天性小胃、胃出口梗阻）与胃扭转、胃结块症的要点？', a: '先天性胃壁肌层缺损：胚胎发育障碍，缺损最常见于胃大弯；缺损处仅黏膜、黏膜下层及浆膜；任何使胃内压增加的因素（吞咽空气、哭闹、洗胃、面罩加压给氧）可诱发穿孔；生后3~5天（早产儿）突然急腹症——拒奶、吐黄绿/咖啡色物、进行性腹胀、呼吸困难青紫、肝浊音界消失、肠鸣音消失；X线立位膈下游离气体、胃泡影消失、横贯全腹液平；治疗——禁食胃肠减压、抗感染、勿用正压给氧、手术修补；病死率25%~33%，6小时内诊治可存活，>12小时存活率仅25%。\n双胃（胃重复畸形）：占消化道重复畸形4%，女孩多见，50%伴其他畸形；囊状型82%（胸腔左后纵隔胃源性囊肿）、管状型18%；组织学四大特点——消化道内膜、外被肌层、胃血管供血、可与胃共壁；生后1年出现症状（呕吐1/3、上腹痛、血便便秘、上腹囊性肿物）；治疗手术切除。\n先天性小胃：罕见，胃小管状伴巨食管和不完全胃扭转，多合并其他器官畸形；胃容量少致呕吐生长差、误吸；钡餐及胃镜确诊（胃管型、食管扩张、GER）；治疗——少量多餐、抑酸促动力、营养支持，反流重者空肠造瘘或Hill/Thal抗反流术。\n先天性胃出口梗阻：占先天性胃肠道闭锁1%；四型——幽门窦部断裂闭锁1%、幽门断裂闭锁27%、幽门膜式闭锁或狭窄67%、幽门窦部膜式闭锁或狭窄5%；胃内隔膜（幽门前1.5~3cm，厚2~3mm）可有孔或无孔；早产儿多见、多有羊水过多史；生后不久吃奶后即喷射性呕吐含乳凝块无胆汁，间歇性；X线胃大小正常、幽门前1~2cm狭窄、钡剂通过隔膜孔显示正常幽门和十二指肠球部；治疗手术切除隔膜（水肿梗阻者胃肠吻合）。\n胃扭转：大、小弯位置变化，年龄越小发病率越高，男多于女；病因——韧带过长松弛缺如、食管裂孔疝/膈疝/膈膨升；三型——器官轴型（大弯沿纵轴向上旋转180°常见）、系膜轴型（横轴90°）、混合型；扭转<180°可自行复位，>180°可胃壁缺血坏死穿孔；表现类似高位肠梗阻（生后不久吐奶不含胆汁，大儿童突发上腹剧痛向背肩部放射）；钡餐——器官轴型：食管胃黏膜交叉、胃大弯位于小弯之上、幽门窦高于十二指肠球、双胃泡双液面；系膜轴型：胃黏膜十字交叉、幽门提高接近贲门平面；慢性扭转年长儿呕吐改变体位可缓解（右前倾位减轻）；治疗——新生儿慢性不完全性胃扭转体位疗法（右前倾位），扭转度大者手术复位固定。\n胃结块症（胃石）：空腹吞食大量黑枣、山楂、柿子（未成熟柿子酸及树胶果胶含量可达25%，胃酸作用下凝固沉淀），吞咽毛发等；进食后几小时上腹不适疼痛、恶心呕吐（可咖啡样物——柿石刺激致胃炎胃溃疡）、1/3上腹肿块；X线密度增高影钡餐充盈缺损可移动、B超弧形光带、胃镜暗褐色可移动胃石（活检钳取出可确诊）；治疗——2%~5%碳酸氢钠洗胃/口服、胃镜碎石取石、激光碎石；大胃石/幽门梗阻/穿孔手术。' },
  { m: '26E', q: '急性胃炎的病因、临床表现与治疗？胃憩室与胃息肉的要点？', a: '急性胃炎：不同病因引起的胃黏膜急性炎症，多为继发性。病因与机制：①药物性——NSAIDs（阿司匹林、吲哚美辛）最常见（抑制前列腺素影响黏膜修复）、肾上腺皮质激素、某些抗生素、抗肿瘤药、氯化钾、铁剂、乙醇（破坏黏膜屏障、H⁺逆扩散增加）；②应激性——严重感染、中毒、创伤、窒息、休克、颅压增高（自主神经兴奋→黏膜血管痉挛缺血+H⁺逆扩散；休克或中枢神经创伤时组胺释放→胃酸胃蛋白酶分泌增加）；③腐蚀性——强酸凝固坏死、强碱液化坏死（口腔食管灼伤比胃更严重）；④感染性——沙门菌、嗜盐菌、金葡菌、肉毒杆菌毒素（食物中毒，进食后数小时发病呕吐腹痛）；⑤食物过敏。\n临床表现：发病急骤，轻者食欲缺乏、嗳气、上腹饱胀腹痛恶心呕吐；重者呕血黑便、脱水电解质酸碱紊乱；应激性和药物性损伤呕血黑便可为首发表现；失血多可休克。\n治疗：积极治疗原发病（停药、抗感染）；卧床休息、停刺激性食物、清淡流质半流质、必要时禁食；纠正脱水电解质；严重出血按上消化道出血处理（补充血容量、H2RA西咪替丁/雷尼替丁/法莫替丁或PPI奥美拉唑静滴、输血、内镜下止血）；危重患儿可用H2RA或PPI预防应激性胃炎。\n胃憩室：少见，分先天性/继发性、内压性/牵引性、真性（各层）/假性（无肌层）；多无症状，钡餐囊状突出胃外窄颈相连（胃底胃窦多）、胃排空时仍有钡剂停留；憩室炎可有进食后加剧腹痛呕吐；无症状不处理，症状重/憩室内溃疡/疑恶变手术。\n胃息肉：胃黏膜上皮或间质成分增生；检出率1.2%~5.0%；分型——炎性、炎性纤维素性、增生性、错构瘤性、胃底腺性（非肿瘤性）和腺瘤性（恶变率高）；胃底腺息肉增多可能与大量应用PPI有关；多无症状偶发现，有蒂/亚蒂型（山田I、II型）占绝大多数；治疗——无症状观察，有症状内镜下切除；症状重、合并溃疡或疑恶变外科治疗。' },
  { m: '26F', q: '慢性胃炎的常见病因、胃镜下表现及2002年广州诊断标准要点？', a: '病因：HP感染最常见；胃窦炎（B型）多由HP、胆汁反流引起，胃体炎（A型）与自身免疫有关。\n胃镜表现：黏液斑、充血、水肿、微小结节形成、糜烂、花斑、出血斑点。\n广州诊断标准（2002）满足以下条件之一即可诊断：①胃镜和病理检查均证实为慢性胃炎；②胃镜诊断成立而病理检查不符合，可随访复查；③有HP感染证据且胃镜未证实，但病理证实为慢性胃炎。' },
  { m: '26F', q: '消化性溃疡的"天平学说"、临床表现、并发症及儿童治疗原则？', a: '天平学说：攻击因子（胃酸/胃蛋白酶、HP、NSAIDs、胆汁反流）与防御因子（黏液-碳酸氢盐屏障、黏膜血流、前列腺素）失衡致病。\n临床：婴幼儿以呕吐、食欲差、生长落后为主；学龄儿可上腹痛，十二指肠溃疡多于胃溃疡。\n并发症：出血、穿孔、幽门梗阻。\n治疗：抑酸（PPI/ H2受体拮抗剂）4~6周；HP阳性者根除；黏膜保护剂（硫糖铝、铋剂）；避免NSAIDs。' },
  { m: '26F', q: '儿童HP感染检测方法与根除方案，及复旦儿科医院各方案根除率？', a: '检测：13C尿素呼气试验、快速尿素酶试验、粪便HP抗原、血清抗体、胃黏膜病理切片、细菌培养。\n根除方案及根除率（复旦儿科医院）：①标准三联（PPI+克拉霉素+阿莫西林）74.1%；②含铋四联（三联+铋剂）69.5%；③序贯疗法（前5天PPI+阿莫西林，后5天PPI+克拉霉素+甲硝唑）89.8%；④伴同疗法（PPI+阿莫西林+克拉霉素+甲硝唑同服10天）84.6%。' },
  { m: '26G', q: '先天性肠闭锁的病理类型、临床表现及先天性肠旋转不良的病理与Ladd手术？', a: '肠闭锁：发病率约1/5000，最常见于空肠下段及回肠；两型病理——膜式闭锁（多见于十二指肠及空肠）和盲端型（肠系膜V形缺损，苹果皮样闭锁位于空肠近端，易继发肠扭转）。临床：生后喂奶即呕吐（部位愈高呕吐愈早，可含胆汁）、无正常胎粪（排灰白或青灰黏液便）、进行性腹胀；钡灌肠见胎儿型结肠。小肠长度仅100~150cm（正常250~300cm）。\n肠旋转不良：中肠以肠系膜上动脉为轴逆时针旋转270°障碍，致Ladd索带压迫十二指肠、中肠扭转、游动盲肠；呕吐含胆汁者>80%。腹平片双泡征；钡灌肠示盲肠位置异常；B超见肠系膜上静脉位于腹主动脉前方。治疗：Ladd手术（复位扭转、松解Ladd索条、游离拉直十二指肠）。' },
  { m: '26G', q: '小儿肠梗阻的分类、三大症状、机械性与动力性鉴别及粘连性肠梗阻的治疗原则？', a: '分类：机械性（器质性，如肠闭锁、肠套叠、蛔虫团、粘连、疝）与动力性（功能性/麻痹性/假性肠梗阻，继发于败血症、肺炎、腹膜炎等，交感神经过度兴奋致肠蠕动消失）。\n三大症状：阵发性腹部绞痛、呕吐（可含胆汁或粪便）、肛门不排气不排便；听诊机械性肠鸣音亢进、动力性减弱或消失。\n绞窄性：6~8小时多已肠坏死，出现中毒症状、腹膜炎体征，腹腔穿刺血性腹水。\n粘连性肠梗阻治疗：先行非手术疗法（禁食、胃肠减压、输液纠正脱水酸中毒、抗生素、中药大承气汤、灌肠），密切观察，出现中毒症状加重、腹膜刺激征或血性腹水即中转手术。' },
  { m: '26H', q: '急性肠套叠的好发年龄、四大临床表现、分型及灌肠复位与手术指征？', a: '好发于肥胖健壮2岁以内婴幼儿，6~12个月最多见，男:女2~3:1。\n四大表现：①阵发性腹痛（突发哭闹、屈腿、面色苍白，规律性发作）；②呕吐；③血便（8~12小时后暗红色果酱样便，直肠指检带血者占60%）；④腹部腊肠样肿物（右上腹或脐上，右下腹空虚感）。\n分型：回结型85%、回回结型10%~15%、小肠型6%~10%、结肠型2%~5%。病理为鞘部+套入部三层肠壁，颈部最早血运障碍。\n气灌肠复位：诊断性压力<8.0kPa（60mmHg），复位治疗12~13.3kPa（90~100mmHg），不超过14kPa（105mmHg）。\n手术指征：发病>48小时、血便>24小时或中毒休克；腹胀明显疑肠坏死；复发3次以上或疑器质性病变；疑小肠套叠或灌肠未复位有复套。' },
  { m: '26H', q: '梅克尔憩室的解剖特点、常见并发症及急性阑尾炎的病理分型与诊断要点？', a: '梅克尔憩室：距回盲瓣20~100cm回肠系膜对侧缘，长2~5cm；约50%含异位胃黏膜或胰腺组织。并发症发生率——消化道出血40%、小肠梗阻30%、急性憩室炎20%。99mTc扫描（对胃黏膜亲和力，准确率>90%）及B超（符合率>80%）助诊。\n急性阑尾炎：小儿最常见急腹症，6~12岁多见，年龄越小越不典型，婴幼儿误诊率35%~50%（新生儿>90%）。\n病理三型：卡他性（仅黏膜）、化脓性（蜂窝织炎性，侵犯全层，早期腹膜感染）、坏疽性（血管栓塞广泛坏死，易穿孔）。\n诊断：转移性右下腹痛+右下腹固定压痛（最可靠体征）+白细胞（15~20)×10⁹/L；B超单纯性呈两条平行线，化脓性呈C/V字形。并发症：残余脓肿、粘连性肠梗阻、粪瘘。' },
  { m: '26I', q: '溃疡性结肠炎（UC）的诊断要点、PUCAI分级及活动期阶梯治疗？', a: '病变特点：累及结肠黏膜层及黏膜下层，从远端结肠开始逆行连续性发展，可累及全结肠甚至末端回肠；临床腹泻、黏液血便、腹痛。\n诊断：排除感染性/其他非感染性结肠炎；结肠镜+活检为主要依据（血管网纹消失、接触性出血、颗粒状外观、铅管状改变、假息肉）；确诊需临床+内镜+病理。上海地区儿童发病率2001年0.5/100万升至2010年6.0/100万。\nPUCAI分级：<10缓解，10~34轻度，35~64中度，≥65重度。\n治疗：轻度——5-ASA（SASP 50~75mg/kg/d，美沙拉秦30~50mg/kg/d）；中度——足量5-ASA 2~4周无效加激素（泼尼松0.75~1mg/kg/d），激素依赖加硫唑嘌呤（亚裔低剂量1.23±0.34mg/kg/d）；重度——静脉激素（甲泼尼龙1~2mg/kg/d），约3天无效转换治疗（环孢素/IFX拯救或手术）；手术绝对指征：大出血、穿孔、癌变。' },
  { m: '26I', q: '克罗恩病（CD）的病理特征、与UC的鉴别及儿童一线诱导治疗方案？', a: '病理：慢性肉芽肿炎症，透壁性、节段性非对称分布（跳跃性），以末段回肠及邻近结肠为主；纵行溃疡、裂隙样溃疡、铺路石（卵石）样外观；非干酪样坏死性肉芽肿。WHO 6条诊断要点。儿童常以食欲差、发热、营养不良、贫血、生长发育迟缓先于消化道症状。\n与UC鉴别：UC血便为主、直肠起病、连续分布、仅结肠；CD以慢性腹痛为主、血便少见，可累及全消化道、节段性，常合并肠瘘肛周病变。与肠结核鉴别最困难（误诊率50%~70%），肠结核盗汗多、干酪样肉芽肿、抗酸染色阳性。\nPCDAI分级：<10缓解，10~27.5轻度，30~37.5中度，40~100重度。\n治疗：EEN（全肠内营养）为儿童轻中度CD诱导缓解一线方案，疗程6~12周，推荐整蛋白配方；激素用于中重度；IFX 5mg/kg于0、2、6周诱导、每8周维持；AZA 12~16周达最大疗效。' },
  { m: '26I', q: '急性坏死性肠炎（AHNE）的病因、四型临床表现及与菌痢、肠套叠的鉴别？', a: '病因：C型产气荚膜梭状杆菌B毒素+机体变态反应（肠壁小动脉坏死）相结合。儿童4~10岁多见，病变在小肠，全层受累。\n临床四型：①腹泻血便型（仅黏膜及黏膜下层）；②肠梗阻型（肌层受累）；③腹膜炎型（浆膜层、可穿孔）；④中毒休克型（败血症/脓毒血症，最早出现休克）。\n特点：腹痛90%以上为首发（脐周或左中上腹阵发性转持续性）；血便为果酱样或洗肉水样伴灰白色腐肉状物、腥臭味，无里急后重；大便培养多阴性。腹平片小肠积气、肠壁增厚、肠间隙增宽，忌钡餐钡灌肠。\n鉴别：菌痢（脓血便、里急后重、培养阳性）；过敏性紫癜腹型（双下肢紫癜皮疹）；肠套叠（婴幼儿阵发哭闹、无高热中毒、空气灌肠确诊复位）。\n治疗：非手术为主（禁食、减压、纠正水电解质、抗生素）；大量血便不止、肠梗阻不缓解、疑穿孔坏死、顽固性休克者手术。' },
  { m: '26I', q: '先天性巨结肠（Hirschsprung病）的病理、临床表现、诊断方法及常见术式？', a: '本质：直肠/结肠远端肠壁肌间神经丛（Auerbach丛）和黏膜下神经丛（Meissner丛）神经节细胞缺如，无髓鞘副交感神经纤维增多增粗，痉挛段持续痉挛形成功能性梗阻，近端扩张肥厚。多基因遗传，RET基因为主要致病基因。发生率约1/5000，常见型（直肠乙状结肠远端）占75%。\n临床：90%以上生后36~48小时无胎便排出；顽固性便秘、腹胀；直肠指检壶腹部空虚，超过痉挛段可触及大便；最常见致死并发症——小肠结肠炎（腹泻与便秘腹胀发热血便交替）。\n诊断：①钡灌肠见痉挛段与扩张段、排钡差24小时滞留；②直肠活检（距肛门4cm以上，齿状线上2cm内为正常无神经节细胞区）为金标准；③肛管直肠测压（内括约肌不放松、无松弛波，新生儿10天内可假阳性）；④直肠黏膜乙酰胆碱酯酶组织化学（活性高5~6倍）。\n手术：Swenson（切除后翻出吻合）、Duhamel（直肠后拖出侧侧吻合）、Soave（黏膜剥脱经肌鞘拖出，可经肛门）、Rehbein（腹膜反折下切断吻合）；全结肠型用Martin术。术后并发症：吻合口狭窄、污粪失禁、便秘复发（10%）、吻合口瘘（最严重）。' },
  { m: '26I', q: '原发性与继发性急性腹膜炎的鉴别要点、常见病原及治疗原则？', a: '原发性：腹腔无原发病灶，细菌血行（少数淋巴/胃肠道/生殖道上行）感染，多见4~7岁，肾病肝病腹水患儿易发；病原A族链球菌、肺炎双球菌（脓液稀、少粘连）、葡萄球菌、大肠杆菌（脓稠粘连多）。起病急骤，高热（可达40℃）、呕吐、全腹痛，全腹压痛肌紧张、肠鸣音消失；白细胞（20~40)×10⁹/L、中性≥90%。腹穿抽出稀脓液涂片见球菌可确诊。治疗：非手术为主（大剂量抗生素首选青霉素、纠水电解质、输血血浆、胃肠减压）；24小时无好转或不能排除继发者手术。\n继发性：继发于脏器穿孔（溃疡穿孔、肠坏死）、炎症蔓延（阑尾炎）或手术污染；病原多为大肠杆菌或混合感染；原则上尽早手术处理病灶、引流，局限化趋向好转者保守治疗。' },
  { m: '26J', q: '小儿肝脏生理功能要点及肝功能试验中反映合成功能、胆汁淤积、肝细胞损害的代表指标？', a: '生理功能：①胆汁排泌（胎儿2~3月开始分泌胆汁，小儿胆汁牛磺胆酸多于甘胆酸）；②糖代谢（小儿肝糖原储存少，易饥饿性低血糖）；③蛋白质代谢（氨经鸟氨酸循环合成尿素解毒，受损时氨和芳香胺堆积引起脑病）；④维生素代谢（95%维生素A存于肝，维生素K参与凝血酶原合成）；⑤激素灭活（雌激素灭活障碍出现蜘蛛痣肝掌；抗利尿激素增多潴留）。\n肝功能指标：\n反映肝细胞损害：ALT（肝细胞含量最多）、AST（心肌多）；\n反映合成功能：白蛋白（半衰期20天，下降较迟）、前白蛋白（半衰期2天，敏感）、凝血酶原时间PT（凝血障碍出现最早，重型肝炎PTA<30%预后差）、胆碱酯酶（贮备功能）；\n反映胆汁淤积：ALP（特征性早期，>正常上限1.5倍）、γ-GT（>正常上限3倍）、5-核苷酸酶（不存在于骨骼）、脂蛋白X（梗阻性黄疸特异性）、血清胆汁酸TBA（灵敏特异）；\n定量肝功能：吲哚菁绿ICG清除试验（不受肝外代谢，较理想）、半乳糖清除试验。' },
  { m: '26J', q: '黄疸按发病机制的三分类及各类实验室鉴别要点、先天性非溶血性黄疸综合征的鉴别？', a: '三分类：\n①肝前性（未结合胆红素增高）：溶血或旁路性胆红素生成过多；实验室——未结合胆红素↑、凡登白间接反应、尿胆红素阴性、尿粪尿胆原均增多、网织红细胞增多。\n②肝细胞性（可兼有未结合与结合增高）：摄取、结合、运转、排泄障碍；尿胆红素阳性、尿胆原阴性或弱阳性、粪色可灰白。\n③肝后性（结合胆红素增高）：胆道梗阻；凡登白直接迅速或双相反应、尿胆红素强阳性、尿胆原阴性、粪中尿胆原阴性、ALP可增高。\n先天性非溶血性黄疸：\nGilbert综合征——摄取障碍+结合减低（轻型酶活力低，苯巴比妥有效）；\nCrigler-Najjar综合征——葡萄糖醛酸转移酶缺乏，I型隐性遗传（苯巴比妥无效、常伴核黄疸）、Ⅱ型显性（苯巴比妥有效）；\nDubin-Johnson综合征——结合胆红素排泄障碍，肝细胞褐色素沉着，BSP 45分钟反升高值，无皮肤瘙痒；\nRotor综合征——同Dubin-Johnson但无色素沉着，摄取未结合胆红素亦障碍；\nLucey-Driscoll综合征——母体内抑制物致新生儿未结合胆红素显著增高，易核黄疸。' },
  { m: '26J', q: '胆汁淤积性肝病的定义、诊断要点及药物治疗方案？', a: '定义：各种原因引起胆汁形成、分泌和/或排泄障碍的肝胆疾病；临床以直接胆红素（DB）升高为主，可表现为皮肤瘙痒（可先于黄疸）、尿色加深、白陶土样大便、脂肪泻、脂溶性维生素缺乏、骨病。\n诊断要点：DB升高；ALP升高（>正常上限1.5倍，最具特征性早期表现）；γ-GT升高（>3倍）；TBA升高（灵敏特异）；胆固醇>10.4mmol/L持续3个月可形成黄瘤；脂蛋白X升高有鉴别价值；ALT/AST轻中度升高。超声为区分肝内/肝外首选（胆总管>8mm提示肝外梗阻），MRCP安全准确，ERCP为诊断治疗肝外梗阻金标准。\n治疗：①病因治疗（停有关药物、取石、解除狭窄）；②营养（低脂、MCT、补充维生素钙剂）；③UDCA 10~15mg/（kg·d）分2~3次（促进内源性胆酸排泌、保护肝细胞）；④S-腺苷蛋氨酸SAMe 0.5~1g/d；⑤瘙痒——考来烯胺5~20g/d、利福平300~450mg/d、纳洛酮；⑥重症/肝衰竭可行血液净化、人工肝，终末期肝移植。' },
  { m: '26K', q: '小儿肝硬化的病因分类、三种病理类型特点、并发症及Child-Pugh分期？', a: '病因：①感染（我国主要，乙肝后肝硬化占44.1%、丙肝11.8%）；②遗传代谢缺陷（Wilson病、α1-抗胰蛋白酶缺乏、半乳糖血症、糖原贮积症IV型、酪氨酸血症）；③后天代谢异常（酒精、营养、中毒）；④免疫异常（AIH、PBC、PSC，法国儿童AIH致肝硬化占首位89%）；⑤肝及胆管囊性疾病（先天性肝纤维化CHF、Caroli病、胆总管囊肿）；⑥淤血性（Budd-Chiari、缩窄性心包炎）；⑦隐源性。\n三型病理：门脉性（结节小而均匀，慢性肝炎或肝充血所致）；坏死后性（大块坏死，宽纤维束、大小不等结节，发展快，常短期内肝衰竭死亡）；胆汁性（小儿多继发性，汇管区纤维增生、小胆管扩张胆栓）。\n并发症：上消化道出血（最常见死因之一，诱发肝性脑病）、肝性脑病、继发感染、门静脉血栓、肝肾综合征。\nChild-Pugh以白蛋白、胆红素、PT、腹水、肝性脑病五项评ABC期；MELD用于≥12岁，PELD用于<12岁评估移植分配。\n门静脉高压分三型：肝前型（门静脉海绵样变最多见，<5%）、肝内型（窦前/窦旁/窦后，占绝大多数，乙肝丙肝肝硬化为主）、肝后型（Budd-Chiari、缩窄性心包炎）；儿童肝硬化性与非肝硬化性PHT约各占50%。' },
  { m: '26K', q: '肝性脑病的发病机制、诱因、临床四期及降低血氨的治疗措施？肝衰竭的诊断要点？', a: '机制：①血氨升高（鸟氨酸循环障碍，干扰脑细胞能量代谢，但小儿急性肝衰竭血氨常不高）；②γ-氨基丁酸增高；③Na⁺-K⁺-ATP酶受抑制致脑水肿；④支链/芳香族氨基酸比值由正常3~4降至1~1.5以下；⑤假性神经介质（苯乙醇胺、β-羟酪胺）竞争受体；⑥短链脂肪酸增多。\n诱因：消化道出血、感染、碱中毒和低钾（呕吐腹泻利尿）、镇静药物、大量放腹水。\n四期：一期前驱期（性格改变、扑翼样震颤可阳性、脑电图正常）；二期昏迷前期（意识改变、定向力减退、慢波）；三期昏睡期（昏睡可唤醒、幻觉）；四期昏迷期（不能唤醒、反射消失，扑翼样震颤无法引出）。\n降氨：限制蛋白、清洁肠道、口服新霉素/甲硝唑、乳果糖酸化肠道、食醋灌肠、精氨酸、支链氨基酸。\n肝衰竭诊断要点：总胆红素>171μmol/L且每日上升>17.1μmol/L；"酶胆分离"（ALT下降而胆红素上升，AST>ALT，比值减小提示严重坏死）；PTA<40%（重症，<30%预后差）；低血糖（儿童77%）；血氨可升高；白蛋白/前白蛋白下降；早期肝脏肿大后迅速缩小、肝臭；AFP阳性提示肝细胞再生预后较好。' },
  { m: '26L', q: '小儿急性胰腺炎的常见病因、两型病理、诊断标准及淀粉酶与脂肪酶的特点？', a: '病因（与成人不同）：①感染（腮腺炎病毒、轮状病毒、EB病毒等）；②胆胰交界部位畸形（胰胆管合流异常，胆汁反流）；③药物（糖皮质激素、丙戊酸、左旋门冬酰胺酶）；④全身疾病（川崎病、SLE、过敏性紫癜、甲旁亢、克罗恩病）；⑤外伤。\n病理：水肿型占85%~95%；出血坏死型约占10%，胰液渗出致脂肪坏死、血钙降低（脂肪酸与钙结合）、休克，死亡率极高。\n诊断（3项中符合2项）：①典型腹痛（急性持续剧烈上腹痛，向背部放射）；②淀粉酶和/或脂肪酶>正常上限3倍；③增强CT/MRI或超声符合胰腺炎影像。\n酶学特点：血清淀粉酶发病3小时升高、24~48小时达峰；升高程度与病情不平行；尿淀粉酶12~24小时升高、持续3~5天。脂肪酶6小时升高、24~30小时达峰、持续1周以上，更敏感特异（敏感度87%~100%，特异度95%~100%）。CRP发病72小时>150mg/L提示胰腺坏死。\n分度：轻症MAP（无器官衰竭，1~2周恢复）、中度重症MSAP（一过性器官衰竭<48小时）、重症SAP（持续器官衰竭>48小时）。' },
  { m: '26L', q: '急性胰腺炎的非手术治疗原则、环状胰腺的临床表现及小儿假性胰腺囊肿的特点？', a: '急性胰腺炎治疗（非手术为主）：①禁食（不以淀粉酶高低作为开放饮食条件，腹痛消失、肠动力恢复后从糖类逐步过渡低脂）；②胃肠减压；③积极补液（每小时5~10ml/kg等渗晶体液，最初12~24小时益处最大）；④生长抑素/奥曲肽抑制胰外分泌；⑤不预防性用抗生素（感染性坏死用碳青霉烯等胰腺穿透好的抗生素）；⑥营养（重症先肠外，48小时内尽早肠内，鼻空肠管首选）。\n环状胰腺：背腹胰芽愈合位置异常环绕十二指肠降部；重者新生儿期初次喂乳后呕吐含胆汁，腹平片"双泡征"；钡餐见十二指肠降段内凹缩窄；常并存十二指肠闭锁/狭窄、唐氏综合征；治疗手术（十二指肠-十二指肠菱形吻合等）。\n假性胰腺囊肿：小儿以外伤性居多（60%），急性胰腺炎并发占30%；无上皮覆盖的纤维性囊壁，囊液淀粉酶高；2周以内可保守观察（部分自行吸收），囊壁形成（4~6周）后行内引流（囊肿胃吻合或囊肿空肠Roux-Y吻合）。\n慢性胰腺炎：儿童特发性为首位病因，遗传基因PRSS1、SPINK1、CFTR、CASR等；三型病理（慢性钙化性最多见、慢性阻塞性、慢性炎症性）。' },
];

// 27A 心血管解剖生理与体格检查
{ m: '27A', q: '胎儿及新生儿心脏解剖生理有哪些特点？', a: '1.心脏位置：2岁前心脏多呈横位，2岁后逐渐转为斜位。\n2.心脏大小：新生儿心脏重量约20~25g，占体重0.8%（成人仅0.5%）。\n3.心腔容积：初生时四个心腔容积几乎相等，约20~22ml；至青春期心腔容积增长约15倍。\n4.房室发育：出生后左心室负荷加重，左心室壁增厚超过右心室（出生前右室壁较厚）。\n5.血管特点：新生儿大血管弹性纤维少，动脉内径相对较宽，动脉压较低；随年龄增长血压逐渐升高。' },
{ m: '27A', q: '小儿心脏体格检查要点：心脏望触叩听各有哪些要点？杂音如何分级？无害性杂音有哪两种？', a: '望诊：心尖冲动位置正常在左第5肋间锁骨中线内侧（2岁内可在左第4肋间），搏动范围一般不超过2~3cm。\n触诊：注意心尖冲动位置、强弱及有无震颤（震颤提示器质性病变，与杂音最响部位一致）。\n叩诊：判断心脏大小和形状。\n听诊：\n1.心音：注意S1、S2强度及有无S3、S4奔马律；肺动脉瓣区第二心音（P2）亢进提示肺动脉高压，P2固定分裂提示房缺。\n2.杂音分级：共6级。Ⅰ级最轻（需仔细听）、Ⅱ级轻但易听、Ⅲ级中等、Ⅳ级响亮伴震颤、Ⅴ级很响、Ⅵ级最响（离开胸壁可闻）。2级以下多为功能性。\n3.无害性（功能性）杂音两种：①Still杂音（收缩早期乐音样/吹风样，胸骨左缘最响，改变体位可变）；②肺动脉瓣区柔和收缩期杂音。\n4.心包摩擦音：见于心包炎。\n5.静脉哼鸣：颈静脉处连续性杂音，压迫颈静脉可消失，属生理性。\n血压：袖带宽度应为上臂长度的2/3；脉压增宽见于动脉导管未闭、主动脉瓣关闭不全等。' },

// 27B 心电图·X线·超声·心导管等特殊检查
{ m: '27B', q: '心电图判断小儿心房心室肥大的标准是什么？', a: '右房肥大：P波高尖，电压≥0.25mV（肺型P波）。\n左房肥大：P波增宽≥0.09s（婴幼儿≥0.08s），伴切迹（二尖瓣型P波）。\n右室肥大：\n1.V1导联R/S比值：1周至1岁>1.5，1~5岁>1.0，5岁以上>0.5；\n2.RV1电压：出生至6个月≥1.7mV，6个月至3岁≥1.5mV，3岁以上≥1.0mV；\n3.电轴右偏。\n左室肥大：\n1.RV5或RV6电压：3岁内≥3.0mV，3岁以上≥3.5mV；\n2.V5导联R/S比值>2；\n3.电轴左偏；\n4.伴ST-T改变提示劳损。' },
{ m: '27B', q: '超声心动图测定心功能的主要指标？心导管检查的适应证、并发症及介入治疗有哪些？运动试验分哪几种？', a: '超声心功能指标：\n左室收缩功能——FS（短轴缩短率）=（Dd-Ds）/Dd×100%，正常28%~38%；EF（射血分数）正常45%~75%。\n左室舒张功能——等容舒张时间（IRT）正常（0.07±0.01）s；二尖瓣E/A>1。\n右室功能——RVPEP/RVET正常0.16~0.30；三尖瓣E/A正常1.5±0.3。\n心导管检查：\n适应证——复杂先心病诊断、评价肺动脉压力及阻力、主动脉弓及血管病变、术后评估、电生理检查及心肌活检、介入治疗。\n禁忌证——感染性心内膜炎、活动性风湿病或心肌炎、严重心律失常、重度心力衰竭、化脓感染病灶及出血倾向。\n并发症——以导管刺激心肌引起的心律失常最常见（室性/房性期前收缩、短阵心动过速）；重者房室传导阻滞、室颤；死亡率0.1%~1%。\n介入治疗——球囊瓣膜成形术（肺动脉瓣狭窄首选）、球囊血管成形术（主动脉缩窄）、球囊房间隔造口术（大动脉转位等急救）、PDA封堵、ASD封堵、VSD封堵、射频消融等。\n运动试验：活动平板（改良Bruce方案）、踏车运动试验（6MWT为亚极量试验，用于心衰评估）；极量运动标准——心率达190~200次/min或运动前2倍。' },

// 27C 先心病总论·房间隔缺损·房室间隔缺损
{ m: '27C', q: '先心病的发病情况、病因及胎儿-新生儿血液循环特点？', a: '发病率：新生儿先心病发病率约8‰~9‰（我国调查8.98‰），其中1/4~1/3为危重症。\n病种顺位：室间隔缺损（3.3‰）>房间隔缺损（1.7‰）>动脉导管未闭（0.78‰）>肺动脉瓣狭窄>法洛四联症>完全型大动脉转位>肺动脉闭锁>单心室>完全性房室间隔缺损>主动脉缩窄>全肺静脉异位引流>右心室双出口。\n病因：遗传（单基因和染色体异常约占10%：40%唐氏综合征合并先心病以VSD最多；22q11微缺失见于动脉单干、法四等）+环境因素（妊娠早期风疹等病毒感染、放射线及药物、糖尿病等代谢病、酗酒吸毒、叶酸缺乏），多数为多基因与环境共同作用。\n胎儿循环：血液经脐静脉→肝/静脉导管→下腔静脉→右心房，经卵圆孔入左心房，肺无功能，肺循环阻力高于体循环，动脉导管与卵圆孔开放；左右心均向全身供血，右室负荷高，故新生儿左右室壁厚度几乎相等、电轴右偏。\n出生后改变：呼吸建立→肺扩张、肺阻力下降→肺血流增加→左房压升高使卵圆孔关闭；血氧升高促使动脉导管收缩闭合。' },
{ m: '27C', q: '房间隔缺损（ASD）的分类、病理生理、临床表现及治疗？', a: '分类：原发孔型（房间隔下部半月形，紧邻房室瓣，常伴二、三尖瓣裂缺）、继发孔型（最常见，位于卵圆窝附近）、静脉窦型（上腔静脉-右房连接处，常合并右上肺静脉异位引流）、冠状窦型。ASD合并二尖瓣狭窄称卢氏（Lutembacher）综合征。\n病理生理：左房压高于右房→左向右分流→右心扩大；晚期可致肺动脉高压、艾森门格综合征。分流量取决于缺损大小及左右室顺应性。\n临床表现：女多于男（约2:1），儿童期多无症状；典型体征为胸骨左缘第2肋间Ⅱ级收缩期喷射性杂音（因右室搏出量增多致肺动脉口相对狭窄）、肺动脉瓣区第二心音分裂明显且固定（特征性）；肺门舞蹈征；主动脉影小。心电图：电轴右偏、不完全性右束支传导阻滞。超声见右房右室增大，分流量大时室间隔与左室后壁同向活动。\n治疗：有血流动力学改变的继发孔型ASD首选介入封堵术；原发孔型、静脉窦型、无顶冠状窦型需手术；小型缺损（Qp/Qs≤1.5）可不治；学龄前期治疗为宜。' },
{ m: '27C', q: '房室间隔缺损（AVSD，旧称心内膜垫缺损）的分型、特点与治疗？', a: '分型：部分性（原发孔房缺+二尖瓣前叶裂缺，无心室水平分流）和完全性（共同房室孔，上方原发孔房缺、下方大型室缺，心房心室水平均有分流）。约半数合并唐氏综合征。Rastelli分型（完全性）：A型前桥瓣连于室间隔顶端（50%~70%）、B型附着于异常右室乳头肌（约3%）、C型附着于前乳头肌自由活动（约30%）。\n表现：部分性类似ASD但出现早且重；完全性症状严重，婴儿期反复呼吸道感染、心衰、肺动脉高压常见。心脏扩大显著，胸骨左缘2~4肋间粗糙收缩期杂音，心尖部Ⅲ级收缩期杂音（二尖瓣关闭不全）。心电图特征：电轴左偏+双室肥大。\n治疗：部分性体外循环直视修补，注意保护房室传导组织（防Ⅲ度房室传导阻滞）；完全性应婴儿期手术，以3~4个月为宜，补片+重建房室瓣，术后早期存活率90%以上。' },

// 27D 室间隔缺损·动脉导管未闭·主肺动脉隔缺损
{ m: '27D', q: '室间隔缺损（VSD）的分型、艾森门格综合征、临床表现与治疗？', a: 'VSD为先心病发病率第1位。分型：膜周型、肌部型、双动脉下型（上型）、邻近三尖瓣型、左室右房通道型。小型缺损多位于肌部；中、大型多位于膜周部或双动脉下。\n病理生理：肺循环阻力下降后左向右分流，左心容量负荷增加；大型缺损肺动脉高压由动力型转阻力型，当右室压超过左室时出现右向左分流、发绀，即艾森门格综合征。\n表现：小型缺损可无症状，胸骨左缘第3、4肋间粗糙响亮全收缩期杂音伴震颤（Roger病）；分流量大（>肺循环量50%）时发育迟缓、多汗、气促、易感染及心衰；分流量超一倍时心尖区舒张中期隆隆样杂音（相对性二尖瓣狭窄）；P2增强。X线：中大型缺损心影呈球状/烧瓶状扩大，以左室为主，主动脉弓影小。心电图：左室肥大或双室肥大。\n预后与治疗：20%~50%膜部和肌部缺损可于5岁内（尤其1岁内）自然闭合，双动脉下型罕见自然闭合；Qp/Qs>2者宜介入封堵或手术；肺动脉下型无论大小应婴儿期手术；合并感染性心内膜炎者先控制感染。' },
{ m: '27D', q: '动脉导管未闭（PDA）的病理生理、差异性青紫、典型体征及治疗？', a: '病理生理：主动脉压高于肺动脉→左向右分流→左房左室负荷增加→左心衰；肺动脉高压由动力型转阻力型后，当肺动脉压超过主动脉，血流自肺动脉分流至降主动脉，下半身轻度发绀而上半身不紫，称差异性青紫。早产儿PDA因导管发育未成熟所致。\n典型体征：胸骨左缘第2肋间响亮的机器样连续性杂音（贯穿收缩期及舒张期，收缩后期更响），向锁骨下和颈部传导，伴震颤；脉压增大（舒张压低，一般>40mmHg），可见毛细血管搏动；分流量大时心尖区舒张中期杂音。女多于男（2~3:1）。偶因肺动脉压迫喉返神经致声音嘶哑。X线：升主动脉及主动脉弓影增宽（区别于VSD）。心电图：分流量大者左室肥大。\n治疗：早产儿可试用吲哚美辛（前列腺素抑制剂）关闭导管；较粗导管首选介入封堵（弹簧圈或封堵器，创伤小已替代开胸手术）；禁忌证为严重肺动脉高压出现右向左分流（失去关闭机会）。' },

// 27E 法洛四联症·右室双出口·大动脉转位
{ m: '27E', q: '法洛四联症的四大病理特点、蹲踞原因、缺氧发作及X线/心电图特点？治疗原则？', a: '四大病理：①肺动脉狭窄（最多见为右室漏斗部狭窄，是主要畸形）；②主动脉骑跨（横跨室间隔，同时接受左、右室血液）；③大型室间隔缺损（多为膜周部）；④右心室肥厚。25%合并右位主动脉弓，约20%合并左上腔静脉。\n发绀：多在3~6个月出现；婴儿期常见阵发性呼吸困难及发绀加重（漏斗部肌肉痉挛所致），重者阵发性神志不清、惊厥、昏厥（脑缺氧发作）。\n蹲踞机制：蹲踞/胸膝位使体循环阻力增高，减少右向左分流，改善缺氧。\n心脏体征：胸骨左缘2~4肋间粗糙喷射性收缩期杂音伴震颤（狭窄越重杂音越轻！）；P2减弱呈单一感；杵状指/趾；血红蛋白及红细胞增多，血细胞比容可达60%~80%，血小板及纤维蛋白原降低有出血倾向。\nX线：靴型心，肺动脉段凹陷，心尖圆钝上翘，主动脉影增宽，肺门血管细少、肺野透明（侧支丰富者呈网状）。心电图：电轴右偏、右室肥大、Ⅱ导联P波高尖。\n治疗：预防感染、充足水分防血液浓缩致脑栓塞；根治术为心内直视手术（解除狭窄+修补室缺）；婴儿缺氧重者可先做B-T分流术（改良：人造血管连接无名动脉与同侧肺动脉）；镶嵌治疗用于侧支血管处理。' },
{ m: '27E', q: '右心室双出口（DORV）与完全型大动脉转位（TGA）的血流动力学及治疗？', a: '右室双出口：主动脉和肺动脉全部或大部分发自右心室，常合并VSD。按VSD与大动脉关系分：主动脉瓣下型（50%~75%，常合并肺动脉狭窄）、肺动脉瓣下型（20%~25%）、双动脉干下型（约3%）、远离两大动脉型（7%）。无肺动脉狭窄者类似大量左向右分流的VSD；合并肺动脉狭窄者类似法四。超声特点：主动脉壁与二尖瓣不连续、两根大动脉同一水平。治疗取决于VSD位置：主动脉瓣下VSD行心内隧道（室缺修补）矫治；肺动脉瓣下可行大动脉调转等；无根治条件可环扎肺动脉。\n完全型大动脉转位（D-TGA，占多数）：主动脉出自右心室、肺动脉出自左心室，形成两个隔绝循环，必须依赖PDA、卵圆孔或VSD交通才能存活。不合并畸形者出生后即发绀、迅速缺氧心衰仅能存活数天。男多于女（约3:1）。X线：心脏呈椭圆形向两侧扩大，大血管影增宽（前后位并列），胸腺影小，肺野纹理增多（合并肺动脉狭窄者减少）。超声：主动脉位于肺动脉右前方，两者平行排列失去正常交叉关系。治疗：新生儿期球囊房间隔造口术（Rashkind）急救，改善缺氧；根治首选Jatene大动脉调转术（恢复解剖位置，远期好）；心房水平Mustard/Senning手术远期心律失常多；双调转术适用于L-TGA等。' },
{ m: '27F', q: '全肺静脉异位引流（TAPVD）四型、动脉单干与单心室的特点？', a: '全肺静脉异位引流：肺静脉不回流入左心房而经腔静脉系统回右心房，分四型——①心上型（最常见：经垂直静脉→无名静脉→上腔静脉）；②心内型（直接入右心房或经冠状静脉窦入右心房）；③心下型（经门静脉/静脉导管/肝静脉/下腔静脉，易梗阻，病情重）；④混合型。心上型X线呈雪人样（8字形）征，侧位气管前锤形阴影。均需依赖房缺/卵圆孔交通入左心，有发绀及肺动脉高压；合并梗阻者需尽早手术（肺静脉与左心房吻合术）。\n动脉单干：只有一根大血管出自心室，仅一组动脉瓣（2~6个，多3~4个），主肺动脉未分隔，常伴VSD。分三型：Ⅰ型主肺动脉自总干根部分出；Ⅱ型左右肺动脉自总干背部分出；Ⅲ型左右肺动脉各自从总干侧面分出。大量血流入肺→左心衰→梗阻性肺高压。第二心音单一响亮；婴儿期心衰可肺动脉环扎，4~5岁行Rastelli根治（补VSD+人造血管连接右室与肺动脉）。\n单心室：左右心室腔之间无间隔，两侧心房血经各自房室瓣入共同心室腔。最常见组合：①单心室+大动脉转位+主动脉起源于残存流出腔；②单心室伴肺动脉口狭窄。心电图特点：胸导联V1~V6波形无大差别（均为大RS型）。有流出腔合并肺动脉狭窄者先做体肺分流；肺血多者先做肺动脉环扎，以后行心室分隔（难度大致房室传导阻滞）。' },

// 27G 肺动脉瓣狭窄·主动脉缩窄·二尖瓣脱垂·三尖瓣闭锁·Ebstein
{ m: '27G', q: '肺动脉瓣狭窄与主动脉缩窄的临床表现、鉴别要点及治疗？', a: '肺动脉瓣狭窄：为右室流出道梗阻性先心病中最常见畸形，瓣口呈鱼嘴状，肺动脉狭窄后扩张。轻症无症状；重度者右室压增高，可经未闭卵圆孔/房缺右向左分流出现发绀。体征：胸骨左缘第2肋间粗糙喷射性收缩期杂音伴震颤（极重度时杂音反而减弱！），P2减低，轻中度者可有收缩早期喷射音。X线特征：肺动脉段隆起伴肺纹理减少，两者形成鲜明对比。心电图判断狭窄程度（重度者至少其一）：①V1呈qR型或R型R>20mV；②P波高尖示右房肥大；③各导联ST段偏移。治疗：经皮球囊导管扩张术为跨瓣压差>40mmHg者首选；婴儿右室压150~200mmHg应急诊手术切开瓣膜。\n主动脉缩窄：绝大多数发生于动脉导管开口附近，男多（2:1）。成人型（导管后，局限）：侧支循环丰富（肋间、内乳、肩胛分支吻合），可活至成年，儿童期常因高血压就诊；婴儿型（导管前，长段）：导管关闭后下半身缺血，常婴儿期死亡。诊断要点：上肢脉搏强/血压高、下肢弱，上下肢血压差大（正常下肢高于上肢约20mmHg）；心底部收缩期杂音向背部传导，侧支血管上可闻连续性杂音；X线见肋骨下缘切迹（侧支血管压迫）、缩窄后扩张。治疗：缩窄前后压差>20mmHg者4~6个月球囊扩张；术后再缩窄宜球囊扩张；学龄期支架置入成功率高。严重并发症：高血压致脑血管意外、高血压脑病、心衰。' },
{ m: '27G', q: '二尖瓣脱垂、三尖瓣闭锁、埃布斯坦（Ebstein）综合征的要点？', a: '二尖瓣脱垂：二尖瓣前/后瓣收缩期向左房突出（黏液样变性），可单独存在，常合并继发孔房缺，女性多见。特征性体征：心尖部收缩中期喀喇音（可呈连珠鞭炮样）伴收缩中晚期杂音。超声为决定性无创检查（瓣叶关闭时超过瓣环水平）。并发症：心律失常（室早、室上性）、感染性心内膜炎、腱索断裂、血栓栓塞，少数猝死。治疗：无症状不需治疗；心律失常用普萘洛尔等β受体阻滞剂。\n三尖瓣闭锁：三尖瓣先天性闭合无瓣孔，常伴右室发育不良。腔静脉血全部经房缺/卵圆孔入左房与肺静脉血混合入左室；半数以上1岁内死亡。心电图特征：电轴左偏（青紫型先心病中少见）、V1呈rS型S波深、V5/6呈qR型R波高。Fontan术（人造血管连右房-肺动脉+关闭房缺）可使循环生理矫正，条件：肺血管阻力正常、平均肺动脉压<20mmHg、肺动脉够大、左心功能好。\nEbstein综合征（三尖瓣下移畸形）：三尖瓣后瓣及隔瓣下移至右室壁近心尖处，形成房化右心室（右房明显增大）和功能右心室（小），常合并卵圆孔开放/房缺及肺动脉狭窄。常合并预激综合征→阵发性房速或房颤。超声有确诊价值。治疗：重者B-T或Glenn分流增加肺血流；三尖瓣成形/置换、房化右室折叠术。' },

// 27H 心律失常总论·窦性心律失常·期前收缩
{ m: '27H', q: '心律失常的发生机制分哪三大类？小儿心律失常病因与成人有何不同？', a: '三大机制：\n1.激动形成失常：窦性心律失常（窦速、窦缓、窦性心律不齐、游走心律、窦性静止）及异位心律（被动性：逸搏/逸搏心律，起保护作用的次级起搏点；主动性：期前收缩、心动过速、扑动、颤动）。\n2.激动传导失常：干扰（生理不应期所致，连续发生称干扰性房室分离）、传导阻滞（窦房/房内/房室/束支传导阻滞）、折返现象（单次折返→期前收缩，连续折返→心动过速）、预激综合征（旁路传导）。\n3.触发活动：由正常动作电位触发（后除极为基础）。\n与成人不同点：小儿以窦性心律失常最常见（窦速、窦律不齐两项占78.6%）；房颤显著减少（仅0.6%，成人居第二位）；期前收缩中室性最多；房室传导阻滞以一度多见；新生儿传导系统2岁才发育完善，窦性心率波动范围大；快速异位心律失常主要由折返引起。\n病因：先心病（Ebstein常并室上性心律失常、大动脉转位并完全性房室传导阻滞、房缺并一度AVB及不全右束支阻滞）、风心病、心肌炎、长QT综合征、二尖瓣脱垂（室性心律失常）；心外因素以电解质紊乱（低钾、低镁、高钾）、洋地黄中毒（低钾低镁时更易诱发）最重要；SLE母亲的新生儿多房室传导阻滞；心脏手术、心导管、麻醉也常诱发。' },
{ m: '27H', q: '小儿正常窦性心率范围？听诊节律的初步判断（快而齐/快而不齐/慢而齐/慢而不齐/正常而不齐各考虑什么）？心律失常的特殊检查有哪些？', a: '正常窦性心率：婴儿100~140次/min，1~6岁80~120次/min，6岁以上60~100次/min。\n初步判断：\n心率快而齐——窦速、室上速、室速、房扑伴1:1或2:1传导；\n心率快而不齐——房颤、房扑伴不规则房室传导、窦速伴期前收缩；\n心率慢而齐——窦缓、完全性房室传导阻滞、病窦综合征；\n心率慢而不齐——窦缓及不齐、窦缓伴期前收缩、二度AVB；\n心率正常而不齐——窦性心律不齐、频发性期前收缩、一度AVB。\n特殊检查：\n1.24小时动态心电图（Holter）：常规心电图正常者48%可检出心律失常；用于先心病术后猝死预防、诊断病窦、找晕厥原因（10%~25%）、评价药物疗效（室早减少50%以上有效，90%以上显效）、查起搏器故障。\n2.运动心电图（亚极量，运动后心率170次/min）：查窦房结功能；评估完全性AVB部位（运动后心室率提高<10次/min提示阻滞在房室束以下，需起搏器）；评价室早性质（随心率增快而消失为良性）；诊断长QT综合征。\n3.经食管心房调搏：间接左房调搏；测窦房结恢复时间等；检测房室结双径路（正常儿童23.6%存在）；研究室上速折返机制；可超速抑制终止室上速。\n4.希氏束电图：P-A间期20~40ms，A-H间期60~140ms，H-V间期35~55ms；确定AVB部位。\n5.心内电生理检查：明确室上速/室速机制，指导射频消融；评估猝死高危患儿（预激旁道前传不应期≤220ms或房颤时心室率>200次/min预示猝死）。\n鉴别小技巧：刺激颈动脉窦——窦速仅轻度减慢且放松即恢复；室上速可终止或无改变；房扑心率可减为1/2。' },
{ m: '27H', q: '抗心律失常药的Vaughan Williams分类及代表药物？用药注意什么？', a: '四类：\nⅠ类钠通道阻滞剂：抑制Na内流，减慢传导，延长有效不应期，降低自律性；室上性及室性均有效。\nⅠA（中度抑制0相，复极延长）：奎尼丁、普鲁卡因胺；\nⅠB（轻度抑制0相，缩短复极）：利多卡因、苯妥英钠、美西律、莫雷西嗪；\nⅠC（明显抑制0相及减慢传导）：普罗帕酮、氟卡尼。\nⅡ类β肾上腺素能阻滞剂：普萘洛尔、阿替洛尔；减慢4相上升速度，抑制自律性，终止折返，对窦房结房室结作用明显。\nⅢ类动作电位时程延长剂：胺碘酮、索他洛尔；延长心房心室旁路有效不应期，阻断折返。\nⅣ类钙通道阻滞剂：维拉帕米；抑制窦房结房室交界区自律性，终止室上速发作。\n注意事项：除ⅠB外均有抑制心肌功能作用，快速心律失常合并心衰、休克或严重传导阻滞时禁用或慎用；治疗量与中毒量接近，应熟悉药代动力学，必要时监测血药浓度；警惕致心律失常作用（发生率6%~36%）：用药后出现新的室性心律失常、原有心律失常加重、停药后消失。' },

// 27I 阵发性室上速及室上性心律失常
{ m: '27I', q: '阵发性室上性心动过速（PSVT）的发病机制（折返三要素、AVNRT、AVRT、隐匿性预激）及心电图特点？', a: '机制：多为折返引起（少数自律性增高）。折返三要素：单向传导阻滞、传导延缓、折返环路。\n房室结折返（AVNRT）：房室结纵向分离为双径路——慢径（α）传导慢不应期短、快径（β）传导快不应期长。房早适当时快径单向阻滞，冲动经慢径下传、快径逆传形成折返。慢-快型（S-F）多见：慢径下传快径逆传；快-慢型罕见。占室上速约30%。\n房室折返（AVRT）：即预激旁道引起的室上速，占约40%。房室结为慢径、房室旁路为快径。顺传型（房室结前传、旁路逆传）多见；逆传型极少见。预激旁路只有单向逆传功能时心电图无预激表现（P-R正常无δ波），称隐匿性预激综合征（AVRT中约占31%）。\n窦房结折返及房内折返：均少见。\n心电图诊断：①R-R绝对匀齐，心室率婴儿250~325次/min、儿童160~200次/min；②QRS形态正常（伴室内差传可增宽呈右束支阻滞型；逆传型旁路折返呈预激图形）；③约半数可见逆行P波，紧随QRS之后；④ST-T可呈缺血型改变，终止后持续1~2周。\n食管心房调搏鉴别：AVNRT——RP<70ms，Pv、Pe同步；AVRT——RP>70ms，Pv-Pe>30ms（左侧旁道为负值，右侧为正值）。' },
{ m: '27I', q: 'PSVT终止发作的治疗（迷走神经刺激法、药物选择及禁忌）与预防复发？', a: '终止发作（绝大多数为房室交界区折返及顺传型旁道折返）：\n1.兴奋迷走神经（适用于早期、心功能正常者）：按压颈动脉窦（先右侧5~10秒，不可同时按两侧）、屏气法（大龄儿童）、冰袋法（4~5℃冰水袋敷面部10~15秒，对小婴儿新生儿效果好）、升压药（去氧肾上腺素0.01~0.1mg/kg，用于并发低血压者）。\n2.药物：\n①ATP——首选，0.1~0.3mg/kg于2秒内快速静注，起效平均20秒，有效率85%~90%；有致窦停、房室阻滞副作用，持续数秒即消失；ATP后发生房室阻滞可明确房速、房扑诊断。\n②普罗帕酮——复律率高起效快，有效率83%，1~1.5mg/kg静注。\n③维拉帕米——0.1~0.2mg/kg（一次不超5mg），禁用于逆传型旁路折返（加快心室率）及新生儿小婴儿；严禁与β受体阻滞剂合用。\n④洋地黄制剂——室上速并发心衰者首选毛花苷C或地高辛静注，首剂用饱和量的1/2。\n3.电学治疗：同步直流电击复律（并发心衰、心源性休克或宽QRS不能鉴别者，0.5~1.0J/kg）；心房调搏复律（食管或右房，超速抑制）。\n逆传型房室旁路折返：首选普罗帕酮，次选胺碘酮；禁用维拉帕米、洋地黄（可使旁路前传不应期缩短，<220ms易致室速室颤猝死）。\n预防复发：反复发作或并发严重心功能障碍者用维持量6~12个月（地高辛、普萘洛尔或普罗帕酮）。射频消融：发作2次以上、药物难控制或血流动力学障碍者首选，成功率95%~100%。' },
{ m: '27I', q: '房性心动过速（自律性房速EAT）、紊乱性房性心动过速（CAT）、心房扑动、心房颤动各有什么特点？', a: '自律性房速（EAT/AAT）：占小儿室上速6%~18%；多心脏结构正常，机制为心房异位病灶4相舒张期除极速率加快（可能为残留自律性胚胎细胞）。特点：持续发作数月数年（慢性房速），心率150次/min以上但不恒定，入睡安静时减慢、活动烦躁时加快（昼夜差可>50次/min），有温醒和冷却现象（起始缓慢起步、终止缓慢）。无休止发作可致心动过速性心肌病（约50%并发心衰，婴儿明显）。治疗：β受体阻滞剂+地高辛减慢心室率，多可自行缓解；射频消融为根本治愈方法（首选）。\n紊乱性房速（CAT）：多发生于婴儿期，心脏结构正常。心电图：同一导联≥3种不同形态P波、无主导起搏点、PR/RR/PP不等、心房率140~300次/min。常伴短阵房扑房颤。药物复律困难，多数1~3岁自行缓解预后好；无心脏病者不用或小剂量β受体阻滞剂/洋地黄维持量。胺碘酮与地高辛合用时地高辛量应减1/3（血浓度升高中毒）。\n心房扑动：小儿较房颤多见。F波频率350~500次/min，锯齿状无等电位线；婴儿可1:1传导（室率250以上）易致心衰；多为2:1~3:1。心脏正常者2:1~3:1、室率<150无症状者无需用药，多1岁左右自行消退。预激综合征并房扑禁用地高辛及维拉帕米。治疗：地高辛减慢室率；电击复律效果好（新生儿小婴儿更佳，1.0~2.0J/kg）；食管心房超速抑制成功率73%；射频消融用于难治。\n心房颤动：室上性心律失常中最严重类型。P波消失代以f波（300~700次/min），R-R极不规则，心室率100~150次/min；脉搏短绌（心率>脉搏）。小儿少见，多与紊乱性房速、房扑交替。治疗：洋地黄减慢室率并控制心衰；普罗帕酮、氟卡尼、胺碘酮、索他洛尔可转复；无效者同步电击复律。' },
{ m: '27J', q: '室性心动过速的共同心电图特点？阵发性室速（PVT）与特发性室速（IVT）的鉴别及治疗？', a: '室速共同心电图：①连续3次以上室性期前收缩，QRS宽大畸形（婴儿QRS可<0.08s），心室率150~250次/min；②房室分离——窦性P波与QRS各自独立，心室率快于心房率；③室性融合波及心室夺获。\n阵发性室速（PVT）：多见于严重心肌病（心肌炎、扩张型心肌病）、法洛四联症根治术后晚期（猝死主因）、婴儿心肌浦肯野细胞瘤（引起无休止室速）。心率150~250次/min（婴儿可达300以上）。治疗：有血流动力学障碍者首选同步直流电击复律（2J/kg，洋地黄中毒禁忌）；无血流动力学障碍者首选利多卡因（1~2mg/kg静注，20~50μg/kg/min维持），无效换普罗帕酮、美西律、苯妥英钠、胺碘酮。洋地黄中毒致室速：停洋地黄+氯化钾口服75~100mg/(kg·d)或静滴0.3%氯化钾，苯妥英钠及利多卡因效果好。婴儿浦肯野细胞瘤致无休止室速内科无效，需手术切除或射频消融。\n特发性室速（IVT）：无明显器质性心脏病，占VT的10%~15%，预后较好。左室IVT：QRS呈右束支阻滞型伴电轴左偏（起源左后分支浦肯野纤维网），维拉帕米能有效控制且普罗帕酮亦有效，利多卡因、普萘洛尔无效；右室IVT：呈左束支阻滞型伴电轴向上（起源右室流出道），首选β受体阻滞剂或普罗帕酮。导管射频消融成功率高（90%以上），为年长儿首选根治方法。' },
{ m: '27J', q: '离子通道病相关室速：CPVT、Brugada综合征、短QT综合征、长QT综合征（LQTS）各有什么特点及治疗？', a: '儿茶酚胺敏感性多形性室速（CPVT）：常染色体显性RyR2（或隐性CASQ2）突变；运动或激动时发作双向性、多形性VT致晕厥猝死，平板运动可重复诱发。治疗：β受体阻滞剂首选；无效或反复心搏骤停者ICD；可加左心交感神经切除术。\nBrugada综合征：SCN5A等Na通道基因突变，常染色体显性；V1~V3导联ST段抬高（三型：一型穹窿型>2mm伴T波倒置为诊断依据），反复晕厥、多形性室速室颤，猝死多在夜间静息时。治疗：ICD为唯一有效方法（有症状一型或电生理诱发VT者）；奎尼丁为首选药物；异丙肾上腺素可使ST段回落。\n短QT综合征：QTc≤300ms（KCNH2等钾通道基因突变），伴房扑房颤室速室颤，心脏结构正常。治疗困难，可试用奎尼丁/索他洛尔。\n长QT综合征（LQTS）：QTc>0.44s（Bazett公式），多形性室速、晕厥、猝死。分型：Romano-Ward综合征（听力正常，常染色体显性，最多见）；Jervell-Lange-Nielsen综合征（伴先天性耳聋，常染色体隐性）；散发型。LQT1 T波宽平滑、LQT2 T波低幅切迹、LQT3 T波高尖延迟。发作TdP（尖端扭转型室速）。治疗：①避免延长QT间期的药物及剧烈运动情绪激动；②β受体阻滞剂首选（普萘洛尔2mg/(kg·d)，分3次）；③美西律缩短LQT3的QT间期；④高危者左心交感神经切除术（左星状神经节下半部+左胸1~5交感神经节）；⑤反复晕厥者ICD；⑥TdP发作时：非同步电击复律、静注普萘洛尔（一次<3mg）、阿托品或起搏提高心率>110次/min、静滴氯化钾+硫酸镁；禁忌儿茶酚胺类及ⅠA、ⅠC、Ⅲ类抗心律失常药。' },

// 27K 心力衰竭·心源性休克
{ m: '27K', q: '小儿心力衰竭的病因分类、病理生理（神经内分泌激活）及心功能分级（含改良Ross计分）？', a: '定义：心室收缩和/或舒张功能障碍致心排血量不足，是各种心脏病的严重阶段；由四部分组成——心功能障碍（必备条件）、运动耐力减低、肺体循环充血、后期心律失常。\n病因三大类：\n1.心肌病变：原发性（心肌炎、心肌病、心内膜弹力纤维增生症）；心肌代谢障碍（重度窒息、休克、严重贫血、维生素B1缺乏）。\n2.压力负荷过重：左室——主动脉瓣狭窄、主动脉缩窄、高血压；右室——肺动脉瓣狭窄、肺动脉高压。\n3.容量负荷过重：左室——PDA、VSD、主动脉瓣/二尖瓣关闭不全；右室——ASD、全肺静脉异位引流。\n年龄特点：新生儿以危重先心病为主（完全型大动脉转位、左心发育不良、主动脉弓离断）；婴儿期先心病+心内膜弹力纤维增生症、心肌糖原贮积症、病毒性心肌炎；4岁后以风湿热及心肌病为主。诱发加重因素：肺炎、输液过快过多、电解质紊乱、停用洋地黄过早或洋地黄过量、贫血。\n病理生理：交感神经激活（儿茶酚胺升高，长期致β受体下调、心肌毒性）+肾素-血管紧张素-醛固酮系统激活（AngⅡ收缩血管、醛固酮水钠潴留排钾镁）+ANP升高（利钠利尿对抗RAAS）→心室重塑（心肌细胞肥大凋亡、胚胎基因再表达）；治疗关键是阻断神经内分泌系统、阻断心室重塑。\n心功能分级：Ⅰ级活动不受限；Ⅱ级轻度受限（一般活动出现症状）；Ⅲ级明显受限（轻劳动即有症状）；Ⅳ级休息时亦有症状。婴儿用改良Ross计分：0~2分无心衰，3~6轻度，7~9中度，10~12重度。\n诊断要点：心动过速是最早代偿现象；心音低钝、舒张早期奔马律；肝大是体静脉淤血最早最常见体征；婴儿心衰应与毛细支气管炎鉴别（吸氧后肺源性发绀减轻、心源性改善不明显）。辅助：X线心胸比例>0.5（新生儿小婴儿可>0.55）；超声EF<0.45提示心功能不全；BNP升高（心衰程度指标）。' },
{ m: '27K', q: '心力衰竭的药物治疗（洋地黄用法与中毒、利尿剂、ACEI、β受体阻滞剂）及急性肺水肿的处理？心源性休克的分期与治疗要点？', a: '心衰药物治疗：\n1.洋地黄：地高辛口服为首选用药（负荷量：早产儿0.02、足月儿0.02~0.03、婴儿及儿童0.025~0.04mg/kg；维持量为负荷量的1/5~1/4）。负荷量法24小时内投给（首剂1/2，余分2次隔6~12h）；维持量法6~8天达稳态。有效血浓度：婴儿2~3ng/ml、儿童0.5~2ng/ml。中毒表现与成人不同：以窦缓、窦房阻滞、房室阻滞、交界性心律、室上速伴房室阻滞多见，室性心律失常较少见；急性中毒常有高血钾。中毒治疗：立即停药；补钾（有二度以上AVB者禁用）；阿托品用于窦缓窦房阻滞；苯妥英钠对洋地黄中毒所致心律失常疗效较好；利多卡因用于室性心律失常；高度AVB安装临时起搏器。\n2.利尿剂：第一线药。袢利尿剂（呋塞米）用于急性心衰、肺水肿；噻嗪类（氢氯噻嗪、美托拉松）用于轻中度慢性心衰；保钾利尿剂（螺内酯——兼拮抗醛固酮防心肌纤维化）多合用。\n3.ACEI：为治疗心力衰竭首选药物，不激活RAAS和交感系统、保护衰竭心脏、使肥厚心肌回缩。常用卡托普利、依那普利、贝那普利。副作用：低血压、咳嗽（缓激肽增多）、高血钾。与保钾利尿剂合用易致高钾。\n4.β受体阻滞剂：慢性心衰经强心、利尿、ACEI仍无好转时加用（美托洛尔、卡维地洛），机制为阻断神经内分泌介导的心肌重塑、上调β受体。禁忌：哮喘、心动过缓、二度以上AVB。\n5.急性左心衰（肺水肿）处理：坐位双腿下垂、吸氧（P02>60mmHg）、吗啡镇静（0.1~0.2mg/kg）、呋塞米利尿、硝酸甘油扩血管、地高辛/多巴胺多巴酚丁胺强心，必要时联合硝普钠。\n心源性休克：最常见病因为暴发性心肌炎。分期：代偿期——直立性低血压（坐位立位血压降低>10mmHg）、脉压减小；失代偿期——收缩压<80mmHg、脉压<20mmHg、尿量减少；晚期——昏迷、DIC、多脏器衰竭。治疗关键为提高心排血量：谨慎扩容（5~10ml/kg，过多过快致肺水肿）；多巴胺/多巴酚丁胺；血管扩张剂（硝普钠）联合正性肌力药；异丙肾上腺素不推荐（增加心肌耗氧）；暴发性心肌炎可短期大剂量皮质激素（地塞米松0.5~1mg/kg）冲击+大剂量维生素C；心律失常致休克者尽快复律或起搏；心脏压塞者心包引流；机械辅助（ECMO、VAD、IABP）。' },

// 27L 感染性心内膜炎·心肌疾病
{ m: '27L', q: '感染性心内膜炎（IE）的易感因素、病原体、赘生物好发部位、临床表现及诊断标准（2010儿童标准）？', a: '易感因素：>90%伴基础心脏病变，先心病占80%~90%（以VSD、PDA、主动脉瓣狭窄多见，很少见于继发孔ASD）；发绀型先心病或术后有人工瓣膜/管道/补片、残余分流者高危；心导管、介入、静脉置管。VSD/ASD术后超过6个月无残余分流不增加风险。无基础心脏病者占8%~10%（多为金葡菌，见于2岁以下婴儿）。\n病原体：80%以上为链球菌（约50%）和葡萄球菌（约30%），葡萄球菌比例有增加趋势；G-杆菌（大肠埃希菌、铜绿假单胞菌、HACEK族）；真菌（念珠菌、曲霉菌）。人工瓣膜早期以金葡菌常见、晚期以链球菌常见。\n赘生物好发于压力低的一侧：VSD在缺损右缘/三尖瓣隔叶/肺动脉瓣；PDA在肺动脉端；主动脉瓣关闭不全在瓣叶左室侧。\n临床表现四方面：①全身感染症状（发热最常见，38~39℃）；②心脏症状（心功能不全常见、心脏杂音改变）；③栓塞及血管征象（20%~50%，脾大、腹痛、血尿、肺栓塞；Janeway斑——手掌足底无压痛出血点）；④免疫反应征象（指/趾甲下出血、Osler结节、Roth斑——均非特有，小儿少见）。金葡菌型起病急、破坏力强（瓣膜穿孔腱索断裂）。\n诊断：血培养为关键——未用抗生素时阳性率>90%，取血2~3次（间隔至少30分钟）、儿童每次5~7ml、血与培养液比例1:10；用过抗生素使阳性率降低35%~40%。超声赘生物检出率57%~81%（<2mm难发现）。2010儿童IE诊断标准：病理学指标（赘生物/心脏感染组织培养或镜检发现微生物等）+临床主要指标（血培养2次阳性同一常见微生物；心内膜受累超声证据——赘生物、腱索断裂/瓣膜穿孔/补片裂开、心腔内脓肿）+次要指标（易感条件、发热≥38℃伴贫血、杂音改变/心功能不全、血管征象、免疫学征象、微生物学证据）。诊断：主要指标2项，或主要1项+次要3项，或心内膜受累证据+次要2项，或次要5项，或病理学指标1项。\n预防：仅高危病例（曾患IE、人工瓣膜/材料、未治疗发绀型先心病、姑息分流术后、修复术后残余分流）在涉及牙龈/牙根/口腔黏膜破损的牙科操作前预防用药（阿莫西林50mg/kg术前30~60分钟）；不推荐常规用于呼吸道、消化道、泌尿道检查操作。' },
{ m: '27L', q: '感染性心内膜炎的抗生素治疗原则及各病原体方案？手术指征？', a: '治疗原则：选用杀菌型、组织穿透性好的抗生素，静脉给药；联合用药达最大杀菌协同；赘生物内细菌浓度高代谢率低，需足量长程（一般4~6周，真菌≥6周）。\n方案：\n①链球菌（青霉素敏感）：青霉素20万U/(kg·d)分4~6次静注或头孢曲松100mg/(kg·d)，4周；敏感性差者青霉素+庆大霉素3mg/(kg·d)最初2周；青霉素/头孢过敏者万古霉素30~40mg/(kg·d)（日总量<2g）4周。\n②肠球菌：氨苄西林300mg/(kg·d)+庆大霉素，4~6周；过敏者万古霉素+庆大霉素6周。\n③葡萄球菌（多耐青霉素）：苯唑西林200mg/(kg·d)分次每4~6h静注，或头孢唑啉100mg/(kg·d)，6周；青霉素过敏或疗效不佳用万古霉素±庆大霉素；耐万古或不耐受用达托霉素6mg/(kg·d)。\n④G-杆菌：第三代头孢（头孢哌酮、头孢噻肟、头孢曲松）±庆大霉素，至少6周。\n⑤真菌：两性霉素B 1mg/(kg·d)≥6周±5-氟胞嘧啶，常需外科手术祛除赘生物，后改咪唑类长期抑制。\n手术指征（约占25%~30%，应尽早）：①二尖瓣/主动脉瓣损坏重度反流致心衰；②合适抗生素治疗1周以上仍发热、血培养阳性或赘生物增大；③瓣膜穿孔破损、瓣周脓肿或窦道形成；④大型或有脱落风险的赘生物（尤其左心瓣膜）；⑤真菌或耐药病原体。术后继续抗生素与术前相加至少1个完整疗程。预后：顽固性充血性心力衰竭为致死主因。' },

{ m: '27L', q: '病毒性心肌炎的发病机制、临床表现、诊断标准（2018）与治疗？', a: '病因：以肠道病毒（尤其柯萨奇B组病毒）最多见，约占半数以上。发病机制两阶段：病毒感染初期病毒直接侵袭心肌（病毒血症期）；其后严重慢性心肌病变由自身免疫介导（病毒特异性细胞毒T淋巴细胞及自身反应性T淋巴细胞损伤心肌，抗肌凝蛋白重链抗体）。\n临床表现轻重悬殊：典型者心脏症状前1~3周有呼吸道或消化道感染史；心前区不适、心悸、头晕；第一心音低钝、奔马律、心动过速或过缓。暴发型（48小时内）：严重心律失常（三度AVB、室速室颤）或突发心源性休克，数小时至数天死亡。\n诊断（2018版）：主要临床依据：①心功能不全、心源性休克或心脑综合征；②心脏扩大；③cTnI/cTnT或CK-MB升高伴动态变化；④显著心电图改变（以R波为主的2个或以上主要导联ST-T改变持续4天以上伴动态变化；新发现窦房/房室传导阻滞、束支阻滞、窦性停搏、成联律成对多形性期前收缩、非折返性异位心动过速、房扑房颤、室扑室颤、QRS低电压、异常Q波）；⑤CMR典型炎症表现（T2高信号/T1早期增强/T1延迟增强3项中≥2项）。确诊：主要依据≥3条，或主要2条+次要≥3条。心内膜心肌活检为金标准但灵敏度差、阴性不能排除。\n治疗：无特效，综合疗法。休息至少6个月（心脏扩大心衰者卧床3~6个月）；大剂量免疫球蛋白2g/kg单剂24h静滴用于重症；糖皮质激素疗效不肯定（仅用于全身免疫性炎症的心脏表现或重症休克/严重心律失常，甲泼尼龙10mg/kg冲击3天或泼尼松2mg/kg/d）；并发完全性AVB应及时安装临时起搏器（多1周内恢复）；心衰者用米力农、多巴胺/多巴酚丁胺、利尿剂、ACEI；极重者ECMO/VAD过渡。' },
{ m: '27L', q: '扩张型、肥厚型、限制型心肌病及致心律失常性右室心肌病（ARVC）的要点对比？', a: '扩张型心肌病（DCM）：以左室扩大、收缩功能减低为特征，心肌病中最常见（占50%以上）。病因多为病毒感染后心肌炎演变（约30%~40%儿童DCM由心肌炎发展而来）、自身免疫、遗传（家族性14%~20%，常染色体显性）。诊断：左室舒张末内径Z值>2、EF<45%、FS<25%且无异常负荷病因。治疗：ACEI+地高辛+利尿剂，可加卡维地洛；心脏移植为主要终末手段（移植后10年存活率72%）。预后差：5年生存率50%~60%。\n肥厚型心肌病（HCM）：心室肥厚而无扩大，儿童病因谱与成人不同（特发性74%、遗传性代谢缺陷8.7%、畸形综合征9%如Noonan综合征、神经肌肉病7.5%）。肌节蛋白基因突变（MYH7、MYBPC3、TNNT2），MYH7突变表型重猝死率高。病理生理为舒张功能障碍；静息时20%~30%发生左室流出道梗阻（SAM现象）。体征：胸骨左缘下端及心尖部收缩期喷射性杂音，运动后加强、蹲坐位减弱。治疗：β受体阻滞剂首选；禁用洋地黄及利尿剂（加重流出道梗阻）；压差≥50mmHg伴症状者室间隔切除。\n限制型心肌病（RCM）：双室容量正常+双房增大+充盈障碍+收缩功能正常，占小儿心肌病≤5%，预后差（约半数3年内死亡或移植）。须与缩窄性心包炎鉴别（后者可手术治疗；鉴别名表：RCM心尖冲动明显、有第三心音、常有瓣膜反流杂音、左室舒张末压与右室差>5mmHg、心包正常）。\n致心律失常性右室心肌病（ARVC/ARVD）：纤维脂肪组织替代右室心肌（右室发育不良三角：下壁、心尖、漏斗部），是运动猝死常见病因（占20%），常染色体显性（桥粒蛋白基因）。特征：左束支阻滞型单形性室速；心电图Epsilon波（V1~V3 QRS终末低振幅分离波）、右胸导联T波倒置。治疗：避免剧烈运动、β受体阻滞剂/胺碘酮、ICD为预防猝死最主要手段；射频消融复发率高。' },

{ m: '27M', q: '急性心包炎：最重要体征是什么？心前区疼痛的特点？心电图ST-T演变的分期？超声检查的意义和积液量分级？心脏压塞（心包填塞）的征象有哪些？慢性缩窄性心包炎的病因、特殊征象、主要表现及治疗？如何与限制型心肌病鉴别？', a: '急性心包炎：\n①最重要体征——心包摩擦音：胸骨左缘下端最清楚，似摩擦皮革或指尖搔抓音，与心搏一致、与呼吸无关；积液增多将两层心包分开后摩擦音消失（结核性心包炎例外，可持续存在）。\n②疼痛特点：心前区刺痛或钝痛，可放射至左肩/颈部，平卧时加重，坐起、前倾位减轻。\n③心电图ST-T三期演变：早期（起病数小时~数天）ST段弓背向下抬高、PR段压低（aVR的PR段抬高）→ST段逐渐恢复至基线，T波低平→T波倒置，可持续数周至数月；无异常Q波（与心梗鉴别要点）。\n④超声：诊断心包积液最敏感的方法；左室后壁心外膜与心包间出现无回波区；积液<10mm为少量、10~20mm为中量、>20mm为大量。\n⑤心脏压塞征象：颈静脉怒张、心音遥远、奇脉（吸气时收缩压下降>10mmHg）、脉压小、血压下降、心动过速；X线心影呈烧瓶状、卧位与立位心影形态差异小；Ewart征（大量积液时左肩胛骨下角处叩诊浊音、闻及支气管呼吸音）。\n慢性缩窄性心包炎：\n①病因：结核性最常见，其次化脓性；②特殊征象：心包钙化（X线/CT）；③表现：静脉压升高（>250mmH2O）、肝大、腹水、下肢水肿、奇脉、心包叩击音；④治疗：心包切开（剥脱）术。\n与限制型心肌病鉴别：后者心尖冲动明显、可闻第三心音、常有瓣膜反流性杂音，超声见心内膜增厚、心包正常，心导管示左室舒张末压与右室差>5mmHg。' },
{ m: '27M', q: '儿童高血压：继发性高血压的特点及最常见病因？各年龄段高血压的诊断标准（2017年AAP）？高血压危象的治疗原则与首选药物？常用一线降压药？肺高血压的定义、金标准检查及靶向药物三大途径？直立不耐受：血管迷走性晕厥（VVS）的机制、HUT阳性标准、分型与治疗？体位性心动过速综合征（POTS）和直立性低血压的诊断标准？', a: '高血压：\n①继发性高血压是婴儿和儿童高血压的最常见类型，病因以肾脏疾病最常见；2岁以下婴幼儿高血压常见病因是神经母细胞瘤；主动脉缩窄表现为上肢高血压、下肢低血压。\n②2017年AAP标准：≥3次不同日测量，血压≥同年龄同性别同身高第95百分位且<第95百分位+12mmHg为1期，≥第95百分位+12mmHg为2期。简便值：新生儿>90/60mmHg；学龄儿童>120/80mmHg；下肢血压较上肢高10~20mmHg。\n③高血压危象：首选硝普钠或拉贝洛尔，也可用二氮嗪；降压不宜过快——6小时内降计划降压幅度的1/3~1/2，48~72小时接近正常。\n④最常用一线口服药：卡托普利（ACEI类）。\n肺高血压：\n①定义：出生3个月后、海平面、静息状态下平均肺动脉压（mPAP）≥20mmHg；肺动脉高压（PAH）还需肺动脉楔压（PAWP）≤15mmHg且肺血管阻力指数（PVRI）>3WU·m2。②右心导管检查是金标准。③靶向药三大途径：前列环素类（依前列醇等）、一氧化氮途径（PDE5抑制剂西地那非）、内皮素受体拮抗剂（波生坦）；急性血管反应试验（AVT）阳性者可用钙通道阻滞剂。\n直立不耐受：\n①血管迷走性晕厥（VVS）是最常见的儿童晕厥病因，学龄期及青春期女孩多见；机制：长时间站立→回心血量减少+儿茶酚胺增高→心脏过度收缩、左室压力感受器兴奋→异常Bezold-Jarish反射→迷走神经活性增强、血管扩张、心动过缓。\n②HUT（直立倾斜试验）阳性标准：收缩压≤80mmHg或舒张压≤50mmHg，或平均动脉压下降≥25%。\n③分型：血管抑制型（血压下降为主）、心脏抑制型（心率下降为主，可心脏停搏）、混合型。\n④治疗：以非药物为主——避免诱因、物理抗压动作（腿交叉、握拳）、直立训练、口服补液盐增加水盐摄入；药物可用米多君、美托洛尔；仅心脏停搏>4秒者考虑起搏器。\n⑤POTS：直立后10分钟内心率增加≥40次/min（或≤13岁者最大心率≥130次/min、13岁以上≥125次/min），伴直立后症状，但不伴血压下降。\n⑥直立性低血压：直立3分钟内收缩压下降≥20mmHg和/或舒张压下降≥10mmHg。' },
];
