  // ===== 模块 24A 概述·免疫·诊断·防治 =====
  { m: '24A', q: '寄生虫感染与寄生虫病的概念及流行三环节？', a: '寄生虫感染：寄生虫进入宿主体内定居、生存繁殖，宿主无明显临床表现（无症状感染者称带虫者）；寄生虫病：寄生虫导致宿主发病；从感染到临床症状出现称潜伏期；\n流行三环节：\n① 传染源——患者、带虫者及保虫宿主（如血吸虫成虫寄生于人和牛，牛为保虫宿主）；\n② 传播途径——经口感染（最常见，包括食源性和土源性）、经皮肤感染、经媒介昆虫感染（虫媒病，如疟疾、丝虫病）、接触感染，其他如经胎盘（弓形虫）、输血（疟原虫）、自体感染（猪囊尾蚴、微小膜壳绦虫）；\n③ 易感人群——缺乏先天免疫和获得性免疫者；\n从宿主受感染到宿主具有传染性的阶段称隐性期；无临床表现且常规方法查不到病原体称隐性感染。' },
  { m: '24A', q: '寄生虫感染的免疫反应特点（IgE 与嗜酸性粒细胞、四型超敏反应）？', a: '特点：IgE 抗体水平升高及嗜酸性粒细胞增多是蠕虫感染的重要免疫反应特点；经皮肤黏膜进入的活虫更能有效诱导 IgE；寄生虫感染后多呈带虫免疫（虫体消失后免疫力随之下降）；\n免疫病理四型超敏反应：\nⅠ型（速发型）——IgE 介导肥大细胞脱颗粒，如细粒棘球囊液所致休克、蠕虫感染荨麻疹；\nⅡ型（细胞毒型）——抗体结合感染细胞激活补体，如疟疾患者贫血；\nⅢ型（免疫复合物型）——循环抗原抗体复合物沉积血管壁，如疟疾、血吸虫感染所致肾病；\nⅣ型（迟发型）——T 细胞和巨噬细胞介导，如血吸虫卵肉芽肿。' },
  { m: '24A', q: '寄生虫病的实验诊断方法？', a: '① 病原学检查：检出病原体是确诊依据；肉眼可见的蠕虫和节肢动物根据形态初诊，小型原虫需显微镜检查；\n② 免疫学检查：适用于早期、轻度、单性、隐性感染及病原检查困难者；常用沉淀反应、凝集反应和标记反应；检测特异性抗体、循环抗原、免疫复合物；嗜酸性粒细胞计数和嗜碱性粒细胞脱颗粒试验可作蠕虫感染辅助诊断；理想方法应能判别现症感染、估计感染度和考核疗效；\n③ 分子诊断：PCR-ELISA 常用于疟原虫检测，最低可测阈值 0.001% 的原虫密度；基因芯片可同时检测众多靶分子；理论上检测特异性 DNA 片段与检出虫体具同样诊断价值。' },
  { m: '24A', q: '寄生虫病的防治原则？', a: '控制流行的三个基本环节：\n① 控制和消灭传染源——发现患者或带虫者及时群体及个体治疗（集体治疗从流行病学上大大控制消灭传染源）；保虫宿主检查和治疗；加强流动人口监测；\n② 切断传播途径——加强粪便和水源管理、改善环境、杀灭传播媒介；\n③ 保护易感人群——健康教育和健康促进、改变不良卫生饮食习惯；必要时定期预防服药；\n我国采取综合防治策略，将三者有机结合，适时采取群体化学药物防治。' },
  { m: '24A', q: '抗寄生虫药物的分类及代表药（按虫种）？', a: '① 抗疟药：氯喹、青蒿素及衍生物（双氢青蒿素、蒿甲醚、青蒿琥酯）、奎宁、甲氟喹、哌喹、咯萘啶、阿托伐醌、本芴醇、伯氨喹（杀灭间日疟休眠子、根治防复发，G-6-PD 缺乏者禁用）；\n② 抗阿米巴药：甲硝唑（组织内首选）、替硝唑、二氯尼特（肠腔内最有效杀包囊药）、双碘喹啉；儿童禁用依米丁；\n③ 抗利什曼病药：葡萄糖酸锑钠（五价锑首选）、喷他脒、米替福新、两性霉素 B；\n④ 抗线虫药：阿苯达唑（广谱首选）、甲苯达唑、噻嘧啶、左旋咪唑、伊维菌素、三苯双脒、乙胺嗪（丝虫）；\n⑤ 抗吸虫药：吡喹酮（广谱首选）、三氯苯达唑（肝片吸虫、并殖吸虫）；\n⑥ 抗绦虫药：吡喹酮、氯硝柳胺。' },

  // ===== 模块 24B 疟疾 =====
  { m: '24B', q: '疟疾的病原学与生活史要点？', a: '5 种疟原虫：恶性疟原虫（病情最重）、间日疟原虫（我国最常见）、三日疟原虫、卵形疟原虫、诺氏疟原虫；\n生活史：2 个宿主——人是中间宿主，按蚊是终宿主兼传播媒介；人体内发育分两期：红细胞外期（肝期，子孢子入肝细胞发育为红外期裂殖体）和红细胞内期（裂殖子侵入红细胞，经环状体、滋养体发育为裂殖体，红细胞破裂再侵入新红细胞）；部分发育为配子体进入蚊体进行有性生殖；\n间日疟原虫子孢子分速发型与迟发型，后者在肝细胞内先不发育称休眠子（hypnozoite），经静止期后被激活——这是间日疟潜伏期长短不一及复发的原因（长潜伏期株可达 625 天）；\n疟原虫在蚊体内发育的最低温度：间日疟原虫 14.5~15℃，恶性疟原虫 19℃。' },
  { m: '24B', q: '疟疾的潜伏期、发作周期与临床表现分期？', a: '潜伏期：间日疟 12~20 天、三日疟 18~40 天、恶性疟 8~15 天、卵形疟 11~16 天；\n发作分四期：\n① 前驱期：疲乏、腰背肌肉酸痛、头痛、食欲缺乏；\n② 发冷期：寒战，持续数分钟至 1 小时；\n③ 发热期：体温迅速上升可达 40℃ 以上，持续 2~4 小时（一般 3~6 小时，恶性疟可持续更长）；\n④ 出汗期：大汗淋漓，体温迅速下降；\n两次发作之间为静止期（间歇期）；\n发热周期：间日疟和卵形疟每隔 48 小时、三日疟每隔 72 小时发作一次，恶性疟较不规则（36~48 小时或每日一次）；\n其他：输血引起的恶性疟潜伏期短（输血后 7~10 天发病）且更严重；先天性疟疾指出生 7 天内发病者（发热、惊厥、呕吐）。' },
  { m: '24B', q: '重症疟疾（WHO 标准）的判定要点？', a: '重症疟疾常由恶性疟原虫引起，出现以下任何一项应采取紧急抗疟措施：\n① 虚脱（幼儿为不能进食）；\n② 意识障碍（成人昏迷不能唤醒）；\n③ 深大呼吸和呼吸窘迫（酸中毒性呼吸）；\n④ 多发性抽搐（24 小时发作超过 2 次）；\n⑤ 循环衰竭或休克（收缩压：成人<80mmHg，儿童<50mmHg）；\n⑥ 肺水肿；\n⑦ 异常出血；\n⑧ 黄疸：血清胆红素 ≥3mg/dl；\n⑨ 血红蛋白尿；\n⑩ 严重贫血：儿童血红蛋白<5g/dl、血细胞比容<15%；\n⑪ 低血糖：<2.2mmol/L；\n⑫ 代谢性酸中毒：血浆碳酸氢盐<15mmol/L；\n⑬ 高乳酸血症：乳酸>5mmol/L；\n⑭ 肾损伤：血肌酐>265μmol/L。' },
  { m: '24B', q: '疟疾的实验室诊断？', a: '① 血液检查：急性期白细胞总数正常、粒细胞轻度增多（白细胞总数增多提示重症风险）；恶性疟常见血小板减少；厚薄血涂片法找到疟原虫可确诊并鉴别虫种（恶性疟血涂片见到滋养体或裂殖体提示感染严重，必须积极治疗）；\n② 快速诊断试剂（RDTs）：检测 HRP2（恶性疟原虫富组氨酸蛋白2，免疫金标层析，阳性率 84.2%~93.9%、特异性 96%~97%，缺点：治疗后数周仍阳性）或乳酸脱氢酶 LDH（仅活虫产生，治疗后 2~4 天转阴，可区分恶性疟与其他疟疾）；适合现场、疾控、基层；\n③ PCR：敏感特异，可扩增鉴别虫种，后期易受污染假阳性；\n鉴别诊断：上呼吸道感染、伤寒（全身症状重、相对缓脉、白细胞减少）。' },
  { m: '24B', q: '疟疾的治疗与预防？', a: '治疗原则：WHO 推荐青蒿素为基础的联合疗法（ACT）；青蒿素单方治疗不能少于 7 天，或单方加联合疗法总时间不能少于 7 天；\n① 氯喹敏感疟疾：氯喹总剂量 25mg/kg 基质 3 天疗法（第 1、2 天各 10mg/kg，第 3 天 5mg/kg）；\n② 耐氯喹恶性疟：青蒿素合剂，如复方双氢青蒿素片（双氢青蒿素+哌喹）；\n③ 间日疟：加服伯氨喹根治（杀灭休眠子），儿童 250μg/kg（最高 15mg）每日 1 次共 14 天——G-6-PD 缺乏者禁用（易急性溶血）；\n④ 重症疟疾：立即用青蒿素制剂静注，青蒿琥酯 1.2mg/kg，第 1 天首剂加倍（6 小时后再注射 1 次），不可静脉推注；好转后改口服完成疗程；咯萘啶注意心脏抑制严禁静推；无注射条件可用青蒿素栓剂直肠给药应急；\n辅助：黑尿热时静滴 5% 碳酸氢钠保护肾脏；贫血明显输血；\n预防：防蚊叮咬（菊酯浸泡蚊帐）、灭蚊、清除孳生地；哌喹可作预防药。' },

  // ===== 模块 24C 利什曼病·巴贝虫病 =====
  { m: '24C', q: '内脏利什曼病（黑热病）的要点？', a: '病原：杜氏利什曼原虫；两期——人体内无鞭毛体（利杜体，寄生单核巨噬细胞系统）、白蛉体内前鞭毛体；传播媒介白蛉（我国中华白蛉，新疆长管白蛉），犬为山区贮存宿主；\n表现：潜伏期 3~3.5 个月（可数周至数年）；长期不规则发热，典型双峰热型；肝脾大（脾大为主）；全血细胞减少、血沉增快、球蛋白水试验阳性；早期临床类型：结核型、伤寒型、波浪热型、疟疾型、双峰热型、呼吸道感染型、胃肠型（常见于儿童）；\n诊断：骨髓穿刺涂片找到无鞭毛体可确诊；rK39 免疫层析试条（阳性率 75.4%~99.6%）；DAT、IFAT、ELISA；\n治疗：五价锑首选——葡萄糖酸锑钠总量 120~150mg/kg 分 6 天静注（疗效 95%），心电图 QT 间期延长应暂停；锑无效或过敏用喷他脒 4mg/（kg·d）总 0.7~1.4g 分 10~15 次（静注需缓慢，可致血压下降、低血糖、糖尿病）；米替福新口服疗效优于肌注锑剂。' },
  { m: '24C', q: '皮肤利什曼病的要点？', a: '分型：\n① 人源型（城市型）：热带利什曼原虫，潜伏期 2~8 个月，面部及四肢暴露部位无痛性溃疡，约 1 年自愈留瘢痕，媒介静食白蛉；\n② 动物源型（乡村型）：硕大利什曼原虫，潜伏期不到 4 个月，无痛性结节 1~2 周破溃成溃疡，2~6 个月自愈留永久性瘢痕；\n③ 我国新疆克拉玛依发现的皮肤利什曼病：病原体为婴儿利什曼原虫，媒介吴氏白蛉，面部四肢淡红色丘疹→脓肿→溃疡→瘢痕；\n诊断：皮损或溃疡边缘吸取组织涂片找利什曼原虫；\n治疗：葡萄糖酸锑钠局部用药效果较好；无溃疡皮损可液氮冷冻；米替福新有效；\n预防：发现治疗患者、处理流行区病犬、个体防护、蚊帐、室内喷洒杀虫剂。' },
  { m: '24C', q: '巴贝虫病的要点？', a: '病原：巴贝虫寄生于红细胞（田鼠巴贝虫、牛巴贝虫、犬巴贝虫），蜱媒传播（终宿主），也可经输血、器官移植、胎盘传播；\n表现：潜伏期 1~4 周；免疫功能正常者自限性（疲劳、发热、肌痛、关节痛）；重症者寒战高热、肝脾大、黑尿、溶血性贫血、黄疸、肾衰竭；脾切除者、老年人、艾滋病者凶险；血清转氨酶、未结合胆红素、LDH 升高；\n诊断：厚、薄血膜吉姆萨或瑞氏染色镜检找虫体——红细胞内四分体（马耳他十字架形态）可确诊；血涂片虫体持续 3~12 周，阴性不能排除；与疟原虫形态相似易误诊；PCR 适用于早期或低虫荷感染；\n治疗：克林霉素 + 奎宁联合（儿童奎宁 10mg/kg 每天 3 次加克林霉素 7~14mg/kg 每天 3 次）；重症可联合阿托伐醌+阿奇霉素（副作用较小）；\n预防：防蜱叮咬、清除孳生地、灭鼠。' },

  // ===== 模块 24D 弓形虫病 =====
  { m: '24D', q: '弓形虫病的病原学与流行病学？', a: '病原：刚地弓形虫，寄生于宿主有核细胞内；5 种形态：滋养体、包囊、裂殖体、配子体、卵囊——滋养体（香蕉形/半月形，长 4~7μm）、包囊、卵囊与传播致病有关；滋养体集合于宿主细胞内称假包囊，其内滋养体又称速殖子；\n宿主：人和多种动物是中间宿主（体内仅有滋养体、假包囊、包囊，内二芽殖法繁殖）；猫科动物是终宿主兼中间宿主（猫小肠内行裂殖体增殖及配子生殖，形成感染性卵囊随粪便排出，猫日排卵囊量可达 1000 万个）；\n传播：先天性（胎盘垂直传播）+ 获得性（食入半生含包囊的肉蛋奶制品、猫粪卵囊污染食物饮水、接触猫、输血器官移植、节肢动物携带）；\n易感：胎儿、婴幼儿比成人易感；喜食生肉者感染率高（广东嗜食与不嗜食生肉者阳性率 23.8% vs 6.0%）；牧民、兽医、屠宰工人高危；\n速殖子是主要致病阶段；免疫建立后形成包囊呈无症状带虫状态，免疫下降时包囊破裂转为急性播散。' },
  { m: '24D', q: '先天性弓形虫病的特点？', a: '孕期母体感染经胎盘使胎儿感染；\n母婴传播率与孕周：孕前 1.2%、停经后 6~12 周 4.9%、17~20 周 17.3%、21~35 周 28.9%——孕周越大传播率越高；但感染时间越早胎儿病损越重（孕期 13、26、36 周首次感染者胎儿症状发生率分别为 61%、25%、9%）；\n妊娠早期感染：流产、早产、死产、脑钙化及畸形（无脑儿、脑积水、小脑畸形、小眼畸形、脊柱裂）；\n妊娠中晚期感染：多为隐性感染，部分婴儿出生时正常，生后数月至数年出现智力障碍、精神运动障碍、白内障、视网膜脉络膜炎；\n四大征象：视网膜脉络膜炎、脑积水、脑钙化、精神运动障碍；10% 感染婴儿出现严重症状（新生儿期发热、皮疹、黄疸、肝脾大、贫血、心肌炎、癫痫，融合性肺炎是常见死亡原因）；\n预后：病死率较高，存活者多遗留神经智力和视觉障碍。' },
  { m: '24D', q: '获得性弓形虫病及诊断、治疗？', a: '表现：多数隐性感染；① 淋巴结炎、淋巴结肿大最常见（颈部、腹股沟浅表淋巴结）；② 弓形虫性眼病（复发性、局限性、坏死性视网膜脉络膜炎，最特征）；③ 弓形虫性脑病（国内报道脑型占 26.79%）；④ 全身重症型：高热、头痛、肌痛、癫痫、多器官损害，病死率高；6%~10% 艾滋病患者并发弓形虫病（以脑弓形虫病最常见）；\n诊断：\n① IgM 可检出 1 周至数年的感染，不能作为急性感染指标；IgA 比 IgM 出现更早，可作急性感染诊断指标；IgE 出现时间短，提示正在感染；IgG 仅提示感染过；\n② 循环抗原 TgcAg 出现更早，可作早期诊断和疗效观察；\n③ PCR 检测 B1 基因、P30 基因，对妊娠妇女判断是否母婴传播有重要价值；\n治疗：\n① 磺胺嘧啶 + 乙胺嘧啶联用（经典方案）：磺胺嘧啶 50~75mg/（kg·d）分 4 次（同服等量碳酸氢钠），乙胺嘧啶 1mg/（kg·d）（2~4 天后减半，每天最大 25mg），疗程 2~4 周，同时给叶酸，监测血象；\n② 阿奇霉素 5mg/（kg·d）首剂加倍，10 天一疗程；\n③ 螺旋霉素：适合孕妇（成人 2~4g/d 分 4 次，儿童 50~100mg/（kg·d））；\n④ 甲硝唑 + 乙胺嘧啶：治疗儿童有效率 97.9%，与经典方案疗效相同而副作用明显低；\n艾滋病者用乙胺嘧啶+磺胺嘧啶迅速好转者占 60%~80%，但停药 50% 以上复发，需全剂量长期维持。' },

  // ===== 模块 24E 阿米巴病 =====
  { m: '24E', q: '阿米巴病的病原学与流行病学？', a: '病原：溶组织内阿米巴（人体大肠内唯一致病阿米巴）；生活史：滋养体期 + 包囊期——小滋养体寄生于肠腔以细菌为食；大滋养体寄生肠壁及器官组织，可吞噬红细胞，具较强致病性；包囊圆球形 10~20μm，4 核包囊为成熟包囊具感染性；\n分类：无症状带囊者（仅粪检查到包囊）与侵袭性阿米巴病（有肠内外临床表现）；分肠阿米巴病和肠外阿米巴病；\n传染源：无症状带囊者是最重要传染源；只排出滋养体的急性肠阿米巴病患者不传播，同时排出滋养体和包囊的慢性患者是传染源；\n传播：粪-口途径，包囊经污染饮水食物进入人体；蝇类、蟑螂携带包囊是重要传播媒介；\n流行：热带亚热带温带较多；秋季发病较多；农村高于城市；成年多于儿童、幼儿患者很少（但有出生 2 天新生儿的报道）；有明显家庭聚集性；\n迪斯帕内阿米巴形态和生活史与溶组织内阿米巴相同，但不致病。' },
  { m: '24E', q: '肠阿米巴病的病理与临床表现？', a: '病理：小滋养体在机体抵抗力下降时侵入肠壁→吞噬红细胞变成大滋养体→大量繁殖→黏膜溶解坏死形成黏膜下脓肿；病变散见于回盲部、升结肠、乙状结肠及直肠；典型肠壁烧瓶状溃疡——边缘清晰锐利、口小底大、内充满明胶状坏死组织；慢性者肠壁增厚形成阿米巴瘤（瘤样肿块向肠腔凸出）；\n普通型：潜伏期 4 天至数月（一般 7~14 天）；起病较缓，腹泻一日数次至数十次，粪便果酱色、带血和黏液、腐败腥臭味；腹痛明显，回盲部压痛最著；里急后重；体温大多正常；\n暴发型：孕产妇、营养不良、糖皮质激素治疗者及儿童多见——起病急骤，恶寒高热，大便一日十数次至数十次甚至失禁，血水样或脓血黏液样奇臭；剧烈腹绞痛；迅速脱水、电解质紊乱；极易肠出血、肠穿孔，可因脓毒血症或 MODS 于 1~2 周内死亡；\n慢性型：腹泻持续或反复发作，腹泻便秘交替；诱因（饮食失常、劳累受凉）下加重伴胶血便。' },
  { m: '24E', q: '肠外阿米巴病（肝脓肿）的要点？', a: '肠外阿米巴病最常见为阿米巴性肝脓肿——肠壁内大滋养体经门静脉系统侵入肝脏；可在肠阿米巴病数月、数年甚至十数年后出现（部分无肠病史）；\n表现：不规则发热、盗汗或突发高热恶寒；热型间歇或弛张（晨低午后升、夜间热退伴盗汗）；持续性肝区钝痛（深呼吸及体位变更时加剧）；脓肿多位于右叶顶部（原发病灶多位于盲肠升结肠，血流多入肝右叶+右叶体积大，约 80% 肝脓肿发生在肝右叶）；刺激膈肌可致右侧反应性胸膜炎（气急、咳嗽、胸痛、肺底浊音、啰音）；肝大压痛叩击痛，浅表脓肿 Ludlow 征阳性（右侧腋中线下部肋间隙最显著压痛点）；\n脓肿内容物含溶解肝细胞、红细胞、脂肪及坏死组织，呈巧克力色；\n超急性型（Rogers 暴发型肝脓肿）：起病急骤，伴暴发性阿米巴结肠炎，可危及生命；\n诊断：临床有发热、右上腹痛、肝大+超声液性平段或 X 线右膈肌抬高，再加以下任一项可确诊：① 肝脓液发现滋养体；② 穿刺抽出巧克力色脓液；③ 血清特异性抗体阳性；④ 脓液查到基因片段；⑤ 抗阿米巴治疗痊愈或显著有效；\n治疗：甲硝唑静滴或口服，肝脓肿直径 3cm 以上者 B 超引导下穿刺排脓（每 3~5 日一次，向脓肿内注射阿米巴药物比单独内科或外科治疗更有效）。' },
  { m: '24E', q: '阿米巴病的诊断与治疗？', a: '诊断：\n① 粪便检查：典型粪便暗红色果酱样腥臭；新鲜脓血便生理盐水涂片找吞噬红细胞的大滋养体可确诊——标本排出后 30 分钟内送检（滋养体失去活动力），禁与消毒剂尿液接触，粪检前不宜服油剂、钡剂、铋剂；成形便查 1~4 核包囊；\n② 仅查到包囊和小滋养体不能区分溶组织内阿米巴与迪斯帕内阿米巴，应报告为溶组织内阿米巴/迪斯帕内阿米巴感染，需证实虫株确属溶组织内阿米巴才能诊断；\n③ 免疫学：ELISA、IHA、IFTA 检测血清抗体（滴度很高）；粪便抗原检测；\n④ 基因检查：DNA 探针、PCR；\n⑤ X 线：肝脓肿见右膈抬高或局限性隆起、肋膈角变清浅、胸腔积液、右下肺不张；\n鉴别：细菌性痢疾、肠结核、血吸虫病、结肠癌、溃疡性结肠炎、急性坏死性出血性肠炎；\n治疗：\n① 甲硝唑首选（兼杀组织内及肠腔虫体，儿童 35~50mg/（kg·d）分 3 次连服 10 天；危重静注首剂 15mg/kg）；服药期间及停药后 3 天内禁酒（双硫仑样反应）；\n② 替硝唑：血药浓度较甲硝唑高 1 倍、半衰期长、副作用小、疗效更好；\n③ 组织内药物治疗后必须用肠腔内杀阿米巴药达根治——二氯尼特（肠腔内最有效杀包囊药）或双碘喹啉；\n④ 儿童禁用依米丁，慎用双碘喹啉；\n⑤ 控制继发细菌感染常规用广谱抗生素。' },

  // ===== 模块 24F 贾第虫病·滴虫病 =====
  { m: '24F', q: '蓝氏贾第鞭毛虫病的要点？', a: '病原：蓝氏贾第鞭毛虫——滋养体纵切为半的倒置梨形，腹面前半部凹陷成吸盘，4 对鞭毛，寄生于十二指肠或上段小肠借吸盘吸附绒毛表面；包囊椭圆形 8~14μm，4 核包囊成熟具感染性，4℃ 可存活 2 个月以上；\n表现：潜伏期 7~14 天（最长 45 天）；急性期暴发性腹泻，粪便水样恶臭、偶见黏液极少带血，上中腹痉挛性疼痛、腹胀、嗳气、臭屁；急性症状持续 5~7 天；慢性者持续或周期性腹泻（黄色泡沫恶臭软便）；重者吸收不良、脂肪泻、衰弱、体重减轻；偶侵犯胆道引起胆囊炎、胆管炎；\n机制：吸盘机械损伤+分泌物化学刺激→肠黏膜微绒毛损伤→维生素 B12、乳糖、脂肪、蛋白质吸收障碍；\n诊断：新鲜水样便查滋养体，软便成形便查包囊（碘液涂片）；包囊排出间断性，隔日一次连续 3 次提高检出率；尼龙线胶囊肠内试验法（十二指肠液查滋养体）；ELISA 查粪便抗原；\n治疗：甲硝唑首选（治愈率 90% 以上；儿童 15~25mg/（kg·d）分 3 次连服 10 天）；替硝唑 3 岁以上单剂 50mg/kg（最大 2g）；呋喃唑酮备选（G-6-PD 缺乏者慎用可致溶血，不足 1 月龄禁用）；\n注意：相当部分感染者无症状排囊（成人约 13%、儿童约 17%）——重要传染源。' },
  { m: '24F', q: '阴道毛滴虫病的要点？', a: '病原：阴道毛滴虫——仅有滋养体（既是繁殖阶段也是感染致病阶段），梨形或椭圆形，4 根前鞭毛 1 根后鞭毛，波动膜；寄生女性阴道（后穹窿多见）、尿道、膀胱，男性尿道、附睾、前列腺；\n流行病学：世界性分布，全球每年发病超过 1.7 亿；女性感染率青春期后渐增高、20~40 岁高峰；以性传播为主，也可经公共浴池浴具、游泳衣裤、坐式厕具间接传播；\n病理：阴道黏膜及宫颈充血、水肿或散在出血点，阴道壁红色小颗粒状“草莓样斑点”；\n表现：白带增多（乳白或灰黄色泡沫状、有异味，合并感染时脓性）；外阴瘙痒烧灼感；累及尿道时尿频尿急尿痛；男性多为无症状带虫，发病时尿痛、夜尿增多、前列腺炎或附睾炎；新生儿经阴道分娩可感染眼结膜及呼吸道；\n诊断：阴道后穹窿分泌物、尿沉淀或前列腺分泌物悬滴薄片镜检；\n治疗：甲硝唑（成人 0.2g 每天 4 次×7 天，儿童 15~25mg/（kg·d）分 3 次×7~10 天）或替硝唑；夫妻/性伴侣双方同时治疗才能根治；\n鉴别：真菌性阴道炎、淋球菌性阴道炎。' },
  { m: '24F', q: '人毛滴虫病的要点？', a: '病原：人毛滴虫——仅有滋养体，梨形或椭圆形，有鞭毛、波动膜，寄生人体结肠（回盲部）；\n传播：粪-口途径，食入被滋养体污染的食物和饮水；世界性分布，环境卫生条件差地区多见，国内儿童感染率最高；\n表现：腹泻每日数次至 10 余次，大便稀糊状伴少量黏液，重者脓血便；腹痛、腹胀、恶心，很少里急后重；重者低热、脱水、营养不良、贫血；\n诊断：粪便检出病原体；\n治疗：甲硝唑首选（儿童 15mg/（kg·d）分 3 次×7 天）；替硝唑半衰期长、单剂或日服一次即可；重者补液、纠正营养不良与贫血；预后一般良好。' },

  // ===== 模块 24G 肺孢子菌病 =====
  { m: '24G', q: '肺孢子菌病的病原学与流行病学？', a: '病原：耶氏肺孢子菌（Pneumocystis jiroveci）——1988 年经核糖体小亚基 rRNA 序列分析证实属真菌（原称卡氏肺孢子虫），更名肺孢子菌；寄生肺泡，整个生活史在同一宿主内完成：滋养体（大滋养体牢固附着 I 型肺泡上皮细胞）→包囊前期→包囊（厚壁球形 5~8μm，内含 8 个子孢子）——包囊是重要确诊依据；\n流行病学：很多正常人呼吸道有定植（可能婴儿期种植）；经飞沫、空气人-人传播；人群普遍易感，正常人多为隐性感染；主要发生于 CD4⁺T 细胞减少者：HIV 感染（70%~80% 艾滋病患者发生 PCP，约 90% PCP 病例 CD4<200/μl）、淋巴瘤、白血病、器官移植、先天性或获得性免疫缺陷、免疫抑制剂使用者；\n发病机制：肺孢子菌黏附 I 型肺泡上皮，免疫功能下降（尤其 CD4⁺T 减少）后逃避巨噬细胞吞噬不断繁殖；肺泡间隔炎细胞浸润增厚、肺泡腔扩大充满泡沫样蜂窝状物质（内含滋养体、包囊、PAS 阳性物质），堵塞肺泡和细支气管→换气功能障碍；可经淋巴血流播散全身（肺外感染）。' },
  { m: '24G', q: '肺孢子菌肺炎（PCP）的临床类型与表现？', a: '分两型：\n① 流行型（婴幼儿型/经典型）：发生于早产儿和体质极度衰弱婴幼儿，目前很少见；起病缓慢，先全身不适、呼吸增快，后干咳，1~4 周后进行性呼吸困难（鼻翼扇动、口周发绀、肋间隙凹陷）；体温正常或低热；症状明显而肺部体征很少（症状体征分离）；可并发纵隔气肿或气胸，常死于呼吸衰竭；病理特点为间质性浆细胞性肺炎；\n② 散发型（儿童-成人型/现代型）：见于免疫低下高危人群；潜伏期（免疫抑制至肺炎发生）16~100 天，多为 40~50 天；AIDS 患者起病缓慢（乏力、食欲下降、体重减轻→干咳、呼吸急促、发热 38~39℃）；长期免疫抑制剂者可急骤起病（突发高热、持续干咳）；体征轻微或缺如；未经治疗病情严重，常于 4~8 日内死亡；\n并发症：气胸、肺大疱、纵隔气肿（严重气胸诱发呼吸衰竭死亡）；免疫功能极度低下者可肺外感染（脉络膜炎、乳突炎、指/趾坏死等）；\n影像：双侧始于肺门的弥漫性网状结节样间质浸润，一般不累及肺尖、肺底和肺外带；典型呈蝶形毛玻璃状/迷雾状阴影；5%~10% X 线不典型或正常；CT 早期斑片、磨玻璃及间质性改变；\n提示线索：免疫受损者发热、干咳、逐渐加重的呼吸困难而肺部体征少，血乳酸脱氢酶升高（常>5000mg/L）必须考虑本病，及时诊断性治疗。' },
  { m: '24G', q: '肺孢子菌病的诊断、治疗与预防？', a: '诊断：痰、支气管肺泡灌洗液或肺活检组织查见包囊（甲苯胺蓝或 GMS 六胺银染色）或 DNA 可确诊；血清学阳性率 50%~90%；需与 CMV、隐球菌、念珠菌、弓形虫等机会性感染鉴别；\n治疗：\n① TMP-SMZ 首选——TMP 15~20mg/（kg·d）+ SMZ 75~100mg/（kg·d）分 4 次口服，疗程 21 天，重症静滴；\n② 替代方案：克林霉素 + 伯氨喹；氨苯砜 + TMP；喷他脒 3~4mg/kg 缓慢静滴（60 分钟以上）；\n③ 中重度患者（PaO₂<70mmHg 或肺泡-动脉氧分压差>35mmHg）早期（72 小时内）加用糖皮质激素（泼尼松 40mg 每天 2 次×5 天→20mg bid×5 天→20mg qd 至疗程结束），改善低氧血症、减少肺纤维化、降低病死率；\n④ 支持：吸氧/辅助呼吸；控制原发病、提高免疫功能（AIDS 用 HAART）；\n预后：未经适当治疗病死率 100%；\n预防（药物预防可显著降低 PCP 发生率）：指征——① CD4⁺T<0.20×10⁹/L；② 未明原因发热（>38℃）持续 2 周以上；③ 口咽部念珠菌病史；④ 既往 PCP 病史；首选 SMZ-TMP 一级预防 1 片/d、二级预防 2 片/d；不耐受者用氨苯砜；CD4 增至 >200/μl 并持续 ≥6 个月可停药。' },

  // ===== 模块 24H 机会致病性肠道原虫 =====
  { m: '24H', q: '隐孢子虫病的要点？', a: '病原：隐孢子虫——卵囊圆形 4~6μm 内含 4 个月牙形子孢子；食入后子孢子侵入小肠上皮细胞纳虫空泡内发育繁殖（裂殖体增殖→雌雄配子→薄厚壁两种卵囊，厚壁卵囊随粪排出即具感染性）；\n流行病学：世界性分布；经粪-口途径；婴幼儿及青少年感染率明显高于成人；托幼机构易暴发流行；是婴幼儿、HIV 感染者中重要机会致病原；\n表现：潜伏期 2~10 天；免疫正常者自限性腹泻（每日 5~10 次水样便，持续 2 周自愈）；重症幼儿喷射性水样腹泻、脱水；免疫异常者（AIDS）持续性霍乱样腹泻——每日可达 3~6L，粪便含大量卵囊，严重脱水、体重锐减，可慢性迁延数月甚至数年，是艾滋病患者并发腹泻死亡原因之一；肠外感染（胆囊炎、胆管炎、胰腺炎、肺炎）；\n诊断：新鲜粪便改良抗酸染色涂片油镜查卵囊——卵囊呈鲜艳玫瑰红色（金胺-酚染色呈乳白-黄绿色荧光，宛若繁星）；卵囊排出间歇性，症状消失后 1~2 周仍可排出，应多次检测；PCR 敏感特异；\n治疗：无确切可靠特效药——硝唑尼特是美国 FDA 批准的唯一用于婴儿隐孢子虫病的药物（0.5~4 岁 100mg、4~11 岁 200mg、≥12 岁 500mg，每 12 小时 1 次×3 天），但对 HIV 阳性者无显著作用；巴龙霉素、阿奇霉素等可减轻症状；国内大蒜素报道治愈率 93.8%；\n预后：免疫正常者多自愈；营养不良婴幼儿及 AIDS 患者病死率高达 52%~68%。' },
  { m: '24H', q: '微孢子虫病的要点？', a: '病原：微孢子虫——专性细胞内寄生、有孢子形成的原虫，成熟孢子具管状极丝（极管）可将细胞质注射入宿主细胞；8 个属 15 种可感染人体，最常见脑炎微孢子虫属和肠微孢子虫属；多见于免疫功能低下者（特别是 AIDS 患者）；经粪-口传播；\n表现：潜伏期 4~7 个月；AIDS 患者感染脑炎微孢子虫属→头痛、喷射性呕吐等高颅压表现；肠上皮细胞微孢子虫（E. bieneusi、E. intestinalis）→小肠慢性腹泻、体重下降（水样便每日 4~8 次）；眼部感染→角膜结膜炎；肉芽肿性肝炎、肾炎、弥散性肌炎等；\n诊断：多无特异症状，确诊最可靠方法是电镜检测病原体；改良三色染色（韦伯氏染色孢子染成红色具折光性，背景绿色）光镜（>1000 倍）也有一定价值；ELISA、PCR；\n治疗：改善免疫功能（HAART）是治疗 AIDS 患者微孢子虫感染的最好方法；阿苯达唑 400mg/d 共 6~8 周（对脑炎微孢子虫属效果较好，对肠上皮微孢子虫 E. bieneusi 效果有限）；烟曲霉素对 E. bieneusi 有较好疗效；美国 HIV 机会性感染指南推荐局部烟曲霉素 + 口服阿苯达唑治疗微孢子虫角膜结膜炎，且应无限期持续治疗（停药易复发）。' },
  { m: '24H', q: '圆孢子虫病与人芽囊原虫病的要点？', a: '圆孢子虫病（环孢子虫病）：\n病原：卡耶塔环孢子虫，专性细胞内寄生原虫；卵囊经口感染，成熟卵囊内含两个孢子囊各含两个子孢子；\n表现：潜伏期 1~11 天（平均 7 天）；腹泻每日 3~5 次水样便可有少量黏液无脓血，病程 4~6 周；免疫受损者严重持久腹泻（可长达 12 周）；\n诊断：新鲜粪便改良抗酸染色（卵囊 8~10μm，注意与隐孢子虫鉴别，极易混淆）；\n治疗：TMP-SMZ 首选（儿童磺胺 18.75~25mg/kg + TMP 3.75~5mg/kg 每 6 小时 1 次，疗程 7~10 天，一般 1~3 天改善）；HIV 感染者治疗后易复发（需更高剂量更长疗程压制性治疗）；备选环丙沙星、硝唑尼特、大蒜素；\n人芽囊原虫病：\n病原：人芽囊原虫，有空泡型（最常见）、颗粒型、阿米巴型、复分裂型和包囊型 5 种形态，寄生回盲部；机会性致病原虫；约 40% 感染者为无症状带虫者；\n表现：自限性腹泻为主，重者可一日 20 余次水样便/黏液便/血便；病程 2 周左右，可迁延至 6 个月甚至 1 年；白血病、HIV 感染者症状严重、迁延不愈；\n诊断：新鲜粪便检出人芽囊原虫最简单可靠（生理盐水及碘液直接涂片、固定染色法）；\n治疗：甲硝唑（儿童 15~25mg/（kg·d）分 3 次×7~10 天，有效率 93.5% 但易复发，可能有抗药性）；TMP-SMZ 也有效；双碘喹啉、硝唑尼特或巴龙霉素可能有效。' },

  // ===== 模块 24I 原发性阿米巴脑膜脑炎·弓首线虫病 =====
  { m: '24I', q: '原发性阿米巴脑膜脑炎的要点？', a: '病原：福氏耐格里阿米巴——自由生活阿米巴，生活在湖塘水、阴沟水、潮湿泥土，以细菌为食；滋养体长椭圆形 22μm×7μm 有奔放伪足，37℃ 蒸馏水中可暂时变为梨形鞭毛体；不利环境成圆形包囊；\n发病机制：经鼻腔侵入——先在鼻黏膜增殖，经筛状板沿嗅神经上升入脑，引起嗅球及脑组织炎症和广泛破坏；主要病理为化脓性脑膜炎和出血坏死性脑炎；\n流行病学：常见于健康儿童和青壮年，好发夏季；湖塘池水游泳或尘土中包囊经鼻腔侵入；\n表现：潜伏期 3~7 天；初期鼻咽卡他（鼻塞、流涕、咽痛、头痛、低热）；继之体温骤升 39~40℃，头痛加剧以额痛最甚，伴喷射性呕吐；嗅神经嗅球炎症→嗅觉、味觉甚至视觉障碍及运动失调；烦躁不安、嗜睡→意识不清、深度昏迷；脑膜刺激征阳性；一般在 4~7 天内死亡；\n实验室：白细胞总数增高以中性粒细胞为主、核左移；脑脊液特点类似急性化脓性细菌性脑膜炎（脓性或血性、白细胞显著增多、蛋白升高、葡萄糖下降），但培养无细菌，可查见福氏耐格里阿米巴（直接涂片观察伪足运动）；\n诊断：病前一周游泳史+突发脑膜脑炎表现；脑脊液查到该虫确诊；1.5% 非营养琼脂铺产气肠杆菌/大肠埃希菌培养、动物接种；无适用免疫诊断技术；\n治疗：两性霉素 B 主要药物（静注自 0.1mg/（kg·d）渐增至 1mg/（kg·d），同时鞘内给药；与利福平联合可提高救治率，连用 2~3 个月），可试用阿奇霉素、氟康唑、伏立康唑、米替福新；预后差，病死率极高。' },
  { m: '24I', q: '弓首线虫病（内脏/眼幼虫移行症）的要点？', a: '病原：犬弓首线虫（主）和猫弓首线虫；人是非适宜宿主，幼虫在体内不能发育为成虫，停留在第二期幼虫阶段；\n流行病学：传染源为感染犬（世界各地犬感染率 6.0%~80%，我国 8.25%~64.44%，幼犬更高）和猫；间接传播为主（经手、食物、饮水食入感染性虫卵），有异食癖儿童可因吃食土壤粪便感染；直接传播少见（虫卵需体外发育才具感染性）；好发于 5 岁以下幼儿，尤其是有异食癖者；\n发病机制：幼虫钻入肠壁随血流/淋巴入各脏器，大多入肝脏，少量入肺、脑、眼——引起肉芽肿性炎症（上皮细胞+大量嗜酸性粒细胞+少量淋巴细胞浆细胞，中央坏死，可见夏科-莱登结晶）；\n表现：常见于 5 岁以下儿童，亚临床经过或自愈；轻-中度发热、食欲缺乏、消瘦、腹泻、咳嗽、哮喘样呼吸困难；肝轻度肿大；侵犯神经系统（癫痫、瘫痪）；眼型：眼内炎、孤立性视网膜炎、脉络膜视网膜炎性肉芽肿（1~2 个视盘直径黄白色类圆形视网膜下实性隆起病灶）——易误诊视网膜母细胞瘤；眼型患者年龄稍大（6~14 岁）；\n实验室：白细胞增多、嗜酸性粒细胞可达 70% 左右；IgM、IgG、IgE 明显增多；ELISA 检测二期幼虫排泄分泌抗原阳性率 78%、特异性 92%；TcES-57 抗原早期诊断且与其他虫体无交叉反应；\n诊断：农村 5 岁以下有异食癖儿童+不明原因嗜酸性粒细胞增多+肝轻度肿大+B 超肝内结节样病变；\n治疗：阿苯达唑 10mg/（kg·d）分 2 次，5~10 天一疗程（能透过血脑屏障，优于甲苯达唑）；早期眼型在激素配合下化疗杀虫，严重者手术；\n预防：健康教育是关键；流行区犬猫调查驱虫。' },

  // ===== 模块 24J 蛔虫病 =====
  { m: '24J', q: '蛔虫病的病原学与流行病学？', a: '病原：似蚓蛔线虫——寄生于人体内的最大线虫，长圆柱形似蚯蚓，唇瓣三片呈“品”字形；雌虫 20~35cm（可长达 49cm）双管型，雄虫 15~31cm 尾端向腹面卷曲；虫卵分受精卵（宽椭圆形，45~75μm×35~50μm，卵壳三层：受精膜、壳质层、蛔苷层）与未受精卵；\n生活史：土源性线虫，不需中间宿主（直接发育型）；外界 21~30℃ 约经 2 周发育为幼虫、再经 1 周第一次蜕皮成为感染期卵；人经口食入感染期卵→小肠孵出幼虫→侵入肠壁静脉经门静脉到肝、经右心入肺（穿破肺毛细血管入肺泡，蜕皮 2 次成为第四期幼虫，约感染后 10 天）→沿支气管气管移行至咽部被吞咽入小肠（第四次蜕皮，约感染后 21~29 天）→发育为成虫；自感染到雌虫产卵约需 60~75 天；成虫寿命一般 1 年左右（长者 4 年以上）；\n流行病学：全球感染超 10 亿；经口吞入感染期卵是儿童主要途径（用人粪施肥、儿童随地大便、饭前便后不洗手、吮指、生吃污染瓜果蔬菜）；蛔虫每天可产卵 24 万个；虫卵抵抗力强（酱油、醋、辣椒、盐不能杀灭；直射阳光或温度超过 40℃ 可杀灭）；年龄分布：3~10 岁组感染率最高，5 岁即可达高峰；感染有家庭聚集性。' },
  { m: '24J', q: '蛔虫病的临床表现（幼虫与成虫所致）？', a: '多数无明显症状（带虫者）；\n幼虫所致：\n① 幼虫移行到肝：虫数多者右上腹痛、肝大压痛、肝功能异常；\n② 幼虫移行到肺：蛔虫性哮喘和蛔虫性肺炎——潜伏期 1~9 天，干咳、哮喘、发热、荨麻疹，肺部干啰音哮鸣音，X 线点状絮状片状游走阴影，痰中可查幼虫；嗜酸性粒细胞增多——称肺蛔虫症即 Löffler 综合征（嗜酸 15%~35%，重者 70% 以上）；短期内吞食大量感染期卵→暴发性蛔虫性哮喘（咳嗽、哮喘、呼吸困难甚至发绀，黏液痰或血痰，2 周内消失）；\n③ 移行到其他器官：脑膜炎、癫痫、视网膜炎等；\n成虫所致：\n① 消化道：脐周一过性腹痛（痛时喜揉按、无压痛肌紧张）、厌食偏食、异嗜癖（喜吃炉渣土块）、恶心、呕吐、轻泻或便秘；大量寄生夺取营养→营养不良、贫血、生长发育迟缓；\n② 神经系统（婴幼儿或严重感染特点）：精神萎靡或兴奋不安、烦躁易怒、易惊、磨牙、惊厥，可有智力低下——虫体毒素（含脂肪、酯、抗凝素、溶血素）刺激神经系统；\n③ 过敏症状：荨麻疹、皮肤瘙痒、血管神经性水肿、结膜炎、嗜酸性粒细胞增多。' },
  { m: '24J', q: '蛔虫病的并发症？', a: '诱因：发热、服驱虫药、麻醉、辛辣食物等使虫体骚动钻孔；\n① 蛔虫性肠梗阻：最常见并发症；10 岁以下儿童多见、2 岁以下发病率最高；回肠下段；脐周或右下腹阵发性绞痛、呕吐（可吐蛔虫）、高调肠鸣音、肠型蠕动波；腹部可摸柔软可变形的虫包块；完全性梗阻过久→肠壁坏死、穿孔、腹膜炎；需与肠套叠鉴别；\n② 胆道蛔虫病：主要侵入胆总管（少入肝胆管、偶入胆囊）；阵发性右上腹剧烈绞痛（剑突偏右，放射腰背右肩胛），痛时哭叫打滚屈体弯腰出冷汗面色苍白，伴恶心呕吐可吐胆汁或蛔虫——腹痛极严重而腹部体征不多（剑突下局限性压痛，无腹肌紧张）；虫体完全进入胆管或胆囊后疼痛反而减轻；合并感染→寒战高热、肌紧张反跳痛；可并发胆道感染、肝炎、肝脓肿、急性胰腺炎；胆结石核心；\n③ 蛔虫性阑尾炎：小儿阑尾根部口径宽、感染率高；突发脐周绞痛转右下腹持续痛+呕吐，右下腹压痛+局部皮肤痛觉过敏；进展迅速最易坏死穿孔形成腹膜炎，可致死——一经确诊即应外科手术；\n④ 蛔虫性肝脓肿：胆道蛔虫并发症（成虫自胆管入肝带入细菌）；\n⑤ 蛔虫性腹膜炎：肠穿孔后虫入腹腔——中毒症状明显、腹痛不明显、压痛不严重、可有揉面感，颇似结核性腹膜炎，但以进行性恶化为突出，常因延误诊治死亡；\n⑥ 蛔虫性脑病（幼儿多见）：头痛、失眠、智力发育障碍、癫痫、脑膜刺激症状、惊厥、昏迷，驱虫治疗后缓解；\n其他：虫经咽部钻入气管窒息、穿破膈肌脓胸肺脓肿、泌尿系统感染（经瘘管钻入）。' },
  { m: '24J', q: '蛔虫病的诊断与治疗？', a: '诊断：\n① 吐虫或排虫史；脐周一过性隐痛+厌食偏食异嗜癖夜磨牙消瘦提示；面部白斑（“虫斑”）并非蛔虫病特有，不能作为诊断依据；\n② 粪便查虫卵确诊（生理盐水直接涂片、加藤法、饱和盐水浮聚法）；阴性不能排除（仅雄虫寄生查不到虫卵）——可行驱虫药物诊断性治疗；\n③ 血嗜酸性粒细胞增高有助诊断；\n④ 疑蛔虫性肺炎：痰中找蛔虫幼虫确诊；\n⑤ 腹部 X 线对肠梗阻/穿孔性腹膜炎有较高诊断价值；胆道造影、内镜、十二指肠胆汁引流查虫卵对胆道蛔虫病有价值；\n治疗：\n① 驱虫：阿苯达唑 2 岁以上 400mg 一次顿服（治愈率 96%，10 天后可重复）；甲苯达唑 200mg 顿服或 100mg bid×3 天（虫卵阴转率 90%~100%，不需禁食和服泻药）；噻嘧啶基质 5~10mg/kg 睡前顿服；枸橼酸哌嗪 150mg/（kg·d）（最大 3g）分 2 次×2 天（毒性小，但肠梗阻时不宜使用，与噻嘧啶相互拮抗不能同用）；左旋咪唑现少用（神经毒性）；\n② 肺蛔虫症对症为主（氨茶碱、麻黄碱解痉、镇咳）；\n③ 并发症：胆道蛔虫——镇痛解痉驱虫（乌梅丸、维生素 K 肌注松弛平滑肌、食醋、哌替啶+阿托品），内科无效者手术（腹痛剧烈频繁发作、局部压痛高热黄疸全身中毒症状、5~7 天内科无效且虫嵌顿）；不完全性肠梗阻先内科（胃肠减压、低压饱和盐水灌肠），完全性肠梗阻手术；蛔虫性阑尾炎或腹膜炎及早手术。' },

  // ===== 模块 24K 蛲虫病·钩虫病·鞭虫病 =====
  { m: '24K', q: '蛲虫病的要点？', a: '病原：蠕形住肠线虫（蛲虫）——细小乳白色线头状；雌虫 8~13mm；虫卵不对称椭圆形（一侧扁平一侧凸起）50~60μm×20~30μm，无色透明；寄生于小肠末端、盲肠和结肠；\n生活史关键：雌虫夜间宿主熟睡后移行至肛门外产卵；虫卵在肛周潮湿温暖环境经 6 小时即发育为感染期卵；感染期卵经口食入→小肠孵出→移行至盲肠发育为成虫；从食入虫卵至成虫排卵约需 2~4 周；成虫寿命约 1 个月；感染期卵在自然环境中保持感染性 10~14 天；\n表现：夜间肛门及会阴部瘙痒（最特征，影响睡眠、夜惊哭闹）；烦躁焦虑、注意力不集中、好咬指甲、遗尿、心理行为偏异；局部搔破→皮炎；可钻入阑尾（急慢性阑尾炎甚至穿孔）、女性尿道（尿频尿急尿痛）、阴道输卵管（阴唇炎、阴道炎、输卵管炎）甚至腹腔；\n诊断：粪检阳性率仅 5% 左右（虫不在肠内产卵）——透明胶纸法或棉签拭子法查肛周虫卵（清晨排便前或夜间粘取，5 次检出率 99%）；熟睡后 2~3 小时肛周查见乳白色线头样小虫可确诊；\n治疗：甲苯达唑 100mg 顿服（治愈率 90%~100%）；阿苯达唑 200mg 顿服（治愈率 100%）；易再感染复发——服药 2~4 周后重复一次；家庭成员与患者同时用药；局部：温水洗肛门后涂 2% 氧化氨基汞软膏或 10% 氧化锌软膏；\n预防：饭前便后洗手、勤剪指甲、穿满裆裤睡觉、玩具用具消毒、湿式打扫避免扬尘；患者与家庭/集体机构成员同时治疗。' },
  { m: '24K', q: '钩虫病的要点（病原·流行·表现）？', a: '病原：十二指肠钩口线虫 + 美洲板口线虫；成虫长约 1cm 淡红色半透明，口囊发达（内切板或钩齿）咬附肠黏膜；丝状蚴经皮肤钻入（十二指肠钩虫还可经口和乳汁感染）；移行：皮下→淋巴血管→右心→肺（穿破肺毛细血管）→支气管→吞咽入小肠发育为成虫；十二指肠钩虫从侵入到产卵约 35 天，美洲钩虫约 60 天；\n流行病学：全球分布；我国长江以南流行最严重（以美洲钩虫为主，混合感染），北方较轻（十二指肠钩虫为主）；全国钩虫感染约 1697 万（感染率 2.62%），10 岁以下儿童约 94 万；\n表现：\n① 幼虫：钩性皮炎（“着土痒”——手指足趾间、足背、脚踝，烧灼针刺感→充血斑点丘疹奇痒→小水疱）；呼吸道症状（感染后 3~7 天咽部发痒、咳嗽；大量幼虫→剧烈干咳、哮喘、畏寒发热痰中带血）；\n② 成虫：消化道症状（初期上腹隐痛似胃溃疡、食欲亢进、异嗜症嗜食生米生豆泥土炉灰；后期食欲缺乏、消化道出血柏油便）；贫血（最重要表现——慢性失血机制：钩虫吸血时分泌抗凝素致叮咬处渗血+喜更换咬附部位→小细胞低色素性贫血；重者贫血性心脏病、心功能不全）；\n③ 婴幼儿钩虫病：多由十二指肠钩虫引起（经胎盘或乳汁）；急性出血性腹泻（黑色柏油样大便）、面色苍白、发热、心尖区收缩期杂音、肝脾大、生长发育迟缓——预后差；\n血象：红细胞小细胞低色素贫血；嗜酸性粒细胞感染早期显著增高，随病程延长和加重反而下降。' },
  { m: '24K', q: '钩虫病的诊断与治疗？', a: '诊断：\n① 粪便检查：隐血常阳性；饱和盐水浮聚法检出率较直接涂片高 5~6 倍；改良加藤法定量——每克粪便虫卵数（EPG）：≤3000 轻度、3000~10000 中度、≥10000 重度感染；钩培养法（滤纸条试管法 20~30℃ 3~5 天）鉴别虫种；\n② 胃镜/胶囊内镜：十二指肠降部见钩虫附着；\n鉴别：缺铁性贫血、溃疡病痔疮等慢性失血性贫血；\n治疗：\n① 一般：钩性皮炎用左旋咪唑涂肤剂或 15% 噻苯达唑软膏（每天 3 次×2 天可杀死停留皮肤的部分钩蚴）；贫血者补铁（儿童复方枸橼酸铁铵糖浆 1~2ml/（kg·d）分 3 次）、维生素 C 和叶酸；重度贫血（Hb<30g/L）小量多次输血；\n② 驱虫：阿苯达唑（成人 400mg 一次；儿童减半）；甲苯达唑 100~200mg 一日 2 次×3 天（孕妇、哺乳期及 2 岁以下小儿禁用）；噻嘧啶 10mg/kg 睡前顿服×2 天（美洲钩虫需 3~4 日）；左旋咪唑；三苯双脒儿童 200mg 顿服；混合感染地区常需联合用药（复方甲苯达唑：甲苯达唑+盐酸左旋咪唑）；\n预后：良好——即使中重度感染伴贫血性心脏病或合并妊娠，及时补充营养、纠正贫血及驱虫仍有良好预后；\n预防：粪便管理、查治患者（群体化疗 WHO 推荐阿苯达唑和甲苯达唑）、避免赤脚下田。' },
  { m: '24K', q: '鞭虫病的要点？', a: '病原：毛首鞭形线虫——虫体前部细长后部粗大形似马鞭；雄虫 30~40mm 尾部卷曲，雌虫 35~50mm；虫卵橄榄形 50~54μm×22~23μm 黄褐色，卵壳厚，两端各具一个透明塞状突起；寄生于盲肠（亦可结肠、直肠、回肠下段）；\n生活史：虫卵随粪便排出，泥土中 3~5 周发育为感染期卵；经口感染→小肠孵出→钻入肠黏膜发育约 10 天→回盲肠发育为成虫；从食入感染期卵至成虫成熟排卵约需 2 个月；成虫寿命约 3 年；土源性传播；\n流行：与蛔虫分布一致；温暖潮湿热带地区感染率高；全国加权感染率 1.02%；\n机制与表现：虫体机械损伤和分泌物刺激→肠黏膜水肿充血、溃疡、慢性炎症；轻度感染无症状或轻微胃肠症状；重者全身症状（贫血、消瘦、营养不良、下肢水肿；儿童发育迟缓、杵状指、指/趾端肿大）；重度累及直肠可致直肠套叠甚至脱垂；部分患者嗜酸性粒细胞增多、荨麻疹、头痛头昏发热；\n诊断：粪便检获虫卵确诊（连续送检 3 次提高检出率）；\n治疗：阿苯达唑或甲苯达唑（甲苯达唑治疗鞭虫病优于阿苯达唑；成人及 2 岁以上儿童每次 100mg 一日 2 次×3 天，可间隔 3 周再服一疗程巩固）；\n预防：饭前便后洗手、粪便管理、改水改厕。' },

  // ===== 模块 24L 旋毛虫病·丝虫病·广州管圆线虫病 =====
  { m: '24L', q: '旋毛虫病的要点？', a: '病原：旋毛形线虫——雌雄异体，成虫寄生于人及哺乳动物小肠，幼虫寄生于宿主肌肉内形成囊包；基因分类 9 个种，我国有两种：河南猪源株（旋毛形线虫）和黑龙江犬源株（北方旋毛虫）；\n流行病学：传染源主要是猪（犬、猫也可感染）；人因吃食未熟含旋毛虫囊包的猪肉感染（也有生羊肉、马肉、野猪肉、甲鱼肉感染报告）；地方性、群体性流行；我国西藏、云南、广西、广东、四川有病例或集体发病报告；\n发病机制：幼虫侵入小肠黏膜→肠黏膜损伤充血水肿出血溃疡；感染后 5~7 天成虫成熟产幼虫，幼虫随血流至全身组织，只有肌肉内可存活形成囊包（5~7 周发育为感染性囊包；幼虫在囊包内可存活多年，最长达 31 年）；横纹肌（颌肌、舌肌、喉肌、膈肌、颈肌、肋间肌）受累→肌纤维水肿、横纹消失、嗜酸性粒细胞浸润→高热、全身肌肉疼痛；心肌炎是最严重表现（感染后 3 周发生，常于感染后第 4~8 周因心肌炎死亡）；\n临床三期：潜伏期 12 小时~46 天（平均 9~12 天，以 2 周左右常见）；\n① 肠道侵入期（约 1 周）：腹痛恶心呕吐腹泻；\n② 幼虫移行期（四大临床症状）：发热、眼睑水肿、肌肉疼痛、嗜酸性粒细胞增多症；弛张热 38~40℃；肌肉疼痛突出致强迫性屈曲，咀嚼吞咽困难、眼睑颜面水肿；心肌炎、化脓性脑炎脑膜炎颅内高压；\n③ 囊包形成期：发热消退，可有肌痛、毒血症、消瘦水肿脱水；\n诊断：食生或未熟肉类史+发热+肌痛+眼睑水肿+嗜酸性粒细胞增多；ELISA/IFA 检出率 90%；腓肠肌活检找囊包（检出率不高）；\n治疗：阿苯达唑 25mg/（kg·d）分 2~3 次，5~10 天一疗程；辅助输液退热；\n预防：加强健康教育改变不良饮食习惯（不食生肉）、肉类卫生检疫。' },
  { m: '24L', q: '丝虫病（淋巴丝虫病）的要点？', a: '病原：我国仅班氏吴策线虫和马来布鲁线虫（帝汶丝虫仅东帝汶）；马来丝虫寄生下肢浅表淋巴系统，班氏丝虫寄生深部淋巴系统（腹腔、盆腔、腹膜后、精索睾丸）；\n生活史关键：微丝蚴夜现周期性——白天隐伏肺部毛细血管，晚间出现在末梢血液，以晚 11 时至次晨 2 时达高峰；蚊媒：班氏——淡色库蚊、致倦库蚊；马来——中华按蚊、嗜人按蚊；蚊体内发育为感染期幼虫（班氏 10~14 天、马来 6~7 天）；\n发病机制：成虫代谢产物、幼虫蜕皮液、死虫分解产物刺激→淋巴管及淋巴结炎症、扩张、管壁增厚阻塞；淋巴液滞留→含蛋白淋巴液入周围组织→硬实淋巴水肿→结缔组织增生→象皮肿；阻塞于主动脉前淋巴结/肠干淋巴管→乳糜液逆流→乳糜尿；\n表现：潜伏期一般半年；局部淋巴结炎→特征性逆行性淋巴管炎（“流火”——感染淋巴管呈红线、条索感触痛，周期性发作）；班氏——精索炎、附睾炎、睾丸炎（发作后鞘膜积液）、阴囊肿胀；马来——肢体象皮肿；晚期班氏——乳糜尿；\n诊断：流行区+下肢逆行性淋巴管炎或阴囊肿大；晚间末梢血找微丝蚴；免疫层析法 ICT 检测班氏丝虫抗原（阳性率 90%~98%、特异性 99%~100%）；超声“丝虫舞蹈征”（FDS，阴囊区淋巴管内活虫图形，阳性率 88%，可考核疗效）；\n我国 2007 年被 WHO 确认消灭丝虫病（2008 年宣布消除，全球第一个）；\n治疗：乙胺嗪首选——马来丝虫患儿 3~6mg/（kg·d）分 2~3 次×6~12 天，班氏丝虫患儿 6mg/（kg·d）分 3 次×12 天；伊维菌素单剂 100μg/kg 口服可迅速清除班氏微丝蚴（近期疗效优于乙胺嗪，需 2 年复治一次）；呋喃嘧酮（我国研制）疗效与乙胺嗪相似。' },
  { m: '24L', q: '广州管圆线虫病的要点？', a: '病原：广州管圆线虫——幼虫（偶或成虫）侵入人体寄生于中枢神经系统；成虫寄生于鼠类右心及肺动脉；中间宿主：陆生螺类（福寿螺、褐云玛瑙螺最重要，60 余种软体动物）；转续宿主：蛙类、鱼、虾、蟹、猪等；人是非正常宿主；\n感染途径：生吃或半生吃含第三期幼虫的螺类或转续宿主、食入或饮用被污染的生蔬菜或水；\n流行病学：热带亚热带地区；我国台湾（10 岁以下儿童居多）、海南、广东、香港、黑龙江、辽宁有报告；\n发病机制：幼虫主要损害中枢神经系统→嗜酸性粒细胞增多性脑膜炎或脑膜脑炎；脑脊液中嗜酸性粒细胞显著升高为特征；病变为脑组织充血、出血、炎性肉芽肿反应；偶见肺部受累（虫卵幼虫结节阻塞肺小动脉）；\n表现：潜伏期 3~36 天（平均 14 天）；剧烈头痛为最突出主诉（枕部、双颊、眼眶及额部或整个头部，“裂开状”、搏动性）；恶心呕吐（喷射性，腰穿后可改善）；颈强直；感觉异常；可有眼部损害、复视、斜视、眼睑水肿、意识障碍、四肢麻痹；儿童发热 38~39℃ 弛张热或间歇热，热程 6~10 天；病程多有自限性，发病后数日至 1 个月内自行缓解；死亡率 0.21%~4.9%；\n实验室：外周血白细胞明显增多，嗜酸性粒细胞一般超过 10%；脑脊液白细胞增多（190~4350）×10⁶/L 以嗜酸性粒细胞为主，压力增高（>1.96kPa），外观混浊或乳白色，蛋白增加（>0.5g/L）；\n诊断：相关流行病学史+血或脑脊液嗜酸性粒细胞增多+临床症状→可诊断性杀虫治疗；脑脊液查见幼虫或成虫可确诊（检出率低）；血清学和 PCR 辅助；\n治疗：对症支持为主；阿苯达唑 10mg/（kg·d）分 2 次×3 周一疗程（杀虫时注意虫体崩解物可致严重不良反应，可联用抑制炎症反应药物）；头痛剧烈时反复腰穿降低颅内压；\n预防：螺类蛙类鱼虾蟹猪肉必须熟食、不生吃、不喝生水、不用蟾蜍蛙肉敷疮。' },

  // ===== 模块 24M 其他线虫病 =====
  { m: '24M', q: '粪类圆线虫病的要点？', a: '病原：粪类圆线虫——兼性寄生线虫，生活史复杂（自生世代 + 寄生世代）；寄生世代成虫寄生于人、犬、猫；感染期丝状蚴经皮肤侵入人体→血流至肺→咽→肠道，在肠黏膜内发育为成虫；\n关键特点：自体感染——人体抵抗力低下或便秘时，杆状蚴在小肠内直接发育为丝状蚴→钻入肠壁再循环发育（自身内感染），使感染持续多年；\n流行病学：热带亚热带多见；我国除上海、天津、内蒙古、吉林外均有病例（海南、广西、贵州多见）；\n表现：轻者无明显症状；虫体侵入皮肤局部皮疹；移行入肺→支气管炎、肺炎（咳嗽、咯血、呼吸困难、发绀、哮喘，X 线结节状阴影）；侵入肠黏膜→上腹痛、恶心呕吐、长期腹泻、黏液样血便里急后重、吸收不良；重者肠黏膜坏死溃疡、麻痹性肠梗阻甚至穿孔→急性腹膜炎；\n重症：免疫低下者丝状蚴可播散至心、脑、肺、肝、胰、肾、淋巴结、甲状腺等→弥漫性粪类圆线虫病（可致败血症、脑膜炎脑脓肿脑梗死，致死率较高）；可并发肾病综合征（驱虫后消失）；\n诊断：粪便、痰、尿或脑脊液找到杆状蚴或丝状蚴；腹泻患者粪便中可检出虫卵；\n治疗：阿苯达唑首选（每日 2 次每次 0.2g×3 天，2 周后重复一疗程；合并肾病综合征者疗程延长至 5 天）；伊维菌素有效；\n预防：防止丝状蚴污染的食物饮水经口感染、避免经皮肤感染。' },
  { m: '24M', q: '肝毛细线虫病与毛圆线虫病的要点？', a: '肝毛细线虫病：\n病原：肝毛细线虫——成虫及虫卵寄生肝脏，人因误食感染期虫卵污染的食物或水而感染；\n关键概念：真性感染 vs 假性感染——食入未成熟虫卵只经消化道随粪便排出（粪检查见虫卵但人并未感染，称假性感染 spurious infection）；真性感染者粪便中查不到虫卵；\n表现：发热（高热 >39℃ 为主）、腹痛腹泻咳嗽咳痰；进展期嗜酸性粒细胞显著增多、肝脾大、转氨酶升高、高丙种球蛋白血症、贫血；重者肝纤维化或肝硬化甚至死亡；\n诊断：肝组织活检查虫卵是主要方法；粪检虫卵为假性感染；流行区持续高热+嗜酸增多+贫血+肝大及占位病变应想到；B 超肝低回声占位多位于右后叶；\n治疗：阿苯达唑 20mg/（kg·d）10~20 天一疗程（常需 2~4 疗程）；联合糖皮质激素（泼尼松）减轻炎症、改善肝功能及纤维化；噻嘧啶备选；\n流行病学：全球报告不足 150 例；国内报告不超 30 例；啮齿动物为主要宿主（鼠类感染率高）；\n毛圆线虫病：\n病原：东方毛圆线虫（主要寄生于羊、牛，也可寄生于人）；生食含丝状蚴的蔬果或饮生水感染，也可经皮肤感染；\n表现：类似钩虫病（慢性失血贫血）但腹痛较钩虫病明显；食欲缺乏、腹痛腹泻、四肢乏力，部分患儿贫血、嗜酸性粒细胞增多；\n诊断：粪便查到毛圆线虫卵确诊——该虫排卵极少应反复多次检查，需与钩虫卵鉴别；\n治疗：噻嘧啶、阿苯达唑、甲苯达唑（用药原则同钩虫病）。' },
  { m: '24M', q: '颚口线虫病与异尖线虫病的要点？', a: '颚口线虫病：\n病原：棘颚口线虫（主要）；终宿主狗、猫、猪；第二中间宿主淡水鱼类（鱼、泥鳅、黄鳝）；蛙、蛇、鸡等为转续宿主；人是非适宜宿主，幼虫在人体可活数年；\n感染方式：生食或半生食感染性第三期幼虫的淡水鱼或转续宿主；\n表现：皮肤幼虫移行症和内脏幼虫移行症——受累部位间歇性移行性肿块、局部水肿疼痛；匐行疹或皮下游走性包块；幼虫入脑→嗜酸性粒细胞增多性脊髓炎甚至死亡；生食活泥鳅者全身游走性皮疹；\n诊断：典型匐行疹/游走包块+生食淡水鱼或转续宿主肉类史+免疫学阳性或嗜酸性粒细胞增多；外科手术取虫镜检确诊（病原学检出率低）；\n治疗：尚无特效药——手术摘除幼虫（必须整个虫体完全取出才能根治）；阿苯达唑 400mg 顿服连服 3 周以上、伊维菌素单剂 0.2mg/kg 可联合应用；\n预防：不吃生的或未熟的肉类食品、生熟厨具分开；\n异尖线虫病：\n病原：异尖线虫幼虫——成虫寄生海栖哺乳动物（海豚、鲸），幼虫寄生海鱼或软体动物；主要虫种简单异尖线虫、伪地新线虫；人因吃生或未煮熟带虫海鱼或鱿鱼感染；\n机制：Arthus 型超敏反应为主（虫体分泌嗜酸性粒细胞趋化因子 ECF-P）；病理以黏膜下层大量嗜酸性粒细胞浸润的蜂窝织炎和嗜酸性肉芽肿；\n表现：胃受累最常见（约为肠的 2 倍）；胃型潜伏期 2~20 小时，上腹疼痛绞痛、恶心呕吐反复发作，70% 大便隐血阳性；肠型吃鱼片后 1~5 天剧烈腹痛、腹泻柏油样黏液便，常因肠穿孔、腹膜炎或局限性肠坏死手术时发现幼虫确诊；食管型喉咙发痒恶心咳嗽，可咳出/呕出幼虫；\n诊断：胃镜、结肠镜检查与活检（诊断+治疗起重要作用）；吃生海鱼病史+临床特点可确诊；\n治疗：内镜下取出虫体；有肠穿孔、腹膜炎或肠梗阻等并发症立即手术；抗蠕虫药（甲苯达唑、阿苯达唑、噻苯达唑）效果不佳；\n预防：不生吃或半生吃海鱼和淡水鱼（烹调熟透可杀死幼虫）。' },
  { m: '24M', q: '结膜吸吮线虫病与肾膨结线虫病的要点？', a: '结膜吸吮线虫病：\n病原：结膜吸吮线虫，寄生于犬、猫、兔等动物眼部，人眼偶被寄生；中间宿主和传播媒介：冈田氏绕眼果蝇；\n流行病学：主要流行于东亚及东南亚；我国是人体病例最多的国家（截至 2020 年 647 例）；婴幼儿为易感人群（最小 3 个月）；感染不受年龄性别限制；\n表现：果蝇叮眼后发病——异物感、痒感、刺痛、流泪、畏光、分泌物增多；多侵犯一侧眼，虫体寄生上下眼睑穹窿内；寄生前房时眼压增高、瞳孔散大、视力下降甚至继发性青光眼；重者可致角膜混浊、角膜薄翳、慢性结膜炎；\n诊断：自患处取出成虫或幼虫镜检确诊；眼部刺激症状长达 40 天以上者自眼内眦取分泌物压片镜检初产蚴；婴幼儿用 2% 可卡因或 1% 丁卡因滴眼麻醉结膜和虫体，虫体随药液溢出外露，眼科镊子取出（诊断兼治疗）；盐水冲洗结膜囊收集虫体；\n预防：儿童眼部面部清洁卫生、防蝇灭蝇、不在室外睡觉；\n肾膨结线虫病：\n病原：肾膨结线虫寄生于人体肾脏（人是非适宜宿主，虫体较小损害相对轻）；传染源貂等动物；人因吃生的或半生鱼或蛙肉感染；全球仅 30 多例报告；\n表现：反复血尿（最特征）、尿中排出虫体、腰背酸痛无力、肾绞痛；可致肾盂肾炎及肾盂积水；\n诊断：尿液查见虫体即可确诊；\n治疗：阿苯达唑 20mg/kg 分 3 次服，10 天一疗程共 5 个疗程；\n预防：不生食或半生食鱼或蛙肉、生菜。' },

  // ===== 模块 24N 血吸虫病 =====
  { m: '24N', q: '日本血吸虫病的病原学与流行病学？', a: '病原：日本血吸虫（我国仅有）——雌雄异体，雄虫乳白色背腹扁平（腹吸盘以下体壁卷向腹面形成抱雌沟），雌虫暗褐色线状前细后粗；雌雄常呈合抱状态；成虫寄生于人和其他哺乳动物门脉-肠系膜静脉系统；虫卵平均 89μm×67μm 淡黄色无盖、一侧有短小侧棘；\n生活史：雌虫在静脉末梢产卵→虫卵随血流沉积于肝脏及肠壁组织→沉积肠壁的成熟虫卵在肠黏膜层致嗜酸性脓肿→脓肿向肠腔破溃虫卵随粪便排出→入水孵出毛蚴→侵入钉螺（唯一中间宿主）经母胞蚴子胞蚴发育增殖→尾蚴自螺体逸出浮于水面→接触人畜时 10 秒内钻入皮肤（尾部脱落转变为童虫）→童虫经淋巴管/小静脉→肺动脉→肺静脉→体循环→肠系膜动脉→肠系膜静脉→肝门静脉发育 8~10 天→移行至肠系膜静脉和直肠静脉发育，第 24 天开始排卵，感染后 35 天左右粪便可查见虫卵；成虫平均寿命约 4.5 年；\n流行病学：分布与钉螺分布消长密切相关；我国曾流行于长江流域及以南 12 省，目前主要在安徽、江西、湖北、湖南 4 省；传播三环节：含虫卵粪便污染水体 + 水体存在钉螺 + 人群接触疫水；流行区类型：水网型、湖沼型（4~6 月及 9~10 月两个感染高峰）、山丘型（4~9 月）；传染源：排出成熟虫卵的人和哺乳动物（初感染者和病牛最重要）；5 岁以下儿童感染率低，10 岁以后上升，流行区农民船民渔民感染率高；幼儿免疫功能较成人差，一旦接触疫水较成人易于感染。' },
  { m: '24N', q: '血吸虫病的发病机制与病理（虫卵肉芽肿）？', a: '致病阶段：尾蚴、童虫、成虫及虫卵对人均有致病性，其中虫卵是最重要的致病因子；\n尾蚴：侵入皮肤→尾蚴性皮炎（真皮毛细血管扩张充血出血水肿，瘙痒小丘疹，多见于曾接触尾蚴的致敏者，自限性数小时至 2~3 天消失）；\n童虫：移行致所经器官一过性炎症出血细胞浸润，以肺组织明显；\n成虫：门静脉内膜炎及静脉周围炎；\n虫卵（核心病变）：成熟虫卵内毛蚴分泌可溶性虫卵抗原（SEA），经卵壳微孔释出→致敏辅助性 T 细胞产生淋巴因子→炎症细胞聚集在虫卵周围形成虫卵肉芽肿——急性期易液化出现嗜酸性脓肿；虫卵周围出现浆细胞伴抗原抗体复合物沉着形成 Hoeppli 现象；毛蚴死亡后 SEA 停止释放，肉芽肿缩小代之以纤维化；\n干线型肝硬化：纤维组织沿肝小叶周围伸展形成干线型肝硬化（窦前静脉阻塞→门静脉高压）；\n肠道病变：主要在乙状结肠、直肠、降结肠，肠壁增厚可致肠腔狭窄和梗阻；\n小儿反复感染可影响代谢功能，垂体前叶功能减退、内分泌腺继发性萎缩→生长发育障碍。' },
  { m: '24N', q: '血吸虫病的临床表现与分型？', a: '潜伏期：最短 14 天、最长 84 天、平均 40 天左右；\n急性血吸虫病：多见于无免疫力的初次感染者；夏秋季发病、明确疫水接触史；发热为主要首发症状（低热约占 1/4；弛张热和间歇热占大多数，间歇热多见；稽留热约占 5%）；消化系统：腹泻最常见，重者黏液血便；肝大（剑突下 5cm 内，左叶较右叶明显、质软）、半数患者脾大（质软无压痛）；半数以上咳嗽（干咳少痰）；荨麻疹、消瘦乏力；白细胞（10~30）×10⁹/L（高者超 50×10⁹/L）、嗜酸性粒细胞 15%~50%（偶达 90%）、血沉加速；感染后 1 个月血清抗血吸虫 IgG 阳性率可达 100%；肺部 X 线絮状绒毛斑点阴影（持续 3~6 个月）；\n慢性血吸虫病：隐匿型（无症状型，主要表现为间质性肝炎）和有症状型（间歇性慢性腹泻腹痛或黏液血便；肝大质稍硬、脾轻度大；90% 以上直肠黏膜活检可见虫卵，多为变性卵）；\n晚期血吸虫病：干线型肝纤维化+门静脉高压；巨脾型、腹水型、结肠增殖型（结肠肉芽肿型）、侏儒型四分型；病程后期常出现呕血（食管下段或胃底静脉破裂）、腹水、黄疸，少数并发肝性脑病；患儿可有生长发育障碍；\n异位血吸虫病：门脉系统以外寄生称异位寄生——肺型较常见（童虫移行穿肺→一过性咳嗽；虫卵沉积→干咳偶带血）；脑型（急性期类似脑膜脑炎；慢性期以局限性癫痫多见，伴头痛呕吐暂时性意识丧失、偏瘫等脑瘤症状）。' },
  { m: '24N', q: '血吸虫病的诊断与治疗？', a: '诊断：\n① 病原学（确诊依据）：粪便直接涂片法、尼龙袋集卵法、毛蚴孵化法、改良加藤法；慢性和晚期患者直肠黏膜活组织检查，根据虫卵死活判定体内是否有活虫；\n② 免疫学：环卵沉淀试验（COPT）、ELISA、快速试纸法（dipstick）；对无病史者或治疗史 ≥3 年者抗体阳性可给予驱虫治疗；McAb-ELISA 检测循环抗原（对慢性轻度感染敏感性 60%~81%），治愈后 1 年 90% 患者循环抗原转阴；\n③ 影像学：B 超判断肝纤维化程度（肝实质内虫卵肉芽肿显示与门静脉树无关的回声密集团）；CT 见晚期肝包膜增厚钙化、龟背样图像；\n④ PCR 检测特异性 DNA 片段与病原学检测具同样确诊价值；\n鉴别：急性期需与疟疾、伤寒、败血症、肝脓肿、结核病、钩体鉴别（急性血吸虫嗜酸性粒细胞增多、肝大明显、肝区疼痛较轻、发热少有寒战）；晚期与其他原因肝硬化鉴别（血吸虫性肝纤维化常伴慢性腹泻、少见黄疸蜘蛛痣肝掌，巨脾与食管下端静脉曲张多见）；\n治疗：\n① 吡喹酮首选——对各发育阶段均有杀伤；急性：总剂量 140mg/kg 6 日疗法（50% 总剂量必须在第 1、2 日服完）；慢性：总剂量 60mg/kg（体重不足 30kg 患儿 70mg/kg）2 日疗法；轻中度也可一次顿服 40mg/kg（儿童酌加 1/6 量）一日疗法；远期疗效 90%~98%，副作用轻；严重心律紊乱/心衰未控制者、肝功能代偿极差、肾功能严重障碍者不宜；\n② 青蒿素衍生物（蒿甲醚、青蒿琥酯）对童虫有杀灭作用，可作口服预防药——接触疫水后每 1~2 周服药；青蒿琥酯不可与吡喹酮伍用（需间隔 5~7 天）；\n③ 对症支持：急性高热补液；晚期巨脾、门静脉高压、上消化道出血可择机手术；侏儒症可间歇小量短期给性激素和甲状腺制剂；\n预后：急性及时驱虫多可治愈；晚期肝硬化难以恢复，预后较差。' },

  // ===== 模块 24O 华支睾吸虫病·姜片虫病·肝片吸虫病 =====
  { m: '24O', q: '华支睾吸虫病（肝吸虫病）的要点？', a: '病原：华支睾吸虫——成虫体扁平半透明似葵花子状，寄生于人、犬、猫、猪等肝胆管内；虫卵黄褐色芝麻粒状 29μm×15μm，有卵盖、肩峰、末端小疣；人体内可存活 20~30 年；第二中间宿主：淡水鱼（145 种，我国发现 102 种，麦穗鱼感染率最高，常见草鱼、鲫鱼、鲤鱼、鲢鱼）和淡水虾（细足米虾等）；囊蚴在鱼肌肉内；\n感染途径：生食或半生食含活囊蚴的淡水鱼虾（鱼生、鱼生粥、或烹调不当半生食入）；\n流行病学：主要流行东亚东南亚，全球约 3500 万感染（中国约 1500 万）；我国 27 个省流行，广东、广西、吉林、黑龙江、辽宁较重；\n致病：成虫机械损伤+分泌物代谢物+宿主脂质过氧化酶（LPO）和超氧化物歧化酶（SOD）增高；胆管上皮反复脱落再生增生形成腺瘤样组织→胆管壁增厚、扩张甚至阻塞→结石核心（结石核心有时可见虫卵）；重度者纤维增生→假小叶→肝硬化；可诱发原发性肝癌（尤其胆管癌）——IARC 认定为亚洲胆管癌 I 类致癌原；\n表现：急性（一次食入大量囊蚴，潜伏期 30 天左右）：发热畏寒寒战、肝大肝区痛、黄疸、嗜酸性粒细胞增多甚至类白血病反应；慢性：轻者无症状或胃部不适腹胀；中度肝大（左叶更明显、表面不光滑有压痛）、腹痛慢性腹泻；重度肝硬化门静脉高压；儿童可伴明显生长发育障碍（生长停滞、身材矮小、消瘦，多伴腹痛腹胀腹泻，智力不受影响，重者侏儒症）；89.8% 患儿嗜酸性粒细胞增加；\n诊断：粪便或十二指肠液发现虫卵确诊（酸醚法、改良加藤法；一般感染后 30 天粪检才查到虫卵；十二指肠引流液以胆汁中虫卵量最多）；免疫学抗原皮试普查初筛，ELISA、Dot-IGSS、ICT；B 超（肝实质点状回声增强、胆管扩张、管壁粗厚）、CT（肝内弥漫性胆管囊状扩张，ERCP 示胆管充盈缺损似虫蛀状）；\n鉴别：病毒性肝炎（血象不高、嗜酸不增多、无生食鱼虾史）、日本血吸虫病（季节性、疫水接触史、毛蚴孵化阳性）、肝片吸虫病（生食水生植物）；\n治疗：吡喹酮——轻中重感染分别总剂量 75~90、120~150、150~180mg/kg 分 2 日服（每日 2 次）；阿苯达唑总剂量 80mg/kg 分 2 日服；两药也可各减半配伍；\n预防：不吃生鱼虾、粪便管理、不用生鱼虾喂猪猫犬、普查普治。' },
  { m: '24O', q: '姜片虫病与肝片吸虫病的要点？', a: '姜片虫病：\n病原：布氏姜片吸虫——寄生人体最大型吸虫（长 20~75mm，形似姜片、肉红色腹背扁平）；虫卵为人体寄生虫卵中最大者（130~140μm×80~85μm）；人或猪为终宿主（猪是重要保虫宿主）；媒介：水红菱、白菱、荸荠等水生植物（囊蚴附着表面）；\n感染：生食附囊蚴水生植物或喝入含囊蚴生水；\n表现：潜伏期 1~3 个月；轻者无症状或食欲缺乏上腹轻痛；中度以消化道症状为主（间歇性腹泻、腹痛恶心呕吐）；重者营养不良、贫血、下肢或全身水肿、腹水；儿童长期严重感染可致发育障碍和智力减退甚至侏儒症；\n诊断：粪便检获虫卵确诊（直接涂片法、沉淀法、改良加藤法水洗沉淀法）；\n治疗：吡喹酮首选——总剂量 10~15mg/kg 顿服或一日内分 2 次服，治愈率均达 100%；重症先支持治疗改善营养纠正贫血后再驱虫；\n预防：勿生食菱角荸荠等水生果品、不饮生水；\n肝片吸虫病：\n病原：肝片吸虫——寄生人体内最大的吸虫（30mm×13mm，形似树叶）；虫卵为人体寄生虫卵中最大者（130~150μm×63~90μm）；成虫定居肝胆管内；传染源为羊、牛等家畜；感染：食入被污染的水生植物（偶有儿童口含水草感染）；\n病理：虫体在肝内移行引起肝内散发性绿豆至黄豆大小暗红色病灶（嗜酸性脓肿，大量夏科-莱登结晶）→机化瘢痕；进入肝胆管刺激胆管上皮增生及扩张；\n表现：潜伏期 2~3 个月；发病较急，发冷发热（弛张或持续高热）、多汗无力；腹痛初全腹后局限于右上腹、阵发性向右肩放散；肝大中等硬度有压痛；轻度-中度黄疸偶见腹水；白细胞（10~20）×10⁹/L，嗜酸性粒细胞可占 70%~80% 以上；\n诊断：发热+肝区痛+肝大+嗜酸性粒细胞明显增多+生食水生植物史；粪便找到虫卵或 ELISA 阳性；\n治疗：三氯苯达唑首选——10mg/kg 单剂（治愈率 91.3%，10mg/kg 每天 2 次一天疗法治愈率 100%，已有耐药报告可与阿苯达唑合用）；吡喹酮对本病有一定疗效但不能治愈；\n预防：不生吃水生植物。' },

  // ===== 模块 24P 并殖吸虫病（肺吸虫） =====
  { m: '24P', q: '卫氏并殖吸虫病的要点？', a: '病原：卫氏并殖吸虫——成虫似半粒花生米，雌雄同体，寄生于肺产出虫卵随痰或粪便排出；第一中间宿主川卷螺，第二中间宿主溪蟹、蝲蛄（生食或半生食感染）；童虫在腹腔移行→经肝、膈肌入胸腔到肺定居形成虫囊，自囊蚴入体到成熟产卵约需 2~3 个月；\n流行病学：人兽共患，我国 22 省存在；传染源为能排出虫卵的人和猫、犬、虎、豹、狼等肉食动物；\n机制：虫体在肺内移行形成窦道，病灶坏死区周围炎症反应→嗜酸性粒细胞脓肿→肉芽组织；虫体可自肺部钻出沿纵隔、颈内动脉周围软组织上行至颅底入颅腔及大脑（脑部病变常在一侧，形成互相沟通的脓肿，病灶内可找到成虫）；\n表现：潜伏期 1~27 个月（平均 6 个月，早者 2~15 天）；\n① 急性期：全身不适、腹痛腹泻食欲缺乏，继之畏寒发热、胸痛胸闷、咳嗽气短；嗜酸性粒细胞明显增多；\n② 慢性期：胸痛、气短、咳嗽——咳果酱样/烂桃样痰（特征），痰中可找到虫卵（卫氏并殖吸虫二倍体在人体内游走不产卵→痰中找不到虫卵、常引起胸腔大量积液）；胸部 X 线明显改变易误诊肺结核；\n临床类型：腹型（早期腹痛腹胀腹泻）；胸肺型（最常见）；皮肤型（约 10%，皮下结节不游走，可找到成虫或虫卵）；肝脏型（儿童较多见）；阴囊肿块型（男性儿童）；心包型；中枢神经型（10%~19%，头痛恶心呕吐、抽搐癫痫、偏瘫失语，可入侵脊髓致截瘫）；亚临床型；\n诊断：食生溪蟹蝲蛄史+临床；痰中找虫卵或血清免疫学（ELISA 敏感性 93.5%~100%、特异性 100%；IHT 阳性率 98.9% 但与血吸虫交叉反应）；皮下结节活检；\n治疗：吡喹酮每日 75mg/kg 分 2~3 次，3 天一疗程（可延长至 5 天，必要时停药 1 周后再 1~2 疗程）；三氯苯达唑单剂 10mg/kg 疗效 91.3%、两剂一天疗法疗效 100%；\n预防：杜绝生食或未熟蟹或蝲蛄、不饮生水。' },
  { m: '24P', q: '斯氏并殖吸虫病（四川并殖吸虫病）的要点？', a: '病原：斯氏并殖吸虫——人并非其适宜宿主，虫体在人体内到处游走不能发育为成虫、不产卵（猫等动物体内可发育成熟产卵）；\n流行病学：只存在于中国（四川、陕西、湖南、湖北、江西、河南、贵州、福建等）；传染源主要是狼、果子狸等野生动物；\n机制：机械性损伤为主——早期片状或带状出血坏死区（穿通隧道）→嗜酸性粒细胞脓肿（中心坏死组织+大量嗜酸性粒细胞+夏科-莱登结晶，无虫卵）→隧道互相沟通→机化形成瘢痕；\n表现：潜伏期一般 3~6 个月（可短至 13 天）；最早出现腹痛、腹泻、胸痛、咳嗽伴发热盗汗；最常见症状为游走性皮下结节或包块（以腹部为常见，其次胸部及腰背部，新出现的结节内常可找到童虫）；常出现胸腔积液或心包积液；脑部受损较卫氏少见，以蛛网膜下腔出血为主要表现；\n临床类型：皮肤型（游走性皮下结节或包块）；腹型；胸肺型（痰中找不到虫卵）；心包型（约 5%~6%，极类似结核性心包炎）；肝脏型（较卫氏多见）；脑脊髓型（7%~21%，蛛网膜下腔出血，脑脊液中除红细胞外有大量嗜酸性粒细胞）；眼型（一侧眼球突出）；亚临床型；\n诊断：流行区食生溪蟹史+ELISA 阳性或皮下结节找到虫体；急性期末梢血嗜酸性粒细胞可达 70% 以上（慢性期往往正常）；\n治疗与预防：同卫氏并殖吸虫病。' },

  // ===== 模块 24Q 带绦虫病 =====
  { m: '24Q', q: '牛带绦虫病的要点？', a: '病原：牛带绦虫（牛肉绦虫、无钩绦虫）——成虫乳白色 4~8m 或更长；头节细小略呈方形，无顶突及小钩，4 个吸盘；人是牛带绦虫的唯一终宿主；孕节子宫分支每侧 15~30 支；\n关键：人对牛带绦虫虫卵内的六钩蚴具有自然免疫力——虫卵不能感染人，因此牛带绦虫不引起人体囊尾蚴病；\n感染：食入生或半生含牛囊尾蚴的牛肉，囊尾蚴在小肠内头节翻出吸附肠壁，2~3 个月发育为成虫；\n表现：一般无明显症状（偶感轻度上腹痛、不适、恶心、呕吐）；常因粪便中发现节片或节片自动从肛门逸出而来就诊；长期寄生可体重减轻、发育迟缓、贫血；严重感染偶可引起阑尾穿孔；\n诊断：\n① 检验孕节：牛带绦虫孕节短长方形、较猪带绦虫者略厚、淡黄色、活动力较强；以墨水注入节片生殖孔观察子宫分支数——牛带绦虫每侧分支多于 13 支（一般 15~30 支）；\n② 检查头节：疗效判定——服药后留取 24 小时全部粪便淘洗查找头节；\n③ 检查虫卵：牛带绦虫卵不直接排入肠中（孕节伸缩蠕动或破裂时才散出），故并非所有患者粪检都能检获虫卵；\n④ PCR 可鉴定虫种；\n治疗：吡喹酮 10mg/kg 单剂空腹服下；南瓜子加槟榔煎剂驱虫有效（空腹服炒南瓜子 50~90g，2 小时后服槟榔 60g 煎剂+泻药）；氯硝柳胺 14 岁以下 1.5~2.0g 分 2 次间隔 1 小时（药片须嚼碎，否则整片排出）；\n预防：不吃生或未熟牛肉。' },
  { m: '24Q', q: '亚洲带绦虫病与猪带绦虫病的鉴别要点？', a: '亚洲带绦虫病：\n病原：亚洲带绦虫（牛带绦虫亚洲亚种）——成虫与牛带绦虫极相似（头节无顶突小钩），区别在于囊尾蚴阶段：亚洲带绦虫囊尾蚴体积较小、头节上有两圈发育不良的小钩；人是唯一终宿主；中间宿主家猪、野猪、牛、羊及野生动物，囊尾蚴主要寄生在中间宿主的肝脏（肝实质多见）；人因生食猪肝感染（我国台湾范秉真教授在不吃牛肉的山区发现无钩绦虫、后在猪肝脏发现幼虫而命名）；\n流行：亚太地区（韩国、日本、菲律宾、印尼、泰国、缅甸、越南等）及我国云南、贵州、台湾；\n表现及防治：与牛带绦虫相似；吡喹酮 10mg/kg 单剂空腹；可用分子生物学鉴别虫种；\n猪带绦虫病：\n病原：猪带绦虫（有钩绦虫）——头节有顶突、顶突上两圈小钩；虫体 2~4m 较牛带绦虫短；孕节子宫分支每侧 7~13 支（少于 13 支——与牛带绦虫鉴别的关键）；\n感染：吃生或未熟的猪肉（囊尾蚴）；\n重要：人是猪带绦虫的唯一终宿主，但也可成为中间宿主（食入虫卵患囊尾蚴病）——人既是终宿主又是中间宿主；\n表现：与牛带绦虫相同，观察孕节子宫侧支数 7~13 支可确诊；\n治疗注意：使用吡喹酮驱虫时应服用 5mg/kg 的小剂量——因恐患者同时存在无症状的脑囊尾蚴，常规剂量服药后虫体死亡可引起严重反应。' },

  // ===== 模块 24R 囊尾蚴病·棘球病 =====
  { m: '24R', q: '猪囊尾蚴病（囊虫病）的要点？', a: '病原：猪带绦虫的幼虫（囊尾蚴）寄生于人体所致——人吃入猪带绦虫虫卵后，六钩蚴在小肠破卵壳而出，钻入肠黏膜入血流侵入全身组织（骨骼肌为主，9~10 周发育为成熟囊尾蚴，5mm×10mm，人体内至少可存活 1~2 年）；小儿胃酸较弱、难于消化虫卵胚膜，因此小儿较少患囊尾蚴病；\n三种感染途径：① 外源性自身感染（卫生习惯差，自身虫卵再吃入，约占 45%）；② 内源性自身感染（胃肠逆蠕动使自身虫卵逆流至胃内，少见）；③ 外源性异体感染（食物蔬菜瓜果污染他人虫卵，约占 55%）；\n传染源：患猪带绦虫病的患者（人是最重要传染源）；\n临床分急性期和慢性期：急性期（感染较重）：发冷发热 39℃ 以上、全身肌肉酸痛无力、嗜酸性粒细胞明显增多；慢性期按寄生部位分类型：\n① 皮肤肌肉型：常无症状，无意中发现皮下结节；\n② 假性肌肥大型：肌肉中布满囊尾蚴，外观肌肉发达却感十分无力；\n③ 中枢神经型：脑实质型（最常见——癫痫发作、颅内压增高、精神障碍脑囊尾蚴病三大症状）；脑室型（约占 1/5，以第四脑室多见，Bruns 征——发作性眩晕头痛呕吐甚至摔倒，急速转动头部可诱发）；软脑膜型（约占 9%，颅底囊尾蚴炎症粘连→颅内压增高及脑血管并发症，以脑卒中为首要表现者并非少见）；脊髓型（少见，类似脊髓灰质炎或截瘫）；\n④ 眼型：常为单个，视网膜及玻璃体内多见，患者感觉有伸缩性阴影；\n⑤ 心脏型：囊尾蚴寄生心肌、室间隔、腱索及瓣膜，心电图上可见期外收缩、二联律、右束支传导阻滞、房室传导阻滞；\n脑内囊尾蚴 90% 在脑皮质及脑室内（顶叶及额叶近表面处多见）；脑室内囊尾蚴体积较大、缺乏宿主囊膜，易受压破裂，幼虫脱出死亡形成无头节的葡萄状囊尾蚴（引起蛛网膜肥厚粘连、阻塞脑底池→阻塞性脑积水）；囊尾蚴死亡后作为异物刺激引起局部炎症反应及水肿使原有症状加重；\n诊断：急性期白细胞及嗜酸性粒细胞 70%~80% 以上；脑型者脑脊液压力增高、细胞数轻度增多以嗜酸性粒细胞为主；血清及脑脊液免疫学 ELISA 阳性率 90%~98%、特异性 98%（与棘球病交叉反应）；头颅 CT（急性期囊尾蚴周围水肿小片状阴影、强化后结节状或环状强化灶、有时见头节，治愈后钙化灶）；MRI 对脑室型、脑干、眼、脊髓内病灶优于 CT；皮下结节活检；韩国学者发现囊尾蚴液 10kD 蛋白鉴别活动性囊尾蚴病（有效性 97%、特异性 >98%）；\n治疗：阿苯达唑或吡喹酮首选——阿苯达唑 14~15mg/（kg·d）分 2 次，10 天一疗程；皮肤肌肉型 1~2 个疗程，脑型 2~3 个疗程（间隔 2~3 个月）；吡喹酮每天 60mg/（kg·d）分 2~3 次（作用较快，虫体杀死后副作用较大且出现较早）；宿主免疫反应是脑囊虫病并发症的主要原因——治疗前颅内压较高者应先用脱水剂降低颅内压后再驱虫，同时应用肾上腺皮质激素（地塞米松）减轻虫体死亡后的炎症反应及水肿，必要时用甘露醇；\n预防：饭前洗手、不吃生菜、瓜果削皮；猪带绦虫病患者要及早治疗。' },
  { m: '24R', q: '囊型棘球病（包虫病）的要点？', a: '病原：细粒棘球绦虫——成虫寄生于犬科动物（犬、狼）小肠上段（虫体仅 3~6mm，孕节占虫体长 1/2，内含 500~800 个卵）；中间宿主牛、羊等；虫卵随犬粪排出，人食入污染虫卵的食物饮水感染；六钩蚴钻入肠壁随血流淋巴入肝、肺等发育为棘球蚴（包虫囊）；\n病理：棘球蚴为圆形或不规则囊状体——囊壁外层角皮层（白色半透明如粉皮状，厚约 1mm）+ 内层生发层（以芽生方式形成原头节、生发囊及子囊）；从囊壁脱落的原头节、生发囊、小子囊悬浮在囊液中称棘球囊砂（hydatid sand）；囊内可见蜂房状结构；\n生长特点：生长缓慢，肝内每年增长约 1cm，常感染 15~20 年后才出现压迫性症状；棘球蚴可存活 40 年或更长；可退化衰亡钙化；\n流行病学：我国主要流行西部和西北部，内蒙古、西藏、四川、甘肃、青海、宁夏、新疆 7 省区为疫源地；从事畜牧业人群患病率最高（2.32%）；传染源为有本虫寄生的犬；\n表现：症状与寄生部位及大小有关——肝囊型棘球病最常见（肝区不适隐痛胀痛、肝大、表面隆起可触及囊性肿物、叩诊可有“包虫震颤”；合并感染时类似肝脓肿；向腹腔破裂→过敏性休克及腹痛）；肺囊型（胸痛、干咳，约半数咯血或痰中带血；囊肿破入支气管→咳出大口清水或果酱色痰、内有“粉皮”样碎块，伴咯血；破入胸腔→刀割样胸痛、支气管胸膜瘘、液气胸、脓胸）；也可寄生骨骼、肾、脑、脾、心脏；\n诊断：\n① 病原学：手术取出物或痰、胸腔积液、腹水中检获棘球碎片或原头节（确诊依据）；\n② 免疫学：Casoni 皮内试验（临床初筛，现已很少使用）；ELISA 阳性率 96%（与泡型棘球病、囊尾蚴病交叉反应）；\n③ 影像学是关键：B 超（肝囊性无回声液性暗区内见蜂房状结构——特异性诊断意义）；CT 母囊内含子囊时显示密度略低的多个较小圆形阴影呈车轮状；\n治疗：外科手术切除为首选；术前术后服阿苯达唑每日 15mg/kg 分 2~3 次各 2 周，以防术中囊液漏出引起继发性棘球病；不能手术者阿苯达唑长期疗法；国外 PAIR 疗法（B 超引导下穿刺抽液+注入无水酒精或 20% 高张盐水保留 15 分钟杀死子囊再抽出；禁忌证：表浅棘球或有胆管瘘者）；\n预防：牧区定期对犬检查驱绦虫、不吃生菜、饭前洗手。' },
  { m: '24R', q: '泡型棘球病（多房棘球蚴病）的要点？', a: '病原：多房棘球绦虫——成虫与细粒棘球绦虫相似但较小；终宿主除犬科外尚有猫科（狐狸比犬更重要）；中间宿主不是有蹄类而是鼠类；人因误食虫卵感染；虫卵对寒冷高度耐受；\n机制：六钩蚴入肝形成多房棘球——肝病变呈结节状或巨块状肿块，边缘不整齐与周围组织无明显分界，切面海绵状（囊泡直径 1~10mm，内充满胶状物而无囊液）；缺乏角质层（特点）；生发层以外殖性芽生方式浸润扩散产生新囊泡，无明显宿主组织反应；角质层不连续，棘球砂及生发层从母囊逸出侵入肝实质形成子囊孙囊；\n与囊型鉴别要点：囊型有完整角皮层、囊内含囊液和原头节；泡型无角质层、囊泡内仅含胶状物、很少有原头节；\n表现：潜伏期很长（10~20 年以上），出现症状多已晚期；肝区或右季肋部疼痛、腹胀、食欲缺乏、消瘦，约 1/5~1/3 病例黄疸；肝脏明显肿大、表面结节状、质硬；脾大、腹水及门静脉高压征象；胆汁感染引起的败血症及病灶转移是常见并发症；中晚期病死率较高；约 2% 生长层片块经血行/淋巴转移至脑、肺、纵隔；\n实验室：泡球蚴在组织深部，病原学诊断困难需手术确诊；Em16/Em18 抗原鉴别两型——囊型棘球病患者血清对 Em16 阳性，多房棘球患者血清对 Em18 阳性；B 超肝区密集光点+大小不等光团（中心坏死区时见液性暗区）；X 线肝区局限或弥漫性细小环状钙化影；CT 实质性肿块、边缘不规则、巨大肿块中心坏死腔、簇集性斑点状钙化；\n治疗：早期切除病灶及周围肝组织是主要措施——不能手术时服用大剂量阿苯达唑（20mg/（kg·d）分 2~3 次，20 天一疗程，间歇 10 天，共 2~3 年）；定期复查血象及肝功能（该药可致粒细胞减少及肝功能异常）；新型候选免疫药物重组 IFN-α2a；\n预后：发生肝外转移者预后不良，治疗不能单靠手术；\n预防：同囊型棘球病（牧区犬定期检查驱绦虫、健康教育、不吃生菜、饭前洗手）。' },

  // ===== 模块 24S 膜壳·裂头·曼氏迭宫绦虫·蝇蛆病 =====
  { m: '24S', q: '微小膜壳绦虫病与缩小膜壳绦虫病的要点？', a: '微小膜壳绦虫病：\n病原：微小膜壳绦虫（短膜壳绦虫）——寄生于鼠或人体小肠；虫卵球形无色透明内含六钩蚴，外包胚膜，两端隆起各有 4~8 根丝状物，卵具感染性；\n生活史特点（关键）：不需要中间宿主即可完成生活史——虫卵被鼠或人吞食，六钩蚴钻入肠绒毛发育为似囊尾蚴再入肠腔发育为成虫；虫卵在宿主肠腔内停留较久可在肠内孵出六钩蚴经似囊尾蚴发育为成虫——自身感染（自身内感染）；也可经中间宿主（蚤类幼虫、面粉甲虫）感染；\n流行病学：我国平均感染率 0.045%，新疆一些地区及台湾高山族地区高达 8% 以上；儿童更多见，4~9 岁感染率最高；鼠类是重要贮存宿主；\n表现：虫体对肠黏膜机械损伤及分泌毒素；似囊尾蚴寄生肠绒毛肿胀变性；轻者无明显症状，中重度者头痛、眩晕、恶心、消瘦、肛门瘙痒、周期性腹泻、腹部隐痛，伴失眠不安；重度者癫痫、平衡失调、眼颤（驱虫后都可消失）；约 1/3 患者嗜酸性粒细胞轻度增高；\n诊断：粪便中找到虫卵确诊；\n治疗：单剂吡喹酮（成人及 4 岁以上儿童 5~25mg/kg 早餐随餐顿服，疗效 94%，2 周后重复一次以消灭可能的自身感染）；氯硝柳胺（药片需嚼碎；成人初剂 2g 继以每日 1g×6 日；小儿 2~6 岁 1 日 1g，<2 岁 1 日 0.5g）；\n预防：治疗患者、灭鼠、粪便管理、改善环境卫生、儿童青少年健康教育；\n缩小膜壳绦虫病：\n病原：缩小膜壳绦虫（长膜壳绦虫、鼠绦虫）——成虫长 100~600mm 含节片 800~1300 个；虫卵较微小膜壳绦虫者大一倍、黄褐色、卵壳稍厚、胚膜两极无极丝；\n生活史：必须有中间宿主——面粉甲虫、粉螨、蛾类吞食虫卵后在血腔中形成似囊尾蚴，人误食中间宿主感染；儿童常因误食带似囊尾蚴的节肢动物感染；\n表现：轻微神经和消化系统症状（头痛失眠烦躁不安、夜间磨牙、恶心呕吐腹胀腹痛便秘消化不良、肛门发痒、嗜食土块等）；不产生严重病理变化；\n诊断：粪便找到虫卵或孕节；\n治疗：首选吡喹酮，氯硝柳胺也有效（剂量同微小膜壳绦虫病）。' },
  { m: '24S', q: '阔节裂头绦虫病的要点？', a: '病原：阔节裂头绦虫——虫体可达 10m、3000~4000 个节片；必须 2 个中间宿主：第一中间宿主剑水蚤和镖水蚤（钩球蚴→原尾蚴），第二中间宿主淡水鱼（鲈鱼、鳕鱼、大马哈鱼等，原尾蚴穿出肠壁入肌肉发育为裂头蚴）；人是终宿主，食入含裂头蚴的鱼后 5~6 周发育为成虫；成虫寿命约 10~15 年；\n流行病学：温带和亚寒带地区；我国黑龙江、北京、吉林、广东、福建、上海及台湾有病例；人感染因生食或半生食含裂头蚴的鱼；\n表现：多数感染者无明显症状，少数疲倦恶心呕吐；虫体过大可缠绕成团引起肠梗阻或胆囊胆管阻塞甚至肠穿孔；\n特征性并发症——绦虫性贫血：绦虫大量吸收肠道中的维生素 B₁₂ 致宿主维生素 B₁₂ 缺乏+虫体代谢产物直接损害宿主造血功能，约 2% 患者并发绦虫性贫血（一般轻中度；部分患者除贫血外尚有感觉异常、运动失调、深部感觉缺失等神经紊乱现象，严重者失去工作能力，驱虫后贫血很快好转）；\n诊断：粪便中查到虫卵或节片确诊（常规粪检虫卵廉价快速，虫卵形态可作虫种鉴别）；\n治疗：首选吡喹酮 15~25mg/kg 顿服；粪便查见头节是治疗彻底的依据，如未查见建议 2~3 个月后随访；贫血者驱虫同时加用维生素 B₁₂；南瓜子 50g 和槟榔 30g 水煎服、硫氯酚、氯硝柳胺也有效；\n预防：不食生或半生鱼；鱼肉 -18℃ 24~48 小时或充分加热可杀死裂头蚴。' },
  { m: '24S', q: '曼氏迭宫绦虫病与曼氏裂头蚴病的要点？', a: '病原：曼氏迭宫绦虫——成虫长 60~100cm，头节指状、背腹面各有一纵行吸槽；第一中间宿主剑水蚤，第二中间宿主蛙，蛇、鸟类、猪等是转续宿主；人可作为第二中间宿主、转续宿主甚至终宿主；\n感染曼氏裂头蚴（幼虫）的方式（重要）：① 用生蛙肉或蛇皮敷贴伤口或脓肿处（民间传说蛙蛇清凉解毒，眼部、口腔颌面部敷贴）——裂头蚴经伤口或黏膜侵入；② 吞食生的或未熟的猪肉、蛙肉、蛇肉等，裂头蚴穿肠壁入腹腔移行；③ 饮生水或游泳时吞入带原尾蚴的剑水蚤；生食蝌蚪感染易引起家庭聚集性病例；\n流行病学：裂头蚴在人体组织内存活可长达 12 年（最长报道 36 年）；我国 27 省有裂头蚴病报道；\n表现：成虫偶然寄生人体仅轻微腹痛恶心呕吐；裂头蚴病危害大得多——被寄生组织肿胀形成嗜酸性肉芽肿甚至脓肿；\n① 眼裂头蚴病：多累及单侧眼睑或眼球（眼睑红肿、结膜充血水肿、流泪微痛奇痒或有虫爬感、可移动的红肿硬节）——多因蛙肉蛇皮敷贴眼部所致；\n② 皮下裂头蚴病：四肢躯干浅表游走性皮下结节（胸壁、颈部、乳房、腹壁及四肢皮下），瘙痒虫爬感；\n③ 口腔颌面部裂头蚴病：颊部、口腔皮下硬结；\n④ 脑裂头蚴病：临床表现类似脑部肿瘤，易误诊；颅内病灶呈游走性（活的虫体在颅内不断活动）；\n⑤ 内脏裂头蚴病：少见；罕见颅内、肺内多发感染致脑疝死亡；\n诊断：有生食蝌蚪或蛙肉蛇肉贴敷病史；成虫感染粪检虫卵或节片；裂头蚴病取局部包块结节活检检获裂头蚴；脑裂头蚴病结合免疫学、X 线、CT、磁共振；\n治疗：手术摘除裂头蚴（必须整个虫体完全取出才能根治；局麻下摘除肌肉内、皮下或眼睑等处裂头蚴）；不易手术时口服吡喹酮（儿童 25mg/kg 每天 3 次×2 天，总量 150mg/kg）；\n预防：不用蛙肉蛇肉蛇皮贴敷皮肤伤口；不生食或半生食蛙、蛇、禽、猪肉；不生吞蛇胆；不饮生水。' },
  { m: '24S', q: '蝇蛆病的要点？', a: '病原：蝇类的幼虫（蝇蛆）寄生于人体组织内；能寄生于人体的蝇蛆分三类：\n① 专性蝇蛆病：蝇蛆完全营寄生生活，特定宿主及寄生部位才能生活（如消化道丽蝇科、皮内及皮下组织皮蝇科；白氏金蝇常寄生皮肤伤口或溃疡内）；\n② 兼性蝇蛆病：常生活在腐败有机物中，特殊条件下经伤口或腔道开口进入人体（丽蝇科、麻蝇科幼虫）；\n③ 偶性蝇蛆病：虫卵或幼虫偶然随污染食物饮水进入消化道或泌尿道（蝇科、厕蝇科、麻蝇科等）；\n按寄生部位分七型：眼蝇蛆病（牧区夏季多见，雌蝇飞行中直接撞击人眼将幼虫产于角膜结膜囊内；异物感发痒疼痛流泪畏光结膜充血，侵入深部组织可视网膜剥脱、视力减退，侵入玻璃体可失明）；耳鼻咽蝇蛆病（慢性鼻窦炎、臭鼻症、化脓性中耳炎患者，分泌物臭味招引雌蝇；鼻咽部或耳道异物感疼痛、头晕头痛发冷发热，重者听力障碍）；胃肠道蝇蛆病（不卫生习惯，随污染食物水进入；消化功能紊乱，胃蝇科幼虫症状较重——头晕耳鸣心悸贫血）；泌尿生殖道蝇蛆病（尿道或阴道分泌物臭味引诱蝇类产卵；尿道炎膀胱炎症状尿频尿急尿痛，侵入阴道则阴道炎）；皮肤蝇蛆病（皮蝇科幼虫皮下移行引起游走性皮下包块，头面胸背腹部，皮下虫爬行或游走性疼痛感）；伤口蝇蛆病（伤口溃疡出血未处理诱蝇产卵，在坏死组织内生长使病情恶化）；其他（麻蝇科幼虫侵犯呼吸器官→胸痛咳嗽咳痰甚至肺炎）；\n诊断：病灶处找到蝇蛆，根据三龄幼虫后呼吸孔（气门裂）形态鉴别种类；\n治疗：局麻下切开包块或从眼结膜囊取出虫体（诊断兼治疗）；伊维菌素有效（单剂 200μg/kg，可分 2 次服用）；\n预防：注意个人卫生环境卫生、伤口及时处理。' },

  // ===== 模块 24T 螨病·蜱·恙螨·尘螨变态反应 =====
  { m: '24T', q: '疥疮的要点？', a: '病原：疥螨——寄生于表皮层内，钻入皮肤啮食角质层组织，形成蜿蜒隧道；雌雄疥螨夜间从隧道爬到皮肤表面交配，受精雌螨再钻入皮内，数日后于隧道内产卵 20~50 枚；雌螨可存活 60 天左右；\n流行病学：世界性分布；人体躯体接触（握手等）是主要传播方式；有流行和间歇周期性（30 年一循环）；无年龄种族性别差异，妇女、儿童多发，年轻人群多发；皮肤科病房医务人员诊治患者可发生院内感染；\n机制与表现：皮损多见于人体薄嫩皮肤处（指间、手腕、肘窝、腋窝、胸部、脐周、下背部、腹股沟，女性乳房下，儿童颜面及掌跖）；皮损可见隧道口的丘疹和水疱（淡红或鲜红色）；入睡后被褥中温度升高，疥螨活动和啮食加剧；机械刺激+表皮损伤+疥螨分泌物排泄物尸壳等变应原→奇痒（夜间为甚），搔抓后出现血痂并继发感染（脓疱、毛囊炎、疖肿）；重症疥疮可出现局部淋巴结炎、蛋白尿或急性肾炎；最严重的是结痂型疥疮（免疫功能低下者，疥螨惊人繁殖达天文数字，播散至全身包括甲沟）；\n诊断：皮损处检出疥螨确诊——滴 50% 甘油于手上皮损处，强光源照射，体视显微镜放大见角皮下隧道及螨体，用消毒针挑起盲端白色小点（即疥螨）置载玻片上能爬行；刮破丘疹血痂镜检；\n治疗：首先用温水和肥皂洗澡，再用硫磺软膏或苯甲酸苄酯搽剂涂遍全身（头部除外）；治疗后洗澡并清洗衣物被褥床单煮沸消毒防复发；患者避免与他人直接接触、避免衣被混用；\n预防：注意个人卫生、常洗澡勤换洗衣被、避免与疥疮患者接触。' },
  { m: '24T', q: '毛囊皮脂螨（蠕形螨）侵染的要点？', a: '病原：蠕形螨——人体两种：毛囊蠕形螨（寄生毛囊）和皮脂蠕形螨（寄生皮脂腺）；螨体小指状形似蠕虫，八足，刺吸皮脂细胞和毛囊中积聚的皮脂为食；一个毛囊内可有 6~7 条毛囊蠕形螨（最多记录 25 条），皮脂腺腔内皮脂蠕形螨 90% 为单条出现（一般不超过 6 条）；\n流行病学：低致病力寄生螨，所致症状与侵染度正相关；最早出现在 48 天的婴儿；儿童感染率 4%~33%，随年龄增长成人感染率 25%~100%；青春期明显升高，男性高于女性；具家庭聚集性——与患者体部直接接触（接吻、婴儿吸奶）或间接接触（床褥、洗脸巾）感染；一旦受染缓慢繁殖蔓延可迁延终身；\n表现（蠕形螨病）：皮脂腺发达部位尤以颜面部最多（T 形区针尖红点脱屑皮疹，继而顽固结节脓疱疹、红斑）；其次胸、背、乳头、阴部；原发性病原是毛囊蠕形螨，继发性病原是皮脂蠕形螨；蠕形螨体内共生的浊杆菌抗原蛋白是丘疹脓疱性皮疹的刺激原，合并痤疮丙酸杆菌等继发感染时皮损炎症概率高达 90% 以上；\n诊断：皮脂挤出法（鼻尖鼻翼挤压出皮脂涂片加 50% 甘油镜检）；透明胶带法（2cm×5cm 胶带贴皮损处 90 分钟后揭下镜检）；眼科裂隙灯查睑缘炎时见睫毛囊中蠕形螨；\n治疗：10% 硫磺软膏、20% 苯甲酸苄酯乳剂、2% 甲硝唑冷霜、2% 伊维菌素乳油、15% 邻苯二甲酸二丁酯；同时内服甲硝唑或伊维菌素；\n预防：避免直接接触（如接吻）、常洗被褥枕套、避免混用生活用品。' },
  { m: '24T', q: '蜱咬皮炎与蜱瘫痪的要点？', a: '病原：蜱——属蜱目，是大型螨类，体表专性吸血寄生；分硬蜱和软蜱：\n硬蜱：躯体背面有骨质盾板（雄性覆盖全背因而坚硬体小）；孳生在山林、草原、荒漠；生活史分卵、幼虫、若虫、成虫 4 期，需 3 个宿主；\n软蜱：无盾板，孳生于荒漠半荒漠地带，栖息在小动物洞穴、岩窟、畜棚废墟缝隙中，待机吸血，饱后离去，耐饥长寿（可活 10~20 年，起保存疫源地作用），有些以鸟类包括家禽为宿主；\n蜱咬皮炎：东北地区和新疆天山林区全沟硬蜱易叮皮肤较嫩部位（耳、颈、发际、腋窝、腰、大腿内侧、阴部等不易搔抓部位）；硬蜱吸血量大常需三五日饱吸离去，口器具倒钩，唾液含抗血凝和肌肉麻痹毒素令人数日无知有蜱侵扰吸血（常误认为赤褐色皮痣）；皮损为水肿、出血、胶原纤维溶解性急性炎症反应、伤口坏死继发感染；硬蜱口器较长大损及真皮和皮下组织，软蜱口器较小吸血时间短皮损较轻；\n蜱瘫痪（重要）：蜱分泌的唾液中含肌肉麻痹毒素，作用于神经肌肉连接处，阻断乙酰胆碱递质释放，导致传导阻滞，产生上行性肌肉麻痹引起瘫痪；如在中枢神经附近，导致呼吸肌麻痹危及生命；儿童发生病例较多；如能及早发现，立即将蜱除去，瘫痪即可恢复；\n处理：蜱咬皮损如无继发感染可不予处理；发生蜱瘫痪立即找出蜱叮所在将蜱除去——注意蜱的口器牢固钩在皮内，不经拨动或刺激不会自动松脱，硬拽发生“头体”断离，口器留在皮肤内需手术摘除；\n预防：避免进入蜱孳生地区，野外作业旅游预先防护——扎紧袖口、裤管、腰带、领口防蜱钻入吸血，暴露体部涂抹驱虫剂（苯二甲酸二丁酯等），野营帐篷周围清除杂草、灭鼠，在有蜱的地方活动应经常就地查体。' },
  { m: '24T', q: '恙螨与尘螨变态反应的要点？', a: '恙螨：\n幼虫专性寄生（若虫和成虫在地面自由捕食）；已知幼虫 3000 多种；幼虫细沙粒大小，饱食后可达 500~1000μm，足 3 对；生活史分 7 期，卵球形成堆产于土缝中，孵出幼虫大量群集一处呈点散状“螨岛”；爬至皮薄而湿润处叮刺（耳窝、会阴，甚至鼻腔）；\n引起疾病：① 恙螨皮炎（红色小丘疹→小泡→中央坏死出血形成黑色焦痂或溃疡，皮损恢复缓慢可留直径 2cm 左右终身瘢痕）；② 恙螨立克次体热（专性传播恙虫病——病原恙虫东方体；我国主要媒介为德利纤恙螨、温州纤恙螨等；潜伏期 6~18 天，高热起病畏寒，四肢散在丘疹，2 周后弛张热，3 周病情开始恢复；原发部位焦痂、血清变形杆菌 OXK 凝集反应阳性为确诊依据；强毒力型预后差，早年病死率 50%，轻型预后良好；病后免疫力较低，康复后可再感染；氯霉素、四环素及多西环素为特效药）；③ 又是肾综合征出血热兼性媒介，可传播巴通体病；\n预防：清除孳生地、灭鼠、流行季节野外作业扎紧领口袖口裤腰袜口、暴露皮肤涂驱螨剂；\n尘螨（螨性变态反应）：\n尘螨并非寄生虫，其排泄物、分泌物及皮壳是强烈的环境变应原，引起螨性变态反应（哮喘、过敏性鼻炎、特应性皮炎、荨麻疹等）；\n种类：全球最普遍分布的是户尘螨和粉尘螨（合称屋尘螨类）；不同经纬度和海拔地区有特定优势螨种（热带亚热带——热带剥爪螨，北欧——腐酪食螨等）；\n机制：尘螨变应原经黏膜下郎格罕细胞捕获转为树突细胞→淋巴结提呈→初始辅助 T 淋巴细胞向 Th2 细胞倾斜→诱导 B 细胞产生 IgE + IL-4、IL-5、IL-10 等细胞因子→激活靶器官变应性炎症；母体怀孕期暴露的尘螨变应原可经胎盘进入羊水预致敏胎儿；新生儿落地后尘螨是最先暴露的变应原，最早免疫应答出现的是婴儿湿疹；\n流行病学：患过敏性疾病人群中 80% 对螨过敏，哮喘儿童对尘螨浸液皮试阳性率达 90%；国内哮喘患病率 3%~5%、过敏性鼻炎 12%~15%、特应性皮炎 7%~10%；尘螨密度在海拔低而温暖潮湿地区显著高于高寒地区，旧房多于新房，春秋季节高峰（秋季最多）；\n诊断：螨变应原皮肤点刺（风团为阳性）；ELISA 血清螨特异性 IgE；\n治疗：免疫治疗（特异性病因治疗）——注射或舌下含小剂量尘螨变应原疫苗递增浓度，按 GINA 方案维持 3 年；机制是高浓度变应原暴露使 Th2 细胞向 Th1 细胞漂移，Th1 细胞因子抑制 Th2 细胞因子，一般疗效 70% 以上、儿童可达 90%，愈早愈好；其他对症（小剂量类固醇吸入、抗组胺、抗 IgE）；\n预防：保持住房通风干燥，常洗衣物被褥床单，不用地毯，清洁地面无积尘，不养宠物——可使尘螨密度降低到无害化；洗衣机冷水清洗衣被可除去 30% 尘螨，55℃ 可热杀全部；使用防螨纺织品。' },
];
