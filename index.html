const CARDS_CH29 = [
{ m: '29A', q: '胎儿期造血的三个阶段及其时间？', a: '①中胚叶造血期：孕3–6周，卵黄囊血岛造血，孕10–12周停止。\n②肝脾造血期：孕6–22周，肝脏为主要造血部位（孕6–8周干细胞迁入），孕24周后肝脏造血减退、出生时停止；脾脏3–6月造红细胞，5月后减退，制造淋巴细胞功能维持终身。胸腺孕6–7周出现，淋巴结短暂造血。\n③骨髓造血期：孕11周开始，孕22周后骨髓成为主要造血部位，为永久造血器官。\n出生后：主要为骨髓造血（红髓），5–7岁长骨出现黄髓，18岁红髓仅分布于扁平骨及肱股骨近端；黄髓有潜在造血能力，需要时可转为红髓（髓外造血：感染、溶血、贫血时肝脾淋巴结肿大，周围血出现有核红细胞和幼稚粒细胞，出生2个月后骨髓外造血停止）。' },
{ m: '29A', q: '小儿血象的年龄特点（红细胞、白细胞分类交叉、血红蛋白种类）？', a: '红细胞：初生时(5–7)×10¹²/L、Hb约170g/L；生后6–12小时因不显性失水血液浓缩而升高；随呼吸建立血氧饱和度45%→95%，EPO减少，2–3个月达最低（红细胞3×10¹²/L，Hb 110g/L以下）——生理性贫血，未成熟儿生后3–7周可降至70–90g/L。\nMCV：孕22–23周可达135fl，初生113fl，2–3个月最低，1岁约77fl。\n网织红细胞：初生约为红细胞的4–6%（周围血红细胞的4%–6%），生后5–7天近于消失，3个月内维持低水平约0.3%。\n白细胞分类两次交叉：初生时中性粒细胞60–65%、淋巴30–35%；生后4–6天两者相等（第一次交叉）；此后婴儿期淋巴细胞占优势约60%；4–6岁再次相等（第二次交叉）；6岁后中性粒细胞增多达成人值65%。\n血红蛋白种类：胚胎4–8周为GowerⅠ(ζ2ε2)、GowerⅡ(α2ε2)、Portland(ζ2γ2)；8周后以HbF(α2γ2)为主，胎儿6个月占90%，初生占70–75%，6–12个月<2%；成人型HbA1(α2β2)初生占30%，6–12个月达成人水平95%以上；HbA2(α2δ2)初生不足1%，12个月增至2–3%。' },
{ m: '29A', q: '小儿血小板、血容量与红细胞比容特点？', a: '血小板：新生儿期波动较大，生后48小时内较低约150×10⁹/L，2周后可高达300×10⁹/L，6个月后与成人相同(150–350)×10⁹/L。\n血容量：新生儿约85ml/kg（早产儿90–108ml/kg），婴儿及儿童75–80ml/kg。\n红细胞比容：脐血均值55%，2个月降至最低30%，1岁35%，3岁38%，青春期成人水平（男47%、女42%）。\n骨髓象：初生时粒红比值1.2:1；有核红细胞生后第1天占30–65%，7天降至12–40%，2周后8–30%，3–4周达正常儿童水平20%。' },
{ m: '29B', q: '小儿贫血的分度与形态分类、病因分类？', a: '分度（Hb）：轻度90–120g/L（6岁以上）/90–110g/L（6岁以下）；中度60–90g/L；重度30–60g/L；极重度<30g/L。\n形态分类：大细胞性MCV>94fl（巨幼细胞贫血）；正细胞性（再障、急性失血、部分溶血）；小细胞低色素性MCV<80fl、MCHC<30%（缺铁性、地中海贫血、慢性感染、铁粒幼细胞）。\n病因分类三大类：红细胞生成减少（造血物质缺乏、骨髓造血低下、调节失调）；溶血性（红细胞内在缺陷：膜、酶、血红蛋白；红细胞外异常：免疫性、非免疫性）；失血性（急性、慢性失血）。\n诊断线索：发病年龄（新生儿溶血症、2–3月生理性贫血、6月–2岁营养性贫血）、籍贯（G6PD缺乏和地贫南方多见、巨幼贫北方农村）、服药史（氯霉素→再障、磺胺/奎宁→免疫性溶血）、饮食史（蚕豆→G6PD）、家族史。\n网织红细胞：增多→失血或溶血；减少→生成减少（再障、纯红再障）。\n确诊前切勿滥用铁剂、维生素B₁₂、泼尼松或随意输血。' },
{ m: '29B', q: '婴儿生理性贫血的特点与原因？', a: '足月儿Hb很少降至90g/L以下；生后1周内Hb逐渐下降，8周后趋于平稳，2–3个月降至90–110g/L。早产儿出现早且重，生后3–6周可降至70–90g/L。\n原因：①肺呼吸建立后血氧饱和度45%→95%，EPO合成受抑制，骨髓红系增生减低；②胎儿红细胞寿命短，生后逐渐破坏；③生后3个月内体重增长最快，血容量扩充稀释（最主要原因）。\n正细胞正色素性，网织红细胞降低。\n处理：无需治疗；饮食中保证造血物质；Hb<70g/L或合并其他疾病时输少量红细胞；铁剂无效；极低出生体重儿可试用EPO。早产儿维生素E储存低，血清<0.5mg/dl可致维生素E缺乏性溶血（红细胞变形+棘形红细胞）。' },
{ m: '29B', q: '缺铁性贫血的病因与铁代谢特点？', a: '好发6个月–3岁。\n铁分布：血红蛋白铁占总量约2/3（64%），铁蛋白和含铁血黄素30%（储存），肌红蛋白3.2%。\n铁的来源与吸收：植物铁吸收率约1%，肉类血红素铁吸收率10–22%，肉鱼与植物同食可增加植物铁吸收；吸收主要在十二指肠区，肠黏膜细胞4–6天更新起调节作用（缺铁时铁大量入血）。人乳铁吸收率高于牛乳（缺铁时可增至50%）。\n病因：\n①先天储铁不足：早产儿、低出生体重儿（总铁量与体重成正比）、胎盘输血给母体、双胎、脐带结扎延迟（多得75ml血或40mg铁）。\n②生长发育快：足月儿1年内需补充铁156mg，早产儿276mg（多177%）。\n③摄入不足：母乳1.5mg/L、牛乳0.5–1.0mg/L、羊乳更少。\n④长期少量失血：每失血4ml≈失铁1.6mg；胃肠道畸形、钩虫、肺含铁血黄素沉着症、少女月经过多。\n⑤吸收障碍：腹泻、肠炎；感染时食欲减退、吸收不良。\n铁排泄：每日约15μg/kg，2/3经肠道。' },
{ m: '29B', q: '缺铁性贫血的临床表现与实验室检查（含铁剂治疗）？', a: '表现：6个月–3岁起病缓慢；烦躁不安、精神不振、食欲缺乏、皮肤黏膜苍白（口唇、甲床、手掌明显）；肝脾淋巴结轻度肿大；异食癖（年长儿）；易感染（T细胞功能减弱，CD4/CD8降低）；神经精神改变（注意力不集中、尿去甲肾上腺素增高）。\n实验室（缺铁进展顺序）：储存铁先减少→血清铁蛋白<10ng/ml→血清铁<50μg/dl、总铁结合力>350μg/dl、转铁蛋白饱和度<15%（<15%时Hb合成减少，红细胞游离原卟啉FEP堆积，FEP/Hgb>3μg/g异常）→小细胞低色素血象（Hb降低尤甚，MCV<80fl可低至51fl，MCH<26pg，MCHC<0.30）→骨髓红系增生旺盛（中晚幼红增加，胞质成熟落后于胞核，铁粒幼细胞减少或消失）。网织红细胞百分数正常但绝对值低。\n铁剂治疗：口服硫酸亚铁（元素铁4–6mg/kg/d），治疗后48–72小时精神和食欲先好转，网织红细胞2–3天上升5–7天达峰，2–3周后Hb正常后继续服6–8周补足储存铁；注射铁剂慎用（过敏）。' },
{ m: '29B', q: '维生素B₁₂缺乏性巨幼红细胞贫血的机制、表现与治疗？', a: '机制：B₁₂参与5-甲基四氢叶酸转变为四氢叶酸，缺乏时DNA合成障碍→核分裂时间延长、核质发育不平衡（核发育落后于胞质）→巨幼变；甲基丙二酰辅酶A堆积损伤神经系统；红系无效造血。\nB₁₂吸收三阶段：与胃壁细胞内因子结合→回肠远端受体结合→主动转运入肠黏膜。内因子存在时约70%被吸收。\n表现：生后6个月以后发病，皮肤蜡黄、虚胖；特征性神经系统症状（与贫血程度不平行）：表情呆滞、目光发直、少哭不笑、运动发育倒退，不规则震颤（手唇舌→上肢颜面→全身）、腱反射亢进、踝阵挛；消化系统症状早（厌食、呕吐、舌面光滑、舌下门齿处溃疡）。血象MCV>96fl，中性粒细胞核分叶过多（核右移，>5叶）出现在红细胞改变之前；骨髓巨幼变确诊，血清B₁₂<73.8pmol/L（<7.38pmol/L最直接）。\n治疗：VitB₁₂500–1000μg肌注一次（摄入不足者）；网织红细胞第3天上升、5–7天达峰；开始治疗时不应给叶酸（可加重神经症状）；震颤消失需1个月以上；极重者输血。\n鉴别诊断：地贫（靶形细胞、HbA2及F增高、血清铁高）、肺含铁血黄素沉着症、铁粒幼细胞贫血（环形铁粒幼、铁治疗无效）、慢性感染性贫血（血清铁和结合力皆低）、铅中毒（嗜碱性点彩、FEP/Hgb可>17.5μg/g）。' },
{ m: '29B', q: '叶酸缺乏性巨幼红细胞贫血与VitB₁₂缺乏的鉴别要点？', a: '叶酸：绿叶蔬菜富含，不耐热（加热破坏50–100%）；需要量婴儿60μg/d、儿童100μg/d；70%储存于肝，新生儿血清叶酸约24ng/ml，3–4个月降至10ng/ml。\n病因：摄入不足（羊乳或蒸发乳喂养）、吸收不良（慢性腹泻、粥样泻）、药物（甲氨蝶呤抗叶酸、苯妥英钠）、需要增加（感染、甲亢、溶血、早产儿）、排泄增加（肝病、透析、VitB₁₂缺乏）。\n与B₁₂缺乏鉴别要点：除先天性叶酸吸收障碍外均不出现神经系统症状；血象骨髓象不能区别；血清叶酸<3ng/ml确诊；试验性治疗：生理剂量叶酸50–100μg口服，24–48小时后网织红细胞上升（此量对B₁₂缺乏无效）。\n治疗：叶酸1–5mg/d口服+维生素C，3–4周；抗叶酸药引起者用四氢叶酸钙3–6mg/d肌注（白血病患儿禁用）。' },
{ m: '29B', q: '营养性混合性贫血与慢性病贫血（感染、肾衰、肝病）的特点？', a: '混合性贫血：铁和VitB₁₂/叶酸同时缺乏，大小细胞特点兼有（红细胞大小悬殊、低色素性或中空大红细胞），治疗铁剂+B₁₂/叶酸合并应用。\n慢性病贫血：正细胞正色素性（重者小细胞低色素），机制为红细胞寿命缩短、骨髓代偿弱、铁利用障碍、EPO减少（肾衰）；实验室：血清铁降低但总铁结合力不增高、血清铁蛋白增高（区别于缺铁性贫血的要点）、FEP不增高或轻增；网织红细胞正常或降低；骨髓含铁血黄素增多；治疗针对原发病，铁剂与叶酸、B₁₂无效；重度肾性贫血输浓缩红细胞。' },
{ m: '29F', q: '纯红细胞再生障碍性贫血（PRCA）与Diamond-Blackfan贫血？', a: 'PRCA：仅红系发育障碍，白细胞血小板正常；正色素性、网织红细胞显著减少或缺如；骨髓有核红细胞极度减少（粒红比可低至50:1甚至200:1），粒系巨核系正常。\n先天性DBA：生后2–3个月发病（15%生后数日），核糖体基因突变（RPS19占25%，RPS17/19/24、RPL5/11/35共50%）；约1/3合并先天畸形（拇指三指节畸形、先心、尿道畸形、Turner外貌但核型正常）；HbF高于同年龄；20%自发缓解，60%肾上腺皮质激素有效，无效者异基因造血干细胞移植。需与TEC（儿童一过性原始红细胞缺乏症）鉴别。\n获得性：原发性、继发性（胸腺瘤、血液肿瘤、感染HIV/EBV/CMV/B19、自身免疫病、药物、严重肾衰）。' },
{ m: '29F', q: '再生障碍性贫血的发病机制、病因与临床表现？', a: '定义：骨髓有核细胞增生减低+外周血全血细胞减少的骨髓衰竭性疾病；贫血、出血、反复感染，无肝脾淋巴结肿大。\n机制：①造血干/祖细胞内在缺陷（CD34+细胞减少68%）；②异常免疫反应——活化的细胞毒性T淋巴细胞损伤造血（最主要）；③造血微环境支持缺陷；④遗传倾向。\n先天性：范科尼贫血（FA，常隐，多发畸形——拇指/桡骨缺如、皮肤咖啡斑、约25%马蹄肾，5–10%发展为急性白血病，丝裂霉素C染色体断裂试验确诊，造血干细胞移植是根治唯一有效措施）；先天性角化不良（DC，X连锁，网状色素沉着+营养不良性指趾甲+黏膜白斑）；Shwachman-Diamond综合征（胰腺外分泌不全+脂肪泻）；CAMT（无巨核细胞性血小板减少）。\n获得性：特发性50%；继发性——氯霉素（特异反应、剂量无关、不可逆、服药4天内可发病、口服为主）、保泰松、苯妥英钠、苯、放射线、肝炎病毒（非甲/乙/丙）、EBV、B19、CMV、PNH可继发再障。\n表现：起病多缓慢，皮下瘀点瘀斑鼻出血；粒细胞减少致口腔黏膜溃疡坏死性口炎咽峡炎败血症。' },
{ m: '29F', q: '再障的诊断标准与分型（SAA/VSAA/NSAA）？', a: '血常规：红细胞、粒细胞、血小板减少（两系减少必须包含血小板减少），至少符合：①Hb<100g/L；②PLT<100×10⁹/L；③ANC<1.5×10⁹/L中的两项；网织红细胞校正<1%，淋巴细胞比例增高。\n骨髓：穿刺增生减低或活跃、小粒造血细胞减少、巨核细胞明显减少或缺如；活检造血组织减少、脂肪/非造血细胞增多、纤维组织无明显增生。\nSAA：骨髓增生<正常25%（或25–50%但残余造血<30%）；血象三项中两项：ANC<0.5×10⁹/L、PLT<20×10⁹/L、Ret绝对值<20×10⁹/L。\nVSAA：SAA条件+ANC<0.2×10⁹/L。NSAA：未达SAA和VSAA标准。\n鉴别：低增生白血病、MDS、PNH、IBMF。\n治疗：去除病因；支持（红细胞输注指征Hb<60g/L、PLT<10×10⁹/L预防性输血小板、铁过载血清铁蛋白>1000μg/L祛铁）；SAA/VSAA首选HLA相合同胞供者异基因造血干细胞移植，无供者行IST（ATG/ALG+CsA 3–5mg/kg/d，谷浓度100–200μg/L，疗程2–3年）；NSAA用CsA±雄激素（司坦唑醇0.1mg/kg/d）。' },
{ m: '29F', q: '铁粒幼细胞贫血与先天性红细胞生成异常性贫血（CDA）？', a: '铁粒幼细胞贫血：血红素合成障碍+铁利用不良，骨髓大量环形铁粒幼红细胞（铁粒绕核≥1/3环），铁剂治疗无效。遗传性（性连锁ALA合成酶缺乏）或获得性（特发性、药物如异烟肼/氯霉素/铅）。实验室：低色素性贫血但网织红细胞不高、血清铁增高（可达200μg/dl）、转铁蛋白饱和度>90%；诊断3要点：低色素贫血Ret不高+骨髓环形铁粒幼+血清铁增高。应首先试用大剂量维生素B₆（50–200mg/d），有效者称吡哆醇效应性贫血；7–10%获得性特发性可转MDS→急非淋。\nCDA：遗传性红系无效造血，慢性难治性贫血+间断黄疸，肝脾大；骨髓红系增生5–10倍，双核/多核幼红细胞>10%为主要诊断依据；Ⅱ型最常见（60%，SEC23B基因，又称HEMPAS——遗传性多核幼红细胞伴阳性酸溶血试验），Ⅰ型CDAN1基因；特点：无效造血、多核红细胞、继发血色病。' },
{ m: '29F', q: '骨髓增生异常综合征（MDS）的儿童诊断分型与治疗？', a: '特征：克隆性造血干/祖细胞发育异常（dysplasia）+无效造血，外周血细胞减少，高风险转AML。儿童MDS占儿童造血系统肿瘤不足5%。\n儿童MDS最低诊断标准（Hasle 2003，符合4项中2项）：①不能解释的持续性血细胞减少；②至少二系形态学发育异常；③获得性克隆性细胞遗传学异常；④原始细胞增高（≥5%）。\nWHO分型：难治性血细胞减少RC（外周血原始细胞<2%，骨髓<5%）；RAEB（外周血2–19%，骨髓5–19%）；RAEB-T（20–29%）。2016版按原始细胞0.05–0.20分EB1和EB2。有原发性AML特征性染色体/融合基因异常[t(8;21)、t(15;17)、inv(16)、t(9;11)]不管原始细胞多少均诊断AML。\n特点：-7是最常见染色体异常（原发性40%）；JMML（幼年型慢粒单）为特殊亚型，标准：WBC>13×10⁹/L、单核细胞>1×10⁹/L、外周血有幼稚粒细胞、骨髓原始细胞<30%、除外Ph染色体/bcr-abl；近90%伴PTPN11、KRAS、NRAS、CBL或NF1突变。\n治疗：绝大多数儿童MDS应首选造血干细胞移植（唯一根治方法）；有-7或复杂核型RC确诊后尽早SCT。' },
{ m: '29C', q: '溶血性贫血的分类（血管内vs血管外）与临床表现？', a: '定义：红细胞破坏加速、寿命缩短（正常100–120天，新生儿80–100天），骨髓代偿增强（可达6–8倍）仍不足；寿命短于15–20天即引起贫血。小儿5–7岁前骨髓几乎全为红髓、代偿差，溶血时髓外造血（脾肝淋巴结肿大）较成人重。\n血管内溶血：血红蛋白直接释放入血→血红蛋白血症（血浆游离Hb>1250mg/L时出现血红蛋白尿）；结合珠蛋白（Hp）明显降低；高铁血红素白蛋白血症；Rous试验（含铁血黄素尿）阳性；黄疸轻-中；切脾无效。多见后天获得性（PNH、血型不合输血、G6PD）。\n血管外溶血：异常RBC在脾肝被单核巨噬细胞破坏→未结合胆红素增高、尿胆原粪胆原增加；无Hb血症；Hp正常或轻降；脾大明显；切脾有效。多见遗传性红细胞缺陷。\n慢性先天性溶血表现：贫血、黄疸、肝脾大、间发危象、胆结石（黑色素结石）；骨骼改变（塔形头颅、额颞部增厚、毛刷样改变）。\n危象：①溶血危象——感染诱发，Hb骤降、黄疸加重、血红蛋白尿、高热；②再生障碍性危象——B19细小病毒抑制红系，网织红细胞减低，发生率2.4%，常见于HS、地贫、PK缺乏，持续约2周自恢复。' },
{ m: '29C', q: '溶血性贫血的诊断步骤与实验室检查？', a: '第一步明确溶血存在：\n破坏增加：贫血、间接胆红素增高、粪胆原/尿胆原增加、血清结合珠蛋白降低（正常0.7–1.5g/L；新生儿期极低，诊断意义不大；肝病、感染时也降低）、血红蛋白血症/血红蛋白尿（游离Hb>1250mg/L）、Rous试验阳性。\n代偿增生：网织红细胞增高（急性可达60%，慢性>10%；若低于正常考虑再障危象）、外周血幼红细胞、骨髓粒红比例降低或倒置、骨骼X线改变。\n第二步确定病因：\n①红细胞形态：球形→HS（做渗透脆性、自溶试验）；椭圆形>25%→HE；口形>5%→口形增多症；靶形→地贫/Hb病。\n②Coombs试验：首次发病必做，除外AIHA。\n③Coombs阴性：红细胞酶测定（G6PD、PK活性）；异丙醇试验、包涵体试验（不稳定血红蛋白病）；血红蛋白电泳+基因（地贫）。' },
{ m: '29C', q: '遗传性球形红细胞增多症（HS）的要点？', a: '常染色体显性遗传为主（少数隐性；15–20%双亲无证据，散发病例为基因突变），发病率(20–30)/10万，占遗传性红细胞膜缺陷病首位。\n机制：膜蛋白基因突变——锚蛋白+膜收缩蛋白联合缺乏最常见，带3蛋白缺乏、单纯收缩蛋白缺乏等；膜表面积丢失→球形变，变形性差，在脾窦被扣留破坏。\n四大表现：贫血、黄疸、脾大、球形红细胞增多（脾大99%、黄疸91%）。约25%症状轻微无贫血（代偿性）。诱因：感染最常见。\n实验室：血涂片小球形红细胞增多；红细胞渗透脆性增高；自溶试验阳性、葡萄糖不能纠正；网织红细胞增高。\n治疗：脾切除有效（血管外溶血），适用于贫血重、依赖输血者；术后注意严重感染风险（肺炎球菌等）；胆结石需胆囊切除。' },
  { m: '29E', q: 'G6PD缺乏症的遗传方式和流行病学特点？', a: '性连锁不完全显性遗传，基因位于Xq28。\n男性为半合子，女性为杂合子（Lyon假说：含正常和缺陷两群红细胞嵌合体，约1/3女性杂合子酶活性显著减低也可发病）。\n男患者只传女儿，女患者传男孩又传女儿，故男性患者多。\n流行呈南高北低：广东、海南、广西、云南、贵州、四川等地发生率4%~15%（个别达40%）。\n已知突变型122种以上，按酶活性及临床表现分五类：①严重缺乏伴CNSHA；②严重缺乏伴代偿性溶血；③轻中度缺乏（10%~60%）；④轻度缺乏或正常；⑤酶活性增高（Hektoen型，无症状）。' },
  { m: '29E', q: 'G6PD缺乏的溶血机制？', a: 'G6PD是磷酸戊糖途径限速酶，催化G6P→6-PG并使NADP还原为NADPH。\nNADPH使氧化型谷胱甘肽（GSSG）还原为还原型谷胱甘肽（GSH），GSH维持红细胞膜含-SH蛋白完整、并使H2O2还原为水。\nG6PD缺陷时NADPH生成不足→GSH减少→H2O2氧化损伤膜蛋白和酶蛋白，Hbβ链93位半胱氨酸与GSH结合成GSS-Hb并被氧化为高铁血红蛋白（MetHb）→形成变性珠蛋白小体（Heinz小体）→红细胞变硬、可塑性下降，通过脾时被摘除、膜面积减少变为球形而破裂溶血。\n溶血自限性特点：酶活性随红细胞衰老下降50%，年轻红细胞可代偿，故多无溶血自限性差；仅中度缺乏者自限（仅老红细胞破坏）。' },
  { m: '29E', q: '蚕豆病的临床特点？', a: '进食干/鲜蚕豆或蚕豆制品（豆腐、酱油）后发生的急性血管内溶血，G6PD缺陷是基本内因（但缺陷者吃蚕豆后仅少数发病，且与食量无关，乳母吃蚕豆婴儿吸吮乳汁亦可发病）。\n9岁以前小儿多见，多在蚕豆成熟季节，食后数小时至数天（大多1~2天）发病，潜伏期愈短症状愈重。\n轻者轻度溶血无黄疸血红蛋白尿；重者溶血危象：迅速贫血、黄疸、血红蛋白尿（酱油色/浓茶色尿），伴畏寒发热、恶心呕吐、腹痛腰痛；极重型有神志不清、抽搐、休克、急性肾衰，可1~2天内死亡。\n溶血持续1~2天或10天左右逐渐自愈。' },
  { m: '29E', q: '可诱发G6PD缺陷溶血的药物有哪些？', a: '退热止痛药：乙酰水杨酸（阿司匹林）、非那西丁、安替匹林、匹拉米洞；\n抗疟药：伯氨喹啉、扑疟喹、阿的平、奎宁；\n磺胺类：氯苯磺胺、磺胺乙酰、柳氮磺胺吡啶、磺胺异噁唑等；\n呋喃类：呋喃坦啶、呋喃唑酮（痢特灵）、呋喃西林；\n其他：维生素K（水溶性）、氯霉素、奎尼丁、氯喹、甲苯磺丁脲、大剂量维生素C、萘（樟脑丸）、二巯基丙醇、亚甲蓝、苯肼、丙磺舒。\n中药：蚕豆、熊胆、川连。\n不同变异型对同一药物敏感性不同（如氯霉素可诱发地中海型重度缺乏者溶血，而A型/广东型不引起）。' },
  { m: '29E', q: 'G6PD缺乏症的实验室检查和确诊依据？', a: '①血象：急性溶血时RBC和Hb迅速下降，可见有核红细胞、多染性红细胞、红细胞碎片，网织红细胞增加。\n②Heinz小体（变性珠蛋白小体）试验：溶血进行阶段阳性、停止后阴性，CNSHA持续阳性；非特异（HbH病、不稳定血红蛋白病等也可阳性）。\n③高铁血红蛋白还原试验：常用筛选法，定量法还原率>75%正常、74%~31%中间（杂合子）、<31%显著缺陷。\n④荧光斑点试验：NADPH长波紫外线下显荧光，正常10分钟内显荧光、中间缺乏10~30分钟、严重缺乏30分钟不显；特异性高、简便。\n⑤G6PD/6-PGD比值法：正常1.0~1.6，<1.0为缺乏（可查出更多杂合子）。\n⑥G6PD活性直接测定：确诊重要依据，正常成人约5单位（2.8~9.6），脐血6.9单位，显著缺陷者降至0~0.6单位。\n诊断：任一临床类型+筛选或直接测定阳性+Heinz小体阳性，排除其他溶血原因。' },
  { m: '29E', q: 'G6PD缺乏症的防治要点？', a: '预防为主：\n①群体预防：高发区普查或婚前、产前、新生儿脐血筛查；\n②个体预防：发放"G6PD缺乏者携带卡"列明禁用慎用药物食物；孕妇（夫妇任一方缺乏）产前2~4周每晚服苯巴比妥0.03~0.06g可减轻新生儿高胆红素血症；分娩取脐血筛查；母产前及婴儿忌氧化性药物、忌樟脑丸贮衣、母忌蚕豆；积极防治新生儿感染。\n治疗：无特殊治疗，无溶血不需治疗。溶血时去除诱因（停可疑药、停食蚕豆、治感染）；轻症支持补液；重者纠正水电解质、酸中毒，碱化尿液防肾衰；Hb≤60g/L或心脑功能损害者及时输浓缩红细胞并监护至血红蛋白尿消失；可试用维生素E、还原型谷胱甘肽；新生儿黄疸按高胆红素血症处理；CNSHA依赖输血者切脾可能有效，有条件者行造血干细胞移植。' },
  { m: '29E', q: '红细胞丙酮酸激酶（PK）缺陷症的特点？', a: '无氧糖酵解途径中最常见的遗传性酶异常病，旧称先天性非球形细胞溶血性贫血Ⅱ型；北欧多见，基因定位于1q21，已确定5种以上点突变。\n机制：PK催化磷酸烯醇丙酮酸→丙酮酸并使ADP磷酸化为ATP；缺陷时红细胞ATP生成明显减少，离子梯度不能维持（K+丢失、Ca2+积聚），膜僵化皱缩；脾窦内滞留的PK缺陷网织红细胞ATP产生更受损害，被选择性破坏；同时2,3-DPG、磷酸烯醇丙酮酸堆积。\n临床：纯合子/双重杂合子表现为新生儿溶血性贫血和CNSHA；自溶试验Ⅱ型阳性。\n确诊：红细胞PK荧光斑点试验及PK活性定量测定。\n治疗：无特殊治疗，防感染、每日叶酸5mg；再障危象或贫血重者输血；贫血严重者脾切除可改善（脾对PK缺陷网织红细胞选择性破坏）；有条件者异基因造血干细胞移植根治。' },
  { m: '29E', q: '嘧啶5′-核苷酸酶（P-5′-N）缺乏症和葡萄糖磷酸异构酶（GPI）缺乏症的特点？', a: 'P-5′-N缺乏症：常染色体隐性遗传，锌依赖金属酶（受Cr2+、Zn2+、Mg2+激活，Hg2+、Pb2+抑制），是RNA分解代谢所需酶；缺陷时CMP/UMP积聚反馈抑制RNA降解，形成红细胞内嗜碱性点彩颗粒（核糖体），嘧啶类核苷酸>80%（正常<3%），ATP减少致溶血。临床自幼慢性溶血，外周血嗜碱性点彩红细胞0.04~0.5（正常<0.03）；可伴智能发育障碍或惊厥（脑组织P-5′-N缺乏）；诊断依据自幼中度以上慢性溶血+点彩细胞增多+筛查试验及活性测定确诊；需除外继发性缺乏（PNH、MDS）；避免接触铅汞，脾切除有一定疗效，可异基因造血干细胞移植。\nGPI缺乏症：常染色体隐性遗传，基因在第19号染色体；是第4种较常见的溶血性贫血红细胞酶病；GPI活性降至正常40%以下即出现溶血，30%表现为新生儿高胆红素血症；溶血常是唯一临床表现；GPI荧光斑点筛选试验及定量测定确诊；重者输血，脾切除可改善，可造血干细胞移植。' },
  { m: '29D', q: 'α-地中海贫血的分型（按4个α基因缺失数）？', a: 'α-珠蛋白基因位于16号染色体短臂（16p13.33-p13.11），每条染色体一对α基因，每个细胞共4个α基因。\n①缺失1个α基因（-α/αα）：静止型α-地贫，无临床及血液学异常，脐血HbBarts约1%~2%，3个月内消失。\n②缺失2个α基因（--/αα或-α/-α）：标准型α-地贫，无贫血或轻度贫血，感染/妊娠时加重，轻度小细胞低色素性贫血，脐血HbBarts约3.4%~14%，6个月内消失，需与IDA鉴别。\n③缺失3个α基因（--/-α）：血红蛋白H病（中间型），多于3岁内发病；多余β链聚合成β4（HbH），不稳定易氧化变性形成包涵体损伤胞膜。\n④4个α基因全部缺失（--/--）：Hb-Barts胎儿水肿综合征，α链完全缺如，多余γ链聚合成γ4（HbBarts），胎儿多死亡。\n另有非缺失型α-地贫（点突变）：αConstant Spring（终止密码突变）、αQuong Sze（125密码子亮氨酸→脯氨酸，高度不稳定）、PolyA信号突变；我国HbH病中非缺失型约占50%，表现比缺失型重。' },
  { m: '29D', q: 'HbBarts胎儿水肿综合征的临床和实验室特点？', a: '4个α基因全部缺失（--/--）的重型α-地贫，无α链合成，胎儿后期大量γ4（HbBarts）及少量β4（Hb-H），胚胎早期ζ链持续合成组成Hb Portland。\nHbBarts具高度氧亲和力和极不稳定→宫内严重慢性溶血、组织严重缺氧、心力衰竭、水肿→流产、死胎。\n双亲均为α0地贫杂合子，同胞发病率约1/4；孕妇常有反复流产、死产、水肿胎分娩史，妊娠高血压综合征发生率高达78%。\n临床：绝大多数妊娠30~40周（平均34周）胎儿死于宫内或娩出后短期死亡；全身重度水肿、腹水呈蛙腹，重度贫血苍白，可有轻度黄疸，肝大比脾大明显，皮肤出血点；胎盘巨大、粗厚、苍白、质脆。\n实验室：Hb30~110g/L（平均49~70），网织红细胞0.038~0.48，有核红细胞可达76~522/100白细胞；红细胞明显大小不等、异形、靶形及特征性低色素性巨红细胞；Hb-H包涵体和Heinz小体生成试验阳性；渗透脆性降低、异丙醇试验阳性；HbBarts含量70%~100%。\n需与新生儿同族免疫性溶血所致胎儿水肿鉴别。' },
  { m: '29D', q: '重型β-地中海贫血（Cooley贫血）的病理生理和临床表现？', a: '为β0纯合子、β+/β0双重杂合子或δβ0纯合子；双亲均为β-地贫杂合子，子女获重症概率25%、杂合子50%。\n病理生理：β链合成受抑→HbA减少或消失→多余α链聚合（α2α、α4）沉积成α链包涵体附着胞膜→膜僵硬，骨髓内破坏（无效造血），外周红细胞寿命缩短→溶血；HbF氧亲和力高→组织缺氧→EPO大量分泌→骨髓极度扩张→骨骼改变。\n临床：出生时无症状，生后3~6个月内发病（50%），发病越早病情越重；严重慢性进行性贫血，约3~4周输血一次；骨骼改变自掌骨→长骨、肋骨→颅骨，呈特殊面容（头大、额部突起、鼻梁低陷、眼距增宽、眼睑水肿即唐氏综合征面容）；皮肤斑状色素沉着，生长发育停滞；肝脾日渐肿大以脾大明显可达盆腔；并发含铁血黄素沉着症（肠道铁吸收达80%+反复输血）→心力衰竭、肝纤维化及肝功能衰竭（主要死因）、糖尿病等内分泌障碍；不治疗多于5岁前死亡。\n实验室：小细胞低色素性贫血（RBC<2.0×10¹²/L），靶形、嗜碱性点彩、有核红细胞增多，网织红细胞增加；HbF含量20%~99.6%（平均60%+），HbA2正常或增高；Hb电泳为主要诊断依据，骨髓中晚幼红细胞含α链包涵体（甲基紫染色）。' },
  { m: '29D', q: '中间型和轻型β-地中海贫血的特点及鉴别？', a: '中间型：包括β+纯合子、某些β/β+双重杂合子、非典型β地贫杂合子、合并α地贫和δβ地贫。特点：①发病较晚（常4~5岁）；②中度贫血Hb60~90g/L；③轻度肝脾大；④外周血形态类似重型，HbF增高，HbA可稍高、正常或降低；⑤输血量小或不必输血仍可维持生命。\n轻型（β地贫特征）：β0/β+杂合子状态，轻度小细胞低色素性贫血（Hb100~120g/L，MCV<80fl），可有轻度黄疸和脾大；红细胞中央浅染、异形（棒状、椭圆形）及靶形，嗜碱性点彩；渗透脆性降低；HbA2 3.5%~8%，约1/2病例HbF升高（1%~5%）；红细胞游离原卟啉（FEP）正常、铁剂治疗无效。\n轻型诊断依据：小细胞低色素性贫血+异形红细胞+HbA2或HbF升高+FEP正常+铁剂无效+基因诊断。\n鉴别：尤其婴幼儿期常合并缺铁，合并缺铁时HbA2降低或正常，纠正缺铁后回升——纠正缺铁后再判断。' },
  { m: '29D', q: '地中海贫血的治疗和预防要点？', a: '治疗原则：轻型不需治疗；中间型α-地贫避免感染和过氧化性药物，中度贫血伴脾大者可切脾；中间型β-地贫一般不输血，感染、应激、手术时可适当输浓缩红细胞；重型β-地贫：高量输血+祛铁是基本措施，造血干细胞移植是唯一根治方法。\n输血：低量输血维持Hb60~70g/L（致血色病、生存质量差）；高量输血——先反复输至Hb120~140g/L，以后每3~4周Hb≤80~90g/L时输浓缩红细胞10~15ml/kg，维持Hb>100g/L，可纠正缺氧、减少肠道铁吸收、抑制髓扩张和脾大、改善生长发育。\n祛铁：铁累积>20g出现中毒表现。去铁胺（DFO）20~50mg/(kg·d)腹壁皮下注射8~12小时、每周5~6天，2~3岁后或输血10~20次后且SF>1000μg/L开始；SF>3000μg/L或铁负荷性心脏病时50~70mg/(kg·d)持续24小时静滴；加维生素C（100~200mg/d，大剂量禁忌）可增加尿铁排泄1倍。DFO大剂量+SF<2000μg/L为毒性危险因素，治疗指数TI=每日DFO剂量÷SF，TI<0.025一般无毒性。新型口服铁螯合剂defeiprone（L1）等。\n脾切除指征（重型伴脾亢）：①年输血量>200ml/kg；②脾亢（持续白细胞或血小板减少）；③巨脾压迫症状；④年龄>5岁。输血商TQ>1提示早期脾亢。可用大部分脾栓塞（PSE）代替，PSE组IgM高、感染率低。\n其他：羟基脲（Hu）调节珠蛋白基因表达，5~7天显效，Hb上升20~45g/L，对中间型效果明显；基因治疗处实验阶段。\n预防：婚前地贫筛查避免轻型患者联婚；产前诊断（孕4个月取绒毛/羊水/脐血PCR），重型/中间型应终止妊娠。' },
  { m: '29D', q: '异常血红蛋白病的分类和血红蛋白E病的特点？', a: '异常血红蛋白病是珠蛋白结构变异（氨基酸置换、缺失或增加）所致，全世界已发现472种以上，中国60多种；仅少数（约40%）有临床表现。\n分类：①不稳定血红蛋白病（先天性Heinz小体溶血性贫血，如HbH、HbE）；②多聚性血红蛋白病（HbS、HbC）；③氧亲和力增高的Hb病（代偿性红细胞增多）；④氧亲和力降低的Hb病（杂合子以溶血为主，可见发绀）；⑤高铁血红蛋白血症（HbM，发绀）；⑥其他。\nHbE病：β珠蛋白基因CD26（G→A）突变使谷氨酸→赖氨酸，慢速不稳定异常Hb；东南亚和我国常见（广东、广西、云南仅次于地贫）。\n分型：HbE特征（杂合子）无贫血或轻度小细胞低色素性贫血，可有轻度脾大，HbE含量30%~45%；HbE纯合子表现类似β-地贫中间型，中度溶血性贫血、黄疸、肝脾大，靶形红细胞25%~75%，HbE达72%~92%；HbE/β-地贫双重杂合子表现类似重型或中间型β-地贫，HbE约30%~70%、HbF30%~70%、少量或无HbA。\n诊断依赖Hb电泳（pH8.6时HbE与HbA2位置相同，pH6.5时可分开），可进一步肽链或氨基酸分析；HbE特征无需治疗，纯合子和复合杂合子按β-地贫重型/中间型治疗，积极防治感染、忌用氧化性药物。' },
  { m: '29D', q: '不稳定血红蛋白病和镰状细胞病的特点？', a: '不稳定血红蛋白病（UHb）：珠蛋白结构异常使Hb极不稳定，易氧化离解、珠蛋白变性沉淀形成Heinz小体，改变膜通透性及可塑性而溶血；常染色体显性遗传，杂合子即可发病；已发现130余种；共同特征为轻中度溶血性贫血伴Heinz小体形成，氧化性药物和感染可诱发急性溶血（类似G6PD缺乏过程），UHb筛选试验阳性；重症者可考虑异基因造血干细胞移植。\n镰状细胞病（HbS病）：β链第6位亲水谷氨酸被疏水缬氨酸置换（α2β2 6谷→缬）的常染色体显性溶血病；多见非洲美洲黑人，我国罕见。低氧时HbS溶解度比HbA低5倍，分子聚合成纤丝状胶凝使红细胞镰变（可逆），镰状细胞黏滞性增加、易破坏致血管内外溶血，堵塞小血管致栓塞和疼痛危象。\n三型：镰状细胞性贫血（纯合子，婴儿3~6个月至2岁发病，慢性溶血+疼痛危象，生长迟缓、四肢细长、性发育延迟）；镰状细胞特征（杂合子，一般无症状，缺氧时可溶血，应避免缺氧）；混合型（HbS/C、HbS/β-地贫等）。\n确诊：Hb电泳（pH8.6时HbS位于HbA与HbA2之间；纯合子HbS>80%，特征者25%~45%）、镰变试验（缺氧条件下红细胞变镰状）、珠蛋白指纹及氨基酸分析。' },
  { m: '29C', q: '自身免疫性溶血性贫血（AIHA）的分类和溶血机制？', a: '定义：体内产生与红细胞自身抗原反应的自身抗体并吸附于红细胞表面引起破坏；占小儿全部溶血性贫血约1/4，77%发生于10岁以下，男性略多。\n分类：①按病因分特发性（小儿约70%）与继发性（病毒感染、肺炎支原体、细菌感染、螺旋体感染、结缔组织病、药物、免疫缺陷病、恶性肿瘤、骨髓移植）；②按抗体性质分温抗体型（37℃作用最强，温性不完全抗体IgG型或温性溶血素IgM型）和冷抗体型（4℃作用最强，完全抗体：冷凝集素IgM型引起冷凝集素综合征，冷溶血素IgG型引起阵发性寒冷性血红蛋白尿）；③按病程分急性型、亚急性型和慢性型。\n溶血机制：①免疫清除——被抗体调理的红细胞经巨噬细胞Fc受体（IgG1、IgG3）和C3b受体识别，主要在脾、部分在肝被清除；至少两个IgG分子结合方可引发C3b沉积，IgG+C3b同时存在加速清除；②巨噬细胞消化部分红细胞膜产生球形细胞，在脾窦微循环破裂（血管外溶血主要机制）；③补体膜攻击复合物直接溶解红细胞（血管内溶血）；④弱凝集作用。\n温抗体型主要为血管外溶血，有补体参与时可发生血管内溶血。' },
  { m: '29C', q: '温抗体型AIHA的临床分型和冷凝集素病、阵发性冷性血红蛋白尿症（PCH）的特点？', a: '温抗体型：\n①急性型：婴幼儿多见，高峰约3岁，男多；发病前1~2周急性感染史；急骤起病，发热、寒战、进行性贫血、黄疸、脾大，常发生血红蛋白尿，少数合并血小板减少（Evans综合征）；自限性，1~2周后溶血自行停止，3个月内完全康复者50%；激素疗效好。\n②亚急性型：9岁以下，继发性占多数，前驱1~2周流感或菌苗注射史；起病缓慢，贫血、黄疸、肝脾大；病程一般约2年，反复发作；合并血小板减少者可因出血死亡。\n③慢性型：学龄儿童为主，原发性占多数；起病缓慢，进行性或间歇发作溶血，反复感染加重，常伴血红蛋白尿；原发者病程10~20年，继发者预后视原发病，合并血小板减少者预后大多严重。\n冷凝集素病：急性者多为5岁以下，继发于支原体肺炎、传单、CMV感染等；急骤起病，肢端发绀和雷诺征，自限性，原发病痊愈本病即愈。冷凝集素为IgM，低温+补体参与下凝集自身红细胞致血管内溶血；冷凝集素试验4℃滴度可高达1:1000以上，DAT阳性。\nPCH：D-L（Donath-Landsteiner）冷热抗体，16℃以下与红细胞膜P血型抗原结合，复温时激活补体传统途径致急性血管内溶血；我国不少见，1岁后均可发病，多继发于胎传梅毒、麻疹、腮腺炎、水痘；受冷后急骤发热、寒战、腹痛、腰背痛、贫血、血红蛋白尿，持续数小时缓解，再受冷可复发；冷热溶血试验阳性，含铁血黄素尿（反复发作者），发作时DAT阳性。' },
  { m: '29C', q: 'AIHA的实验室检查和治疗？', a: '实验室：①血象——正细胞正色素性贫血，网织红细胞升高（再障危象时极度减少），骨髓红系明显增生；②渗透脆性试验发病时增高；③血清间接胆红素增加、尿胆原增加、结合珠蛋白降低；④抗人球蛋白试验（Coombs试验）阳性是诊断重要依据：直接法（DAT）测吸附于红细胞表面的不完全抗体，间接法（IAT）测血清游离抗体；2%~4%患者始终阴性（每个红细胞IgG分子达200~500个以上DAT才阳性，而40~200个即可引起溶血）；⑤酶处理红细胞凝集试验测血清游离抗体。\n治疗：①首先区分原发/继发，继发性先治原发病；②糖皮质激素为温抗体型首选——抑制巨噬细胞吞噬、减少膜与抗体结合、减少抗体生成；急性重症甲基泼尼松龙40mg/(m²·d)静滴，轻者泼尼松40~60mg/(m²·d)分3~4次口服，Hb稳定100g/L以上、网织红细胞下降即可减半量，疗程2个月后可停药，长期服者隔日顿服；小儿有效率32%~77%；③免疫抑制剂（激素无效或依赖、脾切无效或复发者）：硫唑嘌呤2~2.5mg/(kg·d)、CTX1.5~2mg/(kg·d)，疗程不短于3个月，试用4周不满意加量或换环孢素A；④脾切除适应证：激素禁忌、大剂量激素无效、需长期大剂量激素维持、激素+免疫抑制剂仍不能控制、经常反复发作；温抗体型术后约50%原发性、30%继发性获缓解；⑤输血应慎重（可因输入补体诱发溶血、配血困难），需输时输洗涤同型浓缩红细胞100ml为宜，缓慢输注，游离血红蛋白增多即停；⑥血浆置换、达那唑（免疫调节+抑制补体与红细胞结合）。\n预后：温抗体型急性型好，慢性型病死率11%~35%；北京儿童医院63例远期治愈率72.7%、病死率5.7%。' },
  { m: '29C', q: '药物诱发的免疫性溶血性贫血的分型和特点？', a: '分四型：\n①半抗原型（青霉素型）：机体产生抗药物（青霉素）抗体，与红细胞-药物结合暴露半抗原决定簇，调理的红细胞在脾内被巨噬细胞吞噬，多为血管外溶血；大剂量青霉素（每日2000万单位以上）才发生，溶血常较轻，停药后很快停止。\n②免疫复合物型（奎尼丁型）：药物或代谢产物与血浆蛋白形成免疫复合物，抗体（多IgM）黏附红细胞并激活补体，少量药物即可引起大量红细胞破坏，血管内溶血，病情重可致急性肾衰；药物有奎宁、奎尼丁、非那西汀、磺胺、氯丙嗪、异烟肼等。\n③自身抗体型（α甲基多巴型）：药物诱发抗体针对正常红细胞抗原（Rh阳性膜），DAT数月至数年后才转阳性；溶血较轻，多在单核巨噬细胞系统破坏，停药后溶血停止、抗体逐渐消失；患者常同时有抗核抗体、类风湿因子。\n④混合型：一种以上机制（如链霉素既致青霉素型又致免疫复合物型）。\n治疗：立即停药；重症血管外溶血可试激素，贫血重输洗涤红细胞，肾衰按溶血尿毒症处理。\n鉴别试验：Coombs试验三型不同（青霉素型IAT+，奎宁型DAT+（补体型），α甲基多巴型DAT+、IAT+）。' },
  { m: '29C', q: '失血性贫血的分类要点和红细胞增多症的诊断标准？', a: '失血性贫血分急性与慢性，按时间分产前、产时、生后失血。\n产前失血：经胎盘失血（约8%胎儿失血0.5~40ml入母体，1%失血>40ml致贫血；诊断靠母血中发现胎儿红细胞——血红蛋白洗脱染色法，胎儿红细胞染红色、成人红细胞不着色；失血>40ml可致休克）、双胎间输血（单绒膜双胎约15%发生，两胎儿Hb相差50g/L以上可诊断，受血者可达200~300g/L并高胆红素血症/胆红素脑病）、失血至胎盘内或胎盘后。\n产时失血：脐带出血、血管破裂、多叶胎盘、产伤（前置胎盘、胎盘早剥、剖宫产切破胎盘）。\n生后失血：新生儿期（脐带结扎不紧、凝血酶原低下、肠道畸形如梅克尔憩室、颅内出血等）；婴儿期鲜牛乳喂养渗出性肠病（每日鲜牛奶1kg以上、低白蛋白血症、大便潜血阳性而肠道无器质性病变、改蒸发奶/豆制代乳粉后贫血迅速纠正）。\n治疗：急性重症立即输血（20ml/kg，来不及配血输O型血10~20ml/kg），慢性失血补铁（元素铁6mg/(kg·d)，足量后服2个月补储存铁）。\n红细胞增多症：儿童Hb>160g/L、红细胞比容>55%、每公斤体重红细胞容量绝对值>35ml，排除血液浓缩即可诊断。\n真性红细胞增多症（PV）：多能干细胞克隆性骨髓增生性肿瘤，95%有JAK2 V617F突变，儿童极罕见；2016 WHO标准：男Hb>16.5g/dl（女>16）或红细胞比容男≥49%（女≥48%）+骨髓三系增生+JAK2突变；主要静脉放血，可用白消安、羟基脲等，中位生存14年。\n继发性红细胞增多症：组织缺氧（青紫型先心、肺部疾患、高原）或EPO增多（肾胚组织瘤、嗜铬细胞瘤、肝细胞瘤等肿瘤，或睾酮、生长激素药物）；主要治原发病，红细胞比容>65%时间断放血换血浆。' },
  { m: '29C', q: '阵发性睡眠性血红蛋白尿症（PNH）的发病机制、诊断和治疗？', a: '后天获得性造血干细胞PIGA基因（Xp22）突变→GPI锚合成缺陷→补体调节蛋白CD55（DAF）、CD59（MIRL）缺乏→红细胞对补体敏感而溶血。\n红细胞分三型：极敏感型（对补体敏感25~30倍）、中度敏感型（3~5倍）、正常型。\n临床特点：睡眠后溶血加重（机制未明，可能与睡眠时酸度升高有关）；可有血红蛋白尿（酱油色尿）；可转化为再障或AML，中位生存约10年，死因多为感染、血栓。\n诊断：Ham试验特异性高、蔗糖溶血试验敏感；目前流式细胞术检测CD55/CD59缺乏是主要诊断依据。\n治疗：急性发作期泼尼松1~2mg/(kg·d)；输洗涤红细胞；禁用阿司匹林等诱发溶血药物；脾切除无效。' },
  { m: '29G', q: '中性粒细胞的生成、调控和功能要点？', a: '发育过程：造血干细胞→原粒→早幼粒→中幼粒（此三者构成增殖池）→晚幼粒→杆状核→分叶核（后三者构成成熟池），分叶核粒细胞构成贮存池。\n外周血粒细胞分两池：循环池（随血循环游走，血常规所测即此池）和边缘池（附着于小静脉和微血管壁），两者动态平衡，运动或药物可使边缘池进入循环池。\n调控：G-CSF促使粒系祖细胞分化（关键因子），GM-CSF、IL-6、IL-17、IL-23、SCF为正向调节，IFN-γ负向调节。\n功能：①趋化功能——在趋化因子作用下向炎症部位定向移动；②调理素功能——Ig和补体参与使微生物吸附于粒细胞膜；③吞噬功能——伪足包围形成吞噬体，脱颗粒释放酶类；④杀菌功能——氧化机制（呼吸爆发：被激活后氧耗急剧上升达正常2~20倍，产生O2-、H2O2、OH-等活性氧）和非氧化机制（溶菌酶、阳离子蛋白、水解酶等不依赖氧杀菌）。' },
  { m: '29G', q: '中性粒细胞增多症的病因？', a: '诊断标准：>1月龄儿童及成人外周血中性粒细胞绝对值>7.5×10⁹/L。\n病因：\n①感染——儿童最常见原因，球菌（葡萄球菌、链球菌、肺炎球菌、脑膜炎球菌）及结核分枝杆菌感染，增多程度与感染程度成比例，有化脓现象者更明显，甚至类白血病反应（白细胞总数可达50×10⁹/L以上或出现幼稚粒细胞）；\n②物理因素——冷、热、运动、哭闹、抽搐、创伤、缺氧致暂时性增高；\n③风湿免疫性疾病——风湿热、类风湿关节炎、结节性多动脉炎、皮肌炎、血管炎，及肾炎、胰腺炎、结肠炎、甲状腺炎等非细菌性炎症；\n④组织坏死——心肌梗死、肺梗死、血栓栓塞；\n⑤代谢紊乱——甲状腺危象、糖尿病酸中毒、尿毒症、肾上腺皮质功能亢进；\n⑥急性失血及溶血——急性失血后2小时即可见白细胞增多，大量溶血可达类白血病反应；\n⑦血液肿瘤——骨髓增生性疾病（慢粒、真红、骨髓纤维化、原发性血小板增多症）及实体瘤（胃癌、肺癌、肝癌、肾癌）；\n⑧药物——肾上腺素、肾上腺皮质激素、洋地黄类、5-羟色胺、组胺、肝素等。\n骨髓象粒系统增生活跃、晚幼粒杆状核增多，可见中毒颗粒、胞质空泡。' },
  { m: '29G', q: '中性粒细胞减少症的定义、分度和发病机制？', a: '定义：外周血中性粒细胞绝对计数（ANC）低于相应年龄正常值。ANC正常低限：新生儿及<1岁婴儿1.0×10⁹/L，1岁以上儿童及成人1.5×10⁹/L；非洲裔美国人、也门犹太人等特定人群ANC正常下限更低（黑色人种ANC可仅0.2~0.6×10⁹/L），称良性家族性中性粒细胞减少症。\n分度：轻度1.0~1.5×10⁹/L；中度0.5~1.0×10⁹/L；重度<0.5×10⁹/L（即粒细胞缺乏症）。\n外周血粒细胞减少的机制：①骨髓生成减少或成熟障碍；②分布异常（边缘池增多）；③破坏或消耗过多（免疫性破坏、严重感染时消耗）；④混合因素。\n临床分两大类：先天性（相对罕见，原发骨髓衰竭综合征，属原发性免疫缺陷病）和获得性（占大多数；感染尤其病毒感染是最常见获得性因素，其次药物、自身免疫病）。\n除ANC外，感染风险还取决于骨髓粒细胞储备、减少发生速度及持续时间、免疫系统其他成分功能。' },
  { m: '29G', q: '先天性中性粒细胞减少症的类型和特点？', a: '①重型先天性中性粒细胞减少症（SCN）：发病率2~3/100万，>20种基因相关。ELANE（中性粒细胞弹性蛋白酶基因）突变致常染色体显性遗传（占50%~60%）；HAX1突变常染色体隐性遗传即Kostmann综合征（约10%）；X连锁见于WAS基因突变；还有G6PC3、GFI1、JAGN1等。生后1年内反复严重感染（口腔溃疡、牙龈炎、鼻窦炎、中耳炎、蜂窝织炎、肛周感染）；ANC常<0.2×10⁹/L，部分伴单核细胞增多；骨髓粒系成熟障碍以早幼粒为主；部分可转化为MDS/AML。治疗：G-CSF（5μg/kg起，每3~5日增加5μg/kg，有效量5~10μg/(kg·d)，90%以上有效），allo-HSCT有效。\n②周期性中性粒细胞减少症（CyN）：常染色体显性，90%以上与19号染色体ELANE基因突变有关（突变仅发生于一个等位基因，与SCN突变位点不同，不转化为AML）。发作间隔平均21天（14~35天），低谷持续3~6天，发作期易感染，发作间期ANC正常；随年龄增长发作减轻，部分5~10年后恢复。治疗：低剂量G-CSF 2~3μg/(kg·d)，维持ANC>0.5×10⁹/L。\n③Shwachman-Diamond综合征（SBDS基因，常隐）：骨髓衰竭（中性粒细胞减少）+胰腺外分泌功能不全+骨骼异常（干骺端发育不良）三联症。\n④WHIM综合征：CXCR4基因突变，成熟中性粒细胞滞留骨髓；中性粒细胞减少、淋巴细胞减少、低丙种球蛋白血症、HPV感染疣。\n⑤糖原贮积症1b型（G6P-ase缺陷）：低血糖、空腹高乳酸血症、肝糖原超负荷伴粒细胞减少。\n⑥眼皮肤白化合并免疫缺陷（OCA-ID）：Chediak-Higashi综合征、Griscelli综合征Ⅱ型、Hermansky-Pudlak综合征Ⅱ型等，眼皮肤白化+反复中性粒细胞减少+进行性周围神经病。\n⑦GATA2缺陷/MonoMac综合征：GATA2为关键造血转录因子，突变致轻中度慢性中性粒细胞减少，伴单核细胞减少，易进展为MDS/AML。' },
  { m: '29G', q: '获得性中性粒细胞减少症的病因与治疗？', a: '①感染相关：最常见。病毒（呼吸道合胞病毒、流感、细小病毒、CMV、麻疹、风疹、水痘）所致多在病程最初几日出现、持续3~8日；细菌（伤寒、志贺菌肠炎、布鲁氏菌病、结核）、寄生虫（黑热病、疟疾）、立克次体（人粒细胞无形体病）亦可。机制：造血祖细胞感染、抗中性粒细胞抗体、脾亢消耗等。治疗：控制原发感染，多数不需G-CSF，重症粒缺感染控制不佳时G-CSF 3~5μg/(kg·d)。\n②药物性：第二大原因（常规定义排除细胞毒药物，用药与减少发生间隔4周内）。机制：免疫介导破坏循环粒细胞，或直接损伤骨髓粒系前体。多在用药后1~2周发生；临床常为口腔溃疡±发热，可伴皮疹、哮喘等过敏表现；停药7~14天后骨髓恢复。治疗：立即停用致病药（无论有无症状），1~3周缓解；发热者血培养+广谱抗生素；G-CSF 4~10μg/(kg·d)反应良好。\n③免疫性（AIN）：中性粒细胞特异性抗体所致，常发生于5~15个月婴儿；感染倾向一般无明显加重（骨髓储备正常）；诊断——单纯粒细胞减少+无畸形/肝脾大/骨痛+骨髓排除恶性病+粒细胞抗体阳性；多自限性不需特异治疗，反复感染者用大剂量丙球（1~3g/kg，2~5日）、泼尼松1mg/(kg·d)（50%~60%有效）、G-CSF 3~10μg/(kg·d)。' },
  { m: '29G', q: '慢性肉芽肿病（CGD）的特点？', a: '中性粒细胞NADPH氧化酶功能缺陷（gp91-phox、p22-phox、p47-phox、p67-phox基因），呼吸爆发产生的超氧化物等减少，不能杀伤过氧化物酶阳性细菌和真菌，感染部位形成肉芽肿。\n临床：幼儿期起频繁迁延不愈感染——化脓性淋巴结炎、皮肤蜂窝织炎、骨髓炎、皮下/肛周脓肿、肺炎；病原体以金黄色葡萄球菌最常见（约50%），其次大肠埃希菌、铜绿假单胞菌、曲霉菌。\n实验室：白细胞总数及分类正常；NBT试验（旧）或流式细胞术呼吸爆发试验（现，更准确）；基因检测确诊。\n治疗：磺胺类或青霉素类预防，预防性抗真菌药降低曲霉菌感染；γ-干扰素增强吞噬细胞功能（常规推荐）；重症粒细胞输注；异基因造血干细胞移植可根治（也改善预后）；基因治疗研究中。' },
  { m: '29G', q: 'Chediak-Higashi综合征和粒细胞髓过氧化物酶（MPO）缺乏症的特点？', a: 'Chediak-Higashi综合征（CHS）：常染色体隐性，LYST基因突变（53个外显子）。中性粒细胞先天溶酶体异常：外周血及骨髓粒细胞内有巨大溶酶体颗粒（瑞氏染色灰绿色、过氧化酶强阳性）——诊断决定性意义；中性粒细胞和单核细胞趋化功能降低，NK细胞和细胞毒T细胞杀伤功能下降，B细胞功能正常；cAMP显著增高、cGMP降低。\n临床：皮肤毛发色素减退甚至白化（虹膜色素浅淡、畏光、眼球震颤）；婴儿期反复化脓性感染（脓皮病、肺炎、深部脓肿）；血小板减少致出血倾向；部分病例发热、黄疸、肝脾和淋巴结肿大呈淋巴瘤样表现（淋巴瘤样综合征）；神经系统受累。多在儿童期死于化脓性感染、出血及疾病快速进展期并发症。\n治疗：控制感染+防治出血；大剂量维生素C、胆碱能药增高cGMP增强趋化；大剂量γ-干扰素改善NK功能；造血干细胞移植可改善感染和免疫，但不能阻止神经系统退变、不能改变色素减退。\nMPO缺乏症：常染色体隐性，基因位于17号染色体长臂，突变致MPO前体蛋白翻译后缺陷；是吞噬细胞最常见的遗传性酶病（发病率约1/4000）。对化脓菌和真菌易感性增加，但大多数患者无明显临床症状（除非合并糖尿病——可致播散性念珠菌病）。实验室：中性粒细胞计数正常、趋化正常，但杀菌作用减弱、活性氧释放降低、过氧化物酶活性明显降低或缺乏。诊断靠MPO活性测定。无症状者不主张预防性抗生素，合并糖尿病等基础病者积极治疗预防感染。' },
  { m: '29G', q: '粒细胞黏附功能缺陷症（LAD）的分型特点？', a: '常染色体隐性遗传，中性粒细胞黏附、趋化及调理功能障碍，感染灶呈干酪样坏死（组织活检示炎症部位无中性粒细胞浸润）。共有表现：自幼反复细菌感染、伤口极难愈合。\nLADⅠ型：ITGB2基因突变，编码整合素CD18亚基，白细胞黏附、趋化和激活均受损；皮肤感染、软组织脓肿、脐带延迟脱落、脐炎、牙周病；流式检测CD11/CD18表达下降。\nLADⅡ型：SLC35C1基因突变（GDP-岩藻糖转运蛋白1），CD15s表达受损；同Ⅰ型但程度较轻、进展较慢，身材矮小、智力发育迟缓，红细胞Bombay（hh）表型；部分患儿口服岩藻糖治疗有效。\nLADⅢ型：FERMT3基因突变（kindlin-3），整合素活化不良，白细胞和血小板黏附受损；同Ⅰ型但常伴出血倾向。\n实验室：白细胞计数正常或增高、中性粒细胞正常或增高，趋化功能试验（趋化值及指数降低），活性氧释放试验正常；基因突变及表面分子检测为确诊依据。\n治疗：预防感染，造血干细胞移植；良好支持护理（预防性抗生素+严格口腔卫生）可延长寿命，但牙周病、细菌感染、伤口延迟愈合仍影响预后。' },
  { m: '29G', q: '嗜酸性粒细胞增多症的定义、分度和分类？', a: '定义：外周血嗜酸粒细胞绝对计数>0.5×10⁹/L。\n分度：轻度0.5~1.5×10⁹/L；中度(1.5~5.0)×10⁹/L；重度>5.0×10⁹/L。\n高嗜酸粒细胞增多症（HE）：嗜酸粒细胞绝对计数>1.5×10⁹/L且持续≥6个月，可伴组织损伤。分四亚型：\n①遗传性（家族性）HE——家族聚集，无免疫缺陷表现、无原发和继发证据；\n②继发性（反应性）HE——继发于感染（寄生虫最常见，还有细菌、结核、真菌）、变态反应性疾病、皮肤病、药物、胃肠病、结缔组织病、呼吸道疾病、肿瘤等，非克隆性增多，机制与原发病的细胞因子释放相关；\n③原发性（克隆性）HE——嗜酸粒细胞为恶性克隆，指伴PDGFRA、PDGFRB或FGFR1重排或PCM1-JAK2的髓系/淋巴系肿瘤；\n④特发性HE——原因不明，无上述基础疾病。\n临床表现：一般症状（发热、乏力、消瘦、肌痛、血管性水肿、浅表淋巴结肿大）；嗜酸粒细胞介导的器官损伤（皮肤：皮疹、湿疹；呼吸道：咳嗽、呼吸困难；心血管：心律失常、心衰、心肌纤维化、瓣膜功能障碍；消化：腹痛、腹泻、消化道出血、肠梗阻；神经：脑栓塞、周围神经炎）。\n儿童嗜酸粒细胞增多主要与寄生虫感染、变态反应性疾病和不明原因有关。' },
  { m: '29G', q: '嗜酸性粒细胞增多症的诊断思路和治疗？', a: '实验室：血常规嗜酸粒细胞增高（出现幼稚细胞提示白血病）；骨髓检查嗜酸粒细胞或前体细胞增多，融合基因及FISH阳性提示骨髓增殖性疾病。\n诊断思路：先查继发原因——变态反应病（血清IgE、特异性IgE、皮肤针刺试验）、皮肤病（皮肤活检）、感染（大便虫卵、寄生虫血清学、真菌抗原）、胃肠病（胃肠镜+活检）、呼吸道（胸片、纤支镜）、结缔组织病（ANA、dsDNA、ANCA）、免疫缺陷（免疫球蛋白、淋巴细胞亚群、基因检查）。无明确继发原因且绝对计数≥1.5×10⁹/L者考虑原发性，查骨髓穿刺+活检、FIP1L1-PDGFRA融合基因、染色体核型（累及4q12/PDGFRA、5q31-33/PDGFRB、8p11-12/FGFR1、9p24/JAK2、13q12/FLT3等位点易位做RT-PCR或测序）、血清肥大细胞胰蛋白酶、T细胞免疫表型及TCR基因重排。\n2016 WHO分类：伴PDGFRA/PDGFRB/FGFR1重排或PCM1-JAK2的髓系/淋系肿瘤；慢性嗜酸粒细胞白血病-非特指型（CEL-NOS）；特发性高嗜酸粒细胞增多综合征（HES）。\n治疗目标：降低嗜酸粒细胞计数、减少器官损伤。\nHES一线：糖皮质激素（泼尼松1mg/(kg·d)，1~2周后渐减，2~3个月减至最低维持量；用激素前评估类圆线虫感染风险）；羟基脲30mg/(kg·d)联合或激素无反应者（也是CEL-NOS一线）；干扰素二线；三线甲氨蝶呤、环磷酰胺、环孢素等；美泊利单抗（抗IL-5）、阿仑单抗（抗CD52）研究中。\n原发性（克隆性）：酪氨酸激酶抑制剂——FIP1L1-PDGFRA、PDGFRB重排或ETV6-ABL1阳性首选伊马替尼；伴器官损伤者加泼尼松1~2mg/(kg·d)用1~2周。' },
  { m: '29G', q: '嗜碱性粒细胞增多症和肥大细胞增多症的特点？', a: '嗜碱性粒细胞增多症：外周血嗜碱性粒细胞绝对值>200/μl，常伴嗜酸性粒细胞增多。病因：过敏性疾病/慢性炎症/炎症性肠病/自身免疫病；骨髓增殖性疾病（慢粒、真红、骨髓纤维化、血小板增多症、AML）。临床：发热、乏力、皮疹、皮肤瘙痒；伴脾大常提示骨髓增殖性疾病。实验室：骨髓嗜碱性粒细胞或前体细胞增多，JAK2突变阳性提示骨髓增殖性疾病，IgE增高提示过敏，寄生虫抗体辅助诊断。伴BCR-ABL1阳性符合CML。治疗：停过敏原+抗过敏；抗寄生虫；骨髓增殖性疾病按相应方案。\n肥大细胞增多症：以骨髓、肝脾淋巴结、胃肠道和皮肤内肥大细胞异常增多为特征，多在2岁前发病。2016 WHO分三型：皮肤肥大细胞增多症（CM，儿童常见，荨麻疹、红斑丘疹，无其他系统受累）、系统性肥大细胞增多症（SM，累及多系统，血浆组胺高→胃酸过度→胃炎和消化性溃疡最常见，可有肝脾大、淋巴结大）、肥大细胞肉瘤（MCS，肿瘤性）。\n实验室：骨髓梭状肥大细胞灶性聚集（混有嗜酸粒细胞等）；血清类胰蛋白酶>20ng/ml对SM诊断有意义；组织活检肥大细胞浸润（吉姆萨或甲苯胺蓝染色示异染性颗粒）；KIT突变——最常见D816V（80%患儿），对确诊有重大意义。\n治疗：控制介质症状（抗组胺药）；儿童及皮肤局限者预后良好，对症即可，无症状不需治疗；系统性及肉瘤疗效差、预后差。' },
  { m: '29H', q: '良性淋巴细胞增多症的定义和常见病因？', a: '定义：单位容积外周血中淋巴细胞数目高于正常。ALC=白细胞总数×淋巴细胞分类百分比。\n增多标准：>12岁者淋巴细胞>4.0×10⁹/L；年长儿>7.0×10⁹/L；新生儿和年幼幼儿>9.0×10⁹/L。\n分相对增多（淋巴细胞比值增高）和绝对增多（绝对值增高）；急性病毒感染多导致相对增多。\n常见病因：\n①病毒感染——EB病毒、巨细胞病毒、麻疹、风疹、流行性腮腺炎、水痘-带状疱疹、单纯疱疹、流感、腺病毒、乙型肝炎、登革热、传染性淋巴细胞增多症等（热带亚热带旅行人员常见传单、CMV感染、登革热、链球菌感染性咽炎、肠弯曲杆菌咽炎）；\n②细菌感染——百日咳、伤寒副伤寒、结核、布鲁氏菌、胎传梅毒等；\n③其他——弓形虫、斑疹伤寒、药物和变态反应、溶血性贫血、再生障碍性贫血、应激、脾功能低下或脾切除、慢性炎症、吸烟等。\n大部分感染所致淋巴细胞增多在疾病好转后恢复正常，部分病毒感染可持续升高，甚至与肿瘤发生密切相关。' },
  { m: '29H', q: 'EB病毒感染的发病机制、临床表现和诊断？', a: 'EBV为疱疹病毒亚科嗜人类淋巴细胞的双链DNA病毒，1964年发现，主要经唾液传播，也可经输血传播。基因组172kb，编码衣壳抗原（VCA）、早期抗原（EA）、核抗原（NA）。\n发病机制：gp350/220与B细胞表面CD21分子结合进入B淋巴细胞；裂解感染时激活B细胞增殖，抗原提呈细胞激活T细胞产生EBV特异性CD8⁺细胞毒性T细胞（CTLs）清除EBV阳性B细胞；潜伏感染时不表达病毒蛋白而逃避免疫监视，形成终身潜伏。\n原发感染：6岁以下儿童大多无症状或仅上呼吸道症状；青少年约50%表现为传染性单核细胞增多症（IM）。少数感染T/NK细胞导致持续活动性感染（传单、慢性活动性EBV感染、霍奇金淋巴瘤等）。\nIM临床：潜伏期4~7周；发热（高热不规则）、咽颊炎、眼睑水肿、皮疹；肝脾大及全身淋巴结肿大；可有多器官受累（间质性肺炎、肝炎、脑炎、心肌炎、血尿蛋白尿、血小板减少、溶血性贫血等）。\n实验室：白细胞升高、淋巴细胞占优势、可见异型淋巴细胞；VCA-IgM阳性、EBV-DNA载量升高。\n诊断：符合①IM临床表现但不符合典型IM，或②VCA-IgM阳性，或③EBV-DNA载量升高，任两条即可。\n治疗：无特效，综合对症——急性期卧床休息；阿昔洛韦等可减少病毒复制量但不能减轻病情和缩短病程；继发感染用抗生素；激素仅用于中毒症状重、咽喉水肿、急性溶血、血小板减少、心肌炎、神经系统并发症；避免撞击防脾破裂。\n预后：多自限、预后良好；少数转CAEBV、噬血细胞综合征、淋巴瘤者预后不良。' },
  { m: '29H', q: '慢性活动性EB病毒感染（CAEBV）的诊断标准和治疗？', a: 'CAEBV是继发于原发EBV感染的系统性EBV阳性淋巴增生性疾病，以严重慢性或复发性IM样表现为主要特征，伴外周血EBV载量明显升高和/或抗体异常。机制：EBV感染的T和/或NK细胞克隆扩增及病毒抗原致宿主免疫两方面使病毒免疫逃逸。\n临床：长期或反复发热、肝脾大、淋巴结肿大等IM样表现；多系统受累，常伴危及生命并发症（噬血细胞综合征、DIC、肝功能衰竭、消化道溃疡/穿孔、冠状动脉瘤、中枢神经系统并发症、心肌炎、间质性肺炎）。\n诊断（同时满足Ⅰ、Ⅱ、Ⅲ条）：\nⅠ.IM样症状持续或反复发作3个月以上（发热、淋巴结和肝脾大；或其他系统并发症）；\nⅡ.EBV感染及组织病理损害证据之一——①抗VCA-IgG≥1:640且抗EA-IgG≥1:160，VCA-IgA和/或EA-IgA阳性；②外周血单个核细胞EBV-DNA>10²拷贝/μg DNA或血清/血浆EBV-DNA阳性；③受累组织EBERs原位杂交或LMP1免疫组化阳性；④Southern杂交检出EBV DNA；\nⅢ.排除已知自身免疫病、肿瘤性疾病及免疫缺陷病所致表现。\n治疗：无特效——抗病毒（阿昔洛韦等）多无效（病毒多潜伏）；丙球可中和循环病毒；激素/环孢素仅缓解症状；免疫调节（IFN、IL-2）无明显效果；化疗（CTX、蒽环类、VCR、VP-16）仅短期缓解；EBV特异性CTLs等有疗效，远期待观察。\nSawada治疗三部曲：①抑制被激活的免疫细胞（泼尼松、环孢素、VP-16）；②清除感染的T/NK细胞（CHOP、ESCAP方案）；③异基因造血干细胞移植——唯一公认根治方法。\n预后：病死率高，多数4~5年后死亡，主要死因肝衰竭、HLH、机会性感染。' },
  { m: '29H', q: 'X连锁淋巴组织增殖综合征（XLP）的要点？', a: '少见的常是致死性的原发性免疫缺陷病（Duncan病），对EBV感染极度敏感，发病率约1/100万~3/100万。三个致病基因：①SH2D1A（Xq25~26，编码SLAM相关蛋白SAP，见于80%患者）——SAP减少使B、T、NK细胞免疫活性降低，淋巴细胞恶性克隆增生；②XIAP基因（X连锁凋亡抑制因子）；③ITK基因（IL-2诱导的T细胞激酶）。\n仅见男性儿童，未感染EBV前多正常，感染EBV后三大表现：\n①致死性传染性单核细胞增多症（占58%，5~17岁，约90%发生噬血细胞综合征；CD8 T细胞、EBV感染B细胞和巨噬细胞大量增生浸润全身脏器）；\n②异常丙种球蛋白血症（占22%，主要IgG降低，淋巴组织坏死、钙化、缺失）；\n③淋巴组织恶性肿瘤（占20%，淋巴瘤总是发生于淋巴结外，最常侵犯肠道回盲部）。\n超过半数未感染过EBV的患儿到一定年龄也出现异常丙球和/或淋巴组织恶性肿瘤。\n诊断（泛美免疫缺陷学组/欧洲免疫缺陷学会1999标准）：明确诊断——SH2D1A基因突变的男性患者+淋巴瘤/霍奇金病、致命EBV感染、免疫缺陷、再障或淋巴细胞/组织细胞疾病之一。\n治疗：对症（定期输丙球减少机会感染、针对HLH等相应治疗）；异基因造血干细胞移植是唯一能治愈的方法。\n预后：70%患者10岁前死亡。' },
  { m: '29H', q: '巨细胞病毒（CMV）感染的分类和临床表现？', a: 'CMV为人类疱疹病毒V型，双链线状DNA病毒（疱疹病毒科中基因组最大），我国一般人群抗体阳性率86%~96%，婴幼儿期60%~80%，原发感染多发生于婴幼儿期。一旦感染终身持续。主要靶细胞：上皮细胞、内皮细胞、成纤维细胞；外周血白细胞是易感细胞；脑和视网膜神经细胞、胃肠平滑肌细胞和肝细胞也可感染；唾液腺是主要排毒部位。\n感染细胞类型：①产毒性（活动性）感染——病毒在细胞内复制、扩散；②非产毒性（潜伏）感染——不能分离病毒、仅检出病毒DNA。两型可互相转换。\n临床分类：①原发感染/再发感染（内源性潜伏病毒活化或再次感染外源不同毒株）；②按感染时间：先天性感染（生后14天内证实）、围生期感染（生后14天内无感染、3~12周内有证据，经产道、母乳或输血获得）、生后（获得性）感染（出生12周后发现）；③按征象：症状性感染（累及2个或以上器官系统为CMV全身性感染，多见于先天性感染和免疫缺陷者）、无症状性感染（占绝大多数，可有亚临床感染）。\n造血功能紊乱机制：直接感染造血祖细胞抑制增殖分化；损伤骨髓基质细胞致造血因子网络紊乱；Fas介导造血干/祖细胞凋亡增加（骨髓增生活跃但外周一系或两系减低，无效造血）；病毒介导自身免疫异常产生自身抗体。\n临床：先天感染多系统器官受损（黄疸和肝脾大最常见，血小板减少性瘀斑、小头畸形、脑室扩大伴周边钙化灶、感音性耳聋、视网膜脉络膜炎）；血液系统损害（骨髓抑制、血小板减少、粒细胞减少、贫血、异常淋巴细胞增多、传单综合征、再障等）；CMV肝炎、CMV肺炎、输血后综合征。' },
  { m: '29H', q: '传染性单核细胞增多症（IM）的临床特点、诊断标准和鉴别诊断？', a: '典型表现：外周血淋巴细胞>50%且异型淋巴细胞>10%；发热、咽峡炎、淋巴结肿大三联症。90%EBV所致IM患者有异染性抗体（嗜异性凝集试验阳性），其他病原所致单核细胞综合征无此抗体。\n临床细节：潜伏期30~50天；发热最常见（不规则热，37.5~40℃，持续4~21天）；颈部淋巴结肿大最常见；肝大轻度2~3周消失，可有黄疸；脾大者>50%（2~3cm，可大至盆腔），脾破裂多发生于病程第2~3周；眼睑水肿占15%~25%；皮疹15%~20%；并发症：血小板减少、溶血性贫血、再障、肺炎、心肌炎、脑炎、格林-巴利综合征、低丙种球蛋白血症、淋巴瘤。\n实验室：第1周可白细胞减少（重者降至0.5×10⁹/L），多数升高，第2~3周达峰（10~20）×10⁹/L，严重（40~60）×10⁹/L，淋巴细胞为主（42%~88%）；嗜异性凝集试验1:64以上阳性，1~2周出现、3~4周高峰，持续3~6个月，阳性率80%~90%但特异性不高。\n诊断（儿童EB病毒感染协作组）：临床指标（①发热②咽扁桃体炎③颈淋巴结肿大④脾大⑤肝脏肿大⑥眼睑水肿）中任意3项+实验室指标——临床诊断病例需实验室第4项（异型淋巴细胞>0.10和/或淋巴细胞≥5.0×10⁹/L）；实验室确诊需第1~3项任1项（①VCA-IgM和VCA-IgG阳性且NA-IgG阴性；②VCA-IgM阴性但VCA-IgG阳性且低亲和力；③双份血清VCA-IgG滴度4倍以上升高）。\n鉴别：①传染性淋巴细胞增多症（10岁以下，轻热+上呼吸道/胃肠道症状，无淋巴结肿大，无异型淋巴细胞，嗜异性凝集试验阴性，白细胞可达20~100×10⁹/L、淋巴细胞60%~97%，预后良好）；②病毒性肝炎（发热低、黄疸出现后退热、异型淋巴细胞<10%、嗜异性凝集及EBV抗体阴性）；③急性淋巴细胞白血病（异型淋巴细胞多形性、红系及血小板正常、骨髓仅淋巴细胞增多而幼稚细胞比例不增高）。\n其他病原IM特点：乙肝可低热腹胀早于黄疸；弓形虫显著淋巴结病（耳后）、无咽峡炎、脾大少见，可有脑炎脑膜炎；HIV发热、咽痛、体重减轻、皮疹、脑炎、化脓性脑膜炎；风疹多有皮疹；腺病毒多有咽峡炎。' },
  { m: '29H', q: '百日咳及类百日咳综合征的诊断和治疗？', a: '百日咳由百日咳鲍特菌引起的急性呼吸道传染病，典型为阵发性痉挛性咳嗽+高调鸡鸣样哮吼，外周血淋巴细胞增多；小婴儿痉挛性咳嗽不明显，表现为阵发性青紫和窒息。类百日咳综合征由副百日咳鲍特菌、支气管败血症鲍特菌、衣原体、支原体、病毒等引起，临床表现相同。\n流行病学：高度传染，传染源76%~83%为家庭成员；<6月龄婴儿发病率明显增高（抗体随年龄下降、母传抗体少）。\n致病因子：百日咳杆菌黏附素（PRN）、丝状血凝素（FHA）、百日咳毒素（PT）、气管细胞毒素（TCT）、腺苷环化酶毒素（ACT）、凝集素（FIM）、脂寡糖（LOS）。\n淋巴细胞增多机制（痉咳期WBC 20~50甚至70×10⁹/L、淋巴细胞60%~90%）：百日咳毒素抑制趋化因子受体通路使淋巴细胞滞留骨髓和脾脏功能受损；抑制LFA-1介导的小静脉留滞效应、降低CD62L表达；促进初始T细胞加速释放入血（未接种疫苗儿童更明显）。\n病程三期：卡他期1~2周（流涕喷嚏，传染性最强）；痉咳期2~6周（可>2月），阵发痉挛咳+鸡鸣样回声，夜间重，小婴儿并发症多（呼吸暂停、肺炎、百日咳脑病），此期病死率高；恢复期2~3周（可反复迁延数月）。\n诊断（2017中国建议）：临床——0~3月龄：无热或低热+进行性加重咳嗽+鸡鸣样回声/呼吸暂停/咳后呕吐/发绀/抽搐/肺炎/密切接触史任1项（也可仅阵发呼吸暂停、发绀、抽搐）；4月龄~9岁：阵发咳嗽≥7天+非脓性鼻炎+鸡鸣样回声等任1项；≥10岁：阵发干咳≥2周+非脓性鼻炎+无热+鸡鸣样回声/呼吸暂停等任1项。实验室确诊：PCR（最敏感，较培养高2~6倍，常用IS481等）、细菌培养（金标准）、PT-IgG（单次>80~100IU/ml提示近期感染；双份血清4倍以上升高）。0~3月龄单次ELISA不推荐。\n治疗：首选大环内酯类（红霉素、阿奇霉素、罗红霉素、克拉霉素），疗效与用药早晚有关——卡他期应用可减轻甚至不出现痉咳，痉咳期后不能缩短病程但缩短排菌期及预防继发感染；呼吸道隔离至有效抗生素治疗5天（未治疗隔离至起病后21天）；痉咳无公认推荐（激素、支扩剂、抗组胺、镇静剂等）。\n预后：小婴儿并发症多（呼吸暂停、肺炎、百日咳脑病、结膜下出血、脐疝、气胸），可并肺动脉高压（先心患儿可猝死）；严格按计划接种疫苗是减少婴儿严重百日咳最重要措施。' },
  { m: '29H', q: '良性淋巴细胞减少症的定义、分类和常见病因？', a: '定义：单位容积外周血中淋巴细胞总数低于正常。婴儿ALC<3000/μl、较大儿童<1000/μl、成人<1500/μl；可作为全血细胞减少的一部分或独立存在。\n亚群：T淋巴细胞（CD3+）占61%~85%、B淋巴细胞（CD3-CD19+）、NK细胞（CD3-CD16+CD56+）；T细胞占大多数，故淋巴细胞减少以T细胞减少最突出。\n分类：①T淋巴细胞减少——AIDS、特发性CD4+淋巴细胞减少症；②B淋巴细胞减少——体液免疫缺陷、免疫抑制剂；③NK细胞减少——较少见。\n病因（获得性）：\n①感染——HIV、H1N1等特殊病毒、重症细菌、真菌感染；\n②恶性肿瘤——白血病、淋巴瘤累及骨髓；\n③医源性——糖皮质激素、化疗、放疗、抗淋巴细胞球蛋白、大手术、肾/骨髓移植、胸导管引流；\n④免疫系统疾病——原发性免疫缺陷、SLE、结节病；\n⑤全身性疾病——蛋白丢失性肠病、肾衰、热损伤；\n⑥营养饮食——饮酒、锌缺乏；\n⑦特发性CD4+淋巴细胞减少症。\n机制：淋巴细胞生成受抑、释放入血途径受阻、丢失、破坏。' },
  { m: '29H', q: '特发性CD4+T淋巴细胞减少症（ICL）、SLE伴淋巴细胞减少和脓毒症伴淋巴细胞减少的要点？', a: 'ICL：又称HIV阴性艾滋病样综合征，1992年美国CDC提出；罕见（全球300多例，平均发病41±19岁）；机制与T淋巴细胞增生异常、凋亡增强及表面受体功能改变有关（部分与RAG1突变相关）。临床三类：无症状；轻型（乏力、消瘦、关节痛、鹅口疮、紫癜、慢性腹泻、肺炎）；典型AIDS表现（机会性感染如隐球菌、分枝杆菌、肺孢子虫，肿瘤）。诊断（CDC）：两次以上（间隔2周~1个月）CD4+T细胞<300/mm³或占CD3+细胞<20%+除外HIV感染+除外其他病因。鉴别：AIDS（CD4数目相对稳定、无明显进行性下降）、先天免疫缺陷、药物性CD4减少、淋巴系统肿瘤。治疗：对症（防治机会感染）；IL-2 50~100U/m²每周2~3次皮下或肌注，4~6周一疗程；干细胞移植可根治。\nSLE伴淋巴细胞减少：淋巴细胞减少是SLE最常见临床表现之一和诊断标准中血液系统受累依据（ACR/SLICC标准：淋巴细胞<1.5×10⁹/L至少2次）；发生率15%~93%（儿童24%~59%）；机制与抗淋巴细胞抗体（ALA）致循环T细胞耗竭、补体介导细胞毒、淋巴细胞自身凋亡有关；与狼疮活动相关——初诊时淋巴细胞减少提示口腔溃疡、白细胞减少、抗dsDNA抗体、C4下降；重度淋巴细胞减少是神经精神性狼疮（NPSLE）独立危险因素；无针对性治疗，狼疮控制后淋巴细胞回升。\n脓毒症伴淋巴细胞减少：脓毒症=感染引起的SIRS，严重脓毒症=器官功能障碍/低灌注，感染性休克=组织低灌注+心血管功能障碍。机制：儿茶酚胺与免疫细胞肾上腺素能受体结合改变分布+诱导凋亡；糖皮质激素抑制胸腺、促凋亡。持续免疫抑制（CD4/CD8、T/B细胞及滤泡树突细胞凋亡）在高死亡率中起关键作用；外周血淋巴细胞自初发即降低，可持续至病程第28天。治疗：治脓毒症；早期可短期激素抑制过度炎症反应，存活后监测免疫状态，适时用免疫激活剂。' },
  { m: '29I', q: '噬血细胞性淋巴组织细胞增多症（HLH）的发病机制？', a: 'HLH又称噬血细胞综合征（HPS），是免疫调节异常综合征，与NK细胞或细胞毒T细胞穿孔素依赖的细胞毒功能缺陷有关，婴幼儿高发，起病急、进展迅速。\npHLH主要机制：穿孔素依赖的细胞毒功能是NK和CTL杀伤靶细胞的主要途径，该途径缺陷导致NK/T细胞不能及时清除被病毒感染的靶细胞→抗原刺激持续存在→T细胞过度增殖活化产生大量细胞因子（细胞因子风暴）：活化T细胞产生大量IFN-γ刺激巨噬细胞过度增殖活化，产生IL-12、IL-1、IL-6、IL-10、IL-18和TNF-α→多器官炎症及组织损伤。骨髓、淋巴结或其他脏器中组织细胞浸润并吞噬血细胞（噬血现象）。\n细胞毒颗粒释放过程（合成、转运、锚定、膜融合、释放穿孔素和颗粒酶）需多种蛋白：LYST、MUNC13-4、MUNC18-2、SYNTAXIN11、RAB27A；编码SAP和XIAP蛋白的基因突变影响细胞毒信号转导。截至2017年至少12种基因突变与pHLH相关。\n病理生理三环节：①NK/CTL细胞毒功能缺陷；②T细胞和巨噬细胞过度活化；③炎症因子风暴和噬血细胞浸润致组织器官损伤。\n分原发性（pHLH）和继发性（sHLH）；瑞典统计pHLH发病率约1/10万，中位发病5.1个月。' },
  { m: '29I', q: 'HLH的临床表现和实验室检查？', a: '临床表现（约70% pHLH发生于1岁内，尤其1~6个月；活动多有诱因，最常见EBV感染）：\n①发热——几乎均有，常>38.5℃，热型不定；\n②肝脾淋巴结肿大——脾大最常见（95%），其次肝大（94%）；\n③血细胞减少——二系或三系减低（尤其血小板减少），程度轻至极重度；\n④出血——血小板减低+纤溶亢进纤维蛋白原下降，皮肤黏膜瘀点瘀斑、鼻出血、消化道出血、血尿甚至颅内出血；\n⑤皮疹——多样（斑丘疹、红斑、水肿、麻疹样、脂膜炎）；\n⑥黄疸——肝细胞性或胆汁淤积性；\n⑦中枢神经系统受累30%~76%（pHLH多见）——嗜睡、易激惹、抽搐、昏迷、颅压升高、共济失调、脑神经麻痹（常见第6、7对）；部分pHLH血液系统症状不明显，以脑白质病变就诊于神经科，极易误诊。\n实验室：\n①血常规——血细胞减少（最常见表现），血小板减少尤著；\n②骨髓——噬血现象非诊断必要条件！早期不明显（反应性组织细胞增生），进展后红系粒系巨核系均减少、明显噬血、组织细胞显著增生，晚期增生极度低下；\n③血生化——高甘油三酯血症（空腹TG>3mmol/L）、低钠、ALT/AST/GGT/LDH/胆红素升高、白蛋白低；\n④凝血——纤维蛋白原降低、FDP增多、PT/APTT延长（继发纤溶亢进→顽固低纤维蛋白原血症）；\n⑤血清铁蛋白SF——通常>500μg/L，>3000更有诊断意义，>10000高度怀疑；可判断活动度和严重程度（自身炎症性疾病相关HLH升高尤著）；\n⑥sCD25（可溶性IL-2受体α链）升高>2400U/L或>均数+2SD——诊断最重要指标之一；IFN-γ、IL-10、IL-6、IL-18明显升高；\n⑦脑脊液——细胞数及蛋白增高，以淋巴细胞为主；\n⑧NK细胞活性降低或缺失；CD107a、穿孔素、颗粒酶、Munc13-4等细胞毒功能检查；\n⑨SAP/XIAP蛋白检测（XLP合并HLH）；\n⑩基因学检测——确诊pHLH金标准：PRF1（FHL2）、UNC13D（FHL3）、STX11（FHL4）、STXBP2（FHL5）；男孩加查SH2D1A、BIRC4（XLP）；白化者查RAB27A、LYST、AP3B1。\n血小板计数变化可作病情活动指标。' },
  { m: '29I', q: 'HLH-2004诊断标准的内容？', a: '符合以下8条中的5条，或存在原发性HLH的致病性基因突变：\n①发热≥38.5℃；\n②脾大；\n③血细胞减少：外周血至少2系减少——Hb<90g/L（新生儿<100g/L）、PLT<100×10⁹/L、中性粒细胞<1×10⁹/L；\n④高甘油三酯血症（空腹TG>265mg/dl即3mmol/L）和/或低纤维蛋白原血症（<1.5g/L）；\n⑤噬血现象（骨髓、脾、淋巴结或肝）；\n⑥NK细胞活性低；\n⑦铁蛋白>500μg/L；\n⑧sCD25（可溶性IL-2Rα链）升高（>2400U/L或>均数+2SD）。\n注意：骨髓噬血现象不是诊断必要条件；早期诊断治疗是关键（24~48小时内完成确诊及病因学检查），晚期细胞因子风暴致多脏器功能衰竭常不可逆。对发热、血细胞减低伴肝脾大或肝酶异常者应警惕HLH。' },
  { m: '29I', q: '原发性HLH和继发性HLH的分类和病因？', a: 'pHLH三类：\n①家族性HLH（FHL）——FHL-1（9q21.3-22，基因功能未明，罕见）；FHL-2（PRF1基因，10q21-22，编码穿孔素，中位发病约3个月）；FHL-3（UNC13D基因，17q25，编码Munc13-4，参与细胞毒囊泡与细胞膜融合；韩国报道占FHL患者89%）；FHL-4（STX11基因，6q24，编码syntaxin11，SNARE家族，土耳其/库尔德人群常见）；FHL-5（STXBP2基因，19p13，编码Munc18-2，与syntaxin11形成复合体促进囊泡融合）。最常见为PRF1和UNC13D突变（FHL-2、FHL-3）；完全功能缺失突变发病早，错义突变可成年发病。\n②伴部分白化的免疫缺陷合并HLH——Griscelli综合征2型（RAB27A，15q21，囊泡锚定/运输，部分白化）；Chediak-Higashi综合征（LYST，1q42，囊泡形成运输，巨大溶酶体颗粒，加速期常表现为HLH）；Hermansky-Pudlak综合征2型（AP3B1，囊泡运输障碍，部分白化）。\n③EBV驱动的pHLH——XLP1（SH2D1A，80%）和XLP2（BIRC4/XIAP，20%），均在Xq25。\n部分学者主张把有明确PID基因突变合并HLH列入pHLH。\nsHLH：\n①感染相关——病毒感染最常见，主要EBV；其他CMV、人疱疹病毒、HIV、流感、风疹、H5N1；结核、布鲁氏菌、支原体、真菌、黑热病等。感染可能只是pHLH的诱发因素，即使有病原学依据必要时仍需基因检查除外pHLH。\n②风湿免疫性疾病相关（巨噬细胞活化综合征MAS）——最常见于全身型幼年特发性关节炎（So-JIA，约10%合并，是其主要死亡原因），亦见于SLE、川崎病、皮肌炎、强直性脊柱炎。特点：以HLH起病的SAIDs患儿多有白细胞升高（尤中性粒细胞）、CRP升高、ESR快、抗感染无效、特异性自身抗体阴性、脾大不如其他HLH常见，铁蛋白和IL-6升高更明显；预后好于FHL和EBV-HLH，可避免高强度化疗（部分可不用VP16），移植不作优选。\n③肿瘤相关（MAHS）——淋巴瘤、急性白血病、多发性骨髓瘤；NK/T细胞淋巴瘤约占35%、B细胞淋巴瘤约32%、白血病约6%；分肿瘤触发HLH和化疗相关HLH（常和感染相关）。' },
  { m: '29I', q: 'HLH的治疗方案和预后？', a: '治疗原则：①早期——疑诊后24~48小时内完成检查，符合标准或高度怀疑且进展迅速者立即治疗；②个体化——以最小毒副作用控制HLH活动，并非所有患者都严格按方案化疗，部分轻症单用激素即可。\n一线方案（HLH-1994，2004方案疗效不优于94且早期环孢素副作用多，故沿用94）：地塞米松+依托泊苷（VP16）+环孢素A。诱导8周：Dex 10mg/(m²·d)×2周→5mg×2周→2.5mg×2周→1.25mg×1周→1周减停；VP16 150mg/m²，2次/周×2周→1次/周×6周（2018专家建议可减至75~100mg/m²、间隔1周）；CSA 6mg/(kg·d)分2次，谷浓度200μg/L左右。中枢受累者鞘注MTX+Dex。维持（9~40周）：Dex 10mg/(m²·d)×3天每2周1次；VP16 150mg/m²每2周1次；CSA至40周。临床调整：轻症可暂缓/不用VP16；可用甲泼尼龙，自身炎症相关HLH必要时大剂量冲击；sHLH治疗8周达CR且无移植指征可停药观察。\n二线/补救：DEP/LDEP（脂质体多柔比星+VP16+甲泼尼龙±左旋门冬酰胺酶）、ATG+激素+VP16、COP、氟达拉滨+大剂量激素、抗CD52等，争取缓解后移植。\n靶向治疗（试验中）：IFN-γ单抗Emapalumab（难治复发pHLH）、JAK1/2抑制剂芦可替尼、IL-1/IL-6抗体或拮抗剂（MAS）。\nAllo-HSCT：难治复发HLH尤其pHLH的重要治疗；指征——pHLH、无明确基因突变但诱导8周未缓解、治疗中或停药后复发者（MAS复发不推荐移植）。FHL同胞可能携带相同突变需筛查；降低预处理强度显著降低早期死亡率；回输前处于缓解期者生存率高。CAEBV相关HLH应在化疗控制后尽早移植。\n继发性HLH同时治原发病：感染相关需抗感染（疱疹类用阿昔洛韦/更昔洛韦）；监测EBV-DNA——持续不转阴提示预后不良，阴转后转阳提示复发。MAS用激素、CSA、大剂量丙球，急性期甲泼尼龙15~30mg/(kg·d)×3天后改泼尼松1~2mg/(kg·d)，危重或激素耐药用CSA 2~8mg/(kg·d)，早期大剂量丙球1g/(kg·d)×2天。\n血液净化（CBP）：严重/难治复发进展期、合并多器官功能不全或严重脓毒症、严重细胞因子风暴；禁忌——严重活动性出血（尤其颅内）、血小板显著降低慎用。\n支持治疗：监测血常规凝血肝肾功电解质，补充凝血因子/血浆/血小板，防真菌和卡氏肺孢子虫感染。\n疗效评估：CR——所有指标恢复正常；PR——至少2项指标恢复>25%（sCD25降1.5倍以上、SF和TG降25%以上、ANC上升达标、ALT>400者降50%以上、CNS意识恢复）；NR——未达PR；复发——CR后再出现8条中3条以上（新CNS症状单独即可诊断再激活）。\n预后：HLH-1994方案前pHLH 1年生存率接近0；方案后5年总体生存率54%，HSCT后总体生存率50%~65%（部分中心86%）。不良预后因素：年龄小（<6月龄）、病程>1个月、中枢受累、白蛋白<25g/L、LDH>2000U/L、NK细胞比例明显下降（<3%）。' },
  { m: '29J', q: '脾脏的结构、功能和脾脏缺如的要点？', a: '结构：表面结缔组织包膜；分白髓（密集淋巴组织，T淋巴细胞主要分布区，是最大免疫器官占全身淋巴组织25%）和红髓（血窦和脾索，滤过血液主要场所），之间为边缘区；胚胎5周形成，出生约11g，青春期平均135g。\n大小：正常新生儿左肋缘下1~2cm可扪及，1周岁后肋缘下不易扪及；仰卧/侧卧位左肋缘下扪及提示体积超正常1倍；脾浊音界在左腋中线9~11肋间，厚4~7cm。\n功能：①造血——胎儿期最初2~5个月为主要造血器官，出生后只产生淋巴细胞和单核细胞，紧急需要时可恢复胎儿期造血（髓外造血）；②过滤及免疫；③清除衰老红细胞和异常血细胞；④清除红细胞内容物（豪-周小体经脾时被清除，脾切除或脾功能低下时外周血出现含豪-周小体的红细胞）；⑤贮血——正常脾贮存循环中1/3血小板，脾显著增大时可增至90%（故切脾后血小板显著增高）；显著增大时贮血量可达全身血量20%。\n脾脏缺如：先天性脾缺如可单独存在或伴部分内脏转位/先心病；功能性脾缺如见于镰状细胞贫血（镰变红细胞损害脾血管系统）、自身免疫病、严重乳糜泻、炎性肠病。外周血红细胞见豪-周小体、含铁血红素颗粒等无脾血液学征象可怀疑，B超/CT无脾影确诊。并发症：无脾小儿存在免疫缺陷，易发生严重感染，尤其婴幼儿，易爆发肺炎双球菌、流感嗜血杆菌、奈瑟菌等有荚膜细菌感染危及生命。' },
  { m: '29J', q: '脾大的分度、病理生理机制和常见病因？', a: '分度（左肋缘下扪及即脾大）：深吸气时脾在肋缘下≤3cm为轻度；自3cm至脐水平线为中度；超过脐水平线为重度。\n病理生理6机制：①髓外造血（胎儿性造血恢复）；②充血性脾大（门静脉高压、脾静脉栓塞）；③脾功能亢进；④免疫因素炎症细胞增殖；⑤肿瘤细胞增殖浸润（白血病、淋巴瘤）；⑥代谢产物沉积（脂类等单核巨噬细胞增生）。\n感染性脾大：\n急性——病毒（风疹轻度；幼儿急疹热退疹出；传单EBV；CMV；肝炎）、细菌（败血症、伤寒白细胞减少、感染性心内膜炎、脾脓肿、急性粟粒性结核）、立克次体（斑疹伤寒、恙虫病外斐反应）、螺旋体（钩体、回归热）、寄生虫（疟疾——周期发热寒战+外周血涂片找疟原虫；黑热病——骨髓找利什曼小体确诊；弓形虫、血吸虫）；\n慢性——慢性病毒性肝炎、慢性血吸虫病、慢性疟疾（可极度脾大质硬）、结节病、组织胞浆菌病、弓形体病、胎传梅毒、布鲁氏菌病。\n非感染性脾大：\n①充血性——门静脉高压（肝外型：门静脉先天畸形、海绵状血管瘤、脾静脉血栓；肝内型：肝硬化为主——胆道闭锁、慢性肝炎、血吸虫、肝豆状核变性）；慢性充血性心衰；缩窄性心包炎（85%脾大）；门静脉血栓（极少肝大，以脾大为明显）；布-加综合征（超声筛查、下腔静脉及肝静脉造影是金标准）；\n②血液病——新生儿溶血、溶血性贫血（急性脾不大或轻度、慢性明显且质硬）、ITP（急性脾不大、慢性轻度大）、缺铁性贫、白血病（慢粒重度脾大）、恶性淋巴瘤、家族性嗜酸粒细胞增多、特发性嗜酸增多综合征、原发性巨球蛋白血症、真红、感染性贫血、石骨症（骨密度增加髓腔消失、骨髓干抽）、骨髓纤维化、脾亢；\n③结缔组织病和变态反应病——SLE、皮肌炎、结节性多动脉炎、幼年类风湿、Felty综合征、特发性肺含铁血黄素沉着症（轻中度脾大）；\n④代谢病——戈谢病（葡萄糖脑苷脂酶缺陷）、尼曼-匹克病（鞘磷脂酶缺乏）、海蓝组织细胞综合征、胱氨酸病、黏多糖病（尿黏多糖增多）；\n⑤组织细胞病——朗格汉斯细胞组织细胞增生症（皮疹+骨损害+肺浸润，活检确诊）、噬血细胞综合征（约80%有脾大且迅速增大）；\n⑥脾肿瘤（错构瘤、血管瘤；血管内皮瘤、淋巴瘤）和脾囊肿（真性：皮样、淋巴管、包虫、多囊脾；假性：损伤后陈旧血肿或梗死液化）。' },
  { m: '29J', q: '门静脉高压症和脾功能亢进（附1、附2）的要点？', a: '门静脉高压症：门静脉系统阻塞所致，门静脉压力>10~12mmHg（小儿正常很少超7mmHg）。临床以慢性进行性脾大、贫血、白细胞及血小板减少和消化道出血为主要表现。70%脾静脉血汇入门静脉。\n分型：肝外型（门静脉先天畸形、海绵状血管瘤及门静脉梗阻血栓；脾静脉先天瓣膜畸形或新生儿脐炎、败血症、脐静脉插管致脾静脉炎血栓形成）；肝内型（以肝硬化性门静脉高压为主：胆道闭锁、慢性肝炎、血吸虫病、半乳糖血症、肝豆状核变性、胰腺囊性变）。\n临床表现：较大儿童、发病缓慢、常偶然发现脾大；小儿一般状态好、无肝病体征；脾大多中度。门静脉高压后侧支循环：上部形成食管下段和胃底静脉曲张，下部形成中、下痔静脉曲张——曲张血管破裂引起呕血便血（危险并发症，呕血可突发，一次80~200ml，出血后48小时内脾大可再复原状）；晚期肝硬化表现（腹水、黄疸、重度营养不良、下肢水肿、胸腹壁皮下静脉扩张）。腹水一般不见于肝外型。\n实验室：全血细胞减少（初期正细胞性，多次失血后小细胞低色素；脾越大白细胞越低，常1.5~4×10⁹/L）；肝硬化前肝功能多正常。\n诊断：胃镜是诊断食管静脉曲张最可靠方法（钡餐70%~80%食管下1/3充盈缺损或蚯蚓条索状）。\n治疗：脾功能亢进重者考虑脾切除——脾静脉梗阻者切除后效果较好可获痊愈；肝内或门静脉病变者切脾后仍可能出血；REX术（肠系膜上静脉-门静脉左支分流术）最符合生理，是所有肝功能正常的肝外型门脉高压首选术式；门-体分流术后肝性脑病发生率增加；肝硬化失代偿者应考虑肝移植。急性食管静脉曲张破裂出血不宜急诊手术，生长抑素是首选药物（首剂1~2μg/kg静注，以后每小时1~2μg/kg持续滴注，连用2~5天；选择性减少内脏血流尤其门静脉血流量）。\n脾功能亢进：脾大+一种或多种血细胞减少+骨髓造血细胞相应增生+脾切除后血象恢复。病因以慢性感染最多（EBV、CMV等），其次恶性肿瘤、免疫调节障碍（SLE）；遗传性球形红细胞增多症、AIHA、ITP等也可引起。病程多慢性；脾大与脾亢程度不一定成比例。原发性脾亢难确诊，须排除继发性全血细胞减少的各种原因。切脾后部分慢性脾亢患者可恢复健康，门静脉或脾静脉血栓形成者尤其有效。' },
  { m: '29J', q: '脾外伤和脾切除术的要点？', a: '脾外伤：多见于腹部钝器伤/摔伤/撞伤（间接震动伤），强烈震伤下脾是腹内最易破裂器官；病理性脾大（尤其充血性脾大）轻微损伤即可破裂（脾自然破裂）；常与肝破裂并存。病理：脾被膜张力高，破裂后不易对拢，易出血不易止住→大量出血休克；破口难以保留血凝块粘连愈合，即使暂时止血再出血可能性大。\n诊断：左上腹受击后不能直立、卧位喜左侧向下腰前弯、左腹屈曲不敢活动；腹痛腹胀拒食；重者休克前期表现；左上腹压痛叩浊；腹腔穿刺血腹基本确定；超声显示脾外形裂口、估计出血量；血象早期基本正常，十余小时后明显贫血。必须全身系统检查（复合伤），伤后至少观察6小时。\n治疗：大多数不需手术，非手术治疗成功率90%~95%（资源丰富城市95%~100%，儿童90%以上）；需监护条件（急诊/ICU），观察时间"分级+1天"；不提倡常规输血；心率增快是小儿休克最早且常是唯一体征；出现休克需剖腹探查，手术目的是控制出血；生命垂危者损伤控制手术。预后：单纯脾外伤很少死亡，需手术探查者不足25%，脾切除已很少见；巨大病理脾仍应预防性脾切除。\n脾切除适应证：①脾脏本身疾病——脾损伤（保守仍有休克急诊切）、游走脾（脾蒂扭转）、脾脓肿（应切除；粟粒性结核不宜切）、脾囊肿及肿瘤（绝大多数良性，优先脾部分切除）、充血性脾大+脾亢（切90%脾可同时缓解脾亢和保留免疫功能）；②血液病及代谢病——遗传性球形红细胞增多症（疗效满意）、ITP（近期疗效好远期不理想，谨慎选择）、镰状细胞贫血、地中海贫血（合并脾亢巨脾）、温抗体型AIHA、类脂沉积病；③其他——继发性脾亢（仅在巨脾影响生活时偶可考虑）、脾静脉血栓梗阻所致脾大（效果较好可获痊愈）、原因不明巨脾妨碍活动。\n切脾注意事项：①14.5%的人有副脾（16.7%ITP患者有副脾，26%有多个），术中常规探查一并切除以免症状复发；②切脾后感染大多发生在术后2年，应常规青霉素预防（尤其4岁以下婴幼儿），持续2年或更长；③2岁内不宜切脾，如病情许可最好延迟到5岁后；④外伤性脾破裂尽量保脾；⑤肝硬化全脾切除不宜常规（超急感染危险增加）。\n切脾后感染风险与原发病有关：脾损伤、ITP、门静脉高压、局部肿瘤切脾后无致死性感染危险；球形红细胞增多症、再障切脾后轻度感染风险；肝硬化、地中海贫血、组织细胞增生症、代谢病切脾后致死性感染发病率高、死亡率也高（荚膜菌——肺炎球菌、流感嗜血杆菌、奈瑟菌；链球菌葡萄球菌相对少）。' },
  { m: '29J', q: '淋巴结的解剖生理特点和淋巴结肿大的诊断思路？', a: '解剖生理：淋巴结分布在非黏膜部位，实质外层皮质（浅层皮质为B细胞区参与体液免疫；副皮质区为T细胞区参与细胞免疫）、内层髓质（髓索含浆细胞、B细胞和巨噬细胞；髓窦含较多巨噬细胞，滤过功能强）。婴幼儿淋巴结结缔组织少、小叶分隔不清、滤泡未形成、被膜薄、屏障差——局部轻微感染即发炎肿大甚至化脓，易致淋巴结周围蜂窝织炎；新生儿期易成为败血症。7~8岁分成多个小叶，12~13岁发育完善。淋巴结还有造血功能（生后第1年最明显）。\n肿大定义：正常淋巴结直径0.2~0.5cm，质软；直径>1~2cm、外形改变、质地异常即淋巴结肿大。\n普遍性肿大病因按年龄：新生儿期——败血症、单纯疱疹病毒、CMV感染；婴幼儿——多考虑病毒病，考虑细菌感染先排除结核；年长儿——结核、伤寒、传单、白血病。\n局限性肿大常见部位及原因：下颌（口炎、龋齿、龈周脓肿）；颈前（扁桃体炎）；颈后（鼻咽、咽后壁炎症）；腋窝/腹股沟（上下肢感染）；肠系膜淋巴结肿大——多由腹膜结核或肠结核所致。\n区域淋巴结引流规律（重要）：右锁骨上淋巴结肿大常与胸腔内病变有关，左锁骨上常与腹腔内病变有关；局部特别肿大除炎症外注意肿瘤（恶性淋巴瘤、白血病）。\n警惕征象：持续淋巴结肿大伴肝/脾大、发热、盗汗、体重减轻及血LDH升高提示恶性肿瘤。\n检查：血象、骨髓象；胸腹部增强CT；血清学（嗜异性凝集试验、EBV抗体、结核菌素试验）；淋巴结穿刺或活检；淋巴系统造影；PET/CT对恶性浸润敏感性高。\n治疗关键：寻找病因。细菌感染用抗生素，静滴1~2天无反应且影像提示脓液排出不畅者CT/超声引导下抽吸或切开引流；记录淋巴结大小，治疗10~14天无缩小应系统评估，必要时细针抽吸或切除活检。' },
  { m: '29J', q: '急性淋巴结炎、慢性淋巴结炎和血管免疫母细胞淋巴结病（AILD）的要点？', a: '急性淋巴结炎：儿童常见。机制：①病原经淋巴管引流致局部淋巴结炎症；②细菌毒素（极重型/坏死性扁桃体炎、白喉、严重毒血症——颈部下颌淋巴结极度肿大+周围组织肿胀即"公牛颈"）；③病毒（风疹致耳后枕部淋巴结肿大）。常有全身发热，局部红热肿痛，不及时诊治可化脓。病原以葡萄球菌、链球菌为主，用青霉素类抗生素，出现波动感切开引流后停抗生素。深部：纵隔淋巴结炎（结核性支气管旁淋巴结肿大引起阵发性咳嗽、气促、喘鸣、面部水肿，与百日咳及纵隔肿瘤鉴别，抗结核治疗）；腹后壁/肠系膜淋巴结炎可呈急腹症，与急性阑尾炎鉴别。\n慢性淋巴结炎：反复感染（上感、扁桃体炎、中耳炎、湿疹）引起颈部、耳前后淋巴结增生纤维化而慢性肿大。慢性结核性淋巴结炎早期分散无触痛可成硬肿块，干酪坏死时皮下破溃、彼此粘连、皮肤变薄光亮红肿，穿破成瘘管——任何表浅淋巴结长期肿大均应先排除结核。腋窝淋巴结肿大可由卡介苗接种引起；肺门淋巴结肿大多由原发性肺结核引起。\n血管免疫母细胞淋巴结病（AILD）：1974年提出，T细胞反应增殖性疾病——T细胞调节功能缺陷使B细胞非肿瘤性异常增生转化为免疫母细胞，产生过多免疫球蛋白；部分转化为血管免疫母细胞性T细胞淋巴瘤（AITL）。40岁以上占85%，小儿少见。突出特征为全身或局限性淋巴结肿大（可累及肺门、纵隔、腹腔），60%以上轻中度肝脾大，发热、皮疹、消瘦、贫血。确诊靠淋巴结病理：淋巴结结构消失、T细胞区大量内皮小静脉增生、淋巴细胞浸润、可见EBV感染B细胞；免疫组化CD2/CD3/CD4/CD5阳性（AITL者CD10、PD-1阳性）；血象白细胞增加可类白血病反应；骨髓增生明显活跃、免疫母细胞增多；血沉快、ALP和LDH增高。治疗：激素小剂量开始，无效加量，疗程3~6个月；左旋咪唑2~5mg/kg每日、用3天停4天；转化淋巴瘤者化疗。' },
  { m: '29J', q: 'Kikuchi病（亚急性坏死性淋巴结炎）的特点？', a: '又称组织细胞性坏死性淋巴结炎（HNL）、菊池病，1972年Kikuchi和Fujimoto同时报道。原因不明，是免疫反应性非肿瘤性淋巴结肿大，好发年长儿、男性多、冬季多，可能与病毒或变态反应有关。\n临床：急性或亚急性经过；多数病前5~7天有咽炎、腮腺炎、咽结膜热；高热（热型不定、热程长）、淋巴结肿大以颈部为主（可累及全身浅表及深部，几个到十几个，质软、活动、无粘连融合、无局部潮红灼热，持续肿大1~3个月），部分压痛或自发痛；部分肝脾轻度大、伴不定形皮疹、关节痛。\n实验室：①淋巴结活检是主要诊断依据——淋巴细胞变性坏死、部分细胞母细胞化、组织细胞增生，但无中性粒细胞浸润（与一般组织坏死不同）；免疫组化增生组织细胞CD68+；病理分三期（增殖期、坏死期、黄色瘤期）可同时存在于同一淋巴结；包膜下皮质区广泛凝固性坏死灶，中心为淋巴细胞与组织细胞凝固性坏死、多量核碎片，周围该类细胞增生。②白细胞减少（常<4×10⁹/L），非典型淋巴细胞增多；③重症者骨髓淋巴细胞占优势、粒细胞减少；④血沉增高；⑤PHA皮试反应及淋巴细胞转化率减低（细胞免疫功能降低）。\n鉴别：淋巴瘤、传单、白血病、SLE等。\n治疗：自限性疾病，病程1~3个月，预后多良好但可复发，极少数死于灶性心肌坏死、肺出血。抗生素无效！主要依靠糖皮质激素（重危病例短期应用）；病因不明时不宜常规使用。' },
  { m: '29J', q: '自身免疫性淋巴增生综合征（ALPS）的要点？', a: '又称Canale-Smith综合征（1967年），FAS基因介导的凋亡受损导致的淋巴细胞增殖性遗传病。淋巴细胞凋亡障碍→慢性淋巴细胞增殖、自身免疫反应和致瘤倾向。约70%患者有明确突变：FAS、FASLG、CASP10或CASP8（少数NRAS、KRAS），几乎所有突变都与FAS凋亡通路有关。\n临床：多儿童期起病（中位1.8岁）；>80%慢性淋巴结肿大（颈、腋、腹股沟），肝脾大常见；多数有自身免疫性血细胞减少、Coombs试验阳性；少数自身免疫性肾炎、肝炎、胃炎、关节炎、葡萄膜炎；FAS突变阳性者可继发霍奇金和非霍奇金淋巴瘤。\n实验室：外周血及淋巴组织中TCRαβ CD3+CD4-CD8-双阴性T细胞（DNT）升高；淋巴细胞凋亡检测异常；高丙种球蛋白血症；自身抗体异常；血浆sFASL、IL-10、IL-18及维生素B12升高；淋巴结活检副皮质区T细胞增加（多为DNT，CD45RO阴性）、滤泡增生、浆细胞增多、滤泡间血管明显增多；T细胞指数增长（大量有丝分裂、Ki-67高）。\n诊断（2009 NIH修订标准）：确诊需2个主要依据+1个主要辅助依据；疑似诊断需2个主要依据+1个次要辅助依据。\n主要依据：①慢性（>6个月）非恶性、非感染性淋巴结肿大和/或脾大；②DNT细胞在总淋巴细胞中≥1.5%、在CD3+淋巴细胞中≥2.5%。\n主要辅助依据：①两种不同方法检测到淋巴细胞凋亡异常；②FAS、FASLG、CASP10或CASP8体细胞或种系突变。\n次要辅助依据：①血浆sFASL>200pg/ml、IL-10>500pg/ml、维生素B12>1500ng/L或IL-18>500pg/ml；②典型免疫组化改变；③自身免疫性血细胞减少+IgG增高；④非恶性非感染性淋巴细胞增生家族史。\n分型：ALPS-Fas（生殖细胞FAS突变）、ALPS-sFas（体细胞FAS突变）、ALPS-FasL、ALPS-CASP10、ALPS-U；相关疾病：CEDS、RALD、DALD、XLP1。\n治疗：控制自身免疫和恶性肿瘤倾向——短期大剂量激素对自身免疫性血细胞减少有效（有时需长期+细胞毒药物）；MMF可缓解淋巴细胞增生；西罗莫司（mTOR抑制剂）清除DNT细胞、增加免疫功能、降低肿瘤风险；抗CD20（利妥昔单抗）用于难治性B细胞增生；严重纯合子突变者需终身较强免疫抑制剂；器官衰竭、死亡风险时异基因骨髓移植。鉴别：恶性肿瘤、Castleman病、Rosai-Dorfman病、Evans综合征、CVID。' },
  { m: '29J', q: 'Castleman病和Rosai-Dorfman病的要点？', a: 'Castleman病（血管滤泡性淋巴结增生/巨大淋巴结增生）：少见淋巴增生性疾病，1956年命名；病因不明，可能与感染（人疱疹病毒8型）、炎症有关，IL-6在发病中起重要作用。分：\n①局灶型——多见儿童，纵隔或腹部单一巨大淋巴结（直径可达7~8cm），多无全身症状；手术后多可治愈。\n②多中心型——发病年龄较大，全身性B细胞淋巴增生：淋巴结肿大、肝脾大+发热、贫血、IL-6增多、多克隆高丙种球蛋白血症；可能与HIV感染、自身免疫病、POEMS综合征相关，可伴发非霍奇金淋巴瘤。\n治疗：局灶型手术；多中心型无标准方案——化疗、类固醇、抗CD20（利妥昔单抗，目前最常见一线）、抗IL-6（司妥昔单抗，34%长期缓解）、抗IL-6受体（托珠单抗）、抗病毒（更昔洛韦）、干扰素-α。\nRosai-Dorfman病（窦组织细胞增生伴巨大淋巴结病/罗道病）：罕见非朗格汉斯细胞组织细胞增生症，多自限性，病因不明（免疫紊乱；KRAS、NRAS、MAP2K1及ARAF突变）。儿童常见、男多于女。典型表现：颈部双侧多个无痛性淋巴结病±发热盗汗体重减轻，纵隔、腋窝、腹股沟可受累；43%伴结外受累（软组织，最常见皮肤，其次鼻腔鼻窦、上腭、眼眶、骨骼、CNS）。实验室：白细胞增多、ESR升高、多克隆IgG升高及自身抗体；淋巴结活检见吞噬淋巴细胞的苍白组织细胞，S100阳性、IgG4阳性细胞较多。鉴别：朗格汉斯细胞组织细胞增生症、骨髓增生性疾病、高IgG4综合征、淋巴瘤。多自限性不需治疗，但多年后可复发，伴自身免疫病时死亡率较高；泼尼松可治部分重症；难治者手术+放疗；免疫调节（干扰素-α、2-氯脱氧腺苷、西罗莫司、利妥昔单抗）有效，抗生素无效。' },
  { m: '29K', q: '遗传性出血性毛细血管扩张症（HHT）的诊断标准和治疗？', a: 'HHT是常染色体显性遗传性血管发育异常，基础是毛细血管扩张和动静脉畸形；致病基因均与TGF-β信号转导有关。国外发病率约1/2000~1/8000。\n临床表现（出血可自发，诱因包括外伤手术、月经分娩、腹压增高、感冒发热、过度疲劳、久立跋涉）：\n①鼻出血——最常见最早，绝大多数患者最终出现，自发或轻微刺激诱发，夜间多发，严重程度随年龄增加；\n②皮肤黏膜毛细血管扩张——特征性病变为鲜红或紫红色毛细血管扩张，反复同一部位出血；\n③上消化道出血（胃和十二指肠上部最常见，缓慢持续，随年龄加重）；\n④肺动静脉畸形——30%患者出现，常双侧多发、下肺常见；\n⑤中枢神经出血（头痛、癫痫、颅内出血、脑脓肿、TIA；2/3由肺动静脉畸形导致）；\n⑥肝脏受累（女性多，多因肝内血管分流有症状）。\n实验室：血常规大致正常（长期出血者贫血），凝血时间及血小板计数正常；增强超声心动图筛查肺分流（发现分流再做3mm层厚肺CT）；头颅MRI筛查脑动静脉畸形；病理——毛细血管仅单层内皮细胞、外裹疏松结缔组织，缺乏弹力纤维和平滑肌。\n诊断（2000国际HHT基金科学顾问委员会）：①反复发作自发性鼻出血；②多个特征部位毛细血管扩张（唇、鼻、手指、口腔黏膜等）；③内脏受累（消化道毛细血管扩张，肺、肝、脑动静脉畸形）；④阳性家族史。符合≥3条确诊，2条疑似，<2条暂不考虑。\n治疗：对症支持为主，避免鼻部外伤、避免血管扩张剂和阿司匹林等非甾体药，止血尽量用非创伤性手段。鼻出血——轻度激光切除，重度鼻中隔皮肤成形厚皮移植，复发性经导管栓塞（避免电和化学烧灼）；上消化道出血——内镜加热探针/双极电凝/激光，无效考虑外科；肺动静脉畸形——有症状或直径>3mm者血管栓塞；脑动静脉畸形——症状或畸形>1cm立即治疗（栓塞、手术、立体定向放疗）；肝脏动静脉畸形——肝移植是目前有效方法；贫血——口服/肠道外铁剂，重者输血。' },
  { m: '29K', q: '埃勒斯-当洛斯综合征（EDS）和卡萨巴赫-梅里特综合征（KMS）的要点？', a: 'EDS（皮肤弹性过度综合征）：先天性结缔组织发育不全，多为常染色体显性。机制——胚胎期中胚层发育不全，胶原纤维量减少和形态异常，系Ⅲ型前胶原基因COL3A1突变（Ⅳ型血管型特点为大血管破裂）。Ⅳ型EDS罕见（1/100万~1/10万），男性多。\n临床：特殊面容（窄鼻梁、突眼、眼睑毛细血管扩张、薄唇、无耳垂）；皮肤变薄半透明、弹性过度（松手后迅速恢复）、烟纸样皱褶瘢痕、易瘀斑血肿；血管异常（20岁后增多、40岁前达80%，腹部中等血管为主）；胃肠道破裂（最常结肠尤其乙状结肠）；妊娠并发症（胎膜早破、子宫破裂等）；关节过度弯曲。\n实验室：束臂试验阳性、凝血试验正常，血小板PF3活性及胶原诱导聚集异常；皮肤病理——弹力纤维和胶原纤维增加、真皮胶原缺乏排列紊乱；X线皮下结节状钙化。\n诊断：主要标准（动脉破裂、肠破裂、妊娠子宫破裂、EDS家族史）满足2项高度特异；次要标准（皮肤菲薄半透明、易挫伤、特征性面容等）。鉴别马凡综合征、弹性假黄瘤等。治疗：无根治，避免外伤；腔内修复技术创伤小。\nKMS（血管瘤伴血小板减少综合征）：婴幼儿血管瘤患儿中约0.3%，1940年报道；病理常为卡波西样血管内皮细胞瘤和丛状血管瘤。机制：血管肿瘤内血小板凝聚停滞→局部血栓→消耗血小板和凝血因子Ⅱ、V、Ⅷ和纤维蛋白原（慢性消耗性凝血障碍）+血小板破坏+继发纤溶→DIC。\n临床：新生儿或小婴儿（平均生后5周）；四肢或躯干生长迅速的暗紫红肿物或斑块，周边自发性瘀点瘀斑；反复周期性出血为特征——100%存在血小板减少、低纤维蛋白原和D-二聚体升高；可累及内脏（气道压迫致呼吸衰竭、高输出性心衰）。\n诊断：出生时或生后不久巨大血管肿瘤+血小板减少或慢性DIC；与婴儿血管瘤鉴别（KMS为GLUT1阴性、CD61阳性；婴儿血管瘤GLUT1阳性、出生时不存在、可自行消退、无血小板减少）。\n治疗：目的缩小瘤体、控制血小板减少和出血。一线大剂量激素（泼尼松2~5mg/(kg·d)，重者甲泼尼龙10~30mg/(kg·d)冲击）；免疫抑制剂（长春新碱、环磷酰胺、放线菌素D、雷帕霉素——首选雷帕霉素单药）；支持（潘生丁、肝素抗DIC，间断输新鲜冰冻血浆或血小板）；外科（局限浅表者切除或硬化剂注射）。致死率高，应重视。' },
  { m: '29K', q: '先天性血小板减少症的分类和MYH9相关疾病（MYH9-RD）的要点？', a: '先天性（遗传性）血小板减少症（ITs）：罕见，目前至少32个基因、33种形式。按血小板大小分类：\n①大血小板性（MPV>11fl）——MYH9相关疾病、GPIb-IX-V复合物疾病、Alport综合征及其变异型、灰色血小板综合征、X连锁血小板减少伴地中海贫血（XLTT）、Paris-Trousseau综合征；\n②正常血小板性（MPV7~11fl）——CAMT、TAR综合征、ATRUS、范科尼贫血、伴AML倾向的家族性血小板疾病（FPD/AML）；\n③小血小板性（MPV<7fl）——Wiskott-Aldrich综合征、X连锁血小板减少症。\nMYH9-RD：22q12-13基因突变，编码非肌性肌球蛋白重链NMMHC-ⅡA（表达于血小板、肾、白细胞、耳蜗）；常染色体显性巨血小板减少症。包括May-Hegglin异常、Fechtner综合征、Sebastian综合征、Alport综合征、Epstein综合征。机制——巨核细胞骨架蛋白结构高度不稳定→血小板前体成熟障碍→血小板减少；NMMHC-ⅡA是血小板生成的负性调节因子；异常凝集在中性粒细胞内形成包涵体。N端启动子区突变影响更显著——严重血小板减少、40岁前出现肾炎和耳聋；C端终止区突变——轻症、亚临床或老年出现。\n临床三联症：血小板减少+巨大血小板+白细胞Dohle样包涵体；各型均可出血倾向程度不同；神经性耳聋（FS、ES成年后出现）；肾炎（成年后，血尿蛋白尿高血压，部分进展肾衰）；白内障和青光眼；Epstein综合征无包涵物。\n辅助检查：血小板减少、体积增大、功能基本正常；出血时间正常或稍延长；外周血涂片中性粒细胞质内蓝色包涵体（瑞-吉染色，特征性）；骨髓巨核细胞内多个核和嗜苯胺蓝颗粒（FS）。\n治疗：支持为主——避免误诊为ITP而接受激素/IVIg/脾切除等不适当治疗；血小板输注仅用于难以控制的出血、大手术前、难产；手术前后可给DDAVP（0.3μg/kg）和氨甲环酸（注意巨大血小板防术后静脉血栓）；改善贫血；ACEI延缓蛋白尿和肾功能损害。' },
  { m: '29K', q: 'Bernard-Soulier综合征（BSS）、先天性无巨核细胞血小板减少症（CAMT/TAR/ATRUS）和Wiskott-Aldrich综合征（WAS）的要点？', a: 'BSS（GPIb-IX-V复合物缺陷）：常染色体隐性（双等位基因，症状最重，近亲婚配常见，85%为纯合子）或显性（单等位基因，大血小板+轻症）。GPIb-IX是vWF受体，vWF在内皮下基质与血小板间起桥梁作用。患病率低于百万分之一。6种异常特征：血小板减少、黏附功能异常、与凝血酶相互作用异常、凝血活性异常、与P选择素作用异常、与白细胞整合素作用异常——出血程度比血小板减少预期更重（血小板质量缺陷）。\n辅助检查：血小板减少程度各异；涂片血小板体积巨大（1/3~4/5直径>3.5μm）；出血时间延长（MMT除外）；典型BSS血小板不能在瑞斯托菌素诱导下聚集且不能被正常血浆纠正；PTvWD（血小板型vWD）瑞斯托菌素诱导聚集增强、血浆vWF浓度下降。\nCAMT：常染色体隐性，TPO受体c-Mpl突变（Ⅰ型反应减少、Ⅱ型功能降低），报道<100例；出生时显著血小板减少及出血，3~5岁前多发展为再障（TPO也影响造血干细胞）；MDS/AML风险高，可伴心脏畸形。TAR综合征：常隐（或显伴多外显率），巨核细胞极度减少或缺如+双侧桡骨缺失（双侧拇指存在！）+内脏畸形，发生率1/10万~1/5万，47%下肢短小、47%牛奶不耐受；TPO正常、骨髓增生活跃。ATRUS：HOXA11突变，近端桡尺骨融合+骨髓无巨核细胞。\nWAS：X连锁免疫缺陷（Xp11.22，WASP基因），发病率活产男婴0.4/10万；特征为小血小板（MPV3.5~5fl，约为正常一半）、血小板减少、湿疹、反复感染、T细胞缺乏，易发展为自身免疫病（40%，AIHA最常见，约1/3在5岁前发生，高IgM是危险因素）和淋巴瘤/白血病。三表型：经典WAS、X连锁血小板减少症（XLT）、X连锁中性粒细胞减少症（XLN）；免疫缺陷以T细胞为主、随年龄加重。\n诊断依据：①男性；②反复感染、湿疹、持续血小板减少伴小血小板；③血清IgE及IgA增加、IgM降低、缺乏同种血型抗体、对多糖抗原免疫应答弱；④WAS基因检测阳性。Ig正常不能否定（1岁以下多正常）；与ITP鉴别靠WASP基因分析；输同型正常血小板寿命正常可确诊。\n治疗：防治感染（复方磺胺甲噁唑预防卡氏肺囊虫肺炎，不推荐活疫苗）；IVIg 400mg/kg每月1次（WAS患者IgG代谢过度需大剂量频繁用，但对升血小板无效——非体液免疫介导）；湿疹局部激素；重症出血血小板输注；HSCT是唯一能根治的方法（XLT预后较好可不移植）；基因治疗研究中。' },
  { m: '29K', q: '儿童ITP的诊断标准和疾病分期？', a: 'ITP（原发免疫性血小板减少症，旧称特发性血小板减少性紫癜）：获得性自身免疫性出血性疾病，儿童年发病率4~5/10万，高于成人；常2~4周前有前驱感染或疫苗接种史；以皮肤黏膜出血为主，颅内出血发生率<1%。80%病例诊断后12个月内血小板恢复正常，约20%病程持续1年以上。机制：免疫介导血小板破坏增多+免疫介导巨核细胞产生血小板不足。\n诊断（临床排除性诊断）：\n①至少2次血常规检查血小板减少，血细胞形态无异常；\n②脾一般不大；\n③骨髓检查：巨核细胞数增多或正常、有成熟障碍（典型ITP骨髓非必须检查，目的是排除其他造血疾病）；\n④排除其他继发性血小板减少——自身免疫病、甲状腺疾病、药物诱导、同种免疫性、淋巴增殖性疾病、MDS、恶性血液病、慢性肝病、脾亢、消耗性减少、感染、假性血小板减少、获得性和遗传性TTP在内的微血管病性溶血以及遗传性血小板减少等。\n出血评分系统量化出血情况。\n分期：新诊断ITP（确诊后3个月内）；持续性ITP（3~12个月血小板持续减少）；慢性ITP（>12个月）。\n重症ITP：血小板<10×10⁹/L，且就诊时存在需要治疗的出血症状或常规治疗中发生新的出血症状，且需用其他升血小板药物或增加现有药物剂量。\n难治性ITP（同时满足3条）：①脾切除后无效或复发；②仍需要治疗以降低出血危险；③除外其他血小板减少原因确诊ITP。' },
  { m: '29K', q: '儿童ITP的治疗（一般原则、一线、紧急、二线）？', a: '一般原则：ITP多自限，治疗取决于出血症状而非血小板数目——PLT≥20×10⁹/L且无活动性出血可观察随访不予治疗。有出血症状无论血小板多少都应积极治疗。临床操作血小板参考值：口腔科检查≥20、拔牙补牙≥30、小手术≥50、大手术≥80×10⁹/L。增加出血风险的因素：患病时间延长、血小板功能缺陷、凝血因子缺陷、未控制的高血压、外科手术或外伤、感染、必须服用阿司匹林/抗凝药。\n一线治疗：\n①肾上腺糖皮质激素——泼尼松1.5~2.0mg/(kg·d）晨顿服（最大60mg/d），血小板≥100×10⁹/L后稳定1~2周渐减，疗程4~6周；4周无反应即无效，迅速减停。或大剂量地塞米松冲击0.6mg/(kg·d)（最大40mg）×4天，不满意可28天为一疗程再应用，反复2~5次。\n②IVIg 400mg/(kg·d)×(3~5）天或0.8~1.0g/(kg·d）用1~2天，必要时重复（慎用于IgA缺乏、糖尿病、肾功能不全）。\n紧急治疗（重症ITP<10×10⁹/L伴活动性出血或需急诊手术）：迅速提升至50×10⁹/L以上——随机供者血小板输注（仅限危及生命出血，非危急不建议输注——无效且增加后续治疗难度）+IVIg 1.0g/(kg·d)×2~3天和/或甲泼尼龙10~30mg/(kg·d）（最大1.0g/d×3天）和/或促血小板生成药物；其他——停用抗血小板药、控制高血压、局部加压、氨甲环酸等纤溶抑制剂，仍不能控制可用rhFⅦa。\n二线治疗：\n①促血小板生成类——rhTPO 300IU/(kg·d）皮下，≥100×10⁹/L可停药，14天不升视为无效；艾曲波帕口服（空腹2~4小时，与多价阳离子间隔，东亚人群剂量更低，最大75mg/d，维持血小板≥50×10⁹/L）；罗米司亭；起效快1~2周，停药疗效一般不维持，需个体化维持。\n②利妥昔单抗——标准方案375mg/m²每周1次×4次；小剂量100mg/次每周1次×4次；首次注射4~8周内起效；注意血清病，半年内获得性体液免疫功能低下。\n③脾切除——严格掌握指征、尽可能推迟：经正规治疗仍有危及生命严重出血或急需外科手术；病程>1年、年龄>5岁、反复严重出血、药物无效或依赖大剂量激素（>30mg/d）；激素禁忌证。切脾前重新评估诊断、接种嗜血流感杆菌/脑膜炎双球菌/肺炎链球菌疫苗；切脾无效或复发者查副脾。术后长期预防感染。\n④其他——硫唑嘌呤3~5mg/(kg·d)、环孢素A 5mg/(kg·d)、雷帕霉素（抑制mTOR选择性扩增Treg，适合Treg低和DNT高的患儿）、长春新碱1.4mg/m²（最大2mg）每周1次共3~6次。\n疗效判断：CR——血小板≥100×10⁹/L且无出血；PR——≥30~100×10⁹/L且至少比基础值增加2倍且无出血；持续反应——R/CR持续≥4周；NR——<30×10⁹/L或增幅不到2倍或有出血；复发——降至30×10⁹/L以下或不到基础值2倍或出现出血。' },
  { m: '29K', q: '新生儿红斑狼疮（NLE）的要点？', a: 'NLE是母亲自身抗体（主要为抗Ro/SSA、La/SSB，少数抗U1RNP）经胎盘进入胎儿体内导致的获得性自身免疫病，1954年首次报道；表现为一过性皮肤损害和/或先天性心脏传导阻滞，部分合并出血和血栓。\n机制：母体抗体经胎盘传递→抗原抗体复合物诱发组织损伤；抗SSA靶抗原Ro52KD和Ro60KD，抗SSB靶抗原La48KD（后者更具特异性）；母体抗SSA/SSB在孕12周经胎盘传至胎儿，孕24周左右造成心脏传导系统免疫损伤。病情活动性随母体获得性抗体代谢降低而降低。\n多见于3个月内婴儿（国外发病率1:20000，男女比1:2.3）。\n临床表现：\n①皮肤损害——最突出（国外50%、国内报道77.7%），出生时或生后2个月内（平均6周）出现；典型皮疹为亚急性红斑狼疮样环形/半环形红斑，多见于日光暴露部位（头皮颜面、眶周最典型）；病理——表皮萎缩、基底细胞液化变性、真皮血管周围淋巴细胞浸润、基底膜带IgG（亦有IgM/IgA）和补体沉积；有光敏性但非必需，多生后6个月内自行消退不留痕迹；\n②心脏损害——先天性房室传导阻滞（CHB）最常见（30%~50%），完全性或不完全性，孕24周左右形成，出生时几乎已存在，出生很少进展；合并心肌病者死亡率高达20%，2/3以上需长期安装起搏器；\n③血液系统异常——血小板减少、白细胞减少、溶血性贫血（国外10%~20%）；抗磷脂抗体/狼疮凝集物阳性是紫癜性皮损和微血管阻塞的重要原因；\n④其他——约9%肝脏受累（妊娠或新生儿期严重肝衰竭、高胆红素血症、肝酶升高），肾脏极少受累，CNS少见（脑白质减少、基底节钙化等）。\n诊断：患儿典型暴露部位环形红斑+患儿及母亲高滴度抗SSA和/或抗SSB抗体±先天性心脏传导阻滞。鉴别胎传梅毒（皮疹好发掌跖、扁平湿疣）、花斑癣、玫瑰糠疹。\n治疗：仅皮肤损害——避光防护即可自行消退，不需激素；皮疹明显外用中低效激素或钙调磷酸酶抑制剂；血细胞减少——小剂量激素；三度传导阻滞危及生命需植入起搏器；狼疮凝集物阳性伴微血管阻塞——抗凝和抗血小板治疗。' },
  { m: '29K', q: '血小板功能缺陷病（血小板无力症GT、贮存池病等）的要点？', a: '血小板功能缺陷病：因血小板黏附、凝聚、释放、促凝功能及花生四烯酸代谢缺陷所致的出血性疾病，分先天遗传性和后天获得性，儿童以先天性为主——共同特点：血小板数目无明显减少而功能异常。\n三大类：①血小板膜异常——巨大血小板综合征（BSS）、血小板型vWD、血小板无力症、PF3缺乏症（Scott综合征）；②贮存池疾病——致密体缺乏（δ-SPD）、灰色血小板综合征（α-SPD）；③花生四烯酸代谢异常——阿司匹林样缺陷、血栓烷合成酶缺乏症、血栓烷反应异常症。\nBSS：常染色体隐性，基本病变GPIb/V/IX复合物缺陷（血小板主要黏附受体，与vWF结合黏附内皮下）；缺乏黏附受体→不能黏附内皮下组织。临床：轻中度皮肤黏膜出血、近亲婚配家族史、肝脾不大。实验室：血小板正常至轻度减少（与BT延长不成比例）、50%~80%伴巨大血小板（直径4~8μm可达15~20μm）；BT延长、血块收缩正常；聚集试验——加瑞斯托霉素、凝血酶、含因子Ⅷ的牛纤维蛋白原不聚集，加其他诱导剂聚集正常；缺乏GPIb（单克隆抗体确诊）；凝血酶原消耗明显异常。治疗：输注血小板可止血，激素或切脾可增加血小板；HSCT是唯一根治方法。\n血小板无力症（GT/Glanzmann病）：常染色体隐性，基本缺陷是GPⅡb和/或GPⅢa质或量异常（ITGA2B和ITGB3基因，均在17q21~32）→血小板不能聚集。GPⅡb/Ⅲa即αⅡbβ3整合素，是纤维蛋白原受体。临床：婴幼儿期发病，中重度皮肤黏膜出血（瘀点紫癜、牙龈出血、月经过多、反复鼻出血），肌肉关节内脏颅内出血罕见，外伤手术后出血不止；无关节肌肉出血史；随年龄增长可减轻。实验室：血小板数、形态、寿命正常，血涂片血小板呈分散不聚集现象；BT延长、凝血时间正常；血块收缩不良或不收缩；对任何浓度ADP、肾上腺素、凝血酶、胶原、花生四烯酸均无聚集反应，加瑞斯托霉素聚集正常或接近正常；GPⅡb/Ⅲa含量减少或缺乏（含量不是出血轻重指标）。\n鉴别：BSS（瑞斯托霉素不聚、其他正常，GPIb缺乏）；贮存池病（计数形态正常，致密体减少，ADP第一相聚集正常第二相缺乏）。\n治疗：出血时输血小板、局部止血；避免影响血小板功能药物；HSCT是根治唯一方法，基因治疗研究中。' },
  { m: '29K', q: '贮存池病（SPD）和获得性血小板功能缺陷病的要点？', a: '贮存池病（SPD）：血小板缺乏贮存颗粒或其内容物释放障碍；常染色体显性（Weiss 1969年描述）；分致密颗粒缺陷症、α-颗粒缺陷症（灰色血小板综合征）及联合缺陷。亦见于：HPS（常隐，SPD伴白化病）、CHS（巨大包涵体、部分白化）、WAS（小血小板、致密颗粒减少）、TAR（桡骨缺失、功能缺陷如SPD）。\n灰色血小板综合征（GPS/α贮存池病）：α颗粒内容物（PF4、β-TG、纤维蛋白原、vWF、TSP等）减少——合成的蛋白不能贮存于α颗粒，血浆PF4、β-TG浓度正常或增高、PDGF直接释放进骨髓基质致骨髓纤维化正常或升高；血小板电镜下灰色无颗粒；表现轻中度皮肤黏膜出血，常并发白化病；瑞氏染色血小板灰色缺乏颗粒；ADP/肾上腺素第一聚集波正常、第二聚集波减弱或消失，瑞斯托霉素聚集正常。\n阿司匹林样缺陷（轻型血小板病）：常显，花生四烯酸代谢缺陷（环氧化酶缺陷→TXA2合成异常），血小板释放ADP障碍；自幼皮肤黏膜轻度出血；对ADP、肾上腺素仅第一聚集波无第二聚集波，对花生四烯酸无反应；停用抑制血小板药（阿司匹林、消炎痛、保泰松等）。\n血小板型vWD（PTvWD）：常显，因子Ⅴ相关蛋白异常致GPIb与vWF亲和力增强、血浆vWF缺乏——类似vWD表现；血小板低浓度瑞斯托霉素诱导聚集增强；DDAVP效果良好。\n获得性血小板功能缺陷病：发病率远高于先天性；共同点——有原发疾病或诱因、无出血既往史家族史、PF3功能低下、血小板计数正常（>100×10⁹/L）、BT延长、血块收缩和ADP凝聚正常。病因：尿毒症（最主要因素血小板聚集减少和黏附受损，治疗透析/肾移植）、骨髓增殖性疾病（PV/ET/PMF，缺乏脂肪氧合酶）、肝脏疾病（肝硬化门脉高压致分布异常性血小板减少）、伴血小板功能异常的ITP（抗体针对GPⅡb-Ⅲa或GPIb-Ⅸ）、药物诱发（阿司匹林抑制COX减少TXA2；右旋糖酐；肝素；抗组胺药；β-内酰胺类抗生素——停用几天恢复正常；作用于cAMP系统的药物如双嘧达莫、氨茶碱、PGE等）。' },
  { m: '29L', q: '血友病A/B的临床分型、诊断和鉴别诊断？', a: '血友病是一组X连锁隐性遗传性出血性疾病，分血友病A（FⅧ缺乏）和血友病B（FⅨ缺乏）；男性人群中A发病率约1/5000、B约1/25000；所有血友病患者中A占80%~85%、B占15%~20%，女性患者极罕见；我国患病率2.73/10万。\n临床表现：任何部位出血，多数集中在关节、肌肉；也可皮肤黏膜出血（瘀斑、鼻出血、口腔、消化道、泌尿道）；严重者可内脏出血、颅内出血危及生命。重型无明显外伤即自发，中型小手术/外伤后严重出血偶有自发，轻型大手术外伤后严重出血。出血常呈血液缓慢渗出表现，损伤程度与出血量相关。\n分型（按FⅧ或FⅨ活性）：重型<1%（肌肉或关节自发出血）；中型1%~5%（小手术/外伤后严重出血，偶有自发）；轻型>5%~40%（大手术或外伤可致严重出血）。\n诊断：①筛选——血常规血涂片（排除血小板异常）+凝血谱（PT、APTT、TT、纤维蛋白原）；单纯APTT延长者进一步查FⅧ、FⅨ、FⅪ、FⅫ活性和vWF：Ag及狼疮抗凝物（部分轻型APTT可正常）；②确诊——检测FⅧ：C/FⅨ：C活性及抗原或抗体，排除vWD和获得性血友病；③基因诊断（F8/F9基因突变）助确诊及携带者诊断。\n鉴别诊断：\n①获得性血友病——非血友病患儿产生抗FⅧ或FⅨ自身抗体，表现类似但极少关节出血；年长儿、男女均可、无既往出血史及家族史；常有诱因（恶性肿瘤、自身免疫病、感染、大手术）；APTT延长不能被1:1正常血浆纠正，抑制物定量检测滴度。\n②vWD——发病率最高的遗传性出血性疾病（0.5%~1.5%），常显或隐性；以皮肤黏膜出血为主（与血友病不同）；确诊分型需查vWF：Ag及活性（瑞斯托霉素辅因子活性）、胶原结合、FⅧ结合试验、vWF蛋白电泳等。\n③生理性凝血因子缺乏——生后0~6月（尤其早产儿）FⅨ可为正常的20%~30%，6月龄后升至正常。\n④继发性凝血因子缺乏——肝功能异常、维生素K缺乏、DIC等多因子缺乏。' },
  { m: '29L', q: '血友病的凝血因子抑制物检测和治疗（按需、预防、抑制物处理）？', a: '抑制物：重型血友病A 25%~30%出现，常在应用凝血因子的前20~50个暴露日（ED）；儿童是发生抑制物最常见人群。检测时机——1~20ED每5ED测1次，21~50ED每10ED测1次，此后每年至少2次直至150ED；疗效变差首先考虑抑制物；术前必测。筛查——APTT纠正试验（正常血浆：患者血浆1:1混合，即刻及37℃孵育2小时测APTT，不能纠正提示抑制物）。滴度（Bethesda法）——患儿血浆56℃孵育30分钟，不同稀释度与正常血浆混合孵育后测残余FⅧ活性，使正常FⅧ：C减少50%为1BU；≥0.6BU/ml为阳性；>5BU/ml为高滴度，≤5BU/ml为低滴度。\n按需（急性出血）治疗：替代治疗最有效，原则早期、足量、足疗程。血友病A首选重组FⅧ或病毒灭活血源性FⅧ（无条件者冷沉淀/FFP）；输注1IU/kg使FⅧ：C提高2%，半衰期8~12小时，需每8~12小时输注；FⅧ首次需要量=（目标浓度-基础浓度）×体重×0.5。血友病B首选重组FⅨ或病毒灭活PCC；1IU/kg使FⅨ：C提高1%，半衰期18~24小时，每24小时1次（严重出血或手术每12小时）。目标水平：关节/表层肌40~60IU/dl 1~2天；髂腰肌和深层肌起始80~100维持30~60共3~5天；CNS/咽喉颈部起始80~100维持50共8~21天；胃肠起始80~100维持50共7~14天；肾脏50共3~5天。\n辅助治疗：①PRICE原则（制动、休息、冷敷每4~6小时5~10分钟、压迫、抬高）；②DDAVP——轻型血友病A有效（重型无效），0.3~0.4μg/kg静滴（≥30分钟）每12小时1次用1~3天，FⅧ升高>30%或上升>3倍为有效，>2岁限水并预试验；③抗纤溶药——氨甲环酸、6-氨基己酸（口腔扁桃体咽喉出血及拔牙有效，关节腔深部肌内脏无效，泌尿系出血严禁，避免与PCC合用）；④止痛药——对乙酰氨基酚、弱强阿片、COX-2类，禁用阿司匹林和其他NSAIDs。\n预防治疗：重型标准疗法，目标年关节出血次数（AJBR）<3次。分级——初级（确诊后第2次关节出血前、<3岁、无关节病变即开始）、次级（两次以上关节出血后、尚无关节病变）、三级（已证实关节病变）。方式——临时预防（单剂，应对体育课、旅行等）、短期预防（1~3个月，阻止靶关节恶性循环）、长期预防（每年>45周）。方案——标准25~40IU/kg（A每周3次或隔日、B每周2次）；中剂量15~30IU/kg；小剂量A每次10IU/kg每周2次或每3天1次、B每次20IU/kg每周1次；重型A 20IU/kg每周2~3次为较适方案。\n抑制物处理：低滴度——加大FⅧ剂量（外源FⅧ 20IU/kg中和1BU/ml并额外增量），注意5~7天后免疫记忆应答可换旁路；高滴度——直接旁路制剂：PCC 50~100IU/(kg·次）间隔8~12小时（每天≤200IU/kg）或rFⅦa 90μg/kg静推间隔2~3小时1~3次（或270μg/kg一次）。血友病B高滴度抑制物或对FⅨ过敏者用rFⅦa。' },
{ m: '29M', q: '弥散性血管内凝血（DIC）的定义、常见基础疾病及两种临床表现类型的机制？', a: 'DIC是获得性出血综合征，表现为凝血因子消耗、纤溶系统激活、微血栓形成和出血倾向，可同时或顺序发生，不是独立疾病而是众多疾病病理过程的中间环节。\n基础疾病：严重感染/败血症、严重创伤、器官损害（急性坏死性胰腺炎）、恶性肿瘤（实体瘤、急性早幼粒细胞白血病）、病理产科、血管异常（巨大海绵状血管瘤）、严重中毒或免疫反应。\n机制：致病因素→血管内皮受损、组织因子大量释放、血细胞损伤释放类组织因子→凝血酶生成放大、生理性抗凝系统受抑制。\n临床表现取决于凝血酶与纤溶酶平衡：以凝血酶生成为主→微血栓形成、脏器功能衰竭；以纤溶酶生成为主→凝血因子缺乏的出血表现。' },
{ m: '29M', q: 'DIC的一般诊断标准和2010年ISTH评分系统的内容？', a: '一般诊断标准：\n①存在易引起DIC的基础疾病；\n②1项以上临床表现：多发性出血倾向；不易用原发病解释的微循环衰竭或休克；多发性微血管栓塞症状体征。\n③同时3项以上实验室异常：血小板<100×10⁹/L或进行性下降；纤维蛋白原<1.5g/L或进行性下降或>4g/L；FDP>20mg/L或D-二聚体升高或3P试验阳性；PT缩短或延长3秒以上，或APTT缩短或延长10秒以上。\n2010年ISTH评分：\n风险评估（8类相关疾病任1项）→血小板计数（>100计0分，<100计1分，<50计2分）；D-二聚体（无增加0分，中度1分，显著2分）；纤维蛋白原（<1.0g/L计0分，≥1.0计1分）→积分>5分为典型DIC，<5分为非典型DIC（每日评估），=5分密切观察。\n强调：不能仅凭单一指标或一次检查，需综合分析和动态监测。' },
{ m: '29M', q: 'DIC的治疗原则：抗凝（肝素）适应证禁忌证与剂量、替代治疗、其他治疗？', a: '治疗原则：治疗基础疾病、去除诱因是最关键根本措施；病因能迅速去除者凝血紊乱多可自行纠正。\n1.抗凝治疗（抑制过度活化、重建凝血-抗凝平衡）：\n普通肝素：一般≤200U/(kg·d)，每6小时≤2500U，静脉或皮下，连用3~5天。\n低分子肝素：100U/次，每12小时一次皮下，连用3~5天。\n适应证：①DIC早期（高凝期）；②血小板及凝血因子进行性下降、微血管血栓表现明显；③消耗性低凝期但病因短期不能去除（在补充凝血因子下使用）；④除外原发病因素，顽固性休克不能纠正。\n禁忌证：①手术后或损伤面未经良好止血；②近期严重活动性出血；③蛇毒所致DIC；④严重凝血因子缺乏及纤溶亢进。\n监测：APTT延长为正常值1.5~2.0倍为剂量合适；过量用鱼精蛋白中和；低分子肝素无需严格监控。\n2.替代治疗（有明显血小板/凝血因子减少且有出血倾向）：FFP每次10~15ml/kg；纤维蛋白原升至1.0g/L并保持；血小板<20×10⁹/L或活动性出血且<50×10⁹/L紧急输注。\n3.其他：支持对症（抗休克、纠正缺氧酸中毒）；纤溶抑制药一般不用于（仅病因已去除且有明显纤溶亢进成为迟发出血主因时）；糖皮质激素不常规应用。' },
{ m: '29M', q: '易栓症的定义、遗传性易栓症的分类及FV Leiden突变要点？', a: '易栓症：存在抗凝蛋白、凝血因子、纤溶蛋白等遗传性或获得性缺陷，或存在获得性危险因素而具有高血栓栓塞倾向。\n遗传性易栓症分类：\n①天然抗凝蛋白缺陷：AT（抗凝血酶）、蛋白C、蛋白S缺陷（杂合子血栓危险比正常人高约10倍，AT缺陷最高；纯合子罕见，出生后即暴发性紫癜死亡）。\n②凝血因子缺陷：活化蛋白C抵抗（APC-R，FV Leiden最常见，占APC-R的90%，1994年报道，FV基因1691位G→A，蛋白506位精氨酸→谷氨酰胺；杂合子VTE危险升3~8倍，纯合子升50~80倍，是高加索人群最常见遗传性易栓症，检出率2%~6%，但在中国等亚洲人群检出率几乎为零）；凝血酶原G20210A（1996年荷兰Poort报道，携带者血栓危险升高约3倍）；异常纤维蛋白原血症。\n③纤溶蛋白缺陷：异常纤溶酶原血症、tPA缺乏、PAI-1增多。\n④代谢缺陷：高同型半胱氨酸血症等。\n获得性易栓因素：抗磷脂综合征（APS）、恶性肿瘤、MPN、PNH、肾病综合征等易栓疾病；制动、创伤手术、妊娠产褥、口服避孕药等易栓状态。' },
{ m: '29M', q: '抗磷脂综合征（APS）与获得性血栓危险因素（肿瘤/MPN/PNH/肾病综合征）的要点？', a: 'APS：抗磷脂抗体（狼疮抗凝物、抗心磷脂抗体、抗β2GP1）引起的一组综合征，SLE患者抗磷脂抗体阳性率约50%，也可独立存在；血栓发生率约30%~40%，静脉为主（占70%左右），抗磷脂抗体阳性者静脉血栓危险比正常人高约10倍。APS患者一旦血栓，停抗凝后复发率高，主张长期口服抗凝，动脉血栓加用抗血小板药。\n恶性肿瘤：静脉血栓发生率3%~18%；19%静脉血栓患者诊断时同时发现肿瘤，另有5%在血栓后1年内发现肿瘤；腺癌更易引发；机制为肿瘤释放组织凝血活酶样物质、机械阻塞静脉、活动减少、手术放化疗等。\nMPN：PV和ET初诊时血栓事件分别约34%~39%和10%~29%；动脉血栓多于静脉（70% vs 30%）；静脉血栓常发生于少见部位（腹腔内），可为首发表现；成人约半数布加综合征和1/3门静脉血栓合并MPN。\nPNH：29%~44%患者病程中至少合并1次血栓栓塞；VTE是PNH最常见死因；巴德-吉亚利综合征为PNH最常见血栓部位；机制涉及血小板活化、补体介导溶血、NO耗竭、纤溶受抑、炎症介质。\n肾病综合征：膜性肾病和微小病变最易并发高凝；血栓栓塞发生率6%~44%，静脉较动脉常见。' },
{ m: '29M', q: 'VTE的治疗分期与抗凝方案（华法林为什么要与肝素重叠）？', a: 'VTE治疗包括抗凝、溶栓、取栓、静脉滤器，以抗凝为主。抗凝分3期：\n初始抗凝（~7天，肠外肝素类）→长疗程抗凝（~3个月，口服维生素K拮抗剂为主）→延续抗凝（不定期，定期再评估）。\n所有急性VTE患者均建议初始+长疗程抗凝；除肿瘤为触发因素外，推荐口服抗凝药（最常用华法林）。\n华法林必须与UFH/LMWH重叠至少5日或INR≥2.0后再停肝素：因华法林起效慢，且给药后蛋白C、蛋白S的降低先于凝血因子的降低，造成给药初期一过性高凝状态，可出现血栓栓塞加重（PC/PS缺陷症患者尤其危险）。\n抗凝强度：一般INR 2.0~3.0；人工心脏瓣膜或再发VTE需2.5~3.5；预防治疗可1.4~1.9。\n应接受延续抗凝的情况：①1种以上易栓因素；②遗传性抗凝蛋白缺陷；③获得性易栓症持续存在（肿瘤、APS）；④少见部位血栓、复发性血栓、DVT持久残留、D-二聚体持久升高、并发PE相关慢性肺动脉高压。\n溶栓：大块PE伴血流动力学异常+低氧血症者可溶栓；急性DVT/PE均不主张常规溶栓、常规取栓、常规下腔静脉滤器（有抗凝禁忌时可临时滤器）。急性症状性DVT应穿弹力袜至少2年预防血栓后综合征。' },
{ m: '29M', q: '儿童血栓的特殊性（为什么儿童血栓少）、常见类型、检查与抗凝剂量？', a: '儿童期相对低凝：维生素K依赖因子（Ⅱ、Ⅶ、Ⅸ、Ⅹ）和接触因子（Ⅻ、Ⅺ、PK、HMWK）降低，抗凝因子（AT、PC、PS）在幼儿期为成人50%，但α2-巨球蛋白整个儿童期明显上升，纤溶能力下降（低纤溶）——综合呈相对低凝，且缺乏成人常见的糖尿病、高血压、口服避孕药等危险因素，故儿童VTE发病率显著低于成人（年化0.14~0.21/10000，住院儿童20~60/10000），最常见危险因素是中心静脉导管（CVC，导管相关VTE发生率约20%，症状性仅5%）；VTE患儿中遗传性易栓症患病率10%~59%。\n常见类型：DVT（下肢髂、股、腘静脉最常见）、PE（住院儿童约78/100000，Wells评分和D-二聚体帮助不大）、RVT（新生儿期最常见非导管相关VTE，占新生儿血栓事件20%，继发于NS和肾移植）、PVT（新生儿多与脐静脉置管和脓毒症有关）、颅内静脉窦血栓（脱水是所有年龄共同危险因素）、CVC相关VTE。\n检查：静脉加压超声为四肢DVT初始检查（确诊依据静脉不可压缩），CT肺血管造影是儿童PE首选影像学方法；LAC测定应在抗凝前进行。\n抗凝剂量：UFH首剂负荷75U/kg，维持<1岁28U/(kg·h)、>1岁20U/(kg·h)，APTT目标正常1.5~2倍；LMWH治疗量<2月龄1.5mg/(kg·次)、2月龄~18岁1.0mg/(kg·次)，每12小时一次，出血仅4%；OAS维持INR 2.0~3.0（婴幼儿需较高剂量0.32mg/(kg·d)，青少年可低至0.09mg/(kg·d)）；溶栓首选tPA，溶栓>24小时应监测或经验性输FFP补充纤溶酶原。' },
{ m: '29N', q: '成分输血的四大原理及常用红细胞制剂的种类与特点？', a: '四大原理：\n①替补机制——缺什么补什么（如地贫只输红细胞、血友病A只输Ⅷ因子）。\n②非替补机制——免疫调节等，如IVIg治疗ITP、川崎病（并非体内缺免疫球蛋白）。\n③去除机制——治疗性血细胞单采（高细胞性白血病去除白细胞）、血浆置换（TTP、中毒）。\n④免疫（抑制）机制——输血后受血者细胞/体液免疫改变（肿瘤复发转移、术后感染增加）。\n红细胞制剂：\n①悬浮红细胞：国内最广泛应用，全血去大部分血浆加保存液，(4±2)℃，保存21~35天；国内以200ml全血制备为1U。\n②浓缩红细胞：保存条件同悬浮红细胞，加生理盐水后保存不超过24小时。\n③去白细胞悬浮红细胞：降低免疫性输血反应和白细胞携带病毒传播风险，适用于造血干细胞/器官移植及反复输血者（地贫、再障、白血病）。\n④洗涤红细胞：生理盐水洗涤3次，去除90%以上血浆蛋白、白细胞、血小板，保留70%红细胞；因洗涤有损耗输注剂量比悬浮红细胞增加30%；开放制备24小时内输注。\n⑤辐照红细胞：25~30Gy辐照灭活淋巴细胞，用于免疫缺陷/抑制患者（如移植后）及输血相关GVHD患者，辐照后应尽快输注不宜保存。\n⑥冰冻红细胞：加甘油作冷冻剂，-80℃或液氮保存可达10年，用于稀有血型及自体储血。\n全血：国内200ml为1U，保存(4±2)℃ 21~35天；每公斤体重输全血6ml可提升血红蛋白10g/L。' },
{ m: '29N', q: '各疾病红细胞输血的指征与阈值要点（地贫、再障、白血病、AIHA、G6PD）？', a: '重型β-地贫（TDT）：规范性终身输血+祛铁是主要治疗，造血干细胞移植是唯一根治途径。推荐：Hb<90g/L启动输血计划；2~5周输血1次，每次0.5~1.0U/10kg；输血后Hb维持90~140g/L；足量输血使Hb维持90~105g/L；血清铁蛋白≥1000μg/L时开始祛铁。红细胞制剂选择ABO及Rh(D)相同，推荐去白红细胞，严重过敏者选洗涤红细胞，避免亲属血，拟移植者输辐照血。\nNTDT（中间型地贫）：无需终身输血，感染、手术等特定情况才输；HbE/β-地贫积分<4分轻度、4~7分中度（属NTDT）、>7分重度（属TDT）；维持Hb不低于70g/L。\n白血病/肿瘤：Hb<70g/L大部分患儿输红细胞合理；高白细胞白血病（防高黏滞综合征）可放宽至Hb<60g/L；AABB 2016阈值：病情平稳住院患者Hb 7~8g/dL。BCSH儿童指南：病情稳定无发绀患儿输血阈值Hb 70g/L。TRIPICU研究支持PICU稳定患儿限制性输血Hb 70g/L。\n再障：重型AA预防性血小板输注指征PLT<20×10⁹/L；病情稳定无活动性出血PLT<10×10⁹/L。\nAIHA：能不输则不输、能少输则少输；慢性患者Hb>70g/L不必输，50~70g/L有不能耐受症状时可输，<50g/L建议输；急性溶血紧急输血条件：①Hb<40g/L或Hct<13%伴平静时缺氧；②Hb>40g/L但急性起病、发展快或心功能不全、心绞痛；③溶血危象；选ABO同型或洗涤红细胞，主侧反应最弱者优先；不强调输洗涤红细胞；输血前加用糖皮质激素。\nG6PD缺乏：无诱因不发病，无需处理，防治关键在于预防；贫血严重需输血（避免亲属供血），溶血多自限输血1~2次即可；Hb≤60g/L或有心脑功能损害症状者及时输浓缩红细胞；新生儿黄疸按新生儿高胆红素血症治疗并避免诱因。\n一般剂量：去白红细胞悬液10~15ml/(kg·次)，速度0.5~1.5ml/min；儿童每kg体重输注红细胞制剂4ml可提高Hb 10g/L。' },
{ m: '29N', q: '血小板输注的制剂、剂量、输注阈值与无效性输注（CCI）？', a: '制剂：①手工分离浓缩血小板：200ml全血制备1U（2×10¹⁰/袋，20~25ml），(22±2)℃水平振荡，普通袋24小时、专用袋5天；②单采（机采）血小板：1U≥2.5×10¹¹，相当于手工10~12U，容积150~250ml。\n剂量：体重<15kg按10~20ml/kg，>15kg按1U；1㎡体表面积输1U机采血小板可提升PLT 12.5~25×10⁹/L；治疗剂量输注时间30~60分钟，前15分钟严密观察。\n输注阈值：AABB 2014——预防性输注阈值PLT<10×10⁹/L，治疗性输注仅用于明显出血或预期创伤性操作时；颅脑手术PLT≥100×10⁹/L，侵入性操作或手术≥50×10⁹/L，骨髓穿刺活检和导管拔除≥20×10⁹/L。BCSH 2017：按修订WHO出血分级，1级预防性输注，≥2级治疗性输注。ITP不推荐预防性输注（AABB及BCSH均不推荐），危及生命出血时积极输注迅速止血。\n血小板无效性输注：连续两次输注（48小时内至少1次新鲜血小板）后未达合适CCI。CCI=（输注后PLT-输注前PLT）×10⁹/L×体表面积(m²)/输入血小板数(×10¹¹)。\n无效原因：脓毒症、肝脾大、DIC、GVHD、同种/自身抗体、大量失血、TTP、HUS、发热及药物（两性霉素、万古霉素、脂肪乳）。改善措施：HLA配型相合血小板、交叉配型相合血小板。\nITP预后：80%~90%病例12个月内PLT恢复正常，10%~20%发展为慢性；颅内出血发病率约0.1%~0.5%；约3%慢性ITP为自身免疫病前驱症状（SLE、类风湿、Evans）。' },
{ m: '29N', q: '血浆及血液制品输注要点：FFP、冷沉淀、凝血因子、PCC、IVIg、纤维蛋白原、白蛋白？', a: 'FFP：全血采集后6小时内分离，-30℃速冻、-20℃以下保存1年（1年后为普通冰冻血浆，可再存4年）；含全部凝血因子，蛋白60~80g/L，纤维蛋白原2~4g/L；不需交叉配血，同型输注即可。\n冷沉淀：FFP在(4±2)℃融化后分离冷不溶解物质；1U由200ml FFP制备，含Ⅷ因子80~100U、纤维蛋白原200~250mg、vWF、纤维连接蛋白、ⅩⅢ因子；-20℃保存1年，解冻后1~6℃ 24小时内输注；不需交叉配血。儿科多用于无Ⅷ因子制品时的血友病A及纤维蛋白原缺乏症，剂量2~3U/kg，生物半衰期约10小时。\n凝血因子Ⅷ：输注1U/kg可使体内Ⅷ:C提高2%，半衰期8~12小时，需每8~12小时输注1次。凝血因子Ⅸ：1U/kg使Ⅸ:C提高1%，半衰期18~24小时，每24小时输注1次，严重出血或手术时每12小时1次。\nPCC（凝血酶原复合物）：含Ⅱ、Ⅶ、Ⅸ、Ⅹ，每ml含Ⅸ 20~25IU，半衰期18~30小时，可24小时输注1次；用于血友病B及肝病多因子减少。\nIVIg：IgG≥95%，输后15分钟达峰，IgG生物半衰期21~28天；ITP常用400mg/(kg·d)×(3~5)天或0.8~1.0g/(kg·d)×1~2天；慎用于IgA缺乏、糖尿病、肾功能不全患者。\n纤维蛋白原：血浆<500~600mg/L时可出血；首剂100~200mg/kg（或60mg/kg），半衰期4~6天，不需配血型。\n白蛋白：半衰期约20天；不宜与氨基酸混合（蛋白沉淀），20%~25%为高渗不宜与红细胞混合输注；毛细血管渗漏综合征或肾病综合征患儿输注应谨慎。\nTTP（血栓性血小板减少性紫癜）：血浆置换为首选（原则早期、足量、优质、联合，40~80ml/(kg·d)），可使死亡率由90%降至10%左右；TTP患者避免输注血小板（仅致命性出血时输注），否则促进血栓形成。' },
{ m: '29N', q: '儿童输血不良反应的分类及各类型的要点？', a: '1.非溶血性发热反应（FNHTR）：儿科最常见输血反应，输血中或终止后4小时内发热或寒战，多与细胞因子或白细胞抗体反应有关；对症处理（抗组胺药、解热镇痛药），严重时停输血+氢化可的松。\n2.输血相关循环过载（TACO）：输血后1~24小时发生，频繁短促咳嗽、烦躁、背部心前区疼痛、呼吸困难、肺底湿啰音、咳粉红色痰；立即减缓或停止输注，快速利尿剂、速效洋地黄，严格控制心肺疾病及营养不良患儿输血量速度。\n3.过敏反应：小儿最常见之一，轻者皮肤瘙痒荨麻疹血管神经性水肿，重者支气管痉挛、喉头水肿、过敏性休克（停输血+肾上腺素+地塞米松，喉头水肿及时气管切开）；IgA缺乏者输去IgA洗涤红细胞。\n4.溶血反应：急性（AHTR）多因误输ABO血型不合血，输血中或24小时内发生，烦躁、发热、血红蛋白尿、黄疸，重者休克、急性肾衰、DIC；新生儿/全麻患儿表现可不典型（仅止血困难）；立即停原输血、换正确血液或洗涤红细胞，重者半量或全量换血+激素+碳酸氢钠+呋塞米。迟发性（DHTR）输血后24小时~28天，产生红细胞抗体。\n5.输血感染疾病：乙肝、丙肝、艾滋病、疟疾等，窗口期不能完全避免。\n6.输血相关移植物抗宿主病（TA-GVHD）：免疫活性淋巴细胞攻击宿主，见于免疫缺陷/化疗/移植患儿及输入直系亲属血者；坚持输非亲缘供者血制品。\n7.输血后紫癜（PTP）：输血后5~12天血小板减少，抗人血小板抗原抗体所致，一般40天内自行恢复。\n8.内环境紊乱：大量枸橼酸抗凝血→低钙惊厥（每输100ml血给10%葡萄糖酸钙1~2ml）；库存血→高血钾、酸中毒。\n9.体温过低：大量输冷血体温降3℃以上，新生儿尤应注意，加热至32℃输入。\n10.输血相关性急性肺损伤（TRALI）：输血中或后6小时内急性呼吸困难伴低氧血症，PaO2/FiO2≤300mmHg，胸片双侧浸润、无左心房高压；机制与输入白细胞/HLA抗体免疫反应有关；治疗吸氧+激素+严重时机械通气，死亡率高。' },
{ m: '29L', q: '血管性血友病（vWD）的定义、分型、实验室检查与治疗？', a: 'vWD是最常见的遗传性出血性疾病（发病率0.5%~1.5%，但有出血表现者仅约1%），由于vWF数量或质量异常导致，以皮肤、黏膜反复出血为主要表现（牙龈出血、鼻出血最常见，女性月经过多），1926年von Willebrand首先在芬兰发现。\n发病机制：vWF由血管内皮细胞和巨核细胞合成，半衰期24小时，基因位于12号染色体短臂；功能：①与血管壁胶原结合；②与血小板GPIb和GPⅡb/Ⅲa结合介导黏附聚集；③与FⅧ非共价结合使其稳定。\n分型：1型最常见（占70%~75%），vWF部分缺乏，常染色体显性遗传，轻中度皮肤黏膜出血；2型为质的异常（占20%~30%），分2A（多聚化异常，最常见，占2型中10%~15%）、2B（与GPIb亲和力增高）、2M（与GPIb亲和力降低）、2N（与FⅧ结合下降，常染色体隐性，出血类似血友病）；3型为完全缺乏（占5%左右），常染色体隐性，出血重。\n实验室：BT、FⅧ:C、vWF:Ag、vWF多聚物、vWF:Rco、RIPA（瑞斯托霉素诱发血小板聚集）确定及分型；2N型与血友病A鉴别靠FⅧ/vWF结合试验。\n治疗：一般措施（禁用阿司匹林等影响血小板功能药物，1型及2型女性患者可用雌激素治鼻出血和月经过多）；DDAVP对1型效果好、部分2A有效（2B型可引起血小板减少，3型无效），剂量0.3~0.5μg/(kg·次)静滴，可使FⅧ:C增高3倍、vWF增高2倍；抗纤溶药（氨基己酸，血尿禁用）；替代治疗（FFP、冷沉淀、vWF-FⅧ浓缩剂），严重出血或大型手术首剂40~60U/kg，维持20~40U/kg每12~24小时1次。' },
{ m: '29L', q: '血友病A抑制物的ITI（免疫耐受诱导）和艾美赛珠单抗（Emicizumab）的要点？', a: '抑制物发生率：重型血友病A为20%~30%（5%~10%的中型/轻型也可产生），血友病B为5%~10%；高危因素：大片段缺失、无义突变或内含子1/22倒位等基因突变、抑制物阳性家族史、手术及严重出血时大剂量因子输注、颅内出血。\nITI：目前公认唯一清除抑制物的方法。血友病A抑制物ITI成功率57%~91%，血友病B仅25%且有过敏及不可逆肾损伤风险（应慎重）。\n良性因素：抑制物峰值<200BU/ml；ITI前滴度<10BU/ml；年龄<8岁；诊断至ITI间隔<5年；ITI中断不超过2周。\n适应证：抑制物持续>5BU/ml（至少重复1次验证）的重型血友病A；频繁出血或对旁路因子反应不佳者。\n剂量：高剂量200IU/(kg·d)，中剂量100IU/(kg·d)，低剂量25~50IU/kg隔日1次或每周3次；高低剂量诱导耐受成功率差异无统计学意义，但高剂量更快且出血减少。\n疗效评估——完全耐受：抑制物持续阴性（<0.6BU/ml）且FⅧ回收率>66%、半衰期>6小时；部分耐受：ITI 33个月抑制物阴性但回收率<66%或半衰期<6小时。\n终止时机：开始3个月滴度未降20%以上，或33个月仍未达完全/部分耐受。\nEmicizumab：人源化双特异性单克隆抗体，桥接FⅨa和FⅩ（模拟FⅧa辅因子功能），与FⅧ无结构同源性，不产生FⅧ抗体、不受抑制物影响；用于有/无抑制物的血友病A患儿预防，皮下注射、半衰期长。用法：负荷期第1~4周3mg/kg每周1次；维持3mg/kg每1~2周1次（或6mg/kg每4周1次）。' },
{ m: '29L', q: '罕见遗传性凝血因子缺陷（FⅡ、Ⅴ、Ⅴ+Ⅷ、Ⅶ、Ⅹ、Ⅺ、Ⅻ）及纤维蛋白原疾病的要点？', a: '共性：均常染色体隐性遗传，多为近亲婚配；轻中度黏膜软组织出血为主；PT和APTT均延长（FⅪ、Ⅻ缺乏APTT延长而PT正常；FⅦ缺乏仅PT延长）；治疗首选FFP，维生素K无效；出血程度常与因子水平相关。\nFⅡ（凝血酶原）缺乏：最罕见之一（约1/200万），半衰期72小时，FⅡ达正常40%~50%即可止血；手术术前2天输PCC 40U/(kg·d)。\nFⅤ缺乏（Owren病，1943年挪威）：约1/100万，FV半衰期12~15小时，达正常25%可止血；大手术FFP 20ml/kg后每12小时5~10ml/kg维持7~10天。\nFⅤ+Ⅷ联合缺乏（1954年首次报道）：LMAN1或MCFD2蛋白缺陷（影响胞内转运），父母多近亲；与血友病A合并FⅤ缺乏鉴别：联合缺乏症患者父母常有血缘、两因子同步减少。\nFⅦ缺乏：约1/50万，外源性途径因子，PT延长APTT正常；FⅦ半衰期4~6小时，每日输1次，达10%~20%可止血；颅内出血并不少见。\nFⅩ缺乏（Stuart-Prower因子）：约1/(50万~100万)，共同通路因子，脐带出血为早期表现，达正常10%~40%可止血。\nFⅪ缺乏（血友病C，PTA缺乏）：约1/10万~100万，犹太人后裔高发；PT正常APTT延长；FXI不依赖维生素K，半衰期40~48小时，输血浆7~20ml/kg可提高至25%~50%，目标60%~70%；抗纤溶药可用于轻症（不与替代治疗同时用）。\nFⅫ缺乏：罕见（约1/200万），血凝块脆弱可溶于5mol尿素，无出血倾向（反有血栓倾向）。\n纤维蛋白原缺乏（1920年首次报道）：常染色体隐性，脐带出血为早期表现（80%），颅内出血是主要死因；出血临界水平0.6g/L，止血水平>1g/L，半衰期96~144小时（4~6天），替代选富含纤维蛋白原血浆、冷沉淀或浓缩剂。\n异常纤维蛋白原血症（1958年）：常染色体显性，含量正常但功能异常；约半数无症状，25%出血，部分有血栓倾向；TT延长不被甲苯胺蓝纠正，纤维蛋白原活性/含量比值降低。' },
];
